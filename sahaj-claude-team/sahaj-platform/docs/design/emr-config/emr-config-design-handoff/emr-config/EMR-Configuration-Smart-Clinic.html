<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMR Configuration by Department — Smart Clinic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#0F1C2E;background:#E9EDF2;display:flex;flex-direction:column;font-size:14px}
button{font-family:inherit}
button:focus-visible,a:focus-visible{outline:3px solid #1D5FA866;outline-offset:2px}
.top{background:#0F1C2E;color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;flex:none}
.top .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.top .logo{width:30px;height:30px;border-radius:8px;background:#1D5FA8;display:flex;align-items:center;justify-content:center;font-weight:800}
.top .sub{color:#B8C4D3;font-size:13px}
.top .sp{flex:1}
.iconbtn{border:1px solid #2A3C55;background:#16263C;color:#fff;border-radius:8px;min-height:34px;padding:0 12px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.iconbtn:hover{background:#1E3550}
.wrap{flex:1;display:flex;min-height:0}
nav.side{width:276px;flex:none;background:#fff;border-right:1px solid #E3E8EE;overflow:auto;padding:12px 10px 20px;display:flex;flex-direction:column;gap:4px;transition:margin .18s ease}
body.collapsed nav.side{margin-left:-276px}
.search{display:flex;align-items:center;gap:8px;border:1px solid #D5DCE4;border-radius:10px;padding:0 10px;margin:2px 4px 8px;min-height:38px}
.search input{border:0;outline:0;font:inherit;flex:1;min-width:0;background:transparent}
.grp{font-size:11px;font-weight:700;color:#5B6B7F;text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 4px}
.item{display:flex;gap:10px;align-items:center;border:0;background:transparent;border-radius:9px;padding:8px 10px;text-align:left;cursor:pointer;color:#0F1C2E;width:100%}
.item:hover{background:#F2F5F8}
.item[aria-current="page"]{background:#EAF1FB;color:#1D5FA8}
.item .dot{width:10px;height:10px;border-radius:999px;flex:none}
.item b{display:block;font-size:13.5px;font-weight:600}
.item small{display:block;font-size:11.5px;color:#5B6B7F;margin-top:1px}
.item[aria-current="page"] small{color:#3E6EA8}
main.stage{flex:1;min-width:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid #E3E8EE;flex:none;flex-wrap:wrap}
.bar h1{margin:0;font-size:16px;font-weight:700}
.bar .meta{font-size:12px;color:#5B6B7F}
.seg{display:inline-flex;background:#EEF1F5;border-radius:9px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 11px;font-weight:600;font-size:12.5px;color:#3E4C5E;cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:#1D5FA8;box-shadow:0 1px 3px rgba(15,28,46,.15)}
.btn{border:1px solid #C9D2DC;background:#fff;border-radius:8px;min-height:34px;padding:0 12px;font-weight:600;font-size:12.5px;cursor:pointer;color:#0F1C2E;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#F7F9FB}
.views{flex:1;min-height:0;position:relative;background:#E9EDF2}
.views iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#F4F6F8;display:none}
.views iframe.on{display:block}
.home{position:absolute;inset:0;overflow:auto;padding:28px 32px 40px;display:none}
.home.on{display:block}
.home h2{margin:0 0 4px;font-size:22px}
.home p.lead{margin:0 0 22px;color:#3E4C5E;max-width:820px;line-height:1.5}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:26px}
.card{background:#fff;border:1px solid #E3E8EE;border-radius:12px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;color:#0F1C2E;min-height:96px}
.card:hover{border-color:#1D5FA8;box-shadow:0 4px 14px -6px rgba(29,95,168,.35)}
.card b{font-size:14px}.card small{color:#5B6B7F;font-size:12px;line-height:1.4}
.card .tag{align-self:flex-start;font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px}
.home h3{font-size:12px;font-weight:700;color:#5B6B7F;text-transform:uppercase;letter-spacing:.06em;margin:0 0 10px}
.loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#5B6B7F;font-size:13px}
@media (max-width:860px){nav.side{position:absolute;z-index:5;height:calc(100% - 50px);box-shadow:0 10px 30px rgba(15,28,46,.25)}}
</style>
</head>
<body>
<header class="top">
  <button class="iconbtn" id="menuBtn" aria-label="Show or hide the screen list" title="Show or hide the screen list">☰</button>
  <div class="brand"><span class="logo">+</span>Smart Clinic</div>
  <span class="sub">EMR configuration by department · interactive design</span>
  <span class="sp"></span>
  <button class="iconbtn" id="prevBtn" title="Previous screen">← Prev</button>
  <button class="iconbtn" id="nextBtn" title="Next screen">Next →</button>
</header>
<div class="wrap">
  <nav class="side" id="side" aria-label="Screens">

    <div id="navList"></div>

  <main class="stage">
    <div class="bar">
      <div style="display:flex;flex-direction:column;gap:2px;min-width:0;flex:1">

        <button aria-pressed="false" data-z="0.75">75%</button>
      </div>
      <button class="btn" id="resetBtn" title="Start this screen again with its example data">↺ Reset screen</button>
    </div>
    <div class="views" id="views">
      <section class="home on" id="home"></section>
    </div>
  </main>
</div>

span><\/span>\n          <\/button>\n          <button type=\"button\" style=\"display: flex; gap: 10px; align-items: center; text-align: left; border: 1px dashed #9AA8B8; background: #FFFFFF; border-radius: 10px; padding: 12px; min-height: 56px; cursor: pointer\">\n            <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3E4C5E\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2\"/><path d=\"M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2\"/><\/svg>\n            <span style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-weight: 600\">Copy an existing department<\/span><span style=\"font-size: 12px; color: #5B6B7F\">e.g. copy Dental for a second dental chair<\/span><\/span>\n          <\/button>\n        <\/div>\n        <span style=\"font-size: 12px; font-weight: 700; color: #5B6B7F; text-transform: uppercase; letter-spacing: 0.06em\">Specialty templates<\/span>\n        <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px\">\n          <sc-for list=\"{{templates}}\" as=\"t\" hint-placeholder-count=\"12\">\n            <button type=\"button\" style=\"{{t.style}}\">\n              <span style=\"{{t.badge}}\">{{t.init}}<\/span>\n              <span style=\"display: flex; flex-direction: column; gap: 2px; min-width: 0\">\n                <span style=\"font-size: 13px; font-weight: 600; color: #0F1C2E\">{{t.name}}<\/span>\n                <span style=\"font-size: 12px; color: #5B6B7F\">{{t.count}} specialty sections<\/span>\n              <\/span>\n            <\/button>\n          <\/sc-for>\n        <\/div>\n      <\/div>\n\n      <div style=\"width: 340px; flex: none; border-left: 1px solid #E3E8EE; background: #FAFBFC; padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n        <span style=\"font-size: 12px; font-weight: 700; color: #5B6B7F; text-transform: uppercase; letter-spacing: 0.06em\">Template preview<\/span>\n        <h3 style=\"margin: 0; font-size: 17px; font-weight: 700\">Physiotherapy<\/h3>\n        <p style=\"margin: 0; font-size: 13px; color: #3E4C5E; line-height: 1.5\">Built for session-based care: assessment on the first visit, then quick session notes against a package.<\/p>\n        <div style=\"display: flex; flex-direction: column; gap: 6px\">\n          <sc-for list=\"{{preview}}\" as=\"p\" hint-placeholder-count=\"10\">\n            <div style=\"display: flex; gap: 8px; align-items: center; font-size: 13px\">\n              <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#0B6E69\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5L20 7\"/><\/svg>\n              <span>{{p}}<\/span>\n            <\/div>\n          <\/sc-for>\n        <\/div>\n        <div style=\"font-size: 12px; color: #3E4C5E; background: #FFFFFF; border: 1px solid #E3E8EE; border-radius: 8px; padding: 10px 12px; line-height: 1.5\">Turned off by default: Prescription (Rx), Investigations and Systemic examination. You can switch them back on.<\/div>\n      <\/div>\n    <\/div>\n\n    <div style=\"display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-top: 1px solid #E3E8EE\">\n      <label style=\"display: flex; gap: 8px; align-items: center; font-size: 13px; color: #3E4C5E\"><input type=\"checkbox\" checked style=\"width: 18px; height: 18px\">Also create a matching print template<\/label>\n      <div style=\"display: flex; gap: 10px\">\n        <a href=\"Main.dc.html\" style=\"display: flex; align-items: center; border: 1px solid #C9D2DC; border-radius: 8px; padding: 0 16px; min-height: 44px; font-weight: 600; color: #0F1C2E; text-decoration: none\">Cancel<\/a>\n        <a href=\"Main.dc.html\" style=\"display: flex; align-items: center; border: 1px solid #0B6E69; background: #0B6E69; border-radius: 8px; padding: 0 18px; min-height: 44px; font-weight: 600; color: #FFFFFF; text-decoration: none\">Next: review sections<\/a>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1080,\"height\":780}}'>\nclass Component extends DCLogic {\n  renderVals() {\n    var T = [['General Medicine', 'GM', 2, '#1D5FA8'], ['Dental', 'DN', 7, '#0B6E69'], ['Obstetrics & Gynaecology', 'OG', 7, '#A3366B'], ['Paediatrics', 'PD', 6, '#B4471F'], ['Physiotherapy', 'PT', 10, '#6D3FC0'], ['Orthopaedics', 'OR', 5, '#3E4C5E'], ['Ophthalmology', 'OP', 5, '#3E4C5E'], ['ENT', 'EN', 5, '#3E4C5E'], ['Dermatology & Cosmetology', 'DR', 3, '#3E4C5E'], ['Diabetology', 'DB', 5, '#3E4C5E'], ['Cardiology', 'CA', 4, '#3E4C5E'], ['AYUSH (Ayurveda)', 'AY', 4, '#3E4C5E']];\n    return {\n      templates: T.map(function (t) {\n        var sel = t[1] === 'PT';\n        return { name: t[0], init: t[1], count: t[2],\n          style: 'display: flex; gap: 10px; align-items: center; text-align: left; border-radius: 10px; padding: 10px; min-height: 56px; cursor: pointer; border: ' + (sel ? '2px solid #0B6E69' : '1px solid #E3E8EE') + '; background: ' + (sel ? '#0B6E6914' : '#FFFFFF'),\n          badge: 'flex: none; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #FFFFFF; background: ' + t[3] };\n      }),\n      preview: ['Pain assessment (VAS / NPRS)', 'Posture & gait', 'Range of motion (goniometry)', 'Manual muscle testing (Oxford 0–5)', 'Special tests', 'Outcome scales (ODI, NDI, WOMAC)', 'Treatment goals', 'Treatment modalities (IFT, TENS, US)', 'Home exercise program', 'Session & package tracker']\n    };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n", "BodyMap": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Body map · local examination<\/title>\n<script src=\"./support.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0}\nbutton,select,input{font-family:inherit}\nbutton:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #1D5FA866;outline-offset:2px}\n<\/style>\n<\/helmet>\n<div style=\"font-family: Inter, system-ui, sans-serif; color: #0F1C2E; background: #FFFFFF; border: 1px solid #E3E8EE; border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box; width: 100%; font-size: 14px\">\n  <div style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap\">\n    <div style=\"display: flex; flex-direction: column; gap: 2px\">\n      <h3 style=\"margin: 0; font-size: 15px; font-weight: 700\">{{title}}<\/h3>\n      <span style=\"font-size: 12px; color: #5B6B7F\">Tap the body to drop a pin, drag a pin to move it, then record what you found and what happened.<\/span>\n    <\/div>\n    <div style=\"display: flex; gap: 10px; flex-wrap: wrap; align-items: center\">\n      <div role=\"tablist\" aria-label=\"Body\" style=\"display: flex; background: #EEF1F5; border-radius: 10px; padding: 4px; gap: 4px\">\n        <sc-for list=\"{{sexes}}\" as=\"s\" hint-placeholder-count=\"3\"><button type=\"button\" role=\"tab\" aria-selected=\"{{s.on}}\" onClick=\"{{s.pick}}\" style=\"{{s.style}}\">{{s.label}}<\/button><\/sc-for>\n      <\/div>\n      <div style=\"display: flex; gap: 6px; align-items: center\"><span style=\"font-size: 12px; font-weight: 600; color: #3E4C5E\">Skin<\/span>\n        <sc-for list=\"{{tones}}\" as=\"t\" hint-placeholder-count=\"3\"><button type=\"button\" aria-pressed=\"{{t.on}}\" aria-label=\"{{t.label}} skin tone\" title=\"{{t.label}}\" onClick=\"{{t.pick}}\" style=\"{{t.style}}\"><\/button><\/sc-for>\n      <\/div>\n    <\/div>  10px; flex-wrap: wrap\">\n            <div style=\"display: flex; flex-direction: column; gap: 3px\"><h2 style=\"margin: 0; font-size: 15px; font-weight: 700\">3 · Pre-chemo labs<\/h2><span style=\"font-size: 12px; color: #5B6B7F\">Drawn today 8:40 am · auto-filled from lab · within 72 hours<\/span><\/div>\n            <span style=\"{{labsBadgeStyle}}\">{{labsBadge}}<\/span>\n          <\/div>\n          <div style=\"display: flex; flex-direction: column; border: 1px solid #E3E8EE; border-radius: 10px; overflow: hidden\">\n            <div style=\"display: grid; grid-template-columns: minmax(150px, 1.3fr) 150px 96px 150px 110px 74px; gap: 8px; align-items: center; padding: 8px 12px; background: #F7F9FB; font-size: 11px; font-weight: 700; color: #5B6B7F; text-transform: uppercase; letter-spacing: 0.03em\"><span>Test<\/span><span>C1 · C2 · C3<\/span><span>Trend<\/span><span>Today<\/span><span>Needed<\/span><span><\/span><\/div>\n            <sc-for list=\"{{labs}}\" as=\"l\" hint-placeholder-count=\"7\">\n              <div style=\"display: grid; grid-template-columns: minmax(150px, 1.3fr) 150px 96px 150px 110px 74px; gap: 8px; align-items: center; padding: 7px 12px; border-top: 1px solid #EEF1F5\">\n                <span style=\"font-weight: 600\">{{l.label}} <span style=\"font-size: 11px; color: #5B6B7F; font-weight: 500\">{{l.unit}}<\/span><\/span>\n                <span class=\"num\" style=\"font-size: 12px; color: #5B6B7F\">{{l.hist}}<\/span>\n                <svg width=\"90\" height=\"26\" viewBox=\"0 0 90 26\" aria-hidden=\"true\"><line x1=\"0\" x2=\"90\" y1=\"{{l.limY}}\" y2=\"{{l.limY}}\" stroke=\"#F3C1BC\" stroke-dasharray=\"3 3\"><\/line><polyline points=\"{{l.pts}}\" fill=\"none\" stroke=\"{{l.stroke}}\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><\/polyline><\/svg>\n                <span style=\"display: flex; align-items: center; gap: 6px\">\n                  <button type=\"button\" onClick=\"{{l.dec}}\" aria-label=\"Lower {{l.label}}\" style=\"width: 28px; height: 28px; border: 1px solid #C9D2DC; background: #FFFFFF; border-radius: 6px; cursor: pointer\">−<\/button>\n                  <span class=\"num\" style=\"{{l.valStyle}}\">{{l.value}}<\/span>\n                  <button type=\"button\" onClick=\"{{l.inc}}\" aria-label=\"Raise {{l.label}}\" style=\"width: 28px; height: 28px; border: 1px solid #C9D2DC; background: #FFFFFF; border-radius: 6px; cursor: pointer\">+<\/button>\n                <\/span>\n                <span style=\"font-size: 12px; color: #5B6B7F\">{{l.limit}}<\/span>\n                <span style=\"{{l.okStyle}}\">{{l.ok}}<\/span>\n              <\/div>\n            <\/sc-for>\n          <\/div>\n        <\/section>\n\n        <section id=\"fit\" style=\"background: #FFFFFF; border: 1px solid #E3E8EE; border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap\"><h2 style=\"margin: 0; font-size: 15px; font-weight: 700\">4 · Performance status (ECOG)<\/h2><span style=\"{{ecogNoteStyle}}\">{{ecogNote}}<\/span><\/div>\n          <div style=\"display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px\">\n            <sc-for list=\"{{ecog}}\" as=\"e\" hint-placeholder-count=\"5\"><button type=\"button\" aria-pressed=\"{{e.on}}\" onClick=\"{{e.pick}}\" style=\"{{e.style}}\"><span style=\"font-size: 18px; font-weight: 700\">{{e.n}}<\/span><span style=\"font-size: 11px; line-height: 1.35\">{{e.text}}<\/span><\/button><\/sc-for>\n          <\/div>\n        <\/section>\n\n        <section id=\"decide\" style=\"background: #0F1C2E; color: #FFFFFF; border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px\">\n          <div style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap\">\n            <div style=\"display: flex; flex-direction: column; gap: 4px\">\n              <span style=\"font-size: 12px; font-weight: 700; color: #F9A8D4; text-transform: uppercase; letter-spacing: 0.05em\">5 · Today’s decision<\/span>\n              <span style=\"font-size: 20px; font-weight: 700\">Suggested: {{sugLabel}}<\/span>\n              <span style=\"font-size: 12px; color: #B8C4D3\">Worked out from side effects, examination, labs, ECOG and response. You make the final call.<\/span>\n            <\/div>\n            <span style=\"{{decBadgeStyle}}\">{{decBadge}}<\/span>\n          <\/div>\n          <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 16px\">\n            <sc-for list=\"{{reasons}}\" as=\"r\" hint-placeholder-count=\"6\"><span style=\"{{r.style}}\"><span style=\"{{r.iconStyle}}\">{{r.icon}}<\/span>{{r.text}}<\/span><\/sc-for>\n          <\/div>\n          <div style=\"display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px\">\n            <sc-for list=\"{{decisions}}\" as=\"d\" hint-placeholder-count=\"5\"><button type=\"button\" aria-pressed=\"{{d.on}}\" onClick=\"{{d.pick}}\" style=\"{{d.style}}\"><span style=\"font-size: 14px; font-weight: 700\">{{d.label}}<\/span><span style=\"font-size: 11px; opacity: 0.85\">{{d.sub}}<\/span><span style=\"{{d.tagStyle}}\">{{d.tag}}<\/span><\/button><\/sc-for>\n          <\/div>\n          <div style=\"{{devStyle}}\">\n            <span style=\"font-size: 13px; font-weight: 700; color: #FCD34D\">You chose differently from the suggestion. Pick a reason (saved with the note):<\/span>\n            <div style=\"display: flex; gap: 6px; flex-wrap: wrap\"><sc-for list=\"{{devReasons}}\" as=\"r\" hint-placeholder-count=\"5\"><button type=\"button\" aria-pressed=\"{{r.on}}\" onClick=\"{{r.pick}}\" style=\"{{r.style}}\">{{r.label}}<\/button><\/sc-for><\/div>\n          <\/div>\n          <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; border-top: 1px solid #2A3C55; padding-top: 12px\">\n            <span style=\"font-size: 13px; color: #D5DCE4\">{{aRecap}}<\/span>\n            <button type=\"button\" onClick=\"{{confirmDec}}\" style=\"{{confirmStyle}}\">{{confirmLabel}}<\/button>\n          <\/div>\n        <\/section>\n      <\/div>\n\n      <\!-- ===================== PART 2 · TREATMENT (order sheet) ===================== -->\n      <div style=\"{{tStyle}}\">\n        <section style=\"background: linear-gradient(135deg, #831843, #9D174D 60%, #BE185D); color: #FFFFFF; border-radius: 14px; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px\">\n          <div style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap\">\n            <div style=\"display: flex; flex-direction: column; gap: 4px\">\n              <span style=\"font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.85\">Chemotherapy order sheet<\/span>\n              <span style=\"font-size: 20px; font-weight: 700\">{{orderTitle}}<\/span>\n              <span style=\"font-size: 13px; opacity: 0.9\">{{orderSub}}<\/span>\n            <\/div>\n            <button type=\"button\" onClick=\"{{goA}}\" style=\"border: 1px solid rgba(255,255,255,0.5); background: transparent; color: #FFFFFF; border-radius: 8px; padding: 6px 12px; min-height: 36px; font-weight: 600; cursor: pointer\">← Back to assessment<\/button>\n          <\/div>\n          <ol aria-label=\"Order progress\" style=\"list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px\">\n            <sc-for list=\"{{stages}}\" as=\"s\" hint-placeholder-count=\"6\"><li style=\"{{s.style}}\"><span style=\"{{s.dotStyle}}\">{{s.dot}}<\/span><span>{{s.label}}<\/span><\/li><\/sc-for>\n          <\/ol>\n        <\/section>\n\n        <div style=\"{{noDecStyle}}\">\n          <span style=\"font-weight: 700; color: #8A4B08\">No decision yet.<\/span>\n lor: #5B6B7F\">Uses today&#39;s weight: <strong>{{weight}} kg<\/strong>. Change weight on the left and this updates.<\/span>\n        <\/div>\n        <div style=\"display: flex; flex-direction: column; gap: 6px\">\n          <sc-for list=\"{{meds}}\" as=\"m\" hint-placeholder-count=\"3\">\n            <button type=\"button\" aria-pressed=\"{{m.on}}\" onClick=\"{{m.pick}}\" style=\"{{m.style}}\"><span style=\"font-weight: 700\">{{m.name}}<\/span><span style=\"font-size: 12px; color: #3E4C5E\">{{m.sub}}<\/span><\/button>\n          <\/sc-for>\n        <\/div>\n        <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px\">\n          <div style=\"display: flex; flex-direction: column; gap: 2px; background: #FAFBFC; border-radius: 8px; padding: 10px\"><span style=\"font-size: 11px; color: #5B6B7F; font-weight: 600\">Dose rule<\/span><span style=\"font-weight: 700\">{{dose.rule}}<\/span><\/div>\n          <div style=\"display: flex; flex-direction: column; gap: 2px; background: #FAFBFC; border-radius: 8px; padding: 10px\"><span style=\"font-size: 11px; color: #5B6B7F; font-weight: 600\">Per dose<\/span><span style=\"font-weight: 700\">{{dose.mg}} mg<\/span><\/div>\n        <\/div>\n        <div style=\"display: flex; flex-direction: column; gap: 2px; background: #FBE6DC; border-radius: 10px; padding: 12px\">\n          <span style=\"font-size: 12px; font-weight: 600; color: #8C3617\">Give<\/span>\n          <span style=\"font-size: 26px; font-weight: 700; color: #8C3617\">{{dose.ml}} ml<\/span>\n          <span style=\"font-size: 12px; color: #8C3617\">{{dose.freq}}<\/span>\n        <\/div>\n        <button type=\"button\" onClick=\"{{addRx}}\" style=\"border: 1px solid #B4471F; background: #B4471F; color: #FFFFFF; border-radius: 8px; min-height: 44px; font-weight: 600; cursor: pointer\">Add to prescription<\/button>\n        <sc-if value=\"{{hasRx}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-d asons); x[k] = !on; self.setState({ reasons: x }); },\n        style: 'font-size: 13px; font-weight: 600; border-radius: 999px; padding: 8px 14px; min-height: 38px; cursor: pointer; border: 1px ' + (on ? 'solid ' + A : 'dashed #9AA8B8') + '; color: ' + (on ? '#8C3617' : '#3E4C5E') + '; background: ' + (on ? '#FBE6DC' : '#FFFFFF') };\n    });\n    var rx = st.rx.map(function (t, i) { return { text: t, remove: function () { self.setState({ rx: st.rx.filter(function (_, j) { return j !== i; }) }); } }; });\n    return {\n      reasons: reasons, growth: growth, wY: wY, milestones: milestones,\n      msNote: notYet.length ? 'Not yet: ' + notYet.map(function (m) { return m[0].toLowerCase(); }).join(', ') + '. Recheck at next visit.' : 'All milestones for this age achieved.',\n      msNoteStyle: 'font-size: 12px; font-weight: 600; margin-top: 4px; color: ' + (notYet.length ? '#8A4B08' : '#146C43'),\n      vax: vaxRows,\n      vaxNote: pending.length ? pending.length + ' still to give: ' + pending.join(', ') : 'All due vaccines given. Next: Hep A 2 at 18–19 months.',\n      vaxChip: 'border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 600; background: ' + (pending.length ? '#FDECEA' : '#E3F5EC') + '; color: ' + (pending.length ? '#B42318' : '#146C43'),\n      vaxChipText: pending.length ? pending.length + ' vaccine(s) pending' : 'Vaccines up to date',\n      markAllDue: function () { var gv = Object.assign({}, st.given); ['DTwP booster 1', 'IPV booster 1', 'Hib booster 1', 'Varicella 1'].forEach(function (n) { gv[n] = true; }); self.say('4 vaccines recorded · batch numbers from stock', { given: gv }); },\n      weight: st.wt.toFixed(1), meds: meds,\n      dose: { rule: M.perKg + ' mg/kg', mg: mg, ml: ml, freq: M.freq },\n      addRx: function () { var t = M.name.split(' syrup')[0] + ' ' + ml + ' ml · ' + M.freq.split(',')[0]; self.say('Added to prescription', { rx: st.rx.concat([t]) }); },\n      rx: rx, hasRx: rx.length > 0,\n      footer: givenToday.lengt <\/div>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center\">\n      <label style=\"display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: #5B6B7F; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em\">Clinic\n        <select style=\"font: inherit; font-size: 14px; text-transform: none; letter-spacing: 0; color: #0F1C2E; font-weight: 500; border: 1px solid #C9D2DC; border-radius: 8px; padding: 8px 10px; background: #FFFFFF; min-width: 200px\"><option>[YOUR CLINIC NAME]<\/option><\/select>\n      <\/label>\n      <span style=\"{{dirtyStyle}}\">{{dirtyText}}<\/span>\n      <a href=\"FormBuilder.dc.html\" style=\"display: flex; align-items: center; gap: 6px; border: 1px solid #0B6E69; color: #0B6E69; background: #FFFFFF; border-radius: 8px; padding: 0 14px; min-height: 44px; box-sizing: border-box; font-size: 14px; font-weight: 600; text-decoration: none\">+ Form builder<\/a>\n      <button type=\"button\" onClick=\"{{saveDraft}}\" style=\"border: 1px solid #C9D2DC; background: #FFFFFF; color: #0F1C2E; border-radius: 8px; padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 44px\">Save draft<\/button>\n      <button type=\"button\" onClick=\"{{publish}}\" style=\"{{publishStyle}}\">Publish changes<\/button>\n    <\/div>\n  <\/header>\n\n  <div style=\"display: flex; flex-wrap: wrap; gap: 20px; padding: 24px 32px; align-items: flex-start\">\n\n    <\!-- Column A: departments -->\n    <aside style=\"flex: 1 1 260px; max-width: 320px; min-width: 240px; background: #FFFFFF; border: 1px solid #E3E8EE; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px\">\n      <div style=\"display: flex; justify-content: space-between; align-items: center\">\n        <h2 style=\"margin: 0; font-size: 15px; font-weight: 700\">Departments<\/h2>\n        <span style=\"font-size: 12px; color: #5B6B7F\">{{deptCount}} available<\/span>\n      <\/div>\n      <label style=\"display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #5B6B7F\">\n        <span>Search department<\/span>\n        <input type=\"search\" value=\"{{query}}\" onChange=\"{{onSearch}}\" placeholder=\"e.g. Dental, Physiotherapy\" style=\"font: inherit; font-size: 14px; border: 1px solid #C9D2DC; border-radius: 8px; padding: 9px 10px; color: #0F1C2E\">\n      <\/label>\n      <div style=\"display: flex; flex-direction: column; gap: 6px\">\n        <sc-for list=\"{{depts}}\" as=\"d\" hint-placeholder-count=\"8\">\n          <button type=\"button\" onClick=\"{{d.pick}}\" style=\"{{d.rowStyle}}\">\n            <span style=\"{{d.badgeStyle}}\">{{d.init}}<\/span>\n            <span style=\"display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; text-align: left\">\n              <span style=\"font-size: 14px; font-weight: 600; color: #0F1C2E\">{{d.name}}<\/span>\n              <span style=\"font-size: 12px; color: #5B6B7F\">{{d.count}}<\/span>\n            <\/span>\n            <span style=\"{{d.statusStyle}}\">{{d.status}}<\/span>\n          <\/button>\n        <\/sc-for>\n        <sc-if value=\"{{noMatch}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size: 13px; color: #5B6B7F; padding: 8px 4px\">No department matches “{{query}}”. Add it from a template below.<\/span><\/sc-if>\n      <\/div>\n      <a href=\"AddDepartment.dc.html\" style=\"display: flex; justify-content: center; align-items: center; gap: 8px; border: 1px dashed #9AA8B8; border-radius: 10px; padding: 12px; min-height: 44px; box-sizing: border-box; font-weight: 600; text-decoration: none; color: #0B6E69\">\n        <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/><\/svg>\n        Add department from template\n      <\/a>\n    <\/aside>\n\n    <\!-- Column B: sections / preview -->\n    <main style=\"flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n      <section style=\"background: #FFFFFF; border: 1px solid #E3E8EE; border-radius: 12px; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px\">\n        <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: center\">\n          <div style=\"display: flex; gap: 12px; align-items: center\">\n            <span style=\"{{deptBadgeLg}}\">{{dept.init}}<\/span>\n            <div style=\"display: flex; flex-direction: column; gap: 2px\">\n              <h2 style=\"margin: 0; font-size: 18px; font-weight: 700\">{{dept.name}}<\/h2>\n              <span style=\"font-size: 13px; color: #5B6B7F\">{{enabledCount}} sections on · {{requiredCount}} required · version {{dept.ver}}<\/span>\n            <\/div>\n          <\/div>\n          <div style=\"display: flex; gap: 8px; align-items: center; flex-wrap: wrap\">\n          <button type=\"button\" onClick=\"{{resetDept}}\" style=\"border: 1px solid #C9D2DC; background: #FFFFFF; border-radius: 8px; padding: 8px 12px; min-height: 40px; font-size: 13px; font-weight: 600; color: #3E4C5E; cursor: pointer\">Reset to template<\/button>\n          <div role=\"tablist\" aria-label=\"View\" style=\"display: flex; background: #EEF1F5; border-radius: 10px; padding: 4px; gap: 4px\">\n            <sc-for list=\"{{tabs}}\" as=\"t\" hint-placeholder-count=\"2\">\n              <button type=\"button\" role=\"tab\" aria-selected=\"{{t.on}}\" onClick=\"{{t.pick}}\" style=\"{{t.style}}\">{{t.label}}<\/button>\n            <\/sc-for>\n          <\/div>\n          <\/div>\n        <\/div>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center\">\n          <span style=\"font-size: 12px; font-weight: 600; color: #5B6B7F; text-transform: uppercase; letter-spacing: 0.04em\">Visit type<\/span>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 6px\">\n            <sc-for list=\"{{visits}}\" as=\"v\" hint-placeholder-count=\"4\">\n              <button type=\"button\" aria-pressed=\"{{v.on}}\" onClick=\"{{v.pick}}\" style=\"{{v.style}}\">{{v.label}}<\/button>\n            <\/sc-for>\n          <\/div>\n          <span style=\"font-size: 12px; color: #5B6B7F\">{{visitCaption}}<\/span>\n        <\/div>\n      <\/section>\n\n      <sc-if value=\"{{isSections}}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display: flex; flex-direction: column; gap: 16px\">\n          <sc-for list=\"{{groups}}\" as=\"g\" hint-placeholder-count=\"3\">\n            <section style=\"background: #FFFFFF; border: 1px solid #E3E8EE; border-radius: 12px; overflow: hidden\">\n              <div style=\"display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid #E3E8EE; background: #FAFBFC\">\n                <div style=\"display: flex; gap: 12px; align-items: center\">\n                  <span style=\"{{g.numStyle}}\">{{g.num}}<\/span>\n                  <div style=\"display: flex; flex-direction: column; gap: 2px\">\n                  <h3 style=\"margin: 0; font-size: 15px; font-weight: 700\">{{g.title}}<\/h3>\n                  <span style=\"font-size: 12px; color: #5B6B7F\">{{g.sub}}<\/span>\n                  <\/div>\n                <\/div>\n                <span style=\"font-size: 12px; font-weight: 600; color: #3E4C5E\">{{g.count}}<\/span>\n              <\/div>\n              <div style=\"display: flex; flex-direction: column\">\n                <sc-for list=\"{{g.rows}}\" as=\"r\" hint-placeholder-count=\"5\">\n                  <div style=\"{{r.rowStyle}}\">\n                    <div style=\"display: flex; flex-direction: column; gap: 0\">\n                      <button type=\"button\" onClick=\"{{r.up}}\" aria-label=\"Move {{r.name}} up\" style=\"border: 0; background: transparent; color: #5B6B7F; cursor: pointer; width: 28px; height: 22px; padding: 0; display: flex; align-items: center; justify-content: center\">\n                        <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 15l6-6 6 6\"/><\/svg>\n                      <\/button>\n                      <button type=\"button\" onClick=\"{{r.down}}\" aria-label=\"Move {{r.name}} down\" style=\"border: 0; background: transparent; color: #5B6B7F; cursor: pointer; width: 28px; height: 22px; padding: 0; display: flex; align-items: center; justify-content: center\">\n                        <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"/><\/svg>\n                      <\/button>\n                    <\/div>\n                    <button type=\"button\" onClick=\"{{r.pick}}\" style=\"flex: 1; min-width: 0; border: 0; background: transparent; text-align: left; cursor: pointer; padding: 6px 0; display: flex; flex-direction: column; gap: 3px; min-height: 44px; justify-content: center\">\n                      <span style=\"{{r.nameStyle}}\">{{r.name}}<\/span>\n                      <span style=\"font-size: 12px; color: #5B6B7F\">{{r.desc}}<\/span>\n                    <\/button>\n                    <span style=\"{{r.tagStyle}}\">{{r.tag}}<\/span>\n                    <button type=\"button\" onClick=\"{{r.movePart}}\" title=\"{{r.moveTitle}}\" style=\"flex: none; border: 1px solid #C9D2DC; background: #FFFFFF; border-radius: 8px; padding: 6px 10px; min-height: 32px; font-size: 12px; font-weight: 600; color: #3E4C5E; cursor: pointer; white-space: nowrap\">{{r.moveLabel}}<\/button>\n                    <span style=\"font-size: 12px; color: #5B6B7F; white-space: nowrap\">{{r.fields}}<\/span>\n                    <button type=\"button\" aria-pressed=\"{{r.req}}\" onClick=\"{{r.toggleReq}}\" style=\"{{r.reqStyle}}\">{{r.reqLabel}}<\/button>\n                    <button type=\"button\" aria-pressed=\"{{r.on}}\" aria-label=\"Show {{r.name}} in EMR\" onClick=\"{{r.toggle}}\" style=\"{{r.trackStyle}}\"><span style=\"{{r.knobStyle}}\"><\/span><\/button>\n                  <\/div>\n                <\/sc-for>\n              <\/div>\n            <\/section>\n          <\/sc-for>\n        <\/div>\n      <\/sc-if>\n\n      <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; background: #FFFFFF; border: 1px dashed #0B6E69; border-radius: 12px; padding: 14px 18px\">\n        <div style=\"display: flex; flex-direction: column; gap: 2px\"><strong style=\"font-size: 14px\">Have your own chart or form?<\/strong><span style=\"font-size: 12px; color: #5B6B7F\">Build it in the Form builder: fields, scores, show-if rules and print layout. It appears here as a custom section.<\/span><\/div>\n        <a href=\"FormBuilder.dc.html\" style=\"display: flex; align-items: center; border-radius: 8px; padding: 0 16px; min-height: 44px; background: #0B6E69; color: #FFFFFF; font-weight: 700; text-decoration: none\">Open form builder<\/a>\n      <\/div>\n\n      <sc-if value=\"{{isPreview}}\" hint-placeholder-val=\"{{ false }}\">\n        <section style=\"background: #FFFFFF; border: 1px solid #E3E8EE; border-radius: 12px; overflow: hidden\">\n          <div style=\"display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; padding: 14px 20px; background: #0F1C2E; color: #FFFFFF\">\n            <div style=\"display: flex; flex-direction: column; gap: 2px\">\n              <span style=\"font-size: 12px; color: #B8C4D3\">Doctor screen preview · {{dept.name}} · {{visit}}<\/span>\n              <span style=\"font-size: 15px; font-weight: 600\">[PATIENT NAME] · 34 F · UHID [ID]<\/span>\n            <\/div>\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center\">\n              <sc-if value=\"{{hasScreen}}\" hint-placeholder-val=\"{{ true }}\">\n                <a href=\"{{screenHref}}\" style=\"background: #FFFFFF; color: #0F1C2E; border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: 600; text-decoration: none\">Open full doctor screen →<\/a>\n              <\/sc-if>\n              <span style=\"background: #1E3550; border-radius: 999px; padding: 4px 10px; font-size: 12px\">ABHA linked<\/span>\n              <span style=\"background: #1E3550; border-radius: 999px; padding: 4px 10px; font-size: 12px\">Allergy: [NONE RECORDED]<\/span>\n            <\/div>\n          <\/div>\n          <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; padding: 20px; background: #F7F9FA\">\n            <sc-for list=\"{{cards}}\" as=\"c\" hint-placeholder-count=\"6\">\n              <div style=\"{{c.style}}\">\n                <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 8px\">\n                  <button type=\"button\" onClick=\"{{c.pick}}\" style=\"border: 0; background: transparent; padding: 0; cursor: pointer; font-size: 14px; font-weight: 700; color: #0F1C2E; text-align: left; min-height: 32px\">{{c.name}}<span style=\"{{c.starStyle}}\"> *<\/span><\/button>\n                  <span style=\"font-size: 11px; color: #5B6B7F\">{{c.tag}}<\/span>\n                <\/div>\n                <sc-if value=\"{{c.isTeeth}}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display: flex; flex-direction: column; gap: 6px; padding: 8px 0\">\n                    <div style=\"display: flex; gap: 4px; flex-wrap: wrap; justify-content: center\">\n                      <sc-for list=\"{{teethUpper}}\" as=\"tt\" hint-placeholder-count=\"16\"><span style=\"{{tt.style}}\">{{tt.n}}<\/span><\/sc-for>\n                    <\/div>\n                    <div style=\"height: 1px; background: #C9D2DC; margin: 2px 24px\"><\/div>\n                    <div style=\"display: flex; gap: 4px; flex-wrap: wrap; justify-content: center\">\n                      <sc-for list=\"{{teethLower}}\" as=\"tt\" hint-placeholder-count=\"16\"><span style=\"{{tt.style}}\">{{tt.n}}<\/span><\/sc-for>\n                    <\/div>\n                    <div style=\"display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; font-size: 11px; color: #3E4C5E; padding-top: 4px\">\n                      <span style=\"display: flex; gap: 6px; align-items: center\"><span style=\"width: 10px; height: 10px; border-radius: 3px; background: #FDE7CF; border: 1px solid #B45309\"><\/span>Caries<\/span>\n                      <span style=\"display: flex; gap: 6px; align-items: center\"><span style=\"width: 10px; height: 10px; border-radius: 3px; background: #DCEBFB; border: 1px solid #1D5FA8\"><\/span>Filled<\/span>\n                      <span style=\"display: flex; gap: 6px; align-items: center\"><span style=\"width: 10px; height: 10px; border-radius: 3px; background: #D7EFEC; border: 1px solid #0B6E69\"><\/span>RCT<\/span>\n                      <span style=\"display: flex; gap: 6px; align-items: center\"><span style=\"width: 10px; height: 10px; border-radius: 3px; background: #FFFFFF; border: 1px dashed #5B6B7F\"><\/span>Missing<\/span>\n                    <\/div>\n                  <\/div>\n                <\/sc-if>\n                <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px\">\n                  <sc-for list=\"{{c.fields}}\" as=\"f\" hint-placeholder-count=\"3\">\n                    <div style=\"display: flex; flex-direction: column; gap: 4px\">\n                      <span style=\"font-size: 12px; font-weight: 600; color: #3E4C5E\">{{f.label}}<span style=\"{{f.starStyle}}\"> *<\/span><\/span>\n                      <span style=\"border: 1px solid #D5DCE4; border-radius: 6px; padding: 7px 9px; font-size: 12px; color: #5B6B7F; background: #FFFFFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{f.ph}}<\/span>\n                    <\/div>\n                  <\/sc-for>\n                <\/div>\n              <\/div>\n            <\/sc-for>\n          <\/div>\n        <\/section>\n      <\/sc-if>\n    <\/main>\n\n    <\!-- Column C: section settings -->\n    <aside style=\"flex: 1 1 320px; max-width: 380px; min-width: 280px; background: #FFFFFF; border: 1px solid #E3E8EE; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 18px\">\n      <div style=\"display: flex; flex-direction: column; gap: 6px\">\n        <span style=\"font-size: 11px; font-weight: 700; color: #5B6B7F; text-transform: uppercase; letter-spacing: 0.06em\">Section settings<\/span>\n        <h2 style=\"margin: 0; font-size: 18px; font-weight: 700\">{{sec.name}}<\/h2>\n        <div style=\"display: flex; gap: 6px; flex-wrap: wrap\"><span style=\"{{sec.groupStyle}}\">{{sec.groupLabel}}<\/span><span style=\"font-size: 12px; color: #5B6B7F; padding: 3px 0\">in {{dept.name}}<\/span><\/div>\n        <p style=\"margin: 0; font-size: 13px; color: #3E4C5E; line-height: 1.5\">{{sec.desc}}<\/p>\n      <\/div>\n\n      <div style=\"display: flex; flex-direction: column; gap: 2px\">\n        <sc-for list=\"{{settings}}\" as=\"s\" hint-placeholder-count=\"5\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid #EEF1F5\">\n            <div style=\"display: flex; flex-direction: column; gap: 2px\">\n              <span style=\"font-size: 13px; font-weight: 600\">{{s.label}}<\/span>\n              <span style=\"font-size: 12px; color: #5B6B7F\">{{s.hint}}<\/span>\n            <\/div>\n            <button type=\"button\" aria-pressed=\"{{s.on}}\" aria-label=\"{{s.label}}\" onClick=\"{{s.toggle}}\" style=\"{{s.trackStyle}}\"><span style=\"{{s.knobStyle}}\"><\/span><\/button>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n\n      <div style=\"display: flex; flex-direction: column; gap: 8px\">\n        <div style=\"display: flex; justify-content: space-between; align-items: center\">\n          <h3 style=\"margin: 0; font-size: 14px; font-weight: 700\">Fields ({{fieldCount}})<\/h3>\n          <button type=\"button\" style=\"border: 1px solid #C9D2DC; background: #FFFFFF; border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 600; color: #0B6E69; cursor: pointer; min-height: 36px\">+ Add field<\/button>\n        <\/div>\n        <div style=\"display: flex; flex-direction: column; border: 1px solid #E3E8EE; border-radius: 10px; overflow: hidden\">\n          <sc-for list=\"{{fields}}\" as=\"f\" hint-placeholder-count=\"4\">\n            <div style=\"display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-bottom: 1px solid #EEF1F5; background: #FFFFFF\">\n              <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#9AA8B8\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\" style=\"margin-top: 3px; flex: none\"><path d=\"M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01\"/><\/svg>\n              <div style=\"display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0\">\n                <span style=\"font-size: 13px; font-weight: 600\">{{f.label}}<span style=\"{{f.starStyle}}\"> *<\/span><\/span>\n                <span style=\"font-size: 12px; color: #5B6B7F\">{{f.meta}}<\/span>\n              <\/div>\n              <span style=\"font-size: 11px; font-weight: 600; color: #3E4C5E; background: #EEF1F5; border-radius: 6px; padding: 3px 7px; white-space: nowrap\">{{f.type}}<\/span>\n            <\/div>\n          <\/sc-for>\n        <\/div>\n      <\/div>\n\n      <div style=\"display: flex; flex-direction: column; gap: 8px\">\n        <h3 style=\"margin: 0; font-size: 14px; font-weight: 700\">Who can fill this section<\/h3>\n        <div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n          <sc-for list=\"{{roles}}\" as=\"ro\" hint-placeholder-count=\"3\"> umber and degree, and the print language.', ['Header|Template|Registration no., degree|1', 'Language|Dropdown|English / Hindi / Marathi|0']),\n  pcpndt: sec('PCPNDT Form F', 'comp', 'Form F has to be filled for every obstetric ultrasound under the PCPNDT Act.', ['Form F|Template|Required for every obstetric USG|1', 'Referral slip|File|Upload|1', 'Declaration|Signature|Patient and doctor|1']),\n\n  chronic: sec('Chronic disease tracker', 'spec', 'Tracks BP, sugar and other readings across visits for long-term patients.', ['Condition|Dropdown|DM, HTN, Thyroid, Asthma|0', 'Trend|Chart|Readings over visits|0']),\n  adult_vax: sec('Adult vaccination', 'spec', 'Flu, pneumococcal, Td and other adult vaccines.'),\n  dental_chart: sec('Dental chart (odontogram)', 'spec', 'Tap a tooth to mark its condition. Uses FDI numbering by default.', ['Numbering|Dropdown|FDI (default) / Universal / Palmer|1', 'Dentition|Toggle|Adult 32 / Child 20 / Mixed|1', 'Tooth condition|Chart|Caries, missing, filled, RCT, crown|1', 'Surfaces|Multi-select|M, O, D, B, L|0']),\n  intraoral: sec('Intra-oral examination', 'spec', 'Soft tissue, oral hygiene and occlusion.', ['Soft tissue|Checklist|Gingiva, tongue, palate, mucosa|0', 'Oral hygiene|Dropdown|Good / Fair / Poor|0', 'Occlusion|Dropdown|Class I / II / III|0']),\n  extraoral: sec('Extra-oral examination', 'spec', 'Face, TMJ and lymph nodes.'),\n  perio: sec('Periodontal charting', 'spec', 'Pocket depth, bleeding and mobility for each tooth.', ['Probing depth|Table|6 sites per tooth|0', 'Bleeding on probing|Toggle|Per site|0', 'Mobility|Dropdown|Grade 0–3|0']),\n  tx_plan: sec('Treatment plan & estimate', 'spec', 'Planned procedures by tooth and phase, with a cost estimate the patient signs.', ['Procedure|Search list|By tooth|1', 'Phase|Dropdown|Phase 1 / 2 / 3|0', 'Estimate|Calculated|From rate card|1', 'Patient approval|Toggle|Signed estimate|0']),\n  dental_done: sec('Procedures done', 'spec', 'What was done today, on which tooth, and which sitting.', ['Procedure|Search list|RCT, extraction, scaling, filling|1', 'Tooth|Tooth picker|FDI|1', 'Sitting|Number|e.g. 2 of 3|0']),\n  dental_lab: sec('Lab work', 'spec', 'Crowns, bridges, dentures and aligners sent to the lab.', ['Item|Dropdown|Crown, bridge, denture, aligner|0', 'Lab|Dropdown|Vendor list|0', 'Due date|Date|Calendar|0']),\n  menstrual: sec('Menstrual history', 'spec', 'LMP, cycle pattern and flow. LMP is used to work out EDD.', ['LMP|Date|Used for EDD|1', 'Cycle|Pattern|Regular / irregular, days|0', 'Flow|Dropdown|Scanty / Normal / Heavy|0', 'Dysmenorrhoea|Toggle|Yes / No|0', 'Age at menarche|Number|years|0']),\n  obstetric: sec('Obstetric history', 'spec', 'Gravida, para, living and abortions, plus details of earlier pregnancies.', ['G P L A|Formula|Gravida, Para, Living, Abortion|1', 'Previous deliveries|Table|Year, mode, outcome, baby weight|0', 'Previous LSCS|Toggle|Marks pregnancy as high risk|0']),\n  anc: sec('ANC visit card', 'spec', 'Antenatal visit record with gestational age, EDD and risk flags.', ['Gestational age|Calculated|From LMP or USG|1', 'EDD|Calculated|Naegele’s rule|1', 'Fundal height|Number|cm|0', 'FHS|Number|bpm|0', 'Weight gain|Chart|Across visits|0', 'Td doses|Checklist|Td1, Td2, booster|0', 'Risk flags|Chips|Anaemia, PIH, GDM|0']),\n  gyn_exam: sec('P/A, P/S & P/V examination', 'spec', 'Abdominal, speculum and vaginal examination findings.', ['Per abdomen|Text|Free text|0', 'Per speculum|Text|Free text|0', 'Per vaginum|Text|Chaperone name recorded|0']),\n  usg: sec('USG findings', 'spec', 'Dating, NT, anomaly and growth scans.', ['Scan type|Dropdown|Dating, NT, anomaly, growth|0', 'Findings|Template|Free text|0', 'Report|File|Upload|0']),\n  infertility: sec('Infertility workup', 'spec', 'Hormone tests, follicle tracking and partner semen analysis.'),\n  contraception: sec('Contraception', 'spec', 'Method chosen, start date and follow-up.'),\n  growth: sec('Growth chart', 'spec', 'Weight, height and head size plotted on   function size(n) { var b = B[n]; return b.w + ' px wide' + (b.fill ? ', fills the width' : ''); }

  function renderNav() {
    var q = $('q').value.trim().toLowerCase(), h = '';
    h += '<button class="item" data-go="" ' + (cur === null ? 'aria-current="page"' : '') + '><span class="dot" style="background:#0F1C2E"></span><span><b>Overview</b><small>All screens at a glance</small></span></button>';
    GROUPS.forEach(function (g) {
      var items = g[1].filter(function (n) { return B[n] && (!q || (B[n].title + ' ' + n).toLowerCase().indexOf(q) >= 0); });
      if (!items.length) return;
      h += '<div class="grp">' + g[0] + '</div>';
      items.forEach(function (n) {
        h += '<button class="item" data-go="' + n + '" ' + (cur === n ? 'aria-current="page"' : '') + '><span class="dot" style="background:' + ACC[n] + '"></span><span><b>' + esc(B[n].title) + '</b><small>' + size(n) + '</small></span></button>';
      });
    });
    $('navList').innerHTML = h;
  }
  function renderHome() {
    var h = '<h2>EMR configuration by department</h2><p class="lead">The clinic sets up each department’s EMR in the configurator; doctors work in the department screens built from it; shared components are reused by every screen. Every screen here is interactive, with example data. Pick one to open it.</p>';
    GROUPS.forEach(function (g) {
      h += '<h3>' + g[0] + '</h3><div class="cards">';
      g[1].forEach(function (n) { if (!B[n]) return; h += '<button class="card" data-go="' + n + '"><span class="tag" style="background:' + ACC[n] + '1A;color:' + ACC[n] + '">' + esc(g[0].replace(/s$/, '')) + '</span><b>' + esc(B[n].title) + '</b><small>' + size(n) + '</small></button>'; });
      h += '</div>';
    });
    $('home').innerHTML = h;
  }
  function applyZoom(n) {
    var f = frames[n]; if (!f) return;
    var d; try { d = f.contentDocument; } catch (e) { return; }
    if (!d || !d.documentElement) return;
    var z = zoom === 'fit' ? Math.min(1, ($('views').clientWidth - 2) / B[n].w) : +zoom;
    d.documentElement.style.zoom = String(Math.round(z * 1000) / 1000);
  }
  function makeFrame(n) {
    var f = document.createElement('iframe');
    f.title = B[n].title;
    f.srcdoc = '<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}body{background:#F4F6F8}</style></head><body><div id="root"></div><script>' + runtime + '<\/script><script>dcBoot(parent.__DC_SRC, ' + JSON.stringify(n) + ', ' + JSON.stringify(B[n].props || {}) + ');<\/script></body></html>';
    f.addEventListener('load', function () { applyZoom(n); });
    $('views').appendChild(f);
    frames[n] = f;
    return f;
  }
  function show(n, push) {
    cur = n || null;
    Object.keys(frames).forEach(function (k) { frames[k].classList.toggle('on', k === cur); });
    $('home').classList.toggle('on', !cur);
    if (cur) { if (!frames[cur]) makeFrame(cur).classList.add('on'); else applyZoom(cur); }
    $('title').textContent = cur ? B[cur].title : 'Overview';
    $('meta').textContent = cur ? 'Designed at ' + size(cur) + ' · interactive with example data' : 'All screens of the EMR configuration design';
    $('zoomSeg').style.visibility = $('resetBtn').style.visibility = cur ? 'visible' : 'hidden';
    renderNav();
    if (push !== false) { var h = cur ? '#' + cur : '#'; if (location.hash !== h) history.pushState(null, '', h); }
  }
  document.addEventListener('click', function (e) {
    var g = e.target.closest && e.target.closest('[data-go]');
    if (g) { show(g.getAttribute('data-go')); if (innerWidth <= 860) document.body.classList.add('collapsed'); }
    var z = e.target.closest && e.target.closest('[data-z]');
    if (z) { zoom = z.getAttribute('data-z'); Array.prototype.forEach.call(document.querySelectorAll('[data-z]'), function (b) { b.setAttribute('aria-pressed', b === z); }); Object.keys(frames).forEach(applyZoom); }
  });
  $('q').addEventListener('input', renderNav);
  $('menuBtn').addEventListener('click', function () { document.body.classList.toggle('collapsed'); setTimeout(function () { Object.keys(frames).forEach(applyZoom); }, 220); });
  $('resetBtn').addEventListener('click', function () { if (!cur) return; frames[cur].remove(); delete frames[cur]; show(cur, false); });
  $('prevBtn').addEventListener('click', function () { var i = ORDER.indexOf(cur); show(ORDER[(i <= 0 ? ORDER.length : i) - 1]); });
  $('nextBtn').addEventListener('click', function () { var i = ORDER.indexOf(cur); show(ORDER[(i + 1) % ORDER.length]); });
  window.addEventListener('message', function (e) { if (e.data && e.data.dcNav && B[e.data.dcNav]) show(e.data.dcNav); });
  window.addEventListener('resize', function () { if (cur) applyZoom(cur); });
  window.addEventListener('popstate', function () { var n = location.hash.slice(1); show(B[n] ? n : null, false); });
  renderHome();
  var start = location.hash.slice(1);
  show(B[start] ? start : null, false);
})();
</script>
</body>
</html>
