<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EMR list section</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
button:focus-visible,input:focus-visible{outline:3px solid #1D5FA866;outline-offset:2px}
</style>
</helmet>
<div style="{{rootStyle}}">
  <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap">
    <div style="display: flex; gap: 10px; align-items: center">
      <h3 style="margin: 0; font-size: 15px; font-weight: 700; color: #0F1C2E">{{title}}<span style="{{starStyle}}"> *</span></h3>
      <span style="{{countStyle}}">{{countText}}</span>
    </div>
    <div style="display: flex; gap: 8px; align-items: center">
      <div role="tablist" aria-label="View" style="display: flex; background: #EEF1F5; border-radius: 8px; padding: 3px; gap: 3px">
        <sc-for list="{{views}}" as="v" hint-placeholder-count="2">
          <button type="button" role="tab" aria-selected="{{v.on}}" aria-label="{{v.label}} view" title="{{v.label}} view" onClick="{{v.pick}}" style="{{v.style}}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{v.icon}}"/></svg>{{v.label}}
          </button>
        </sc-for>
      </div>
      <button type="button" onClick="{{toggleAdd}}" aria-expanded="{{adding}}" style="{{addBtnStyle}}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="{{addIcon}}"/></svg>{{addBtnLabel}}
      </button>
    </div>
  </div>

  <sc-if value="{{adding}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; gap: 8px; border: 1px solid {{accent}}; background: #F7FAFE; border-radius: 10px; padding: 12px">
      <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: #3E4C5E">{{searchLabel}}
        <input value="{{query}}" onChange="{{onQuery}}" placeholder="{{placeholder}}" style="font: inherit; font-size: 14px; font-weight: 400; color: #0F1C2E; border: 1px solid #C9D2DC; border-radius: 8px; padding: 10px 12px; background: #FFFFFF">
      </label>
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <sc-for list="{{results}}" as="r" hint-placeholder-count="5">
          <button type="button" onClick="{{r.add}}" style="{{r.style}}">+ {{r.name}}<span style="{{r.codeStyle}}">{{r.code}}</span><span style="font-size: 11px; color: #5B6B7F; margin-left: 6px">{{r.meta}}</span></button>
        </sc-for>
        <sc-if value="{{canCreate}}" hint-placeholder-val="{{ false }}">
          <button type="button" onClick="{{createNew}}" style="border: 1px dashed {{accent}}; background: #FFFFFF; color: {{accent}}; border-radius: 999px; padding: 7px 12px; min-height: 36px; font-size: 13px; font-weight: 700; cursor: pointer">+ Add “{{query}}” as new {{noun}}</button>
        </sc-if>
      </div>
      <span style="font-size: 11px; color: #5B6B7F">{{addHint}}</span>
    </div>
  </sc-if>

  <sc-if value="{{isChips}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center; min-height: 36px">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="2">
        <span style="{{c.style}}">
          <span style="{{c.codeStyle}}">{{c.code}}</span>{{c.name}}
          <button type="button" onClick="{{c.cycle}}" title="Change {{attrLabel}}" style="{{c.attrStyle}}">{{c.a1}} ▾</button>
          <button type="button" onClick="{{c.remove}}" aria-label="Remove {{c.name}}" style="border: 0; background: transparent; color: inherit; width: 28px; height: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </span>
      </sc-for>
      <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><span style="{{emptyStyle}}">{{emptyText}}</span></sc-if>
    </div>
  </sc-if>

  <sc-if value="{{isGrid}}" hint-placeholder-val="{{ false }}">
    <div style="overflow-x: auto">
      <div style="min-width: 760px; border: 1px solid #E3E8EE; border-radius: 10px; overflow: hidden">
        <div style="display: grid; grid-template-columns: 34px 2fr 1.1fr 1.1fr 1.3fr 1.6fr 80px 44px; gap: 8px; padding: 8px 12px; background: #FAFBFC; font-size: 11px; font-weight: 700; color: #5B6B7F; text-transform: uppercase; letter-spacing: 0.04em; align-items: center">
          <span>#</span><span>{{nameLabel}}</span><span>{{attrLabel}}</span><span>{{attr2Label}}</span><span>Added on</span><span>Added by</span><span>Active</span><span></span>
        </div>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
          <div style="{{r.style}}">
            <span style="color: #5B6B7F">{{r.idx}}</span>
            <span style="{{r.nameStyle}}"><span style="{{r.codeStyle}}">{{r.code}}</span>{{r.name}}<span style="{{r.newStyle}}">New to list</span></span>
            <button type="button" onClick="{{r.cycle}}" style="{{r.cellBtn}}">{{r.a1}} ▾</button>
            <button type="button" onClick="{{r.cycle2}}" style="{{r.cellBtn}}">{{r.a2}} ▾</button>
            <span style="font-size: 12px; color: #3E4C5E">{{r.at}}</span>
            <span style="font-size: 12px; color: #3E4C5E">{{r.by}}</span>
            <button type="button" onClick="{{r.toggle}}" aria-pressed="{{r.on}}" aria-label="{{r.toggleLabel}}" style="{{r.track}}"><span style="{{r.knob}}"></span></button>
            <button type="button" onClick="{{r.remove}}" aria-label="Delete {{r.name}}" style="border: 0; background: transparent; color: #B42318; width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
          </div>
        </sc-for>
        <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><div style="padding: 16px 12px; text-align: center; font-size: 13px; color: #5B6B7F; border-top: 1px solid #EEF1F5">{{emptyText}}</div></sc-if>
      </div>
    </div>
  </sc-if>

  <div style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center">
    <span style="font-size: 12px; color: #5B6B7F; display: flex; gap: 4px; align-items: center" title="Ranked by how often you used each one and how recently">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L3 14h9l-1 8 10-12h-9z"/></svg>Your most used:
    </span>
    <sc-for list="{{quick}}" as="q" hint-placeholder-count="6">
      <button type="button" onClick="{{q.add}}" style="border: 1px dashed #9AA8B8; background: #FFFFFF; border-radius: 999px; padding: 6px 12px; min-height: 34px; font-size: 13px; color: #3E4C5E; cursor: pointer">+ {{q.name}}<span style="font-size: 11px; color: #5B6B7F; margin-left: 5px">{{q.count}}</span></button>
    </sc-for>
  </div>

  <sc-if value="{{toast}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="display: flex; gap: 10px; align-items: center; align-self: flex-start; background: #0F1C2E; color: #FFFFFF; border-radius: 8px; padding: 8px 12px; font-size: 12px; font-weight: 600">
      {{toast}}
      <sc-if value="{{canUndo}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{undo}}" style="border: 0; background: transparent; color: #8FC1FF; font-weight: 700; cursor: pointer; min-height: 28px">Undo</button></sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
