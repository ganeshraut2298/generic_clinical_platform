openapi: 3.1.0
info:
  title: Sahaj Patient API
  version: 0.2.1
  description: >-
    Phase 1 contract, SAH-8. Patient reads (list, detail, family) are for OWNER, FRONT_DESK, NURSE, DOCTOR,
    VISITING_DOCTOR, BILLING and PHARMACIST; COUNSELLOR and any other role get 403. Writes are OWNER/FRONT_DESK (403
    otherwise). Errors are RFC 9457 application/problem+json.

    0.2.1 (13 Nov 2026, DEC-049 answer 2, closes DEC-013 item 14) corrects the read roles, no new fields. The patient
    reads said "any clinic role"; they now list the roles that may read patient details: the roles the code already
    allowed (OWNER, FRONT_DESK, NURSE, DOCTOR, VISITING_DOCTOR) plus BILLING (name on bills) and PHARMACIST (name on
    dispensing). COUNSELLOR may not read patient details (403). Reading a patient does not widen any field rule:
    dateOfBirth still follows its own allow-list (DateOfBirthAccess, ADR-024 D3: OWNER, DOCTOR, VISITING_DOCTOR,
    NURSE, FRONT_DESK), so BILLING and PHARMACIST receive age and ageDetail only; mobile is sent as before (this
    contract masks nothing in patient answers; audit values and logs never hold it in clear). GET /patients/{id}/consents
    and /record-access keep their own roles (unchanged).

    0.2.0 (13 Nov 2026, SAH-73, ADR-024) is additive. (1) Optional dateOfBirth (ISO date, no time) on create, update
    and the patient detail; age is required on create only when dateOfBirth is absent or null; on update an explicit
    null clears the date. (2) age in every answer is the effective completed years: worked out from dateOfBirth as of
    today in India (Asia/Kolkata) when present, else the stored whole number; the new ageDetail carries the unit and
    value the screen shows ("34", "34 yrs", "18 months", "10 weeks", "9 days"). (3) dateOfBirth is returned only to
    OWNER, DOCTOR, VISITING_DOCTOR, NURSE and FRONT_DESK; for any other role the property is absent (not null). List and
    family answers never carry it; search (q) never matches it; it never appears in a path or query parameter. (4)
    Filters kids (under 13, the mockup's "Children") and seniors (60 or over) and the duplicate check use the effective
    age. (5) Merge keeps the kept record's date, copies the merged record's date when the kept one has none, and
    reports datesOfBirthDiffered. (6) Audit: every set, change or clear writes PATIENT_DATE_OF_BIRTH_CHANGED with the
    field name and never the value; no patient audit value holds a date of birth, name or mobile number. A date of
    birth is never written to a log or a problem detail. 400 messages for dateOfBirth and age are listed on
    PatientCreate.
servers:
  - url: /api/v1/patient
security:
  - bearer: []
paths:
  /patients:
    get:
      tags: [SAH-8]
      description: >-
        OWNER, FRONT_DESK, NURSE, DOCTOR, VISITING_DOCTOR, BILLING, PHARMACIST (0.2.1, DEC-049); COUNSELLOR and any
        other role 403. Items never carry dateOfBirth (0.2.0). q matches name, mobile or UHID only, never a date of
        birth. Filter kids = effective age under 13, seniors = effective age 60 or over (dated patients by the date of
        birth as of today IST, undated by the stored age).
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: filter, in: query, schema: { type: string, enum: [all, new, due, missed, chronic, overdue, lapsed, kids, seniors], default: all } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PatientSummary' } }
                  total: { type: integer }
    post:
      tags: [SAH-8, SAH-73]
      description: >-
        OWNER, FRONT_DESK. Registers a patient or a family member (same mobile). SAH-73-1: dateOfBirth optional; age
        required only without a date. The duplicate check (same mobile, effective age within 2 years, similar name)
        compares ages, never dates. Audit: the create event, whose values hold dateOfBirthRecorded and never the date,
        name or mobile.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PatientCreate' } } }
      responses:
        '201': { description: Registered, content: { application/json: { schema: { $ref: '#/components/schemas/Patient' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation, with fieldErrors (messages on PatientCreate).' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /patients/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [SAH-8, SAH-73]
      description: >-
        OWNER, FRONT_DESK, NURSE, DOCTOR, VISITING_DOCTOR, BILLING, PHARMACIST (0.2.1, DEC-049); COUNSELLOR and any
        other role 403. dateOfBirth is present (a date, or null when not recorded) only for OWNER, DOCTOR,
        VISITING_DOCTOR, NURSE and FRONT_DESK (DateOfBirthAccess, unchanged by 0.2.1); for BILLING and PHARMACIST the
        property is absent and only age and ageDetail are sent (SAH-73-3, ADR-024 D3).
      responses:
        '200': { description: Patient, content: { application/json: { schema: { $ref: '#/components/schemas/Patient' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [SAH-8, SAH-73]
      description: >-
        OWNER, FRONT_DESK. SAH-73-2 ("Edit details" sheet sends only dateOfBirth and, when the date is cleared, age).
        dateOfBirth absent = unchanged, a date = set or correct, explicit null = clear; on clear the stored age is the age
        sent, else the completed years worked out from the old date as of today, so the record never lacks an age. An
        age sent while the record keeps a date must equal its completed years (400 on age otherwise). Every set, change
        or clear writes one audit event PATIENT_DATE_OF_BIRTH_CHANGED (who, when, patient id, field dateOfBirth, change
        SET, CHANGED or CLEARED; never the value). Last write wins (no version in this contract).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PatientUpdate' } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Patient' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation, with fieldErrors (messages on PatientCreate).' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /patients/{id}/family:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [SAH-8]
      description: >-
        OWNER, FRONT_DESK, NURSE, DOCTOR, VISITING_DOCTOR, BILLING, PHARMACIST (0.2.1, DEC-049); COUNSELLOR and any
        other role 403. Rows never carry dateOfBirth; family rows show ageDetail ("18 months F · n visits").
      responses:
        '200': { description: Family, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PatientSummary' } } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /patients/merge:
    post:
      tags: [SAH-8, SAH-73]
      description: >-
        OWNER, FRONT_DESK. SAH-73-2 (BR73-11): the kept record's date of birth stays; when it has none and the merged
        record has one, that date is copied to the kept record (audited as PATIENT_DATE_OF_BIRTH_CHANGED, change SET);
        when both have different dates the kept date stays and datesOfBirthDiffered is true. When the kept record ends
        with a date, its age is worked out from that date, not taken from the merged record.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [keepId, mergeId], properties: { keepId: { type: string, format: uuid }, mergeId: { type: string, format: uuid } } } } }
      responses:
        '200': { description: Merged, content: { application/json: { schema: { $ref: '#/components/schemas/PatientMergeResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /patients/{id}/consents:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [SAH-17]
      responses:
        '200': { description: Latest consent state, content: { application/json: { schema: { $ref: '#/components/schemas/PatientConsentState' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [SAH-17]
      description: Appends a consent row (agreed or withdrawn). Rows are never edited.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConsentInput' } } }
      responses:
        '200': { description: Latest consent state, content: { application/json: { schema: { $ref: '#/components/schemas/PatientConsentState' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /record-access:
    get:
      tags: [SAH-17]
      description: OWNER only. Latest patient-file opens, newest first. Names are resolved at read time and are never stored in the log.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 5 } }
      responses:
        '200': { description: Rows, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RecordAccess' } } } } }
        '403': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status]
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
              fieldErrors:
                type: array
                items: { type: object, required: [field, message], properties: { field: { type: string }, message: { type: string } } }
  schemas:
    ConsentKind:
      type: string
      enum: [RECORDS, PROMOTIONAL]
    ConsentInput:
      type: object
      required: [kind, given]
      properties:
        kind: { $ref: '#/components/schemas/ConsentKind' }
        given: { type: boolean }
    ConsentEntry:
      type: object
      required: [kind, given, recordedAt, recordedByName]
      properties:
        kind: { $ref: '#/components/schemas/ConsentKind' }
        given: { type: boolean }
        recordedAt: { type: string, format: date-time }
        recordedByName: { type: string }
    PatientConsentState:
      type: object
      required: [records, promotional]
      description: Latest row per kind; null when never recorded.
      properties:
        records: { oneOf: [{ $ref: '#/components/schemas/ConsentEntry' }, { type: 'null' }] }
        promotional: { oneOf: [{ $ref: '#/components/schemas/ConsentEntry' }, { type: 'null' }] }
    RecordAccess:
      type: object
      required: [at, userName, patientId, patientName]
      properties:
        at: { type: string, format: date-time }
        userName: { type: string }
        patientId: { type: string, format: uuid }
        patientName: { type: string }
    AgeDetail:
      type: object
      description: >-
        SAH-73 (ADR-024 D1, D2). The age the screen shows, worked out on the server as of today in India (Asia/Kolkata).
        With a date of birth: completed years 2 or more → YEARS (years); else completed months 3 or more → MONTHS (3 to
        23); else days since birth 14 or more → WEEKS (days ÷ 7, floored, 2 to 13); else DAYS (0 to 13). Birthday of 29
        Feb in other years: 1 Mar. Without a date of birth: YEARS with the stored whole number, which does not change
        over time. Screen text: YEARS "34" in list and family rows and "34 yrs" in the record header (as today); MONTHS
        "18 months", WEEKS "10 weeks", DAYS "9 days" ("1 day") everywhere.
      required: [value, unit, fromDateOfBirth]
      properties:
        value: { type: integer, minimum: 0, maximum: 120 }
        unit: { type: string, enum: [YEARS, MONTHS, WEEKS, DAYS] }
        fromDateOfBirth: { type: boolean, description: 'True when worked out from a recorded date of birth.' }
    PatientSummary:
      type: object
      required: [id, uhid, name, age, ageDetail, sex, mobile]
      description: 'List and family row. Never carries dateOfBirth (SAH-73, BR73-12).'
      properties:
        id: { type: string, format: uuid }
        uhid: { type: string }
        name: { type: string }
        age: { type: integer, minimum: 0, maximum: 120, description: '0.2.0: effective completed years (from the date of birth when recorded, else the stored age).' }
        ageDetail: { $ref: '#/components/schemas/AgeDetail' }
        sex: { type: string, enum: [F, M, O] }
        mobile: { type: string }
        chronic: { type: [string, 'null'] }
        lastVisitAt: { type: [string, 'null'], format: date-time, description: Always null until SAH-9 exists. }
    PatientCreate:
      type: object
      required: [name, sex, mobile]
      description: >-
        SAH-8, SAH-73-1. age is required when dateOfBirth is absent or null (anyOf below). When both are sent, age must
        equal the completed years worked out from dateOfBirth as of today (IST); the form never sends both. 400
        validation fieldErrors (the detail never repeats the value sent): dateOfBirth "Enter a valid date of birth." (not
        a string in the form YYYY-MM-DD, or a date that does not exist such as 2026-02-31); dateOfBirth "Date of birth
        cannot be in the future." (later than today IST; today is accepted); dateOfBirth "Date of birth must be within
        the last 120 years." (completed years above 120); age "Age does not match the date of birth."; age "Enter an age
        between 0 and 120" (no date and no age, or out of range; SAH-8 text). The same messages apply to PatientUpdate.
      anyOf:
        - required: [age]
        - required: [dateOfBirth]
          properties:
            dateOfBirth: { type: string }
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        age: { type: integer, minimum: 0, maximum: 120 }
        dateOfBirth: { type: [string, 'null'], format: date, description: 'SAH-73. Optional calendar date, no time or zone (for example 2025-06-10). Personal data: never logged, audited as a value, or put in a URL.' }
        sex: { type: string, enum: [F, M, O] }
        mobile: { type: string, pattern: '^[6-9][0-9]{9}$' }
        area: { type: [string, 'null'] }
        language: { type: string, enum: [mr, hi, en], default: mr }
        allergy: { type: [string, 'null'] }
        chronic: { type: [string, 'null'] }
        abhaLinked: { type: boolean, default: false }
        consents:
          type: array
          description: Optional consent answers recorded with the new patient (SAH-17).
          items: { $ref: '#/components/schemas/ConsentInput' }
    PatientUpdate:
      type: object
      description: 'SAH-8, SAH-73-2. Only the properties sent change. Validation and messages as PatientCreate.'
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        age: { type: integer, minimum: 0, maximum: 120, description: 'While the record keeps a date of birth, must equal its completed years (a no-op). With dateOfBirth null (clear): the age to keep; when not sent, the completed years worked out from the old date as of today.' }
        dateOfBirth: { type: [string, 'null'], format: date, description: 'SAH-73. Absent = unchanged; a date = set or correct; explicit null = clear.' }
        sex: { type: string, enum: [F, M, O] }
        area: { type: [string, 'null'] }
        language: { type: string, enum: [mr, hi, en] }
        allergy: { type: [string, 'null'] }
        chronic: { type: [string, 'null'] }
        abhaLinked: { type: boolean }
    Patient:
      type: object
      required: [id, uhid, name, age, ageDetail, sex, mobile, language, abhaLinked, createdAt]
      properties:
        id: { type: string, format: uuid }
        uhid: { type: string }
        name: { type: string }
        age: { type: integer, minimum: 0, maximum: 120, description: '0.2.0: effective completed years (from the date of birth when recorded, else the stored age).' }
        ageDetail: { $ref: '#/components/schemas/AgeDetail' }
        dateOfBirth:
          type: [string, 'null']
          format: date
          description: >-
            SAH-73. Present only for OWNER, DOCTOR, VISITING_DOCTOR, NURSE and FRONT_DESK: the date, or null when not
            recorded ("13 Jun 2025" in the record header details and the edit form). Absent (not null) for every other
            role (ADR-024 D3).
        sex: { type: string, enum: [F, M, O] }
        mobile: { type: string }
        area: { type: [string, 'null'] }
        language: { type: string, enum: [mr, hi, en] }
        allergy: { type: [string, 'null'] }
        chronic: { type: [string, 'null'] }
        abhaLinked: { type: boolean }
        createdAt: { type: string, format: date-time }
        possibleDuplicateOfId: { type: [string, 'null'], format: uuid, description: Set when a likely duplicate was found at creation. }
    PatientMergeResult:
      description: 'SAH-8 merge answer (the kept record) plus the SAH-73 date of birth notice.'
      allOf:
        - { $ref: '#/components/schemas/Patient' }
        - type: object
          required: [datesOfBirthDiffered]
          properties:
            datesOfBirthDiffered: { type: boolean, description: 'True shows "The two records have different dates of birth. The date on the kept record was kept." (SO-73-8).' }
