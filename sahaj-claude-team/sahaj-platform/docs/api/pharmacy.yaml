        approves, whether it applied), the decisions (who, capacity HOD / DELEGATE / OWNER / ESCALATED, time,
        reason), escalated, needsAnotherApprover, canDecide and decideLockReason (SELF_APPROVAL,
        ALREADY_APPROVED_LEVEL_1, NOT_APPROVER, FINISHED). The client opens the document's own screen for the
        review step (subjectType and subjectId). Writes nothing.
      responses:
        '200': { description: Request, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalRequest' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
