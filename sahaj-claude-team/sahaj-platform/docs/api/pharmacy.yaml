    parameters:
      - $ref: '#/components/parameters/StoreId'
    get:
      tags: [SAH-79-8]
      operationId: pharmacyVendorReturnEligible
      summary: Items eligible to return to a vendor, with the vendor's return policy
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability purchase; Central Store only, else 409 doc-state)'
      x-sub-story: SAH-79-8
      x-work-package: WP-E
      description: >-
        For vendorId: policy ("return policy: up to <d> days before expiry, <c>% credit", SAH-78-8; the two extra
        credit levels damagedCreditPercent and expiredCreditPercent exist on the vendor since 0.2.1, DEC-075 and
        DEC-078 item 5, with the line rule on pharmacyCreateVendor; 0.3.1 wording) and rows from that vendor's batches at the Central Store: QUARANTINE (source chips
        QUARANTINE_INDENT_REJECTION, QUARANTINE_DAMAGED, QUARANTINE_EXPIRED, QUARANTINE_OTHER), AVAILABLE with
        expiry within the vendor's return days (NEAR_EXPIRY, daysToExpiry), and short supply of posted receipts of
        this vendor not yet on a debit note (GRN_SHORT, receipt number); availableQty already excludes units on
        other open debit notes; rate (batch purchase rate per issue unit; for GRN_SHORT the receipt line rate per
        issue unit), defaultCreditPercent (the vendor's). Opening-stock batches and batches with no vendor are
        never offered (OQ-79-11). Expired AVAILABLE stock is first moved to QUARANTINE (rule 17).
        0.3.3 (wording, the tech lead's decision of 19 Nov 08:50): defaultCreditPercent is the starting credit of
        the row as the server works it, and the client uses it as given (it does not work the level itself):
        damagedCreditPercent when the row's reason is damaged on receipt; expiredCreditPercent when the batch is
        expired (expiry date before today, IST); when both apply, the lower of the two; a level that is null is
        counted as returnCreditPercent before the comparison; in every other case returnCreditPercent. Null only
        when the vendor has no returnCreditPercent and no level applies (the user types the credit). The debit
        note line marks creditPercentChanged when the saved creditPercent differs from this starting credit.
        Blind count (rule 24, 0.3.2): availableQty is null for a blind caller on an audited product.
      parameters:
