      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/AuditId'
    post:
      tags: [SAH-79-17]
      operationId: pharmacySubmitVarianceForApproval
      summary: '"Approve & post adjustment" - posts at once or goes to the approver by rule'
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability reviewCount; Schedule X lines: rule 19)'
      x-sub-story: SAH-79-17
      x-work-package: WP-H
      description: >-
        WAITING_REVIEW only (409 doc-state). Every difference line has a reason (400). A line with stockMoved 409
        stock-moved naming the lines ("Stock moved since the count. Recount."). The person who submitted the count
        cannot approve it (403 self-approval). The STOCK_ADJUSTMENT rule decides (subject STOCK_AUDIT; amount = Σ
        |difference| x purchase rate, without GST; SCHEDULE_X_ITEM when a Schedule X line differs; the rule
        decides, no shipped ₹ 250 or ₹ 1,000, OQ-79-26a). The request's raiser is the person who submitted the
        count (so that person can never approve it). Level 0 posts now. When the caller is a current approver of
        level 1 (the HOD, current delegate, or an owner where the rule or BR-14 says so), this call also records
        the caller's level-1 approval (capacity HOD, DELEGATE or OWNER) in the same transaction; it then posts, or
        waits for level 2 ("Waiting for owner approval", for example above the owner's limit or for a Schedule X
        item). Otherwise status WAITING_APPROVAL and the approver decides with pharmacyDecideApproval. Posting: per difference ledger STOCK_AUDIT_ADJUSTMENT (+ or −)
        on the batch in AVAILABLE, reference the AUD number, reason, counter, approver, before and after; zero
        lines post nothing; a decrease above AVAILABLE refuses that line (409 insufficient-stock) and sends it to
