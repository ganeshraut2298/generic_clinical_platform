        '400': { $ref: '#/components/responses/Problem', description: 'validation; or bad-request (unknown listKey)' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict', description: reason-exists }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /reason-lists/{listKey}/reasons/{reasonKey}/switch-off:
