  /approvals/{requestId}/decision:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [SAH-79-2, SAH-79-10]
      operationId: pharmacyDecideApproval
      summary: Approve or reject the current level (every transaction type; line quantities for an indent)
      x-required-role: PHARMACY_ACCESS
      x-sub-story: 'SAH-79-2 (engine); SAH-79-10 indentLines; SAH-79-14 damageRejectOutcome; used by 79-5, 79-6, 79-7, 79-8, 79-13, 79-15, 79-17'
      x-work-package: WP-D (later packages register their handlers, ADR-029 P6)
      description: >-
        One transaction, request row locked first (ADR-029 P5). Order: clientKey replay; not a current approver
        and not the raiser 404; the raiser 403 self-approval "You cannot approve your own request." (also a
        database check, BR-13); the level-1 approver deciding level 2 403 self-approval "Another person must
        approve the second level." (OQ-79-28); status not PENDING, or level or requestVersion not current 409
        already-decided with current (BR-15); body rules 400 validation: decision REJECTED needs reasonKey from
        list approval-reject ("Choose a reason"); indentLines only for INDENT, damageRejectOutcome only for a
        WRITE_OFF of a damage report (else 400). INDENT (story 79-10): indentLines lists every line with
        approvedQty (whole, 0 to 999999; increase allowed, shown "+n by HOD"); a reduced, increased-to-0 or
        rejected line needs remarkReasonKey (approval-reject list). 0.3.5 (tech lead decision of 19 Nov 13:55,
        item 2; replaces the 0.2.0 text "all lines 0 is a rejection"): decision APPROVED with every approvedQty 0
        answers 400 validation, field indentLines "Reject the indent with a reason instead", nothing decided; the
        approver rejects the whole indent with decision REJECTED and reasonKey. At least one line above 0 is an
        approval (the 0 lines need their remark). The client sends level and requestVersion from the
        document's ApprovalSummary (levelNo and requestVersion, 0.3.5), with no extra read. Effects: level 1 approved and a level 2 applies: current level 2 (the level-2 approver sees
        it); final approval: the document proceeds through its handler in the same transaction (indent
        "Approved · with Central Store"; PO "Approved"; receipt APPROVED, ready to post; debit note units held;
        transfer "Approved"; stock adjustment, audit variance and write-off are posted now, with the approver on
        the ledger lines; insufficient stock then answers 409 insufficient-stock and nothing is decided);
        rejection: the document returns to its raiser as Rejected (receipt and audit: back to Draft or counting)
        with the reason; no stock moves except the damage-report outcome (RELEASE_TO_AVAILABLE moves Quarantine
        back to Available unless the batch has expired, 409 batch-expired; KEEP_IN_QUARANTINE leaves it).
        Capacity is saved as HOD, DELEGATE, OWNER or ESCALATED. Audit PHARMACY_APPROVAL_DECIDED (request id,
        level, decision, capacity, reason key). Answers the request.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecisionInput' }
            examples:
              approveIndent: { value: { clientKey: 00000000-0000-4000-8000-00000000d002, level: 1, requestVersion: 1, decision: APPROVED, reasonKey: null, note: null, indentLines: [ { indentLineId: 00000000-0000-4000-8000-0000000001a1, approvedQty: 24, remarkReasonKey: null, remarkNote: null } ], damageRejectOutcome: null } }
              reject: { value: { clientKey: 00000000-0000-4000-8000-00000000d003, level: 1, requestVersion: 1, decision: REJECTED, reasonKey: approval-reject.quantity-too-high, note: null, indentLines: null, damageRejectOutcome: null } }
      responses:
        '200': { description: Decided (or a replay), content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalRequest' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation, malformed-request, bad-request' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden', description: 'module-off, forbidden, self-approval' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 'already-decided (current), insufficient-stock, batch-expired, client-key-reused' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
