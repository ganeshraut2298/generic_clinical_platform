        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 'last-active-reason ("Keep at least one damage reason." or, 0.2.1, "This reason is fixed.")' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /reason-lists/{listKey}/reasons/{reasonKey}/switch-on:
    parameters:
      - $ref: '#/components/parameters/ListKey'
