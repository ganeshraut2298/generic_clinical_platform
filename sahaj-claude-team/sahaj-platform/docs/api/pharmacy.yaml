        '200': { description: Catalogue, content: { application/json: { schema: { $ref: '#/components/schemas/ReportCatalogue' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /reports/stock-ledger:
    get:
      tags: [SAH-79-18]
      operationId: pharmacyStockLedgerReport
      summary: '"Stock ledger · <product> · <stores> · <dates>" - one line per movement, oldest first'
      x-required-role: 'PHARMACY_ACCESS and the stock-ledger report (catalogue rules)'
      x-store-access: 'SCOPED (rule 15; report access per store)'
      x-sub-story: SAH-79-18
      x-work-package: WP-H
      description: >-
        productId required; storeId optional (all reachable stores when absent); from and to IST dates, to − from
        at most 366 days (400 range-too-long "Choose at most 12 months.", OQ-79-35). Lines: time, transaction
        (label of LedgerTransaction), ref (document number; the IP number for patient-wise consumption, never a
        name), store · state, batch, in, out, balance (after the line, per store, state and batch), user ("System"
        for SYSTEM), second signer, reverses (the line a correction points to). Both lines of a move between
        stores or states are shown. Read by product and date (partition pruning). Paged (size up to 200); never
        loads all lines. Page 0 audited PHARMACY_REPORT_VIEWED (report key, filter ids). Expired AVAILABLE stock of
        the stores in scope is first moved to QUARANTINE (rule 17). Blind count (rule 24, 0.3.2): when the product
        is on the open audit of a store in scope and the caller is blind at that store, that store's lines answer
        qtyIn, qtyOut and balance null (the export writes empty cells); lines of other stores are unchanged.
      parameters:
        - { name: productId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: storeId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { description: One page, content: { application/json: { schema: { $ref: '#/components/schemas/StockLedgerPage' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation, range-too-long, bad-request' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound', description: 'storeId not reachable; product not in the unit' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /reports/stock-ledger/export:
    get:
      tags: [SAH-79-18]
      operationId: pharmacyExportStockLedger
      summary: Stock ledger as CSV (UTF-8)
      x-required-role: 'PHARMACY_ACCESS and the stock-ledger report'
      x-store-access: 'SCOPED (rule 15)'
      x-sub-story: SAH-79-18
      x-work-package: WP-H
      description: >-
        Same filters and checks as pharmacyStockLedgerReport, without paging. Rows counted first: above 50,000
        409 export-too-large "Narrow the date range." and nothing is sent (OQ-79-35). text/csv; charset=utf-8 with
        a BOM; header row with the screen's column names; money and rates as plain numbers with two decimals;
        dates as 24 Oct 2026, times 11:05 AM IST. Every text cell starting with =, +, -, @, tab or carriage return
        is prefixed with a single quote (ADR-028 R5-7). Content-Disposition attachment;
        filename="sahaj-stock-ledger-<from>-<to>.csv". No patient name, mobile or ABHA number. Audit
        PHARMACY_REPORT_EXPORTED (report key, filter ids, row count).
      parameters:
        - { name: productId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: storeId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: CSV file, content: { text/csv: { schema: { type: string } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation, range-too-long, bad-request' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: export-too-large }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /reports/{reportKey}:
    parameters:
      - $ref: '#/components/parameters/ReportKey'
    get:
      tags: [SAH-79-18, SAH-79-19]
      operationId: pharmacyRunReport
      summary: Run one report (paged table with typed columns)
      x-required-role: 'PHARMACY_ACCESS and the report (catalogue rules); else 403 forbidden'
      x-store-access: 'SCOPED (rule 15; Purchase reports: the Central Store)'
      x-sub-story: 'SAH-79-18 (store-stock, batch-expiry, below-reorder, indent-register, transfer-register, ward-consumption, returns-write-offs); SAH-79-19 (po-vs-grn, purchase-register, debit-notes-pending)'
      x-work-package: WP-H
      description: >-
        Filters: storeId (rule 15), from and to (IST dates, at most 366 days apart, 400 range-too-long; required
        for the movement and purchase reports, ignored for store-stock, batch-expiry and below-reorder, which are
        "now"), productId, vendorId (purchase reports), status (po-vs-grn: PurchaseOrderStatus or OVERDUE).
        Columns per key (ReportColumn key, label and kind): store-stock: store, product, available, inTransit,
        pendingReturn, quarantine, reorderLevel, value; batch-expiry: store, product, batch, expiry, state, qty,
        mrp, purchaseRate, landed, margin, supplier, status; below-reorder: store, product, available,
        reorderLevel; indent-register: indentNo, requestingStore, issuingStore, priority, raisedBy, raisedAt,
        status, approvedQty, dispatchedQty, receivedQty, rejectedQty, shortQty, backOrderQty; transfer-register:
        the same for transfers (transferNo, fromStore, toStore, reason); ward-consumption: date, store, product,
        batch, qty, type (General or Patient), purpose, ipNumber (patient-wise only; never a name), user,
        chargeStatus; returns-write-offs: date, docNo, type (Return to CS, Damage report, Write-off, Shortage
        settlement, Disputed), store, product, batch, qty, valuePaise, reason, approver, status; po-vs-grn: poNo,
        vendor, product, orderedQty, receivedQty, shortQty, status, deliveryExpected; purchase-register: date,
        grnNo, vendor, vendorGstin, invoiceNo, invoiceDate, product, hsn, batch, qty, taxablePaise, gstRate,
        gstPaise, discountPaise, totalPaise, with totals per vendor and per GST % (layout an accountant's
        confirmation, OQ-79-13, G-14); debit-notes-pending: dnNo, vendor, amountPaise, step, ageDays, olderThan30.
        Money cells are paise integers; the client shows ₹ 1,25,000.50. Paged (size up to 200). Page 0 audited
        PHARMACY_REPORT_VIEWED. No row ever carries a patient name. Blind count (rule 24, 0.3.2): in store-stock,
        batch-expiry and below-reorder, a row of a product on the open audit of a store where the caller is blind
        answers null in available, inTransit, pendingReturn, quarantine, value and qty (an empty cell in the CSV);
        the row is still listed. The movement and purchase reports record movements and are unchanged.
      parameters:
        - { name: storeId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - { name: productId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: vendorId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { type: string, maxLength: 30 } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { description: One page, content: { application/json: { schema: { $ref: '#/components/schemas/ReportPage' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation, range-too-long, bad-request (unknown reportKey)' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /reports/{reportKey}/export:
    parameters:
      - $ref: '#/components/parameters/ReportKey'
    get:
      tags: [SAH-79-18, SAH-79-19]
      operationId: pharmacyExportReport
      summary: '"Download CSV" for one report'
      x-required-role: 'PHARMACY_ACCESS and the report'
      x-store-access: 'SCOPED (rule 15)'
      x-sub-story: 'SAH-79-18, SAH-79-19'
      x-work-package: WP-H
      description: 'Same filters and columns as pharmacyRunReport without paging; the CSV rules of pharmacyExportStockLedger (row cap 50,000 → 409 export-too-large, nothing partial; UTF-8 with BOM; formula prefixes neutralised; no patient name). filename="sahaj-<reportKey>-<date>.csv". "Print" is the browser print view of the JSON page (the browser can save a PDF, OQ-79-4). Audit PHARMACY_REPORT_EXPORTED.'
      parameters:
        - { name: storeId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - { name: productId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: vendorId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { type: string, maxLength: 30 } }
      responses:
        '200': { description: CSV file, content: { text/csv: { schema: { type: string } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation, range-too-long, bad-request' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: export-too-large }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  # ================================================================ SAH-79 paths end
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    StoreId: { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
    MappingId: { name: mappingId, in: path, required: true, schema: { type: string, format: uuid } }
    ProductId: { name: productId, in: path, required: true, schema: { type: string, format: uuid }, description: 'The unit product id (adopted or own), never a catalogue id.' }
    ImportId: { name: importId, in: path, required: true, schema: { type: string, format: uuid } }
    VendorId: { name: vendorId, in: path, required: true, schema: { type: string, format: uuid } }
    ListKey: { name: listKey, in: path, required: true, schema: { $ref: '#/components/schemas/ListKeyValue' } }
    RequestId: { name: requestId, in: path, required: true, schema: { type: string, format: uuid }, description: 'Approval request id (0.2.0).' }
    PoId: { name: poId, in: path, required: true, schema: { type: string, format: uuid } }
    GrnId: { name: grnId, in: path, required: true, schema: { type: string, format: uuid } }
    DnId: { name: dnId, in: path, required: true, schema: { type: string, format: uuid } }
    IndentId: { name: indentId, in: path, required: true, schema: { type: string, format: uuid } }
    DispatchId: { name: dispatchId, in: path, required: true, schema: { type: string, format: uuid } }
    ItemId: { name: itemId, in: path, required: true, schema: { type: string, format: uuid }, description: 'Return item id.' }
    TransferId: { name: transferId, in: path, required: true, schema: { type: string, format: uuid } }
    AuditId: { name: auditId, in: path, required: true, schema: { type: string, format: uuid } }
    ReportKey: { name: reportKey, in: path, required: true, schema: { type: string, enum: [store-stock, batch-expiry, below-reorder, indent-register, transfer-register, ward-consumption, returns-write-offs, po-vs-grn, purchase-register, debit-notes-pending, sales-margin, sales-returns, gst-sales-register, h1-register, schedule-x-register, activity-log] }, description: 'stock-ledger has its own paths. An unknown key answers 400 bad-request. 0.3.0 (SAH-80-21) adds the group Sales & compliance: sales-margin, sales-returns, gst-sales-register, h1-register, schedule-x-register, activity-log (columns, access and the patient-name rule in pharmacy-sales.yaml, section WP-N, and ADR-030 S11).' }
    ReasonKey: { name: reasonKey, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9.-]{0,63}$' } }
  responses:
    Problem:
      description: Error
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unauthorized:
      description: 'unauthorized: no valid session, or the membership was switched off or removed.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            unauthorized: { value: { type: 'https://sahaj.in/problems/unauthorized', title: Sign in again, status: 401, detail: Your session has ended. Sign in again. } }
    Forbidden:
      description: 'module-off (the clinic''s Pharmacy & Inventory module is off) or forbidden (the access level of the operation is not met). Nothing written.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            moduleOff: { value: { type: 'https://sahaj.in/problems/module-off', title: Module off, status: 403, detail: Pharmacy & Inventory is not switched on for your clinic. } }
            noAccess: { value: { type: 'https://sahaj.in/problems/forbidden', title: Not allowed, status: 403, detail: You do not have access to Pharmacy & Inventory. Ask your owner. } }
            notOwner: { value: { type: 'https://sahaj.in/problems/forbidden', title: Not allowed, status: 403, detail: Only the clinic owner can do this. } }
    StoreForbidden:
      description: 'module-off, forbidden, or store-permission-denied (mapped to the store but without the capability the operation needs; audited PHARMACY_STORE_ACCESS_DENIED with ids only). Answered after the 404 check of the store guard.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            storePermission: { value: { type: 'https://sahaj.in/problems/store-permission-denied', title: Not allowed in this store, status: 403, detail: You cannot do this in this store. } }
    NotFound:
      description: 'not-found: unknown id, another clinic''s record (row-level security), or, for store operations, a switched-off store or a store the caller is not mapped to. Never confirms that the record exists. Nothing written.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            notFound: { value: { type: 'https://sahaj.in/problems/not-found', title: Not found, status: 404, detail: This record was not found. } }
    Conflict:
      description: 'A 409 problem; the type is named on the operation. settings-changed and rules-changed carry current (the record as its GET returns it); possible-duplicate carries candidates.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            changed: { value: { type: 'https://sahaj.in/problems/settings-changed', title: Changed by someone else, status: 409, detail: Someone else saved this a moment ago. Check the current values and save again., current: {} } }
            nameInUse: { value: { type: 'https://sahaj.in/problems/store-name-in-use', title: Name already used, status: 409, detail: That store name is already used } }
            openImport: { summary: '0.1.3, general rule 14 (the title is not fixed by the contract; clients show detail)', value: { type: 'https://sahaj.in/problems/open-import', title: Opening stock file open, status: 409, detail: Finish or reject the opening stock file of this store first. } }
    IntegrationOff:
      description: 'integration-off (ADR-028 D5): the operation exists only in Integrated mode and the unit is Standalone. Nothing written. No 0.1.x operation answers it; it is defined here so that SAH-79 and SAH-80 operations reuse it unchanged (one shared server error for every Integrated-only operation, ADR-028 revision 3).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            off: { value: { type: 'https://sahaj.in/problems/integration-off', title: Not used in Standalone mode, status: 409, detail: This works only when OPD and IPD are connected. Change Integration mode in Unit settings. } }
    BadRequest:
      description: 'bad-request: a path value is not of its declared type (a UUID, an enum value or a whole number). Fixed sentence; the submitted value is never echoed; no fieldErrors.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            malformedId: { value: { type: 'https://sahaj.in/problems/bad-request', title: Bad Request, status: 400, detail: The request could not be understood. Check it and try again. } }
    PayloadTooLarge:
      description: 'payload-too-large: the body is over 64 KB (sahaj.request-body.max-bytes); 0.3.4: over 128 KB for the POST and PUT operations under /stores/{storeId}/purchase-orders and /stores/{storeId}/goods-receipts (rule 12, security I21), whose detail says "The request body must be 128 KB or smaller.". Nothing saved.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            signedIn: { value: { type: 'https://sahaj.in/problems/payload-too-large', title: Request too large, status: 413, detail: The request body must be 64 KB or smaller. } }
    DatabaseBusy:
      description: 'database-busy (DEC-054): the request was rolled back and nothing was saved; retry after Retry-After seconds (with the same clientKey where the operation has one).'
      headers:
        Retry-After:
          description: Seconds to wait before a retry.
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            busy: { value: { type: 'https://sahaj.in/problems/database-busy', title: Sahaj is busy, status: 503, detail: This is taking longer than usual and was stopped. Nothing was saved by this attempt. Wait a moment and try again., retryAfterSeconds: 5 } }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, description: 'https://sahaj.in/problems/<slug>; slugs in info.description' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        retryAfterSeconds: { type: integer }
        fieldErrors:
          type: array
          items: { type: object, required: [field, message], properties: { field: { type: string }, message: { type: string } } }
        current: { type: object, description: 'settings-changed and rules-changed only: the current record as its GET returns it. (0.2.0 changed answers it where the operation says so; 0.3.2: never to a blind caller about a product on the store''s open audit, rule 24.)' }
        candidates: { type: array, items: { $ref: '#/components/schemas/DuplicateCandidate' }, description: possible-duplicate only. }
        errorCount: { type: integer, minimum: 0, description: 'opening-stock-invalid only: the number of rows with at least one ERROR issue (0.1.2).' }
        rowIssues: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/RowIssue' }, description: 'opening-stock-invalid only: the first 100 ERROR issues, by row number (0.1.2: warnings are not listed; read them with GET .../lines?withIssues=true).' }
        available: { type: [integer, 'null'], minimum: 0, description: '0.2.0, insufficient-stock: the usable quantity now (issue units) of the first failing line. 0.3.2: null, as lines[].available, for a blind caller when the product is on the store''s open audit (rule 24).' }
        lines:
          type: array
          maxItems: 100
          description: '0.2.0: insufficient-stock, batch-mrp-mismatch, stock-moved: the failing lines (document line id or opening-stock row number) with available where it applies.'
          items:
            type: object
            properties:
              lineId: { type: [string, 'null'], format: uuid }
              rowNo: { type: [integer, 'null'], minimum: 1 }
              productId: { type: [string, 'null'], format: uuid }
              available: { type: [integer, 'null'], minimum: 0 }
        postedAt: { type: string, format: date-time, description: '0.2.0, already-posted only.' }
    TeamRole:
      type: string
      description: 'The clinic team role (platform.yaml Role, 0.2.0 adds STORE_STAFF, DEC-062 Q3).'
      enum: [OWNER, DOCTOR, VISITING_DOCTOR, NURSE, FRONT_DESK, BILLING, PHARMACIST, COUNSELLOR, STORE_STAFF]
    StoreType:
      type: string
      enum: [CENTRAL, PHARMACY, SUB_STORE, WARD]
      description: 'Labels Central Store, Pharmacy, Sub-store, Ward store; tree chips Central, Sale, Sub-store, "Ward · consumption".'
    StoreRole:
      type: string
      enum: [STORE_USER, CENTRAL_STORE_USER, APPROVER, DELEGATE, CASHIER]
      description: 'Labels Store user, Central Store user, Approver, Delegate approver, Cashier (DEC-062 Q3). APPROVER is the store''s HOD (at most one ACTIVE); DELEGATE has dates (at most one ACTIVE). 0.3.0 adds CASHIER (SAH-80-1, DEC-074 OQ-80-36): offered only for a member whose team role is BILLING or STORE_STAFF, at a store with saleAllowed true that is not the Central Store; any other case 400 validation field storeRole "This person cannot be a Cashier." A CASHIER mapping whose store later has saleAllowed false needs review (as SAH-78 BR-11) and gives no sale capability; nothing is deleted.'
    StoreAccess:
      type: object
      description: 'Derived by the server on every read (ADR-028 D4 capability table); never stored per person, never accepted from a client.'
      required: [raiseIndent, approve, receive, receiveScheduleX, consumeReturn, uploadOpeningStock]
      properties:
        raiseIndent: { type: boolean }
        approve: { type: boolean }
        receive: { type: boolean }
        receiveScheduleX: { type: boolean, description: 'receive and the member''s team role is PHARMACIST ("Yes · incl. Schedule X"). Never for STORE_STAFF or OWNER.' }
        consumeReturn: { type: boolean, description: '0.2.0: equals consume (kept for 0.1.x clients).' }
        uploadOpeningStock: { type: boolean }
        readStock: { type: boolean, description: '0.2.0 (ADR-029 P8): any ACTIVE mapping; OWNER.' }
        postOpeningStock: { type: boolean, description: '0.2.0: same as uploadOpeningStock (OQ-79-30).' }
        adjustStock: { type: boolean, description: '0.2.0: HOD, current delegate, PHARMACIST member, Central Store user, OWNER (OQ-79-27).' }
        purchase: { type: boolean, description: '0.2.0: Central Store only; Central Store user, OWNER.' }
        dispatchTransfer: { type: boolean, description: '0.2.0: HOD, current delegate, store user, PHARMACIST member; Central Store user at the Central Store; OWNER.' }
        acceptReturn: { type: boolean, description: '0.2.0: at the Central Store: Central Store user, OWNER; at a store that sent a transfer: dispatchTransfer.' }
        consume: { type: boolean, description: '0.2.0: the store''s Consumption entry is Yes; HOD, current delegate, store user, Central Store user, OWNER (OQ-79-22).' }
        returnDamage: { type: boolean, description: '0.2.0: non-central stores: HOD, current delegate, store user, PHARMACIST member, OWNER; Central Store: damage report only, Central Store user, OWNER (OQ-79-22).' }
        startCount: { type: boolean, description: '0.2.0: HOD, current delegate, PHARMACIST member, Central Store user, OWNER (OQ-79-26e).' }
        count: { type: boolean, description: '0.2.0: any ACTIVE mapping; OWNER.' }
        reviewCount: { type: boolean, description: '0.2.0: HOD, current delegate, OWNER.' }
        handleScheduleX: { type: boolean, description: '0.2.0: team role PHARMACIST and mapped here; never OWNER or STORE_STAFF (rule 19). 0.3.3: an operation guarded by "the Schedule X handling capability" checks receiveScheduleX (the server''s RECEIVE_SCHEDULE_X); for a mapped PHARMACIST the two flags are the same set. 0.3.5: which operation needs which flag is the table in rule 19 (receiveScheduleX for receiving, handleScheduleX for dispatch, accepting a return, settling a shortage, the vendor-return hand-over and the other movements).' }
        sell: { type: boolean, description: '0.3.0 (SAH-80, ADR-030 S2): saleAllowed store and a mapped PHARMACIST member, a CASHIER, or OWNER. Search, quote, bill, hold, customers, udhar receipts.' }
        sellScheduled: { type: boolean, description: '0.3.0: sell and team role PHARMACIST mapped here (lines of schedule H, H1, X; DEC-074 OQ-80-20). Never OWNER or a CASHIER.' }
        substitute: { type: boolean, description: '0.3.0: equals sellScheduled (pharmacist only, OQ-80-23).' }
        overrideBlock: { type: boolean, description: '0.3.0: equals sellScheduled (allergy and H1 overrides; never OWNER, OQ-80-37).' }
        cancelBill: { type: boolean, description: '0.3.0: OWNER (any day); a PHARMACIST member with sell (the IST day of the bill only, checked per bill); never a CASHIER (BR-12).' }
        salesReturn: { type: boolean, description: '0.3.0: sell (a CASHIER starts, a pharmacist or OWNER may finish).' }
        acceptSalesReturn: { type: boolean, description: '0.3.0: saleAllowed store and a PHARMACIST member mapped, the store''s APPROVER or current DELEGATE, or OWNER (80-18).' }
        dispense: { type: boolean, description: '0.3.0: saleAllowed store and a PHARMACIST member mapped (IPD issue, OPD queue completion of scheduled lines). The OWNER may read the queues but not dispense (80-13, 80-14).' }
        recordWardReturn: { type: boolean, description: '0.3.0: saleAllowed store and a PHARMACIST member or a STORE_USER mapped (80-15).' }
        acceptWardReturn: { type: boolean, description: '0.3.0: equals dispense (80-15).' }
        readRegisters: { type: boolean, description: '0.3.0: saleAllowed store and OWNER, a PHARMACIST member mapped, or the store''s APPROVER or current DELEGATE (80-9, 80-10).' }
        dayClose: { type: boolean, description: '0.3.0: sell; each person closes their own shift, and only the OWNER may also close for another person (80-22).' }
    PharmacyContext:
      type: object
      required: [unit, caller, capabilities, stores, workingStoreId, mustPickWorkingStore, fixedRules]
      properties:
        unit:
          type: object
          required: [name, code, integrationMode]
          properties:
            name: { type: string, description: 'Clinic name from the clinic profile ("Unit: <name>").' }
            code: { type: string, pattern: '^[A-Z0-9]{3}$' }
            integrationMode: { $ref: '#/components/schemas/IntegrationMode' }
        caller:
          type: object
          required: [membershipId, name, role, roleLabel, setupAccess]
          properties:
            membershipId: { type: string, format: uuid }
            name: { type: string }
            role: { $ref: '#/components/schemas/TeamRole' }
            roleLabel: { type: string, examples: [Pharmacist, Store staff] }
            setupAccess: { type: string, enum: [EDIT, VIEW, NONE], description: 'EDIT for OWNER; VIEW for SETUP_VIEW ("View only" pill); NONE hides the Inventory setup tab.' }
        capabilities:
          type: array
          items: { type: string, enum: [SETUP_VIEW, SETUP_EDIT, OPENING_STOCK_UPLOAD, OPENING_STOCK_APPROVE, INVENTORY, APPROVALS_INBOX, PURCHASE, STOCK_REPORTS, PURCHASE_REPORTS, CONSUMPTION_PATIENT, PHARMACY, POS, SALES_RETURN, REGISTERS, COMPLIANCE, COMMAND_CENTRE, SALES_REPORTS, DAY_CLOSE, PATIENT_LINK, ALLERGY_CHECK, OPD_QUEUE, IPD_QUEUE, IPD_CHARGES, DISCHARGE_CLEARANCE], description: '0.3.0 (SAH-80, ADR-030 S2 and S12) adds PHARMACY (the Pharmacy tab: OWNER, or sell or readRegisters at a store), POS (sell somewhere), SALES_RETURN, REGISTERS (readRegisters somewhere), COMPLIANCE (OWNER or a PHARMACIST member), COMMAND_CENTRE (OWNER, a PHARMACIST member, an APPROVER or DELEGATE of a sale store, a CASHIER), SALES_REPORTS (OWNER, PHARMACIST member, APPROVER or DELEGATE of a sale store), DAY_CLOSE; and, only when the unit is Integrated: PATIENT_LINK and ALLERGY_CHECK (patient port available), OPD_QUEUE (also listed while TP-2 is not connected: the tab shows "Not connected", DEC-074), IPD_QUEUE and IPD_CHARGES (IPD on and not read-only; shown "Not connected" while TP-4 or TP-5 is not connected), DISCHARGE_CLEARANCE (only when the TP-4 port reports discharges). 0.2.0 adds INVENTORY (the Inventory tab: OWNER or any ACTIVE mapping), APPROVALS_INBOX (OWNER, HOD or current delegate of a store), PURCHASE (purchase at the Central Store), STOCK_REPORTS, PURCHASE_REPORTS (catalogue rules), CONSUMPTION_PATIENT (Integrated, IPD on, IPD reader available, and a consume store with a linked ward; ADR-029 P14).' }
          description: 'What the screens may show. OPENING_STOCK_UPLOAD when uploadOpeningStock is true for at least one store (always for OWNER). Later phases add values (for example OPD and IPD links in Integrated mode); clients ignore unknown values.'
        stores: { type: array, items: { $ref: '#/components/schemas/MyStore' } }
        workingStoreId: { type: [string, 'null'], format: uuid }
        mustPickWorkingStore: { type: boolean }
        fixedRules:
          type: object
          required: [fefo, negativeStockBlocked]
          properties:
            fefo: { const: true }
            negativeStockBlocked: { const: true }
    MyStore:
      type: object
      required: [storeId, name, code, type, storeRole, effectiveStoreRole, access]
      properties:
        issuesFrom:
          type: [object, 'null']
          description: '0.3.5 (response-additive; WP-F, SAH-79-9): the store the indents of this store go to (the "To (issuing store)" of a new indent, shown before a draft exists): the ACTIVE Central Store of the unit. null for the Central Store itself (it does not raise indents) and when the unit has no ACTIVE Central Store.'
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        storeId: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        type: { $ref: '#/components/schemas/StoreType' }
        storeRole: { $ref: '#/components/schemas/StoreRole' }
        effectiveStoreRole: { $ref: '#/components/schemas/StoreRole', description: 'STORE_USER for a DELEGATE outside its dates or a mapping that needs review.' }
        access: { $ref: '#/components/schemas/StoreAccess' }
    WorkingStoreInput:
      type: object
      additionalProperties: false
      required: [storeId]
      properties:
        storeId: { type: string, format: uuid }
    SetupSummary:
      type: object
      required: [storeCount, mappedStaffCount, activeVendorCount]
      properties:
        storeCount: { type: integer, minimum: 0 }
        mappedStaffCount: { type: integer, minimum: 0 }
        activeVendorCount: { type: integer, minimum: 0 }
    IntegrationMode:
      type: string
      enum: [INTEGRATED, STANDALONE]
      description: 'Default INTEGRATED (OQ-78-14). Standalone hides OPD and IPD features of P&I (hidden, not greyed).'
    Gstin:
      type: string
      pattern: '^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$'
      description: 'Format only (OQ-78-23). Sent lower case is upper-cased before the check.'
    UnitSettings:
      type: object
      required: [unitName, unitCode, gstin, drugLicenceNo, drugLicenceValidTill, drugLicenceExpired, integrationMode, fefo, negativeStockBlocked, ipdAvailable, saved, version, updatedAt]
      properties:
        unitName: { type: string, readOnly: true }
        unitCode: { type: string, pattern: '^[A-Z0-9]{3}$', readOnly: true }
        gstin: { oneOf: [ { $ref: '#/components/schemas/Gstin' }, { type: 'null' } ] }
        drugLicenceNo: { type: [string, 'null'], maxLength: 40 }
        drugLicenceValidTill: { type: [string, 'null'], format: date }
        drugLicenceExpired: { type: boolean }
        integrationMode: { $ref: '#/components/schemas/IntegrationMode' }
        fefo: { const: true, description: 'On, locked (OQ-78-11).' }
        negativeStockBlocked: { const: true, description: 'On, locked (OQ-78-11).' }
        ipdAvailable: { type: boolean }
        saved: { type: boolean }
        version: { type: integer, minimum: 0 }
        updatedAt: { type: [string, 'null'], format: date-time }
        returnWindowDays: { type: [integer, 'null'], minimum: 1, maximum: 365, description: '0.3.0 (SAH-80-1, NEW, OQ-80-12): "Return window (days)"; null = not set (no default): sales returns answer "Return window is not set. Ask your owner."' }
        refundModes: { type: array, items: { $ref: '#/components/schemas/RefundModeSetting' }, description: '0.3.0 (NEW, OQ-80-12): "Refund modes allowed"; empty until the owner ticks them.' }
        scheduleXLicenceNo: { type: [string, 'null'], maxLength: 40, description: '0.3.0 (NEW, OQ-78-41, OQ-80-18d): "Schedule X licence number" (20F / 21F).' }
        scheduleXLicenceValidTill: { type: [string, 'null'], format: date, description: '0.3.0: "Schedule X licence valid till".' }
    UnitSettingsInput:
      type: object
      additionalProperties: false
      required: [version, gstin, drugLicenceNo, drugLicenceValidTill, integrationMode]
      properties:
        version: { type: integer, minimum: 0 }
        gstin: { type: [string, 'null'], maxLength: 15, description: 'Empty or null = not set; else Gstin.' }
        drugLicenceNo: { type: [string, 'null'], maxLength: 40 }
        drugLicenceValidTill: { type: [string, 'null'], format: date }
        integrationMode: { $ref: '#/components/schemas/IntegrationMode' }
        returnWindowDays: { type: [integer, 'null'], minimum: 1, maximum: 365, description: '0.3.0, optional (absent leaves it unchanged). "Enter 1 to 365 days".' }
        refundModes: { type: array, maxItems: 4, uniqueItems: true, items: { $ref: '#/components/schemas/RefundModeSetting' }, description: '0.3.0, optional (absent leaves it unchanged).' }
        scheduleXLicenceNo: { type: [string, 'null'], maxLength: 40, description: '0.3.0, optional. A number without a date, or a date without a number, is accepted.' }
        scheduleXLicenceValidTill: { type: [string, 'null'], format: date, description: '0.3.0, optional.' }
    RefundModeSetting:
      type: string
      enum: [ORIGINAL_MODE, CASH, CREDIT_NOTE, UDHAR]
      description: '0.3.0 (SAH-80-1): labels Original mode, Cash, Credit note for next purchase, Adjust in udhar.'
    StorePerson:
      type: object
      required: [membershipId, name, roleLabel, canSignIn]
      properties:
        membershipId: { type: string, format: uuid }
        name: { type: string }
        roleLabel: { type: string }
        canSignIn: { type: boolean }
    StoreDelegate:
      type: object
      required: [membershipId, name, roleLabel, canSignIn, from, to, state]
      properties:
        membershipId: { type: string, format: uuid }
        name: { type: string }
        roleLabel: { type: string }
        canSignIn: { type: boolean }
        from: { type: string, format: date }
        to: { type: string, format: date }
        state: { type: string, enum: [UPCOMING, CURRENT, ENDED], description: 'By IST date. "· till 30 Nov" (UPCOMING, CURRENT) or "Delegate ended 30 Nov" (ENDED, NEW).' }
    DelegateInput:
      type: object
      additionalProperties: false
      required: [membershipId, from, to]
      description: 'to required "Enter the end date"; to before from "The end date must be on or after the start date"; a period longer than 90 calendar days, counting both the from date and the to date (to - from > 89 days; from 1 Dec 2026 the last allowed to date is 28 Feb 2027, and from 17 Nov 2026 it is 14 Feb 2027), "A delegation can be at most 90 days" (DEC-068 Q1 A; database check ck_store_staff_delegate_dates to - from <= 89); a to date before today "The end date cannot be in the past"; membershipId equal to the HOD "The delegate must be a different person from the approver".'
      properties:
        membershipId: { type: string, format: uuid }
        from: { type: string, format: date }
        to: { type: string, format: date }
    Store:
      type: object
      required: [id, name, code, type, issuesFromStoreId, issuesFromName, saleAllowed, consumptionAllowed, hod, delegate, approverState, staffCount, status, hasStock, lockedFields, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 60 }
        code: { type: string, maxLength: 10 }
        type: { $ref: '#/components/schemas/StoreType' }
        issuesFromStoreId: { type: [string, 'null'], format: uuid, description: 'null for the Central Store ("Buys from vendors · issues to all stores").' }
        issuesFromName: { type: [string, 'null'] }
        saleAllowed: { type: boolean, description: Sale to patients }
        consumptionAllowed: { type: boolean, description: Consumption entry }
        hod: { oneOf: [ { $ref: '#/components/schemas/StorePerson' }, { type: 'null' } ] }
        delegate: { oneOf: [ { $ref: '#/components/schemas/StoreDelegate' }, { type: 'null' } ] }
        approverState: { type: string, enum: [SET, NONE], description: 'NONE = "No approver set" (no HOD, or the HOD cannot sign in).' }
        staffCount: { type: integer, minimum: 0 }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        hasStock: { type: boolean, description: An APPROVED opening-stock import exists (Phase 2 adds stock movements). }
        lockedFields: { type: array, items: { type: string, enum: [TYPE, CODE, ISSUES_FROM] }, description: 'Filled when hasStock ("Locked because this store has stock").' }
        linkedWard: { description: '0.2.0 (SAH-79-16, SAH-78-3 touch-up): the IPD ward of a WARD store, shown only in Integrated mode; null when not linked.', oneOf: [ { $ref: '#/components/schemas/WardRef' }, { type: 'null' } ] }
        version: { type: integer, minimum: 0 }
    StoreList:
      type: object
      required: [items, centralStoreId]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Store' } }
        centralStoreId: { type: [string, 'null'], format: uuid, description: 'null = no Central Store yet: empty state "No stores yet. Create your Central Store to start." with "+ Store".' }
    StoreCreate:
      type: object
      additionalProperties: false
      required: [name, code, type]
      properties:
        name: { type: string, maxLength: 60, description: 'Required after trimming; unique in the unit ignoring case.' }
        code: { type: string, maxLength: 10, pattern: '^[A-Za-z0-9-]{1,10}$', description: 'Stored upper case; unique in the unit ignoring case.' }
        type: { $ref: '#/components/schemas/StoreType' }
        saleAllowed: { type: boolean }
        consumptionAllowed: { type: boolean }
        hodMembershipId: { type: [string, 'null'], format: uuid }
        delegate: { oneOf: [ { $ref: '#/components/schemas/DelegateInput' }, { type: 'null' } ] }
    StoreUpdate:
      type: object
      additionalProperties: false
      required: [version, name, code, type, saleAllowed, consumptionAllowed, hodMembershipId, delegate]
      properties:
        version: { type: integer, minimum: 0 }
        name: { type: string, maxLength: 60 }
        code: { type: string, maxLength: 10, pattern: '^[A-Za-z0-9-]{1,10}$' }
        type: { $ref: '#/components/schemas/StoreType' }
        saleAllowed: { type: boolean }
        consumptionAllowed: { type: boolean }
        hodMembershipId: { type: [string, 'null'], format: uuid }
        delegate: { oneOf: [ { $ref: '#/components/schemas/DelegateInput' }, { type: 'null' } ] }
    StaffCandidate:
      type: object
      required: [membershipId, name, role, roleLabel, allowedStoreRoles, alreadyMappedHere]
      properties:
        membershipId: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: '#/components/schemas/TeamRole' }
        roleLabel: { type: string }
        allowedStoreRoles: { type: array, items: { $ref: '#/components/schemas/StoreRole' } }
        alreadyMappedHere: { type: boolean, description: 'True when the member has an ACTIVE mapping to the storeId of the request; always false when the request has no storeId (0.1.1).' }
    StaffMapping:
      type: object
      required: [id, storeId, membershipId, name, role, roleLabel, isHod, storeRole, effectiveStoreRole, delegateFrom, delegateTo, delegateState, access, otherStores, memberState, needsReview, status, version]
      properties:
        id: { type: string, format: uuid }
        storeId: { type: string, format: uuid }
        membershipId: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: '#/components/schemas/TeamRole' }
        roleLabel: { type: string, examples: [Nurse, Store staff] }
        isHod: { type: boolean }
        storeRole: { $ref: '#/components/schemas/StoreRole' }
        effectiveStoreRole: { $ref: '#/components/schemas/StoreRole' }
        delegateFrom: { type: [string, 'null'], format: date }
        delegateTo: { type: [string, 'null'], format: date }
        delegateState: { type: [string, 'null'], enum: [UPCOMING, CURRENT, ENDED, null] }
        access: { $ref: '#/components/schemas/StoreAccess' }
        otherStores:
          type: array
          items: { type: object, required: [storeId, name], properties: { storeId: { type: string, format: uuid }, name: { type: string } } }
        memberState: { type: string, enum: [ACTIVE, CANNOT_SIGN_IN] }
        needsReview: { type: boolean }
        status: { type: string, enum: [ACTIVE, REMOVED] }
        version: { type: integer, minimum: 0 }
    StaffMappingInput:
      type: object
      additionalProperties: false
      required: [membershipId, storeRole]
      properties:
        membershipId: { type: string, format: uuid }
        storeRole: { $ref: '#/components/schemas/StoreRole' }
        delegateFrom: { type: [string, 'null'], format: date, description: 'DELEGATE only (DelegateInput rules); null otherwise.' }
        delegateTo: { type: [string, 'null'], format: date }
    StaffMappingUpdate:
      type: object
      additionalProperties: false
      required: [version, storeRole]
      properties:
        version: { type: integer, minimum: 0 }
        storeRole: { $ref: '#/components/schemas/StoreRole' }
        delegateFrom: { type: [string, 'null'], format: date }
        delegateTo: { type: [string, 'null'], format: date }
    Schedule:
      type: string
      enum: [NONE, H, H1, X]
      description: 'Flags chip H, H1 or X; "—" for NONE. No default for an own product (BR-16).'
    GstRate:
      type: string
      pattern: '^(100(\.0{1,2})?|[0-9]{1,2}(\.[0-9]{1,2})?)$'
      description: 'Percent 0 to 100, at most 2 decimals, typed (no slab list; OQ-78-19). "Enter a GST % from 0 to 100".'
    Percent:
      type: string
      pattern: '^(100(\.0{1,2})?|[0-9]{1,2}(\.[0-9]{1,2})?)$'
    Rate:
      type: string
      pattern: '^[0-9]{1,7}(\.[0-9]{1,4})?$'
      description: 'Rupees per issue unit as a decimal string (numeric(14,4)). Phase 1 input allows at most 2 decimals.'
    ProductRow:
      type: object
      required: [source, catalogueProductId, productId, code, name, manufacturer, madeInHouse, salt, strength, form, purchaseUnit, issueUnit, conversion, hsn, gstRate, schedule, ndps, inUnit, sample, alias]
      properties:
        source: { type: string, enum: [GLOBAL, OWN] }
        catalogueProductId: { type: [string, 'null'], format: uuid }
        productId: { type: [string, 'null'], format: uuid, description: 'The unit product; null for a global product not adopted.' }
        code: { type: string, examples: [G-000101, U-TCB-0001] }
        name: { type: string }
        manufacturer: { type: [string, 'null'] }
        madeInHouse: { type: boolean }
        salt: { type: string }
        strength: { type: string }
        form: { type: string }
        purchaseUnit: { type: string }
        issueUnit: { type: string }
        conversion: { type: integer, minimum: 1, description: 'Issue units per purchase unit. The list shows "Box of 10 → vial" (client).' }
        hsn: { type: string }
        gstRate: { $ref: '#/components/schemas/GstRate' }
        schedule: { $ref: '#/components/schemas/Schedule' }
        ndps: { type: boolean, description: 'From the catalogue for a GLOBAL row. For an OWN row: false until 0.3.0; from 0.3.0 the owner''s yes or no (OwnProductInput.ndps, DEC-074 OQ-80-18b).' }
        inUnit: { type: string, enum: [ADOPTED, NOT_ADOPTED, WITHDRAWN, ACTIVE, INACTIVE] }
        sample: { type: boolean, description: 'Seeded sample catalogue row, "not clinically validated" (DEC-062 Q2). Never present in production.' }
        alias: { type: [string, 'null'] }
    ProductPage:
      type: object
      required: [items, total, page, size]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ProductRow' } }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 0 }
        size: { type: integer }
    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductRow'
        - type: object
          required: [productId, barcodes, localSettings, unitsLocked, hasStock, version]
          properties:
            barcodes: { type: array, items: { type: string }, description: 'Catalogue barcodes (read-only) of an adopted product.' }
            localSettings:
              type: object
              required: [storeSettings, preferredVendor, alias, barcode, returnable, active]
              properties:
                storeSettings:
                  type: array
                  items:
                    type: object
                    required: [storeId, storeName, reorderLevel, rack]
                    properties:
                      storeId: { type: string, format: uuid }
                      storeName: { type: string }
                      reorderLevel: { type: [integer, 'null'], minimum: 0, maximum: 999999 }
                      rack: { type: [string, 'null'], maxLength: 30 }
                preferredVendor:
                  oneOf:
                    - type: object
                      required: [id, name, needsReview]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        needsReview: { type: boolean }
                    - type: 'null'
                alias: { type: [string, 'null'], maxLength: 40 }
                barcode: { type: [string, 'null'], maxLength: 40 }
                returnable: { type: boolean }
                active: { type: boolean }
            unitsLocked: { type: boolean, description: 'Always equal to hasStock (0.1.2): purchaseUnit, issueUnit and conversion are locked exactly when the product has stock.' }
            hasStock: { type: boolean, description: 'Set when an opening-stock import naming this product on a line is APPROVED (Phase 2 adds stock movements).' }
            version: { type: integer, minimum: 0 }
    DuplicateCandidate:
      type: object
      required: [source, catalogueProductId, productId, code, name, manufacturer, madeInHouse, inUnit]
      properties:
        source: { type: string, enum: [GLOBAL, OWN] }
        catalogueProductId: { type: [string, 'null'], format: uuid }
        productId: { type: [string, 'null'], format: uuid }
        code: { type: string }
        name: { type: string }
        manufacturer: { type: [string, 'null'] }
        madeInHouse: { type: boolean }
        inUnit: { type: string, enum: [ADOPTED, NOT_ADOPTED, ACTIVE] }
    OwnProductInput:
      type: object
      additionalProperties: false
      required: [clientKey, name, salt, strength, form, purchaseUnit, issueUnit, conversion, manufacturer, madeInHouse, hsn, gstRate, schedule]
      description: >-
        Field order of the form (mockup fields first, then NEW): name, salt, strength, form, purchaseUnit,
        issueUnit, conversion, manufacturer or madeInHouse, hsn, gstRate, schedule, barcode. Texts: name, salt,
        strength empty "Enter the <field>", over 80 characters "Keep it to 80 characters"; form, purchaseUnit,
        issueUnit empty or over 30/20 characters; conversion not a whole number 1 to 10000 "Enter a whole number, 1
        or more"; hsn not 4 to 8 digits "Enter a 4 to 8 digit HSN"; gstRate "Enter a GST % from 0 to 100";
        schedule null "Choose the schedule"; barcode over 40 or not letters, digits and hyphen. There is no NDPS
        field: an own product is saved and answered with ndps false (0.1.2; ADR-028 R2-13).
      properties:
        clientKey: { type: string, format: uuid }
        name: { type: string, maxLength: 80 }
        salt: { type: string, maxLength: 80 }
        strength: { type: string, maxLength: 80 }
        form: { type: string, maxLength: 30 }
        purchaseUnit: { type: string, maxLength: 20 }
        issueUnit: { type: string, maxLength: 20 }
        conversion: { type: integer, minimum: 1, maximum: 10000 }
        manufacturer: { type: [string, 'null'], maxLength: 80 }
        madeInHouse: { type: boolean }
        hsn: { type: string, pattern: '^[0-9]{4,8}$' }
        gstRate: { $ref: '#/components/schemas/GstRate' }
        schedule: { oneOf: [ { $ref: '#/components/schemas/Schedule' }, { type: 'null' } ] }
        barcode: { type: [string, 'null'], maxLength: 40, pattern: '^[A-Za-z0-9-]{1,40}$' }
        ignoreDuplicates: { type: boolean, default: false, description: '"Create anyway": the server still records the matches in the audit.' }
        ndps: { type: boolean, default: false, description: '0.3.0 (SAH-80, DEC-074 OQ-80-18b, TP-10): "NDPS" yes or no on an own product, optional (absent = false). Feeds the Schedule X / NDPS balance register. Supersedes the 0.1.2 note that own products always answer ndps false.' }
    OwnProductUpdate:
      type: object
      additionalProperties: false
      required: [version, name, salt, strength, form, purchaseUnit, issueUnit, conversion, manufacturer, madeInHouse, hsn, gstRate, schedule]
      properties:
        version: { type: integer, minimum: 0 }
        name: { type: string, maxLength: 80 }
        salt: { type: string, maxLength: 80 }
        strength: { type: string, maxLength: 80 }
        form: { type: string, maxLength: 30 }
        purchaseUnit: { type: string, maxLength: 20 }
        issueUnit: { type: string, maxLength: 20 }
        conversion: { type: integer, minimum: 1, maximum: 10000 }
        manufacturer: { type: [string, 'null'], maxLength: 80 }
        madeInHouse: { type: boolean }
        hsn: { type: string, pattern: '^[0-9]{4,8}$' }
        gstRate: { $ref: '#/components/schemas/GstRate' }
        schedule: { oneOf: [ { $ref: '#/components/schemas/Schedule' }, { type: 'null' } ] }
        barcode: { type: [string, 'null'], maxLength: 40, pattern: '^[A-Za-z0-9-]{1,40}$' }
        ignoreDuplicates: { type: boolean, default: false, description: 'Read only when the normalised salt, strength and form key changes; otherwise no duplicate check runs (0.1.2).' }
        ndps: { type: boolean, description: '0.3.0 (DEC-074 OQ-80-18b), optional: absent leaves the stored value unchanged.' }
    LocalSettingsInput:
      type: object
      additionalProperties: false
      required: [version, storeSettings, preferredVendorId, alias, barcode, returnable, active]
      properties:
        version: { type: integer, minimum: 0 }
        storeSettings:
          type: array
          maxItems: 200
          description: 'Only the stores listed change (0.1.2). A store not listed keeps its saved reorder level and rack; an entry with reorderLevel and rack both null clears that store. An empty array changes no store.'
          items:
            type: object
            additionalProperties: false
            required: [storeId, reorderLevel, rack]
            properties:
              storeId: { type: string, format: uuid }
              reorderLevel: { type: [integer, 'null'], minimum: 0, maximum: 999999, description: '"Enter a whole number, 0 or more"' }
              rack: { type: [string, 'null'], maxLength: 30, description: '"Keep the rack to 30 characters"' }
        preferredVendorId: { type: [string, 'null'], format: uuid, description: 'A changed value must be an ACTIVE, not Blocked vendor of this unit, else 400 "Choose an active vendor". The saved value sent back unchanged is accepted even if that vendor is now Blocked or Inactive (0.1.2).' }
        alias: { type: [string, 'null'], maxLength: 40 }
        barcode: { type: [string, 'null'], maxLength: 40, pattern: '^[A-Za-z0-9-]{1,40}$', description: 'Checked against other ACTIVE products of this unit only when the product will be ACTIVE after the save (0.1.2).' }
        returnable: { type: boolean }
        active: { type: boolean, description: 'false answers 409 product-has-stock only when the product is ACTIVE now and has stock (0.1.2); then 409 open-import when the product is ACTIVE now and is on a line of a DRAFT or WAITING_APPROVAL import (0.1.3).' }
    ProductOptions:
      type: object
      required: [units, forms]
      properties:
        units: { type: array, items: { type: string } }
        forms: { type: array, items: { type: string } }
    ImportStatus:
      type: string
      enum: [DRAFT, NOT_ACCEPTED, WAITING_APPROVAL, APPROVED, REJECTED, REPLACED]
      description: 'Labels: Draft, Not accepted, Waiting for approval, Approved, Rejected, Replaced.'
    OpeningStockImport:
      type: object
      required: [id, storeId, storeName, status, rowCount, receivedRows, lineCount, totalQuantity, totalValuePaise, errorCount, warningCount, uploadedBy, createdAt, submittedAt, decidedBy, decidedAt, rejectReasonKey, rejectNote, replacedByImportId, canApprove, approveLockReason, posted, version]
      properties:
        id: { type: string, format: uuid }
        storeId: { type: string, format: uuid }
        storeName: { type: string }
        status: { $ref: '#/components/schemas/ImportStatus' }
        rowCount: { type: integer, minimum: 1, maximum: 5000 }
        receivedRows: { type: integer, minimum: 0 }
        lineCount: { type: integer, minimum: 0 }
        totalQuantity: { type: integer, minimum: 0 }
        totalValuePaise: { type: integer, format: int64, minimum: 0 }
        errorCount: { type: integer, minimum: 0, description: 'Rows with at least one ERROR issue (0.1.2). lineCount, totalQuantity, totalValuePaise, errorCount and warningCount are live while DRAFT and fixed at submit.' }
        warningCount: { type: integer, minimum: 0 }
        uploadedBy: { type: object, description: 'The starter of the import; membershipId is the team membership id (0.1.2), as in every people field of this API.', required: [membershipId, name], properties: { membershipId: { type: string, format: uuid }, name: { type: string } } }
        createdAt: { type: string, format: date-time }
        submittedAt: { type: [string, 'null'], format: date-time }
        decidedBy:
          description: 'The owner who approved or rejected; membershipId is the team membership id (0.1.2). null until decided.'
          oneOf:
            - { type: object, required: [membershipId, name], properties: { membershipId: { type: string, format: uuid }, name: { type: string } } }
            - { type: 'null' }
        decidedAt: { type: [string, 'null'], format: date-time }
        rejectReasonKey: { type: [string, 'null'], enum: [WRONG_FILE, WRONG_QUANTITIES, WRONG_STORE, OTHER, null] }
        rejectNote: { type: [string, 'null'] }
        replacedByImportId: { type: [string, 'null'], format: uuid }
        canApprove: { type: boolean }
        approveLockReason: { type: [string, 'null'], enum: [SELF_UPLOADED, NOT_OWNER, null], description: 'Set only while WAITING_APPROVAL and canApprove is false: SELF_UPLOADED for the owner who started the import, NOT_OWNER for a caller who is not an owner. null in every other status and when canApprove is true (0.1.2).' }
        posted: { type: boolean, description: 'false until posted by pharmacyPostOpeningStock (0.2.0; was const false in 0.1.x).' }
        postedAt: { type: [string, 'null'], format: date-time, description: '0.2.0.' }
        postedBy: { description: '0.2.0: the member who posted; null until posted.', oneOf: [ { $ref: '#/components/schemas/PersonRef' }, { type: 'null' } ] }
        version: { type: integer, minimum: 0 }
    ImportPage:
      type: object
      required: [items, total, page, size]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/OpeningStockImport' } }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 0 }
        size: { type: integer }
    ImportCreate:
      type: object
      additionalProperties: false
      required: [clientKey, columns, rowCount]
      properties:
        clientKey: { type: string, format: uuid }
        columns: { type: array, minItems: 1, maxItems: 20, items: { type: string, maxLength: 40 }, description: 'The header row as read; must equal the template header.' }
        rowCount: { type: integer, minimum: 1, maximum: 5000, description: 'Data rows, example rows (first cell starting with #) excluded.' }
    LinesInput:
      type: object
      additionalProperties: false
      required: [rows]
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [rowNo, storeCode, productCode, batch, expiryDate, mrp, purchaseRate, quantity]
            properties:
              rowNo: { type: integer, minimum: 1, maximum: 5000 }
              storeCode: { type: string, maxLength: 40, description: 'Matched ignoring case and leading or trailing spaces (0.1.2).' }
              productCode: { type: string, maxLength: 40, description: 'Matched ignoring case and leading or trailing spaces (0.1.2).' }
              batch: { type: string, maxLength: 40, description: 'The file-wide repeat check at submit compares batches of the same product ignoring case (0.1.2).' }
              expiryDate: { type: string, maxLength: 20 }
              mrp: { type: string, maxLength: 20 }
              purchaseRate: { type: string, maxLength: 20 }
              quantity: { type: string, maxLength: 20 }
    RowIssue:
      type: object
      required: [rowNo, field, code, severity, message]
      properties:
        rowNo: { type: integer, minimum: 1 }
        field: { type: string, enum: [storeCode, productCode, batch, expiryDate, mrp, purchaseRate, quantity] }
        code: { type: string, enum: [store-mismatch, product-unknown, batch-invalid, batch-repeated, expiry-invalid, expiry-past, mrp-invalid, rate-invalid, quantity-invalid, rate-above-mrp] }
        severity: { type: string, enum: [ERROR, WARNING] }
        message: { type: string }
    LinesResult:
      type: object
      required: [receivedRows, rowCount, issues]
      properties:
        receivedRows: { type: integer, minimum: 0 }
        rowCount: { type: integer, minimum: 1 }
        issues: { type: array, items: { $ref: '#/components/schemas/RowIssue' } }
    OpeningStockLine:
      type: object
      required: [rowNo, storeCode, productCode, productId, productName, batch, expiryDate, mrp, purchaseRate, quantity, valuePaise, issues]
      properties:
        rowNo: { type: integer, minimum: 1 }
        storeCode: { type: string }
        productCode: { type: string }
        productId: { type: [string, 'null'], format: uuid }
        productName: { type: [string, 'null'] }
        batch: { type: string }
        expiryDate: { type: [string, 'null'], format: date, description: 'Parsed date; null when unreadable.' }
        mrp: { oneOf: [ { $ref: '#/components/schemas/Rate' }, { type: 'null' } ] }
        purchaseRate: { oneOf: [ { $ref: '#/components/schemas/Rate' }, { type: 'null' } ] }
        quantity: { type: [integer, 'null'], minimum: 1 }
        valuePaise: { type: [integer, 'null'], format: int64, description: 'purchaseRate x quantity, rounded half-up to the paisa.' }
        issues: { type: array, items: { $ref: '#/components/schemas/RowIssue' } }
    OpeningStockLinePage:
      type: object
      required: [items, total, page, size]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/OpeningStockLine' } }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 0 }
        size: { type: integer }
    RejectInput:
      type: object
      additionalProperties: false
      required: [reasonKey]
      properties:
        reasonKey: { type: string, enum: [WRONG_FILE, WRONG_QUANTITIES, WRONG_STORE, OTHER], description: 'Wrong file, Wrong quantities, Wrong store, Other' }
        note: { type: [string, 'null'], maxLength: 300 }
    Vendor:
      type: object
      description: >-
        0.3.4 (DEC-082, security M3): the full record for an OWNER or a PHARMACIST member, and for the answers of
        the SETUP_EDIT writes. The reduced view (GET /vendors and GET /vendors/{vendorId} for any other caller,
        pharmacyListVendors) fills id, name, status, blocked and version and sends every other member as null;
        licenceRequired, licenceState, creditDays, suppliesTo and productsCount are therefore nullable, and are
        never null in the full record.
      required: [id, name, gstin, licenceRequired, licenceNo, licenceValidTill, licenceState, contactName, contactPhone, creditDays, returnDaysBeforeExpiry, returnCreditPercent, suppliesTo, productsCount, status, blocked, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        gstin: { oneOf: [ { $ref: '#/components/schemas/Gstin' }, { type: 'null' } ] }
        licenceRequired: { type: [boolean, 'null'], description: '0.3.4: null only in the reduced view.' }
        licenceNo: { type: [string, 'null'], maxLength: 40 }
        licenceValidTill: { type: [string, 'null'], format: date }
        licenceState: { type: [string, 'null'], enum: [VALID, EXPIRED, NOT_REQUIRED, null], description: '0.3.4: null only in the reduced view.' }
        contactName: { type: [string, 'null'], maxLength: 80 }
        contactPhone: { type: [string, 'null'], pattern: '^[0-9]{10}$' }
        creditDays: { type: [integer, 'null'], minimum: 0, maximum: 365, description: '0.3.4: null only in the reduced view.' }
        returnDaysBeforeExpiry: { type: [integer, 'null'], minimum: 0, maximum: 365 }
        returnCreditPercent: { oneOf: [ { $ref: '#/components/schemas/Percent' }, { type: 'null' } ], description: 'The standard credit level: a vendor-return line starts from it unless one of the two levels below applies (0.2.1).' }
        damagedCreditPercent: { oneOf: [ { $ref: '#/components/schemas/Percent' }, { type: 'null' } ], description: '0.2.1 (DEC-078 item 5, DEC-075; applies in SAH-79 WP-E vendor returns). Credit level 0 to 100 (2 decimals) for a return line whose reason is damaged on receipt. Null: the standard returnCreditPercent applies.' }
        expiredCreditPercent: { oneOf: [ { $ref: '#/components/schemas/Percent' }, { type: 'null' } ], description: '0.2.1 (DEC-078 item 5, DEC-075; applies in SAH-79 WP-E vendor returns). Credit level 0 to 100 (2 decimals) for a return line whose batch is expired (after expiry). Null: the standard returnCreditPercent applies.' }
        suppliesTo:
          type: [array, 'null']
          description: '0.3.4: null only in the reduced view.'
          items: { type: object, required: [storeId, name], properties: { storeId: { type: string, format: uuid }, name: { type: string } } }
        productsCount: { type: [integer, 'null'], minimum: 0, description: '0.3.4: null only in the reduced view.' }
        status: { type: string, enum: [ACTIVE, BLOCKED, INACTIVE], description: 'BLOCKED = licenceState EXPIRED on an ACTIVE vendor ("Blocked · licence expired"); computed, never stored.' }
        blocked: { type: boolean, description: 'The flag the SAH-79 purchase order reads to refuse a new PO.' }
        version: { type: integer, minimum: 0, description: '0 on create; each change that writes (PUT, switch off, switch on) adds 1; an idempotent call that writes nothing keeps it (general rule 9, 0.3.1).' }
    VendorPage:
      type: object
      required: [items, total, page, size]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Vendor' } }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 0 }
        size: { type: integer }
    VendorInput:
      type: object
      additionalProperties: false
      required: [clientKey, name, gstin, licenceRequired, licenceNo, licenceValidTill, contactName, contactPhone, creditDays, returnDaysBeforeExpiry, returnCreditPercent, suppliesToStoreIds]
      properties:
        clientKey: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        gstin: { type: [string, 'null'], maxLength: 15 }
        licenceRequired: { type: boolean }
        licenceNo: { type: [string, 'null'], maxLength: 40 }
        licenceValidTill: { type: [string, 'null'], format: date }
        contactName: { type: [string, 'null'], maxLength: 80 }
        contactPhone: { type: [string, 'null'], maxLength: 10, description: '10 digits "Enter a 10-digit phone number"' }
        creditDays: { type: integer, minimum: 0, maximum: 365, description: '"Enter 0 to 365 days"' }
        returnDaysBeforeExpiry: { type: [integer, 'null'], minimum: 0, maximum: 365 }
        returnCreditPercent: { type: [string, 'null'], maxLength: 6, description: 'Percent "Enter a % from 0 to 100"' }
        damagedCreditPercent: { type: [string, 'null'], maxLength: 6, description: '0.2.1, optional (absent = null). Percent 0 to 100, at most 2 decimals, "Enter a % from 0 to 100". Applies in SAH-79 WP-E.' }
        expiredCreditPercent: { type: [string, 'null'], maxLength: 6, description: '0.2.1, optional (absent = null). Percent 0 to 100, at most 2 decimals, "Enter a % from 0 to 100". Applies in SAH-79 WP-E.' }
        suppliesToStoreIds: { type: array, maxItems: 200, items: { type: string, format: uuid } }
    VendorUpdate:
      type: object
      additionalProperties: false
      required: [version, name, gstin, licenceRequired, licenceNo, licenceValidTill, contactName, contactPhone, creditDays, returnDaysBeforeExpiry, returnCreditPercent, suppliesToStoreIds]
      properties:
        version: { type: integer, minimum: 0 }
        name: { type: string, maxLength: 120 }
        gstin: { type: [string, 'null'], maxLength: 15 }
        licenceRequired: { type: boolean }
        licenceNo: { type: [string, 'null'], maxLength: 40 }
        licenceValidTill: { type: [string, 'null'], format: date }
        contactName: { type: [string, 'null'], maxLength: 80 }
        contactPhone: { type: [string, 'null'], maxLength: 10 }
        creditDays: { type: integer, minimum: 0, maximum: 365 }
        returnDaysBeforeExpiry: { type: [integer, 'null'], minimum: 0, maximum: 365 }
        returnCreditPercent: { type: [string, 'null'], maxLength: 6 }
        damagedCreditPercent: { type: [string, 'null'], maxLength: 6, description: '0.2.1, optional. Absent leaves the stored value unchanged; null clears it. Percent 0 to 100, at most 2 decimals.' }
        expiredCreditPercent: { type: [string, 'null'], maxLength: 6, description: '0.2.1, optional. Absent leaves the stored value unchanged; null clears it. Percent 0 to 100, at most 2 decimals.' }
        suppliesToStoreIds: { type: array, maxItems: 200, items: { type: string, format: uuid } }
    TransactionType:
      type: string
      enum: [PURCHASE_ORDER, GRN_RATE_RISE, VENDOR_RETURN, INDENT, STOCK_TRANSFER, WRITE_OFF, STOCK_ADJUSTMENT, SALE_DISCOUNT, SALES_RETURN]
      description: 'Labels Purchase order, Receive stock (rate rise), Vendor return, Indent, Stock transfer, Write-off, Stock adjustment, Discount at sale, Sales return (OQ-78-25). Opening stock is not here: it has the fixed rule "a different owner approves" (ADR-028 D7).'
    ApprovalCondition:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [ALWAYS, ABOVE_AMOUNT, ABOVE_PERCENT, SCHEDULE_X_ITEM, HIGH_VALUE_ITEM, URGENT_PRIORITY, STORE_TYPE] }
        amountPaise: { type: [integer, 'null'], format: int64, minimum: 0, maximum: 9999999900, description: '0.2.1 (DEC-078 item 1): at most ₹ 9,99,99,999 (9,999,999,900 paise). Never used by SALE_DISCOUNT or GRN_RATE_RISE, which take percent.' }
        percent: { oneOf: [ { $ref: '#/components/schemas/Percent' }, { type: 'null' } ] }
        storeTypes: { type: [array, 'null'], items: { $ref: '#/components/schemas/StoreType' } }
    ApprovalLevel:
      type: object
      additionalProperties: false
      required: [level, approver, condition]
      properties:
        level: { type: integer, enum: [1, 2] }
        approver: { type: string, enum: [STORE_APPROVER, OWNER], description: 'STORE_APPROVER = the HOD of the transaction''s store, or its CURRENT delegate. Pharmacist-in-charge is open (OQ-78-25).' }
        condition: { $ref: '#/components/schemas/ApprovalCondition' }
    ApprovalRule:
      type: object
      additionalProperties: false
      required: [transactionType, levels, escalateAfterHours, urgentEscalateAfterMinutes]
      properties:
        transactionType: { $ref: '#/components/schemas/TransactionType' }
        levels: { type: array, maxItems: 2, items: { $ref: '#/components/schemas/ApprovalLevel' }, description: 'Empty = level 0, no approval.' }
        escalateAfterHours: { type: [integer, 'null'], minimum: 1, maximum: 168 }
        urgentEscalateAfterMinutes: { type: [integer, 'null'], minimum: 5, maximum: 1440, description: INDENT only. }
    ApprovalRules:
      type: object
      required: [versionNo, preset, reviewNeeded, savedAt, savedBy, highValueThresholdPaise, rules, fixedRules, storesWithoutApprover, currentDelegates]
      properties:
        versionNo: { type: integer, minimum: 0, description: '0 = defaults, never saved.' }
        preset: { type: string, enum: [LEAN, STANDARD, STRICT, CUSTOM] }
        reviewNeeded: { type: boolean }
        savedAt: { type: [string, 'null'], format: date-time }
        savedBy:
          oneOf:
            - { type: object, required: [membershipId, name], properties: { membershipId: { type: string, format: uuid }, name: { type: string } } }
            - { type: 'null' }
        highValueThresholdPaise: { type: [integer, 'null'], format: int64, minimum: 0, maximum: 9999999900, description: 'The "high value" item amount (OQ-78-26); no default. 0.3.1: at most ₹ 9,99,99,999 (9,999,999,900 paise), the same as the amount limit (the 0.1.x maximum 99,999,999,900 was ten times the text).' }
        rules: { type: array, minItems: 9, maxItems: 9, items: { $ref: '#/components/schemas/ApprovalRule' } }
        presets:
          type: array
          description: >-
            0.2.1 (DEC-078 item 3), response-additive. One entry per preset LEAN, STANDARD, STRICT. limitTypes lists
            the transaction types whose OWNER level needs a limit in that preset, in TransactionType order; POST
            /approval-rules/preset needs exactly one limits entry for each of them. The server is the source of
            truth; the client does not derive the list. For SALE_DISCOUNT and GRN_RATE_RISE the limit is a percent.
          items:
            type: object
            required: [preset, limitTypes]
            properties:
              preset: { type: string, enum: [LEAN, STANDARD, STRICT] }
              limitTypes: { type: array, maxItems: 9, items: { $ref: '#/components/schemas/TransactionType' } }
        fixedRules:
          type: array
          items:
            type: object
            required: [key, text]
            properties:
              key: { type: string, enum: [NO_SELF_APPROVAL, SCHEDULE_X_TWO_SIGNATURES, LEDGER_APPEND_ONLY] }
              text: { type: string }
        storesWithoutApprover:
          type: array
          items: { type: object, required: [storeId, name], properties: { storeId: { type: string, format: uuid }, name: { type: string } } }
        currentDelegates:
          type: array
          items:
            type: object
            required: [storeId, storeName, membershipId, name, to]
            properties:
              storeId: { type: string, format: uuid }
              storeName: { type: string }
              membershipId: { type: string, format: uuid }
              name: { type: string }
              to: { type: string, format: date }
    ApprovalRulesInput:
      type: object
      additionalProperties: false
      required: [baseVersionNo, highValueThresholdPaise, rules]
      properties:
        baseVersionNo: { type: integer, minimum: 0 }
        highValueThresholdPaise: { type: [integer, 'null'], format: int64, minimum: 0, maximum: 9999999900, description: '0.3.1: at most ₹ 9,99,99,999 (9,999,999,900 paise), the same as the amount limit; over it or negative 400 validation "Enter an amount up to ₹ 9,99,99,999".' }
        rules: { type: array, minItems: 9, maxItems: 9, items: { $ref: '#/components/schemas/ApprovalRule' } }
    PresetInput:
      type: object
      additionalProperties: false
      required: [baseVersionNo, preset, limits]
      properties:
        baseVersionNo: { type: integer, minimum: 0 }
        preset: { type: string, enum: [LEAN, STANDARD, STRICT] }
        limits:
          type: array
          maxItems: 9
          items:
            type: object
            additionalProperties: false
            required: [transactionType, amountPaise, percent, noAmountCondition]
            properties:
              transactionType: { $ref: '#/components/schemas/TransactionType' }
              amountPaise: { type: [integer, 'null'], format: int64, minimum: 0, maximum: 9999999900, description: '0.2.1 (DEC-078 item 1): at most ₹ 9,99,99,999 (9,999,999,900 paise).' }
              percent: { oneOf: [ { $ref: '#/components/schemas/Percent' }, { type: 'null' } ], description: 'SALE_DISCOUNT and GRN_RATE_RISE (0.2.1, DEC-078 item 2).' }
              noAmountCondition: { type: boolean }
    RuleVersionPage:
      type: object
      required: [items, total, page, size]
      properties:
        items:
          type: array
          items:
            type: object
            required: [versionNo, preset, savedAt, savedBy]
            properties:
              versionNo: { type: integer, minimum: 1 }
              preset: { type: string, enum: [LEAN, STANDARD, STRICT, CUSTOM] }
              savedAt: { type: string, format: date-time }
              savedBy: { type: object, required: [membershipId, name], properties: { membershipId: { type: string, format: uuid }, name: { type: string } } }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 0 }
        size: { type: integer }
    DocType:
      type: string
      enum: [PURCHASE_ORDER, GRN, INDENT, TRANSFER, BILL, DEBIT_NOTE, STOCK_AUDIT, STORE_RETURN, DAMAGE_REPORT, STOCK_ADJUSTMENT, CREDIT_NOTE, IPD_ISSUE_SLIP]
      description: '0.3.0 (SAH-80-1, DEC-074 OQ-80-7) adds CREDIT_NOTE "CN/" (financial-year part, 6 digits, restarts every 1 April: CN/26-27/000001; sales returns and cancelled-bill refunds) and IPD_ISSUE_SLIP "IS-" (4 digits, no financial-year part, no restart; listed only when the unit is Integrated; default prefix an architect proposal, ADR-030 open point). A BILL series may also exist per selling store (pharmacy-sales.yaml, pharmacyPutStoreBillSeries); GET /document-series keeps answering the unit rows only. Series locking (0.2.1) applies to every type. 0.2.0 adds DEBIT_NOTE "DN-", STOCK_AUDIT "AUD-", STORE_RETURN "RET-", DAMAGE_REPORT "DMG-", STOCK_ADJUSTMENT "ADJ-" (4 digits, no financial-year part, no restart until saved; OQ-79-14). GET /document-series lists ten rows; numbersIssued is true once a number of that type is taken in the current financial year (0.3.1 wording; the series is then locked, 409 series-locked); editing a series later changes only numbers taken afterwards (ADR-029 P9).'
    DocumentSeries:
      type: object
      required: [docType, prefix, financialYearPart, sequenceLength, restartsEachFinancialYear, example, renderedLength, numbersIssued, saved, version]
      properties:
        docType: { $ref: '#/components/schemas/DocType' }
        prefix: { type: string, pattern: '^[A-Za-z0-9/-]{1,6}$' }
        financialYearPart: { type: boolean }
        sequenceLength: { type: integer, minimum: 4, maximum: 8 }
        restartsEachFinancialYear: { type: boolean }
        example: { type: string, maxLength: 16 }
        renderedLength: { type: integer, maximum: 16 }
        numbersIssued: { type: boolean, description: '0.3.1: true when a number of this docType has been issued in the current financial year (April to March, IST); the series is then locked and PUT /document-series/{docType} answers 409 series-locked "Numbers have already been issued this year.". False before the first number of the financial year, including from 1 April.' }
        saved: { type: boolean }
        version: { type: integer, minimum: 0, description: '0 while the row is the unsaved default (saved false); the first save stores 1 (general rule 9).' }
    DocumentSeriesInput:
      type: object
      additionalProperties: false
      required: [version, prefix, financialYearPart, sequenceLength, restartsEachFinancialYear]
      properties:
        version: { type: integer, minimum: 0 }
        prefix: { type: string, maxLength: 6 }
        financialYearPart: { type: boolean }
        sequenceLength: { type: integer, minimum: 4, maximum: 8 }
        restartsEachFinancialYear: { type: boolean }
    ReasonLists:
      type: object
      required: [lists]
      properties:
        lists:
          type: array
          items:
            type: object
            required: [listKey, label, reasons]
            properties:
              listKey: { $ref: '#/components/schemas/ListKeyValue' }
              label: { type: string, examples: [Store return, Sales return, Damage, Stock adjustment, Receipt rejection] }
              reasons:
                type: array
                items:
                  type: object
                  required: [reasonKey, label, seeded, active]
                  properties:
                    reasonKey: { type: string, pattern: '^[a-z0-9][a-z0-9.-]{0,63}$', examples: [damage.expired] }
                    label: { type: string, maxLength: 40 }
                    seeded: { type: boolean }
                    active: { type: boolean }
                    fixed: { type: boolean, description: '0.2.1 (DEC-078 item 6), response-additive. True for a reason that cannot be switched off (receipt-reject.short); the client hides its switch-off action and does not identify it by key. Switch-off answers 409 last-active-reason "This reason is fixed."' }
    ReasonInput:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label: { type: string, maxLength: 40 }
    PrintTemplate:
      type: object
      required: [docType, headerLines, defaultHeaderLines, footerNote, paperSize, fixedFields, printable, missing, saved, version]
      properties:
        docType: { type: string, enum: [INVOICE, ISSUE_SLIP, DEBIT_NOTE] }
        headerLines: { type: array, maxItems: 3, items: { type: string, maxLength: 80 } }
        defaultHeaderLines: { type: array, maxItems: 3, items: { type: string }, description: 'From the clinic profile (name, address, phone); used when headerLines is empty.' }
        footerNote: { type: [string, 'null'], maxLength: 200 }
        paperSize: { type: string, enum: [A4, A5] }
        fixedFields: { type: array, items: { type: string, enum: [UNIT_NAME, DOCUMENT_NO, DATE, GSTIN, DRUG_LICENCE_NO, HSN, BATCH, EXPIRY, MRP, GST_AMOUNTS] } }
        printable: { type: boolean }
        missing: { type: array, items: { type: string, enum: [GSTIN, DRUG_LICENCE_NO] } }
        saved: { type: boolean }
        version: { type: integer, minimum: 0 }
    PrintTemplateInput:
      type: object
      additionalProperties: false
      required: [version, headerLines, footerNote, paperSize]
      properties:
        version: { type: integer, minimum: 0 }
        headerLines: { type: array, maxItems: 3, items: { type: string, minLength: 1, maxLength: 80 } }
        footerNote: { type: [string, 'null'], maxLength: 200 }
        paperSize: { type: string, enum: [A4, A5] }
    # ================================================================ SAH-79 (0.2.0) schemas · common
    ListKeyValue:
      type: string
      enum: [store-return, sales-return, damage, stock-adjustment, receipt-reject, cs-change, approval-reject, transfer, consumption-purpose, dispute, vendor-return, substitution, allergy-override, h1-override, return-condition, cancel-bill, ward-return, rx-closed, clearance, day-close-difference]
      description: '0.3.0 (SAH-80, TP-10, seeded by the SAH-80 WP-I migration as global editable rows; ADR-030 S10) adds nine lists: substitution (Out of stock, Patient preference, Cheaper equivalent, Prescriber advice, Other), allergy-override (Prescriber confirmed, Patient has taken it safely before, Allergy entry is wrong, Other), h1-override (the same four as allergy-override, 80-9), return-condition (Sealed, Strip cut or opened, Damaged; fixed keys return-condition.sealed, .opened, .damaged: they decide where stock goes and cannot be switched off), cancel-bill (Wrong item, Wrong quantity, Customer changed mind, Other), ward-return (Medicine stopped, Discharge, Not used), rx-closed (Patient declined, Out of stock, Doctor changed the order, Other), clearance (Returns will come later, Nothing to return, Other), day-close-difference (Short change given, Entry error, Refund not recorded, Other). 0.2.0 adds seven lists, seeded by the SAH-79 migration as global rows (OQ-79-15, ADR-029 P11): receipt-reject (Damaged in transit, Wrong item, Near expiry / expired, Excess quantity, Short / not received - fixed), cs-change (Out of stock, Near expiry held, Pack or size change, Other), approval-reject (Not needed, Quantity too high, Wrong item, Other), transfer (Non-moving here, needed there; Urgent shortage; Store closure), consumption-purpose (Ward general use, Procedure (non-billable), Cleaning / infection control), dispute (Other), vendor-return (Other). stock-adjustment gains Count mismatch and Theft or loss (OQ-79-27).'
    PersonRef:
      type: object
      required: [membershipId, name]
      properties:
        membershipId: { type: string, format: uuid }
        name: { type: string }
    WardRef:
      type: object
      required: [wardId, name]
      properties:
        wardId: { type: string, format: uuid }
        name: { type: string }
    StoreRef:
      type: object
      required: [storeId, name, type]
      properties:
        storeId: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: '#/components/schemas/StoreType' }
    ProductRef:
      type: object
      required: [productId, code, name, strength, form, schedule, purchaseUnit, issueUnit, conversion, gstPercent]
      properties:
        productId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        strength: { type: string }
        form: { type: string }
        schedule: { $ref: '#/components/schemas/Schedule' }
        purchaseUnit: { type: string }
        issueUnit: { type: string }
        conversion: { type: integer, minimum: 1 }
        gstPercent: { allOf: [ { $ref: '#/components/schemas/GstRate' } ], description: '0.3.3 (additive): the product''s current GST % in this unit (the gstRate of the unit product), for example "12". Sent wherever ProductRef is sent. A document line keeps its own GST % as saved; this is the current master value, used by the client as the starting GST % of a new purchase order or receipt line.' }
    BatchRef:
      type: object
      required: [batchId, batchNo, expiryDate]
      properties:
        batchId: { type: string, format: uuid }
        batchNo: { type: string, maxLength: 20, description: 'As first received (matching ignores case, ADR-029 P2, OQ-79-37 open).' }
        expiryDate: { type: string, format: date, description: 'Last valid day (IST). Shown as month and year, "Mar 2028" (OQ-79-7).' }
    StockState:
      type: string
      enum: [AVAILABLE, IN_TRANSIT, PENDING_RETURN, QUARANTINE]
      description: 'Labels Available, In transit, Pending return, Quarantine (BR-4). Only AVAILABLE is usable.'
    Qty:
      type: integer
      minimum: 0
      maximum: 999999
      description: Whole issue units unless the field says purchase units.
    Paise:
      type: integer
      format: int64
      description: 'Whole paise (ADR-028 D10); shown ₹ 1,25,000.50.'
    ReasonRef:
      type: object
      required: [reasonKey, label]
      properties:
        reasonKey: { type: string }
        label: { type: string }
        note: { type: [string, 'null'] }
    ClientKeyInput:
      type: object
      additionalProperties: false
      required: [clientKey]
      properties:
        clientKey: { type: string, format: uuid }
    VersionInput:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 0 }
    VersionClientKeyInput:
      type: object
      additionalProperties: false
      required: [clientKey, version]
      properties:
        clientKey: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
    VersionReasonInput:
      type: object
      additionalProperties: false
      required: [version, reasonKey]
      properties:
        version: { type: integer, minimum: 0 }
        reasonKey: { type: string, maxLength: 80, description: 'An active reason of the list the operation names (rule 21).' }
        note: { type: [string, 'null'], maxLength: 300 }
    NoteInput:
      type: object
      additionalProperties: false
      required: [clientKey, note]
      properties:
        clientKey: { type: string, format: uuid }
        note: { type: string, minLength: 4, maxLength: 300 }
    SecondSigner:
      type: object
      additionalProperties: false
      required: [membershipId, pin]
      description: 'Schedule X second signature (rule 19, ADR-029 P7): another ACTIVE pharmacist or owner of the clinic, never the caller (0.3.2: the client offers the people of GET /stores/{storeId}/second-signers). pin is the colleague''s own staff PIN as typed; checked by platform.api.StaffPinPort.checkColleague before the transaction; never stored, logged, audited or echoed.'
      properties:
        membershipId: { type: string, format: uuid }
        pin: { type: string, pattern: '^[0-9]{4}$', minLength: 4, maxLength: 4, writeOnly: true, description: '0.3.4 (security L17): exactly four digits. A missing membershipId answers 400 validation field secondSigner "A second signature is needed for Schedule X items." (the rule 19 sentence); a missing pin or one that is not four digits answers 400 validation field secondSigner.pin "Enter a 4-digit PIN.". Both are checked with the other body rules, before the second-signer eligibility check and before any PIN check, so no try is counted against the colleague or the caller. The value is never echoed in the problem.' }
    SecondSignerCandidates:
      type: object
      required: [items]
      description: '0.3.2, pharmacyListSecondSigners: small and complete (rule 13), sorted by name. Never the caller.'
      properties:
        items:
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [membershipId, name, roleLabel]
            properties:
              membershipId: { type: string, format: uuid, description: 'The clinic membership id; sent back as SecondSigner.membershipId.' }
              name: { type: string, description: 'The member''s display name as the platform holds it (a staff name, not patient data).' }
              roleLabel: { type: string, enum: [Pharmacist, Owner], description: 'The platform label of the team role (platform.api.RoleLabels).' }
    PostWithSignerInput:
      type: object
      additionalProperties: false
      required: [clientKey, version]
      properties:
        clientKey: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        secondSigner: { oneOf: [ { $ref: '#/components/schemas/SecondSigner' }, { type: 'null' } ], description: 'Required when the document has Schedule X lines.' }
    PageMeta:
      type: object
      required: [total, page, size]
      properties:
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 0 }
        size: { type: integer }
    HistoryEvent:
      type: object
      required: [event, at, by, actingAs, store, lineLabel, qtyBefore, qtyAfter, reason]
      description: 'One step of a document (BR-26), from the append-only history table (ADR-029 P9).'
      properties:
        event: { type: string, examples: [CREATED, SUBMITTED, DECIDED, DISPATCHED, RECEIVED, ACCEPTED, DISPUTED, SETTLED, POSTED, CANCELLED, HANDED_OVER, CREDIT_NOTE_RECEIVED] }
        at: { type: string, format: date-time }
        by: { oneOf: [ { $ref: '#/components/schemas/PersonRef' }, { type: 'null' } ], description: 'null = System.' }
        actingAs: { type: [string, 'null'], enum: [HOD, DELEGATE, OWNER, ESCALATED, CENTRAL_STORE, STORE, PHARMACIST, null] }
        store: { oneOf: [ { $ref: '#/components/schemas/StoreRef' }, { type: 'null' } ] }
        lineLabel: { type: [string, 'null'], description: 'For example "IV NS changed 20 → 24".' }
        qtyBefore: { type: [integer, 'null'] }
        qtyAfter: { type: [integer, 'null'] }
        reason: { oneOf: [ { $ref: '#/components/schemas/ReasonRef' }, { type: 'null' } ] }
    ApprovalSummary:
      type: object
      required: [requestId, requestVersion, levelNo, status, currentLevel, ruleText, waitingFor, escalated, needsAnotherApprover, canDecide]
      description: 'The approval of a document, embedded in its GET (full detail: GET /approvals/{requestId}). null on a document when no rule applied (level 0). 0.3.5 (tech lead decision of 19 Nov 13:40, item 3): requestVersion and levelNo are always sent, so a card (the indent card, a purchase order, a receipt) can call pharmacyDecideApproval without reading the request first.'
      properties:
        requestId: { type: string, format: uuid }
        requestVersion: { type: integer, minimum: 0, description: '0.3.5: the approval request''s current version (ApprovalRequest.version); sent as requestVersion of ApprovalDecisionInput. An old value answers 409 already-decided with current.' }
        levelNo: { type: [integer, 'null'], enum: [1, 2, null], description: '0.3.5: the level a decision is for now, sent as level of ApprovalDecisionInput; equals currentLevel (null when the request is no longer PENDING).' }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, WITHDRAWN] }
        currentLevel: { type: [integer, 'null'], enum: [1, 2, null] }
        ruleText: { type: string, examples: ['PO above ₹ 50,000', 'Rate up more than 5%', 'Sending store HOD'] }
        waitingFor: { type: [string, 'null'], enum: [HOD, OWNER, null], description: '"Waiting for HOD approval" / "Waiting for owner approval".' }
        escalated: { type: boolean }
        needsAnotherApprover: { type: boolean }
        canDecide: { type: boolean }
        rejectReason: { oneOf: [ { $ref: '#/components/schemas/ReasonRef' }, { type: 'null' } ] }
    # ---------------------------------------------------------------- WP-D
    OpeningStockPostingPreview:
      type: object
      required: [importId, store, lineCount, totalQuantity, totalValuePaise, uploadedBy, approvedBy, expiredLines, mrpMismatchLines, canPost, postLockReason]
      properties:
        importId: { type: string, format: uuid }
        store: { $ref: '#/components/schemas/StoreRef' }
        lineCount: { type: integer, minimum: 0 }
        totalQuantity: { type: integer, minimum: 0 }
        totalValuePaise: { $ref: '#/components/schemas/Paise' }
        uploadedBy: { $ref: '#/components/schemas/PersonRef' }
        approvedBy: { oneOf: [ { $ref: '#/components/schemas/PersonRef' }, { type: 'null' } ] }
        expiredLines: { type: array, maxItems: 5000, items: { type: object, required: [rowNo, productName, batchNo, expiryDate, quantity], properties: { rowNo: { type: integer }, productName: { type: string }, batchNo: { type: string }, expiryDate: { type: string, format: date }, quantity: { type: integer } } }, description: 'Will be posted to Quarantine with reason Expired.' }
        mrpMismatchLines: { type: array, maxItems: 100, items: { type: object, required: [rowNo, batchNo, fileMrp, batchMrp], properties: { rowNo: { type: integer }, batchNo: { type: string }, fileMrp: { $ref: '#/components/schemas/Rate' }, batchMrp: { $ref: '#/components/schemas/Rate' } } } }
        canPost: { type: boolean }
        postLockReason: { type: [string, 'null'], enum: [NOT_APPROVED, ALREADY_POSTED, MRP_MISMATCH, null] }
    TransactionGroup:
      type: string
      enum: [INDENTS, PURCHASE, STOCK, SALES]
      description: '0.3.0 adds SALES (the inbox chip "Sales": SALE_DISCOUNT and SALES_RETURN requests, SAH-80-6, SAH-80-18).'
    ApprovalInboxRow:
      type: object
      required: [requestId, transactionType, chip, subjectType, subjectId, subjectStoreId, what, raisedBy, raisedStore, raisedAt, waitingMinutes, ruleText, level, urgent, escalated, needsAnotherApprover, actions]
      properties:
        requestId: { type: string, format: uuid }
        transactionType: { $ref: '#/components/schemas/TransactionType' }
        chip: { type: string, enum: [INDENT, PURCHASE_ORDER, RATE_INCREASE, VENDOR_RETURN, TRANSFER, WRITE_OFF, STOCK_ADJUSTMENT, AUDIT_VARIANCE, DISCOUNT, SALES_RETURN], description: 'Labels Indent, Purchase order, Rate increase, Vendor return, Transfer, Write-off, Stock adjustment, Audit variance; 0.3.0 Discount, Sales return.' }
        subjectType: { type: string, enum: [PURCHASE_ORDER, GOODS_RECEIPT, DEBIT_NOTE, INDENT, TRANSFER, DAMAGE_REPORT, SHORTAGE, STOCK_ADJUSTMENT, STOCK_AUDIT, SALE_DISCOUNT, SALES_RETURN], description: '0.3.0 adds SALE_DISCOUNT (a discount request on a cart, pharmacy-sales.yaml) and SALES_RETURN.' }
        subjectId: { type: string, format: uuid }
        subjectStoreId: { type: string, format: uuid, description: 'The store path the client opens the document under. Required from 0.3.2 (always sent by the built code).' }
        what: { type: string, examples: ['IND-6012 · Ward 3B → Central Store · 4 items', 'Atorva 10 · ₹ 70.00 → ₹ 74.30 (+6.1%)', 'AUD-0093 · Ward 3B · − ₹ 412'] }
        amountPaise: { oneOf: [ { $ref: '#/components/schemas/Paise' }, { type: 'null' } ] }
        raisedBy: { $ref: '#/components/schemas/PersonRef' }
        raisedStore: { $ref: '#/components/schemas/StoreRef' }
        raisedAt: { type: string, format: date-time }
        waitingMinutes: { type: integer, minimum: 0, description: 'Shown "35 min", "2 h".' }
        ruleText: { type: string }
        level: { type: integer, enum: [1, 2] }
        urgent: { type: boolean }
        escalated: { type: boolean }
        needsAnotherApprover: { type: boolean }
        actions: { type: array, items: { type: string, enum: [REVIEW, REJECT, RECOUNT, APPROVE] }, description: 'Audit variance: RECOUNT and REVIEW; others REVIEW and REJECT. 0.3.0: DISCOUNT and SALES_RETURN rows also carry APPROVE (the direct button of mockup 14, BR-38), which calls pharmacyDecideApproval with decision APPROVED.' }
    ApprovalInboxPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items, counts, signedInAs]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/ApprovalInboxRow' } }
            counts: { type: object, required: [all, indents, purchase, stock], properties: { all: { type: integer }, indents: { type: integer }, purchase: { type: integer }, stock: { type: integer } } }
            signedInAs: { type: string, examples: [Owner, HOD · Ward 3B] }
    ApprovalRequest:
      type: object
      required: [id, transactionType, subjectType, subjectId, subjectNo, subjectStoreId, ruleStore, raisedBy, raisedAt, amountPaise, ruleVersionNo, status, currentLevel, levels, decisions, escalated, needsAnotherApprover, canDecide, decideLockReason, version]
      properties:
        id: { type: string, format: uuid }
        transactionType: { $ref: '#/components/schemas/TransactionType' }
        subjectType: { type: string }
        subjectId: { type: string, format: uuid }
        subjectNo: { type: [string, 'null'], description: 'null for a receipt waiting for rate-rise approval (numbered at posting).' }
        subjectStoreId: { type: string, format: uuid }
        ruleStore: { $ref: '#/components/schemas/StoreRef' }
        raisedBy: { $ref: '#/components/schemas/PersonRef' }
        raisedAt: { type: string, format: date-time }
        amountPaise: { $ref: '#/components/schemas/Paise' }
        ruleVersionNo: { type: integer, minimum: 0, description: '0.3.5 (D-5, tech lead decisions of 19 Nov 13:15 item 3 and 13:55 item 1; ADR-029 N4): the rule version kept at submission. 0 for a request raised before an owner first saved the approval rules: the engine applied the served Standard default (versionNo 0) and no version row exists (the request''s rule version link is empty); its levels are copied onto the request at submit as for any version. Saving the rules later does not change it. 1 and above: a saved version.' }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, WITHDRAWN] }
        currentLevel: { type: [integer, 'null'], enum: [1, 2, null] }
        levels:
          type: array
          maxItems: 2
          items:
            type: object
            required: [level, approver, ruleText, applies]
            properties:
              level: { type: integer, enum: [1, 2] }
              approver: { type: string, enum: [STORE_APPROVER, OWNER] }
              ruleText: { type: string }
              applies: { type: boolean }
        decisions:
          type: array
          items:
            type: object
            required: [level, decision, decidedBy, actingAs, decidedAt, reason]
            properties:
              level: { type: integer, enum: [1, 2] }
              decision: { type: string, enum: [APPROVED, REJECTED] }
              decidedBy: { $ref: '#/components/schemas/PersonRef' }
              actingAs: { type: string, enum: [HOD, DELEGATE, OWNER, ESCALATED] }
              decidedAt: { type: string, format: date-time }
              reason: { oneOf: [ { $ref: '#/components/schemas/ReasonRef' }, { type: 'null' } ] }
        escalated: { type: boolean }
        needsAnotherApprover: { type: boolean }
        canDecide: { type: boolean }
        decideLockReason: { type: [string, 'null'], enum: [SELF_APPROVAL, ALREADY_APPROVED_LEVEL_1, NOT_APPROVER, FINISHED, null] }
        version: { type: integer, minimum: 0 }
    ApprovalDecisionInput:
      type: object
      additionalProperties: false
      required: [clientKey, level, requestVersion, decision]
      properties:
        clientKey: { type: string, format: uuid }
        level: { type: integer, enum: [1, 2] }
        requestVersion: { type: integer, minimum: 0 }
        decision: { type: string, enum: [APPROVED, REJECTED] }
        reasonKey: { type: [string, 'null'], maxLength: 80, description: 'Required when REJECTED (list approval-reject).' }
        note: { type: [string, 'null'], maxLength: 300 }
        indentLines:
          type: [array, 'null']
          maxItems: 200
          description: 'INDENT only (SAH-79-10): every line once.'
          items:
            type: object
            additionalProperties: false
            required: [indentLineId, approvedQty]
            properties:
              indentLineId: { type: string, format: uuid }
              approvedQty: { $ref: '#/components/schemas/Qty' }
              remarkReasonKey: { type: [string, 'null'], maxLength: 80, description: 'Required when reducing or rejecting the line ("Remark (required when rejecting or reducing)"; list approval-reject).' }
              remarkNote: { type: [string, 'null'], maxLength: 300 }
        damageRejectOutcome: { type: [string, 'null'], enum: [RELEASE_TO_AVAILABLE, KEEP_IN_QUARANTINE, null], description: 'WRITE_OFF of a damage report, REJECTED only (SAH-79-14; OQ-79-19).' }
    StockOverview:
      type: object
      required: [store, skuCount, batchCount, stockValuePaise, pills, empty]
      properties:
        store: { $ref: '#/components/schemas/StoreRef' }
        skuCount: { type: integer, minimum: 0 }
        batchCount: { type: integer, minimum: 0 }
        stockValuePaise: { oneOf: [ { $ref: '#/components/schemas/Paise' }, { type: 'null' } ], description: '0.3.2: null for a blind caller while the store has an open audit (rule 24).' }
        pills: { type: object, required: [nearExpiry30, nearExpiry60, nearExpiry90, expiredQuarantined, lowStock, scheduleProducts], properties: { nearExpiry30: { type: integer }, nearExpiry60: { type: integer }, nearExpiry90: { type: integer }, expiredQuarantined: { type: integer }, lowStock: { type: integer }, scheduleProducts: { type: integer } } }
        empty: { type: boolean }
    StockStatusChip:
      type: string
      enum: [SALEABLE, EXPIRES_IN, EXPIRED_QUARANTINED, NEW_MRP, IN_TRANSIT, PENDING_RETURN, QUARANTINE]
      description: 'Saleable; Expires in <n> d; Expired · quarantined; New MRP; In transit; Pending return; Quarantine.'
    StockBatchRow:
      type: object
      required: [product, batch, state, qty, fefoRank, mrp, purchaseRate, landed, marginPercent, supplier, statusChip, daysToExpiry, canVendorReturn]
      properties:
        product: { $ref: '#/components/schemas/ProductRef' }
        batch: { $ref: '#/components/schemas/BatchRef' }
        state: { $ref: '#/components/schemas/StockState' }
        qty: { oneOf: [ { $ref: '#/components/schemas/Qty' }, { type: 'null' } ], description: '0.3.2: null for a blind caller when the product is on the store''s open audit (rule 24); otherwise always a number.' }
        fefoRank: { type: [integer, 'null'], minimum: 1, description: 'AVAILABLE unexpired rows only; "—" otherwise.' }
        mrp: { $ref: '#/components/schemas/Rate' }
        purchaseRate: { oneOf: [ { $ref: '#/components/schemas/Rate' }, { type: 'null' } ] }
        landed: { oneOf: [ { $ref: '#/components/schemas/Rate' }, { type: 'null' } ], description: 'OQ-79-6: equals the purchase rate per issue unit without GST.' }
        marginPercent: { type: [string, 'null'], pattern: '^-?[0-9]{1,3}\.[0-9]$', description: '(MRP − landed) ÷ MRP, one decimal.' }
        supplier: { oneOf: [ { type: object, required: [vendorId, name], properties: { vendorId: { type: string, format: uuid }, name: { type: string } } }, { type: 'null' } ] }
        statusChip: { type: array, items: { $ref: '#/components/schemas/StockStatusChip' } }
        daysToExpiry: { type: integer }
        canVendorReturn: { type: boolean }
    StockBatchPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/StockBatchRow' } }
