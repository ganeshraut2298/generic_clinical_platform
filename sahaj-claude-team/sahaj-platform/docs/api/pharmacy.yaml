      tags: [SAH-79-6]
      operationId: pharmacyReorderSuggestions
      summary: Reorder list of the Central Store ("Reorder suggestions · <n> items")
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability purchase: Central Store only; Central Store user, OWNER)'
      x-sub-story: SAH-79-6
      x-work-package: WP-E
      description: >-
        The store must be the Central Store, else 409 doc-state "Purchase orders are raised at the Central
        Store." (a non-central store has no purchase capability, so a mapped non-central user gets 403 first).
        Listed (OQ-79-31): products whose Central Store AVAILABLE unexpired stock plus the open quantity on
        APPROVED, SENT and PARTLY_RECEIVED purchase orders (in issue units) is at or below the Central Store
        reorder level; suggestedQty = reorder level minus that sum, converted up to whole purchase units, at
        least 1 (0 with openPoNo when an open PO already covers it; such a row is not preselected). 0.3.3, the
        reading as built (accepted by the tech lead, DEC-073): a row is listed when AVAILABLE unexpired stock at
        the Central Store plus the open purchase-order quantity (in issue units) is at or below the reorder level;
        need = reorder level minus that sum (issue units); suggestedQty = ceil(need / conversion) in purchase
        units, at least 1; suggestedQty is 0, with openPoNo set, only when the open order quantity makes the sum
        equal the reorder level exactly (need 0 and an open order exists). Columns: item
        and purchase unit, csStock, allStoresStock (OWNER only; null for others, OQ-79-21), openPoQty, openPoNo,
        suggestedQty, vendor (the product's preferred vendor, with blocked and needsReview) and lastRate (the last
        posted receipt rate per purchase unit from that vendor; null if none). No "Avg use / day" or best-vendor
        columns (Later). Paged. Expired AVAILABLE stock is first moved to QUARANTINE (rule 17). Blind count (rule
        24, 0.3.2): while the Central Store has an open audit, a blind caller (a Central Store user who is not its
        HOD or current delegate) gets csStock null on the rows of audited products; the row and suggestedQty stay
        (the suggestion is an order quantity, worked on the server).
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 1000, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: One page, content: { application/json: { schema: { $ref: '#/components/schemas/ReorderSuggestionPage' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation; bad-request' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: doc-state }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
