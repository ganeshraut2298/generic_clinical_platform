openapi: 3.1.0
info:
  title: Sahaj Pharmacy & Inventory API
  version: 0.3.5
  description: >-
    Changelog. 0.3.5 (19 Nov 2026, SAH-79 WP-F contract gaps: the tech lead's decisions of 19 Nov 13:40 (angular
    WP-F) and 13:55 (java round 6) under DEC-073 and DEC-082; programme DEC-061; ADR-029 N4). Additive or
    wording only: no path or status code is removed; one required request field becomes optional; response
    members are added. (a) PurchaseOrderCreate and PurchaseOrderUpdate: creditDays is optional and nullable;
    missing or null takes the vendor's credit days (the "From the vendor" hint of the reduced vendor view). (b)
    MyStore gains issuesFrom ({id, name}, nullable): the store this store's indents go to (the ACTIVE Central
    Store); null for the Central Store. (c) Dispatch and its lines define held (dispatched and not yet
    received, in transit) and back-order (approved minus dispatched so far, kept open by BACK_ORDER); field
    descriptions only. (d) pharmacyReceiveDispatch: "every dispatch line once" means every line not yet
    received; a PARTLY_RECEIVED dispatch can be received again with only the lines not yet received; a
    non-pharmacist sends Schedule X lines with skipped true and the dispatch stays PARTLY_RECEIVED; Dispatch.receipt
    is the latest receipt. (e) ApprovalSummary gains requestVersion and levelNo (required response members), so
    a card can decide without reading the request. (f) Rule 19 gains one table of the Schedule X capabilities:
    receiveScheduleX for receiving (goods receipt posting, receipt of a dispatch, the second-signers read as
    built), handleScheduleX for dispatch, accepting a return, settling a shortage, the vendor-return hand-over
    and the other movements; the server builds one capability RECEIVE_SCHEDULE_X for both (the same set today).
    (g) The seeded keys of the list receipt-reject belong to the contract; the expired-batch reason is
    receipt-reject.near-expiry ("Near expiry / expired"), as seeded since migration 1380: the 0.2.0 name
    receipt-reject.near-expiry-expired is corrected. (h) pharmacyDecideApproval: an indent approval with every
    approvedQty 0 answers 400 validation field indentLines "Reject the indent with a reason instead" (the
    0.2.0 "all lines 0 is a rejection" is replaced). (i) Indent.chips.rejectedWaitingCs is the rejected quantity
    still waiting for the Central Store to accept; shortInvestigating is the shortage quantity not yet settled.
    (j) D-5 detail: a request raised before any rule set was saved has no rule version row and
    ApprovalRequest.ruleVersionNo 0 (minimum lowered from 1 to 0). (k) pharmacyListVendors: Blocked vendors are
    listed with the mark for a Central Store user and are not offered on the purchase order, receipt and
    vendor-return forms; the server rules are unchanged. New problem codes: none.

    0.3.4 (19 Nov 2026, SAH-79 review round 5, DEC-082 (security M3, L15, L17, L18, I17 to I21; code
    review n-5), QA D-5 and D-7 (tech lead decisions of 19 Nov 12:45), the BA wording handoff of 19 Nov 10:50;
    programme DEC-061; ADR-029 P7 and N4). Additive or wording only: no path, status code, required request field
    or enum value is removed; response members only widen to null. (a) Security M3, the vendor view by who reads:
    an OWNER or a PHARMACIST member gets the full vendor record; any other caller (whose vendor read comes only
    from a store mapping: the Central Store user mapping of rule 3, or the purchase capability of the
    suppliesStoreId filter) gets the reduced view on GET /vendors and GET /vendors/{vendorId}: id, name, status,
    blocked and version filled; gstin, licenceRequired, licenceNo, licenceValidTill, licenceState, contactName,
    contactPhone, creditDays, returnDaysBeforeExpiry, returnCreditPercent, damagedCreditPercent,
    expiredCreditPercent, suppliesTo and productsCount null. Vendor.licenceRequired, licenceState, creditDays,
    suppliesTo and productsCount become nullable (the others were). Rule 3 and the two read descriptions say so.
    (b) L17: SecondSigner.membershipId is required (it was) and pin has the pattern ^[0-9]{4}$; a missing
    membershipId or a pin that is not four digits answers 400 validation (field secondSigner "A second signature
    is needed for Schedule X items." or secondSigner.pin "Enter a 4-digit PIN.") before any eligibility or PIN check, so no
    colleague try is counted. (c) L18: pharmacyGetApprovalRequest is readable only by the current approver, the
    raiser, an OWNER, a person who decided a level, or a person with the document's own read capability at the
    subject store (purchase for a purchase order, a goods receipt and a debit note; adjustStock for a stock
    adjustment; for the other subject types the capability the document's own GET names); anyone else 404. (d)
    QA D-5: before the first save the approval rules are the Standard preset (versionNo 0) and the engine applies
    them as served: a purchase order (submit) and a stock adjustment (create) go to the owner (WAITING_APPROVAL),
    as every other rule of the preset. Said in pharmacyGetApprovalRules, pharmacySubmitPurchaseOrder and
    pharmacyCreateStockAdjustment and rule 18. (e) The indent chip (BA handoff, tech lead decision 2): an indent
    stays PARTLY_DISPATCHED with the chip "· Schedule X lines waiting for a pharmacist" (new
    response member Indent.chips.scheduleXWaiting, the count of such lines) while one of its dispatches has Schedule X lines not yet received; the indent has no
    PARTLY_RECEIVED status (the dispatch has it). (f) pharmacyCreateGoodsReceipt with purchaseOrderId and lines []
    creates an empty DRAFT linked to the order: the server cannot invent batch, expiry or MRP, so it fills no
    lines; the client sends its own lines (with purchaseOrderLineId) by PUT. The earlier text that said the lines
    are filled from the order is corrected. (g) Security I21: a body of up to 128 KB is accepted on the write
    paths under /stores/{storeId}/purchase-orders and /stores/{storeId}/goods-receipts (POST and PUT); every
    other operation keeps 64 KB (rule 12, PayloadTooLarge). (h) L15, the replay rule (rule 10 reworded): a
    clientKey is kept per member; the same member, the same operation and the same subject (store, document and
    action) answers the first result again (200, nothing written), also when two such requests race; the same
    key by the same member for another operation or another subject, or by another member, answers 409
    client-key-reused. (i) QA D-7: q on pharmacyListStockBatches has 2 to 60 characters; one character answers 400
    validation, field q "Type at least 2 characters." (the schema already said minLength 2). (j) I17 and I18, known
    and accepted (go-live G-14): a credit note's amount is typed from the vendor's credit note and does not
    depend on the debit note's total; the difference is shown on the debit note (differencePaise) and recorded in
    the audit. Receiving more than a purchase order line ordered is allowed (vendors over-supply; code review n-5);
    no cap. New problem codes: none.

    0.3.3 (19 Nov 2026, SAH-79 WP-E contract gaps found by the WP-E screens, the tech lead's decisions
    of 19 Nov 08:50 under DEC-073, programme DEC-061; DEC-080 m-4). Additive or wording only: no path, status
    code, required request field or enum value is removed. (a) GoodsReceipt.lines[] gains purchaseOrderLineId
    (nullable; the purchase order line it receives; sent back on PUT in GoodsReceiptLineInput). (b)
    DebitNote.lines[] gains goodsReceiptLineId (nullable; the receipt line a short-supply line came from), so a
    DRAFT debit note prepared by a receipt can be edited. (c) GoodsReceipt gains needsApproval (the
    GRN_RATE_RISE rule applies to the DRAFT as saved, so it must be approved before posting). (d) ProductRef
    gains gstPercent (the product's current GST %). (e) defaultCreditPercent of a pharmacyVendorReturnEligible
    row is the starting credit as the server works it (damaged level, after-expiry level, the lower of the two
    when both apply, a null level counted as the standard credit before comparing, else the standard credit);
    the client uses it as given. (f) GET /vendors gains the query filter suppliesStoreId; with it a caller with
    the purchase capability at that store may read the list without SETUP_VIEW. (g) Wording: the
    second-signers read is guarded by "the Schedule X handling capability (receiveScheduleX in StoreAccess)",
    which the server names RECEIVE_SCHEDULE_X. (h) pharmacyReorderSuggestions states the reading as built:
    listed when AVAILABLE unexpired Central Store stock plus the open purchase order quantity (issue units) is
    at or below the reorder level; suggestedQty = ceil(need / conversion), at least 1; 0 with openPoNo when an
    open order covers the level exactly. (i) IndentStatus: an indent stays PARTLY_DISPATCHED while a back-order
    is open and becomes RECEIVED only when every approved quantity is dispatched and received; the
    "back-order open" chip on RECEIVED is removed (the mockup label "Received · <product> back-order open" is
    PARTLY_DISPATCHED with every dispatch received).
    0.3.2 (19 Nov 2026, SAH-78 review round 4 and SAH-79 WP-D follow-ups, programme DEC-061; DEC-080;
    ADR-029 P7 list and note N3). Additive or wording only: no path, status code, required request field or enum
    value is removed; the changes to response schemas only widen a type to null or make an always-sent member
    required. (a) DEC-080 L12, blind count: new general rule 24. While a store has an open stock audit, a caller
    who has count but not reviewCount at that store gets null for every quantity (and every value worked from
    quantities) of the audited products in that store, on every read of this API and in the members
    insufficient-stock available and changed current; the quantity fields concerned become nullable
    (StockOverview.stockValuePaise, StockBatchRow.qty, the low-stock row available, FefoPick availableQty, shortBy
    and batches quantity, StoreStateRow available, inTransit, pendingReturn and quarantine, StockAdjustment
    bookQty and physicalQty, the stock ledger line qtyIn, qtyOut and balance, the reorder suggestion csStock,
    the vendor-return eligible availableQty, the indent line requestingStoreAvailable and stockImpact
    csSaleable, requestingAvailable and pendingReturn, ReplacementOption csAvailable, Problem available). Each
    stock read names the rule. (b) New operation pharmacyListSecondSigners GET
    /stores/{storeId}/second-signers (SAH-79-5, WP-D; OPERATION, capability handleScheduleX): the other ACTIVE
    pharmacists and owners of the clinic who may sign a Schedule X handling as second signer, never the caller;
    membershipId, name, roleLabel; no mobile number. (c) ApprovalInboxRow.subjectStoreId is required (it was
    always sent). (d) BELOW_REORDER and the low-stock list use one rule: AVAILABLE unexpired quantity at or below
    the store's reorder level (the 0.2.0 wording "below the level" on pharmacyProductStockAllStores is
    corrected; the built code already uses "at or below"); INDENT_IN_TRANSIT is the same condition with units in
    transit to the store. (e) x-store-access of pharmacyProductStockAllStores and pharmacyProductStockMyStore is
    explicit for a person with no mapping: the all-stores read answers rows [] with a zero total and empty true;
    the my-store read is an OPERATION and answers 404 for an unmapped store (the client does not call it then).
    (f) pharmacyRejectOpeningStockImport: 409 import-state for any state other than DRAFT and WAITING_APPROVAL
    has the detail "This import can no longer be changed." (the code is being aligned). (g) Known limit (security
    I16, accepted by DEC-080): prefix-in-use compares only the prefixes in use now, so a prefix another document
    type gave up can be taken again; tax invoices (BILL) keep the financial-year part, so their numbers stay
    unique. New problem codes: none.

    0.3.1 (19 Nov 2026, SAH-78 QA clarifications, programme DEC-061; ADR-029 note N2). Wording and
    examples only, additive: no path, status code, required field, enum value or behaviour changes. (a) D-3:
    pharmacyAddOpeningStockLines, "a bad body after the cap" is a body read as JSON that breaks a field rule (409
    import-state); a body that is missing, not JSON or malformed still answers 400 malformed-request right after
    the path-id check (general rule 2), also after the cap. (b) DocumentSeries.numbersIssued means a number of
    the current financial year was issued, and the series is then locked (409 series-locked). (c)
    highValueThresholdPaise has the schema maximum 9,999,999,900 paise (₹ 9,99,99,999), the same as the amount
    limit, message "Enter an amount up to ₹ 9,99,99,999" (the 0.1.x maximum 99,999,999,900 is corrected as
    DEC-078 corrected amountPaise). (d) General rule 9 says where a master's version starts; the vendor examples
    follow it (a new vendor answers version 0). (e) Stale wording on the vendor credit levels removed: the two
    levels damagedCreditPercent and expiredCreditPercent exist since 0.2.1.

    0.3.0 (18 Nov 2026, SAH-80 Pharmacy & Inventory Phase 3: Pharmacy, sub-stories SAH-80-1 to
    SAH-80-22, work packages WP-I to WP-N; WP-O (80-23) not built; design ADR-030 (proposed); decisions DEC-074
    and DEC-072 Q2). Additive only: no existing path, status code, required field or enum value is removed or
    changed. The SAH-80 operations are in the sibling file docs/api/pharmacy-sales.yaml (same base path
    /api/v1/pharmacy, same general rules 1 to 23, shared components referenced from this file; ADR-030 S1 says
    why). This file gains only the SAH-78 touch-ups of TP-10 that SAH-80 needs on existing components: StoreRole
    CASHIER; StoreAccess sale capabilities (response-additive); PharmacyContext capabilities for the Pharmacy
    tab; DocType CREDIT_NOTE and IPD_ISSUE_SLIP; ListKeyValue nine sale lists; UnitSettings and
    UnitSettingsInput return window, refund modes and Schedule X licence (optional in input); the Integration
    mode guard 409 open-integrated-documents on pharmacyPutUnitSettings; ndps on own products (optional in
    input); LedgerTransaction sale values; TransactionGroup SALES and the inbox row values for SALE_DISCOUNT and
    SALES_RETURN with the direct APPROVE action; ReportKey six Sales & compliance keys. New problem codes in this
    file: open-integrated-documents (409); cashier-not-allowed is a validation message, not a code.

    0.2.1 (18 Nov 2026, SAH-78 hardening; DEC-076, DEC-077, DEC-078; ADR-028 revision 7, ADR-029 note
    N1). Additive or wording only: no existing path, status code, required field or enum value is removed or
    changed. (a) DEC-076: pharmacyRejectOpeningStockImport accepts an import in DRAFT as well as in
    WAITING_APPROVAL (an OWNER with the approve capability at the store); 409 import-state now means any other
    state; the uploader can still replace their own draft. (b) DEC-077: pharmacyAddOpeningStockLines caps
    changed rows written, at most 2 x rowCount per import (line_rows_written), instead of the request count of
    0.1.3; a request whose rows are all unchanged writes nothing and does not count; the over-cap request and
    any request after the cap (a bad body included) answer 409 import-state. pharmacyStartOpeningStockImport
    allows at most 10 new imports per person per store per IST day; the 11th answers 409 import-limit "Too many
    files today. Try again tomorrow." Start, submit and approve take the store row lock first and answer 404
    for a store switched off meanwhile; line writes and product edits lock the product row. (c) DEC-078: the
    amount limit of an approval condition and of a preset limit is at most ₹ 9,99,99,999 (schema maximum
    9,999,999,900 paise; the 0.1.x maximum 99,999,999,900 was ten times the text and is corrected);
    GRN_RATE_RISE takes a percentage only (ALWAYS or ABOVE_PERCENT); ApprovalRules gains presets[] with
    limitTypes (response-additive); PUT /document-series/{docType} answers 409 series-locked "Numbers have
    already been issued this year." once a number of the current financial year was issued; the reason item
    gains fixed (response-additive) and receipt-reject.short cannot be switched off (409 last-active-reason
    "This reason is fixed."); new operation pharmacySwitchOnVendor POST /vendors/{vendorId}/switch-on
    (SETUP_EDIT, idempotent); Vendor, VendorInput and VendorUpdate gain the optional, nullable
    damagedCreditPercent and expiredCreditPercent (they apply in SAH-79 WP-E vendor returns). New problem
    codes: import-limit, series-locked (409). The Problem schema is unchanged.

    0.2.0 (18 Nov 2026, SAH-79 Pharmacy & Inventory Phase 2: Inventory, sub-stories SAH-79-1 to
    SAH-79-19, work packages WP-D to WP-H; design ADR-029 (proposed) and ADR-028 revision 6; go-ahead DEC-072,
    which accepted the recommended answer of every SAH-79 open question). Additive only: every 0.1.3 path,
    status code, required request field and enum value is unchanged. Added: the Phase 2 operations (each
    carries x-sub-story and x-work-package), their schemas and problem types; StoreAccess gains Phase 2
    capability fields (response-additive); PharmacyContext capabilities gains INVENTORY, APPROVALS_INBOX,
    PURCHASE, STOCK_REPORTS, PURCHASE_REPORTS, CONSUMPTION_PATIENT; DocType gains DEBIT_NOTE, STOCK_AUDIT,
    STORE_RETURN, DAMAGE_REPORT, STOCK_ADJUSTMENT (OQ-79-14); ListKey gains receipt-reject, cs-change,
    approval-reject, transfer, consumption-purpose, dispute, vendor-return (OQ-79-15); OpeningStockImport.posted
    is a boolean (was const false) with postedAt and postedBy; Store gains linkedWard; PUT /approval-rules also
    accepts ABOVE_PERCENT for GRN_RATE_RISE (OQ-79-10). Mockup: P&I files 06 to 15 (and 17) in
    docs/handoffs/PHI-input/screens/.

    Phase 2 general rules (0.2.0, in addition to rules 1 to 14 below).
    (15) Store guard kinds. x-store-access OPERATION and MASTER as in rule 4. New kind SCOPED (reports, the
    all-stores stock view): the server first works out the stores the caller can reach for the operation's
    capability (OWNER every ACTIVE store; others their ACTIVE mappings to ACTIVE stores); a storeId query value
    outside that set answers 404 not-found exactly as the path guard; no storeId means every reachable store.
    It runs before any other filter, sort or paging (BR-1).
    (16) Capabilities named in x-store-access are the StoreAccess fields (ADR-029 P8), derived on every request.
    Pharmacist-only actions are never available to OWNER (ADR-028 D4).
    (17) Stock (ADR-029 P3, P4). Stock is held per store, product, batch and state (AVAILABLE, IN_TRANSIT,
    PENDING_RETURN, QUARANTINE). Only AVAILABLE stock of an unexpired batch is issued, dispatched, transferred
    or consumed, picked by FEFO (earliest expiry, then earliest received); the client never names the batch of
    such an issue. A batch is usable through expiryDate (the last day of its month, OQ-79-7) and expired from
    the next day (IST). Every movement writes ledger lines in the same transaction as its document, all or
    nothing. A movement that would take a balance below zero answers 409 insufficient-stock with available
    (and lines), nothing written. Stock reads of a store first move that store's expired AVAILABLE stock to
    QUARANTINE (ledger EXPIRY_QUARANTINE, user "System"); this is the only write a read does. Quantities are
    whole issue units unless a field says purchase units.
    (18) Approvals (ADR-029 P6). A document covered by an approval rule is submitted to the engine; level 0
    proceeds at once (no request is created); otherwise approval.status PENDING ("Waiting for approval").
    Decisions are taken only with POST /approvals/{requestId}/decision. Nobody decides their own request (403
    self-approval; also a database check); the same person cannot approve both levels; a second decider gets
    409 already-decided. The rule version is kept at submission. 0.3.4 (QA D-5): before an owner first saves
    the approval rules, the engine applies the Standard preset served by GET /approval-rules (versionNo 0).
    0.3.5 (D-5 detail, ADR-029 N4): such a request has no rule version (no version row is written for it;
    nobody is shown as having saved the default) and answers ApprovalRequest.ruleVersionNo 0; its levels are
    copied onto the request at submit, as for a saved version. GET /approval-rules/versions lists saved
    versions only (1 and above).
    (19) Schedule X (ADR-029 P7, BR-32, OQ-79-8). Handling a Schedule X line needs a caller whose team role is
    PHARMACIST and who is mapped to the store (never OWNER), else 403 schedule-x-pharmacist; and secondSigner
    (another ACTIVE pharmacist or owner, checked with the colleague PIN before the transaction): missing 400
    validation field secondSigner "A second signature is needed for Schedule X items."; not eligible 403
    second-signer-invalid; the platform PIN outcomes wrong-pin (403), pin-locked (403), pin-not-set (409),
    rate-limit (429), colleague-pin-limit (429), pin-unavailable (503), pin-check-failed (503). The PIN is never
    stored, logged, audited or echoed. 0.3.2: the client offers the people of GET
    /stores/{storeId}/second-signers; the database also refuses a Schedule X ledger line by a person without a
    signer for the person-driven transaction types listed in ADR-029 P7 (DEC-080 L14), so a missed service check
    rolls the whole transaction back and saves nothing, never a single-signature movement (a backstop, not a
    client-facing rule: the service answers first as above).
    0.3.5, the Schedule X capabilities (one table; tech lead decision of 19 Nov 13:40, item 3; ADR-029 N4).
    Two StoreAccess flags name "the pharmacist" of this rule. Both are true only for a member whose team role
    is PHARMACIST and who is mapped to the store (receiveScheduleX also needs receive there, which every
    ACTIVE mapping has), never for OWNER, STORE_STAFF, a nurse or a CASHIER; for a mapped pharmacist they are
    the same set today. The server builds one capability, RECEIVE_SCHEDULE_X, and checks it for both rows.
    A caller without the row's flag on a Schedule X line answers 403 schedule-x-pharmacist; the operation's
    own capability (x-store-access) is checked first.
      | Flag (server name)                     | Used for   | Operations (Schedule X lines only)                                  |
      | receiveScheduleX (RECEIVE_SCHEDULE_X)  | receiving  | pharmacyPostGoodsReceipt (posting a receipt with Schedule X lines);  |
      |                                        |            | pharmacyReceiveDispatch (receipt of a dispatch, lines skipped false);|
      |                                        |            | pharmacyListSecondSigners (the signers read, as built)               |
      | handleScheduleX (RECEIVE_SCHEDULE_X    | handling   | pharmacyDispatchIndent and pharmacyDispatchTransfer (dispatch);      |
      |   until a separate one is built)       |            | pharmacyAcceptReturnItem (accepting a return);                       |
      |                                        |            | pharmacySettleShortage (settling a shortage, outcome FOUND);         |
      |                                        |            | pharmacyHandOverDebitNote (the vendor-return hand-over);             |
      |                                        |            | and the other movements: pharmacyCreateStockAdjustment,              |
      |                                        |            | pharmacyCreateStoreReturn, pharmacyCreateDamageReport,               |
      |                                        |            | pharmacyCreateConsumption, pharmacySubmitCount,                      |
      |                                        |            | pharmacySubmitVarianceForApproval; pharmacySaveCounts needs the flag |
      |                                        |            | but no second signature                                              |
    Every row except pharmacySaveCounts also needs secondSigner as above. The signers read: as built it
    requires RECEIVE_SCHEDULE_X (receiveScheduleX); because the handling operations need a second signer too,
    the contract allows it to a caller with receiveScheduleX or handleScheduleX at the store. Today the two
    sets are equal, so the built check is correct; if the flags ever differ, the read must accept either.
    (20) Documents (ADR-029 P9). Every document has version; a write with an old version answers 409 changed
    with current. A number is taken from the unit's series in the step that first submits or creates the
    document (a receipt: when it is posted); drafts have none and can be discarded; a cancelled document keeps
    its number; nothing is hard-deleted. Every document answers history (who, capacity, store, time, before and
    after quantity, reason). Every create and every post carries clientKey (rule 10; a replay answers the
    current state of the first result with 200). Documents have at most 200 lines (OQ-79-35).
    (21) Reasons (C-5). reasonKey must be an active reason of the list the field names (GET /reasons); a key
    ending in .other needs note of 4 to 300 characters "Write at least 4 characters"; otherwise note is optional
    (at most 300).
    (22) Privacy. Patient-wise consumption stores the admission id only; lists, reports, exports and the ledger
    show the IP number, never a patient name; only GET .../admitted-patients answers names, for the nurse to
    verify the patient (audited, ids only). Batch numbers, quantities, vendor data and patient data are never
    written to application logs (ids, counts and outcome codes only).
    (23) Money (rule 6) also covers: purchase order and receipt rates per purchase unit (Rate, up to 4
    decimals), line amounts rounded half up to the paisa, GST per line on the taxable value (ADR-028 D10).
    Landed, margin and stock value follow OQ-79-6 (go-live item G-13); GST on debit notes OQ-79-13 (G-14).
    Problem types added in 0.2.0: schedule-x-pharmacist, second-signer-invalid (403); changed, already-decided,
    already-posted, not-approved, insufficient-stock, batch-mrp-mismatch, batch-expired, vendor-blocked,
    duplicate-invoice, doc-state, adjustment-waiting, audit-open, stock-moved, export-too-large (409);
    invoice-total-mismatch, range-too-long (400); and the platform PIN problems of rule 19.
    (24) Blind count (0.3.2; DEC-080 L12; BR-30; ADR-029 P12 and note N3). A store has an open stock audit
    while one of its audits is COUNTING, RECOUNT, WAITING_REVIEW or WAITING_APPROVAL (at most one, 409
    audit-open). The audited products are the products with at least one line on that audit. A caller is blind
    at that store when the caller's StoreAccess there has count true and reviewCount false (a mapped Store user,
    Central Store user or pharmacist who is not the store's HOD or current delegate); an OWNER, the HOD and the
    current delegate are never blind. For a blind caller, every quantity of an audited product in that store,
    in any state, is answered as null: units held (available, in transit, pending return, quarantine, a batch
    row quantity, a book or physical quantity of a stock adjustment, a FEFO pick quantity, availableQty and
    shortBy), the ledger lines (qtyIn, qtyOut, balance) and every money value worked from such units (the
    store's stockValuePaise, a report value cell). A total that includes a hidden quantity is null as well
    (the "Unit total" row of the all-stores read). Rows are still listed: which batches exist is on the count
    sheet anyway. Settings and statuses stay (reorderLevel, StoreStateRow.status, the low-stock list and its
    pill, statusChip, expiry): they say at most "at or below the reorder level", never a number of units.
    Document quantities that record a movement a person made (ordered, approved, dispatched, received,
    consumed, returned) stay. In problems: insufficient-stock answers available and lines[].available null
    for an audited product, and 409 changed on pharmacyCreateStockAdjustment answers no current (a blind caller
    cannot know the book quantity, so the adjustment of an audited product waits for the audit: the variance
    review posts the count). The rule is worked out on every request after the store guard (or per store of a
    SCOPED read), inside the read's transaction, from the audit status at that moment; it ends when the audit
    is CLOSED. The client shows "—" for a null quantity, as for any null. The count sheet (CountSheetLine)
    never has a system quantity for anyone, as before. Operations that apply it: pharmacyStockOverview,
    pharmacyListStockBatches, pharmacyGetProductStock, pharmacyListLowStock, pharmacyFefoPick,
    pharmacyProductStockAllStores, pharmacyProductStockMyStore, pharmacyListStockAdjustments,
    pharmacyCreateStockAdjustment (problems), pharmacyGetStockAdjustment, pharmacyReorderSuggestions,
    pharmacyStockLedgerReport and its export, pharmacyRunReport and pharmacyExportReport (store-stock,
    batch-expiry, below-reorder; an empty CSV cell), pharmacyVendorReturnEligible (availableQty),
    pharmacyGetIndent (requestingStoreAvailable, csStock, stockImpact csSaleable, requestingAvailable and
    pendingReturn, each by the caller's access at the store that holds the stock), pharmacyIndentReplacementOptions
    (csAvailable), pharmacyGetTransfer (availableAtSender), and the insufficient-stock answer of every movement. A
    caller blind at one store sees another store's quantities as usual. pharmacy-sales.yaml follows the same
    rule for its stock fields when SAH-80 is built (ADR-029 note N3). A QA
    test asserts that no quantity of an audited product reaches a blind caller through any endpoint.

    0.1.3 (18 Nov 2026, SAH-78 review round 2, DEC-071; ADR-028 revision 5): additive only. (a) New
    409 problem open-import "Finish or reject the opening stock file of this store first." (DEC-071 Q1 option
    A, code review N-2): pharmacyUpdateStore (a code change) and pharmacySwitchOffStore refuse it while the store
    has a DRAFT or WAITING_APPROVAL opening-stock import; pharmacyUpdateOwnProduct (a purchaseUnit, issueUnit or
    conversion change) and pharmacyPutLocalSettings (active true to false) refuse it while the product is on a
    line of a DRAFT or WAITING_APPROVAL import. (b) pharmacyAddOpeningStockLines: at most 2 x ceil(rowCount /
    200) accepted line requests per import, the next one 409 import-state (existing code); a row sent again with
    the same seven cells writes nothing (security L8). (c) General rule 2 says where an unreadable body is
    answered (code review N-9), and the 400 malformed-request answer that is already built is added to the list
    of problem types. (d) The template example row uses the placeholder product code PRODUCT-CODE (N-13). (e)
    Known limits: paise totals and JavaScript number precision (N-12); CSV export formula prefixes, for SAH-79
    (security I3). No path, status code, required list, field name, type, enum or schema shape changed.

    0.1.2 (18 Nov 2026, SAH-78 WP-B as built; ADR-028 revision 4): wording only. It records ten
    choices the java-developer made where 0.1.1 was silent or loose, accepted by the tech lead as defaults: PUT
    /products/{productId} runs the duplicate check only when the salt, strength and form key changes; Local
    settings keeps an unchanged preferred vendor that is now Blocked or Inactive, leaves storeSettings entries
    that are not sent unchanged, refuses active false only for an active product with stock, and checks the
    barcode only when the product will be ACTIVE; opening-stock errorCount counts rows, rowIssues lists ERROR
    issues only, DRAFT counts are live; batch repeat and row codes ignore case; approveLockReason is set only
    while WAITING_APPROVAL; unitsLocked equals hasStock; own products have ndps false; the barcode search term
    matches exactly; uploader and decider are membership ids. No path, status code, required list, field name,
    type or enum changed.

    0.1.1 (18 Nov 2026, SAH-78 WP-A review, code review F-11, DEC-068; ADR-028 revision 3): GET
    /staff-candidates storeId is optional (additive, backward compatible: a request with storeId answers exactly
    as in 0.1.0); the delegate limit is worded as at most 90 calendar days counting both the start and the end
    date (DEC-068 Q1 A). No status, check order, required field or schema shape changed.

    0.1.0 (17 Nov 2026, SAH-78 Phase 1 Masters, stories SAH-78-1 to SAH-78-10; design ADR-028 revision 2;
    decisions DEC-061, DEC-062, DEC-063). Module pharmacy (schema pharmacy, package com.sahaj.pharmacy). Mockup:
    P&I mockup screen 16 "Setup: stores, staff, products, vendors" (accepted design addition, DEC-061 Q1); the
    sections unit settings, approval rules, numbering / reasons / print templates and opening stock follow the BA
    section layout accepted by DEC-062 Q1 (NEW). Phase 1 configures masters only: no stock ledger, no document
    number is issued, nothing is posted, no OPD or IPD data is read or written.

    General rules (every operation).
    (1) Tenant: the clinic comes from the signed-in user's session, never from a request. One clinic account is
    one P&I unit (ADR-028 D2); no path or body carries a unit or tenant id. Another clinic's record answers 404
    not-found (row-level security). The global product catalogue has no tenant and is read-only to everyone.
    (2) Check order: no valid session 401 unauthorized; the membership is re-read inside the transaction
    (switched-off or removed member 401 as today; at most 60 s, BR-6); the clinic's Pharmacy & Inventory module
    off (platform.module_entitlement.pharmacy_on false, the default) 403 module-off "Pharmacy & Inventory is not
    switched on for your clinic."; then the access level of the operation (x-required-role) 403 forbidden "You do
    not have access to this."; then a path id that is not a UUID 400 bad-request; then 404; then, for store
    operations, the store guard (rule 4); then body validation 400 validation (all field errors together); then
    state and conflict checks 409; then content checks 422.
    Body order (0.1.3, code review N-9): a request body that cannot be read (missing, not JSON or malformed
    JSON, a field the body does not list, or a value of the wrong JSON type) answers 400 right after the path-id
    check and before the 404 and the store guard: malformed-request "The request body is missing or is not
    valid JSON." (no fieldErrors), or validation with one field error (field body "Send only the fields listed
    for this request." for an unknown field; the field's own name for a value of the wrong JSON type, its value
    never echoed); the field rules of a readable body (required, length, pattern, range, cross-field) stay after the 404 and
    the store guard. This leaks nothing: it runs after module-off and the access level, and its answer is the
    same whether the record exists or not.
    (3) Access levels (ADR-028 D4, revised for the Store staff team role, DEC-062 Q3). SETUP_EDIT = OWNER only
    (the BRD Unit admin). SETUP_VIEW = OWNER, any PHARMACIST member, or any member with an ACTIVE Central Store
    user mapping (OQ-78-8). 0.3.4 (DEC-082, security M3): what SETUP_VIEW shows of a vendor depends on who
    reads. An OWNER or a PHARMACIST member gets the full vendor record; a member whose SETUP_VIEW comes only from
    a Central Store user mapping (and a caller let in by the suppliesStoreId filter of GET /vendors) gets the
    reduced vendor view of the Vendor schema: id, name, status, blocked and version; every other vendor member
    null. The other masters are unchanged. PHARMACY_ACCESS = OWNER, any PHARMACIST member, or any member with at least one
    ACTIVE mapping to an ACTIVE store; everyone else (for example front desk, counsellor or an unmapped Store
    staff member) gets 403 forbidden with detail "You do not have access to Pharmacy & Inventory. Ask your
    owner." on every operation of this API. The Store staff team role (platform Role STORE_STAFF, platform.yaml
    0.2.0) gives nothing by itself: it reaches P&I only through store mappings, only as Store user or Central
    Store user, and never gets Schedule X.
    (4) Store guard (StoreAccessGuard, ADR-028 D4). Operations marked x-store-access OPERATION act inside one
    store named by {storeId}; the server never trusts a "current store" from the client. Order: a store of
    another clinic, an unknown id, a switched-off store, or a store the caller is not mapped to (OWNER excepted)
    answers 404 not-found (the store is not confirmed to an unmapped user; DEC-063 Q1); mapped but the needed
    store capability is missing 403 store-permission-denied "You cannot do this in this store." (audited
    PHARMACY_STORE_ACCESS_DENIED, ids only). Operations marked x-store-access MASTER read or change the store as
    a master record: they are gated by SETUP_VIEW or SETUP_EDIT, not by a mapping, and answer 404 only for an
    unknown or foreign id.
    (5) Integration mode (ADR-028 D5). An operation that exists only in Integrated mode answers 409
    integration-off (components/responses/IntegrationOff) when the unit is Standalone. No 0.1.x operation is
    Integrated-only: Phase 1 has no OPD or IPD feature, so integrated capabilities are never listed in GET
    /context; the switch and GET /context are live (ADR-028 D5).
    (6) Money: document amounts and limits are integer paise (int64), shown as ₹ 1,25,000. Unit rates (MRP and
    purchase rate per issue unit) are decimal strings in rupees (stored numeric(14,4); Phase 1 input accepts at
    most 2 decimals). Percentages are decimal strings with at most 2 decimals. Quantities are whole numbers of
    the issue unit. Calendar dates are Asia/Kolkata (IST) dates, YYYY-MM-DD; instants are date-time (UTC).
    (7) Writes are audited through platform.api.AuditLog in the same transaction (action names on each
    operation, before and after values of ids and fields). Masters hold no patient data; names of stores,
    products and vendors, GSTIN and licence numbers may appear in audit values. Contact phone numbers, file
    contents, batch numbers and quantities are never written to application logs (ids and counts only).
    (8) Nothing is hard-deleted: masters are switched off (status) and keep their history (BR-4).
    (9) Optimistic locking: every changeable record carries version; a PUT with an old version answers 409
    settings-changed (or rules-changed) with the current record in the problem member current, and nothing is
    overwritten. Where version starts (0.3.1, wording of the built behaviour, QA finding on the vendor example):
    every write that changes a record adds 1 to its version. A master created by a POST (store, staff mapping,
    own or adopted product, vendor) answers version 0 on create, and its first change makes it 1. A settings row
    that is served as defaults until first saved (document series, print template) answers version 0 with saved
    false while unsaved, and its first save stores and answers 1; the two kinds therefore agree that the first
    change of what the client read as version 0 answers 1. Unit settings carry the version of the unit row.
    Reasons carry no version. Approval rules use versionNo and baseVersionNo instead (an immutable version per
    save). A client always sends back the version it last read and never assumes a starting value.
    (10) Creates that a double tap could repeat carry clientKey (UUID). The same clientKey from the same caller
    answers the first result again (200, nothing written); from a different caller 409 client-key-reused.
    0.3.4 (DEC-082, security L15), the full replay rule: a clientKey is kept per member with the operation and
    its subject (the store, the document and the action). The same member, the same operation and the same
    subject answers the first result (200, nothing written again), also when two such requests arrive at the
    same moment (the second one waits for or re-reads the first one's key and answers as a replay, never a
    second create). The same key by the same member for another operation or another subject, or the same key
    by another member, answers 409 client-key-reused, nothing written.
    (11) Errors are RFC 9457 application/problem+json, type https://sahaj.in/problems/<slug>; slugs are written
    without the prefix. Field errors are 400 validation with fieldErrors (the existing Sahaj convention; no
    existing contract uses 422). 422 is used for one case only: an opening-stock import whose rows fail the
    content checks (opening-stock-invalid), where the request itself is well formed.
    (12) A path id that is not a UUID answers 400 bad-request (components/responses/BadRequest). A body over 64
    KB answers 413 payload-too-large. 0.3.4 (DEC-082, security I21): the write operations (POST and PUT) under
    /stores/{storeId}/purchase-orders and /stores/{storeId}/goods-receipts accept a body up to 128 KB (a full
    200-line receipt is about 66 KB); over 128 KB they answer 413. Every other operation keeps 64 KB. A database lock wait or timeout answers 503 database-busy (nothing saved;
    retry with the same clientKey). These three apply to every operation and are listed on each.
    (13) Lists are paged with page (0-based) and size and answer items, total, page and size, unless the
    operation says the list is small and complete.
    Problem types of this API: unauthorized (401); forbidden, module-off, store-permission-denied, self-approval
    (403); not-found (404); validation, bad-request, malformed-request (0.1.3), global-fields-read-only (400);
    settings-changed, rules-changed, client-key-reused, central-store-missing, central-store-exists,
    central-store-in-use, store-inactive, store-name-in-use, store-code-in-use, store-has-stock, already-mapped,
    approver-exists, possible-duplicate, barcode-in-use, units-locked, product-has-stock, product-withdrawn,
    vendor-name-in-use, prefix-in-use, reason-exists, last-active-reason, import-state, import-incomplete,
    import-waiting, opening-stock-already-approved, open-import (0.1.3), integration-off, import-limit (0.2.1),
    series-locked (0.2.1) (409);
    payload-too-large (413); opening-stock-invalid (422); database-busy (503).
    (14) Open opening-stock file (0.1.3, DEC-071 Q1 option A, ADR-028 R5-2). An import is open while it is
    DRAFT or WAITING_APPROVAL. While a store has an open import, its code cannot change and it cannot be switched
    off; while a product is on a line of an open import (of any store), it cannot be switched off and its
    purchaseUnit, issueUnit and conversion cannot change. Each refusal is 409 open-import with detail "Finish or
    reject the opening stock file of this store first." (the client shows this sentence), nothing written. It ends
    when the import becomes NOT_ACCEPTED, APPROVED, REJECTED or REPLACED. Operations: pharmacyUpdateStore,
    pharmacySwitchOffStore, pharmacyUpdateOwnProduct, pharmacyPutLocalSettings.
    Known limits (0.1.3). (a) Code review N-12: totalValuePaise is int64 and can in theory exceed 2^53
    (9,007,199,254,740,992 paise, about ₹ 90 lakh crore), above which a JavaScript number loses precision; the
    worst case is about 5e18 paise per file (5,000 rows x 9,99,999 x ₹ 99,99,999.99). Realistic opening stock
    is many orders of magnitude below it, so the Angular client reads it as a number; the field stays an
    integer. totalQuantity is at most about 5e9 and is exact. (b) Security I3, a rule for SAH-79: opening-stock
    rows keep the raw cells as typed, and a cell may start with =, +, - or @. Any CSV (or spreadsheet) export of
    opening-stock lines, batches or products must neutralise a cell that starts with =, +, - or @ (and, per
    OWASP, a tab or carriage return) by prefixing it with a single quote before writing it, so that it is never
    read as a formula. 0.1.x has no export. (c) Security I16, accepted by DEC-080 (0.3.2): PUT
    /document-series/{docType} answers 409 prefix-in-use only for a prefix another document type uses now. A
    prefix that a type has given up can be taken by another type, which then issues numbers that look like the
    old documents of the first type. Accepted as a known limit: tax invoices (BILL) keep the financial-year part,
    so a tax invoice number is never repeated, and every document is found by its id, type and store, not by its
    number alone.
    Test data in examples is fake: names, GSTINs, licence numbers and phone numbers are invented and marked.
servers:
  - url: /api/v1/pharmacy
security:
  - bearer: []
tags:
  - { name: SAH-78-1, description: 'Module entry, context, setup summary' }
  - { name: SAH-78-2, description: 'Unit settings and Integration mode (NEW section, DEC-062 Q1)' }
  - { name: SAH-78-3, description: Stores }
  - { name: SAH-78-4, description: 'Staff to store mapping and working store' }
  - { name: SAH-78-5, description: 'Product master: catalogue search, adopt, local settings' }
  - { name: SAH-78-6, description: 'Own products, duplicate check, units and conversion' }
  - { name: SAH-78-7, description: 'Opening stock import and owner approval (NEW section; no posting until SAH-79)' }
  - { name: SAH-78-8, description: 'Vendors and licence blocking' }
  - { name: SAH-78-9, description: 'Approval rules, presets and versions (NEW section)' }
  - { name: SAH-78-10, description: 'Numbering series, reason lists, print templates (NEW section)' }
  - { name: SAH-79-1, description: 'WP-D · Post approved opening stock to the stock ledger (mockup 06 result)' }
  - { name: SAH-79-2, description: 'WP-D · Approvals inbox and decisions, the approval engine (mockup 14)' }
  - { name: SAH-79-3, description: 'WP-D · Batch inventory and expiry, low stock, FEFO (mockup 06)' }
  - { name: SAH-79-4, description: 'WP-D · Store stock by state (mockup 11, Current stock)' }
  - { name: SAH-79-5, description: 'WP-D · Stock adjustment (mockup 06 card)' }
  - { name: SAH-79-6, description: 'WP-E · Purchase orders and the reorder list (mockup 07)' }
  - { name: SAH-79-7, description: 'WP-E · Receive stock (GRN) and vendor payable (mockup 08)' }
