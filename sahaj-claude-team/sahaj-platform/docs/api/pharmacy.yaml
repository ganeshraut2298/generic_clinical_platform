        PHARMACY_VENDOR_SWITCHED_ON (vendor id, before and after status).
      responses:
        '200': { description: Switched on (or already on), content: { application/json: { schema: { $ref: '#/components/schemas/Vendor' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  # ---------------------------------------------------------------- SAH-78-9 approval rules
  /approval-rules:
    get:
      tags: [SAH-78-9]
      operationId: pharmacyGetApprovalRules
      summary: Current approval rules, fixed rules, stores without approver, current delegates
      x-required-role: SETUP_VIEW
      description: >-
        One row per transaction type (OQ-78-25 list) in this order: PURCHASE_ORDER, GRN_RATE_RISE, VENDOR_RETURN,
        INDENT, STOCK_TRANSFER, WRITE_OFF, STOCK_ADJUSTMENT, SALE_DISCOUNT, SALES_RETURN. Before the first save
        (versionNo 0, reviewNeeded true, banner "Review these rules before use", NEW) the rules are the STANDARD
        preset with no amounts (owner levels with condition ALWAYS; DEC-062 Q4: Sahaj ships no ₹ limits).
        fixedRules lists the three rules that no setting changes (BR-24). storesWithoutApprover lists ACTIVE
        stores without an ACTIVE HOD when any rule uses STORE_APPROVER ("<store> has no approver", NEW).
        0.3.4 (QA D-5, tech lead decision of 19 Nov 12:45): the rules served before the first save are the rules
        in force. The approval engine (rule 18) applies the Standard preset at versionNo 0 exactly as this read
        answers it, so a purchase order (submit), a stock adjustment (create) and every other covered transaction
        go to the owner (WAITING_APPROVAL) until an owner saves other rules; nothing proceeds at level 0 because
        rules were never saved. Requests raised meanwhile keep versionNo 0 as their rule version.
        currentDelegates lists stores with a CURRENT delegate (read-only here; set on the store). Escalation
        values are stored only; nothing acts on them until a later timer story (OQ-78-29). Writes nothing.
      responses:
        '200':
          description: Rules
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRules' }
              examples:
                saved:
                  value:
                    versionNo: 2
                    preset: CUSTOM
                    reviewNeeded: false
                    savedAt: '2026-11-17T07:00:00Z'
                    savedBy: { membershipId: 00000000-0000-4000-8000-000000000001, name: Test Owner One }
                    highValueThresholdPaise: 500000
                    rules:
                      - { transactionType: PURCHASE_ORDER, levels: [ { level: 1, approver: OWNER, condition: { kind: ABOVE_AMOUNT, amountPaise: 5000000, percent: null, storeTypes: null } } ], escalateAfterHours: null, urgentEscalateAfterMinutes: null }
                      - { transactionType: INDENT, levels: [ { level: 1, approver: STORE_APPROVER, condition: { kind: ALWAYS, amountPaise: null, percent: null, storeTypes: null } } ], escalateAfterHours: 2, urgentEscalateAfterMinutes: 30 }
                      - { transactionType: SALE_DISCOUNT, levels: [ { level: 1, approver: OWNER, condition: { kind: ABOVE_PERCENT, amountPaise: null, percent: '10', storeTypes: null } } ], escalateAfterHours: null, urgentEscalateAfterMinutes: null }
                    fixedRules:
                      - { key: NO_SELF_APPROVAL, text: Nobody approves their own request. }
                      - { key: SCHEDULE_X_TWO_SIGNATURES, text: Schedule X needs a pharmacist and a second signature. }
                      - { key: LEDGER_APPEND_ONLY, text: 'The stock ledger cannot be edited; corrections are reversing lines.' }
                    storesWithoutApprover: [ { storeId: 00000000-0000-4000-8000-0000000000a4, name: Test OT Store } ]
                    currentDelegates: [ { storeId: 00000000-0000-4000-8000-0000000000a3, storeName: Test OPD Store, membershipId: 00000000-0000-4000-8000-000000000022, name: Test Doctor Two, to: '2026-11-30' } ]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
    put:
      tags: [SAH-78-9]
      operationId: pharmacyPutApprovalRules
      summary: Save the rules (all nine rows, one save) as a new version
      x-required-role: SETUP_EDIT
      description: >-
        OWNER only. The body carries all nine transaction types once each and baseVersionNo (the versionNo read).
        400 validation (all together, field paths such as rules[3].levels[1]): a type missing or repeated; more
        than 2 levels; level 2 without level 1 "Fill level 1 first"; ABOVE_AMOUNT without amountPaise "Enter the
        limit"; amountPaise over ₹ 9,99,99,999 (9,999,999,900 paise; 0.2.1, DEC-078 item 1, which corrects the
        0.1.x text "99999999900 paise") or negative; highValueThresholdPaise over ₹ 9,99,99,999 (9,999,999,900
        paise, the same limit; 0.3.1) or negative "Enter an amount up to ₹ 9,99,99,999"; ABOVE_PERCENT except for
        SALE_DISCOUNT and (0.2.0, OQ-79-10) GRN_RATE_RISE, where it is the owner's rate-rise percentage (no shipped
        5%; no level means no rate check), or ABOVE_AMOUNT for SALE_DISCOUNT (OQ-78-27: discount limit is a percentage); HIGH_VALUE_ITEM
        while highValueThresholdPaise is null "Enter the high-value amount"; STORE_TYPE without storeTypes;
        URGENT_PRIORITY except for INDENT and STOCK_TRANSFER; escalateAfterHours outside 1 to 168;
        urgentEscalateAfterMinutes except for INDENT or outside 5 to 1440; any field for the fixed rules
        (additional properties). baseVersionNo not current 409 rules-changed with current. Rules identical to the
        current version (and the same highValueThresholdPaise): 200, nothing written. Otherwise a new immutable
        version with preset CUSTOM (the selector then shows "Custom"). A store without an HOD does not block the
        save. Applies to transactions created after the save; waiting ones keep their
        version (Phase 2 snapshots it). Audit PHARMACY_APPROVAL_RULES_SAVED (version numbers, before and after).
        0.2.1 (DEC-078 item 2): the GRN_RATE_RISE limit is a percentage only, like SALE_DISCOUNT; its conditions
        are ALWAYS or ABOVE_PERCENT only (percent 0 to 100, at most 2 decimals), and any other condition kind for
        GRN_RATE_RISE answers 400 validation on that level's condition field.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalRulesInput' }
      responses:
        '200': { description: Saved (or unchanged), content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalRules' } } } }
        '400': { $ref: '#/components/responses/Problem', description: validation }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict', description: 'rules-changed (with current)' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /approval-rules/preset:
    post:
      tags: [SAH-78-9]
      operationId: pharmacyApplyApprovalPreset
      summary: Replace all rows with a preset (asks for the limits it needs)
      x-required-role: SETUP_EDIT
      description: >-
        OWNER only. The confirmation "This replaces all rows below. You can change them afterwards." is a client
        step. Preset meanings (OQ-78-28, DEC-062 Q4 accepted; GRN_RATE_RISE and VENDOR_RETURN are an architect
        proposal, see ADR-028 open points): LEAN = no level for INDENT, STOCK_TRANSFER, WRITE_OFF,
        STOCK_ADJUSTMENT, SALE_DISCOUNT, SALES_RETURN, GRN_RATE_RISE, VENDOR_RETURN; PURCHASE_ORDER one level OWNER
        above the limit. STANDARD = one level STORE_APPROVER ALWAYS for INDENT, STOCK_TRANSFER, WRITE_OFF,
        VENDOR_RETURN; one level OWNER above the limit for PURCHASE_ORDER, GRN_RATE_RISE, STOCK_ADJUSTMENT,
        SALE_DISCOUNT (percent), SALES_RETURN. STRICT = level 1 STORE_APPROVER ALWAYS and level 2 OWNER above the
        limit for every type. Escalation defaults: INDENT 2 hours and urgent 30 minutes, STOCK_TRANSFER 24 hours,
        others none (OQ-78-29). limits must contain one entry for every type whose OWNER level needs a limit in
        that preset; each entry gives amountPaise (percent for SALE_DISCOUNT) or noAmountCondition true (the
        OWNER level then has condition ALWAYS). A missing entry 400 field limits.<TYPE> "Enter the limit" (Sahaj
        supplies no amounts, OQ-78-26); an entry for a type that needs none 400. baseVersionNo not current 409
        rules-changed. Writes a new version with that preset. Audit PHARMACY_APPROVAL_PRESET_APPLIED.
        0.2.1 (DEC-078 items 2 and 3): the server is the source of truth for which types need a limit. GET
        /approval-rules answers presets, one entry per preset with limitTypes, the transaction types whose OWNER
        level needs a limit in that preset (STRICT: every type that has an amount or percentage condition); the
        client asks for exactly those and stops guessing. A GRN_RATE_RISE limit is a percent (as SALE_DISCOUNT),
        never amountPaise. The amount limit is at most ₹ 9,99,99,999 (9,999,999,900 paise).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresetInput' }
            examples:
              lean: { value: { baseVersionNo: 0, preset: LEAN, limits: [ { transactionType: PURCHASE_ORDER, amountPaise: 5000000, percent: null, noAmountCondition: false } ] } }
      responses:
        '200': { description: Applied, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalRules' } } } }
        '400': { $ref: '#/components/responses/Problem', description: validation }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict', description: 'rules-changed (with current)' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /approval-rules/versions:
    get:
      tags: [SAH-78-9]
      operationId: pharmacyListApprovalRuleVersions
      summary: Saved versions, newest first
      x-required-role: SETUP_VIEW
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 1000, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { description: One page, content: { application/json: { schema: { $ref: '#/components/schemas/RuleVersionPage' } } } }
        '400': { $ref: '#/components/responses/Problem', description: validation }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /approval-rules/versions/{versionNo}:
    parameters:
      - { name: versionNo, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [SAH-78-9]
      operationId: pharmacyGetApprovalRuleVersion
      summary: One saved version (immutable)
      x-required-role: SETUP_VIEW
      description: 'The rules of that version; storesWithoutApprover and currentDelegates are computed now. Unknown version 404. A versionNo that is not a whole number 400 bad-request.'
      responses:
        '200': { description: Version, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalRules' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  # ---------------------------------------------------------------- SAH-78-10 numbering, reasons, templates
  /document-series:
    get:
      tags: [SAH-78-10]
      operationId: pharmacyListDocumentSeries
      summary: Numbering series of PO, GRN, indent, transfer and bill
      x-required-role: SETUP_VIEW
      description: >-
        0.2.0 (SAH-79, OQ-79-14): ten rows; after the five below come DEBIT_NOTE "DN-", STOCK_AUDIT "AUD-",
        STORE_RETURN "RET-", DAMAGE_REPORT "DMG-" and STOCK_ADJUSTMENT "ADJ-" (4 digits, no financial-year part,
        no restart until saved), and numbersIssued is true once a number of the type has been issued in the
        current financial year (April to March, IST); the series is then locked and PUT answers 409
        series-locked (0.3.1 wording, DEC-078 item 4). It turns false again on 1 April until the first number of
        the new financial year is issued.
        Five rows in that order; defaults until saved (saved false): PURCHASE_ORDER "PO-", GRN "GRN-", INDENT
        "IND-", TRANSFER "TRF-" (no financial-year part, 4 digits, no restart; examples PO-0001), BILL "SB/" with
        the financial-year part, 6 digits, restart every 1 April (SB/26-27/000001; mockup 05 "SB/018422"). The
        number is prefix + (financial year "26-27/" when financialYearPart) + the sequence padded to
        sequenceLength. example is rendered for the current financial year (April to March, IST). numbersIssued
        (0.3.1) is true exactly when PUT /document-series/{docType} would answer 409 series-locked. It was false
        in 0.1.0: no document number is taken in Phase 1 (ADR-028 D8; the race-safe next-number function
        exists for SAH-79 and is not exposed over HTTP). Writes nothing.
      responses:
        '200':
          description: Series
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/DocumentSeries' } } } }
              examples:
                defaults:
                  value:
                    items:
                      - { docType: PURCHASE_ORDER, prefix: PO-, financialYearPart: false, sequenceLength: 4, restartsEachFinancialYear: false, example: PO-0001, renderedLength: 7, numbersIssued: false, saved: false, version: 0 }
                      - { docType: BILL, prefix: SB/, financialYearPart: true, sequenceLength: 6, restartsEachFinancialYear: true, example: SB/26-27/000001, renderedLength: 15, numbersIssued: false, saved: false, version: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /document-series/{docType}:
    parameters:
      - { name: docType, in: path, required: true, schema: { $ref: '#/components/schemas/DocType' } }
    put:
      tags: [SAH-78-10]
      operationId: pharmacyPutDocumentSeries
      summary: Change a numbering series
      x-required-role: SETUP_EDIT
      description: >-
        OWNER only. 400 validation: prefix 1 to 6 of letters, digits, hyphen or slash "Use 1 to 6 letters, digits,
        - or /"; sequenceLength 4 to 8; rendered length (prefix + 6 when financialYearPart + sequenceLength) over
        16 "The number must be 16 characters or fewer" (OQ-78-31, DEC-062 Q4); restartsEachFinancialYear true
        while financialYearPart false "Show the financial year when numbers restart every 1 April" (NEW: keeps
        numbers unique). 409 prefix-in-use "Two document types cannot use the same prefix" when another type of
        this unit uses the same prefix now, ignoring case (stricter than the story; ADR-028 open points; a prefix
        another type gave up earlier is not refused: known limit (c), security I16, accepted by DEC-080). version not
        current 409 settings-changed. Applies to numbers taken after the save; issued numbers never change, are
        never reused or skipped. An unknown docType 400 bad-request. Audit PHARMACY_SERIES_CHANGED.
        Series locking (0.2.1, DEC-078 item 4): once any number of this docType has been issued in the current
        financial year (April to March, IST), the series cannot be changed: 409 series-locked "Numbers have
        already been issued this year.", nothing written (checked under the series row lock, after the version
        check). While no number has been issued this financial year, the prefix and format can change, so a new
        prefix takes effect from the first number of a financial year and each series stays consecutive. For a
        series without a financial-year part, "this year" is still the current financial year of the issue time.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentSeriesInput' }
            examples:
              po: { value: { version: 0, prefix: PO/, financialYearPart: true, sequenceLength: 5, restartsEachFinancialYear: true } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentSeries' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation; or bad-request (unknown docType)' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict', description: 'settings-changed (with current), prefix-in-use; 0.2.1 series-locked (a number of this type was issued in the current financial year)' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /reason-lists:
    get:
      tags: [SAH-78-10]
      operationId: pharmacyListReasons
      summary: The four reason lists as chips
      x-required-role: SETUP_VIEW
      description: >-
        Lists in this order (OQ-78-32): store-return (Excess stock, Near expiry, Not needed (order stopped)),
        sales-return (Doctor changed medicine, Excess bought, Wrong item given, Adverse reaction), damage (Damaged /
        leaking, Expired, Cold-chain break), stock-adjustment (Consumption not entered, Breakage, Unknown). Seeded
        reasons are global reference rows present for every unit; the unit's own reasons follow at the end in
        the order added; active false shows a switched-off chip. Phase 2 readers get active reasons only.
        0.2.0 (SAH-79, OQ-79-15, OQ-79-27): eleven lists; after the four above come receipt-reject, cs-change,
        approval-reject, transfer, consumption-purpose, dispute and vendor-return (ListKeyValue), and
        stock-adjustment gains Count mismatch and Theft or loss. "Short / not received" (receipt-reject.short)
        cannot be switched off (409 last-active-reason "This reason is fixed."). Phase 2 screens read GET
        /reasons. Writes nothing. 0.3.5 (tech lead decision of 19 Nov 13:40, item 3): the seeded keys of the
        list receipt-reject are part of this contract and are not renamed: receipt-reject.damaged-in-transit
        ("Damaged in transit"), receipt-reject.wrong-item ("Wrong item"), receipt-reject.near-expiry ("Near
        expiry / expired"), receipt-reject.excess-quantity ("Excess quantity") and receipt-reject.short ("Short
        / not received", fixed). Two of them carry behaviour and a client may name them by key:
        receipt-reject.short (the shortage path of pharmacyReceiveDispatch) and receipt-reject.near-expiry (the
        reason an expired batch must be rejected with). The 0.2.0 text that named the second
        "receipt-reject.near-expiry-expired" is corrected: that key was never seeded.
      responses:
        '200': { description: Lists, content: { application/json: { schema: { $ref: '#/components/schemas/ReasonLists' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /reason-lists/{listKey}/reasons:
    parameters:
      - $ref: '#/components/parameters/ListKey'
