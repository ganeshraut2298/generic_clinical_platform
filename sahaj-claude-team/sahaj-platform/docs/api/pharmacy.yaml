  /stores/{storeId}/dispatches/{dispatchId}/receipt:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/DispatchId'
    post:
      tags: [SAH-79-12, SAH-79-15]
      operationId: pharmacyReceiveDispatch
      summary: '"Confirm receipt" - accept or reject each line with a reason (indent or transfer)'
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability receive at the receiving store - any mapped person, not only the HOD; Schedule X lines: rule 19)'
      x-sub-story: 'SAH-79-12 (and SAH-79-15 transfers)'
      x-work-package: WP-F
      description: >-
        Path store must be the dispatch's receiving store (else 404). IN_TRANSIT or PARTLY_RECEIVED; RECEIVED
        answers 409 changed (nothing posted twice; OQ-79-2). 0.3.5 (tech lead decision of 19 Nov 13:40, item 3):
        "every dispatch line once" means every line that is not yet received (received false), each exactly once;
        a line missing, sent twice, or already received answers 400 validation (field lines "Send every line not
        yet received, once."). The first receipt of an IN_TRANSIT dispatch carries every line. A later receipt
        of a PARTLY_RECEIVED dispatch (a pharmacist receiving the Schedule X lines a non-pharmacist skipped)
        carries only the lines not yet received, with dispatchVersion the dispatch's current version (an older
        one 409 changed); the lines received earlier keep their results. A non-pharmacist who sends such a
        re-send sends the Schedule X lines with skipped true again, and the dispatch stays PARTLY_RECEIVED (a
        body whose lines are all skipped answers 400 validation field lines "There is nothing to receive."). Per line:
        accepted whole 0 to dispatched; rejected = dispatched − accepted (computed by the server; a sent
        rejected that differs 400 "Accepted + Rejected must equal Dispatched", AC-I4); rejected above 0 needs
        rejectReasonKey from list receipt-reject (400 "Choose a reason for the rejected quantity"); an expired
        batch cannot be accepted (400, reject it as receipt-reject.near-expiry "Near expiry / expired"; 0.3.5:
        the seeded key, the 0.2.0 name near-expiry-expired is corrected, see GET /reason-lists; accepted above
        0 on an expired batch answers 400 validation, and a rejection of it with another reason is also 400,
        field lines[].rejectReasonKey). Schedule X lines (rule
        19): a caller who is not a pharmacist sends them with skipped true and receives the other lines (the
        skipped lines stay in transit for a pharmacist, received false, the dispatch PARTLY_RECEIVED); a
        non-pharmacist who sends a Schedule X line with skipped false answers 403 schedule-x-pharmacist; a
        pharmacist receives them with skipped false and secondSigner (rule 19; capability receiveScheduleX, see
        the capability table there); skipped true on a line that is not Schedule X answers 400 validation; all
        other lines not yet received must be present. One transaction:
        accepted IN_TRANSIT → AVAILABLE (ledger INDENT_RECEIPT_ACCEPTED or TRANSFER_RECEIPT_ACCEPTED); rejected
        for a physical reason IN_TRANSIT → PENDING_RETURN at this store plus a return item to the Central Store (or
        the sending store of a transfer) waiting for acceptance (ledger …_RECEIPT_REJECTED); receipt-reject.short
        stays IN_TRANSIT with an open shortage ("Short · under investigation", OQ-79-18), never in AVAILABLE or
        PENDING_RETURN. Status of the dispatch RECEIVED (or PARTLY_RECEIVED while Schedule X lines are skipped);
        the indent or transfer status and chips are recomputed (0.3.3, DEC-080 m-4: an indent with a back-order
        open stays PARTLY_DISPATCHED after this receipt; it becomes RECEIVED only when every approved quantity is
        dispatched and received, IndentStatus; 0.3.4: while this dispatch is PARTLY_RECEIVED because Schedule X lines
        are skipped, the indent stays PARTLY_DISPATCHED with chips.scheduleXWaiting above 0, the chip "· Schedule X
        lines waiting for a pharmacist"; the indent never takes PARTLY_RECEIVED). Answers notes for the screen
        (rejectedNote "The <n> rejected units do not enter <store> stock. They wait for Central Store to accept
        them back." and shortNote). Audit PHARMACY_DISPATCH_RECEIVED.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DispatchReceiptInput' }
            examples:
              oneRejected: { value: { clientKey: 00000000-0000-4000-8000-00000000f003, dispatchVersion: 1, lines: [ { dispatchLineId: 00000000-0000-4000-8000-0000000004a1, accepted: 16, rejected: 2, rejectReasonKey: receipt-reject.damaged-in-transit, note: null, skipped: false } ], secondSigner: null } }
      responses:
        '200': { description: Received (or a replay), content: { application/json: { schema: { $ref: '#/components/schemas/Dispatch' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation, malformed-request, bad-request' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden', description: 'store-permission-denied, schedule-x-pharmacist, second-signer-invalid, wrong-pin, pin-locked' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 'changed, client-key-reused, pin-not-set' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/Problem', description: 'rate-limit, colleague-pin-limit' }
        '503': { $ref: '#/components/responses/DatabaseBusy', description: 'database-busy, pin-unavailable, pin-check-failed' }
