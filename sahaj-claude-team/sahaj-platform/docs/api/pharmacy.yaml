        HANDED_OVER, or CREATED / PICKED for a debit note with SHORT_SUPPLY lines only (409 doc-state otherwise).
        creditNoteNo 1 to 30, creditNoteDate not in the future, amountPaise 1 to 99999999900. differencePaise
        (credit note minus debit note credit + GST reversal) is shown. The vendor payable is reduced in the same
        step (payable entry CREDIT_NOTE; the debit note's own receipt first, then the vendor's oldest due;
        anything above what is open stays as unappliedCreditPaise, ADR-029 P10, A-6, G-19); status
