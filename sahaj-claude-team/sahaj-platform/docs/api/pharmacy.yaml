        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 'changed, doc-state, stock-moved, insufficient-stock, client-key-reused, pin-not-set' }
        '429': { $ref: '#/components/responses/Problem', description: 'rate-limit, colleague-pin-limit' }
        '503': { $ref: '#/components/responses/DatabaseBusy', description: 'database-busy, pin-unavailable, pin-check-failed' }
