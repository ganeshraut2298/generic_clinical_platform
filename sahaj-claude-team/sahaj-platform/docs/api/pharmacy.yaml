        '403': { $ref: '#/components/responses/StoreForbidden', description: 'store-permission-denied, schedule-x-pharmacist, second-signer-invalid, wrong-pin, pin-locked' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 'changed, adjustment-waiting, insufficient-stock, client-key-reused, pin-not-set' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/Problem', description: 'rate-limit, colleague-pin-limit (Schedule X second signature)' }
        '503': { $ref: '#/components/responses/DatabaseBusy', description: 'database-busy, pin-unavailable, pin-check-failed' }
