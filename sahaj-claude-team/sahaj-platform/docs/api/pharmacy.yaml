      tags: [SAH-78-10]
      operationId: pharmacyAddReason
      summary: Add a reason to a list
      x-required-role: SETUP_EDIT
      description: >-
        OWNER only. label 1 to 40 characters after trimming "Enter the reason (up to 40 characters)"; equal to a
        reason of the same list (seeded or own, any state, ignoring case) 409 reason-exists "That reason is
