    # ---------------------------------------------------------------- WP-F
    IndentStatus:
      type: string
      enum: [DRAFT, WAITING_APPROVAL, APPROVED, PARTLY_DISPATCHED, DISPATCHED, RECEIVED, CLOSED, REJECTED, CANCELLED, DISCARDED]
      description: 'Draft; Waiting for HOD approval / Waiting for owner approval (by level); Approved · with Central Store; Approved · back-order open; Dispatched · in transit; Received (chips "· <n> rejected, waiting for CS", "· <n> short, CS investigating"); Closed; Rejected; Cancelled. 0.3.3 (DEC-080 m-4, wording; the database already follows it): the indent stays PARTLY_DISPATCHED while a back-order is open, and becomes RECEIVED only when every approved quantity has been dispatched and received (or closed). RECEIVED never has a back-order open, so chips.backOrderOpen is false on RECEIVED. While PARTLY_DISPATCHED with every dispatch so far received, the label is the mockup''s "Received · <product> back-order open" (screen 10): status PARTLY_DISPATCHED, chips.backOrderOpen true and every item of dispatches[] RECEIVED; before that dispatch is received the label is "Approved · back-order open" or "Dispatched · in transit". Only APPROVED and PARTLY_DISPATCHED can be dispatched. 0.3.4 (BA handoff 19 Nov 10:50, tech lead decision 2): the indent has no PARTLY_RECEIVED status (a dispatch has it). While a dispatch of the indent has Schedule X lines not yet received (that dispatch is PARTLY_RECEIVED), the indent stays PARTLY_DISPATCHED with the chip "· Schedule X lines waiting for a pharmacist" (chips.scheduleXWaiting above 0), even when every other quantity is received; it becomes RECEIVED only after those lines are received. When the indent also has rejected or short quantities, those chips show as well; the back-order label shows only when nothing is rejected or short (the mockup).'
    IndentLineInput:
      type: object
      additionalProperties: false
      required: [productId, requestedQty]
      properties:
        productId: { type: string, format: uuid }
        requestedQty: { type: integer, minimum: 1, maximum: 999999 }
    IndentCreate:
      type: object
      additionalProperties: false
      required: [clientKey, priority, lines]
      properties:
        clientKey: { type: string, format: uuid }
        priority: { type: string, enum: [ROUTINE, URGENT] }
        lines: { type: array, minItems: 1, maxItems: 200, items: { $ref: '#/components/schemas/IndentLineInput' } }
    IndentUpdate:
      type: object
      additionalProperties: false
      required: [version, priority, lines]
      properties:
        version: { type: integer, minimum: 0 }
        priority: { type: string, enum: [ROUTINE, URGENT] }
        lines: { type: array, minItems: 1, maxItems: 200, items: { $ref: '#/components/schemas/IndentLineInput' } }
    Indent:
      type: object
      required: [id, number, fromStore, toStore, priority, status, chips, raisedBy, raisedAt, actingAs, lines, approval, dispatches, history, version]
      properties:
        id: { type: string, format: uuid }
        number: { type: [string, 'null'] }
        fromStore: { $ref: '#/components/schemas/StoreRef' }
        toStore: { $ref: '#/components/schemas/StoreRef' }
        priority: { type: string, enum: [ROUTINE, URGENT] }
        status: { $ref: '#/components/schemas/IndentStatus' }
        chips: { type: object, required: [rejectedWaitingCs, shortInvestigating, backOrderOpen, scheduleXWaiting], properties: { rejectedWaitingCs: { type: integer, minimum: 0, description: '0.3.5 (tech lead decision of 19 Nov 13:55, item 4): the quantity (issue units) rejected on receipt of this indent''s dispatches that is still waiting for the Central Store to accept: the sum of qty of its INDENT_REJECTION return items in WAITING or DISPUTED. Not the sum of rejected quantities: a rejection the Central Store has accepted no longer counts. 0: no chip.' }, shortInvestigating: { type: integer, minimum: 0, description: '0.3.5: the shortage quantity (issue units, receipt-reject.short) of this indent''s dispatches not yet settled by the Central Store (pharmacySettleShortage); the chip "short · CS investigating". A settled shortage no longer counts. 0: no chip. (The tech lead''s note calls it shortCsInvestigating; the member name stays shortInvestigating.)' }, backOrderOpen: { type: boolean }, scheduleXWaiting: { type: integer, minimum: 0, description: '0.3.4 (BA handoff 19 Nov 10:50, tech lead decision 2): the number of Schedule X dispatch lines of this indent not yet received (their dispatch is PARTLY_RECEIVED). Above 0: the chip "· Schedule X lines waiting for a pharmacist"; the indent stays PARTLY_DISPATCHED (never RECEIVED) until they are received. 0 otherwise.' } } }
        raisedBy: { $ref: '#/components/schemas/PersonRef' }
        raisedAt: { type: [string, 'null'], format: date-time }
        actingAs: { type: string, description: '"Acting as <name> · <capacity> · <store>" for the caller.' }
        lines:
          type: array
          items:
            type: object
            required: [id, product, requestedQty, approvedQty, hodChange, remainingQty, dispatchedQty, receivedQty, rejectedQty, shortQty, balanceAction, replacement, requestingStoreAvailable, csStock, stockImpact]
            properties:
              id: { type: string, format: uuid }
              product: { $ref: '#/components/schemas/ProductRef' }
              requestedQty: { type: integer }
              approvedQty: { type: [integer, 'null'] }
              hodChange: { type: [integer, 'null'], description: '+4 / −5 by HOD; null "—".' }
              hodRemark: { oneOf: [ { $ref: '#/components/schemas/ReasonRef' }, { type: 'null' } ] }
              remainingQty: { type: integer }
              dispatchedQty: { type: integer }
              receivedQty: { type: integer }
              rejectedQty: { type: integer }
              shortQty: { type: integer }
              balanceAction: { type: [string, 'null'], enum: [BACK_ORDER, CLOSE, null] }
              closeReason: { oneOf: [ { $ref: '#/components/schemas/ReasonRef' }, { type: 'null' } ] }
              replacement: { oneOf: [ { type: object, required: [product, reason], properties: { product: { $ref: '#/components/schemas/ProductRef' }, reason: { $ref: '#/components/schemas/ReasonRef' } } }, { type: 'null' } ], description: '"replaced by Central Store".' }
              requestingStoreAvailable: { type: [integer, 'null'], description: '"<store> stock". 0.3.2: null for a caller who is blind at the requesting store while the product is on its open audit (rule 24).' }
              csStock: { type: [integer, 'null'], description: 'Central Store AVAILABLE unexpired; for a caller who can open the indent (OQ-79-21). 0.3.2: also null for a caller who is blind at the Central Store while the product is on its open audit (rule 24).' }
              stockImpact: { type: object, required: [csSaleable, inTransit, requestingAvailable, pendingReturn, backOrder, shortInvestigating], description: '0.3.2 (rule 24): csSaleable is null for a caller blind at the Central Store, requestingAvailable and pendingReturn for a caller blind at the requesting store, while the product is on that store''s open audit. inTransit, backOrder and shortInvestigating are quantities of this indent and stay.', properties: { csSaleable: { type: [integer, 'null'] }, inTransit: { type: integer }, requestingAvailable: { type: [integer, 'null'] }, pendingReturn: { type: [integer, 'null'] }, backOrder: { type: integer }, shortInvestigating: { type: integer } } }
        approval: { oneOf: [ { $ref: '#/components/schemas/ApprovalSummary' }, { type: 'null' } ] }
        dispatches: { type: array, items: { type: object, required: [dispatchId, reference, status, dispatchedAt], properties: { dispatchId: { type: string, format: uuid }, reference: { type: string, examples: ['IND-6012 / 1'] }, status: { type: string, enum: [IN_TRANSIT, PARTLY_RECEIVED, RECEIVED] }, dispatchedAt: { type: string, format: date-time } } } }
        cancelReason: { oneOf: [ { $ref: '#/components/schemas/ReasonRef' }, { type: 'null' } ] }
        history: { type: array, items: { $ref: '#/components/schemas/HistoryEvent' } }
        version: { type: integer, minimum: 0 }
    IndentPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { type: object, required: [id, number, fromStore, toStore, itemCount, priority, status, raisedBy, raisedAt, ageMinutes], properties: { id: { type: string, format: uuid }, number: { type: [string, 'null'] }, fromStore: { $ref: '#/components/schemas/StoreRef' }, toStore: { $ref: '#/components/schemas/StoreRef' }, itemCount: { type: integer }, priority: { type: string, enum: [ROUTINE, URGENT] }, status: { $ref: '#/components/schemas/IndentStatus' }, raisedBy: { $ref: '#/components/schemas/PersonRef' }, raisedAt: { type: [string, 'null'], format: date-time }, ageMinutes: { type: [integer, 'null'] } } } }
    ReplacementOption:
      type: object
      required: [product, csAvailable]
      properties:
        product: { $ref: '#/components/schemas/ProductRef' }
        csAvailable: { type: [integer, 'null'], description: '0.3.2: null for a caller blind at the Central Store while the product is on its open audit (rule 24).' }
    IndentDispatchInput:
      type: object
      additionalProperties: false
      required: [clientKey, indentVersion, lines]
      properties:
        clientKey: { type: string, format: uuid }
        indentVersion: { type: integer, minimum: 0 }
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [indentLineId, dispatchProductId, quantity]
            properties:
              indentLineId: { type: string, format: uuid }
              dispatchProductId: { type: string, format: uuid, description: 'The requested product ("Same") or a replacement option.' }
              quantity: { $ref: '#/components/schemas/Qty' }
              balanceAction: { type: [string, 'null'], enum: [BACK_ORDER, CLOSE, null] }
              changeReasonKey: { type: [string, 'null'], maxLength: 80, description: 'List cs-change.' }
              changeNote: { type: [string, 'null'], maxLength: 300 }
        secondSigner: { oneOf: [ { $ref: '#/components/schemas/SecondSigner' }, { type: 'null' } ] }
    Dispatch:
      type: object
      description: >-
        0.3.5 (WP-F wording, tech lead decision of 19 Nov 13:40 item 3). Two quantities of a dispatch line, as the
        screens name them. Held: the quantity dispatched on the line and in transit, that is dispatched while the
        line is not received (received false); the units are IN_TRANSIT at the receiving store and are counted in
        stockImpact.inTransit of the indent; once the line is received the held quantity is 0 (it became accepted
        and rejected). Back-order: for an indent line, the approved quantity minus every quantity dispatched for it
        so far (this dispatch and the earlier ones), the balance left open after a partial dispatch with
        balanceAction BACK_ORDER; 0 when the balance was closed (CLOSE, with its reason) or nothing is left. A
        dispatch from a transfer has no back-order (backOrdered 0). Status: IN_TRANSIT until the first receipt,
        PARTLY_RECEIVED while a line is not yet received (for example a Schedule X line skipped by a
        non-pharmacist), RECEIVED when every line is received.
      required: [id, reference, source, sourceId, sourceNo, fromStore, toStore, status, dispatchedBy, dispatchedAt, actingAs, lines, receipt, notes, print, version]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string, examples: ['IND-6012 / 1', TRF-0438] }
        source: { type: string, enum: [INDENT, TRANSFER] }
        sourceId: { type: string, format: uuid }
        sourceNo: { type: string }
        fromStore: { $ref: '#/components/schemas/StoreRef' }
        toStore: { $ref: '#/components/schemas/StoreRef' }
        status: { type: string, enum: [IN_TRANSIT, PARTLY_RECEIVED, RECEIVED] }
        dispatchedBy: { $ref: '#/components/schemas/PersonRef' }
        dispatchedAt: { type: string, format: date-time }
        actingAs: { type: string }
        lines:
          type: array
          items:
            type: object
            description: 'A dispatch line (one product and batch). 0.3.5: held = dispatched while received is false (in transit), else 0; back-order = backOrdered (see Dispatch).'
            required: [id, product, batch, dispatched, replacedByCs, changeReason, backOrdered, scheduleX, accepted, rejected, rejectReason, received]
            properties:
              id: { type: string, format: uuid }
              product: { $ref: '#/components/schemas/ProductRef' }
              batch: { $ref: '#/components/schemas/BatchRef' }
              dispatched: { type: integer, description: 'Issue units sent on this line. While received is false this is the held quantity (in transit).' }
              replacedByCs: { type: boolean }
              changeReason: { oneOf: [ { $ref: '#/components/schemas/ReasonRef' }, { type: 'null' } ] }
              backOrdered: { type: integer, minimum: 0, description: '0.3.5: the back-order of the indent line after this dispatch: approved minus every quantity dispatched for the indent line up to and including this dispatch, when the balance was kept open (BACK_ORDER); 0 when it was closed or nothing is left, and for a transfer. Repeated on each line of the same indent line in this dispatch (several batches).' }
              scheduleX: { type: boolean }
              accepted: { type: [integer, 'null'], description: 'null until the line is received.' }
              rejected: { type: [integer, 'null'], description: 'null until the line is received.' }
              rejectReason: { oneOf: [ { $ref: '#/components/schemas/ReasonRef' }, { type: 'null' } ] }
              received: { type: boolean, description: 'true once a receipt has recorded this line; a skipped Schedule X line stays false (the dispatch stays PARTLY_RECEIVED).' }
        receipt: { description: '0.3.5: the latest receipt of this dispatch (a PARTLY_RECEIVED dispatch can be received a second time for the skipped Schedule X lines; each receipt is in the history of the indent or transfer and in the audit). null while IN_TRANSIT.', oneOf: [ { type: object, required: [receivedBy, receivedAt], properties: { receivedBy: { $ref: '#/components/schemas/PersonRef' }, receivedAt: { type: string, format: date-time }, secondSigner: { oneOf: [ { $ref: '#/components/schemas/PersonRef' }, { type: 'null' } ] } } }, { type: 'null' } ] }
        notes: { type: object, properties: { rejectedNote: { type: [string, 'null'] }, shortNote: { type: [string, 'null'] } } }
        print: { $ref: '#/components/schemas/PrintHeader' }
        version: { type: integer, minimum: 0 }
    DispatchPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { type: object, required: [id, reference, source, fromStore, itemCount, status, dispatchedAt], properties: { id: { type: string, format: uuid }, reference: { type: string }, source: { type: string, enum: [INDENT, TRANSFER] }, fromStore: { $ref: '#/components/schemas/StoreRef' }, itemCount: { type: integer }, status: { type: string, enum: [IN_TRANSIT, PARTLY_RECEIVED, RECEIVED] }, dispatchedAt: { type: string, format: date-time } } } }
    DispatchReceiptInput:
      type: object
      additionalProperties: false
      required: [clientKey, dispatchVersion, lines]
      properties:
        clientKey: { type: string, format: uuid }
        dispatchVersion: { type: integer, minimum: 0 }
        lines:
          type: array
          minItems: 1
          maxItems: 400
          items:
            type: object
            additionalProperties: false
            required: [dispatchLineId, accepted, rejected]
            properties:
              dispatchLineId: { type: string, format: uuid }
              accepted: { $ref: '#/components/schemas/Qty' }
              rejected: { $ref: '#/components/schemas/Qty' }
              rejectReasonKey: { type: [string, 'null'], maxLength: 80, description: 'List receipt-reject; required when rejected > 0.' }
              note: { type: [string, 'null'], maxLength: 300 }
              skipped: { type: boolean, default: false, description: 'Schedule X line left for a pharmacist by a caller who is not one (rule 19); accepted and rejected are sent as 0 and ignored, the line stays received false and the dispatch PARTLY_RECEIVED. 0.3.5: a later receipt of the same dispatch carries only the lines not yet received (pharmacyReceiveDispatch). Only on a Schedule X line (else 400 validation).' }
        secondSigner: { oneOf: [ { $ref: '#/components/schemas/SecondSigner' }, { type: 'null' } ] }
    ReturnItemStatus:
      type: string
      enum: [WAITING, DISPUTED, ACCEPTED_SALEABLE, ACCEPTED_QUARANTINE, WAITING_HOD]
      description: 'Waiting for Central Store; Disputed; Accepted by CS · saleable; Accepted by CS · quarantine; Waiting for HOD (damage reports in the returning list).'
    ReturnItem:
      type: object
      required: [id, docNo, type, holdingStore, acceptingStore, product, batch, qty, reason, raisedBy, raisedAt, status, defaultPutBackInto, expired, dispute, notes, resultNote, history, version]
      properties:
        id: { type: string, format: uuid }
        docNo: { type: string, description: 'Dispatch reference, RET or DMG number.' }
        type: { type: string, enum: [INDENT_REJECTION, TRANSFER_REJECTION, RETURN_TO_CS, DAMAGED] }
        holdingStore: { $ref: '#/components/schemas/StoreRef' }
        acceptingStore: { $ref: '#/components/schemas/StoreRef' }
        product: { $ref: '#/components/schemas/ProductRef' }
        batch: { $ref: '#/components/schemas/BatchRef' }
        qty: { type: integer, minimum: 1 }
        reason: { $ref: '#/components/schemas/ReasonRef' }
        raisedBy: { $ref: '#/components/schemas/PersonRef' }
        raisedAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/ReturnItemStatus' }
        defaultPutBackInto: { type: string, enum: [SALEABLE, QUARANTINE] }
        expired: { type: boolean }
        scheduleX: { type: boolean }
        dispute: { oneOf: [ { type: object, required: [reason, by, at], properties: { reason: { $ref: '#/components/schemas/ReasonRef' }, by: { $ref: '#/components/schemas/PersonRef' }, at: { type: string, format: date-time } } }, { type: 'null' } ] }
        notes: { type: array, items: { type: object, required: [note, by, at], properties: { note: { type: string }, by: { $ref: '#/components/schemas/PersonRef' }, at: { type: string, format: date-time } } } }
        resultNote: { type: [string, 'null'] }
        history: { type: array, items: { $ref: '#/components/schemas/HistoryEvent' } }
        version: { type: integer, minimum: 0 }
    WaitingForActionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/ReturnItem' } }
    AcceptReturnInput:
      type: object
      additionalProperties: false
      required: [clientKey, version, putBackInto]
      properties:
        clientKey: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        putBackInto: { type: string, enum: [SALEABLE, QUARANTINE], description: '"Saleable stock" / "Damaged / quarantine bin".' }
        secondSigner: { oneOf: [ { $ref: '#/components/schemas/SecondSigner' }, { type: 'null' } ] }
    ShortageStatus:
      type: string
      enum: [OPEN, CLAIM_OPEN, WAITING_WRITE_OFF, FOUND, WRITTEN_OFF]
    Shortage:
      type: object
      required: [id, dispatchReference, receivingStore, settlingStore, product, batch, qty, status, approval, resultNote, history, version]
      properties:
        id: { type: string, format: uuid }
        dispatchReference: { type: string }
        receivingStore: { $ref: '#/components/schemas/StoreRef' }
        settlingStore: { $ref: '#/components/schemas/StoreRef' }
        product: { $ref: '#/components/schemas/ProductRef' }
        batch: { $ref: '#/components/schemas/BatchRef' }
        qty: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/ShortageStatus' }
        approval: { oneOf: [ { $ref: '#/components/schemas/ApprovalSummary' }, { type: 'null' } ] }
        banner: { type: string, description: '"Shortage, not a return. <n> units never reached <store>, so nothing comes back to the shelf. …"' }
        resultNote: { type: [string, 'null'] }
        history: { type: array, items: { $ref: '#/components/schemas/HistoryEvent' } }
        version: { type: integer, minimum: 0 }
    ShortagePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Shortage' } }
    SettleShortageInput:
      type: object
      additionalProperties: false
      required: [clientKey, version, outcome]
      properties:
        clientKey: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        outcome: { type: string, enum: [FOUND, TRANSIT_LOSS, CARRIER_CLAIM], description: '"Found in Central Store", "Transit loss · write off", "Claim from carrier" (fixed outcomes, OQ-79-18).' }
        note: { type: [string, 'null'], maxLength: 300 }
        secondSigner: { oneOf: [ { $ref: '#/components/schemas/SecondSigner' }, { type: 'null' } ] }
    # ---------------------------------------------------------------- WP-G
    StoreReturnCreate:
      type: object
      additionalProperties: false
      required: [clientKey, batchId, quantity, reasonKey]
      properties:
        clientKey: { type: string, format: uuid }
        batchId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 999999 }
        reasonKey: { type: string, maxLength: 80, description: 'List store-return.' }
        note: { type: [string, 'null'], maxLength: 300 }
        secondSigner: { oneOf: [ { $ref: '#/components/schemas/SecondSigner' }, { type: 'null' } ] }
    StoreReturn:
      type: object
      required: [id, number, store, product, batch, quantity, reason, item, history]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, examples: [RET-0311] }
        store: { $ref: '#/components/schemas/StoreRef' }
        product: { $ref: '#/components/schemas/ProductRef' }
        batch: { $ref: '#/components/schemas/BatchRef' }
        quantity: { type: integer }
        reason: { $ref: '#/components/schemas/ReasonRef' }
        item: { $ref: '#/components/schemas/ReturnItem' }
        history: { type: array, items: { $ref: '#/components/schemas/HistoryEvent' } }
    DamageReportCreate:
      type: object
      additionalProperties: false
      required: [clientKey, batchId, fromState, quantity, reasonKey, afterApproval]
      properties:
        clientKey: { type: string, format: uuid }
        batchId: { type: string, format: uuid }
        fromState: { type: string, enum: [AVAILABLE, QUARANTINE] }
        quantity: { type: integer, minimum: 1, maximum: 999999 }
        reasonKey: { type: string, maxLength: 80, description: 'List damage.' }
        note: { type: [string, 'null'], maxLength: 300 }
        afterApproval: { type: string, enum: [WRITE_OFF, SEND_TO_CS], description: '"Write off at store" / "Send to Central Store".' }
        secondSigner: { oneOf: [ { $ref: '#/components/schemas/SecondSigner' }, { type: 'null' } ] }
    DamageReport:
      type: object
      required: [id, number, store, product, batch, quantity, reason, afterApproval, status, outcome, approval, history, version]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, examples: [DMG-0087] }
        store: { $ref: '#/components/schemas/StoreRef' }
        product: { $ref: '#/components/schemas/ProductRef' }
        batch: { $ref: '#/components/schemas/BatchRef' }
        quantity: { type: integer }
        reason: { $ref: '#/components/schemas/ReasonRef' }
        afterApproval: { type: string, enum: [WRITE_OFF, SEND_TO_CS] }
        status: { type: string, enum: [WAITING_APPROVAL, WRITTEN_OFF, SENT_TO_CS, RELEASED, KEPT_IN_QUARANTINE] }
        outcome: { type: [string, 'null'] }
        approval: { oneOf: [ { $ref: '#/components/schemas/ApprovalSummary' }, { type: 'null' } ] }
        history: { type: array, items: { $ref: '#/components/schemas/HistoryEvent' } }
        version: { type: integer, minimum: 0 }
    TransferStatus:
      type: string
      enum: [WAITING_APPROVAL, APPROVED, IN_TRANSIT, RECEIVED, REJECTED, CANCELLED]
    TransferCreate:
      type: object
      additionalProperties: false
      required: [clientKey, fromStoreId, toStoreId, reasonKey, lines]
      properties:
        clientKey: { type: string, format: uuid }
        fromStoreId: { type: string, format: uuid }
        toStoreId: { type: string, format: uuid }
        reasonKey: { type: string, maxLength: 80, description: 'List transfer.' }
        note: { type: [string, 'null'], maxLength: 300 }
        lines: { type: array, minItems: 1, maxItems: 200, items: { type: object, additionalProperties: false, required: [productId, quantity], properties: { productId: { type: string, format: uuid }, quantity: { type: integer, minimum: 1, maximum: 999999 } } } }
    Transfer:
      type: object
      required: [id, number, fromStore, toStore, reason, status, step, notReceivedHours, lines, totalValuePaise, approval, dispatch, raisedBy, raisedAt, history, version]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, examples: [TRF-0438] }
        fromStore: { $ref: '#/components/schemas/StoreRef' }
        toStore: { $ref: '#/components/schemas/StoreRef' }
        reason: { $ref: '#/components/schemas/ReasonRef' }
        status: { $ref: '#/components/schemas/TransferStatus' }
        step: { type: string, enum: [REQUESTED, APPROVED, DISPATCHED, RECEIVED] }
        notReceivedHours: { type: [integer, 'null'], description: '"Not received · <n> h".' }
        lines: { type: array, items: { type: object, required: [id, product, quantity, previewBatches, availableAtSender, valuePaise], properties: { id: { type: string, format: uuid }, product: { $ref: '#/components/schemas/ProductRef' }, quantity: { type: integer }, previewBatches: { type: array, items: { type: object, required: [batch, quantity], properties: { batch: { $ref: '#/components/schemas/BatchRef' }, quantity: { type: integer } } } }, availableAtSender: { type: [integer, 'null'], description: '0.3.2: also null for a caller blind at the sending store while the product is on its open audit (rule 24).' }, valuePaise: { $ref: '#/components/schemas/Paise' } } } }
        totalValuePaise: { $ref: '#/components/schemas/Paise' }
        approval: { oneOf: [ { $ref: '#/components/schemas/ApprovalSummary' }, { type: 'null' } ] }
        dispatch: { oneOf: [ { type: object, required: [dispatchId, status], properties: { dispatchId: { type: string, format: uuid }, status: { type: string, enum: [IN_TRANSIT, PARTLY_RECEIVED, RECEIVED] } } }, { type: 'null' } ] }
        raisedBy: { $ref: '#/components/schemas/PersonRef' }
        raisedAt: { type: string, format: date-time }
        history: { type: array, items: { $ref: '#/components/schemas/HistoryEvent' } }
        version: { type: integer, minimum: 0 }
    TransferPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { type: object, required: [id, number, fromStore, toStore, itemCount, status, ageMinutes, notReceivedHours], properties: { id: { type: string, format: uuid }, number: { type: string }, fromStore: { $ref: '#/components/schemas/StoreRef' }, toStore: { $ref: '#/components/schemas/StoreRef' }, itemCount: { type: integer }, status: { $ref: '#/components/schemas/TransferStatus' }, ageMinutes: { type: integer }, notReceivedHours: { type: [integer, 'null'] } } } }
    LinkedWardInput:
      type: object
      additionalProperties: false
      required: [version, wardId]
      properties:
        version: { type: integer, minimum: 0, description: 'The store version.' }
        wardId: { type: [string, 'null'], format: uuid }
    AdmittedPatient:
      type: object
      required: [admissionId, ipNumber, patientName, bedLabel]
      description: 'From ipd.api.AdmittedPatients (ADR-029 P14). The name is for on-screen verification only; never stored by pharmacy, never logged, never in lists, reports or exports.'
      properties:
        admissionId: { type: string, format: uuid }
        ipNumber: { type: string }
        patientName: { type: string }
        bedLabel: { type: [string, 'null'] }
    ConsumptionCreate:
      type: object
      additionalProperties: false
      required: [clientKey, type, lines]
      properties:
        clientKey: { type: string, format: uuid }
        type: { type: string, enum: [GENERAL, PATIENT], description: '"Ward general (non-billable)" / "Patient-wise (billable)".' }
        purposeKey: { type: [string, 'null'], maxLength: 80, description: 'GENERAL: list consumption-purpose.' }
        note: { type: [string, 'null'], maxLength: 300 }
        admissionId: { type: [string, 'null'], format: uuid }
        orderedBy: { oneOf: [ { type: object, additionalProperties: false, properties: { membershipId: { type: [string, 'null'], format: uuid }, otherName: { type: [string, 'null'], minLength: 2, maxLength: 80 } } }, { type: 'null' } ], description: 'PATIENT: an option of GET /consumption/ordered-by-options or "Other" with a typed name (OQ-79-24b).' }
        stockAuditLineId: { type: [string, 'null'], format: uuid }
        lines: { type: array, minItems: 1, maxItems: 200, items: { type: object, additionalProperties: false, required: [productId, quantity], properties: { productId: { type: string, format: uuid }, quantity: { type: integer, minimum: 1, maximum: 999999 } } } }
        secondSigner: { oneOf: [ { $ref: '#/components/schemas/SecondSigner' }, { type: 'null' } ] }
    Consumption:
      type: object
      required: [id, store, type, purpose, ipNumber, orderedBy, chargeStatus, recordedBy, recordedAt, lines, costBookedTo]
      properties:
        id: { type: string, format: uuid }
        store: { $ref: '#/components/schemas/StoreRef' }
        type: { type: string, enum: [GENERAL, PATIENT] }
        purpose: { oneOf: [ { $ref: '#/components/schemas/ReasonRef' }, { type: 'null' } ] }
        ipNumber: { type: [string, 'null'], description: 'Patient entries only; never a name.' }
        orderedBy: { type: [string, 'null'] }
        chargeStatus: { type: string, enum: [NOT_APPLICABLE, CHARGE_PENDING], description: '"Charge pending" until SAH-80 posts it (OQ-79-23).' }
        recordedBy: { $ref: '#/components/schemas/PersonRef' }
        recordedAt: { type: string, format: date-time }
        costBookedTo: { type: string, description: 'The store name (OQ-79-24c).' }
        lines: { type: array, items: { type: object, required: [product, batch, quantity], properties: { product: { $ref: '#/components/schemas/ProductRef' }, batch: { $ref: '#/components/schemas/BatchRef' }, quantity: { type: integer } } } }
        secondSigner: { oneOf: [ { $ref: '#/components/schemas/PersonRef' }, { type: 'null' } ] }
    ConsumptionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Consumption' } }
    # ---------------------------------------------------------------- WP-H
    StockAuditStatus:
      type: string
      enum: [COUNTING, RECOUNT, WAITING_REVIEW, WAITING_APPROVAL, CLOSED]
    StockAuditCreate:
      type: object
      additionalProperties: false
      required: [clientKey, scope]
      properties:
        clientKey: { type: string, format: uuid }
        scope: { type: string, enum: [ALL_AVAILABLE, PRODUCTS] }
        productIds: { type: [array, 'null'], maxItems: 200, items: { type: string, format: uuid } }
    StockAudit:
      type: object
      required: [id, number, store, status, startedBy, startedAt, submittedBy, itemsInCount, counted, withVariance, varianceValuePaise, approval, history, version]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, examples: [AUD-0093] }
        store: { $ref: '#/components/schemas/StoreRef' }
        status: { $ref: '#/components/schemas/StockAuditStatus' }
        startedBy: { $ref: '#/components/schemas/PersonRef' }
        startedAt: { type: string, format: date-time }
        submittedBy: { oneOf: [ { $ref: '#/components/schemas/PersonRef' }, { type: 'null' } ] }
        itemsInCount: { type: integer }
        counted: { type: integer }
        withVariance: { type: [integer, 'null'], description: 'null for a caller without reviewCount, and before submit (blind count).' }
        varianceValuePaise: { type: [integer, 'null'], format: int64, description: 'Same rule as withVariance; negative for a loss.' }
        approval: { oneOf: [ { $ref: '#/components/schemas/ApprovalSummary' }, { type: 'null' } ] }
        history: { type: array, items: { $ref: '#/components/schemas/HistoryEvent' }, description: 'For a counter, history entries carry no system quantity (qtyBefore null).' }
        version: { type: integer, minimum: 0 }
    StockAuditPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/StockAudit' } }
    CountSheetLine:
      type: object
      additionalProperties: false
      required: [auditLineId, product, batch, rack, barcode, counted, notCounted, notCountedReason, recount]
      description: 'BLIND (BR-30): this schema has no system, book, difference or value field, and the server never adds one.'
      properties:
        auditLineId: { type: string, format: uuid }
        product: { $ref: '#/components/schemas/ProductRef' }
        batch: { $ref: '#/components/schemas/BatchRef' }
        rack: { type: [string, 'null'] }
        barcode: { type: [string, 'null'] }
        counted: { type: [integer, 'null'], minimum: 0 }
        notCounted: { type: boolean }
        notCountedReason: { oneOf: [ { $ref: '#/components/schemas/ReasonRef' }, { type: 'null' } ] }
        recount: { type: boolean }
    CountSheetPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items, auditNo, storeName, status, counted, itemsInCount, version]
          properties:
            auditNo: { type: string }
            storeName: { type: string }
            status: { $ref: '#/components/schemas/StockAuditStatus' }
            counted: { type: integer }
            itemsInCount: { type: integer }
            version: { type: integer, minimum: 0 }
            items: { type: array, items: { $ref: '#/components/schemas/CountSheetLine' } }
    CountsInput:
      type: object
      additionalProperties: false
      required: [version, lines]
      properties:
        version: { type: integer, minimum: 0 }
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [auditLineId]
            properties:
              auditLineId: { type: string, format: uuid }
              counted: { type: [integer, 'null'], minimum: 0, maximum: 999999 }
              notCounted: { type: boolean, default: false }
              notCountedReasonKey: { type: [string, 'null'], maxLength: 80 }
    VarianceReview:
      type: object
      required: [auditId, auditNo, store, status, varianceValuePaise, lines, version]
      properties:
        auditId: { type: string, format: uuid }
        auditNo: { type: string }
        store: { $ref: '#/components/schemas/StoreRef' }
        status: { $ref: '#/components/schemas/StockAuditStatus' }
        varianceValuePaise: { type: integer, format: int64 }
        lines:
          type: array
          items:
            type: object
            required: [auditLineId, product, batch, system, counted, diff, valuePaise, reason, counter, stockMoved, suggestConsumption]
            properties:
              auditLineId: { type: string, format: uuid }
              product: { $ref: '#/components/schemas/ProductRef' }
              batch: { $ref: '#/components/schemas/BatchRef' }
              system: { type: integer }
              counted: { type: integer }
              diff: { type: integer }
              valuePaise: { type: integer, format: int64 }
              reason: { oneOf: [ { $ref: '#/components/schemas/ReasonRef' }, { type: 'null' } ] }
              counter: { $ref: '#/components/schemas/PersonRef' }
              stockMoved: { type: boolean }
              suggestConsumption: { type: boolean }
              scheduleX: { type: boolean }
        version: { type: integer, minimum: 0 }
    VarianceReasonsInput:
      type: object
      additionalProperties: false
      required: [version, lines]
      properties:
        version: { type: integer, minimum: 0 }
        lines: { type: array, minItems: 1, maxItems: 200, items: { type: object, additionalProperties: false, required: [auditLineId, reasonKey], properties: { auditLineId: { type: string, format: uuid }, reasonKey: { type: string, maxLength: 80 }, note: { type: [string, 'null'], maxLength: 300 } } } }
    RecountInput:
      type: object
      additionalProperties: false
      required: [version, auditLineIds]
      properties:
        version: { type: integer, minimum: 0 }
        auditLineIds: { type: array, minItems: 1, maxItems: 200, items: { type: string, format: uuid } }
    ReportCatalogue:
      type: object
      required: [line, groups]
      properties:
        line: { type: string }
        groups:
          type: array
          items:
            type: object
            required: [group, reports]
            properties:
              group: { type: string, enum: [STOCK, MOVEMENT, PURCHASE] }
              reports: { type: array, items: { type: object, required: [key, label], properties: { key: { type: string }, label: { type: string } } } }
    StockLedgerPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items, product, stores, from, to]
          properties:
            product: { $ref: '#/components/schemas/ProductRef' }
            stores: { type: array, items: { $ref: '#/components/schemas/StoreRef' } }
            from: { type: string, format: date }
            to: { type: string, format: date }
            items:
              type: array
              items:
                type: object
                required: [ledgerId, at, transaction, ref, store, state, batch, qtyIn, qtyOut, balance, user, secondSigner, reversesLedgerId]
                properties:
                  ledgerId: { type: string, format: uuid }
                  at: { type: string, format: date-time }
                  transaction: { $ref: '#/components/schemas/LedgerTransaction' }
                  ref: { type: [string, 'null'], description: 'Document number; the IP number for patient-wise consumption; never a name.' }
                  store: { $ref: '#/components/schemas/StoreRef' }
                  state: { $ref: '#/components/schemas/StockState' }
                  batch: { $ref: '#/components/schemas/BatchRef' }
                  qtyIn: { type: [integer, 'null'], minimum: 0, description: '0.3.2: qtyIn, qtyOut and balance are null on the lines of a store where the caller is blind and the product is on its open audit (rule 24).' }
                  qtyOut: { type: [integer, 'null'], minimum: 0 }
                  balance: { type: [integer, 'null'], minimum: 0 }
                  user: { oneOf: [ { $ref: '#/components/schemas/PersonRef' }, { type: 'null' } ], description: 'null = System.' }
                  secondSigner: { oneOf: [ { $ref: '#/components/schemas/PersonRef' }, { type: 'null' } ] }
                  reversesLedgerId: { type: [string, 'null'], format: uuid }
    ReportColumn:
      type: object
      required: [key, label, kind]
      properties:
        key: { type: string }
        label: { type: string }
        kind: { type: string, enum: [TEXT, INTEGER, PAISE, RATE, PERCENT, DATE, DATE_TIME] }
    ReportPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [reportKey, title, columns, rows, totals]
          properties:
            reportKey: { type: string }
            title: { type: string }
            columns: { type: array, items: { $ref: '#/components/schemas/ReportColumn' } }
            rows: { type: array, items: { type: array, items: { type: [string, integer, 'null'] } }, description: 'Cells in column order; PAISE and INTEGER as integers, others as strings.' }
            totals: { type: [array, 'null'], items: { type: object, required: [label, cells], properties: { label: { type: string }, cells: { type: array, items: { type: [string, integer, 'null'] } } } }, description: 'purchase-register: per vendor and per GST %.' }
    # ================================================================ SAH-79 schemas end
