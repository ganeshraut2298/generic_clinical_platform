    post:
      tags: [SAH-79-5]
      operationId: pharmacyCreateStockAdjustment
      summary: Correct a batch quantity (book to physical) with a reason; posts at once or waits for approval
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability adjustStock: HOD, current delegate, PHARMACIST member mapped, Central Store user, OWNER; OQ-79-27)'
      x-sub-story: SAH-79-5
      x-work-package: WP-D
      description: >-
        Order after the store guard: clientKey replay; 400 validation (all together): batchId an AVAILABLE batch
        of this store that has not expired (Quarantine and expired batches are not offered; damaged or expired
        stock goes through damage reports), physicalQty a whole number 0 to 999999, physicalQty equal to the book
        quantity "No change to post", reasonKey from list stock-adjustment "Choose a reason" (rule 21);
        bookQtySeen differs from the current AVAILABLE quantity 409 changed with current (the screen reloads);
        another adjustment of this batch in this store waiting 409 adjustment-waiting "An adjustment for this
        batch is already waiting."; a Schedule X product: rule 19 (OWNER refused, 403 schedule-x-pharmacist).
        Saved with an ADJ number (OQ-79-14). The STOCK_ADJUSTMENT rule decides (rule 18; amount = |difference| x
        purchase rate per issue unit, without GST, BR-17; SCHEDULE_X_ITEM applies to a Schedule X batch): level
        0 posts now; otherwise WAITING_APPROVAL and the approval posts (0.3.4, QA D-5: before an owner first
        saves the approval rules the engine applies the served Standard preset, versionNo 0, so the adjustment
        waits for the owner and is not posted at once). Posting writes STOCK_ADJUSTMENT ledger
        lines on the batch in AVAILABLE (+ or -), reason, raiser, approver, reference ADJ number, and
        reversesLedgerId when correctsLedgerId was given (a ledger line of this store and batch, else 400). A
        decrease larger than AVAILABLE at posting 409 insufficient-stock. An increase is found stock on the same
        batch. Audit PHARMACY_STOCK_ADJUSTMENT_RAISED and _POSTED (ids, difference, value). 201 with the
        adjustment. Blind count (rule 24, 0.3.2): for a blind caller and a product on the store's open audit, 409
        changed answers no current and 409 insufficient-stock answers available null; the stock reads show such
        a caller no book quantity, so the adjustment of an audited product waits until the audit is CLOSED (the
        variance review posts the count). The 201 answer follows pharmacyListStockAdjustments.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockAdjustmentCreate' }
            examples:
              decrease: { value: { clientKey: 00000000-0000-4000-8000-00000000d004, batchId: 00000000-0000-4000-8000-0000000002b1, bookQtySeen: 40, physicalQty: 38, reasonKey: stock-adjustment.count-mismatch, note: null, correctsLedgerId: null, secondSigner: null } }
      responses:
        '201': { description: Saved (POSTED or WAITING_APPROVAL), content: { application/json: { schema: { $ref: '#/components/schemas/StockAdjustment' } } } }
        '200': { description: Replay of the same clientKey, content: { application/json: { schema: { $ref: '#/components/schemas/StockAdjustment' } } } }
