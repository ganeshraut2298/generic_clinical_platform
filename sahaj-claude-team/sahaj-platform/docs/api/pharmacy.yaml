        urgent first, then escalated, then longest waiting. type filters the chips: INDENTS (INDENT), PURCHASE
        (PURCHASE_ORDER, GRN_RATE_RISE, VENDOR_RETURN), STOCK (WRITE_OFF, STOCK_ADJUSTMENT including audit
        variances, STOCK_TRANSFER); counts are for the caller and ignore type; no Sales chip in 0.2.0 (SAH-80).
