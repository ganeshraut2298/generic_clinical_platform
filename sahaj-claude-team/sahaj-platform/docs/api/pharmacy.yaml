  - { name: SAH-79-common, description: 'WP-D · Reasons for Phase 2 screens' }
paths:
  # ---------------------------------------------------------------- SAH-78-1 / SAH-78-4 context
  /context:
    get:
      tags: [SAH-78-1, SAH-78-4]
      operationId: pharmacyContext
      summary: Who I am in Pharmacy & Inventory, my stores, my working store and what the screens may show
      x-required-role: PHARMACY_ACCESS
      description: >-
        Read once when the Pharmacy & Inventory entry opens and after every working-store change. Returns the
        unit header (unit name from the clinic profile through platform.api, never re-typed), the Integration
        mode, the caller's access level and capabilities, the caller's ACTIVE mappings to ACTIVE stores (OWNER
        included only where mapped; OWNER reaches every store without a mapping, but the working-store select
        lists mapped stores only, story 78-4), and the working store. workingStoreId is the remembered store
        (pharmacy.staff_preference) when it is still one of stores; when the caller has exactly one store it is
        that store; otherwise null and mustPickWorkingStore true when stores has two or more entries. A
        remembered store that was switched off or unmapped is dropped here (the client asks again). Angular
        shows only what capabilities lists (hidden, never greyed; BRD section 7) and ignores unknown values
        (later phases add values). Writes nothing.
      responses:
        '200':
          description: Context
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PharmacyContext' }
              examples:
                pharmacistTwoStores:
                  value:
                    unit: { name: Test Clinic Baner, code: TCB, integrationMode: INTEGRATED }
                    caller: { membershipId: 00000000-0000-4000-8000-000000000011, name: Test Pharmacist One, role: PHARMACIST, roleLabel: Pharmacist, setupAccess: VIEW }
                    capabilities: [SETUP_VIEW, OPENING_STOCK_UPLOAD]
                    stores:
                      - storeId: 00000000-0000-4000-8000-0000000000a2
                        name: Test Main Pharmacy
                        code: PHARM
                        type: PHARMACY
                        storeRole: STORE_USER
                        effectiveStoreRole: STORE_USER
                        access: { raiseIndent: true, approve: false, receive: true, receiveScheduleX: true, consumeReturn: false, uploadOpeningStock: true }
                      - storeId: 00000000-0000-4000-8000-0000000000a3
                        name: Test OPD Store
                        code: OPD
                        type: SUB_STORE
                        storeRole: STORE_USER
                        effectiveStoreRole: STORE_USER
                        access: { raiseIndent: true, approve: false, receive: true, receiveScheduleX: true, consumeReturn: true, uploadOpeningStock: true }
                    workingStoreId: null
                    mustPickWorkingStore: true
                    fixedRules: { fefo: true, negativeStockBlocked: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden', description: 'module-off; forbidden ("You do not have access to Pharmacy & Inventory. Ask your owner.")' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /context/working-store:
    put:
      tags: [SAH-78-4]
      operationId: pharmacySetWorkingStore
      summary: Remember my working store
      x-required-role: PHARMACY_ACCESS
      x-store-access: OPERATION (any active mapping to the store; OWNER only where mapped)
      description: >-
        Saves the caller's working store in pharmacy.staff_preference for the next sign-in. Convenience only:
        every store operation still checks its {storeId} path. The store must be one of GET /context stores,
        else 404 not-found and the remembered store does not change (stories say 403 outside-store; DEC-063 Q1
        decided 404). Not audited (a preference, not a master). Answers the new context.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkingStoreInput' }
            examples:
              pick: { value: { storeId: 00000000-0000-4000-8000-0000000000a3 } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/PharmacyContext' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation (storeId missing or not a UUID)' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound', description: 'not-found (unknown, foreign, switched-off or unmapped store)' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /setup-summary:
    get:
      tags: [SAH-78-1]
      operationId: pharmacySetupSummary
      summary: Live subtitles of the setup tabs
      x-required-role: SETUP_VIEW
      description: >-
        Counts for the section tabs of mockup 16: "7 stores · 24 staff mapped" (ACTIVE stores; distinct members
        with an ACTIVE mapping to an ACTIVE store who can sign in), "Global catalogue + own products" (fixed
        text, no count) and "12 active suppliers" (ACTIVE vendors, Blocked ones included because they are still
        suppliers; INACTIVE excluded). Counted by the server for the caller's unit. Writes nothing.
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupSummary' }
              examples:
                some: { value: { storeCount: 7, mappedStaffCount: 24, activeVendorCount: 12 } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  # ---------------------------------------------------------------- SAH-78-2 unit settings
  /unit-settings:
    get:
      tags: [SAH-78-2]
      operationId: pharmacyGetUnitSettings
      summary: Unit settings (GSTIN, drug licence, Integration mode, fixed FEFO and negative-stock rules)
      x-required-role: SETUP_VIEW
      description: >-
        Defaults until the first save (saved false, version 0): GSTIN, licence number and date empty, Integration
        mode INTEGRATED (OQ-78-14; ADR-028 D5 revised). fefo and negativeStockBlocked are always true and cannot
        be sent (OQ-78-11, DEC-062 Q4). unitName comes from the clinic profile; unitCode is derived once from the
        clinic web address (three letters, read-only; used in own product codes U-<unitCode>-nnnn).
        ipdAvailable is false when the clinic's IPD module is off, so the screen can say that IPD parts stay
        hidden even in Integrated mode. drugLicenceExpired is true when drugLicenceValidTill is before today
        (IST). Writes nothing (the unit row is created at the first write of any master).
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnitSettings' }
              examples:
                saved: { value: { unitName: Test Clinic Baner, unitCode: TCB, gstin: 27AAAAA0000A1Z5, drugLicenceNo: TEST-DL-0001, drugLicenceValidTill: '2028-03-31', drugLicenceExpired: false, integrationMode: INTEGRATED, fefo: true, negativeStockBlocked: true, ipdAvailable: true, saved: true, version: 3, updatedAt: '2026-11-17T06:05:00Z' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
    put:
      tags: [SAH-78-2]
      operationId: pharmacyPutUnitSettings
      summary: Save unit settings
      x-required-role: SETUP_EDIT
      description: >-
        OWNER only. Field rules (400 validation, all together): gstin null or empty is allowed ("Not set"),
        otherwise 15 characters of the GSTIN pattern, upper-cased by the server, else "Enter a 15-character
        GSTIN" (format only, no check digit or lookup, OQ-78-23); drugLicenceNo up to 40 characters; a licence
        date in the past is allowed. Any other field (fefo, negativeStockBlocked, unitName, unitCode) is refused
        with 400 validation (additional properties). version not current 409 settings-changed with current.
        The confirmation of an Integration mode change is a client step ("Standalone hides OPD and IPD links.
        Existing records are kept." / the opposite for Integrated); the server deletes nothing. Audit
        PHARMACY_UNIT_SETTINGS_CHANGED (changed fields, before and after) and, when the mode changed, also
        PHARMACY_INTEGRATION_MODE_CHANGED. Every later read sees the new mode.
        0.3.0 (SAH-80-1, TP-10): the optional fields returnWindowDays (1 to 365 or null, "Enter 1 to 365 days"),
        refundModes, scheduleXLicenceNo (up to 40) and scheduleXLicenceValidTill; absent fields stay unchanged.
        Integration-mode guard (ADR-028 D5, DEC-074 OQ-80-42): a change from INTEGRATED to STANDALONE while any
        IPD issue line is Charge pending, any ward return line is Credit pending, any bill is Link to patient
        pending or any prescription is Part supplied answers 409 open-integrated-documents "Finish or link these
        first: <n> IPD issues without a charge, <n> returns without a credit, <n> bills without a patient link,
        <n> part-supplied prescriptions.", nothing changed. STANDALONE to INTEGRATED is unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnitSettingsInput' }
            examples:
              save: { value: { version: 3, gstin: 27AAAAA0000A1Z5, drugLicenceNo: TEST-DL-0001, drugLicenceValidTill: '2028-03-31', integrationMode: STANDALONE } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/UnitSettings' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation (fieldErrors on gstin, drugLicenceNo, drugLicenceValidTill, integrationMode, version, or an unknown field; 0.3.0 also returnWindowDays, refundModes, scheduleXLicenceNo, scheduleXLicenceValidTill)' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict', description: 'settings-changed (with current); 0.3.0 open-integrated-documents (a switch to Standalone while integrated documents are open)' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  # ---------------------------------------------------------------- SAH-78-3 stores
  /stores:
    get:
      tags: [SAH-78-3]
      operationId: pharmacyListStores
      summary: Stores in this unit (tree data)
      x-required-role: SETUP_VIEW
      description: >-
        Small and complete list (not paged): the Central Store first, then the other stores by name. includeInactive
        false (default) lists ACTIVE stores only. Each store carries its HOD and delegate (derived from the
        APPROVER and DELEGATE mappings, story 78-3), approverState NONE when no ACTIVE HOD who can sign in exists
        ("No approver set"), and staffCount (ACTIVE mappings of members who can sign in). Writes nothing.
      parameters:
        - { name: includeInactive, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200': { description: Stores, content: { application/json: { schema: { $ref: '#/components/schemas/StoreList' } } } }
        '400': { $ref: '#/components/responses/Problem', description: validation (includeInactive not a boolean) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
    post:
      tags: [SAH-78-3]
      operationId: pharmacyCreateStore
      summary: Create a store
      x-required-role: SETUP_EDIT
      x-store-access: MASTER
      description: >-
        OWNER only. Order of checks: body 400 validation (name empty "Enter the store name", over 60 characters;
        code empty "Enter the store code", over 10 characters or not letters, digits and hyphen; type missing;
        delegate rules as DelegateInput; hodMembershipId or delegate member not an ACTIVE member allowed as
        Approver (OWNER, DOCTOR, NURSE, PHARMACIST; OQ-78-6) "Choose an active owner, doctor, nurse or
        pharmacist"; delegate equal to HOD "The delegate must be a different person from the approver"); then
        409: type CENTRAL while an ACTIVE Central Store exists central-store-exists "This unit already has a
        Central Store."; any other type while none exists central-store-missing "Create the Central Store
        first."; name used by another store of this unit (any status, ignoring case) store-name-in-use "That
        store name is already used"; code likewise store-code-in-use "That store code is already used".
        issuesFrom is set by the server: null for CENTRAL, the Central Store for every other type (OQ-78-12,
        depth one). saleAllowed defaults true for PHARMACY and false otherwise; consumptionAllowed defaults true
        for WARD and false otherwise (NEW defaults). Choosing an HOD or delegate who is not mapped maps them with
        role APPROVER or DELEGATE in the same transaction. Audit PHARMACY_STORE_CREATED (and PHARMACY_STAFF_MAPPED
        for any mapping made). 201 with the store.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreCreate' }
            examples:
              ward:
                value: { name: Test Ward 3B Store, code: W3B, type: WARD, saleAllowed: false, consumptionAllowed: true, hodMembershipId: 00000000-0000-4000-8000-000000000021, delegate: { membershipId: 00000000-0000-4000-8000-000000000022, from: '2026-11-17', to: '2026-11-30' } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Store' } } } }
        '400': { $ref: '#/components/responses/Problem', description: validation }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict', description: 'central-store-exists, central-store-missing, store-name-in-use, store-code-in-use' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /stores/{storeId}:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    get:
      tags: [SAH-78-3]
      operationId: pharmacyGetStore
      summary: One store (detail card)
      x-required-role: SETUP_VIEW
      x-store-access: MASTER
      description: The detail card of mockup 16 in field order Store type, Issues from, Approver (HOD), Delegate approver, Sale to patients, Consumption entry. A switched-off store is readable. Writes nothing.
      responses:
        '200': { description: Store, content: { application/json: { schema: { $ref: '#/components/schemas/Store' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
    put:
      tags: [SAH-78-3]
      operationId: pharmacyUpdateStore
      summary: Change a store
      x-required-role: SETUP_EDIT
      x-store-access: MASTER
      description: >-
        OWNER only. Same field rules as create plus version. When the store hasStock (an APPROVED opening-stock
        import exists), type and code are locked: a different value answers 409 store-has-stock "This store has
        stock. Type and code cannot change." (lockedFields lists them); name, HOD, delegate, saleAllowed and
        consumptionAllowed can still change. Changing type to or from CENTRAL is refused with 409
        central-store-exists or central-store-in-use. A new HOD turns the previous APPROVER mapping into
        STORE_USER (kept, not removed) and maps the new one as APPROVER; a new delegate does the same for
        DELEGATE; delegate null ends the current delegation (mapping becomes STORE_USER). A switched-off store
        cannot be changed: 409 store-inactive "This store is switched off.". version not current 409
        settings-changed. Audit PHARMACY_STORE_CHANGED (before and after) and the mapping audits.
        Open import (0.1.3, general rule 14): a code different from the saved one while this store has a DRAFT or
        WAITING_APPROVAL opening-stock import answers 409 open-import "Finish or reject the opening stock file of
        this store first." and nothing changes (rows of the file name the store by its code). Sending the saved
        code unchanged is not refused, and every other
        field (name, type, HOD, delegate, saleAllowed, consumptionAllowed) can still change. Checked under the
        store row lock, the lock an import start and submit take first (ADR-028 R5-2).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreUpdate' }
            examples:
              newDelegate: { value: { version: 4, name: Test OPD Store, code: OPD, type: SUB_STORE, saleAllowed: false, consumptionAllowed: true, hodMembershipId: 00000000-0000-4000-8000-000000000021, delegate: { membershipId: 00000000-0000-4000-8000-000000000022, from: '2026-11-17', to: '2026-11-30' } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Store' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation; or bad-request when {storeId} is not a UUID' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 'settings-changed (with current), store-has-stock, store-inactive, store-name-in-use, store-code-in-use, central-store-exists, central-store-in-use, open-import (0.1.3: a code change while the store has a DRAFT or WAITING_APPROVAL import)' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /stores/{storeId}/switch-off:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    post:
      tags: [SAH-78-3]
      operationId: pharmacySwitchOffStore
      summary: Switch a store off (never deleted)
      x-required-role: SETUP_EDIT
      x-store-access: MASTER
      description: >-
        OWNER only. No body. The store becomes INACTIVE: it is not offered for new work, its mappings stop
        counting (they stay as records), and it disappears from GET /context. hasStock 409 store-has-stock "This
        store has stock. Clear it in Inventory first." (OQ-78-38). The Central Store while another store is
        ACTIVE 409 central-store-in-use "Switch off the other stores first.". Already INACTIVE: 200, nothing
        written (safe repeat). There is no switch-on in 0.1.0 (not in the stories). Audit
        PHARMACY_STORE_SWITCHED_OFF. Open import (0.1.3, general rule 14): while this store has a DRAFT or
        WAITING_APPROVAL opening-stock import, 409 open-import "Finish or reject the opening stock file of this
        store first." and the store stays ACTIVE (a switched-off store would leave the file unreachable: approve
        and reject answer 404 for it). Checked under the store row lock, the lock an import start and submit take
        first (ADR-028 R5-2). An already INACTIVE store still answers 200 with nothing written.
      responses:
        '200': { description: Switched off, content: { application/json: { schema: { $ref: '#/components/schemas/Store' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 'store-has-stock, central-store-in-use, open-import (0.1.3: the store has a DRAFT or WAITING_APPROVAL import)' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  # ---------------------------------------------------------------- SAH-78-4 staff mapping
  /staff-candidates:
    get:
      tags: [SAH-78-4]
      operationId: pharmacyStaffCandidates
      summary: Team members who can be mapped, with the store roles each may take
      x-required-role: SETUP_EDIT
      description: >-
        OWNER only. ACTIVE team members of the clinic (through platform.api TeamMemberPort; never mobile numbers),
        each with allowedStoreRoles from the role table of ADR-028 D4 (OQ-78-6, DEC-062 Q3): OWNER, DOCTOR, NURSE,
        PHARMACIST: STORE_USER, CENTRAL_STORE_USER, APPROVER, DELEGATE; BILLING and STORE_STAFF: STORE_USER,
        CENTRAL_STORE_USER; VISITING_DOCTOR, FRONT_DESK, COUNSELLOR: STORE_USER. storeRole filters to members allowed
        that role. Small and complete list. Writes nothing.
        Two forms (0.1.1, code review F-11). With storeId (unchanged from 0.1.0): CENTRAL_STORE_USER is offered only
        when storeId is the Central Store, and alreadyMappedHere is true when the member has an ACTIVE mapping to
        storeId. Without storeId (absent or sent empty): the members who can be mapped at all, by team role only,
        for the store form before the store exists (the first Central Store's Approver (HOD) and Delegate approver
        selects, mockup 16 detail card; the client asks with storeRole APPROVER and DELEGATE). In this form
        allowedStoreRoles is the full team-role list above (CENTRAL_STORE_USER included where the team role allows
        it, because no store type is known; POST /stores and POST /stores/{storeId}/staff check the store again),
        and alreadyMappedHere is always false (no store to compare). Check order is the same in both forms
        (general rule 2): module-off 403, then access level 403 (SETUP_EDIT), then 400 validation for a storeId
        that is not a UUID or an unknown storeRole, then 404 for an unknown or foreign storeId (the form without
        storeId never answers 404).
      parameters:
        - { name: storeId, in: query, required: false, schema: { type: string, format: uuid }, description: 'Optional since 0.1.1. Absent or empty = no store (team-role filtering only).' }
        - { name: storeRole, in: query, required: false, schema: { $ref: '#/components/schemas/StoreRole' } }
      responses:
        '200': { description: Candidates, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/StaffCandidate' } } } } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation (storeId not a UUID, storeRole unknown)' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound', description: 'not-found (storeId given and the store is unknown or foreign; never without storeId)' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /stores/{storeId}/staff:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    get:
      tags: [SAH-78-4]
      operationId: pharmacyListStoreStaff
      summary: Staff mapped to this store (mockup 16 table)
      x-required-role: SETUP_VIEW
      x-store-access: MASTER
      description: >-
        Small and complete list, HOD first, then delegate, then by name. Columns of mockup 16: Staff (name and,
        below it, the Sahaj role label, or "HOD, <store>" for the HOD), Store role chip (Approver, "Delegate ·
        till 30 Nov", "Delegate · ended 30 Nov", Store user, Central Store user), Raise indent, Approve, Receive
        ("Yes · incl. Schedule X" when receiveScheduleX), Consume / return, Other stores (other ACTIVE stores of
        ACTIVE mappings, or "—"). access is derived by the server (ADR-028 D4 capability table), never stored and
        never sent by the client. memberState CANNOT_SIGN_IN when the team member is switched off ("Cannot sign
        in", NEW); such a mapping gives no access. needsReview true when the store role is no longer allowed for
        the member's current team role (the mapping then counts as Store user). includeRemoved adds REMOVED rows
        (history). Writes nothing.
      parameters:
        - { name: includeRemoved, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Mapped staff
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/StaffMapping' } } } }
              examples:
                opdStore:
                  value:
                    items:
                      - id: 00000000-0000-4000-8000-0000000000c1
                        storeId: 00000000-0000-4000-8000-0000000000a3
                        membershipId: 00000000-0000-4000-8000-000000000021
                        name: Test Doctor One
                        role: DOCTOR
                        roleLabel: Doctor
                        isHod: true
                        storeRole: APPROVER
                        effectiveStoreRole: APPROVER
                        delegateFrom: null
                        delegateTo: null
                        delegateState: null
                        access: { raiseIndent: true, approve: true, receive: true, receiveScheduleX: false, consumeReturn: true, uploadOpeningStock: false }
                        otherStores: []
                        memberState: ACTIVE
                        needsReview: false
                        status: ACTIVE
                        version: 1
                      - id: 00000000-0000-4000-8000-0000000000c3
                        storeId: 00000000-0000-4000-8000-0000000000a3
                        membershipId: 00000000-0000-4000-8000-000000000031
                        name: Test Store Staff One
                        role: STORE_STAFF
                        roleLabel: Store staff
                        isHod: false
                        storeRole: STORE_USER
                        effectiveStoreRole: STORE_USER
                        delegateFrom: null
                        delegateTo: null
                        delegateState: null
                        access: { raiseIndent: true, approve: false, receive: true, receiveScheduleX: false, consumeReturn: true, uploadOpeningStock: false }
                        otherStores: []
                        memberState: ACTIVE
                        needsReview: false
                        status: ACTIVE
                        version: 1
        '400': { $ref: '#/components/responses/Problem', description: 'validation (includeRemoved); or bad-request when {storeId} is not a UUID' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
    post:
      tags: [SAH-78-4]
      operationId: pharmacyMapStaff
      summary: Map a team member to this store with a store role
      x-required-role: SETUP_EDIT
      x-store-access: MASTER
      description: >-
        OWNER only. The store must be ACTIVE (switched off 409 store-inactive). Checks: 400 validation: membershipId not an
        ACTIVE member of this clinic "Choose an active team member"; storeRole not allowed for the member's team
        role (table on GET /staff-candidates) "This person cannot have this store role"; CENTRAL_STORE_USER at a
        store that is not the Central Store "Central Store user is only for the Central Store"; DELEGATE without
        dates, to before from, a period longer than 90 calendar days counting both the start and the end date
        (delegateTo - delegateFrom > 89), or a delegate who is this store's HOD (DelegateInput texts).
        409 already-mapped "That person is already in this store" when an ACTIVE mapping exists (a REMOVED
        mapping of the same person is re-activated with the new role instead: one row per person and store);
        409 approver-exists "This store already has an approver. Change it on the store." for a second APPROVER;
        a second DELEGATE likewise approver-exists "This store already has a delegate. Change it on the store.".
        Mapping the same person to other stores is allowed (AC-M2). Audit PHARMACY_STAFF_MAPPED. 201.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffMappingInput' }
            examples:
              storeUser: { value: { membershipId: 00000000-0000-4000-8000-000000000031, storeRole: STORE_USER } }
      responses:
        '201': { description: Mapped, content: { application/json: { schema: { $ref: '#/components/schemas/StaffMapping' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation; or bad-request when {storeId} is not a UUID' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 'already-mapped, approver-exists, store-inactive' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /stores/{storeId}/staff/{mappingId}:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/MappingId'
    put:
      tags: [SAH-78-4]
      operationId: pharmacyChangeStaffMapping
      summary: Change a mapping's store role or delegate dates
      x-required-role: SETUP_EDIT
      x-store-access: MASTER
      description: >-
        OWNER only. Same rules as mapping (400, 409 approver-exists) plus version (409 settings-changed). A REMOVED
        mapping 404. Ending a delegation early: send the new to date (today or later) or storeRole STORE_USER.
        Audit PHARMACY_STAFF_MAPPING_CHANGED (before and after).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffMappingUpdate' }
            examples:
              endEarly: { value: { version: 2, storeRole: DELEGATE, delegateFrom: '2026-11-17', delegateTo: '2026-11-20' } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/StaffMapping' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation; or bad-request when a path id is not a UUID' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 'settings-changed (with current), approver-exists' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /stores/{storeId}/staff/{mappingId}/remove:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/MappingId'
    post:
      tags: [SAH-78-4]
      operationId: pharmacyRemoveStaffMapping
      summary: Remove a person from a store (the row stays as history)
      x-required-role: SETUP_EDIT
      x-store-access: MASTER
      description: >-
        OWNER only. No body. status REMOVED; the person loses the store at their next request. Removing the HOD or
        delegate leaves the store "No approver set" (or without delegate). Already REMOVED: 200, nothing written.
        Audit PHARMACY_STAFF_REMOVED (who removed whom, ids).
      responses:
        '200': { description: Removed, content: { application/json: { schema: { $ref: '#/components/schemas/StaffMapping' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  # ---------------------------------------------------------------- SAH-78-5 / 78-6 products
  /products:
    get:
      tags: [SAH-78-5]
      operationId: pharmacySearchProducts
      summary: Search global catalogue and own products together
      x-required-role: SETUP_VIEW
      description: >-
        One list of global catalogue products (ACTIVE in the catalogue, plus withdrawn ones this unit adopted,
        shown WITHDRAWN) and this unit's own products. q of 2 or more characters matches name, salt, alias,
        barcode (catalogue and local) and code, ignoring case; under 2 characters (or absent) the first page is
        unfiltered. Matching (0.1.2): name, salt, alias and code match when they contain q as a substring; a
        barcode (a catalogue barcode or the unit's local barcode) matches only when it equals q exactly, ignoring
        case (part of a barcode does not match). Order: exact code or barcode match first, then name. Page size 25 by default (story 78-5).
        Target 300 ms for the sample catalogue (QA performance test). inUnit for a global row is ADOPTED or
        NOT_ADOPTED (or WITHDRAWN when adopted and withdrawn); for an own row ACTIVE or INACTIVE; an adopted row
        switched off by the unit reads INACTIVE. sample true marks seeded catalogue rows "Sample, not clinically
        validated" (DEC-062 Q2). Same answer to every reader; buttons are a client matter (OWNER only). Writes
        nothing.
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 60 } }
        - { name: source, in: query, required: false, schema: { type: string, enum: [GLOBAL, OWN] } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 2000, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 25 } }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductPage' }
              examples:
                search:
                  value:
                    items:
                      - { source: GLOBAL, catalogueProductId: 00000000-0000-4000-8000-0000000000f1, productId: 00000000-0000-4000-8000-0000000000e1, code: G-000101, name: Sample Ceftriaxone 1 g injection, manufacturer: Sample Labs (fake), madeInHouse: false, salt: Ceftriaxone, strength: 1 g, form: injection, purchaseUnit: Box of 10, issueUnit: vial, conversion: 10, hsn: '3004', gstRate: '12', schedule: H, ndps: false, inUnit: ADOPTED, sample: true, alias: null }
                      - { source: OWN, catalogueProductId: null, productId: 00000000-0000-4000-8000-0000000000e2, code: U-TCB-0001, name: Test dressing kit (OT), manufacturer: null, madeInHouse: true, salt: Dressing kit, strength: 1 kit, form: kit, purchaseUnit: Kit, issueUnit: kit, conversion: 1, hsn: '3005', gstRate: '12', schedule: NONE, ndps: false, inUnit: ACTIVE, sample: false, alias: OT kit }
                    total: 2
                    page: 0
                    size: 25
        '400': { $ref: '#/components/responses/Problem', description: 'validation (q over 60 characters, source, page or size out of range)' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
    post:
      tags: [SAH-78-6]
      operationId: pharmacyCreateOwnProduct
      summary: Create an own product (duplicate check first)
      x-required-role: SETUP_EDIT
      description: >-
        OWNER only. Order: clientKey replay (rule 10); body 400 validation, all field errors together (texts in
        OwnProductInput; schedule null "Choose the schedule", BR-16; manufacturer empty while madeInHouse false
        "Enter the manufacturer or choose Made in-house"); then the duplicate check (OQ-78-17, DEC-062): the
        normalised key of salt, strength and form (trimmed, lower case, spaces collapsed, strength units
        normalised, for example "1 g" = "1000 mg") is compared with ACTIVE catalogue products first and then
        with this unit's ACTIVE own products. When matches exist and ignoreDuplicates is false: 409
        possible-duplicate with candidates (global first; manufacturer of each), nothing saved; the client shows
        "Possible duplicate: global product "<name>" (<code>) has the same salt, strength and form. Use it
        instead of creating a new one?" with "Use global product" (POST /catalogue-products/{id}/adopt) or
        "Create anyway" (repeat with ignoreDuplicates true). Then barcode used by another ACTIVE product of this
        unit 409 barcode-in-use "That barcode is already used by <product>". The code U-<unitCode>-nnnn (4
        digits minimum) is taken from the unit counter in the same transaction (no gaps on rollback). Audit
        PHARMACY_OWN_PRODUCT_CREATED with the field values and, when created despite matches,
        duplicateOfCodes (recomputed by the server). 201.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnProductInput' }
            examples:
              kit: { value: { clientKey: 00000000-0000-4000-8000-00000000b001, name: Test dressing kit (OT), salt: Dressing kit, strength: 1 kit, form: kit, purchaseUnit: Kit, issueUnit: kit, conversion: 1, manufacturer: null, madeInHouse: true, hsn: '3005', gstRate: '12', schedule: NONE, barcode: null, ignoreDuplicates: false } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ProductDetail' } } } }
        '200': { description: Replay of the same clientKey by the same caller; nothing written, content: { application/json: { schema: { $ref: '#/components/schemas/ProductDetail' } } } }
        '400': { $ref: '#/components/responses/Problem', description: validation }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 'possible-duplicate (with candidates), barcode-in-use, client-key-reused'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                duplicate:
                  value:
                    type: 'https://sahaj.in/problems/possible-duplicate'
                    title: Possible duplicate
                    status: 409
                    detail: A product with the same salt, strength and form exists.
                    candidates:
                      - { source: GLOBAL, catalogueProductId: 00000000-0000-4000-8000-0000000000f1, productId: null, code: G-000101, name: Sample Ceftriaxone 1 g injection, manufacturer: Sample Labs (fake), madeInHouse: false, inUnit: NOT_ADOPTED }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /products/duplicates:
    get:
      tags: [SAH-78-6]
      operationId: pharmacyFindDuplicates
      summary: Duplicate candidates for salt, strength and form (checked when the owner leaves the field)
      x-required-role: SETUP_EDIT
      description: >-
        OWNER only. The same check as POST /products, without saving: ACTIVE catalogue matches first, then ACTIVE
        own products of this unit; excludeProductId leaves out the product being edited. At most 10 candidates.
        Writes nothing, not audited.
      parameters:
        - { name: salt, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 80 } }
        - { name: strength, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 80 } }
        - { name: form, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 30 } }
        - { name: excludeProductId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Candidates (may be empty), content: { application/json: { schema: { type: object, required: [candidates], properties: { candidates: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/DuplicateCandidate' } } } } } } }
        '400': { $ref: '#/components/responses/Problem', description: validation }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /product-options:
    get:
      tags: [SAH-78-6]
      operationId: pharmacyProductOptions
      summary: Suggestions for purchase unit, issue unit and form
      x-required-role: SETUP_VIEW
      description: >-
        OQ-78-21: a starter list (Box, Strip, Bottle, Vial, Ampoule, Tablet, Capsule, Kit, Tube, Sachet for units;
        tablet, capsule, syrup, injection, infusion, ointment, cream, drops, inhaler, kit, device, consumable for
        forms) plus the distinct values this unit already used, sorted A-Z. The owner may type a new value (it
        becomes a suggestion once used). Writes nothing.
      responses:
        '200': { description: Options, content: { application/json: { schema: { $ref: '#/components/schemas/ProductOptions' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /catalogue-products/{catalogueProductId}/adopt:
    parameters:
      - { name: catalogueProductId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [SAH-78-5, SAH-78-6]
      operationId: pharmacyAdoptCatalogueProduct
      summary: Adopt a global product for this unit (idempotent)
      x-required-role: SETUP_EDIT
      description: >-
        OWNER only. No body. Creates the unit's product row linked to the catalogue product (global fields are
        never copied; ADR-028 D3). Already adopted: 200 with the existing product, nothing written (BR-19). An
        adopted product that the unit switched off is not switched on again by adopt (use local settings). Unknown
        id 404; a catalogue product withdrawn (active false) and not adopted 409 product-withdrawn "This product
        was withdrawn from the catalogue.". Audit PHARMACY_PRODUCT_ADOPTED (catalogue code), also when reached
        from the duplicate warning ("Use global product"). 201 when created.
      responses:
        '201': { description: Adopted, content: { application/json: { schema: { $ref: '#/components/schemas/ProductDetail' } } } }
        '200': { description: Already adopted; nothing written, content: { application/json: { schema: { $ref: '#/components/schemas/ProductDetail' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: product-withdrawn }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [SAH-78-5, SAH-78-6]
      operationId: pharmacyGetProduct
      summary: One unit product (adopted or own) with local settings
      x-required-role: SETUP_VIEW
      description: >-
        productId is the unit's product row (adopted or own), never a catalogue id. Global fields of an adopted
        product are read from the catalogue at read time. unitsLocked true when the product is in an APPROVED
        opening-stock import (BR-15); unitsLocked always equals hasStock (0.1.2), and in Phase 1 hasStock is set
        only by that approval. localSettings.storeSettings lists every ACTIVE store (reorder level and rack
        null when not set). preferredVendor.needsReview true when that vendor is Blocked or Inactive ("Preferred
        vendor needs review", NEW). Writes nothing.
      responses:
        '200': { description: Product, content: { application/json: { schema: { $ref: '#/components/schemas/ProductDetail' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
    put:
      tags: [SAH-78-6]
      operationId: pharmacyUpdateOwnProduct
      summary: Edit an own product
      x-required-role: SETUP_EDIT
      description: >-
        OWNER only. Own products only: an adopted product answers 400 global-fields-read-only "Global fields
        cannot be changed. Use Local settings." and nothing changes (AC-M3). Same field rules and duplicate check
        as create (ignoreDuplicates; the product itself is excluded); code and source never change. unitsLocked
        and a different purchaseUnit, issueUnit or conversion 409 units-locked "Locked because this product has
        stock.". version not current 409 settings-changed. The schedule-change confirmation is a client step.
        Audit PHARMACY_PRODUCT_CHANGED (before and after; duplicateOfCodes when saved despite matches).
        Duplicate check on edit (0.1.2): it runs only when the normalised key of salt, strength and form differs
        from the saved one (so "1 g" changed to "1000 mg" is not a change). An edit that keeps salt, strength and
        form is not checked, and ignoreDuplicates is then ignored; otherwise every later edit of an own product
        that was created with "Create anyway" would have to confirm "Create anyway" again.
        Open import (0.1.3, general rule 14): a purchaseUnit, issueUnit or conversion different from the saved
        one while this product is on a line of a DRAFT or WAITING_APPROVAL opening-stock import (of any store; a
        line whose product code matched this product) answers 409 open-import "Finish or reject the opening stock
        file of this store first." and nothing changes. Every other field can still change. units-locked (the
        product has stock) is checked first, so a product with stock keeps that answer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnProductUpdate' }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/ProductDetail' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation; global-fields-read-only; or bad-request when {productId} is not a UUID' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 'settings-changed (with current), possible-duplicate (with candidates), barcode-in-use, units-locked, open-import (0.1.3: a units or conversion change while the product is on a line of a DRAFT or WAITING_APPROVAL import)' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /products/{productId}/local-settings:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    put:
      tags: [SAH-78-5]
      operationId: pharmacyPutLocalSettings
      summary: Local settings of an adopted or own product
      x-required-role: SETUP_EDIT
      description: >-
        OWNER only. Fields in form order (NEW, OQ-78-3): storeSettings (reorder level per store, whole number 0
        to 999999 in issue units, or null; rack up to 30 characters, or null), preferredVendorId (an ACTIVE, not
        blocked vendor of this unit, or null; a foreign, unknown, blocked or inactive vendor 400 field
        preferredVendorId "Choose an active vendor"; 0.1.2: this check applies only when preferredVendorId differs
        from the saved one; an unchanged preferred vendor that has since become Blocked or Inactive stays savable
        and is shown with needsReview true; Blocked = licence required and licence valid-till before today, IST),
        alias (up to 40), barcode (up to 40, letters, digits and
        hyphen, or null), returnable, active ("Stop using this product"). A global field in the body 400
        validation (additional properties; AC-M3). storeSettings may list only ACTIVE stores of this unit, each
        once (else 400 field storeSettings[n].storeId). barcode used by another ACTIVE product of this unit 409
        barcode-in-use; active false while the product has stock 409 product-has-stock "This product has stock.
        Clear it in Inventory first." (OQ-78-38); version not current 409 settings-changed. Audit
        PHARMACY_LOCAL_SETTINGS_CHANGED (before and after; PHARMACY_PRODUCT_SWITCHED_OFF or _SWITCHED_ON when
        active changed). As built (0.1.2): a storeSettings entry changes only the store it names; a store that is
        not listed keeps its saved reorder level and rack, and an entry with reorderLevel and rack both null
        clears that store. active false answers 409 product-has-stock only when the product is ACTIVE now and has
        stock (saving an already inactive product again is not refused). The barcode-in-use check runs only when
        the product will be ACTIVE after the save.
        Open import (0.1.3, general rule 14): active false for a product that is ACTIVE now and is on a line of a
        DRAFT or WAITING_APPROVAL opening-stock import (of any store; a line whose product code matched this
        product) answers 409 open-import "Finish or reject the opening stock file of this store first." and
        nothing changes. product-has-stock is checked first. Saving with active true, or saving an already
        inactive product again, is not refused; the other local settings of a product on an open import can
        still change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocalSettingsInput' }
            examples:
              save: { value: { version: 2, storeSettings: [ { storeId: 00000000-0000-4000-8000-0000000000a1, reorderLevel: 200, rack: A-3 }, { storeId: 00000000-0000-4000-8000-0000000000a2, reorderLevel: 40, rack: P-12 } ], preferredVendorId: 00000000-0000-4000-8000-0000000000d1, alias: Ceftri 1g, barcode: null, returnable: true, active: true } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/ProductDetail' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation; or bad-request when {productId} is not a UUID' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 'settings-changed (with current), barcode-in-use, product-has-stock, open-import (0.1.3: switching off a product that is on a line of a DRAFT or WAITING_APPROVAL import)' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  # ---------------------------------------------------------------- SAH-78-7 opening stock
  /opening-stock/template:
    get:
      tags: [SAH-78-7]
      operationId: pharmacyOpeningStockTemplate
      summary: Download the CSV template
      x-required-role: PHARMACY_ACCESS
      description: >-
        A fixed UTF-8 CSV (no library; DEC-061): header row "store code,product code,batch,expiry date,MRP,purchase
        rate,quantity" and one example row whose first cell is "#EXAMPLE" (the browser skips rows whose first cell
        starts with #). Rates are rupees per issue unit; expiry date as DD-MM-YYYY, DD/MM/YYYY, YYYY-MM-DD, MM/YYYY
        or MM-YYYY (month forms mean the last day of that month; NEW, see ADR-028 open points). Header
        Content-Disposition attachment; filename="sahaj-opening-stock-template.csv". Writes nothing. 0.1.3
        (code review N-13): the example row's product code is the placeholder PRODUCT-CODE, never a real or
        sample catalogue code (sample codes exist only in sahaj_dev and sahaj_test).
      responses:
        '200':
          description: Template
          content:
            text/csv:
              schema: { type: string }
              examples:
                template: { value: "store code,product code,batch,expiry date,MRP,purchase rate,quantity\n#EXAMPLE,PRODUCT-CODE,TESTB001,31-12-2027,45.50,30.25,100\n" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /opening-stock-imports:
    get:
      tags: [SAH-78-7]
      operationId: pharmacyListAllOpeningStockImports
      summary: Imports of every store (owner's approval list)
      x-required-role: SETUP_EDIT
      description: >-
        OWNER only (the owner reaches every store). Newest first; status filters (for example WAITING_APPROVAL).
        Paged. Writes nothing.
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/ImportStatus' } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 1000, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { description: One page, content: { application/json: { schema: { $ref: '#/components/schemas/ImportPage' } } } }
        '400': { $ref: '#/components/responses/Problem', description: validation }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /stores/{storeId}/opening-stock-imports:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    get:
      tags: [SAH-78-7]
      operationId: pharmacyListOpeningStockImports
      summary: Imports of one store
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability uploadOpeningStock: OWNER; a Central Store user of this store; a PHARMACIST member mapped to this store)'
      description: Newest first, paged. Writes nothing.
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 1000, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { description: One page, content: { application/json: { schema: { $ref: '#/components/schemas/ImportPage' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation; or bad-request when {storeId} is not a UUID' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound', description: 'not-found (unknown, foreign, switched-off or unmapped store)' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
    post:
      tags: [SAH-78-7]
      operationId: pharmacyStartOpeningStockImport
      summary: Start an import for this store (the browser has read the CSV)
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability uploadOpeningStock)'
      description: >-
        The browser reads the file (never sent or stored; no documents service), refuses a non-CSV, empty or
        over-5,000-row file and a wrong header itself with "Use the Sahaj template. Save the file as CSV.", then
        calls this with the header it found and the number of data rows. Server checks: clientKey replay (rule
        10); 400 validation: columns not equal to the template header (trimmed, case-insensitive) field columns
        "Use the Sahaj template. Save the file as CSV."; rowCount outside 1 to 5,000 (OQ-78-35); 409
        opening-stock-already-approved "Opening stock was already approved for this store." (OQ-78-37); 409
        import-waiting "An import for this store is waiting for approval by <name>." when another person's
        import is WAITING_APPROVAL. A DRAFT of the same caller for this store becomes REPLACED. Then rows are sent
        with POST .../lines. Audit PHARMACY_OPENING_STOCK_STARTED (ids, rowCount). 201 with status DRAFT.
        0.2.1 (DEC-077 items 1, 3 and 4). The server takes the store row lock first and then re-checks that the
        store is still ACTIVE: a store switched off meanwhile answers 404 not-found, nothing written (a database
        insert trigger refuses an import for a store that is not ACTIVE as a backstop). Starts limit: a person can
        start at most 10 new imports per store per IST day (counted under the store lock; a clientKey replay is
        not a new start); the 11th answers 409 import-limit "Too many files today. Try again tomorrow.", nothing
        written. The caller's own DRAFT imports of this store are locked before they become REPLACED.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportCreate' }
            examples:
              start: { value: { clientKey: 00000000-0000-4000-8000-00000000c001, columns: [store code, product code, batch, expiry date, MRP, purchase rate, quantity], rowCount: 412 } }
      responses:
        '201': { description: Started, content: { application/json: { schema: { $ref: '#/components/schemas/OpeningStockImport' } } } }
        '200': { description: Replay of the same clientKey by the same caller, content: { application/json: { schema: { $ref: '#/components/schemas/OpeningStockImport' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation; or bad-request when {storeId} is not a UUID' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 'opening-stock-already-approved, import-waiting, client-key-reused; 0.2.1 import-limit (the 11th new import of this person for this store on one IST day)' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /stores/{storeId}/opening-stock-imports/{importId}:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/ImportId'
    get:
      tags: [SAH-78-7]
      operationId: pharmacyGetOpeningStockImport
      summary: One import with its review totals
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability uploadOpeningStock)'
      description: >-
        Review data (story 78-7): store, line count, total quantity, total value at purchase rate in paise (sum of
        line values, each rounded half-up to the paisa), warning count, error count, status, uploader, decision.
        canApprove is true only for an OWNER who did not start the import while it is WAITING_APPROVAL;
        approveLockReason SELF_UPLOADED or NOT_OWNER otherwise (0.1.2: set only while WAITING_APPROVAL and
        canApprove is false, SELF_UPLOADED for the OWNER who started it and NOT_OWNER for a caller who is not an
        OWNER; null in every other status). Counts and totals: while DRAFT they are computed live from the rows
        received so far; from submit on (NOT_ACCEPTED, WAITING_APPROVAL and later) they are the values fixed at
        submit. errorCount is the number of rows with at least one ERROR issue. uploadedBy and decidedBy carry
        the membership id of the person (as everywhere in this API), not a user id. 0.2.0: posted, postedAt and postedBy are set by pharmacyPostOpeningStock (SAH-79-1). Until 0.2.0, posted was always false (approved opening
        stock is posted by the first SAH-79 story; until then no screen shows it as usable stock, BR-30). Writes
        nothing.
      responses:
        '200':
          description: Import
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpeningStockImport' }
              examples:
                waiting: { value: { id: 00000000-0000-4000-8000-0000000000b1, storeId: 00000000-0000-4000-8000-0000000000a1, storeName: Test Central Store, status: WAITING_APPROVAL, rowCount: 412, receivedRows: 412, lineCount: 412, totalQuantity: 18450, totalValuePaise: 125000000, errorCount: 0, warningCount: 2, uploadedBy: { membershipId: 00000000-0000-4000-8000-000000000011, name: Test Pharmacist One }, createdAt: '2026-11-17T05:30:00Z', submittedAt: '2026-11-17T05:41:00Z', decidedBy: null, decidedAt: null, rejectReasonKey: null, rejectNote: null, replacedByImportId: null, canApprove: true, approveLockReason: null, posted: false, version: 3 } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /stores/{storeId}/opening-stock-imports/{importId}/lines:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/ImportId'
    get:
      tags: [SAH-78-7]
      operationId: pharmacyListOpeningStockLines
      summary: Lines of an import, with their errors and warnings
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability uploadOpeningStock)'
      description: By row number. withIssues true lists only rows with an error or warning (the problem list of story 78-7). Paged. Writes nothing.
      parameters:
        - { name: withIssues, in: query, required: false, schema: { type: boolean, default: false } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 1000, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { description: One page, content: { application/json: { schema: { $ref: '#/components/schemas/OpeningStockLinePage' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation; or bad-request when a path id is not a UUID' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
    post:
      tags: [SAH-78-7]
      operationId: pharmacyAddOpeningStockLines
      summary: Send up to 200 rows of the file
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability uploadOpeningStock; only the person who started the import)'
      description: >-
        Rows as text exactly as read from the file (the server parses and checks; ADR-028 D12: at most 200 rows
        per request, inside the 64 KB cap). Only the starter of the import (else 403 store-permission-denied) and
        only while DRAFT (else 409 import-state "This import can no longer be changed."). rowNo 1 to rowCount; a
        rowNo sent again replaces that row (safe retry). Per-row checks (stored on the row, answered in issues;
        they are not a 400): storeCode not the code of this store (ERROR store-mismatch); productCode not an
        ACTIVE adopted (catalogue code) or own product of this unit (ERROR product-unknown); batch empty or over
        20 characters (ERROR batch-invalid); expiry date unreadable (ERROR expiry-invalid) or before tomorrow IST
        (ERROR expiry-past "Expiry date must be in the future"); MRP or purchase rate not above 0 with at most 2
        decimals or over 99,99,999.99 (ERROR mrp-invalid, rate-invalid); quantity not a whole number 1 to
        9,99,999 (ERROR quantity-invalid); purchase rate above MRP (WARNING rate-above-mrp, shown at approval).
        File-wide checks run at submit. Not audited per batch. Matching (0.1.2): storeCode and productCode are
        compared ignoring case and leading or trailing spaces ("central " matches store code CENTRAL, "g-000101"
        matches product G-000101).
        Unchanged resend (0.1.3, security L8): a rowNo sent again with all seven cells (storeCode, productCode,
        batch, expiryDate, mrp, purchaseRate, quantity) exactly equal to the stored ones writes nothing (no row
        update, no new issue rows); its stored issues are answered again. A rowNo sent again with any cell
        different replaces that row and its issues, as before.
        Row cap (0.2.1, DEC-077 item 2; replaces the request cap of 0.1.3). Each import accepts at most 2 x
        rowCount changed rows written (counter line_rows_written). A row counts when it is written: a new rowNo,
        or a rowNo sent again with any cell different. A row sent again with all seven cells unchanged writes
        nothing and does not count, so a request whose rows are all unchanged writes nothing and does not count,
        and a retry after an error resumes without a 409. A request refused with 400, 403, 404 or 409 writes
        nothing and does not count. A request whose changed rows would take the counter above 2 x rowCount
        answers 409 import-state "This import can no longer be changed." with nothing written (the whole request,
        not part of it); once the cap is used up, any further request, a bad body included, answers 409
        import-state. Bad body (0.3.1, D-3): "a bad body" here means a body that is read as JSON of this request
        (LinesInput) but breaks a field rule (rows missing or over 200, a rowNo outside 1 to rowCount or repeated,
        a value over its length); those field rules run after the cap check. A body that cannot be read (missing,
        not JSON or malformed JSON, a field the body does not list, a value of the wrong JSON type) still answers
        400 right after the path-id check as general rule 2 says (malformed-request, or validation with one field
        error), before the 404, the store guard and the cap, so also after the cap is used up. The import stays DRAFT, so submit still works when every row arrived, and otherwise the
        uploader starts again with the file (POST .../opening-stock-imports; this DRAFT becomes REPLACED).
        Example: rowCount 412 allows 824 changed rows; a full first pass writes 412 and a full changed resend
        another 412; the next changed row answers 409. The count is taken under the import row lock, so parallel
        requests cannot pass it together, and it never goes down (database guard). The 0.1.3 request count is no
        longer used.
        Product lock (0.2.1, DEC-077 item 1). The line write reads each named product with a share lock, so a
        product edit (which locks the product row before its open-import check) cannot change the units or switch
        the product off between this check and the write. submit flags a line whose product is no longer ACTIVE
        (ERROR product-unknown).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinesInput' }
            examples:
              batch: { value: { rows: [ { rowNo: 1, storeCode: CENTRAL, productCode: G-000101, batch: TESTB001, expiryDate: 31-12-2027, mrp: '45.50', purchaseRate: '30.25', quantity: '100' } ] } }
      responses:
        '200':
          description: Rows stored; issues for these rows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinesResult' }
              examples:
                oneError: { value: { receivedRows: 200, rowCount: 412, issues: [ { rowNo: 17, field: expiryDate, code: expiry-past, severity: ERROR, message: Expiry date must be in the future } ] } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation (rows missing, over 200, a rowNo outside 1 to rowCount or repeated in the request, a value over its length; after the cap these answer 409 import-state); malformed-request (body missing, not JSON or malformed; general rule 2, before the cap, so also after it is used up); or bad-request when a path id is not a UUID' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 'import-state (not DRAFT; or, 0.2.1, the row cap of 2 x rowCount changed rows written for this import would be passed or is used up, a readable body that breaks a field rule after the cap included; 0.3.1: a body that is not JSON or is malformed answers 400 malformed-request first, cap or not)' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /stores/{storeId}/opening-stock-imports/{importId}/submit:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/ImportId'
    post:
      tags: [SAH-78-7]
      operationId: pharmacySubmitOpeningStockImport
      summary: Check the whole file and send it for approval (all or nothing)
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability uploadOpeningStock; only the starter)'
      description: >-
        No body. Only the starter, only DRAFT (409 import-state). Not every row 1 to rowCount received: 409
        import-incomplete "Some rows did not arrive. Upload the file again." (status stays DRAFT). File-wide
        checks: the same product and batch twice (both rows ERROR batch-repeated); store already has an APPROVED
        import 409 opening-stock-already-approved. Any row ERROR: status NOT_ACCEPTED (final; nothing is partly
        imported; the uploader fixes the file and starts a new import) and 422 opening-stock-invalid with
        errorCount and the first 100 row issues (the rest through GET .../lines?withIssues=true). No error:
        status WAITING_APPROVAL, totals fixed; another WAITING_APPROVAL import of the same caller for this store
        becomes REPLACED ("Replaced", cannot be approved). Audit PHARMACY_OPENING_STOCK_SUBMITTED (ids, line
        count, totals) or PHARMACY_OPENING_STOCK_NOT_ACCEPTED (ids, errorCount). Logs carry counts only. As built
        (0.1.2): the batch repeat compares batch numbers ignoring case (TESTB001 and testb001 of the same product
        are the same batch). In the 422 answer, errorCount is the number of rows with at least one ERROR issue
        (not the number of issues), and rowIssues lists the first 100 ERROR issues by row number; warnings are
        not in it and are read with GET .../lines?withIssues=true. Counts and totals are fixed by submit.
        0.2.1 (DEC-077 item 1): the store row lock is taken first and the store is re-checked ACTIVE (switched off
        meanwhile: 404 not-found, nothing written); a line whose product is no longer ACTIVE is an ERROR
        product-unknown row.
      responses:
        '200': { description: Waiting for approval, content: { application/json: { schema: { $ref: '#/components/schemas/OpeningStockImport' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 'import-state, import-incomplete, opening-stock-already-approved, import-waiting' }
        '422':
          description: opening-stock-invalid (the import is now NOT_ACCEPTED)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                invalid: { value: { type: 'https://sahaj.in/problems/opening-stock-invalid', title: File not accepted, status: 422, detail: 3 rows have problems. Fix them and upload the file again., errorCount: 3, rowIssues: [ { rowNo: 17, field: expiryDate, code: expiry-past, severity: ERROR, message: Expiry date must be in the future } ] } }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /stores/{storeId}/opening-stock-imports/{importId}/approve:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/ImportId'
    post:
      tags: [SAH-78-7]
      operationId: pharmacyApproveOpeningStockImport
      summary: Owner approves an import (fixed rule - never the uploader)
      x-required-role: SETUP_EDIT
      x-store-access: 'OPERATION (OWNER reaches every store)'
      description: >-
        OWNER only (any other role 403 forbidden). The starter of the import 403 self-approval "Another owner must
        approve this import." (fixed rule, OQ-78-36, DEC-062 Q4; also a database check approved_by <>
        uploaded_by). Not WAITING_APPROVAL 409 import-state. Under the import row lock: another APPROVED import of
        this store 409 opening-stock-already-approved. Then APPROVED (final: cannot be edited, cancelled or
        deleted); the store and every product in it get has-stock (store type and code, product units and
        conversion lock; switch-off refused). 0.1.2: "every product in it" means every product named on a line of
        this import; hasStock is set on the store and on those products in the same transaction, and their
        unitsLocked follows (it equals hasStock). Not posted: posting is SAH-79 (OQ-PHI-9). Audit
        PHARMACY_OPENING_STOCK_APPROVED (uploader, approver, time, line count, totals).
        0.2.1 (DEC-077 item 1): the store row lock is taken first and the store is re-checked ACTIVE; a store
        switched off meanwhile answers 404 not-found, nothing written.
      responses:
        '200': { description: Approved, content: { application/json: { schema: { $ref: '#/components/schemas/OpeningStockImport' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 'module-off, forbidden, self-approval'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                self: { value: { type: 'https://sahaj.in/problems/self-approval', title: Not allowed, status: 403, detail: Another owner must approve this import. } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 'import-state, opening-stock-already-approved' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /stores/{storeId}/opening-stock-imports/{importId}/reject:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/ImportId'
    post:
      tags: [SAH-78-7]
      operationId: pharmacyRejectOpeningStockImport
      summary: Owner rejects an import with a reason
      x-required-role: SETUP_EDIT
      x-store-access: 'OPERATION (OWNER reaches every store)'
      description: >-
        OWNER only. Rejecting is allowed to any owner, the uploader included (it approves nothing). reasonKey
        required "Choose a reason"; OTHER needs a note of 4 to 300 characters "Write at least 4 characters".
        0.2.1 (DEC-076): an OWNER (SETUP_EDIT; the OWNER holds the approve capability at every store) may reject
        an import in DRAFT as well as in WAITING_APPROVAL, with the same reasons, so that a draft nobody finishes
        does not hold the store and its products (rule 14). Any other state (NOT_ACCEPTED, APPROVED, REJECTED,
        REPLACED) answers 409 import-state with the detail "This import can no longer be changed." (0.3.2: one
        sentence for every such state; the client shows it; nothing written). The uploader can still replace their own draft by starting a new
        import. Status REJECTED (final); nothing posted; a rejected draft has no submittedAt; the store and its
        products are freed at once; the uploader may start a new import. Audit PHARMACY_OPENING_STOCK_REJECTED
        (ids, reason key, note; the audit holds ids only, no row content).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectInput' }
            examples:
              wrongQty: { value: { reasonKey: WRONG_QUANTITIES, note: null } }
      responses:
        '200': { description: Rejected, content: { application/json: { schema: { $ref: '#/components/schemas/OpeningStockImport' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation; or bad-request when a path id is not a UUID' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'import-state (0.2.1: any state other than DRAFT or WAITING_APPROVAL; 0.3.2: detail "This import can no longer be changed.")'
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  # ---------------------------------------------------------------- SAH-78-8 vendors
  /vendors:
    get:
      tags: [SAH-78-8]
      operationId: pharmacyListVendors
      summary: Vendors / suppliers
      x-required-role: SETUP_VIEW
      description: >-
        Columns of mockup 16: Vendor, GSTIN, Drug licence ("<number> · till 31 Mar 2028", "· expired 31 Oct 2026",
        or "Not required (consumables)"), Credit ("30 days"), Products (ACTIVE products whose preferred vendor is
        this vendor, OQ-78-22), Supplies to (store names), Status (Active, "Blocked · licence expired",
        Inactive). blocked and status are computed from the licence date on every read (IST; valid through the
        date, blocked from the next day; never stored; no job). Default status filter is ACTIVE and BLOCKED. By
        name. Paged. Writes nothing. 0.3.3 (additive, SAH-79 WP-E): suppliesStoreId keeps only the vendors whose
        "Supplies to" list holds that store (the vendor select of the purchase order and receive stock sheets);
        an unknown store id, or a store of another unit, answers 200 with items [] (RLS; no existence leak). With
        suppliesStoreId set, a caller without SETUP_VIEW who has PHARMACY_ACCESS and the purchase capability at
        that store (StoreAccess.purchase: the Central Store user; OWNER) may also call this read; without
        suppliesStoreId, or for another store, such a caller gets 403. The other filters still apply.
        0.3.4 (DEC-082, security M3), the view by who reads: an OWNER or a PHARMACIST member gets every item in
        full. Any other caller (whose vendor read comes only from a Central Store user mapping, rule 3, or from the
        purchase capability with suppliesStoreId) gets each item in the reduced view: id, name, status, blocked
        and version; gstin, licenceRequired, licenceNo, licenceValidTill, licenceState, contactName, contactPhone,
        creditDays, returnDaysBeforeExpiry, returnCreditPercent, damagedCreditPercent, expiredCreditPercent,
        suppliesTo and productsCount are null (the screen shows "—"; status BLOCKED still shows "Blocked · licence
        expired"). The view is chosen from the caller's role on every request, never from a query value; the
        filters, order, paging and total are the same for both views (q matches the name only).
        0.3.5 (SAH-79-6, tech lead decision of 19 Nov 13:40, item 2; wording): for a Central Store user the
        list (default filter ACTIVE and BLOCKED) shows BLOCKED vendors with the mark "Blocked · licence
        expired"; they are listed, never hidden. A BLOCKED vendor cannot be chosen on a purchase order, a goods
        receipt or a vendor return (debit note): the client does not offer it in those forms' vendor select (it
        filters blocked true out of the suppliesStoreId list). The server rules are unchanged: a purchase order
        (create, update, submit) and a direct receipt answer 409 vendor-blocked; a receipt against a purchase
        order of a vendor that became Blocked is allowed with the warning VENDOR_LICENCE_EXPIRED (it takes the
        order's vendor, not the select); pharmacyCreateDebitNote does not check blocked (no change in 0.3.5).
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 60 }, description: 'Name contains, ignoring case' }
        - { name: suppliesStoreId, in: query, required: false, schema: { type: string, format: uuid }, description: '0.3.3: only vendors that supply this store (the store is in the vendor''s suppliesTo).' }
        - { name: status, in: query, required: false, schema: { type: string, enum: [ACTIVE, BLOCKED, INACTIVE, ALL] } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 1000, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorPage' }
              examples:
                list:
                  value:
                    items:
                      - { id: 00000000-0000-4000-8000-0000000000d1, name: Test Distributors Pvt. Ltd. (fake), gstin: 27AAAAA0000A1Z5, licenceRequired: true, licenceNo: TEST-DL-0002, licenceValidTill: '2028-03-31', licenceState: VALID, contactName: Test Contact, contactPhone: '9000000001', creditDays: 30, returnDaysBeforeExpiry: 90, returnCreditPercent: '100', damagedCreditPercent: null, expiredCreditPercent: null, suppliesTo: [ { storeId: 00000000-0000-4000-8000-0000000000a1, name: Test Central Store } ], productsCount: 12, status: ACTIVE, blocked: false, version: 0 }
                      - { id: 00000000-0000-4000-8000-0000000000d2, name: Test City Medicals (fake), gstin: 27BBBBB1111B1Z6, licenceRequired: true, licenceNo: TEST-DL-0003, licenceValidTill: '2026-10-31', licenceState: EXPIRED, contactName: null, contactPhone: null, creditDays: 30, returnDaysBeforeExpiry: null, returnCreditPercent: null, suppliesTo: [ { storeId: 00000000-0000-4000-8000-0000000000a1, name: Test Central Store } ], productsCount: 0, status: BLOCKED, blocked: true, version: 2 }
                    total: 2
                    page: 0
                    size: 25
                reducedView:
                  summary: '0.3.4: a Central Store user who is neither OWNER nor PHARMACIST (security M3)'
                  value:
                    items:
                      - { id: 00000000-0000-4000-8000-0000000000d1, name: Test Distributors Pvt. Ltd. (fake), gstin: null, licenceRequired: null, licenceNo: null, licenceValidTill: null, licenceState: null, contactName: null, contactPhone: null, creditDays: null, returnDaysBeforeExpiry: null, returnCreditPercent: null, damagedCreditPercent: null, expiredCreditPercent: null, suppliesTo: null, productsCount: null, status: ACTIVE, blocked: false, version: 0 }
                      - { id: 00000000-0000-4000-8000-0000000000d2, name: Test City Medicals (fake), gstin: null, licenceRequired: null, licenceNo: null, licenceValidTill: null, licenceState: null, contactName: null, contactPhone: null, creditDays: null, returnDaysBeforeExpiry: null, returnCreditPercent: null, damagedCreditPercent: null, expiredCreditPercent: null, suppliesTo: null, productsCount: null, status: BLOCKED, blocked: true, version: 2 }
                    total: 2
                    page: 0
                    size: 25
        '400': { $ref: '#/components/responses/Problem', description: validation }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
    post:
      tags: [SAH-78-8]
      operationId: pharmacyCreateVendor
      summary: Add a vendor
      x-required-role: SETUP_EDIT
      description: >-
        OWNER only. Fields in form order (NEW, OQ-78-3), rules in VendorInput. clientKey replay (rule 10). 400
        validation (all together): name empty "Enter the vendor name"; GSTIN format "Enter a 15-character GSTIN"
        (empty allowed); licenceRequired true and licence number or date empty "Enter the drug licence number" /
        "Enter the licence valid-till date"; licenceRequired false with licence values sent: they are ignored and
        stored null; credit days, return days, credit % and phone ranges as the schema; suppliesToStoreIds with a
        store that is not ACTIVE in this unit "Choose active stores"; empty suppliesToStoreIds means the Central
        Store. 409 vendor-name-in-use "That vendor is already in the list" (ignoring case, any status). Audit
        PHARMACY_VENDOR_CREATED (contact phone is never logged; it may be in the audit value). 201.
        Credit levels (0.2.1, tech lead decision on the BA flag, DEC-075 and DEC-078 item 5): besides the standard
        returnCreditPercent, two optional levels damagedCreditPercent and expiredCreditPercent, each 0 to 100 with
        at most 2 decimals ("Enter a % from 0 to 100"). They apply in SAH-79 WP-E: a vendor-return line starts
        from damagedCreditPercent when its reason is damaged on receipt, from expiredCreditPercent when the batch
        is expired, and otherwise from returnCreditPercent; a level that is null falls back to returnCreditPercent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VendorInput' }
            examples:
              vendor: { value: { clientKey: 00000000-0000-4000-8000-00000000d001, name: Test Distributors Pvt. Ltd. (fake), gstin: 27AAAAA0000A1Z5, licenceRequired: true, licenceNo: TEST-DL-0002, licenceValidTill: '2028-03-31', contactName: Test Contact, contactPhone: '9000000001', creditDays: 30, returnDaysBeforeExpiry: 90, returnCreditPercent: '100', suppliesToStoreIds: [] } }
      responses:
        '201':
          description: Added. A new vendor answers version 0 (general rule 9, 0.3.1); each later change adds 1.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vendor' }
              examples:
                added: { value: { id: 00000000-0000-4000-8000-0000000000d1, name: Test Distributors Pvt. Ltd. (fake), gstin: 27AAAAA0000A1Z5, licenceRequired: true, licenceNo: TEST-DL-0002, licenceValidTill: '2028-03-31', licenceState: VALID, contactName: Test Contact, contactPhone: '9000000001', creditDays: 30, returnDaysBeforeExpiry: 90, returnCreditPercent: '100', damagedCreditPercent: null, expiredCreditPercent: null, suppliesTo: [ { storeId: 00000000-0000-4000-8000-0000000000a1, name: Test Central Store } ], productsCount: 0, status: ACTIVE, blocked: false, version: 0 } }
        '200': { description: Replay of the same clientKey by the same caller, content: { application/json: { schema: { $ref: '#/components/schemas/Vendor' } } } }
        '400': { $ref: '#/components/responses/Problem', description: validation }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict', description: 'vendor-name-in-use, client-key-reused' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
