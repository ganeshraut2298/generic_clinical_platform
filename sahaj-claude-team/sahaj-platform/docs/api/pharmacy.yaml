  # ================================================================ SAH-79 · WP-D stock core and approvals
  /stores/{storeId}/opening-stock-imports/{importId}/posting-preview:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/ImportId'
    get:
      tags: [SAH-79-1]
      operationId: pharmacyPreviewOpeningStockPosting
      summary: What "Post to stock" will post (confirmation before posting)
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability postOpeningStock: OWNER; a Central Store user of this store; a PHARMACIST member mapped to this store; OQ-79-30)'
      x-sub-story: SAH-79-1
      x-work-package: WP-D
      description: >-
        For an APPROVED import not yet posted: store, line count, total quantity, total value at purchase rate
        (paise), uploader and approver names, the lines whose expiry date has passed since approval (they will be
        posted to Quarantine with reason Expired, OQ-79-30, BR-8) and the lines whose batch already exists with a
        different MRP (posting would answer 409 batch-mrp-mismatch). Batches are matched by product, batch number
        and expiry; the batch number match ignores case and leading or trailing spaces, as the import does
        (ADR-029 P2 interim holding while OQ-79-37 is open). canPost is false with postLockReason NOT_APPROVED,
        ALREADY_POSTED or MRP_MISMATCH. Writes nothing.
      responses:
        '200': { description: Preview, content: { application/json: { schema: { $ref: '#/components/schemas/OpeningStockPostingPreview' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /stores/{storeId}/opening-stock-imports/{importId}/post:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/ImportId'
    post:
      tags: [SAH-79-1]
      operationId: pharmacyPostOpeningStock
      summary: Post an approved opening-stock import to the stock ledger (once, all or nothing)
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability postOpeningStock)'
      x-sub-story: SAH-79-1
      x-work-package: WP-D
      description: >-
        One transaction (ADR-029 P5; statement timeout 60 s for this operation; up to 5,000 lines, OQ-79-35).
        Order: clientKey replay (rule 10); import not APPROVED 409 not-approved "This import is not approved."
        (DRAFT, WAITING_APPROVAL, REJECTED, REPLACED, NOT_ACCEPTED) and nothing changes; already posted 409
        already-posted with postedAt "This import was already posted." (a second tap or a repeated request posts
        nothing twice); a batch with the same product, batch number and expiry but a different MRP 409
        batch-mrp-mismatch with lines (row numbers, at most 100) and nothing posted (BR-10). Then for every line:
        the batch is created or topped up (MRP and purchase rate per issue unit; vendor none; source
        OPENING_STOCK) and ledger lines OPENING_STOCK are written into this store, state AVAILABLE, or QUARANTINE
        with reason damage.expired when the expiry date has passed (OQ-79-30), reference the import, user the
        caller; balances change in the same step. No second approval (the import was already approved by a
        different owner). The import answers posted true, postedAt, postedBy. A posted import cannot be edited,
        cancelled or un-posted; corrections are stock adjustments (SAH-79-5). Schedule X lines need no second
        signature here: opening stock is a declared count approved by an owner, not a handling (ADR-029 P7 lists
        the handlings). Audit PHARMACY_OPENING_STOCK_POSTED (import id, line count, totals, quarantined line
        count). Logs carry ids and counts only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientKeyInput' }
            examples:
              post: { value: { clientKey: 00000000-0000-4000-8000-00000000d001 } }
      responses:
        '200': { description: Posted (or a replay of the same clientKey), content: { application/json: { schema: { $ref: '#/components/schemas/OpeningStockImport' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation, malformed-request; or bad-request when a path id is not a UUID' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 'not-approved, already-posted (postedAt), batch-mrp-mismatch (lines), client-key-reused' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
