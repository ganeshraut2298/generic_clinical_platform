openapi: 3.1.0
info:
  title: Sahaj admin portal API
  version: 0.5.0
  description: >-
    Version 0.5.0 (SAH-42, ADR-018, DEC-034): adds the dev-only bootstrap registration of the first platform admin,
    POST /bootstrap/unlock and POST /bootstrap/register (x-dev-only). Like /dev, it is absent from every jar built
    without the Maven profile dev-tools, and every path under /bootstrap answers an empty 404 unless all its build,
    start-time and request conditions hold and no platform admin exists yet. Adds the problem types
    bootstrap-pin-invalid (with triesLeft), bootstrap-locked and bootstrap-ticket-invalid. Both bootstrap calls
    answer 429 rate-limit with Retry-After 5 when their turn waits more than 10 seconds (nothing counted or
    written). No other operation changes. (ADR-018 Revision 2, before approval: each bootstrap 400 is either
    bad-request for a body that cannot be read, or validation with fixed field texts; register lists at most two
    field errors.) (ADR-018 Revision 3, before approval: an unlock try is counted when it starts, before the PIN
    is compared, so a try that ends in 500 still counts; triesLeft values are unchanged. A control character or an
    unpaired surrogate in fullName or email is a field error. Every bootstrap problem document has a fixed
    instance, the operation's own path. Problem lists instance. No operation is renamed.) (DEC-035, before
    approval: the page /admin/register goes to /admin/sign-in after register, and the first sign-in runs
    enrolment.) (ADR-018 Revision 5, security review L-4, human decision 11 Nov 2026, before approval: the register
    201 has no body; the schema BootstrapRegistered is withdrawn and register issues no sign-in token.)
    Version 0.4.0 (ADM-2 and ADM-3 design, ADR-016, DEC-029): the directory search moves from GET /clinics to
    POST /clinics/search, so that the search text, which may hold owner mobile digits, never appears in a URL, an
    access log or browser history. The IPD filter and facet are withdrawn (not in the mockup). The Activity log
    lists applied actions only; refused changes are stored in the admin audit but not listed until the human
    approves their text. The shared BadRequest and PayloadTooLarge responses are added (every admin request has a
    4 KB body cap). Items marked x-needs-human carry an interim behaviour that waits for a human answer
    (DEC-029 NH-1 to NH-8).
    Phase 1 contract for the Sahaj admin portal, stories ADM-1 (admin sign-in with work email, password and
    authenticator app), ADM-2 (organizations directory and clinic detail) and ADM-3 (modules and plan management).
    Design: docs/architecture/adr/ADR-003-sahaj-admin-portal.md (revision 2, DEC-012). Version 0.2.0 replaces the
    mobile OTP endpoints of 0.1.0 with /auth/login, /auth/totp/enrol and /auth/totp/verify. Version 0.3.0 adds the
    dev-only operation POST /dev/sample-admin (x-dev-only, DEC-016, ADR-008). It is not part of the production
    product: it is absent from every jar built without the Maven profile dev-tools, and every path under /dev
    answers an empty 404 unless all its build and runtime conditions hold. Version 0.3.1 applies the security
    review fixes (ADR-008 revision 2, R1 to R12): the per-start X-Sahaj-Dev-Nonce header, the flag from the
    command line only, more refused forwarding headers, the cloud-platform check and the bodyless 500.
    A separate security realm from the clinic API; it shares no sign-in code with the clinic OTP flow. Sign-in has
    two steps: email and password give a short-lived pre-auth token (5 minutes, single use, not a bearer token), then
    a 6-digit authenticator code (RFC 6238, HMAC-SHA1, 30 s, 6 digits) or a recovery code gives the session. Admin
    access tokens are issued only after both steps, are signed with their own key, carry aud "sahaj-admin" and role
    PLATFORM_ADMIN, and never carry a tenant. A clinic token or a pre-auth token is refused on every protected route
    here, and an admin token is refused on every clinic route. Every operation except the four public auth endpoints
    needs role PLATFORM_ADMIN (x-required-role). Every /api/v1/admin/** request from an address outside
    SAHAJ_ADMIN_ALLOWED_NETWORKS answers 403 admin-network-denied (in every profile except dev, an empty list refuses
    everything). When SAHAJ_ADMIN_JWT_SECRET or SAHAJ_ADMIN_TOTP_KEY is not configured, every route answers 503
    admin-unavailable. Responses of the sign-in endpoints carry Cache-Control no-store, and their request bodies are
    never logged. Cross-tenant reads and writes go only through audited database functions. Responses carry
    clinic-level fields and counts only, never patient data. Times are ISO 8601 UTC; the UI shows IST. Errors are
    RFC 9457 application/problem+json with type https://sahaj.in/problems/<slug>.
servers:
  - url: /api/v1/admin
security:
  - adminBearer: []
tags:
  - { name: ADM-1, description: 'Admin sign-in, session and shell' }
  - { name: ADM-2, description: Organizations directory and clinic detail (read-only) }
  - { name: ADM-3, description: Modules and plan management }
  - { name: DEV, description: 'Dev-only tools (DEC-016, ADR-008). Never in a production build.' }
  - { name: SAH-42, description: 'Dev-only bootstrap registration of the first admin behind a PIN (DEC-034, ADR-018). Never in a production build.' }
paths:
  /auth/login:
    post:
      tags: [ADM-1]
      operationId: adminLogin
      security: []
      x-required-role: public
      description: >-
        Step 1: work email and password. The email is trimmed and lower-cased. On a correct password for an active
        admin, returns a pre-auth token (5 minutes, single use) and next = TOTP (enrolled) or ENROL (first sign-in).
        Never returns an access token. No user enumeration: an unknown email, a wrong password and a switched-off
        admin all answer the same 401 admin-credentials-invalid ("Email or password is not right."), and an unknown
        email is checked against a dummy BCrypt hash so timing does not differ. 423 admin-sign-in-locked (with
        retryAfterSeconds) when the email has 5 failed sign-in steps (password, code or recovery code) within
        15 minutes; the lock lasts 15 minutes and applies to any typed email, known or not. 429 rate-limit after
        10 login requests per email, or 20 requests per client address across /auth/login, /auth/totp/enrol and
        /auth/totp/verify, within 15 minutes. A password longer than 72 UTF-8 bytes is treated as wrong. Audited
        ADMIN_SIGN_IN_FAILED (step PASSWORD; admin id only when the email is an admin's; never the typed email).
        The password is never logged, stored in plain text or echoed.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginInput' } } }
      responses:
        '200':
          description: Password accepted. Continue with /auth/totp/verify (next TOTP) or /auth/totp/enrol (next ENROL).
          headers:
            Cache-Control: { description: no-store, schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/LoginResult' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /auth/totp/enrol:
    post:
      tags: [ADM-1]
      operationId: adminTotpEnrol
      security: []
      x-required-role: public (needs a pre-auth token with next ENROL)
      description: >-
        First sign-in only. Creates a pending authenticator secret (20 random bytes) for the admin of this pre-auth
        token, stores it encrypted (AES-256-GCM) on the pre-auth record, and returns it once for the authenticator
        app: the Base32 key for manual entry (groups of 4) and the otpauth:// URI. No QR image is returned (ADR-003
        H18). Calling it again with the same pre-auth token returns the same pending secret. The secret is confirmed
        by the first correct code on /auth/totp/verify; until then nothing changes on the admin. 401 preauth-expired
        for an unknown, expired or consumed pre-auth token. 409 totp-already-enrolled when the pre-auth token is for
        next TOTP. Never logged or audited with the secret.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TotpEnrolInput' } } }
      responses:
        '200':
          description: The pending secret for the authenticator app.
          headers:
            Cache-Control: { description: no-store, schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/TotpEnrolment' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /auth/totp/verify:
    post:
      tags: [ADM-1]
      operationId: adminTotpVerify
      security: []
      x-required-role: public (needs a pre-auth token)
      description: >-
        Step 2: the 6-digit code from the authenticator app, or a recovery code instead (only for next TOTP).
        Codes of the current 30-second step and one step either side are accepted; a code whose step is not later
        than the last one used is refused (replay). On success, consumes the pre-auth token, starts an admin session,
        sets the cookie sahaj_admin_rt (HttpOnly; Secure; SameSite=Strict; Path=/api/v1/admin/auth) and returns a
        10-minute access token. For next ENROL, the first correct code confirms enrolment, and the response carries
        the 10 recovery codes once (audited ADMIN_TOTP_ENROLLED). A recovery code works once (audited
        ADMIN_RECOVERY_CODE_USED). Errors: 401 totp-invalid ("That code is not right.") for a wrong code or recovery
        code; after 5 wrong codes on one pre-auth token it is consumed, and the next call answers 401
        preauth-expired ("Your sign-in took too long. Start again."); 423 admin-sign-in-locked when the email
        reaches 5 failed steps within 15 minutes; 409 totp-enrolment-not-started when next is ENROL and
        /auth/totp/enrol has not been called; 400 when a recovery code is sent for next ENROL. Audited
        ADMIN_SIGNED_IN (method), or ADMIN_SIGN_IN_FAILED (step TOTP or RECOVERY_CODE). In the dev profile with
        sahaj.admin.totp.dev-bypass on, from a loopback address only, any 6 digits are accepted as the code
        (never as a recovery code, and the password in step 1 is always checked).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TotpVerifyInput' } } }
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie: { description: 'sahaj_admin_rt refresh cookie (opaque, rotated on every refresh).', schema: { type: string } }
            Cache-Control: { description: no-store, schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminAuthResult' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /auth/refresh:
    post:
      tags: [ADM-1]
      operationId: adminRefresh
      security: []
      x-required-role: public (needs the sahaj_admin_rt cookie)
      description: >-
        Issues a new access token and rotates the refresh cookie. Does not ask for the password or code again.
        401 admin-session-ended when the cookie is missing or unknown, the session is revoked, idle for more than
        30 minutes, older than 12 hours, or the admin is switched off. Presenting an already-rotated refresh token
        revokes the whole session (audited ADMIN_SESSION_REVOKED) and answers 401. 429 rate-limit after 30 calls
        per client address within 15 minutes.
      parameters:
        - { name: sahaj_admin_rt, in: cookie, required: true, schema: { type: string } }
      responses:
        '200':
          description: New access token.
          headers:
            Set-Cookie: { description: Rotated sahaj_admin_rt cookie., schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminAuthResult' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /auth/sign-out:
    post:
      tags: [ADM-1]
      operationId: adminSignOut
      x-required-role: PLATFORM_ADMIN
      description: Revokes the current admin session and clears the cookie. Audited ADMIN_SIGNED_OUT.
      responses:
        '204':
          description: Signed out.
          headers:
            Set-Cookie: { description: Clears sahaj_admin_rt., schema: { type: string } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /me:
    get:
      tags: [ADM-1]
      operationId: adminMe
      x-required-role: PLATFORM_ADMIN
      description: The signed-in admin, for the shell's profile menu. Not audited.
      responses:
        '200': { description: The signed-in admin., content: { application/json: { schema: { $ref: '#/components/schemas/AdminMe' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /clinics/search:
    post:
      tags: [ADM-2]
      operationId: adminSearchClinics
      x-required-role: PLATFORM_ADMIN
      description: >-
        The Organizations directory (mockup orgDirPage, story ADM-2a). A read: it changes nothing and is safe to
        repeat. It is POST only so that the search text never appears in a URL (ADR-016 D1). The text may hold owner
        mobile digits; it is never logged, never written to the audit and never echoed in an error. Values inside one
        filter are OR and different filters are AND. Facet counts apply the search, signedWithinDays and every other
        filter, but not the facet itself (mockup odMatch(o, except)). Options are sorted by count, highest first, then
        A–Z; selected values are always included, even with count 0. sort=relevance applies only to field=all with q,
        and acts as name otherwise. "code" is the clinic web address (slug). Responses hold organization-level fields
        only: never a patient, an email or a mobile number, and no staff name other than the owner's. Audited
        ACCESS CLINICS_LISTED (field, whether a search text was given, the filters, the number of cities, the sort,
        the page and the total; never the text). Implemented by platform.admin_list_clinics.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ClinicSearch' } } }
      responses:
        '200': { description: One page of organizations with facet counts., content: { application/json: { schema: { $ref: '#/components/schemas/ClinicPage' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation (fieldErrors; for field=mobile with fewer than 4 or more than 10 digits the field is q; the UI never sends fewer than 4 and shows the mockup hint instead; the submitted text is never repeated in the problem)' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/Problem' }
  /clinics/{id}:
    parameters:
      - $ref: '#/components/parameters/ClinicId'
    get:
      tags: [ADM-2]
      operationId: adminGetClinic
      x-required-role: PLATFORM_ADMIN
      description: >-
        One clinic for the detail page (story ADM-2b: the header and the tabs Plan and billing and Modules).
        admittedNow is a count from the ipd module (IpdOccupancyPort, ipd.admin_admitted_count), never patient rows.
        Only the last 5 digits of the owner's mobile are returned. Another clinic's id is not foreign: an admin may
        open any organization. Audited ACCESS CLINIC_VIEWED on every successful read; a failed read (400, 401, 404)
        writes nothing. Switching tabs in the UI does not call this again. Implemented by platform.admin_get_clinic.
      responses:
        '200': { description: The clinic., content: { application/json: { schema: { $ref: '#/components/schemas/ClinicDetail' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem', description: 'not-found (no organization with this id)' }
        '503': { $ref: '#/components/responses/Problem' }
  /clinics/{id}/modules:
    parameters:
      - $ref: '#/components/parameters/ClinicId'
    patch:
      tags: [ADM-3]
      operationId: adminChangeModules
      x-required-role: PLATFORM_ADMIN
      x-needs-human:
        - 'DEC-029 NH-6 (patient safety): "admitted" counts ipd.admission rows with status ADMITTED only (interim).'
        - 'DEC-029 NH-7 (patient safety): until the ipd admit transaction reads the entitlement FOR SHARE, an admission in the same second as a switch-off can still succeed.'
      description: >-
        Story ADM-3a. Changes one or more module entitlements of a clinic, all or nothing, in one transaction
        (ADR-016 D4: lock the entitlement row, count admitted patients, write). The "current" value is the effective
        state, where an expired trial counts as readonly. ipdState trial sets the trial end to now + 30 days; on, off
        and readonly clear it; choosing trial when the trial has ended starts a new 30 days. A running trial cannot be
        extended, and there is no custom end date. Any state may follow any other, with one refusal. A field equal to
        the current value is ignored. A request that changes nothing returns the clinic unchanged and writes no audit
        row, so a lost answer is safe to repeat. 409 ipd-patients-admitted when ipdState is off or readonly and one or
        more patients are admitted. Then nothing in the request is applied (HRA and the bed limit stay unchanged as
        well), one REFUSED audit row is written and kept, and the problem detail reads "{n} patients are admitted in
        {clinic name}. IPD stays {current state label in lower case} until they are discharged." (the mockup text,
        with the labels Off, Trial · 30 days, On, Read-only), with admittedNow. Each applied change writes one ACTION
        MODULES_CHANGED row per changed field, in the same transaction: "IPD set to {On | Off | Trial · 30 days |
        Read-only}", "HRA switched on" or "HRA switched off", "Bed limit set to {n}", with reason "Module
        entitlement", the before and after values, the admin taken from the session, the request id and the address.
        A rolled-back change leaves no row. Switching IPD off or to read-only never deletes data. The clinic sees the
        new values on its next request: menus, /api/v1/ipd/* (403 module-off when off, 409 ipd-readonly when
        read-only), the HRA menu and the bed limit. Nothing is pushed to the clinic and no one is notified. Two admins
        changing different fields of the same clinic both keep their change. Implemented by
        platform.admin_lock_modules, ipd.admin_admitted_count and platform.admin_set_modules.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ModulesChange' } } }
      responses:
        '200': { description: The clinic after the change (or unchanged when nothing differed)., content: { application/json: { schema: { $ref: '#/components/schemas/ClinicDetail' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation (an unknown field, an empty body, ipdState not one of off|trial|on|readonly, a bedLimit outside 5..300 or not a multiple of 5); or bad-request when the {id} path value is not a UUID (components/responses/BadRequest). Nothing changes and nothing is audited.' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem', description: 'not-found (no organization with this id; nothing audited)' }
        '409': { $ref: '#/components/responses/Problem', description: 'ipd-patients-admitted, with admittedNow' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/Problem' }
  /clinics/{id}/plan:
    parameters:
      - $ref: '#/components/parameters/ClinicId'
    put:
      tags: [ADM-3]
      operationId: adminChangePlan
      x-required-role: PLATFORM_ADMIN
      x-needs-human:
        - 'DEC-029 NH-4: the plan choices (FREE and PRO, against the mockup''s Pro monthly, Pro yearly and Custom), whether Pro may go back to Free year, the notice "starts at the next renewal" while the change applies at once, and the missing second-admin approval. Interim: FREE and PRO, at once, in both directions, no approval.'
        - 'DEC-029 NH-5: what a plan changes. Interim: the label only; plan_ends_at is not touched and no feature, limit or price depends on the plan.'
      description: >-
        Story ADM-3b. Changes the clinic's plan at once (phase 1 has no billing, renewals or second-admin approval;
        interim, see x-needs-human). 400 validation with field reason and the mockup message "Write a reason of at
        least 10 characters. It goes into the audit log." when the trimmed reason is shorter than 10 characters. The
        same plan as now returns the clinic unchanged with no audit row. An applied change writes one ACTION
        PLAN_CHANGED audit row in the same transaction: "Plan changed to {Free year | Pro}", the reason as typed
        (trimmed), the ticket, the before and after plan, outcome APPLIED, the admin taken from the session, the
        request id and the address. The reason is never written to an application log. The clinic's Plan and modules
        page shows the new plan on its next request. Implemented by platform.admin_set_plan.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PlanChange' } } }
      responses:
        '200': { description: The clinic after the change (or unchanged when the plan is the same)., content: { application/json: { schema: { $ref: '#/components/schemas/ClinicDetail' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation (fieldErrors on plan, reason, ticket, or an unknown field); or bad-request when the {id} path value is not a UUID (components/responses/BadRequest). The message for a wrong ticket is a placeholder until DEC-029 NH-8 is answered.' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem', description: 'not-found (no organization with this id; nothing audited)' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/Problem' }
  /clinics/{id}/activity:
    parameters:
      - $ref: '#/components/parameters/ClinicId'
    get:
      tags: [ADM-3]
      operationId: adminClinicActivity
      x-required-role: PLATFORM_ADMIN
      x-needs-human:
        - 'DEC-029 NH-8: refused changes are stored in the admin audit (outcome REFUSED) but not listed here until the human approves the text of a refused row.'
      description: >-
        Story ADM-3c. The clinic detail's Activity log tab: applied admin actions (audit kind ACTION, outcome APPLIED)
        for this clinic only, newest first (ADR-016 D5). Sign-in rows, access rows (clinic viewed, list, activity
        viewed) and refused changes are not listed. The UI shows 20 per page. Audited ACCESS CLINIC_ACTIVITY_VIEWED
        each time a page is loaded; an unknown id answers 404 and writes nothing. Implemented by
        platform.admin_list_clinic_activity.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }, description: Zero-based. A page past the end returns an empty items list with the real total. }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: One page of activity., content: { application/json: { schema: { $ref: '#/components/schemas/ActivityPage' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation (page or size out of range); or bad-request when the {id} path value is not a UUID (components/responses/BadRequest)' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem', description: 'not-found (no organization with this id)' }
        '503': { $ref: '#/components/responses/Problem' }
  /dev/sample-admin:
    post:
      tags: [DEV]
      operationId: devCreateSampleAdmin
      security: []
      x-dev-only: true
      x-required-role: 'none: unauthenticated, loopback caller only, dev-tools build only'
      x-build-profile: dev-tools
      x-runtime-conditions:
        - 'C1 Spring profile dev is active, and every active profile is dev or test'
        - 'C2 sahaj.admin.dev-sample-enabled=true read raw from the commandLineArgs property source only (a program argument of this run); the same key from an environment variable, SPRING_APPLICATION_JSON, a system property, an IDE VM option or any application*.yml is ignored (default false)'
        - 'C3 sahaj.admin.enabled=true with SAHAJ_ADMIN_JWT_SECRET and SAHAJ_ADMIN_TOTP_KEY set (admin realm on)'
        - 'C4 No proxy configuration: server.forward-headers-strategy absent or none, server.tomcat.remoteip.remote-ip-header and protocol-header blank, spring.main.cloud-platform blank, and no cloud platform detected'
        - 'C5 server.address is a loopback address'
      x-request-checks:
        - 'G1 Exactly POST /api/v1/admin/dev/sample-admin'
        - 'G2 Servlet remote address is loopback (127.0.0.0/8 or ::1); X-Forwarded-For and similar are never trusted'
        - 'G3 None of Forwarded, X-Forwarded-For, X-Forwarded-Host, X-Forwarded-Proto, X-Forwarded-Port, X-Forwarded-Prefix, X-Forwarded-Server, X-Original-Forwarded-For, X-Real-IP, X-Client-IP, Client-IP, True-Client-IP, CF-Connecting-IP, Fastly-Client-IP, X-Cluster-Client-IP, Via is present (names case-insensitive; values never read)'
        - 'G4 Host is 127.0.0.1, localhost or [::1] (optionally with a port)'
        - 'G5 No Origin, Sec-Fetch-Site or Sec-Fetch-Mode header (browsers are refused)'
        - 'G6 No platform admin exists yet (checked atomically in the database)'
        - 'G7 Exactly one X-Sahaj-Dev-Nonce header equal to this start''s nonce, compared in constant time'
      x-human-question: >-
        ADR-008 H-DEV-2. DEC-016 says 404 when an admin already exists, so this contract answers 404. If the human
        chooses 409 instead, the response becomes 409 application/problem+json, type
        https://sahaj.in/problems/sample-admin-exists, title "An admin already exists. This endpoint creates the
        first admin only.", returned only after every other check has passed.
      description: >-
        Creates the one sample platform admin sample-admin@example.test (name "Sample admin"; example.test is a
        reserved name that can never be a real mailbox), already enrolled for the authenticator app, and returns
        its password and TOTP secret once. No request body (a body, if sent, is never read). No authentication: a
        bearer token or cookie sent with the request is ignored. The password is 24 characters from SecureRandom;
        it is stored only as a BCrypt (strength 12) hash and the TOTP secret only as AES-256-GCM ciphertext bound
        to the admin id, through the same code as the env seed and the enrolment (ADR-003 D5, D2.3). Nothing can
        return the password or secret again. The sample admin has no recovery codes (ADR-008 H-DEV-3); its first
        sign-in gets next TOTP. Every case that does not create the admin answers the same empty 404 (DevNotFound):
        a build without dev-tools, any runtime condition false, any request check failing, any admin already
        existing (active or not, seeded or not), any other method or path under /dev. A second call therefore
        never reveals or resets anything. 429 rate-limit after 5 calls within 15 minutes that passed the request
        checks; a call that fails them gets 404 and is not counted. Audited in platform_admin_audit as AUTH
        ADMIN_DEV_SAMPLE_CREATED (APPLIED) or ADMIN_DEV_SAMPLE_REFUSED (REFUSED, admin-exists), with address and
        request id and never a password, hash, secret or URI. The password, secret, URI and email are never
        logged. The X-Sahaj-Dev-Nonce header is required: a missing, malformed or wrong value answers the same
        empty 404 and is not counted by the rate limit. Any other failure (for example a database error) answers
        a bodyless 500 (DevServerError) whose log line carries the exception class and SQLSTATE only. Call it with
        curl from the same machine, straight to 127.0.0.1:8080 (never through the Angular dev server, whose proxy
        adds forwarding headers), for example
        curl.exe -s -X POST -H "X-Sahaj-Dev-Nonce: <value>" http://127.0.0.1:8080/api/v1/admin/dev/sample-admin,
        with the value copied from the console (ADR-008 R12).
      parameters:
        - $ref: '#/components/parameters/DevNonce'
      responses:
        '201':
          description: The sample admin was created. Shown once; copy the password and key now.
          headers:
            Cache-Control: { description: no-store, schema: { type: string } }
            Pragma: { description: no-cache, schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/DevSampleAdmin' } } }
        '404': { $ref: '#/components/responses/DevNotFound' }
        '429': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/DevServerError' }
  /bootstrap/unlock:
    post:
      tags: [SAH-42]
      operationId: bootstrapUnlock
      security: []
      x-dev-only: true
      x-required-role: 'none: anonymous caller on the local machine, dev-tools build only, only while no platform admin exists'
      x-build-profile: dev-tools
      x-runtime-conditions:
        - 'B1 Built with the Maven profile dev-tools (otherwise no bootstrap class exists)'
        - 'B2 Spring profile dev is active, and every active profile is dev or test'
        - 'B3 sahaj.admin.bootstrap.enabled (SAHAJ_ADMIN_BOOTSTRAP_ENABLED in .env) is true, read at start'
        - 'B4 SAHAJ_ADMIN_BOOTSTRAP_PIN_HASH is a BCrypt hash with cost 12 to 16; missing, blank or malformed means off'
        - 'B5 Admin realm on (sahaj.admin.enabled=true, SAHAJ_ADMIN_JWT_SECRET and SAHAJ_ADMIN_TOTP_KEY set)'
        - 'B6 No proxy configuration and no cloud platform (as ADR-008 C4)'
        - 'B7 server.address is a loopback address'
      x-request-checks:
        - 'K1 Exactly POST /api/v1/admin/bootstrap/unlock or /api/v1/admin/bootstrap/register (any other method or path under /bootstrap is 404, never 405)'
        - 'K2 Servlet remote address is loopback (127.0.0.0/8, ::1 or ::ffff:127.x.x.x)'
        - 'K3 Forwarding headers may only narrow. Allowed, each at most once - X-Forwarded-For (every element an IP literal that is loopback), X-Forwarded-Proto (http or https), X-Forwarded-Port (digits), X-Forwarded-Host (as K4). Any other forwarding header of ADR-008 G3 refuses'
        - 'K4 Host is localhost, 127.0.0.1 or [::1], optionally with a port'
        - 'K5 Origin absent or exactly http(s)://<a K4 host>[:port]; Sec-Fetch-Site absent or same-origin'
        - 'K6 Content-Type is application/json'
        - 'K7 No platform admin exists (active or not), checked in the database on every request'
      description: >-
        Step 1 of the bootstrap registration (story SAH-42-2, SAH-42-3). Checks the PIN against the BCrypt hash in
        SAHAJ_ADMIN_BOOTSTRAP_PIN_HASH with a constant-time compare. The PIN travels only in this body, never in a URL
        or header, and is never logged, stored, audited or echoed. A blank or whitespace-only PIN is 400 validation
        (field pin) and is not counted; neither is a body that cannot be read. Every other value, of any length or
        content, is a try, and the try is counted and stored before the PIN is compared (ADR-018 D4 Revision 3); a
        correct PIN then sets the count back to 0. So a try that ends in the bodyless 500, or gets no answer at all,
        has still been counted. Anything over 64 characters or 72 UTF-8 bytes is wrong without being compared
        against the real hash (a dummy hash of the same cost is checked instead, so time does not differ). The
        count is global (every caller together), kept in the database and survives a restart. Wrong PINs 1 to 4 in
        a row answer 401 bootstrap-pin-invalid with triesLeft (4 to 1, that is 5 minus the wrong PINs so far,
        this one included), same title whatever was typed. The 5th wrong PIN locks the
        feature for 60 minutes for everyone, cancels any open ticket and answers 423 bootstrap-locked with
        retryAfterSeconds 3600. While locked every unlock, even with the correct PIN, answers 423 bootstrap-locked
        with the remaining seconds; it is not compared, not counted and not audited. When the lock ends the count
        restarts at 0. A correct PIN resets the count to 0, replaces any earlier ticket and returns a new ticket
        (valid 5 minutes, single use) plus the HttpOnly binding cookie sahaj_admin_bootstrap; the ticket and the
        cookie are both needed by /bootstrap/register. Unlocks are judged one at a time; a caller who waits more
        than 10 seconds for its turn (another try is being checked, or an earlier try ended without a result in the
        last 30 seconds) gets 429 rate-limit with Retry-After 5 and is not counted. Audited in
        platform_admin_audit - AUTH ADMIN_BOOTSTRAP_UNLOCK_FAILED for each wrong PIN and ADMIN_BOOTSTRAP_LOCKED at
        the lock (with the lock end time), with address and request id and never the typed text, and
        ADMIN_BOOTSTRAP_UNLOCK_UNJUDGED for a counted try that ended without a result. A correct unlock is not
        audited. Every case where the feature is off, out of reach or closed answers the same empty 404
        (BootstrapNotFound) and writes nothing. A bearer token or any other cookie sent with the request is ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BootstrapUnlockInput' }
            examples:
              throwaway: { summary: 'A throwaway value, never the real PIN', value: { pin: not-a-real-pin } }
      responses:
        '200':
          description: PIN accepted. Continue with /bootstrap/register within 5 minutes from the same browser.
          headers:
            Set-Cookie:
              description: >-
                sahaj_admin_bootstrap=<43 Base64url characters>; HttpOnly; SameSite=Strict; Path=/api/v1/admin/bootstrap;
                Max-Age=300; Secure (omitted only in the dev profile on plain http://localhost, the existing
                refresh-cookie-secure false setting). Stored on the server only as a keyed hash.
              schema: { type: string }
            Cache-Control: { description: no-store, schema: { type: string } }
            Pragma: { description: no-cache, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BootstrapUnlocked' }
              examples:
                unlocked: { value: { ticket: Xq3vTn8bKp0aLmZr5YwC2dEfGhJ7sUiOq9RtVbNcA1k, expiresInSeconds: 300 } }
        '400':
          description: >-
            Never counted, never audited, answered only after the closed (404) and locked (423) checks (ADR-018 D2
            "Request bodies"). Two cases. (1) validation - the body is readable but pin is missing, null, empty or
            whitespace only - exactly one fieldError, field pin, message "Enter the PIN.". (2) bad-request - the body
            cannot be read - empty or not JSON, not a JSON object, a duplicate key, anything after the object, a field
            other than pin, or a pin that is neither a string nor null (a number, boolean, array or object) - no
            fieldErrors, title "Bad Request", detail "The request could not be understood. Check it and try again.".
            No field name or value from the request is echoed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                blank: { value: { type: 'https://sahaj.in/problems/validation', title: Check the highlighted fields, status: 400, instance: /api/v1/admin/bootstrap/unlock, fieldErrors: [ { field: pin, message: Enter the PIN. } ] } }
                unreadable: { value: { type: 'https://sahaj.in/problems/bad-request', title: Bad Request, status: 400, detail: The request could not be understood. Check it and try again., instance: /api/v1/admin/bootstrap/unlock } }
        '401':
          description: 'bootstrap-pin-invalid - wrong PIN number 1 to 4, with triesLeft. Same answer whatever was typed.'
          headers:
            Cache-Control: { description: no-store, schema: { type: string } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                wrong: { value: { type: 'https://sahaj.in/problems/bootstrap-pin-invalid', title: That PIN is not right., status: 401, instance: /api/v1/admin/bootstrap/unlock, triesLeft: 3 } }
        '403': { $ref: '#/components/responses/Problem', description: 'admin-network-denied (only when SAHAJ_ADMIN_ALLOWED_NETWORKS is set and excludes loopback)' }
        '404': { $ref: '#/components/responses/BootstrapNotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '423': { $ref: '#/components/responses/BootstrapLocked' }
        '429': { $ref: '#/components/responses/Problem', description: 'rate-limit - another unlock held the turn for more than 10 seconds; Retry-After 5; not counted' }
        '500': { $ref: '#/components/responses/BootstrapServerError', description: 'Bodyless 500 (BootstrapServerError). If the PIN step had started, the try has been counted (and, for the 5th, the lock is set) whatever the PIN was; it is never a 200 or a 401. No ticket was issued.' }
  /bootstrap/register:
    post:
      tags: [SAH-42]
      operationId: bootstrapRegister
      security: []
      x-dev-only: true
      x-required-role: 'none: anonymous caller on the local machine holding a valid ticket and its binding cookie'
      x-build-profile: dev-tools
      x-runtime-conditions: 'Same as bootstrapUnlock (B1 to B7, ADR-018 D2)'
      x-request-checks: 'Same as bootstrapUnlock (K1 to K7, ADR-018 D2)'
      description: >-
        Step 2 (story SAH-42-4, SAH-42-5). Creates the FIRST platform admin, role PLATFORM_ADMIN, with no tenant,
        no membership and no clinic link. Order of checks after the request checks - (1) an admin exists - empty
        404; (2) the feature is locked - 423 bootstrap-locked; (3) the ticket in the body and the
        sahaj_admin_bootstrap cookie do not both match the open ticket, or it is older than 5 minutes from the
        unlock, or it was replaced by a later unlock, cancelled by a lock or already spent - 401
        bootstrap-ticket-invalid and the cookie is cleared; (4) the form - 400 validation with fieldErrors, using
        the admin password rules of ADR-003 D2.1 (12 to 64 characters, at most 72 UTF-8 bytes, not containing the
        part of the email before @ in any letter case; no breached-password check). The email is trimmed and
        lower-cased. There is no "email already used" field error: this call runs only while no admin exists, so an
        email clash cannot happen; an existing admin is check (1), the empty 404 (ADR-018 D6 step 2). A
        rejected form does not spend the ticket. On success, in one transaction - the admin is created (password
        BCrypt 12, not yet enrolled for the authenticator), the ticket is spent and the creation is audited; the
        answer is 201 with no body, and the cookie is cleared. No sign-in token of any kind is issued (ADR-018
        Revision 5, security review L-4). The page /admin/register then goes to /admin/sign-in (DEC-035, ADR-018
        D6), where the owner signs in once with the same email and password; because the admin is not enrolled,
        that sign-in answers next ENROL with its own pre-auth token and runs the existing /auth/totp/enrol and
        /auth/totp/verify step, which enrols the authenticator app, returns the 10 recovery codes once and signs
        the admin in (ADR-003 D2.6). If two registrations race, exactly one admin is created and the other
        call gets the empty 404. Registrations and unlocks are judged one at a time; a caller who waits more than
        10 seconds for its turn gets 429 rate-limit with Retry-After 5, nothing is created, the ticket is not spent
        and the same ticket may be sent again while it is valid. A database failure creates nothing, does not spend
        the ticket and answers the bodyless 500. Audited AUTH ADMIN_BOOTSTRAP_ADMIN_CREATED with the admin id and name, address and request id,
        never the email, password, hash, ticket or PIN. The password and ticket are never logged or echoed. After
        the first admin exists, both bootstrap calls answer the empty 404 for good.
      parameters:
        - $ref: '#/components/parameters/BootstrapBindingCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BootstrapRegisterInput' }
            examples:
              throwaway:
                summary: Throwaway values only
                value: { ticket: Xq3vTn8bKp0aLmZr5YwC2dEfGhJ7sUiOq9RtVbNcA1k, fullName: First admin, email: first.admin@example.test, password: example-password-only }
      responses:
        '201':
          description: >-
            The first admin was created (not yet enrolled) and the registration is now closed for good. No body and
            no Content-Type header (Content-Length 0); the status alone says "created, now sign in". No token is
            returned (ADR-018 Revision 5). Next step for every client - sign in at /admin/sign-in (POST /auth/login)
            with the same email and password; that sign-in answers next ENROL and runs the enrolment step (DEC-035,
            ADR-003 D2.6). No Location header (the admin has no resource in this API).
          headers:
            Set-Cookie: { description: 'Clears sahaj_admin_bootstrap (Max-Age=0, Path=/api/v1/admin/bootstrap).', schema: { type: string } }
            Cache-Control: { description: no-store, schema: { type: string } }
            Pragma: { description: no-cache, schema: { type: string } }
        '400':
          description: >-
            Only after a valid ticket and cookie (a body from which no valid ticket can be read is 401
            bootstrap-ticket-invalid instead). The ticket is not spent; nothing is audited; no submitted value or
            field name is echoed (ADR-018 D2 "Request bodies", D6 step 2). Two cases. (1) bad-request - the rest of
            the body cannot be read - a field other than ticket, fullName, email and password, or one of those
            holding a value that is neither a string nor null - no fieldErrors, title "Bad Request", detail "The
            request could not be understood. Check it and try again.". (2) validation - fieldErrors with these fixed
            messages - fullName "Enter the full name." (missing, null, blank after trimming, over 120 characters,
            or holding a control character or an unpaired surrogate anywhere, ends included);
            email "Enter a valid email." (missing, null, not a valid email, or holding a control character or an
            unpaired surrogate anywhere, ends included); password "The password must be 12 to
            64 characters and must not contain the first part of your email.". A missing or null field counts as
            empty. At most two entries - fullName when wrong, plus the first wrong one of email then password (the
            password is judged only once the email is valid). The list is therefore not always complete; send again
            after fixing, with the same ticket while it is valid. A control character means any character of
            Unicode general category Cc (U+0000 to U+001F and U+007F to U+009F, written in JSON as \u0000 and
            similar escapes); it is checked on the value as sent, before trimming. These values are never a 500
            (ADR-018 D6 step 2, Revision 3).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                nameAndEmail: { value: { type: 'https://sahaj.in/problems/validation', title: Check the highlighted fields, status: 400, instance: /api/v1/admin/bootstrap/register, fieldErrors: [ { field: fullName, message: Enter the full name. }, { field: email, message: Enter a valid email. } ] } }
                unreadable: { value: { type: 'https://sahaj.in/problems/bad-request', title: Bad Request, status: 400, detail: The request could not be understood. Check it and try again., instance: /api/v1/admin/bootstrap/register } }
                weakPassword: { value: { type: 'https://sahaj.in/problems/validation', title: Check the highlighted fields, status: 400, instance: /api/v1/admin/bootstrap/register, fieldErrors: [ { field: password, message: The password must be 12 to 64 characters and must not contain the first part of your email. } ] } }
        '401':
          description: 'bootstrap-ticket-invalid - the ticket or the binding cookie is missing, malformed, unknown, expired, replaced, cancelled or spent. The cookie is cleared.'
          headers:
            Set-Cookie: { description: Clears sahaj_admin_bootstrap., schema: { type: string } }
            Cache-Control: { description: no-store, schema: { type: string } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                expired: { value: { type: 'https://sahaj.in/problems/bootstrap-ticket-invalid', title: Your unlock took too long. Enter the PIN again., status: 401, instance: /api/v1/admin/bootstrap/register } }
        '403': { $ref: '#/components/responses/Problem', description: 'admin-network-denied (only when SAHAJ_ADMIN_ALLOWED_NETWORKS is set and excludes loopback)' }
        '404': { $ref: '#/components/responses/BootstrapNotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '423': { $ref: '#/components/responses/BootstrapLocked' }
        '429': { $ref: '#/components/responses/Problem', description: 'rate-limit - an unlock or another registration held the turn for more than 10 seconds; Retry-After 5; nothing created, ticket not spent' }
        '500': { $ref: '#/components/responses/BootstrapServerError' }
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Admin access token, issued only after password and authenticator code. HS256 with SAHAJ_ADMIN_JWT_SECRET
        (never the clinic key). Claims iss "sahaj", aud "sahaj-admin", sub (admin id), sid (admin session id),
        role "PLATFORM_ADMIN", amr (["pwd","otp"] or ["pwd","rcode"]), iat, exp (10 minutes), jti. Never tid.
        Each request also re-checks the session row (active admin, not revoked, idle at most 30 minutes, at most
        12 hours old). A pre-auth token is not a bearer token and is refused here.
  parameters:
    ClinicId: { name: id, in: path, required: true, description: The clinic (tenant) id., schema: { type: string, format: uuid } }
    DevNonce:
      name: X-Sahaj-Dev-Nonce
      in: header
      required: true
      description: >-
        Dev-only (ADR-008 R1, check G7). 128 random bits from SecureRandom as 32 lower-case hex characters, made
        once at each application start and printed only in the startup WARN line ("Send header
        X-Sahaj-Dev-Nonce: <value>"); copy it from the console. Never persisted, never logged elsewhere, never
        returned by any endpoint, and a new value at every start. Exactly one header; compared in constant time.
        Missing, malformed or wrong gives the same empty 404 (DevNotFound), with no hint which check failed.
      schema: { type: string, minLength: 32, maxLength: 32, pattern: '^[0-9a-f]{32}$' }
    BootstrapBindingCookie:
      name: sahaj_admin_bootstrap
      in: cookie
      required: true
      description: >-
        Dev-only (ADR-018 D5). The browser-binding half of the bootstrap ticket, set by /bootstrap/unlock as an
        HttpOnly, SameSite=Strict cookie on Path=/api/v1/admin/bootstrap, valid 5 minutes. The page cannot read it;
        the browser sends it. Stored on the server only as a keyed hash. Missing or not matching gives 401
        bootstrap-ticket-invalid (not a 400). Never logged.
      schema: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$' }
  responses:
    Problem:
      description: >-
        Error (RFC 9457). Known types under https://sahaj.in/problems/: validation (400, with fieldErrors),
        unauthorized (401, no or bad token), admin-credentials-invalid (401, "Email or password is not right."; same
        for unknown email, wrong password and switched-off admin), totp-invalid (401, "That code is not right."),
        preauth-expired (401, "Your sign-in took too long. Start again."), admin-session-ended (401),
        forbidden (403, not a platform admin), admin-network-denied (403, "Sign-in works only from approved
        networks."), not-found (404), totp-already-enrolled (409), totp-enrolment-not-started (409),
        ipd-patients-admitted (409, with admittedNow), admin-sign-in-locked (423, "Too many attempts.", with
        retryAfterSeconds), rate-limit (429, with retryAfterSeconds), admin-unavailable (503); dev-only
        bootstrap-pin-invalid (401, "That PIN is not right.", with triesLeft), bootstrap-ticket-invalid (401, "Your
        unlock took too long. Enter the PIN again.") and bootstrap-locked (423, with retryAfterSeconds); and the shared
        bad-request (400, components/responses/BadRequest) and payload-too-large (413,
        components/responses/PayloadTooLarge). Never echoes a submitted email, password, code, recovery code, token
        or search text, and never says whether an email belongs to an admin. The UI shows its own text for sign-in
        errors (ADR-003 D2.7).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    BadRequest:
      description: 'bad-request: a path value is not of its declared type (an {id} that is not a UUID). Spring''s own text is replaced by a fixed sentence (ProblemExceptionHandler); the submitted value is never echoed; no fieldErrors. Same shape as platform.yaml components/responses/BadRequest. Nothing is audited. The same type, title and detail are also the dev-only bootstrap answer to a request body that cannot be read (ADR-018 D2 "Request bodies").'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            malformedId: { value: { type: 'https://sahaj.in/problems/bad-request', title: Bad Request, status: 400, detail: The request could not be understood. Check it and try again. } }
    PayloadTooLarge:
      description: 'payload-too-large: the request body is over the size limit (RequestBodySizeLimitFilter). On /api/v1/admin/** the filter runs before the admin token filter, so every admin request, signed in or not, has the 4 KB cap; the largest admin body (PlanChange with a 500-character reason) is well under it. The body is not read past the limit, nothing is saved and nothing is audited. Same shape as platform.yaml components/responses/PayloadTooLarge.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            admin: { value: { type: 'https://sahaj.in/problems/payload-too-large', title: Request too large, status: 413, detail: The request body must be 4 KB or smaller. } }
    DevNotFound:
      description: >-
        The dev-only endpoint is not available. Always the same bytes: status 404, empty body, no Content-Type,
        Cache-Control no-store, no CORS headers, no WWW-Authenticate. Deliberately not a problem document, so the
        answer is identical whether the endpoint is absent from the build, switched off, refused for this caller,
        or already used. Produced by the main-code reserved-path filter for /api/v1/admin/dev and everything under
        it, before any security chain (ADR-008 D3). Also the answer to a missing, malformed or wrong
        X-Sahaj-Dev-Nonce (G7).
      headers:
        Cache-Control: { description: no-store, schema: { type: string } }
    DevServerError:
      description: >-
        Dev-only (ADR-008 R4). The sample admin could not be created for a reason other than the checks (for
        example a database error). Status 500, empty body, no Content-Type, Cache-Control no-store. Deliberately
        not a problem document: nothing about the failure (no database message, no row data) is returned or
        logged; the server log line carries the exception class and SQLSTATE only. Nothing was created.
      headers:
        Cache-Control: { description: no-store, schema: { type: string } }
    BootstrapNotFound:
      description: >-
        Dev-only (ADR-018 D1, D2). The bootstrap registration is not available. Byte-identical to DevNotFound -
        status 404, empty body, no Content-Type, Cache-Control no-store, no CORS headers, no WWW-Authenticate - for
        every reason - a build without dev-tools, the switch off, the PIN hash missing or malformed, the admin realm
        off or unavailable, a profile other than dev, proxy settings, a non-loopback bind, any request check K1 to
        K6 failing, any method or path under /bootstrap other than the two operations, and any platform admin
        already existing. Produced by the main-code reserved-path filter before any security chain or body-size
        filter, or by the service for "an admin exists" with the same writer. Writes nothing to the database or the
        audit.
      headers:
        Cache-Control: { description: no-store, schema: { type: string } }
    BootstrapLocked:
      description: >-
        bootstrap-locked (ADR-018 D4). Five wrong PINs locked the bootstrap registration for 60 minutes for every
        caller. The lock is stored in the database and survives a restart. retryAfterSeconds and the Retry-After
        header give the seconds left (the page shows whole minutes, rounded up). Returned by the 5th wrong PIN, by
        every unlock during the lock (even with the correct PIN, which is not compared or counted), and by
        /bootstrap/register during the lock (the lock cancelled the open ticket).
      headers:
        Retry-After: { description: Seconds until the lock ends., schema: { type: integer, minimum: 1, maximum: 3600 } }
        Cache-Control: { description: no-store, schema: { type: string } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            locked: { summary: 'From /bootstrap/unlock; from /bootstrap/register the instance is /api/v1/admin/bootstrap/register', value: { type: 'https://sahaj.in/problems/bootstrap-locked', title: Registration is locked., status: 423, instance: /api/v1/admin/bootstrap/unlock, retryAfterSeconds: 3600 } }
    BootstrapServerError:
      description: >-
        Dev-only (ADR-018 D2, ADR-008 R4 pattern). An unexpected failure such as a database error. Status 500, empty
        body, no Content-Type, Cache-Control no-store. Nothing was created and the ticket was not spent. The server
        log line carries the exception class and SQLSTATE only.
      headers:
        Cache-Control: { description: no-store, schema: { type: string } }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, examples: ['https://sahaj.in/problems/ipd-patients-admitted'] }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance:
          type: string
          format: uri-reference
          description: >-
            Optional. Absent on every other admin operation. On every problem document returned by the dev-only
            bootstrap operations themselves (400, 401, 423, 429) it is present and exactly the operation's own path,
            /api/v1/admin/bootstrap/unlock or /api/v1/admin/bootstrap/register, a constant set by the server and never
            copied from the request URI. An answer given before the operation is reached (the 413 body-size filter, or
            the request firewall's generic 400 bad-request for a path with ; parameters) has no instance. No answer
            echoes any part of the request URI (ADR-018 D2 "instance", Revision 3).
        retryAfterSeconds: { type: integer, minimum: 0 }
        admittedNow: { type: integer, minimum: 1, description: Only for ipd-patients-admitted. }
        triesLeft: { type: integer, minimum: 1, maximum: 4, description: 'Only for bootstrap-pin-invalid - wrong PINs left before the 60-minute lock (SAH-42, OQ-42-6).' }
        fieldErrors:
          type: array
          items: { type: object, required: [field, message], properties: { field: { type: string }, message: { type: string } } }
    PreAuthToken:
      type: string
      minLength: 43
      maxLength: 43
      pattern: '^[A-Za-z0-9_-]{43}$'
      description: >-
        Opaque, 256 random bits, Base64url without padding. Valid 5 minutes, single use, at most 5 wrong codes.
        Keep in component memory only (never storage or URL). Stored on the server only as a keyed hash.
    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
          description: 'Work email, label "Work email". Trimmed and lower-cased by the server. Never logged or stored from this request.'
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
          description: >-
            Label "Password". Not checked against the policy here (only when a password is set: 12 to 64 characters,
            at most 72 UTF-8 bytes, not containing the email name; ADR-003 D2.1). Over 72 UTF-8 bytes is treated as
            wrong. Never logged.
    LoginResult:
      type: object
      required: [next, preAuthToken, expiresInSeconds]
      properties:
        next:
          type: string
          enum: [TOTP, ENROL]
          description: 'TOTP = send the authenticator code to /auth/totp/verify. ENROL = first sign-in: call /auth/totp/enrol, then confirm with /auth/totp/verify.'
        preAuthToken: { $ref: '#/components/schemas/PreAuthToken' }
        expiresInSeconds: { type: integer, examples: [300] }
    TotpEnrolInput:
      type: object
      additionalProperties: false
      required: [preAuthToken]
      properties:
        preAuthToken: { $ref: '#/components/schemas/PreAuthToken' }
    TotpEnrolment:
      type: object
      required: [secretKey, otpauthUri, accountName, issuer, digits, periodSeconds, algorithm]
      properties:
        secretKey:
          type: string
          pattern: '^[A-Z2-7]{4}( [A-Z2-7]{4}){7}$'
          examples: ['JBSW Y3DP EHPK 3PXP JBSW Y3DP EHPK 3PXP']
          description: Base32 of the 20-byte secret in groups of 4, shown as "Key for manual entry". Returned only here, only during enrolment.
        otpauthUri:
          type: string
          maxLength: 400
          examples: ['otpauth://totp/Sahaj%20admin:dev.admin%40example.test?secret=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP&issuer=Sahaj%20admin&algorithm=SHA1&digits=6&period=30']
          description: Shown as selectable text and as a link ("Or open on your phone"). No QR image in phase 1.
        accountName: { type: string, maxLength: 254, description: The admin's email. }
        issuer: { type: string, enum: [Sahaj admin] }
        digits: { type: integer, enum: [6] }
        periodSeconds: { type: integer, enum: [30] }
        algorithm: { type: string, enum: [SHA1] }
    TotpVerifyInput:
      type: object
      additionalProperties: false
      required: [preAuthToken]
      description: Exactly one of code or recoveryCode.
      properties:
        preAuthToken: { $ref: '#/components/schemas/PreAuthToken' }
        code: { type: string, pattern: '^[0-9]{6}$', description: 'Label "Code from authenticator app". Never logged.' }
        recoveryCode:
          type: string
          pattern: '^[A-Za-z2-7]{4}-?[A-Za-z2-7]{4}-?[A-Za-z2-7]{4}-?[A-Za-z2-7]{4}$'
          description: 'Label "Recovery code" (not in mockup, ADR-003 H13). Case and hyphens are ignored. Only for next TOTP. Never logged.'
      oneOf:
        - { required: [code], not: { required: [recoveryCode] } }
        - { required: [recoveryCode], not: { required: [code] } }
    AdminAuthResult:
      type: object
      required: [accessToken, expiresInSeconds, admin]
      properties:
        accessToken: { type: string, description: Admin JWT. Keep in memory only. }
        expiresInSeconds: { type: integer, examples: [600] }
        admin: { $ref: '#/components/schemas/AdminMe' }
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          items: { type: string, pattern: '^[A-Z2-7]{4}-[A-Z2-7]{4}-[A-Z2-7]{4}-[A-Z2-7]{4}$' }
          description: >-
            Present only on the /auth/totp/verify response that confirms enrolment. Shown once on "Save your recovery
            codes"; never returned again (stored only as keyed hashes). Absent on normal sign-in and on refresh.
    AdminMe:
      type: object
      required: [id, name, role, roleLabel]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        role: { type: string, enum: [PLATFORM_ADMIN] }
        roleLabel: { type: string, examples: [Platform admin], description: 'Shown as "{roleLabel} · Sahaj team" and in the sign-in toast. Label pending ADR-003 H5.' }
    Plan:
      type: string
      enum: [FREE, PRO]
      description: 'FREE is shown as "Free year", PRO as "Pro" (ADR-003 H4).'
    IpdState:
      type: string
      enum: ['off', trial, 'on', readonly]
      description: 'Off · Trial · 30 days · On · Read-only. Same values as SAH-19 ModulesView.ipd.state.'
    ClinicStatus:
      type: string
      enum: [ACTIVE, INACTIVE, SUSPENDED]
      description: 'Active · Inactive · Suspended. SUSPENDED when the tenant status is not ACTIVE; INACTIVE when no member signed in during the last 7 days (or never).'
    Health:
      type: string
      enum: [HEALTHY, NEEDS_HELP, INACTIVE, SUSPENDED]
      x-needs-human: 'DEC-029 NH-1: the mockup rule (setup under 60 %, fewer than 25 visits in 7 days, Payment due) uses data that does not exist; this interim rule replaces it.'
      description: 'Healthy · Needs help · Inactive · Suspended, in this order of precedence: SUSPENDED when the tenant status is not ACTIVE; INACTIVE when no member signed in during the last 7 days (or never); NEEDS_HELP when the setup wizard is not finished; otherwise HEALTHY. No "Payment due" (no billing in phase 1).'
    Specialty:
      type: string
      enum: [gp, dental, paeds, homeo]
      description: 'General practice · Dental · Paediatrics · Homeopathy.'
    FacetOption:
      type: object
      required: [value, label, count]
      properties:
        value: { type: string, description: The value to send back in the matching ClinicSearch property. }
        label: { type: string }
        count: { type: integer, minimum: 0 }
    ClinicSearch:
      type: object
      additionalProperties: false
      description: >-
        Body of POST /clinics/search. Every property is optional; an empty object lists every organization. Unknown
        properties are refused (400). Search text is matched case-insensitively and is never logged, audited or
        echoed (ADR-016 D1, D8).
      properties:
        q:
          type: [string, 'null']
          maxLength: 100
          description: >-
            Search text. Trimmed; blank or null means no search. At most 8 words. Meaning depends on field:
            all = every word is inside the name, code (slug), city or owner name, OR the digits of q (4 or more) are
            inside the owner's mobile; name = q is inside the name; code = the slug starts with q; mobile = the
            digits of q (non-digits ignored) are inside the owner's mobile, and 4 to 10 digits are required (400
            otherwise); city = q is inside the city (the state is not stored; label "City or state" kept as drawn).
        field: { type: string, enum: [all, name, code, mobile, city], default: all, description: 'All fields · Name · Code · Owner mobile · City or state.' }
        status: { type: array, maxItems: 3, uniqueItems: true, items: { $ref: '#/components/schemas/ClinicStatus' }, description: 'Status filter (Active, Inactive, Suspended).' }
        plan: { type: array, maxItems: 2, uniqueItems: true, items: { $ref: '#/components/schemas/Plan' }, description: 'Plan filter (Free year, Pro).' }
        specialty: { type: array, maxItems: 4, uniqueItems: true, items: { $ref: '#/components/schemas/Specialty' }, description: Specialty filter. }
        city: { type: array, maxItems: 20, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 120 }, description: City filter; exact city names as returned in facets.city. }
        signedWithinDays: { type: [integer, 'null'], enum: [30, 90, 365, null], description: 'Signed up in the last 30 days, 90 days or 1 year. Null or absent = Any time.' }
        sort:
          type: string
          enum: [relevance, name, active, new]
          default: relevance
          description: >-
            Best match · Name A–Z · Recently active · Newest. relevance applies only to field=all with q (otherwise
            it acts as name) and only orders, never removes, matched rows: code equals q, then name starts with q,
            then a word of the name starts with q, then owner mobile digits, then city starts with q, then all words
            found; active organizations first within a tier; ties by name (mockup orgRank, without pins). active =
            latest sign-in first, never signed in last. new = latest sign-up first.
        page: { type: integer, minimum: 0, maximum: 10000, default: 0, description: Zero-based. A page past the end returns an empty items list with the real total. }
        size: { type: integer, enum: [25, 50, 100], default: 25 }
    ClinicFacets:
      type: object
      required: [status, plan, specialty, city]
      description: Filter options with live counts, in the mockup order City, Status, Plan, Specialty. No IPD facet (withdrawn, DEC-029 OQ-2-1) and no Health, State, Type or Partner facet (not available).
      properties:
        status: { type: array, items: { $ref: '#/components/schemas/FacetOption' } }
        plan: { type: array, items: { $ref: '#/components/schemas/FacetOption' } }
        specialty: { type: array, items: { $ref: '#/components/schemas/FacetOption' } }
        city: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/FacetOption' }, description: 'Most clinics first, then A–Z. Selected cities are always included, even with count 0.' }
    ClinicSummary:
      type: object
      required: [id, name, code, ownerName, city, specialty, specialtyLabel, plan, planLabel, status, joinedAt, lastActiveAt, ipdState, hraOn, bedLimit]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        code: { type: [string, 'null'], description: The clinic web address (slug); null while setup is not finished. Shown as the mockup's clinic code (ADR-003 H14). }
        ownerName: { type: [string, 'null'], description: Name of the clinic owner (earliest active OWNER). }
        city: { type: [string, 'null'] }
        specialty: { oneOf: [{ $ref: '#/components/schemas/Specialty' }, { type: 'null' }] }
        specialtyLabel: { type: [string, 'null'] }
        plan: { $ref: '#/components/schemas/Plan' }
        planLabel: { type: string, examples: [Free year] }
        status: { $ref: '#/components/schemas/ClinicStatus' }
        joinedAt: { type: string, format: date-time }
        lastActiveAt: { type: [string, 'null'], format: date-time, description: 'Latest staff sign-in. The UI shows Today, Yesterday, "{n} days ago" or "—".' }
        ipdState: { $ref: '#/components/schemas/IpdState', description: 'Effective state. Carried for later use; the list does not show it (story ADM-2 AC 17).' }
        hraOn: { type: boolean, description: Carried for later use; not shown in the list. }
        bedLimit: { type: integer, minimum: 5, maximum: 300, description: Carried for later use; not shown in the list. }
    ClinicPage:
      type: object
      required: [items, total, totalAll, page, size, facets]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ClinicSummary' } }
        total: { type: integer, minimum: 0, description: Organizations matching the search and filters. }
        totalAll: { type: integer, minimum: 0, description: 'All organizations on the platform (the page lead "{N} organizations").' }
        page: { type: integer, minimum: 0 }
        size: { type: integer }
        facets: { $ref: '#/components/schemas/ClinicFacets' }
    ClinicModules:
      type: object
      required: [ipdState, ipdTrialEndsAt, ipdRequestedAt, hraOn, bedLimit, admittedNow]
      properties:
        ipdState: { $ref: '#/components/schemas/IpdState', description: 'Effective state: an expired trial reads as readonly (ModuleEntitlements.effectiveIpdState). No entitlement row = off.' }
        ipdTrialEndsAt: { type: [string, 'null'], format: date-time, description: 'Set only while the stored state is trial (also after it has passed, when ipdState reads readonly).' }
        ipdRequestedAt: { type: [string, 'null'], format: date-time, description: When the owner pressed Request IPD (SAH-19). Not shown in the mockup's admin view; provided for later use. }
        hraOn: { type: boolean }
        bedLimit: { type: integer, minimum: 5, maximum: 300, multipleOf: 5 }
        admittedNow: { type: integer, minimum: 0, description: 'Patients admitted now (count only). "{n} patients admitted now" or "No admissions".' }
    ClinicDetail:
      type: object
      required: [id, name, code, city, specialty, specialtyLabel, status, health, ownerName, ownerMobileLast5, joinedAt, lastActiveAt, plan, planLabel, setupComplete, modules]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        code: { type: [string, 'null'], description: 'Slug; the header shows "{code}.sahaj.in".' }
        city: { type: [string, 'null'] }
        specialty: { oneOf: [{ $ref: '#/components/schemas/Specialty' }, { type: 'null' }] }
        specialtyLabel: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ClinicStatus' }
        health: { $ref: '#/components/schemas/Health' }
        ownerName: { type: [string, 'null'] }
        ownerMobileLast5: { type: [string, 'null'], pattern: '^[0-9]{5}$', description: 'Only the last 5 digits, as the mockup header "mobile ••••• 00001". The full number is never returned.' }
        joinedAt: { type: string, format: date-time }
        lastActiveAt: { type: [string, 'null'], format: date-time }
        plan: { $ref: '#/components/schemas/Plan' }
        planLabel: { type: string }
        setupComplete: { type: boolean }
        modules: { $ref: '#/components/schemas/ClinicModules' }
    ModulesChange:
      type: object
      additionalProperties: false
      minProperties: 1
      description: At least one field. Unknown fields are refused (400).
      properties:
        ipdState: { $ref: '#/components/schemas/IpdState' }
        hraOn: { type: boolean }
        bedLimit: { type: integer, minimum: 5, maximum: 300, multipleOf: 5 }
    PlanChange:
      type: object
      additionalProperties: false
      required: [plan, reason]
      properties:
        plan: { $ref: '#/components/schemas/Plan' }
        reason: { type: string, minLength: 10, maxLength: 500, description: Trimmed before the length check. Saved in the admin audit log; never logged. }
        ticket: { type: [string, 'null'], maxLength: 20, pattern: '^[A-Za-z0-9-]{1,20}$', description: 'Optional support ticket, for example T-2304.' }
    ActivityEntry:
      type: object
      required: [id, at, adminName, action, reason, approval, outcome]
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        adminName: { type: string }
        adminRoleLabel: { type: string, examples: [Platform admin] }
        action: { type: string, examples: ['IPD set to On', 'HRA switched off', 'Bed limit set to 30', 'Plan changed to Pro'] }
        reason: { type: string, description: 'Reason as typed, plus " (ticket T-2304)" when a ticket was given; "Module entitlement" for module changes.' }
        approval: { type: string, examples: ['—'], description: 'Second admin / consent column. Always "—" in phase 1.' }
        outcome: { type: string, enum: [APPLIED], description: 'Only APPLIED is listed in phase 1 (ADR-016 D5). REFUSED rows are stored but not listed until DEC-029 NH-8 is answered; the value REFUSED is then added here.' }
    DevSampleAdmin:
      type: object
      description: >-
        Dev-only (DEC-016, ADR-008). Returned once by POST /dev/sample-admin. Never logged, never stored in plain
        text, never returned again. The server's toString of this object prints no values.
      required: [adminId, email, fullName, password, secretKey, otpauthUri, accountName, issuer, digits, periodSeconds, algorithm, totpEnrolled, totpDevBypassOn, signInPath]
      properties:
        adminId: { type: string, format: uuid }
        email: { type: string, const: sample-admin@example.test, description: 'Fixed, not a real address. Type it as "Work email".' }
        fullName: { type: string, const: Sample admin }
        password:
          type: string
          format: password
          readOnly: true
          minLength: 24
          maxLength: 24
          pattern: '^[A-HJ-NP-Za-km-z2-9]{24}$'
          description: >-
            24 characters drawn with SecureRandom from A-Z without I and O, a-z without l, and 2-9 (about 140 bits).
            Meets the admin password policy (ADR-003 D2.1). Stored only as a BCrypt hash.
        secretKey:
          type: string
          readOnly: true
          pattern: '^[A-Z2-7]{4}( [A-Z2-7]{4}){7}$'
          examples: ['JBSW Y3DP EHPK 3PXP JBSW Y3DP EHPK 3PXP']
          description: Base32 of the 20-byte TOTP secret in groups of 4, for manual entry in an authenticator app.
        otpauthUri:
          type: string
          readOnly: true
          maxLength: 400
          examples: ['otpauth://totp/Sahaj%20admin:sample-admin%40example.test?secret=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP&issuer=Sahaj%20admin&algorithm=SHA1&digits=6&period=30']
          description: Same format as TotpEnrolment.otpauthUri (built by the same code).
        accountName: { type: string, const: sample-admin@example.test }
        issuer: { type: string, enum: [Sahaj admin] }
        digits: { type: integer, enum: [6] }
        periodSeconds: { type: integer, enum: [30] }
        algorithm: { type: string, enum: [SHA1] }
        totpEnrolled:
          type: boolean
          const: true
          description: The admin is created already enrolled; the first sign-in answers next TOTP, not ENROL. No recovery codes exist for it.
        totpDevBypassOn:
          type: boolean
          description: 'True when sahaj.admin.totp.dev-bypass is on: then any 6 digits are accepted as the code from this machine, and the secret is needed only to test real codes.'
        signInPath: { type: string, const: /admin/sign-in, description: The Angular sign-in route. }
    ActivityPage:
      type: object
      required: [items, total, page, size]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ActivityEntry' } }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 0 }
        size: { type: integer }
    BootstrapTicket:
      type: string
      minLength: 43
      maxLength: 43
      pattern: '^[A-Za-z0-9_-]{43}$'
      description: >-
        Dev-only (ADR-018 D5). Opaque, 256 random bits, Base64url without padding. Valid 5 minutes from the unlock,
        single use, only with the binding cookie of the same browser, replaced by a new unlock, cancelled by a lock.
        Keep in component memory only (never storage, URL or history). Stored on the server only as a keyed hash.
        Not a bearer token; refused by every other endpoint. Never logged.
    BootstrapUnlockInput:
      type: object
      additionalProperties: false
      required: [pin]
      description: 'Unknown properties, duplicate keys and a non-string pin are refused with 400 bad-request; a missing or null pin is 400 validation "Enter the PIN." (ADR-018 D2). The server''s toString of this object prints no value.'
      properties:
        pin:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          description: >-
            Label "Registration PIN". Compared exactly as sent (no trimming). Blank or whitespace-only is a 400
            validation error and is not counted. No length or digit rule here (the PIN may be longer or not numeric
            later; DEC-034); a value over 64 characters or 72 UTF-8 bytes is a wrong PIN and counts. Only the 4 KB
            body cap (413) limits it. Never logged, stored, audited or echoed.
    BootstrapUnlocked:
      type: object
      required: [ticket, expiresInSeconds]
      description: The server's toString of this object prints no value.
      properties:
        ticket: { $ref: '#/components/schemas/BootstrapTicket' }
        expiresInSeconds: { type: integer, const: 300 }
    BootstrapRegisterInput:
      type: object
      additionalProperties: false
      required: [ticket, fullName, email, password]
      description: >-
        Unknown properties, duplicate keys and non-string values are refused with 400 bad-request and never stored;
        a missing or null fullName, email or password is a field error (ADR-018 D2, D6). "Confirm password" is checked in the page only and
        is not sent (OQ-42-4). The server's toString of this object prints no value.
      properties:
        ticket: { $ref: '#/components/schemas/BootstrapTicket' }
        fullName:
          type: string
          minLength: 1
          maxLength: 120
          description: 'Label "Full name". Trimmed; 1 to 120 characters after trimming. Stored on the admin and in the creation audit row; never logged.'
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
          description: >-
            Label "Work email". Trimmed and lower-cased (Locale.ROOT) before checks and storage. Must match the admin
            email rule (one @, a dot in the domain, no spaces). Never logged, never audited, never echoed.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 64
          description: >-
            Label "Password". ADR-003 D2.1 - 12 to 64 characters, at most 72 bytes in UTF-8, must not contain the
            part of the email before @ (any letter case); no composition rules, no breached-password check
            (OQ-42-2). Stored only as BCrypt (strength 12). Never logged, stored in plain text or echoed.
