openapi: 3.1.0
info:
  title: Sahaj admin portal API
  version: 0.3.1
  description: >-
    Phase 1 contract for the Sahaj admin portal, stories ADM-1 (admin sign-in with work email, password and
    authenticator app), ADM-2 (organizations directory and clinic detail) and ADM-3 (modules and plan management).
    Design: docs/architecture/adr/ADR-003-sahaj-admin-portal.md (revision 2, DEC-012). Version 0.2.0 replaces the
    mobile OTP endpoints of 0.1.0 with /auth/login, /auth/totp/enrol and /auth/totp/verify. Version 0.3.0 adds the
    dev-only operation POST /dev/sample-admin (x-dev-only, DEC-016, ADR-008). It is not part of the production
    product: it is absent from every jar built without the Maven profile dev-tools, and every path under /dev
    answers an empty 404 unless all its build and runtime conditions hold. Version 0.3.1 applies the security
    review fixes (ADR-008 revision 2, R1 to R12): the per-start X-Sahaj-Dev-Nonce header, the flag from the
    command line only, more refused forwarding headers, the cloud-platform check and the bodyless 500.
    A separate security realm from the clinic API; it shares no sign-in code with the clinic OTP flow. Sign-in has
    two steps: email and password give a short-lived pre-auth token (5 minutes, single use, not a bearer token), then
    a 6-digit authenticator code (RFC 6238, HMAC-SHA1, 30 s, 6 digits) or a recovery code gives the session. Admin
    access tokens are issued only after both steps, are signed with their own key, carry aud "sahaj-admin" and role
    PLATFORM_ADMIN, and never carry a tenant. A clinic token or a pre-auth token is refused on every protected route
    here, and an admin token is refused on every clinic route. Every operation except the four public auth endpoints
    needs role PLATFORM_ADMIN (x-required-role). Every /api/v1/admin/** request from an address outside
    SAHAJ_ADMIN_ALLOWED_NETWORKS answers 403 admin-network-denied (in every profile except dev, an empty list refuses
    everything). When SAHAJ_ADMIN_JWT_SECRET or SAHAJ_ADMIN_TOTP_KEY is not configured, every route answers 503
    admin-unavailable. Responses of the sign-in endpoints carry Cache-Control no-store, and their request bodies are
    never logged. Cross-tenant reads and writes go only through audited database functions. Responses carry
    clinic-level fields and counts only, never patient data. Times are ISO 8601 UTC; the UI shows IST. Errors are
    RFC 9457 application/problem+json with type https://sahaj.in/problems/<slug>.
servers:
  - url: /api/v1/admin
security:
  - adminBearer: []
tags:
  - { name: ADM-1, description: 'Admin sign-in, session and shell' }
  - { name: ADM-2, description: Organizations directory and clinic detail (read-only) }
  - { name: ADM-3, description: Modules and plan management }
  - { name: DEV, description: 'Dev-only tools (DEC-016, ADR-008). Never in a production build.' }
paths:
  /auth/login:
    post:
      tags: [ADM-1]
      operationId: adminLogin
      security: []
      x-required-role: public
      description: >-
        Step 1: work email and password. The email is trimmed and lower-cased. On a correct password for an active
        admin, returns a pre-auth token (5 minutes, single use) and next = TOTP (enrolled) or ENROL (first sign-in).
        Never returns an access token. No user enumeration: an unknown email, a wrong password and a switched-off
        admin all answer the same 401 admin-credentials-invalid ("Email or password is not right."), and an unknown
        email is checked against a dummy BCrypt hash so timing does not differ. 423 admin-sign-in-locked (with
        retryAfterSeconds) when the email has 5 failed sign-in steps (password, code or recovery code) within
        15 minutes; the lock lasts 15 minutes and applies to any typed email, known or not. 429 rate-limit after
        10 login requests per email, or 20 requests per client address across /auth/login, /auth/totp/enrol and
        /auth/totp/verify, within 15 minutes. A password longer than 72 UTF-8 bytes is treated as wrong. Audited
        ADMIN_SIGN_IN_FAILED (step PASSWORD; admin id only when the email is an admin's; never the typed email).
        The password is never logged, stored in plain text or echoed.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginInput' } } }
      responses:
        '200':
          description: Password accepted. Continue with /auth/totp/verify (next TOTP) or /auth/totp/enrol (next ENROL).
          headers:
            Cache-Control: { description: no-store, schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/LoginResult' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /auth/totp/enrol:
    post:
      tags: [ADM-1]
      operationId: adminTotpEnrol
      security: []
      x-required-role: public (needs a pre-auth token with next ENROL)
      description: >-
        First sign-in only. Creates a pending authenticator secret (20 random bytes) for the admin of this pre-auth
        token, stores it encrypted (AES-256-GCM) on the pre-auth record, and returns it once for the authenticator
        app: the Base32 key for manual entry (groups of 4) and the otpauth:// URI. No QR image is returned (ADR-003
        H18). Calling it again with the same pre-auth token returns the same pending secret. The secret is confirmed
        by the first correct code on /auth/totp/verify; until then nothing changes on the admin. 401 preauth-expired
        for an unknown, expired or consumed pre-auth token. 409 totp-already-enrolled when the pre-auth token is for
        next TOTP. Never logged or audited with the secret.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TotpEnrolInput' } } }
      responses:
        '200':
          description: The pending secret for the authenticator app.
          headers:
            Cache-Control: { description: no-store, schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/TotpEnrolment' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /auth/totp/verify:
    post:
      tags: [ADM-1]
      operationId: adminTotpVerify
      security: []
      x-required-role: public (needs a pre-auth token)
      description: >-
        Step 2: the 6-digit code from the authenticator app, or a recovery code instead (only for next TOTP).
        Codes of the current 30-second step and one step either side are accepted; a code whose step is not later
        than the last one used is refused (replay). On success, consumes the pre-auth token, starts an admin session,
        sets the cookie sahaj_admin_rt (HttpOnly; Secure; SameSite=Strict; Path=/api/v1/admin/auth) and returns a
        10-minute access token. For next ENROL, the first correct code confirms enrolment, and the response carries
        the 10 recovery codes once (audited ADMIN_TOTP_ENROLLED). A recovery code works once (audited
        ADMIN_RECOVERY_CODE_USED). Errors: 401 totp-invalid ("That code is not right.") for a wrong code or recovery
        code; after 5 wrong codes on one pre-auth token it is consumed, and the next call answers 401
        preauth-expired ("Your sign-in took too long. Start again."); 423 admin-sign-in-locked when the email
        reaches 5 failed steps within 15 minutes; 409 totp-enrolment-not-started when next is ENROL and
        /auth/totp/enrol has not been called; 400 when a recovery code is sent for next ENROL. Audited
        ADMIN_SIGNED_IN (method), or ADMIN_SIGN_IN_FAILED (step TOTP or RECOVERY_CODE). In the dev profile with
        sahaj.admin.totp.dev-bypass on, from a loopback address only, any 6 digits are accepted as the code
        (never as a recovery code, and the password in step 1 is always checked).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TotpVerifyInput' } } }
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie: { description: 'sahaj_admin_rt refresh cookie (opaque, rotated on every refresh).', schema: { type: string } }
            Cache-Control: { description: no-store, schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminAuthResult' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /auth/refresh:
    post:
      tags: [ADM-1]
      operationId: adminRefresh
      security: []
      x-required-role: public (needs the sahaj_admin_rt cookie)
      description: >-
        Issues a new access token and rotates the refresh cookie. Does not ask for the password or code again.
        401 admin-session-ended when the cookie is missing or unknown, the session is revoked, idle for more than
        30 minutes, older than 12 hours, or the admin is switched off. Presenting an already-rotated refresh token
        revokes the whole session (audited ADMIN_SESSION_REVOKED) and answers 401. 429 rate-limit after 30 calls
        per client address within 15 minutes.
      parameters:
        - { name: sahaj_admin_rt, in: cookie, required: true, schema: { type: string } }
      responses:
        '200':
          description: New access token.
          headers:
            Set-Cookie: { description: Rotated sahaj_admin_rt cookie., schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminAuthResult' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /auth/sign-out:
    post:
      tags: [ADM-1]
      operationId: adminSignOut
      x-required-role: PLATFORM_ADMIN
      description: Revokes the current admin session and clears the cookie. Audited ADMIN_SIGNED_OUT.
      responses:
        '204':
          description: Signed out.
          headers:
            Set-Cookie: { description: Clears sahaj_admin_rt., schema: { type: string } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /me:
    get:
      tags: [ADM-1]
      operationId: adminMe
      x-required-role: PLATFORM_ADMIN
      description: The signed-in admin, for the shell's profile menu. Not audited.
      responses:
        '200': { description: The signed-in admin., content: { application/json: { schema: { $ref: '#/components/schemas/AdminMe' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /clinics:
    get:
      tags: [ADM-2]
      operationId: adminListClinics
      x-required-role: PLATFORM_ADMIN
      description: >-
        The Organizations directory (mockup orgDirPage). Filters with several values are OR within a filter and AND
        across filters (repeat the parameter, for example plan=FREE&plan=PRO). Facet counts apply every other active
        filter, the search and signedWithinDays, but not the facet itself. sort=relevance applies only when q is given
        with field=all, and is otherwise treated as name. field=mobile needs 4 to 10 digits in q (400 otherwise) and
        matches the owner's mobile, which is never returned in full. "code" is the clinic web address (slug).
        Audited ACCESS CLINICS_LISTED with the filters and total (never the search text).
      parameters:
        - { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 100 }, description: Search text. Trimmed; blank is treated as absent. }
        - { name: field, in: query, schema: { type: string, enum: [all, name, code, mobile, city], default: all }, description: 'All fields · Name · Code · Owner mobile · City or state.' }
        - { name: status, in: query, style: form, explode: true, schema: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/ClinicStatus' } } }
        - { name: plan, in: query, style: form, explode: true, schema: { type: array, maxItems: 2, items: { $ref: '#/components/schemas/Plan' } } }
        - { name: specialty, in: query, style: form, explode: true, schema: { type: array, maxItems: 4, items: { $ref: '#/components/schemas/Specialty' } } }
        - { name: city, in: query, style: form, explode: true, schema: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 120 } }, description: Exact city names as returned in facets.city. }
        - { name: ipd, in: query, style: form, explode: true, schema: { type: array, maxItems: 4, items: { $ref: '#/components/schemas/IpdState' } }, description: Effective IPD state (an expired trial counts as readonly). }
        - { name: signedWithinDays, in: query, schema: { type: integer, enum: [30, 90, 365] }, description: 'Signed up in the last 30 days, 90 days or 1 year. Absent = Any time.' }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, name, active, new], default: relevance }, description: 'Best match · Name A–Z · Recently active · Newest.' }
        - { name: page, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }, description: Zero-based. A page past the end returns an empty items list with the real total. }
        - { name: size, in: query, schema: { type: integer, enum: [25, 50, 100], default: 25 } }
      responses:
        '200': { description: One page of organizations with facet counts., content: { application/json: { schema: { $ref: '#/components/schemas/ClinicPage' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /clinics/{id}:
    parameters:
      - $ref: '#/components/parameters/ClinicId'
    get:
      tags: [ADM-2]
      operationId: adminGetClinic
      x-required-role: PLATFORM_ADMIN
      description: >-
        One clinic for the detail page (header, Plan and billing, Modules). admittedNow is a count from the ipd
        module (IpdOccupancyPort), never patient rows. 400 for a malformed id, 404 for an unknown one. Audited
        ACCESS CLINIC_VIEWED.
      responses:
        '200': { description: The clinic., content: { application/json: { schema: { $ref: '#/components/schemas/ClinicDetail' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /clinics/{id}/modules:
    parameters:
      - $ref: '#/components/parameters/ClinicId'
    patch:
      tags: [ADM-3]
      operationId: adminChangeModules
      x-required-role: PLATFORM_ADMIN
      description: >-
        Change one or more module entitlements of a clinic. ipdState trial sets the trial end to now + 30 days; on,
        off and readonly clear it; choosing trial on an expired trial starts a new 30 days. A field equal to the
        current value is ignored, and a request that changes nothing returns the clinic unchanged with no audit row.
        409 ipd-patients-admitted when ipdState is off or readonly and patients are admitted. Then nothing in the
        request is applied, and the refusal is audited (outcome REFUSED). The problem detail reads
        "{n} patients are admitted in {clinic}. IPD stays {state} until they are discharged." and carries
        admittedNow. Every applied change writes one ACTION MODULES_CHANGED audit row per changed field in the same
        transaction ("IPD set to On", "HRA switched on", "Bed limit set to 30"; reason "Module entitlement"). The
        clinic sees the new values on its next request.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ModulesChange' } } }
      responses:
        '200': { description: The clinic after the change., content: { application/json: { schema: { $ref: '#/components/schemas/ClinicDetail' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /clinics/{id}/plan:
    parameters:
      - $ref: '#/components/parameters/ClinicId'
    put:
      tags: [ADM-3]
      operationId: adminChangePlan
      x-required-role: PLATFORM_ADMIN
      description: >-
        Change the clinic's plan at once (phase 1 has no billing, renewals or second-admin approval). 400 with field
        reason "Write a reason of at least 10 characters. It goes into the audit log." The same plan as now returns
        the clinic unchanged with no audit row. Applied changes write one ACTION PLAN_CHANGED audit row with
        before/after, reason and ticket, in the same transaction.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PlanChange' } } }
      responses:
        '200': { description: The clinic after the change., content: { application/json: { schema: { $ref: '#/components/schemas/ClinicDetail' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /clinics/{id}/activity:
    parameters:
      - $ref: '#/components/parameters/ClinicId'
    get:
      tags: [ADM-3]
      operationId: adminClinicActivity
      x-required-role: PLATFORM_ADMIN
      description: >-
        The clinic detail's Activity log tab: admin actions (audit kind ACTION) for this clinic, newest first,
        including refused changes. Sign-in and access rows are not listed. Audited ACCESS CLINIC_ACTIVITY_VIEWED.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: One page of activity., content: { application/json: { schema: { $ref: '#/components/schemas/ActivityPage' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /dev/sample-admin:
    post:
      tags: [DEV]
      operationId: devCreateSampleAdmin
      security: []
      x-dev-only: true
      x-required-role: 'none: unauthenticated, loopback caller only, dev-tools build only'
      x-build-profile: dev-tools
      x-runtime-conditions:
        - 'C1 Spring profile dev is active, and every active profile is dev or test'
        - 'C2 sahaj.admin.dev-sample-enabled=true read raw from the commandLineArgs property source only (a program argument of this run); the same key from an environment variable, SPRING_APPLICATION_JSON, a system property, an IDE VM option or any application*.yml is ignored (default false)'
        - 'C3 sahaj.admin.enabled=true with SAHAJ_ADMIN_JWT_SECRET and SAHAJ_ADMIN_TOTP_KEY set (admin realm on)'
        - 'C4 No proxy configuration: server.forward-headers-strategy absent or none, server.tomcat.remoteip.remote-ip-header and protocol-header blank, spring.main.cloud-platform blank, and no cloud platform detected'
        - 'C5 server.address is a loopback address'
      x-request-checks:
        - 'G1 Exactly POST /api/v1/admin/dev/sample-admin'
        - 'G2 Servlet remote address is loopback (127.0.0.0/8 or ::1); X-Forwarded-For and similar are never trusted'
        - 'G3 None of Forwarded, X-Forwarded-For, X-Forwarded-Host, X-Forwarded-Proto, X-Forwarded-Port, X-Forwarded-Prefix, X-Forwarded-Server, X-Original-Forwarded-For, X-Real-IP, X-Client-IP, Client-IP, True-Client-IP, CF-Connecting-IP, Fastly-Client-IP, X-Cluster-Client-IP, Via is present (names case-insensitive; values never read)'
        - 'G4 Host is 127.0.0.1, localhost or [::1] (optionally with a port)'
        - 'G5 No Origin, Sec-Fetch-Site or Sec-Fetch-Mode header (browsers are refused)'
        - 'G6 No platform admin exists yet (checked atomically in the database)'
        - 'G7 Exactly one X-Sahaj-Dev-Nonce header equal to this start''s nonce, compared in constant time'
      x-human-question: >-
        ADR-008 H-DEV-2. DEC-016 says 404 when an admin already exists, so this contract answers 404. If the human
        chooses 409 instead, the response becomes 409 application/problem+json, type
        https://sahaj.in/problems/sample-admin-exists, title "An admin already exists. This endpoint creates the
        first admin only.", returned only after every other check has passed.
      description: >-
        Creates the one sample platform admin sample-admin@example.test (name "Sample admin"; example.test is a
        reserved name that can never be a real mailbox), already enrolled for the authenticator app, and returns
        its password and TOTP secret once. No request body (a body, if sent, is never read). No authentication: a
        bearer token or cookie sent with the request is ignored. The password is 24 characters from SecureRandom;
        it is stored only as a BCrypt (strength 12) hash and the TOTP secret only as AES-256-GCM ciphertext bound
        to the admin id, through the same code as the env seed and the enrolment (ADR-003 D5, D2.3). Nothing can
        return the password or secret again. The sample admin has no recovery codes (ADR-008 H-DEV-3); its first
        sign-in gets next TOTP. Every case that does not create the admin answers the same empty 404 (DevNotFound):
        a build without dev-tools, any runtime condition false, any request check failing, any admin already
        existing (active or not, seeded or not), any other method or path under /dev. A second call therefore
        never reveals or resets anything. 429 rate-limit after 5 calls within 15 minutes that passed the request
        checks; a call that fails them gets 404 and is not counted. Audited in platform_admin_audit as AUTH
        ADMIN_DEV_SAMPLE_CREATED (APPLIED) or ADMIN_DEV_SAMPLE_REFUSED (REFUSED, admin-exists), with address and
        request id and never a password, hash, secret or URI. The password, secret, URI and email are never
        logged. The X-Sahaj-Dev-Nonce header is required: a missing, malformed or wrong value answers the same
        empty 404 and is not counted by the rate limit. Any other failure (for example a database error) answers
        a bodyless 500 (DevServerError) whose log line carries the exception class and SQLSTATE only. Call it with
        curl from the same machine, straight to 127.0.0.1:8080 (never through the Angular dev server, whose proxy
        adds forwarding headers), for example
        curl.exe -s -X POST -H "X-Sahaj-Dev-Nonce: <value>" http://127.0.0.1:8080/api/v1/admin/dev/sample-admin,
        with the value copied from the console (ADR-008 R12).
      parameters:
        - $ref: '#/components/parameters/DevNonce'
      responses:
        '201':
          description: The sample admin was created. Shown once; copy the password and key now.
          headers:
            Cache-Control: { description: no-store, schema: { type: string } }
            Pragma: { description: no-cache, schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/DevSampleAdmin' } } }
        '404': { $ref: '#/components/responses/DevNotFound' }
        '429': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/DevServerError' }
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Admin access token, issued only after password and authenticator code. HS256 with SAHAJ_ADMIN_JWT_SECRET
        (never the clinic key). Claims iss "sahaj", aud "sahaj-admin", sub (admin id), sid (admin session id),
        role "PLATFORM_ADMIN", amr (["pwd","otp"] or ["pwd","rcode"]), iat, exp (10 minutes), jti. Never tid.
        Each request also re-checks the session row (active admin, not revoked, idle at most 30 minutes, at most
        12 hours old). A pre-auth token is not a bearer token and is refused here.
  parameters:
    ClinicId: { name: id, in: path, required: true, description: The clinic (tenant) id., schema: { type: string, format: uuid } }
    DevNonce:
      name: X-Sahaj-Dev-Nonce
      in: header
      required: true
      description: >-
        Dev-only (ADR-008 R1, check G7). 128 random bits from SecureRandom as 32 lower-case hex characters, made
        once at each application start and printed only in the startup WARN line ("Send header
        X-Sahaj-Dev-Nonce: <value>"); copy it from the console. Never persisted, never logged elsewhere, never
        returned by any endpoint, and a new value at every start. Exactly one header; compared in constant time.
        Missing, malformed or wrong gives the same empty 404 (DevNotFound), with no hint which check failed.
      schema: { type: string, minLength: 32, maxLength: 32, pattern: '^[0-9a-f]{32}$' }
  responses:
    Problem:
      description: >-
        Error (RFC 9457). Known types under https://sahaj.in/problems/: validation (400, with fieldErrors),
        unauthorized (401, no or bad token), admin-credentials-invalid (401, "Email or password is not right."; same
        for unknown email, wrong password and switched-off admin), totp-invalid (401, "That code is not right."),
        preauth-expired (401, "Your sign-in took too long. Start again."), admin-session-ended (401),
        forbidden (403, not a platform admin), admin-network-denied (403, "Sign-in works only from approved
        networks."), not-found (404), totp-already-enrolled (409), totp-enrolment-not-started (409),
        ipd-patients-admitted (409, with admittedNow), admin-sign-in-locked (423, "Too many attempts.", with
        retryAfterSeconds), rate-limit (429, with retryAfterSeconds), admin-unavailable (503). Never echoes a
        submitted email, password, code, recovery code or token, and never says whether an email belongs to an
        admin. The UI shows its own text for sign-in errors (ADR-003 D2.7).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    DevNotFound:
      description: >-
        The dev-only endpoint is not available. Always the same bytes: status 404, empty body, no Content-Type,
        Cache-Control no-store, no CORS headers, no WWW-Authenticate. Deliberately not a problem document, so the
        answer is identical whether the endpoint is absent from the build, switched off, refused for this caller,
        or already used. Produced by the main-code reserved-path filter for /api/v1/admin/dev and everything under
        it, before any security chain (ADR-008 D3). Also the answer to a missing, malformed or wrong
        X-Sahaj-Dev-Nonce (G7).
      headers:
        Cache-Control: { description: no-store, schema: { type: string } }
    DevServerError:
      description: >-
        Dev-only (ADR-008 R4). The sample admin could not be created for a reason other than the checks (for
        example a database error). Status 500, empty body, no Content-Type, Cache-Control no-store. Deliberately
        not a problem document: nothing about the failure (no database message, no row data) is returned or
        logged; the server log line carries the exception class and SQLSTATE only. Nothing was created.
      headers:
        Cache-Control: { description: no-store, schema: { type: string } }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, examples: ['https://sahaj.in/problems/ipd-patients-admitted'] }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        retryAfterSeconds: { type: integer, minimum: 0 }
        admittedNow: { type: integer, minimum: 1, description: Only for ipd-patients-admitted. }
        fieldErrors:
          type: array
          items: { type: object, required: [field, message], properties: { field: { type: string }, message: { type: string } } }
    PreAuthToken:
      type: string
      minLength: 43
      maxLength: 43
      pattern: '^[A-Za-z0-9_-]{43}$'
      description: >-
        Opaque, 256 random bits, Base64url without padding. Valid 5 minutes, single use, at most 5 wrong codes.
        Keep in component memory only (never storage or URL). Stored on the server only as a keyed hash.
    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
          description: 'Work email, label "Work email". Trimmed and lower-cased by the server. Never logged or stored from this request.'
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
          description: >-
            Label "Password". Not checked against the policy here (only when a password is set: 12 to 64 characters,
            at most 72 UTF-8 bytes, not containing the email name; ADR-003 D2.1). Over 72 UTF-8 bytes is treated as
            wrong. Never logged.
    LoginResult:
      type: object
      required: [next, preAuthToken, expiresInSeconds]
      properties:
        next:
          type: string
          enum: [TOTP, ENROL]
          description: 'TOTP = send the authenticator code to /auth/totp/verify. ENROL = first sign-in: call /auth/totp/enrol, then confirm with /auth/totp/verify.'
        preAuthToken: { $ref: '#/components/schemas/PreAuthToken' }
        expiresInSeconds: { type: integer, examples: [300] }
    TotpEnrolInput:
      type: object
      additionalProperties: false
      required: [preAuthToken]
      properties:
        preAuthToken: { $ref: '#/components/schemas/PreAuthToken' }
    TotpEnrolment:
      type: object
      required: [secretKey, otpauthUri, accountName, issuer, digits, periodSeconds, algorithm]
      properties:
        secretKey:
          type: string
          pattern: '^[A-Z2-7]{4}( [A-Z2-7]{4}){7}$'
          examples: ['JBSW Y3DP EHPK 3PXP JBSW Y3DP EHPK 3PXP']
          description: Base32 of the 20-byte secret in groups of 4, shown as "Key for manual entry". Returned only here, only during enrolment.
        otpauthUri:
          type: string
          maxLength: 400
          examples: ['otpauth://totp/Sahaj%20admin:dev.admin%40example.test?secret=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP&issuer=Sahaj%20admin&algorithm=SHA1&digits=6&period=30']
          description: Shown as selectable text and as a link ("Or open on your phone"). No QR image in phase 1.
        accountName: { type: string, maxLength: 254, description: The admin's email. }
        issuer: { type: string, enum: [Sahaj admin] }
        digits: { type: integer, enum: [6] }
        periodSeconds: { type: integer, enum: [30] }
        algorithm: { type: string, enum: [SHA1] }
    TotpVerifyInput:
      type: object
      additionalProperties: false
      required: [preAuthToken]
      description: Exactly one of code or recoveryCode.
      properties:
        preAuthToken: { $ref: '#/components/schemas/PreAuthToken' }
        code: { type: string, pattern: '^[0-9]{6}$', description: 'Label "Code from authenticator app". Never logged.' }
        recoveryCode:
          type: string
          pattern: '^[A-Za-z2-7]{4}-?[A-Za-z2-7]{4}-?[A-Za-z2-7]{4}-?[A-Za-z2-7]{4}$'
          description: 'Label "Recovery code" (not in mockup, ADR-003 H13). Case and hyphens are ignored. Only for next TOTP. Never logged.'
      oneOf:
        - { required: [code], not: { required: [recoveryCode] } }
        - { required: [recoveryCode], not: { required: [code] } }
    AdminAuthResult:
      type: object
      required: [accessToken, expiresInSeconds, admin]
      properties:
        accessToken: { type: string, description: Admin JWT. Keep in memory only. }
        expiresInSeconds: { type: integer, examples: [600] }
        admin: { $ref: '#/components/schemas/AdminMe' }
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          items: { type: string, pattern: '^[A-Z2-7]{4}-[A-Z2-7]{4}-[A-Z2-7]{4}-[A-Z2-7]{4}$' }
          description: >-
            Present only on the /auth/totp/verify response that confirms enrolment. Shown once on "Save your recovery
            codes"; never returned again (stored only as keyed hashes). Absent on normal sign-in and on refresh.
    AdminMe:
      type: object
      required: [id, name, role, roleLabel]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        role: { type: string, enum: [PLATFORM_ADMIN] }
        roleLabel: { type: string, examples: [Platform admin], description: 'Shown as "{roleLabel} · Sahaj team" and in the sign-in toast. Label pending ADR-003 H5.' }
    Plan:
      type: string
      enum: [FREE, PRO]
      description: 'FREE is shown as "Free year", PRO as "Pro" (ADR-003 H4).'
    IpdState:
      type: string
      enum: ['off', trial, 'on', readonly]
      description: 'Off · Trial · 30 days · On · Read-only. Same values as SAH-19 ModulesView.ipd.state.'
    ClinicStatus:
      type: string
      enum: [ACTIVE, INACTIVE, SUSPENDED]
      description: 'Active · Inactive · Suspended. SUSPENDED when the tenant status is not ACTIVE; INACTIVE when no member signed in during the last 7 days (or never).'
    Health:
      type: string
      enum: [HEALTHY, NEEDS_HELP, INACTIVE, SUSPENDED]
      description: 'Healthy · Needs help · Inactive · Suspended. NEEDS_HELP when the setup wizard is not finished.'
    Specialty:
      type: string
      enum: [gp, dental, paeds, homeo]
      description: 'General practice · Dental · Paediatrics · Homeopathy.'
    FacetOption:
      type: object
      required: [value, label, count]
      properties:
        value: { type: string, description: The value to send back in the matching query parameter. }
        label: { type: string }
        count: { type: integer, minimum: 0 }
    ClinicFacets:
      type: object
      required: [status, plan, specialty, city, ipd]
      properties:
        status: { type: array, items: { $ref: '#/components/schemas/FacetOption' } }
        plan: { type: array, items: { $ref: '#/components/schemas/FacetOption' } }
        specialty: { type: array, items: { $ref: '#/components/schemas/FacetOption' } }
        city: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/FacetOption' }, description: 'Most clinics first, then A–Z. Selected cities are always included, even with count 0.' }
        ipd: { type: array, items: { $ref: '#/components/schemas/FacetOption' } }
    ClinicSummary:
      type: object
      required: [id, name, code, ownerName, city, specialty, specialtyLabel, plan, planLabel, status, joinedAt, lastActiveAt, ipdState, hraOn, bedLimit]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        code: { type: [string, 'null'], description: The clinic web address (slug); null while setup is not finished. Shown as the mockup's clinic code (ADR-003 H14). }
        ownerName: { type: [string, 'null'], description: Name of the clinic owner (earliest active OWNER). }
        city: { type: [string, 'null'] }
        specialty: { oneOf: [{ $ref: '#/components/schemas/Specialty' }, { type: 'null' }] }
        specialtyLabel: { type: [string, 'null'] }
        plan: { $ref: '#/components/schemas/Plan' }
        planLabel: { type: string, examples: [Free year] }
        status: { $ref: '#/components/schemas/ClinicStatus' }
        joinedAt: { type: string, format: date-time }
        lastActiveAt: { type: [string, 'null'], format: date-time, description: 'Latest staff sign-in. The UI shows Today, Yesterday, "{n} days ago" or "—".' }
        ipdState: { $ref: '#/components/schemas/IpdState' }
        hraOn: { type: boolean }
        bedLimit: { type: integer, minimum: 5, maximum: 300 }
    ClinicPage:
      type: object
      required: [items, total, totalAll, page, size, facets]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ClinicSummary' } }
        total: { type: integer, minimum: 0, description: Organizations matching the search and filters. }
        totalAll: { type: integer, minimum: 0, description: 'All organizations on the platform (the page lead "{N} organizations").' }
        page: { type: integer, minimum: 0 }
        size: { type: integer }
        facets: { $ref: '#/components/schemas/ClinicFacets' }
    ClinicModules:
      type: object
      required: [ipdState, ipdTrialEndsAt, ipdRequestedAt, hraOn, bedLimit, admittedNow]
      properties:
        ipdState: { $ref: '#/components/schemas/IpdState' }
        ipdTrialEndsAt: { type: [string, 'null'], format: date-time, description: Set only while the stored state is trial. }
        ipdRequestedAt: { type: [string, 'null'], format: date-time, description: When the owner pressed Request IPD (SAH-19). Not shown in the mockup's admin view; provided for later use. }
        hraOn: { type: boolean }
        bedLimit: { type: integer, minimum: 5, maximum: 300, multipleOf: 5 }
        admittedNow: { type: integer, minimum: 0, description: 'Patients admitted now (count only). "{n} patients admitted now" or "No admissions".' }
    ClinicDetail:
      type: object
      required: [id, name, code, city, specialty, specialtyLabel, status, health, ownerName, ownerMobileLast5, joinedAt, lastActiveAt, plan, planLabel, setupComplete, modules]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        code: { type: [string, 'null'], description: 'Slug; the header shows "{code}.sahaj.in".' }
        city: { type: [string, 'null'] }
        specialty: { oneOf: [{ $ref: '#/components/schemas/Specialty' }, { type: 'null' }] }
        specialtyLabel: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ClinicStatus' }
        health: { $ref: '#/components/schemas/Health' }
        ownerName: { type: [string, 'null'] }
        ownerMobileLast5: { type: [string, 'null'], pattern: '^[0-9]{5}$', description: 'Only the last 5 digits, as the mockup header "mobile ••••• 00001". The full number is never returned.' }
        joinedAt: { type: string, format: date-time }
        lastActiveAt: { type: [string, 'null'], format: date-time }
        plan: { $ref: '#/components/schemas/Plan' }
        planLabel: { type: string }
        setupComplete: { type: boolean }
        modules: { $ref: '#/components/schemas/ClinicModules' }
    ModulesChange:
      type: object
      additionalProperties: false
      minProperties: 1
      description: At least one field. Unknown fields are refused (400).
      properties:
        ipdState: { $ref: '#/components/schemas/IpdState' }
        hraOn: { type: boolean }
        bedLimit: { type: integer, minimum: 5, maximum: 300, multipleOf: 5 }
    PlanChange:
      type: object
      additionalProperties: false
      required: [plan, reason]
      properties:
        plan: { $ref: '#/components/schemas/Plan' }
        reason: { type: string, minLength: 10, maxLength: 500, description: Trimmed before the length check. Saved in the admin audit log; never logged. }
        ticket: { type: [string, 'null'], maxLength: 20, pattern: '^[A-Za-z0-9-]{1,20}$', description: 'Optional support ticket, for example T-2304.' }
    ActivityEntry:
      type: object
      required: [id, at, adminName, action, reason, approval, outcome]
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        adminName: { type: string }
        adminRoleLabel: { type: string, examples: [Platform admin] }
        action: { type: string, examples: ['IPD set to On', 'HRA switched off', 'Bed limit set to 30', 'Plan changed to Pro'] }
        reason: { type: string, description: 'Reason as typed, plus " (ticket T-2304)" when a ticket was given; "Module entitlement" for module changes.' }
        approval: { type: string, examples: ['—'], description: 'Second admin / consent column. Always "—" in phase 1.' }
        outcome: { type: string, enum: [APPLIED, REFUSED] }
    DevSampleAdmin:
      type: object
      description: >-
        Dev-only (DEC-016, ADR-008). Returned once by POST /dev/sample-admin. Never logged, never stored in plain
        text, never returned again. The server's toString of this object prints no values.
      required: [adminId, email, fullName, password, secretKey, otpauthUri, accountName, issuer, digits, periodSeconds, algorithm, totpEnrolled, totpDevBypassOn, signInPath]
      properties:
        adminId: { type: string, format: uuid }
        email: { type: string, const: sample-admin@example.test, description: 'Fixed, not a real address. Type it as "Work email".' }
        fullName: { type: string, const: Sample admin }
        password:
          type: string
          format: password
          readOnly: true
          minLength: 24
          maxLength: 24
          pattern: '^[A-HJ-NP-Za-km-z2-9]{24}$'
          description: >-
            24 characters drawn with SecureRandom from A-Z without I and O, a-z without l, and 2-9 (about 140 bits).
            Meets the admin password policy (ADR-003 D2.1). Stored only as a BCrypt hash.
        secretKey:
          type: string
          readOnly: true
          pattern: '^[A-Z2-7]{4}( [A-Z2-7]{4}){7}$'
          examples: ['JBSW Y3DP EHPK 3PXP JBSW Y3DP EHPK 3PXP']
          description: Base32 of the 20-byte TOTP secret in groups of 4, for manual entry in an authenticator app.
        otpauthUri:
          type: string
          readOnly: true
          maxLength: 400
          examples: ['otpauth://totp/Sahaj%20admin:sample-admin%40example.test?secret=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP&issuer=Sahaj%20admin&algorithm=SHA1&digits=6&period=30']
          description: Same format as TotpEnrolment.otpauthUri (built by the same code).
        accountName: { type: string, const: sample-admin@example.test }
        issuer: { type: string, enum: [Sahaj admin] }
        digits: { type: integer, enum: [6] }
        periodSeconds: { type: integer, enum: [30] }
        algorithm: { type: string, enum: [SHA1] }
        totpEnrolled:
          type: boolean
          const: true
          description: The admin is created already enrolled; the first sign-in answers next TOTP, not ENROL. No recovery codes exist for it.
        totpDevBypassOn:
          type: boolean
          description: 'True when sahaj.admin.totp.dev-bypass is on: then any 6 digits are accepted as the code from this machine, and the secret is needed only to test real codes.'
        signInPath: { type: string, const: /admin/sign-in, description: The Angular sign-in route. }
    ActivityPage:
      type: object
      required: [items, total, page, size]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ActivityEntry' } }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 0 }
        size: { type: integer }
