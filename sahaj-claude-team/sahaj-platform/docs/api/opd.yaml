      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/AlertRules' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /emr/masters/{master}:
    parameters:
      - { name: master, in: path, required: true, schema: { $ref: '#/components/schemas/EmrSearchMaster' } }
    get:
      tags: [SAH-43]
      operationId: searchEmrMaster
      summary: Search the complaints, investigations or advice master
      description: >-
        SAH-43-1. Global, read-only masters (ADR-019 D3). Prefix match on the name, ignoring letter case; q is
        trimmed; an empty or all-space q returns the first page in master order. The characters % _ and \ are
        matched literally, never as wildcards. Order: with specialty, items whose hint equals it first; then the
        master's sort order; then name A to Z. Nothing is hidden by specialty. No match is 200 with an empty
        list. Diagnoses and medicines are searched with GET /diagnoses and GET /medicines (SAH-7, unchanged). The
        q text is never logged. 0.3.0: specialty is a starter department key (the EMR passes the record's
        starterKey); advice items carry nameMr and nameHi (null until translations are supplied; print falls back
        to English).
      x-required-role: any clinic role (OWNER, DOCTOR, VISITING_DOCTOR, NURSE, FRONT_DESK, BILLING, PHARMACIST, COUNSELLOR)
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 }, description: 'Over 100 characters answers 400 validation (field q, "Search text must be 100 characters or fewer.").' }
        - { name: specialty, in: query, required: false, schema: { $ref: '#/components/schemas/StarterKey' } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 500, default: 0 } }
      responses:
        '200':
          description: One page of 20
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmrMasterPage' }
              examples:
                complaints:
                  value:
                    items:
                      - { id: 3f0c2a52-6a8e-4c1b-9d43-2b7f0d5e9a11, name: Fever, specialtyHint: null }
                      - { id: 9b1d7c04-0e55-4f0a-8a6b-5c3e2d1f0b22, name: Fatigue, specialtyHint: null }
                    total: 2
                    page: 0
                    pageSize: 20
                empty:
                  value: { items: [], total: 0, page: 0, pageSize: 20 }
        '400': { $ref: '#/components/responses/Problem', description: 'bad-request (master not one of complaints, investigations, advice) or validation (q too long, page or specialty out of range).' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /emr/quick-options/{master}:
    parameters:
      - { name: master, in: path, required: true, schema: { $ref: '#/components/schemas/EmrMaster' } }
    get:
      tags: [SAH-43]
      operationId: listEmrQuickOptions
      summary: The signed-in doctor's quick-add items for one master, ranked by own use
      description: >-
        SAH-43-2 (ADR-019 D10). Always the caller's own ranking in this clinic: there is no doctor parameter and
        the server reads none (an added doctorMembershipId is ignored). Order: items this doctor used on signed
        visits, by use count (most first), then last used (newest first); then items never used, in the master's
        own order (with specialty, hint first; for medicines the SAH-7 order, clinic favourites first). Never
        empty while the master has items. Counts come only from the sign step (SAH-51) through an internal
        service; there is no operation that writes counts, and free-typed text is never counted or offered.
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 10 }, description: 'The chip row asks for 10.' }
        - { name: specialty, in: query, required: false, schema: { $ref: '#/components/schemas/StarterKey' }, description: 'Orders the never-used tail only; the EMR passes the record''s starterKey (0.3.0).' }
      responses:
        '200':
          description: At most limit items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmrQuickOptionList' }
              examples:
                diagnoses:
                  value:
                    master: diagnoses
                    items:
                      - { itemKey: J06.9, name: 'Acute upper respiratory infection, unspecified', icd10Code: J06.9, form: null, favourite: null, useCount: 5, lastUsedAt: '2026-11-10T06:05:00Z' }
                      - { itemKey: A09, name: 'Infectious gastroenteritis and colitis, unspecified', icd10Code: A09, form: null, favourite: null, useCount: 0, lastUsedAt: null }
        '400': { $ref: '#/components/responses/Problem', description: 'bad-request (unknown master) or validation (limit or specialty out of range).' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden (NURSE, FRONT_DESK, BILLING, PHARMACIST, COUNSELLOR) or doctor-details-missing (OWNER without doctor details).' }
  /emr/me:
    get:
      tags: [SAH-43, SAH-46]
      operationId: getEmrDoctorContext
      summary: The signed-in doctor's own details for the EMR and the department the EMR would choose
      description: >-
        SAH-43-3 and SAH-46-3 (ADR-019 D7, D9; ADR-020 D7). Name from the user; specialty, degree and registration
        number exactly as saved in Team and access (read through platform.api, no copy). missing lists the empty
        fields; nothing is blocked (OQ-43-11 default; the case paper prints "—"). department is the resolution
        rule: the doctor's specialty through the alias list, else the published departments the doctor is assigned
        to, else the clinic default (clinic specialty gp to gm, dental, paeds, homeo or none to gm). departments
        lists the published departments the doctor is assigned to (SAH-54-3). The Queue card shows "Open EMR" only
        when this answers 200 (SAH-46-1). Only the caller's own details; there is no operation to read another
        doctor's details for the EMR. Name and registration number are never logged.
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      responses:
        '200':
          description: Own details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmrDoctorContext' }
              examples:
                doctor:
                  value:
                    membershipId: 5d2b8f1e-2c47-4a90-b6d3-7e1f0a9c4b33
                    name: Dr Asha Kulkarni
                    role: DOCTOR
                    specialty: General Physician
                    degree: MBBS, MD
                    registrationNo: null
                    missing: [REGISTRATION_NO]
                    department: { departmentKey: gm, departmentName: General Medicine, starterKey: gm, layoutSource: PUBLISHED, versionNo: 6, choiceSource: DOCTOR_SPECIALTY }
                    departments: []
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden (not a doctor role) or doctor-details-missing (OWNER with no doctor details: "Add your doctor details in Team and access to write consultations.").' }
  /emr/library/sections:
    get:
      tags: [SAH-53]
      operationId: listEmrLibrarySections
      summary: The global section library (100 sections) with their fields
      description: >-
        SAH-53-1 (ADR-020 D3). Global reference data, the same for every clinic, changed by migration only: 14
        COMMON, 78 SPECIALTY, 8 COMPLIANCE sections, ordered COMMON, SPECIALTY, COMPLIANCE, then library order.
        Each field has its type and the derived valueKind the generic renderer uses. Field content is starter
        content, not clinically reviewed (OQ-43-8). No patient data. Any POST, PUT, PATCH or DELETE on
        /emr/library/** answers 403 forbidden for every role.
      x-required-role: any clinic role
      responses:
        '200':
          description: Every library section
          content: { application/json: { schema: { type: array, maxItems: 300, items: { $ref: '#/components/schemas/EmrLibrarySection' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /emr/library/sections/{sectionKey}:
    parameters:
      - { name: sectionKey, in: path, required: true, schema: { $ref: '#/components/schemas/SectionKey' } }
    get:
      tags: [SAH-53]
      operationId: getEmrLibrarySection
      summary: One library section
      description: 'SAH-53-1. A well-formed unknown key answers 404 section-not-found; a malformed key 400 bad-request.'
      x-required-role: any clinic role
      responses:
        '200': { description: The section, content: { application/json: { schema: { $ref: '#/components/schemas/EmrLibrarySection' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /emr/starter-departments:
    get:
      tags: [SAH-53, SAH-54]
      operationId: listEmrStarterDepartments
      summary: The 15 starter departments (wizard list "Specialty templates")
      description: >-
        SAH-53-1, SAH-54-1 (ADR-020 D4). Global, read-only, in the mockup order (General Medicine first). Each
        has initials, colour, the number of Specialty sections shown in the wizard (for example Physiotherapy 10,
        Dental 7), the wizard description (drawn only for Physiotherapy; null for the others) and the names of
        the sections turned off at start ("Turned off by default: …"). All 15 are offered (OQ-45-20). Write methods
        on /emr/starter-departments/** answer 403 forbidden.
      x-required-role: any clinic role
      responses:
        '200':
          description: Fifteen starters
          content: { application/json: { schema: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/EmrStarterSummary' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /emr/starter-departments/{starterKey}:
    parameters:
      - { name: starterKey, in: path, required: true, schema: { $ref: '#/components/schemas/DepartmentKey' } }
    get:
      tags: [SAH-53, SAH-54]
      operationId: getEmrStarterDepartment
      summary: One starter with its full starting layout (wizard preview)
      description: >-
        SAH-53-1, SAH-54-1. Every section of the starter (hidden ones too), in order, with its starting settings,
        lock and fields. A well-formed key that is not a starter (including the retired template keys gp and homeo)
        answers 404 starter-not-found, never an empty layout; a malformed key 400 bad-request.
      x-required-role: any clinic role
      responses:
        '200': { description: The starter, content: { application/json: { schema: { $ref: '#/components/schemas/EmrStarterDetail' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /emr/departments:
    get:
      tags: [SAH-45, SAH-53]
      operationId: listEmrDepartments
      summary: The clinic's departments (column "Departments" of EMR configuration by department)
      description: >-
        SAH-45-1 (ADR-020 D5). The 15 starter-backed departments (status TEMPLATE, version 0 until the clinic's first
        Save draft or Publish; OQ-45-11) and the departments the clinic added, starters in mockup order first, then
        added ones by name. Counts are of the department's working layout (saved draft, else what doctors see):
        sectionsOn and requiredOn count shown sections only (BR45-10). Search is done on the page (name start or any
        part, any case, or initials exactly). canEdit is true only for OWNER; every other clinic role reads. Another
        clinic's departments are never returned (RLS).
      x-required-role: any clinic role
      responses:
        '200':
          description: Departments
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmrDepartmentList' }
              examples:
                newClinic:
                  value:
                    canEdit: true
                    departments:
                      - { departmentKey: gm, name: General Medicine, initials: GM, colour: '#1D5FA8', starterKey: gm, sourceKind: STARTER, copiedFromKey: null, status: TEMPLATE, publishedVersion: 0, hasDraft: false, sectionsTotal: 19, sectionsOn: 17, requiredOn: 4, doctorCount: 0, rooms: [] }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [SAH-54]
      operationId: createEmrDepartment
      summary: Add a department (wizard confirm)
      description: >-
        SAH-54-1 to SAH-54-4 (ADR-020 D5, D6). Creates the department as status DRAFT with a draft equal to the
        chosen source: a starter's starting layout (kind STARTER), the blank layout (14 Common sections and ABHA /
        ABDM link, Consent forms, Prescription print format; kind BLANK), or a copy of one of the clinic's saved
        departments (its draft, else its latest version; not its history; kind COPY; the source must have status
        DRAFT or LIVE, else 404 department-not-found). copyPrintFlags false clears every Print flag ("Also create a
        matching print template" unticked; no separate print template is created, OQ-45-10). sections, when sent
        (step 2 Review sections), replaces the source settings and follows the draft rules (same section set,
        hidden never required, locks). doctorMembershipIds must be active DOCTOR or VISITING_DOCTOR members of this
        clinic (else 400 validation); rooms are text labels (OQ-45-19). name must be unique in the clinic ignoring
        case, counting the 15 starter names (400 department-name-taken, "A department with this name already
        exists."); two requests with the same name at the same moment: one 201, the other 400
        department-name-taken. At most 50 added departments (400 department-limit). Doctors do not see the
        department until it is published. One audit entry EMR_DEPARTMENT_CREATED (no patient data).
      x-required-role: OWNER
      x-required-permission: clinic.emr_setup.edit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmrDepartmentCreateInput' }
            examples:
              secondDentalChair:
                value: { name: Dental chair 2, source: { kind: COPY, copyFromDepartmentKey: dental }, copyPrintFlags: true, doctorMembershipIds: [5d2b8f1e-2c47-4a90-b6d3-7e1f0a9c4b33], rooms: [Chair 2] }
              physioFromStarter:
                value: { name: Physiotherapy annexe, source: { kind: STARTER, starterKey: physio }, copyPrintFlags: true, doctorMembershipIds: [], rooms: [] }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/EmrDepartmentView' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation, department-name-taken, department-limit, section-set-mismatch, hidden-section-required, section-not-hideable.' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem', description: 'starter-not-found, department-not-found (copy source) or section-not-found.' }
        '413': { $ref: '#/components/responses/Problem' }
  /emr/departments/{departmentKey}:
    parameters:
      - { name: departmentKey, in: path, required: true, schema: { $ref: '#/components/schemas/DepartmentKey' } }
    get:
      tags: [SAH-45, SAH-53]
      operationId: getEmrDepartment
      summary: One department for the configurator (columns Sections and Section settings)
      description: >-
        SAH-45-2 to SAH-45-6, SAH-53-2 (ADR-020 D6). Every section of the department, hidden ones too, in the working
        order (saved draft, else the latest published version, else the starter layout: layoutSource), with the six
        settings, part, lock and the read-only field list. revision is sent back with Save draft and Publish. This
        working layout is also the baseline of the page's "n unsaved change(s)" count (OQ-45-15). A well-formed
        key that is not one of this clinic's departments or a starter answers 404 department-not-found (also for
        another clinic's key).
      x-required-role: any clinic role
      responses:
        '200': { description: The department, content: { application/json: { schema: { $ref: '#/components/schemas/EmrDepartmentView' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /emr/departments/{departmentKey}/draft:
    parameters:
      - { name: departmentKey, in: path, required: true, schema: { $ref: '#/components/schemas/DepartmentKey' } }
    put:
      tags: [SAH-45, SAH-53]
      operationId: saveEmrDepartmentDraft
      summary: Save draft ("Draft saved. Doctors still see the published layout.")
      description: >-
        SAH-53-2, SAH-53-3, SAH-53-4, SAH-45-4, SAH-45-5 (ADR-020 D6). The whole working layout replaces the draft,
        all or nothing. Rules: the section keys must be exactly the department's (unknown key 404 section-not-found;
        missing or repeated key 400 section-set-mismatch); shown false with required true answers 400
        hidden-section-required ("A hidden section cannot be required."); hiding Allergies, or PCPNDT Form F in a
        department started from Obstetrics & Gynaecology, answers 400 section-not-hideable ("<name> cannot be
        hidden."); only part, shown, required, print, copy, collapsed and whoCanFill per section are accepted (a
        label, kind, description or field answers 400 validation). revision must equal the current revision, else
        409 emr-setup-changed ("Someone else changed this department. Reload and try again."). Equal to the current
        draft (or, with no draft, to what doctors see): 200 outcome NOTHING_NEW ("Nothing new to save"), nothing
        written, no audit. Otherwise outcome SAVED, revision + 1, status DRAFT for a never-published department (the
        first save of a TEMPLATE department creates it), doctors still see the published layout, one audit entry
        EMR_DEPARTMENT_DRAFT_SAVED, or EMR_DEPARTMENT_RESET when origin is RESET (Reset to template is a page
        action; Undo restores the page's previous working copy and needs no call).
      x-required-role: OWNER
      x-required-permission: clinic.emr_setup.edit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmrLayoutSettingsInput' }
      responses:
        '200': { description: Saved or nothing new, content: { application/json: { schema: { $ref: '#/components/schemas/EmrDraftSaveResult' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'bad-request, validation, section-set-mismatch, hidden-section-required, section-not-hideable.' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem', description: 'department-not-found or section-not-found.' }
        '409': { $ref: '#/components/responses/Problem', description: emr-setup-changed }
        '413': { $ref: '#/components/responses/Problem' }
  /emr/departments/{departmentKey}/publish:
    parameters:
      - { name: departmentKey, in: path, required: true, schema: { $ref: '#/components/schemas/DepartmentKey' } }
    post:
      tags: [SAH-45, SAH-53]
      operationId: publishEmrDepartment
      summary: Publish changes as the next version of the department
      description: >-
        SAH-53-3, SAH-45-4 (ADR-020 D6). Body: the working layout on screen and the revision (unsaved changes are
        published in the same call). Same validation as Save draft. Under the department row lock: with no saved
        draft and a body equal to what doctors see, 200 outcome NOTHING_TO_PUBLISH ("Nothing to publish"), nothing
        written. Otherwise a new immutable version publishedVersion + 1 (v1 for a department never published) with
        a copy of each section's definition, status LIVE, draft cleared, revision + 1, one audit entry
        EMR_DEPARTMENT_PUBLISHED; the page says "<department> published as v<n>. New visits use it from now." Records
        already opened keep their layout (SAH-46-3). Two publishes at once make one version (the second answers 409
        emr-setup-changed). No approval step (OQ-45-13).
      x-required-role: OWNER
      x-required-permission: clinic.emr_setup.edit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmrLayoutSettingsInput' }
      responses:
        '200': { description: Published or nothing to publish, content: { application/json: { schema: { $ref: '#/components/schemas/EmrPublishResult' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'bad-request, validation, section-set-mismatch, hidden-section-required, section-not-hideable.' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem', description: 'department-not-found or section-not-found.' }
        '409': { $ref: '#/components/responses/Problem', description: emr-setup-changed }
        '413': { $ref: '#/components/responses/Problem' }
  /emr/departments/{departmentKey}/reset-target:
    parameters:
      - { name: departmentKey, in: path, required: true, schema: { $ref: '#/components/schemas/DepartmentKey' } }
    get:
      tags: [SAH-45, SAH-53]
      operationId: getEmrDepartmentResetTarget
      summary: The settings "Reset to template" puts on the page
      description: >-
        SAH-53-4, SAH-45-5 (ADR-020 D6). The starting settings of the department's starter (sourceKind STARTER or a
        COPY of one) or of the blank layout (BLANK), for exactly this department's sections and in starter order.
        Reading writes nothing; the page applies it as unsaved changes and keeps its previous working copy for Undo
        until the page is left or the next change. The save that follows sends origin RESET.
      x-required-role: any clinic role
      responses:
        '200': { description: Reset target, content: { application/json: { schema: { $ref: '#/components/schemas/EmrResetTarget' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /emr/departments/{departmentKey}/layout:
    parameters:
      - { name: departmentKey, in: path, required: true, schema: { $ref: '#/components/schemas/DepartmentKey' } }
    get:
      tags: [SAH-53]
      operationId: getEmrDepartmentPublishedLayout
      summary: What doctors see for this department
      description: >-
        SAH-53-5 (ADR-020 D6). Only shown sections of the latest published version, in order, with the settings and
        fields; with no published version, the starter layout (layoutSource STARTER, "Using the starter layout").
        Never the draft. An added department never published answers 404 department-not-published. Holds no
        patient data; any clinic role may read it (it is not how the EMR opens: that is POST /emr/records/open).
      x-required-role: any clinic role
      responses:
        '200': { description: Published layout, content: { application/json: { schema: { $ref: '#/components/schemas/EmrPublishedLayout' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem', description: 'department-not-found or department-not-published.' }
  /emr/departments/{departmentKey}/versions/{versionNo}:
    parameters:
      - { name: departmentKey, in: path, required: true, schema: { $ref: '#/components/schemas/DepartmentKey' } }
      - { name: versionNo, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 100000 } }
    get:
      tags: [SAH-53]
      operationId: getEmrDepartmentVersion
      summary: One published version exactly as it was published
      description: 'SAH-53-3, SAH-53-5. Every section, hidden ones too. Versions never change. Unknown number: 404 version-not-found.'
      x-required-role: any clinic role
      responses:
        '200': { description: The version, content: { application/json: { schema: { $ref: '#/components/schemas/EmrDepartmentVersion' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem', description: 'department-not-found or version-not-found.' }
  /emr/department-doctor-options:
    get:
      tags: [SAH-54]
      operationId: listEmrDepartmentDoctorOptions
      summary: Doctors who can be assigned to a department (wizard step 3)
      description: >-
        SAH-54-3. Active DOCTOR and VISITING_DOCTOR members of this clinic, by name, with the degree as saved in Team
        and access (read through platform.api, no copy). Nurses, front desk, billing, pharmacists, counsellors and
        owners are not offered. Names are never logged.
      x-required-role: OWNER
      x-required-permission: clinic.emr_setup.edit
      responses:
        '200':
          description: Doctors
          content: { application/json: { schema: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/EmrDoctorOption' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /emr/records/open:
    post:
      tags: [SAH-46, SAH-52]
      operationId: openEmrRecord
      summary: Open EMR from a Queue card (OPD visit, IPD admission, Emergency case)
      description: >-
        SAH-46-1 to SAH-46-4, SAH-52-1 (ADR-020 D7 to D10). Idempotent: finds or creates the encounter's record
        (OPD: one per visit; IPD: one per admission per Asia/Kolkata day, the default of OQ-43-27; Emergency: one per
        case). On creation: department chosen by doctor specialty, then the doctor's published departments, then the
        clinic default; the layout reference (snapshot) is stored; Copy-from-last-visit sections are pre-filled from
        the patient's last signed record of the same department. OPD: DOCTOR and VISITING_DOCTOR only their own
        visits (403 not-own-patient), OWNER with doctor details any; a WAITING or VITALS visit moves to WITH_DOCTOR
        through the existing workflow (stageOutcome); a repeat changes nothing. IPD and Emergency: IPD must be TRIAL
        or ON (OFF 403 module-off; READ_ONLY opens an existing record read-only, none 409 ipd-read-only); the IPD
        ward scope and break-glass rules apply (403 outside-scope; VISITING_DOCTOR 403 forbidden as on every IPD
        endpoint); no OPD stage changes. A discharged admission or closed case opens an existing record read-only,
        none 409 encounter-closed. A SIGNED record opens read-only. Another clinic's id: 404 encounter-not-found.
        Every open writes one audit entry EMR_RECORD_OPENED (ids only). 201 when created, 200 when found.
        0.6.0 (ADR-025 D4, D8, D13): a writable DRAFT record takes the caller's edit hold when it is free, expired or
        the caller's; held by another doctor, the record opens read-only (readOnlyReason HELD_BY_OTHER, editHold).
        The patient's allergy and chronic texts are fingerprinted at the first open for the write-back check. An
        IPD_ROUND record copies from the previous signed round record of the same admission.
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmrOpenInput' }
            examples:
              opd: { value: { encounterType: OPD_VISIT, encounterId: 7c1e2d3f-4a5b-4c6d-8e9f-0a1b2c3d4e5f } }
              ipd: { value: { encounterType: IPD_ROUND, encounterId: 2a9d6f1c-0a10-4b7d-8b9e-0b7d7d3e3d5c } }
      responses:
        '200': { description: Existing record, content: { application/json: { schema: { $ref: '#/components/schemas/EmrOpenResult' } } } }
        '201': { description: Record created, content: { application/json: { schema: { $ref: '#/components/schemas/EmrOpenResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden, doctor-details-missing, not-own-patient, outside-scope or module-off.' }
        '404': { $ref: '#/components/responses/Problem', description: encounter-not-found }
        '409': { $ref: '#/components/responses/Problem', description: 'encounter-closed or ipd-read-only.' }
  /emr/records/{recordId}:
    parameters:
      - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [SAH-46, SAH-47, SAH-52]
      operationId: getEmrRecord
      summary: The EMR frame for one record (header, parts, sections, values, still needed)
      description: >-
        SAH-46-3, SAH-47-1 to SAH-47-6, SAH-52-1 (ADR-020 D8, D14). The same access rules as open (own patient for
        OPD, IPD scope for IPD and ER; NURSE, FRONT_DESK, BILLING, PHARMACIST, COUNSELLOR 403); no audit for a plain
        read. layout lists only the sections shown in the record's snapshot, in order; later publishes, resets or
        setting changes never alter it. Done, part badges and stillNeeded are computed by the server from the
        snapshot (OQ-45-25, OQ-45-26). Patient name, allergy and chronic text are for the screen only and never
        logged. The "ABHA linked" tag is not returned (waits for DEC-040).
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      responses:
        '200': { description: The record, content: { application/json: { schema: { $ref: '#/components/schemas/EmrRecordView' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden, doctor-details-missing, not-own-patient or outside-scope.' }
        '404': { $ref: '#/components/responses/Problem', description: record-not-found }
  /emr/records/{recordId}/draft:
    parameters:
      - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [SAH-47]
      operationId: saveEmrRecordDraft
      summary: Save draft of the EMR ("Draft saved")
      description: >-
        SAH-47-3, SAH-47-5 (ADR-020 D3, D8). Sends the UI position and only the sections changed since the last save,
        each with all its values; other stored sections stay as they are (also sections not in the current layout).
        No required check (Save draft never validates completeness). Each value must match its field's valueKind and
        limits (400 validation with fieldErrors named sections[i].values.<fieldKey>; a value for a DISPLAY_ONLY or
        LATER field, an unknown field or a section not in the record's layout is 400 validation). confirmCopy true
        confirms copied values. revision must equal the record's, else 409 emr-record-changed ("This EMR was changed
        elsewhere. Reload to see the latest."). A SIGNED record: 409 emr-record-signed. An IPD_ROUND or ER_ASSESSMENT
        record: 409 encounter-drafts-not-enabled until the human confirms OQ-43-27 (SAH-46-4). One audit entry
        EMR_RECORD_DRAFT_SAVED with the section keys only. Body at most 64 KB, one section's values at most 32 KB.
        0.4.0 (ADR-022 D2 to D8, D11): a COMPONENT field takes its component value (EmrListValue, EmrPrescriptionValue,
        EmrBodyMapValue); a COVERED field must not be sent (400 validation); a form section (key f_...) takes values
        keyed by form field key, validated against the form version in the record's form_refs (values of fields
        hidden by show-if are dropped; LATER and display-only types store nothing; a NUMBER outside min and max is 400
        "Outside <min>–<max>"). Item, row and pin ids are made by the client and are the idempotency key; addedAt,
        addedByMembershipId, recordedAt, recordedByMembershipId and reviewedAt are stamped by the server on the first
        save that contains the id. A duplicate list item or medicine (same text, ignoring case) is 400 duplicate-item;
        advice sendBy other than PRINT is 400 needs-whatsapp-service (DEC-040). Body map: pin numbers are never reused
        (nextPinNo); a cause ROAD_ACCIDENT, ASSAULT or BURN on a new or changed pin sets mlc true (tagged L-1); each
        mlc change writes one audit EMR_MLC_FLAG_CHANGED (pin number and on or off only). A prescription row with
        allergyReview.confirmed true for an active alert writes one audit EMR_ALLERGY_ALERT_REVIEWED (medicine key and
        allergy class only); a change in the visit's allergy classes clears every review. 0.6.3 (DEC-051 D1): that
        includes a review sent in the same save as the change (for example with the visit's first allergy class). It
        is cleared, and no EMR_ALLERGY_ALERT_REVIEWED is written for it. The alert comes back and the doctor confirms
        it in a later save. OPD_VISIT records only: when
        the procedures section is saved, the visit bill's EMR lines are made equal to the active items with billing
        BILL_TODAY in the same transaction (one line per item id; counter lines untouched); removing or changing the
        qty of an EMR line on a bill that has a payment answers 409 already-billed and nothing of the save is applied.
        Usage ranking is not written.
        0.5.0 (ADR-023 D2 to D6): a section whose layout entry has specialtyEditor takes values {"specialty":
        EmrSpecialtyValue} (the component must equal specialtyEditor.component; library field keys of that section are
        COVERED, 400 validation). screen sets the visit mode (og ANC or GYNAE; physio FIRST_VISIT or SESSION) and the
        Oncology decision: the server computes the suggestion from the stored values; a choice that differs without a
        reasonKey is 400 decision-reason-required ("Pick a reason (saved with the note)."); one audit
        EMR_ONC_DECISION_RECORDED (keys only). A prescription row with calculation is recomputed by the server
        (paediatric dose by weight, tagged C-5); a mismatch is 400 dose-calculation-mismatch. Dental estimate:
        signEstimate true stamps the signature (audit EMR_ESTIMATE_SIGNED with the total in paise); a later change of
        the plan's rows, teeth, procedures or amounts clears it (audit EMR_ESTIMATE_SIGN_CLEARED). Consent and Form F
        ticks write EMR_CONSENT_RECORDED (counts) and EMR_FORM_F_MARKED (ids). A save that changes anything the
        chemotherapy order's fingerprint covers (labs, weight, height, decision …) recomputes the order and clears a
        confirmed second check (audit CHEMO_SECOND_CHECK_CLEARED). A lab work due date before today is 400 validation
        on dueDate. A vaccine given in an earlier record cannot be marked or unmarked here (400 validation).
        0.6.0 (ADR-025 D4, D5, D6, D8, D12): (1) IPD_ROUND and ER_ASSESSMENT drafts are on (OQ-43-27 answered);
        encounter-drafts-not-enabled is no longer answered. (2) Edit hold: a save by a doctor while another doctor's
        hold has not expired is 409 emr-record-held (holderName); otherwise the save takes or renews the caller's hold
        for 120 seconds. (3) saveKind AUTO (the 30-second tick and the part switch) writes no EMR_RECORD_DRAFT_SAVED
        audit; MANUAL ("Save draft", the default) writes it as before; the safety audits above are written for both.
        (4) OPD_VISIT records: the followup section's next_visit field is the FOLLOW_UP component (EmrFollowUpValue);
        its reason field is COVERED. (5) IPD_ROUND records: the rx section's drug field is the IPD_ORDERS component
        (EmrIpdOrdersValue; keys from GET /emr/records/{recordId}/ipd-order-options, else 400 validation); orderId and
        orderedAt are stamped at sign and a row with an orderId cannot be changed or removed (400 validation); a form
        MEDICINE_LIST field stores nothing on IPD_ROUND records. (6) A section may carry prefill (vitals pre-fill from
        the nursing chart); the server keeps prefilledFrom only while the values equal the source entry.
      x-required-permission: clinic.consultation.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmrRecordDraftInput' }
            examples:
              complaints:
                value:
                  revision: 3
                  uiState: { part: ASSESSMENT, sectionKey: complaints }
                  sections:
                    - key: complaints
                      values:
                        complaint: [{ itemKey: 3f0c2a52-6a8e-4c1b-9d43-2b7f0d5e9a11, text: Fever, newToList: false }]
                        duration: { value: 3, unit: days }
                        severity: moderate
      responses:
        '200': { description: Saved; the record with new revision and computed Done state, content: { application/json: { schema: { $ref: '#/components/schemas/EmrRecordView' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation; 0.4.0 also duplicate-item and needs-whatsapp-service; 0.5.0 also decision-reason-required and dose-calculation-mismatch.' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden, doctor-details-missing, not-own-patient or outside-scope.' }
        '404': { $ref: '#/components/responses/Problem', description: record-not-found }
        '409': { $ref: '#/components/responses/Problem', description: 'emr-record-changed, emr-record-signed, already-billed (0.4.0) or emr-record-held (0.6.0). encounter-drafts-not-enabled is no longer answered (0.6.0). 0.6.2 lists two answers the save already gives: encounter-closed (the admission discharged or the Emergency case closed) and ipd-read-only (IPD_ROUND or ER_ASSESSMENT record while IPD is Read-only).' }
        '413': { $ref: '#/components/responses/Problem' }
  /emr/records/{recordId}/department:
    parameters:
      - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [SAH-46]
      operationId: switchEmrRecordDepartment
