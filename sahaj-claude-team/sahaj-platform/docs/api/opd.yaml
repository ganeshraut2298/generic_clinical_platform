  /diagnoses:
    get:
      tags: [SAH-7]
      description: >-
        Global read-only ICD-10 list. Matches the start of the name or of the code, at most 20 per answer (SAH-7,
        unchanged). SAH-43 (0.2.0) adds two optional parameters; without them the answer is exactly as before.
        specialty puts diagnoses whose specialty hint equals it first and hides nothing. page asks for the next
        20 in the same order; a client stops when it gets fewer than 20.
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: specialty, in: query, required: false, description: 'SAH-43-1, 0.3.0 (ADR-020 D13). A starter department key; the server maps it to the diagnosis specialty hint (gm to gp, og to gynae, derm to derma, ayush to ayur; dental, paeds, physio as they are; other keys give no hint ordering). Hint first; never a filter.', schema: { $ref: '#/components/schemas/StarterKey' } }
        - { name: page, in: query, required: false, description: 'SAH-43-1. 0-based page of 20.', schema: { type: integer, minimum: 0, maximum: 500, default: 0 } }
      responses:
        '200':
          description: Matches
          content:
            application/json:
              schema:
                type: array
                items: { type: object, required: [code, name], properties: { code: { type: string }, name: { type: string }, specialty: { type: string } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation: specialty not one of the 15 starter department keys, or page outside 0 to 500 (SAH-43).' }
  /case-paper-settings:
    get:
