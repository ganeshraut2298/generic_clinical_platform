openapi: 3.1.0
info:
  title: Sahaj OPD API
  version: 0.7.1
  description: >-
    Phase 1 contract, SAH-7 (and SAH-9, SAH-11, SAH-12, SAH-14, SAH-15, SAH-18 as tagged). Reads are for any logged-in
    clinic user; writes are owner only (403 otherwise) unless an operation says otherwise. Errors are RFC 9457
    application/problem+json; the type is https://sahaj.in/problems/<slug> and slugs are written below without the
    prefix. The tenant always comes from the logged-in user, never from a body, query, path or header; a clinic id
    sent in a body is ignored.

    0.2.0 (11 Nov 2026) adds SAH-43 and SAH-44, the Doctor EMR masters and specialty templates (ADR-019), under
    /emr/**, and two optional query parameters on GET /diagnoses (specialty, page). Nothing that existed changes
    meaning. Rules for every /emr/** operation: no or expired session answers 401 (unauthorized); a role outside
    the operation's x-required-role answers 403 (forbidden); a write method (POST, PUT, PATCH, DELETE) on the
    read-only paths /emr/masters/**, /emr/quick-options/**, /emr/templates and /emr/templates/{templateKey}
    answers 403 (forbidden), not 405, for every role including the owner, because masters and templates are global
    and change by migration only; a body over 64 KB answers 413 (payload-too-large); request bodies are closed
    (an unknown field answers 400 validation). Problem types used by /emr/**: unauthorized, forbidden,
    doctor-details-missing (403: an owner with no doctor details asks for a doctor-only call), bad-request,
    validation (400 with fieldErrors), hidden-section-required (400), section-not-hideable (400),
    template-not-found (404), section-not-found (404), emr-setup-changed (409: stale revision or version),
    payload-too-large (413). x-required-permission names the ADR-019 D8 capability: clinic.consultation.write
    (DOCTOR or VISITING_DOCTOR, or OWNER with doctor details) and clinic.emr_setup.edit (OWNER); they are fixed in
    code, not cells of the "Who can do what" grid. No /emr/** answer or log line contains patient data; search
    text is never logged. Starter master and template content is not clinically reviewed (OQ-43-8).

    0.3.0 (12 Nov 2026) replaces the withdrawn SAH-44 part (DEC-039 answer 2, Variant B; ADR-020 supersedes ADR-019
    D4, D5, D6, D11). REMOVED, no compatibility kept: /emr/templates, /emr/templates/{templateKey},
    /emr/templates/{templateKey}/sections/{sectionKey}/override, /emr/templates/{templateKey}/reset, /emr/settings and
    their schemas (they now answer 404 like any unknown path). ADDED for SAH-53, SAH-45, SAH-54 (configuration),
    SAH-46, SAH-47, SAH-52 (EMR record): /emr/library/**, /emr/starter-departments/**, /emr/departments/**,
    /emr/department-doctor-options, /emr/records/**, PATCH /visits/{id}/visit-type; Visit gains emrRecordId and
    emrStatus and the visit type REVISIT. CHANGED for SAH-43 (ADR-020 D13): the specialty query parameter and
    specialtyHint now take one of the 15 starter department keys (StarterKey) instead of gp, dental, paeds, homeo;
    advice items gain nameMr and nameHi; GET /emr/me returns the department choice instead of the template choice.
    Extra rules for 0.3.0: write methods on /emr/library/** and /emr/starter-departments/** answer 403 forbidden for
    every role (global data). Request bodies stay closed (an unknown field answers 400 validation), except that a
    field named tenantId or clinicId is accepted and ignored (stories SAH-53-2, SAH-54-4: the clinic is always the
    signed-in user's). New problem types: section-set-mismatch (400), department-name-taken (400), department-limit
    (400), visit-type-not-available (400), not-applicable (400), not-own-patient (403), outside-scope (403, IPD
    ward scope, ADR-017), module-off (403, IPD off), starter-not-found, department-not-found,
    department-not-published, version-not-found, record-not-found, encounter-not-found (404),
    emr-record-changed, emr-record-signed, encounter-closed, ipd-read-only, encounter-drafts-not-enabled (409).
    emr-setup-changed (409) now means a stale department revision. Clinical values, patient names, referral text and
    typed field values never appear in a log line or an audit value. Rules marked "tagged" are values from the EMR
    mockup, accepted by the human in DEC-039, not clinically reviewed.

    0.4.0 (12 Nov 2026) adds EMR phase 3 (ADR-022): SAH-56 EMR list, SAH-48 prescription, services and the drug-class
    allergy check, SAH-57 body map, SAH-50 patient history, SAH-55 live case paper context, SAH-58 treatment course
    plan, SAH-59 form builder. Additive only: nothing that existed changes meaning, except that EmrValueKind gains
    COMPONENT and COVERED (fields bound to a shared component, ADR-022 D2), EmrLayoutSection.source gains FORM, and
    the record view gains allergyAlerts, completeBlockers, lastSignedPrescription, printPreferences,
    prescriptionIsOrder and header.mlc. Component values (EMR list items, prescription rows, body map pins) and form
    values are written by the existing PUT /emr/records/{recordId}/draft; server-stamped properties (addedAt,
    addedByMembershipId, recordedAt, recordedByMembershipId, reviewedAt, code) sent by a client are ignored. Usage
    ranking is still written only by the sign step (SAH-51); nothing in 0.4.0 writes it. Course money (payments,
    receipts, credit) is in docs/api/billing.yaml 0.2.0 under /api/v1/billing/courses/**. Nothing in 0.4.0 sends on
    WhatsApp, shares to ABHA or makes a PDF (ADR-021 waits for the human). New problem types: duplicate-item (400),
    needs-whatsapp-service (400), form-invalid (400), form-not-publishable (400, fieldErrors), form-limit (400),
    section-not-in-layout (409), already-billed (409, "Already billed. Ask billing to adjust."), form-changed (409),
    form-state (409), course-changed (409), sitting-done (409), sitting-not-available (409), visit-already-linked
    (409), idempotency-conflict (409), past-visit-not-found, form-not-found, form-starter-not-found, version-not-found,
    course-not-found, sitting-not-found (404). x-required-permission adds clinic.emr_forms.edit and
    clinic.emr_forms.approve (OWNER; "Medical director" in the mockup means the owner, OQ-45-13), fixed in code.

    0.5.0 (12 Nov 2026) adds EMR phase 4 (ADR-023): specialty screens SAH-49 and SAH-69 Dental, SAH-60 General
    Medicine, SAH-61 Obstetrics & Gynaecology, SAH-62 Paediatrics, SAH-63 Physiotherapy, SAH-64 and SAH-71 General
    Surgery, SAH-65 Oncology assessment and decision, SAH-66 and SAH-70 Oncology order sheet with the independent
    second check. Additive only. A specialty profile is chosen by the record snapshot's starterKey (gm, dental, og,
    paeds, physio, onco, surgery) on OPD_VISIT records; any other starter, no starter, IPD_ROUND and ER_ASSESSMENT use
    the generic renderer as before. A section with a specialty editor in the record's profile carries
    EmrLayoutSection.specialtyEditor; its value is an EmrSpecialtyValue stored under the reserved field key
    "specialty" and written by the existing PUT /emr/records/{recordId}/draft; its library fields return valueKind
    COVERED. Screen facts (visit mode, Oncology decision) are written by the draft save's new "screen" object. The
    record view gains specialty (server-computed results: the server's answer wins), stillNeededItems and
    EmrRecordSection.legacyValues. EmrRxFrequency gains 0-1-0; EmrPrescriptionRow gains doseText, frequencyText,
    note and calculation (frequency may be null when frequencyText is set). TreatmentCourseCreateInput gains fromPlan.
    New paths: /emr/specialty-reference/{profile}, /emr/records/{recordId}/specialty-history,
    /emr/records/{recordId}/surgery-booking, /emr/records/{recordId}/chemo-order/**, /emr/chemo-checks/**,
    /emr/visit-templates. Rule values are tagged "value from the EMR mockup, accepted by the human in DEC-039, not
    clinically reviewed" (C-1 to C-10, L-2, L-3, L-5, B-1 to B-3). Nothing in 0.5.0 signs a record, adds a bill line,
    books an appointment, sends to a pharmacy, lab, insurer or WhatsApp, or creates an IPD admission: those are SAH-51,
    SAH-67 and DEC-040 (ADR-023 D9). New problem types: decision-reason-required (400), dose-calculation-mismatch
    (400), not-named-checker (403), checker-is-prescriber (403), booking-not-ready (409), checks-failing (409),
    second-check-not-confirmed (409, "The second check is not confirmed yet."), chemo-order-changed (409),
    chemo-order-sent (409), order-not-found, visit-template-not-found (404). The colleague PIN answers of
    docs/api/platform.yaml are reused unchanged (wrong-pin, pin-locked, pin-not-set, rate-limit, colleague-pin-limit,
    pin-check-failed, pin-unavailable).

    0.5.1 (12 Nov 2026, ADR-023 D13) is additive and adds no path. (1) EmrSpecialtyReference.lists has a closed set
    of list names per profile and a stated item key format; EmrReferenceItem gains note, defaultOn, defaults and
    medicine. (2) Mockup items 0.5.0 left out: SpOncExam.systems.bone ("Spine and bones"; ONC_EXAM Done now counts five
    systems), SpChemoPlan.takeHome LOPERAMIDE_2, SpChemoPlan.referrals has the eight drawn referrals,
    SpExamGeneral.systems.general ("General"), and the Physiotherapy component OUTCOME_SCALES on section func_scales
    (SpOutcomeScales; view physio.outcomeScales for "WOMAC 48 → 41"); view onco.pegfilgrastimSuggested. (3)
    EmrSpecialtyView.hiddenSectionKeys: sections hidden by the visit mode are never listed in stillNeededItems or
    stillNeeded and never block readyToComplete (pcpndt stays while Form F is required, ADR-023 H21). (4) Growth notes
    are sent for weight only; never for length or head circumference (DEC-044, ADR-023 H8). The "Second checks" menu key
    secondchecks is in docs/api/platform.yaml 0.1.1.

    0.5.2 (13 Nov 2026, ADR-023 D14) clarifies three rules and adds no path or field. (1) GET /emr/chemo-checks is
    oldest named first (namedAt ascending, then orderId), not newest first. (2) The chemo order fingerprint covers
    every doctor input of the order (allergy confirmation, new consent, scheme, pre-medicines not given, earlier
    outside doxorubicin included), every computed value, every check's pass or fail and the named checker; a change
    of any of them clears a confirmed second check even when every check still passes. (3) SpPreopOrders.blood is
    the enum NOT_NEEDED, GROUP_AND_SAVE, ONE_UNIT_RESERVED or null (the reference surgeryBlood keys); another value
    is 400 validation.

    0.5.3 (13 Nov 2026, SAH-73, ADR-024) is additive and adds no path. The patient's age comes from patient.api
    (docs/api/patient.yaml 0.2.0): every integer age in this contract (Visit, queue, appointments, EmrRecordHeader,
    case paper, chemo views) is the effective completed years, worked out from the date of birth as of today in India
    (Asia/Kolkata) when one is recorded, else the stored whole number. (1) New AgeDetail (same shape as in
    patient.yaml) on EmrRecordHeader and EmrCasePaperContext.patient; the client uses it for the Paediatrics header
    ("18 months · Boy") and the Paediatrics case paper meta; other departments keep age as before. (2)
    EmrSpecialtyView.paeds gains dateOfBirthRecorded (false shows "Date of birth not recorded. Add it in Patients to
    see due vaccines and the child's age.") and dateOfBirth (the vaccination card only); ageMonths and ageDays are
    stated. (3) EmrSpecialtyHistory.growthPoints[].ageMonths is nullable (null without a date of birth; the point is
    not plotted). (4) dental.childTabDefault uses the effective age: under 13 from the date of birth when recorded,
    else from the whole-number age. The date of birth appears in no other answer of this contract and is never
    logged, audited or put in a problem detail.

    0.6.0 (13 Nov 2026, EMR phase 5, ADR-025) adds the finish of every encounter: SAH-51 (OPD finish, sign,
    autosave, one editor, addendum, follow-up, reprint), SAH-67 (IPD round and Emergency finish, admission request,
    Emergency visit type with triage) and SAH-68-1 to 68-3 (vitals read, bill lines and follow-ups, patient record
    write-back). Additive: nothing that existed changes meaning, except (1) PUT /emr/records/{recordId}/draft no
    longer answers encounter-drafts-not-enabled (OQ-43-27 answered: IPD and Emergency drafts are on), takes and renews
    the edit hold and accepts saveKind (AUTO writes no EMR_RECORD_DRAFT_SAVED audit); (2) PATCH
    /visits/{id}/visit-type accepts EMERGENCY with a triage level and recomputes the fee while the bill has no
    payment; (3) EmrRecordView.prescriptionIsOrder is true on IPD_ROUND records, whose Prescription field is the new
    component IPD_ORDERS (ipd's catalogue, placed through ipd's SAH-31 path at sign); (4) the follow-up section of an
    OPD_VISIT record is the new component FOLLOW_UP. New paths: /emr/records/{recordId}/finish-check, /sign,
    /edit-hold, /addenda, /encounter-vitals, /ipd-order-options, /admission-prefill, /admission-request,
    /free-slots, /emr/triage-levels and GET /visits/{visitId}/prescription-print. A signed record is immutable
    (application and database); corrections are addenda. The sign is one transaction: a refusal anywhere leaves the
    record unsigned and nothing else written. New problem types: emr-not-ready (409, blockers), emr-record-held (409,
    holderName), emr-record-not-signed (409), workflow-move-refused (409), ipd-order-not-placed (409, rows),
    case-closed (409), opd-doctor-not-available (409), already-admitted (409), addendum-limit (400),
    patient-not-found (404), plus the existing idempotency-conflict,
    already-billed, emr-record-signed, emr-record-changed, encounter-closed and needs-whatsapp-service. Nothing is sent
    on WhatsApp or shared to ABHA (DEC-040 waits for the human's module edits); the sign body's share flag answers 400
    needs-whatsapp-service when true. No problem detail, log line or audit value holds a patient name, mobile,
    diagnosis, medicine, note, addendum text or vital value.

    0.6.1 (13 Nov 2026, ADR-025 D7, D15, D19; applied under DEC-047) is additive and names what 0.6.0 left open.
    (1) EmrFinishCheck.effects.profile is no longer free keys: it is EmrFinishProfileEffects, one block per
    profile chosen by its profile property (gm, dental, og, paeds, physio, onco, surgery), with the facts and
    values the finish dialog's profile lines need. (2) EmrFinishCheck.effects.prints and EmrSignOutcome.prints list
    the documents the client prints by itself after the sign (EmrFinishPrint); every other print is an
    on-demand button. (3) EmrReprint gains layout (the snapshot sections it prints, with field and option labels),
    specialty (the profile block computed as of the signing day) and specialtyReference (the profile's list
    labels), so choice keys print as words through the same composer as the doctor's case paper. No path, problem
    type, permission, audit entry or table changes.

    0.6.2 (13 Nov 2026, ADR-025 D3, D4, D7, D8, D10, D13, D15; DEC-048 H28 to H35 and the phase 5 security pre-review
    L1, L2, L7; applied under DEC-047) states exactly what the static reviews found open. No path, schema property,
    table or audit entry is added; three answers become narrower and three operations list problem types they now
    answer. (1) POST /emr/records/{recordId}/addenda on IPD_ROUND and ER_ASSESSMENT records: only the signer, the
    admission's admitting doctor (IPD_ROUND) or an OWNER with doctor details; any other doctor 403 not-own-patient
    (H29, narrower than 0.6.0's "IPD scope"). (2) PUT /emr/records/{recordId}/edit-hold takeOver: also the admitting
    doctor on an IPD_ROUND record (H35); EmrEditHold.canTakeOver says so. (3) GET /visits/{visitId}/prescription-print:
    for FRONT_DESK and PHARMACIST EmrReprint.specialty holds only the keys the printed sections use, plus the
    Paediatrics immunization data for the vaccination card; the full block only for the record's doctor and OWNER
    (H32, supersedes part of ADR-025 H21). (4) GET …/admission-prefill: patient.mobile is null unless canAdmitDirectly
    is true (H34). (5) POST …/admission-request: an Idempotency-Key replays only on the same record with the same body
    (another record or body 409 idempotency-conflict); keys starting "sign-" are reserved for the requests the sign
    makes (400 validation); a closed encounter (409 encounter-closed) and another doctor's edit hold (409
    emr-record-held, newly listed) are refused, in a stated check order (L1, L7). (6) POST …/sign:
    IPD_ROUND and ER_ASSESSMENT records answer 409 ipd-read-only while IPD is Read-only (L2); a SAH-31 hard stop met at
    sign is recorded in its own committed step before the 409 ipd-order-not-placed (H31; the answer is unchanged).
    (7) PUT …/draft lists encounter-closed and ipd-read-only, which it already answered. Behaviour notes without a
    contract change: dental "done today" (H28) and the long-term conditions union (H30), ADR-025 D7 and D13.

    0.6.3 (13 Nov 2026, DEC-051, answered by the human 13 Nov 2026; QA triage docs/test-plans/full-run-2026-11-13.md;
    ADR-025 D2, D8, D14 and ADR-022 D5) aligns the contract with the decisions of the first full run. No path, problem
    type, permission, table or audit entry is added. (1) D2: POST /emr/records/{recordId}/finish-check on a discharged
    admission or a closed Emergency case answers 409 encounter-closed, as PUT …/draft does; it is checked before
    readiness, so that state never comes back as ready false. (2) D3: the 409 ipd-order-not-placed body's rows are now
    named (EmrIpdOrderNotPlacedRow, declared on the Problem response): the row id, the drug, the outcome, the check
    kind and a fixed reason only. They never carry the patient's allergy text or any other clinical text; the doctor
    sees the SAH-31 lines by checking again. (3) D4: EmrFinishBillLine.amountPaise is the line total (qty × unit
    price), and unitPaise (required) is added for display. The existing qty is the quantity. billTotalPaise is the sum
    of the lines' amountPaise. (4) D1, behaviour only: an allergy review sent in the same draft save that changes the
    visit's allergy classes (for example with the first class) is cleared and writes no EMR_ALLERGY_ALERT_REVIEWED.

    0.7.0 (14 Nov 2026, SAH-75 EMR design alignment, DEC-052 and its addendum; ADR-026). Additive except where a
    line says "changed". No new module, permission or external service. (1) SAH-75-3 embedded course: GET /emr/courses
    gains the optional kind filter; POST /emr/courses accepts kind SURGERY (the "Start course" entry; the OT booking
    then reuses the patient's latest ACTIVE SURGERY course of the same doctor, ADR-026 D3); TreatmentCourseView gains
    estimateSigned (the sub line "estimate signed by patient"). (2) SAH-75-10 course actions (supersedes DEC-043 item
    11): new POST …/sittings/{sittingId}/mark-done, /missed, /rebook, /reschedule, /remove, /admission-request.
    Changed: CourseSittingStatus gains MISSED; TODAY also covers an unlinked OPD sitting planned for today; a removed
    sitting is no longer returned; CourseSitting gains displayNo (the renumbered S<n>), regimenKey, allowedActions;
    the sign marks a linked sitting done only when it is not done yet (one state, one charge). Sitting inputs gain
    regimenKey (CHEMO). PUT …/sittings/{sittingId} refuses MISSED; link-visit accepts a TODAY unlinked sitting. (3)
    SAH-75-4 and SAH-75-6 configuration data: EmrFieldDefinition gains presentation (CHIPS) and EmrFieldOption gains
    alert; the starter layouts change by forward seed migrations only (new starter layout versions); a department's
    section set is the latest version plus the current starter plus live forms, and starter sections a published
    department lacks are returned as hidden rows the owner can show (ADR-026 D2). (4) SAH-75-5 body map: SpOncExam
    gains bodyMap; SpPainScore gains siteMarker and site may hold 120 characters; the new library section local_exam
    (one BODY_MAP field) needs no contract change. (5) SAH-75-6: new specialty component DENTAL_MED_HISTORY
    (SpDentalMedHistory) on section dental_medhx; EmrSpecialtyView.dental gains medicalAlerts; its Penicillin chip
    joins the visit's allergy classes for the SAH-48 check, and its allergy chips join the patient record write-back at
    signing (OQ-75-16, ADR-025 D13 extended); reference lists dentalMedConditions, dentalMedMedicines,
    dentalMedAllergies. (6) SAH-75-7: new PUT /emr/records/{recordId}/cancer-journey (per-patient Cancer journey,
    append-only versions); EmrSpecialtyView.onco gains journey, watch and dayCareBed. The scheme balance chip has no
    source and is not in the contract (OQ-75-8, ADR-026 H4). (7) SAH-75-9: SpImmunization "Mark all due as given"
    covers overdue vaccines (description only). (8) BR75-9: og ANC mode also hides menstrual (hiddenSectionKeys). (9)
    SAH-75-8, SAH-75-11: EmrPastVisitDetail gains medicinesHeading; EmrSpecialtyHistory gains dentalToothHistory,
    physioProgress.painBySession and oncologyCycles[].lesions; SpPreauth.sent means "requested by the clinic". New
    problem type: journey-changed (409). New audit actions: COURSE_SITTING_MARKED_DONE, COURSE_SITTING_MISSED,
    COURSE_SITTING_REBOOKED, COURSE_SITTING_RESCHEDULED, COURSE_SITTING_REMOVED, COURSE_SITTING_ADMISSION_REQUESTED,
    EMR_DENTAL_MEDHX_REVIEWED, ONC_JOURNEY_UPDATED (ids, numbers, status words, dates and field names only). Values
    tagged "value from the EMR mockup, not clinically reviewed" (BR75-5). No answer, log line or audit value holds a
    patient name, chip value, journey value, finding or sitting item outside the screens that show them.

    0.7.1 (14 Nov 2026, SAH-75 follow-up of the frontend hand-back, ADR-026 D12 to D14). Adds no path, problem type,
    permission or audit action. (1) D12 "No known allergy" chips: EmrRecordHeader gains allergyStatus RECORDED |
    NONE_RECORDED | NOT_RECORDED, worked out by the patient module from the patient record's allergy text (the text the
    existing sign write-back writes, "No known allergy", or a none word typed at the front desk). Changed (narrower):
    header.allergyText is null unless allergyStatus is RECORDED, so a recorded "none" never shows as a red
    "Allergy: No known allergy" tag. Paediatrics draws "No known allergy" and Oncology "No known drug allergy" (grey)
    only for NONE_RECORDED; other departments show no tag for it, as before. (2) D13 Gynae menstrual history and
    contraception as drawn: library data only (forward seed migration): menstrual.cycle, menstrual.cycle_length,
    menstrual.flow (adds "With clots") and menstrual.dysmenorrhoea (label "Pain") become single-choice chip rows;
    contraception gains the field method (six tiles with a second line). EmrFieldOption gains hint (the tile's second
    line); a CHIPS field whose options carry a hint draws as tiles. Changed: copy from last visit leaves out a value
    that no longer fits the new record's field definition (for example old free text in menstrual.cycle). (3) D14
    Oncology Assessment card order as drawn (Side effects, Examination, Labs, ECOG; the decision card follows ECOG):
    starter placement only, new starter layout version for og and onco. Values tagged "value from the EMR mockup, not
    clinically reviewed".
servers:
  - url: /api/v1/opd
security:
  - bearer: []
paths:
  /doctor-slots:
    get:
      tags: [SAH-11]
      responses:
        '200': { description: Per-doctor slot settings, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DoctorSlotSettings' } } } } }
  /doctor-slots/{doctorMembershipId}:
    parameters:
      - { name: doctorMembershipId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [SAH-11]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DoctorSlotSettings' } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/DoctorSlotSettings' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /booking-rules:
    get:
      tags: [SAH-11]
      responses:
        '200': { description: Rules, content: { application/json: { schema: { $ref: '#/components/schemas/BookingRules' } } } }
    put:
      tags: [SAH-11]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BookingRules' } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/BookingRules' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /appointments:
    get:
      tags: [SAH-11]
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: doctorMembershipId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Appointments, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Appointment' } } } } }
    post:
      tags: [SAH-11]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AppointmentCreate' } } }
      responses:
        '201': { description: 'Booked. 409 also covers a doctor who is not taking bookings that date because of approved leave (SAH-21, problem type doctor-unavailable, "This doctor is not taking bookings on that date.") besides a taken slot.', content: { application/json: { schema: { $ref: '#/components/schemas/Appointment' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /appointments/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [SAH-11]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [CANCELLED, NOSHOW] } } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Appointment' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /appointments/{id}/token:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [SAH-11]
      responses:
        '200': { description: Token issued, content: { application/json: { schema: { $ref: '#/components/schemas/Appointment' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /visits/today:
    get:
      tags: [SAH-9]
      parameters:
        - { name: mine, in: query, schema: { type: boolean, default: false } }
      responses:
        '200': { description: Today's visits, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Visit' } } } } }
  /visits:
    post:
      tags: [SAH-9, SAH-27]
      description: 'Issues a token. visitType is FOLLOW_UP when the patient was last seen by the same doctor within the follow-up window of the fee settings (followUpDays), otherwise NEW; the fee follows followUpFee for FOLLOW_UP. SAH-27 (ADR-004): an IPD discharge with a follow-up to this doctor counts as being seen on the discharge instant, so a return within the window after discharge is FOLLOW_UP too. Issuing the token closes the oldest open follow-up (visit or discharge) of the same patient and doctor.'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VisitCreate' } } }
      responses:
        '201': { description: Token issued, content: { application/json: { schema: { $ref: '#/components/schemas/Visit' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /visits/{id}/stage:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [SAH-9]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [stage], properties: { stage: { $ref: '#/components/schemas/VisitStage' } } } } }
      responses:
        '200': { description: Moved, content: { application/json: { schema: { $ref: '#/components/schemas/Visit' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /visits/{id}/visit-type:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [SAH-52]
      operationId: changeVisitType
      summary: The doctor changes the OPD visit type from the EMR
      description: >-
        SAH-52-2 (ADR-020 D10). Values NEW, FOLLOW_UP, REVISIT (BRD list, SO-45-18; the meaning of REVISIT is
        OQ-43-26). EMERGENCY answers 400 visit-type-not-available ("Emergency is available in a later step.") until
        SAH-67 builds the triage hand-off. A DOCTOR or VISITING_DOCTOR may change only their own visit (403
        not-own-patient); an OWNER with doctor details any visit. The same type as now answers 200 and writes
        nothing. Otherwise the visit, the Queue card and later the case paper show the new type, and one audit entry
        EMR_VISIT_TYPE_CHANGED records the old and new type. Only the type is recorded; the fee effect is SAH-68.
        Front desk keeps setting the type at registration only (POST /visits, unchanged).
        0.6.0 (SAH-67-4, SAH-68-2, ADR-025 D11, D14): EMERGENCY is available and needs triageLevel, a level of the
        clinic's triage scale (GET /emr/triage-levels; the SAH-28 default 3-colour scale when the clinic has no
        Emergency settings); without it, or with a level outside the scale, 400 validation "Choose a triage level";
        triageLevel with another type is 400 validation. The visit joins the Queue's Emergency group (most urgent
        first, then longest waiting; Visit.triageLevel); changing back clears the level and the card returns to arrival
        order. No Emergency case is created (OQ-43-25 default). Fee: while the visit bill has no payment the fee is
        worked out again by the SAH-9 rule (FOLLOW_UP gets the clinic's follow-up fee only when the patient was seen
        by the same doctor inside the follow-up window; every other case the doctor's full fee; ADR-025 H11) and the
        answer's feeChange says UPDATED or UNCHANGED; with a payment the type still changes, the fee does not, and
        feeChange.outcome is ALREADY_BILLED ("Already billed. Ask billing to adjust."). A SIGNED EMR record of the
        visit: 409 emr-record-signed. The audit gains triageLevel and feePaise before and after.
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VisitTypeInput' }
            examples:
              revisit: { value: { visitType: REVISIT } }
      responses:
        '200': { description: The visit after the change, content: { application/json: { schema: { $ref: '#/components/schemas/Visit' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation or visit-type-not-available.' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden, doctor-details-missing or not-own-patient.' }
        '404': { $ref: '#/components/responses/Problem', description: 'Visit not found (or another clinic''s).' }
        '409': { $ref: '#/components/responses/Problem', description: '0.6.0: emr-record-signed (the visit''s EMR record is signed).' }
  /visits/{visitId}/prescription-print:
    parameters:
      - { name: visitId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [SAH-51]
      operationId: reprintSignedPrescription
      summary: Reprint the signed prescription of a visit, read-only ("Reprint")
      description: >-
        SAH-51-6 (ADR-025 D15). Only for a visit whose EMR record is SIGNED (otherwise 409 emr-record-not-signed). The
        answer is what the paper needs and nothing more: the case-paper context, the signed values of the sections
        whose Print on prescription was on in the record's snapshot (inactive list items left out), the addenda and
        reprint true; the client prints it with the shared composer and the word "Reprint". OWNER, FRONT_DESK and
        PHARMACIST any visit of the clinic; DOCTOR and VISITING_DOCTOR their own visits (403 not-own-patient); NURSE,
        BILLING, COUNSELLOR 403 forbidden (analyst default, ADR-025 H12). One audit entry EMR_PRESCRIPTION_REPRINTED
        (visit id, record id). Screen and print only; never logged. 0.6.1 (ADR-025 D15, D19): the answer also
        carries the snapshot of the printed sections (field names and option labels), the profile's computed block
        as of the signing day and the profile's list labels, so every choice prints as words; for a Paediatrics
        visit the same answer prints the vaccination card ("Print vaccination card", SAH-62-4: front desk reprints
        a signed card here). Nothing else of the record is returned. 0.6.2 (ADR-025 D15, DEC-048 H32, supersedes
        part of H21): the computed block is cut down by role. FRONT_DESK and PHARMACIST receive only the keys of the
        block that the printed sections read, plus the Paediatrics immunization data for the vaccination card; the
        record's doctor and OWNER receive the whole block. See EmrReprint.specialty.
      x-required-role: OWNER, FRONT_DESK, PHARMACIST, DOCTOR (own), VISITING_DOCTOR (own)
      responses:
        '200': { description: The printable signed prescription, content: { application/json: { schema: { $ref: '#/components/schemas/EmrReprint' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden or not-own-patient.' }
        '404': { $ref: '#/components/responses/Problem', description: 'Visit not found (or another clinic''s), or the visit has no EMR record.' }
        '409': { $ref: '#/components/responses/Problem', description: emr-record-not-signed }
