        '200': { description: The record with its new layout, content: { application/json: { schema: { $ref: '#/components/schemas/EmrRecordView' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem', description: 'record-not-found, department-not-found or department-not-published.' }
        '409': { $ref: '#/components/responses/Problem', description: 'emr-record-changed or emr-record-signed.' }
  /emr/records/{recordId}/admission-advice:
    parameters:
      - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [SAH-52]
      operationId: adviseAdmission
