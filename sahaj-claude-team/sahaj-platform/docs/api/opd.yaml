      description: >-
        SAH-48-3, SAH-55-2 (ADR-022 D9). Stored on the record only; the clinic's Case paper and Rx settings (SAH-7)
        are never changed. null means the clinic default. Allowed on DRAFT and SIGNED records (a print choice, not
        clinical content); no revision, last write wins; no audit. Same access as reading the record.
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmrPrintPreferences' } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/EmrPrintPreferences' } } } }
        '400': { $ref: '#/components/responses/Problem', description: validation }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem', description: record-not-found }
  /emr/records/{recordId}/case-paper:
    parameters:
      - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [SAH-55, SAH-48]
      operationId: getEmrCasePaperContext
      summary: What the live case paper needs besides the values on screen
      description: >-
        SAH-55-1, SAH-55-2, SAH-48-3 (ADR-022 D9). The paper is composed in the browser from the record values as the
        doctor types (no save needed) by one shared function; this answer gives the letterhead, department, doctor
        (registration number null shows "Reg. no. not set"), patient, visit line, clinic defaults and this visit's
        choices, the ten headings in English, Marathi and Hindi (tagged wording), the heading of every section in the
        record's layout (NONE = never printed), the signature state, printBlocked (an unreviewed allergy alert:
        "Resolve the allergy alert first") and share (always unavailable: "Needs the WhatsApp and ABHA services",
        DEC-040). Print is the browser's print of the paper at A4 or A5; no PDF is made and nothing is stored or
        logged. Same access as reading the record (NURSE, FRONT_DESK, BILLING, PHARMACIST, COUNSELLOR 403).
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      responses:
        '200': { description: Case paper context, content: { application/json: { schema: { $ref: '#/components/schemas/EmrCasePaperContext' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden, doctor-details-missing, not-own-patient or outside-scope.' }
        '404': { $ref: '#/components/responses/Problem', description: record-not-found }
  /emr/records/{recordId}/past-visits:
    parameters:
      - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [SAH-50]
      operationId: listEmrPastVisits
      summary: Patient history beside the EMR ("Past visits · OPD + IPD")
      description: >-
        SAH-50-1, SAH-50-3 (ADR-022 D10). The patient is the record's patient; the access is the record's (own patient
        for OPD, IPD scope for IPD and Emergency; other roles 403). Rows newest first, 8 a page ("Load more"): earlier
        EMR records of the patient in this clinic (every department, the current record excluded) and the patient's
        IPD admissions read through ipd (one row per admission); for an IPD_ROUND record this admission's earlier round
        notes come first. Admissions outside the caller's ward scope, or any admission for a VISITING_DOCTOR, are left
        out of rows, counts and search, and someHidden is true ("Some entries are hidden"). q matches, any part and any
        letter case, the title, complaints, diagnosis names and codes, medicine names, test names and place; the
        search runs on the server over this patient's rows only; q is never logged. Nothing matches: items empty
        ("Nothing matches."). No earlier row at all: counts 0 ("First visit. No earlier records."). An Emergency record
        with no patient answers an empty page. No audit for this read.
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      parameters:
        - { name: type, in: query, required: false, schema: { type: string, enum: [ALL, OPD, IPD], default: ALL } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 200, default: 0 } }
      responses:
        '200': { description: One page of 8, content: { application/json: { schema: { $ref: '#/components/schemas/EmrPastVisitPage' } } } }
        '400': { $ref: '#/components/responses/Problem', description: validation }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden, doctor-details-missing, not-own-patient or outside-scope.' }
        '404': { $ref: '#/components/responses/Problem', description: record-not-found }
  /emr/records/{recordId}/past-visits/{kind}/{pastId}:
    parameters:
      - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: kind, in: path, required: true, schema: { type: string, enum: [OPD, IPD, IPD_ROUND] } }
      - { name: pastId, in: path, required: true, schema: { type: string, format: uuid }, description: 'An EMR record id for OPD and IPD_ROUND; an IPD admission id for IPD.' }
    get:
      tags: [SAH-50]
      operationId: getEmrPastVisitDetail
      summary: Details of one past visit ("Details ▾")
      description: >-
        SAH-50-4 (ADR-022 D10). Details come only from SIGNED records (until SAH-51 an OPD row answers signed false and
        "No signed record yet."): labelled lines by printed heading, medicines, results (Abnormal only when the stored
        row says so; no limits are set here), body map lines and form entries. For IPD: admission and discharge dates,
        discharge type and the signed round notes of that admission. canCopyMedicines and canRepeatTests are false when
        there is nothing to copy or the current record is signed (note "This visit is signed"). open tells the client
        what "Open full visit" or "Open discharge summary" opens. Same access rules as the list; an admission outside
