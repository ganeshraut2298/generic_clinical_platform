      description: >-
        SAH-52-4 (ADR-020 D10). OPD_VISIT and ER_ASSESSMENT records only (IPD_ROUND: 400 not-applicable). Sets
        admissionAdvised (the button shows pressed and the header tag "Admission advised") and, when sent, the
        referral line for the case paper (default of OQ-43-4). When IPD is on or in trial the client then opens the
        existing admission sheet (pre-fill is SAH-67). Repeating with the same referral line changes nothing. A
        SIGNED record: 409 emr-record-signed. One audit entry EMR_ADMISSION_ADVISED (withReferral only, never the
        text). "Switch on IPD" for the owner is the existing Clinic setup → Plan and modules screen.
        0.6.0: with IPD on or in trial the button now uses GET …/admission-prefill and POST …/admission-request
        (SAH-67-3); this operation stays the IPD-off path ("Advise admission + referral").
