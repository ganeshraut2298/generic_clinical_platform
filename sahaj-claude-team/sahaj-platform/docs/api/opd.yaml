      x-required-permission: clinic.consultation.write
      responses:
        '200': { description: Details, content: { application/json: { schema: { $ref: '#/components/schemas/EmrPastVisitDetail' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem', description: 'record-not-found or past-visit-not-found.' }
  /emr/records/{recordId}/past-records/{pastRecordId}:
    parameters:
      - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: pastRecordId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [SAH-50]
      operationId: getEmrPastRecord
      summary: Open full visit (a signed earlier record, read-only)
      description: >-
        SAH-50-4 (ADR-022 D10). The earlier record must be SIGNED and of the same patient as recordId, which the caller
        may open; answered read-only (readOnly true, readOnlyReason HISTORY), whoever wrote it. IPD_ROUND records also
        need the IPD scope of their admission. No audit for this read.
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      responses:
        '200': { description: The earlier record, content: { application/json: { schema: { $ref: '#/components/schemas/EmrRecordView' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem', description: 'record-not-found or past-visit-not-found.' }
  /emr/records/{recordId}/key-facts:
    parameters:
      - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [SAH-50]
      operationId: getEmrKeyFacts
      summary: The four key facts for the record's department (grey box above the history)
      description: >-
        SAH-50-2 (ADR-022 D10). Labels by the record's starterKey as drawn for gm, dental, og, paeds, physio, onco and
        surgery; the other eight departments use the General Medicine labels (tagged). Values: the patient record
        (allergy and chronic text through patient.api) and the latest SIGNED value of the fact's fixed source fields;
        null shows "Not recorded" (never "None known" unless "none" was recorded, OQ-45-23). important facts show in red
        with text. The Allergies line is also updated by the client from this visit's unsaved Allergies values. Same
        access as the record.
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      responses:
        '200': { description: Key facts, content: { application/json: { schema: { $ref: '#/components/schemas/EmrKeyFacts' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem', description: record-not-found }
  /emr/form-starters:
    get:
      tags: [SAH-59]
      operationId: listEmrFormStarters
      summary: Starter forms ("Start from a form clinics in India already use. Everything stays editable.")
      description: >-
        SAH-59-6 (ADR-022 D11). Six global starter forms, read-only for every role (write methods 403 forbidden), no
        patient data: Diabetic foot examination, Glasgow Coma Scale, Morse fall risk scale, MLC injury report,
        Pre-anaesthetic check-up, Untitled form. Content as drawn, tagged C-9 (L-1 for MLC), not clinically reviewed.
      x-required-role: any clinic role
      responses:
        '200':
          description: Starters
          content: { application/json: { schema: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/EmrFormStarterSummary' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /emr/form-starters/{starterKey}:
    parameters:
      - { name: starterKey, in: path, required: true, schema: { $ref: '#/components/schemas/EmrFormStarterKey' } }
    get:
      tags: [SAH-59]
      operationId: getEmrFormStarter
      summary: One starter form with its full definition
      x-required-role: any clinic role
      responses:
        '200': { description: Starter, content: { application/json: { schema: { $ref: '#/components/schemas/EmrFormStarterDetail' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem', description: form-starter-not-found }
  /emr/forms:
    get:
      tags: [SAH-59]
      operationId: listEmrForms
      summary: The clinic's forms (custom sections)
      description: >-
        SAH-59-1, SAH-59-4 (ADR-022 D11). Every form of this clinic, by name, with its state chip ("v3 · draft",
        "v3 · waiting approval", "v3 · live"), where it is used and the counts. canEdit and canApprove are true only for
        OWNER; other roles read. Another clinic's forms are never returned.
      x-required-role: any clinic role
      responses:
        '200': { description: Forms, content: { application/json: { schema: { $ref: '#/components/schemas/EmrFormList' } } } }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [SAH-59]
      operationId: createEmrForm
      summary: New form (Untitled, or "Use this starter")
      description: >-
        SAH-59-1, SAH-59-6 (ADR-022 D11). Creates the clinic's own form with draft v1 (state DRAFT): a copy of the
        starter's definition when starterKey is sent (the starter never changes), else an empty form named by name.
        Part ASSESSMENT, approval On. Name unique in the clinic ignoring case (400 validation "A form with this name
        already exists."); at most 100 forms (400 form-limit). Idempotency-Key required: the same key returns the first
        form. One audit entry EMR_FORM_CREATED.
      x-required-role: OWNER
      x-required-permission: clinic.emr_forms.edit
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmrFormCreateInput' }
            examples:
              fromStarter: { value: { starterKey: gcs, name: null } }
              blank: { value: { starterKey: untitled, name: Wound review } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/EmrFormView' } } } }
        '200': { description: 'Same Idempotency-Key: the form created first', content: { application/json: { schema: { $ref: '#/components/schemas/EmrFormView' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation or form-limit.' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem', description: form-starter-not-found }
        '409': { $ref: '#/components/responses/Problem', description: idempotency-conflict }
  /emr/forms/{formKey}:
    parameters:
      - { name: formKey, in: path, required: true, schema: { $ref: '#/components/schemas/EmrFormKey' } }
    get:
      tags: [SAH-59]
      operationId: getEmrForm
      summary: One form for the builder (working draft, live version, versions list)
      description: >-
        SAH-59-1 to SAH-59-5 (ADR-022 D11). The working definition (the draft, else the live version), its state, the
        revision to send back, the live version number and every version with its state ("Records already filled keep
        the version they were filled in."). Any clinic role reads (Preview); only OWNER changes.
      x-required-role: any clinic role
      responses:
        '200': { description: The form, content: { application/json: { schema: { $ref: '#/components/schemas/EmrFormView' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem', description: form-not-found }
  /emr/forms/{formKey}/draft:
    parameters:
      - { name: formKey, in: path, required: true, schema: { $ref: '#/components/schemas/EmrFormKey' } }
    put:
      tags: [SAH-59]
      operationId: saveEmrFormDraft
      summary: Save draft ("Draft saved")
      description: >-
        SAH-59-1 to SAH-59-4 (ADR-022 D11). Replaces the working draft (name, settings, fields) all or nothing. A live
        form gets draft v<live+1>; the live version stays in use. A draft that is WAITING_APPROVAL or SENT_BACK returns
        to DRAFT. Structural rules checked on every save (400 form-invalid with fieldErrors): unique field keys; labels
        1 to 200; option lists for choice types; a show-if source must be an earlier YES_NO, SINGLE_CHOICE,
        MULTI_CHOICE or DROPDOWN field and an existing option; score sources and band sources must exist; a field that
        is a show-if or score source cannot be removed while used (the message names the users). Publish rules are not
        checked here (a draft with no field or no department saves). Text is stored as plain text. revision must match
        (409 form-changed). A RETIRED form: 409 form-state. Body up to 256 KB. One audit entry EMR_FORM_DRAFT_SAVED
        (settings before and after, version, field count).
      x-required-role: OWNER
      x-required-permission: clinic.emr_forms.edit
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmrFormDraftInput' } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/EmrFormView' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation or form-invalid.' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem', description: form-not-found }
        '409': { $ref: '#/components/responses/Problem', description: 'form-changed or form-state.' }
        '413': { $ref: '#/components/responses/Problem' }
  /emr/forms/{formKey}/submit:
    parameters:
      - { name: formKey, in: path, required: true, schema: { $ref: '#/components/schemas/EmrFormKey' } }
    post:
      tags: [SAH-59]
      operationId: submitEmrForm
      summary: Send for approval (approval On)
      description: >-
        SAH-59-4. Only when settings.approvalRequired is true (else 409 form-state; use publish). Runs the publish
        checks (400 form-not-publishable: "Add at least one field", "Pick at least one department in Form settings
        first.", bands and scores). State DRAFT or SENT_BACK becomes WAITING_APPROVAL; the answer names the
        departments and places where it will appear. Audit EMR_FORM_SUBMITTED.
      x-required-role: OWNER
      x-required-permission: clinic.emr_forms.edit
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmrFormRevisionInput' } } }
      responses:
        '200': { description: Waiting approval, content: { application/json: { schema: { $ref: '#/components/schemas/EmrFormView' } } } }
        '400': { $ref: '#/components/responses/Problem', description: form-not-publishable }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem', description: form-not-found }
        '409': { $ref: '#/components/responses/Problem', description: 'form-changed or form-state.' }
  /emr/forms/{formKey}/approve:
    parameters:
      - { name: formKey, in: path, required: true, schema: { $ref: '#/components/schemas/EmrFormKey' } }
    post:
      tags: [SAH-59]
      operationId: approveEmrForm
      summary: Approve the waiting version (it becomes live)
      description: >-
        SAH-59-4 (OQ-45-13: the approver is the owner; the mockup's "Medical director" means the owner). Only from
        WAITING_APPROVAL (else 409 form-state). The publish checks run again. Writes the immutable version, liveVersionNo
        = it, draft cleared; new records in the chosen departments and places get it at once (records already opened
        keep theirs). A clinic with one owner approves its own forms. Audit EMR_FORM_APPROVED.
      x-required-role: OWNER
      x-required-permission: clinic.emr_forms.approve
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmrFormRevisionInput' } } }
      responses:
        '200': { description: Live, content: { application/json: { schema: { $ref: '#/components/schemas/EmrFormView' } } } }
        '400': { $ref: '#/components/responses/Problem', description: form-not-publishable }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem', description: form-not-found }
        '409': { $ref: '#/components/responses/Problem', description: 'form-changed or form-state.' }
  /emr/forms/{formKey}/send-back:
    parameters:
      - { name: formKey, in: path, required: true, schema: { $ref: '#/components/schemas/EmrFormKey' } }
    post:
      tags: [SAH-59]
      operationId: sendBackEmrForm
      summary: Send the waiting version back with a reason
      description: 'SAH-59-4. Only from WAITING_APPROVAL (else 409 form-state); state SENT_BACK with the reason shown to the editor. Audit EMR_FORM_SENT_BACK (the reason is setup text, not patient data).'
      x-required-role: OWNER
      x-required-permission: clinic.emr_forms.approve
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmrFormSendBackInput' } } }
      responses:
        '200': { description: Sent back, content: { application/json: { schema: { $ref: '#/components/schemas/EmrFormView' } } } }
        '400': { $ref: '#/components/responses/Problem', description: validation }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem', description: form-not-found }
        '409': { $ref: '#/components/responses/Problem', description: 'form-changed or form-state.' }
  /emr/forms/{formKey}/publish:
    parameters:
      - { name: formKey, in: path, required: true, schema: { $ref: '#/components/schemas/EmrFormKey' } }
    post:
      tags: [SAH-59]
      operationId: publishEmrForm
      summary: Publish (approval Off)
      description: >-
        SAH-59-4. Only when settings.approvalRequired is false (else 409 form-state; use submit). Runs the publish
        checks (400 form-not-publishable) and makes the draft the next live version at once. A form removed from a
        department leaves that department for records opened afterwards. Audit EMR_FORM_PUBLISHED.
      x-required-role: OWNER
      x-required-permission: clinic.emr_forms.edit
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmrFormRevisionInput' } } }
      responses:
        '200': { description: Live, content: { application/json: { schema: { $ref: '#/components/schemas/EmrFormView' } } } }
        '400': { $ref: '#/components/responses/Problem', description: form-not-publishable }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem', description: form-not-found }
        '409': { $ref: '#/components/responses/Problem', description: 'form-changed or form-state.' }
  /emr/forms/{formKey}/retire:
    parameters:
      - { name: formKey, in: path, required: true, schema: { $ref: '#/components/schemas/EmrFormKey' } }
    post:
      tags: [SAH-59]
      operationId: retireEmrForm
      summary: Retire a form (no new records get it; filled records keep it)
      description: 'SAH-59-4 note "A retired form keeps all records". Status RETIRED; departments drop the section for records opened afterwards; nothing is deleted. Retiring twice: 200, nothing written. Audit EMR_FORM_RETIRED.'
      x-required-role: OWNER
      x-required-permission: clinic.emr_forms.edit
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmrFormRevisionInput' } } }
      responses:
        '200': { description: Retired, content: { application/json: { schema: { $ref: '#/components/schemas/EmrFormView' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem', description: form-not-found }
        '409': { $ref: '#/components/responses/Problem', description: form-changed }
  /emr/forms/{formKey}/versions/{versionNo}:
    parameters:
      - { name: formKey, in: path, required: true, schema: { $ref: '#/components/schemas/EmrFormKey' } }
      - { name: versionNo, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 100000 } }
    get:
      tags: [SAH-59]
      operationId: getEmrFormVersion
      summary: One published form version exactly as published
      x-required-role: any clinic role
      responses:
        '200': { description: The version, content: { application/json: { schema: { $ref: '#/components/schemas/EmrFormVersion' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem', description: 'form-not-found or version-not-found.' }
  /emr/courses:
    get:
      tags: [SAH-58]
      operationId: listTreatmentCourses
      summary: A patient's treatment courses
      description: >-
        SAH-58-1 (ADR-022 D12). The courses of one patient of this clinic, newest first. Money is read from
        GET /api/v1/billing/courses/{courseId}/account. NURSE, PHARMACIST, COUNSELLOR 403. A patient of another clinic
        gives an empty list (RLS). 0.7.0 (SAH-75-3, ADR-026 D3): optional kind filter for the panel embedded in a
        doctor screen (dental DENTAL, og ANC, physio REHAB, surgery SURGERY, onco CHEMO); newest ACTIVE first. An empty
        list shows "No course started yet." and "Start course" (OQ-75-12).
      x-required-role: OWNER, DOCTOR, VISITING_DOCTOR, FRONT_DESK, BILLING
      parameters:
        - { name: patientId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: kind, in: query, required: false, schema: { $ref: '#/components/schemas/TreatmentCourseKind' }, description: '0.7.0. Only courses of this kind.' }
      responses:
        '200':
          description: Courses
          content: { application/json: { schema: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/TreatmentCourseSummary' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [SAH-58]
      operationId: createTreatmentCourse
      summary: Start a treatment course
      description: >-
        SAH-58-1 (ADR-022 D12). From an open EMR (fromRecordId: the course's patient is the record's patient; own
        patient rule) by the doctor. kind sets the unit (DENTAL Sitting, ANC Visit, CHEMO Cycle, SURGERY Step, REHAB
        Session) and the default name; sittings come from a specialty screen's plan (phase 4) or are empty. Planned
        charges are the clinic's tariff prices or a package price the doctor types; sample rates are never used.
        DAY_CARE and IPD sittings need IPD TRIAL or ON (403 module-off). Idempotency-Key required (the same key returns
        the first course). Audit TREATMENT_COURSE_CREATED (ids, kind, sitting count, estimate; no item text).
        0.5.0 (ADR-023 D7, SAH-69-1): fromPlan true (kind DENTAL only, sittings must be empty) builds the sittings from
        the record's tx_plan rows still Planned or In progress: one OPD sitting per planned sitting of a row, in plan
        order, items "<tooth> · <procedure>", charge = the row's estimate split in equal parts rounded to ₹ 50 with the
        last sitting taking the rest (tagged; ADR-023 H11); the note "estimate signed by patient" when the estimate is
        signed. No open plan row: 400 validation. SURGERY courses are made by POST /emr/records/{recordId}/surgery-booking.
        0.7.0 (SAH-75-3, ADR-026 D3; changed): the "Start course" entry of each embedded panel calls this operation
        with the kind of its department, SURGERY included; the OT booking then reuses the ACTIVE SURGERY course started
        from its record, else the patient's latest ACTIVE SURGERY course of the same doctor (any for OWNER), else creates
        one. fromPlan with a signed estimate sets estimateSigned; the text "estimate signed by patient" is no longer
        written into note. A CHEMO sitting may carry regimenKey.
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TreatmentCourseCreateInput' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TreatmentCourseView' } } } }
        '200': { description: 'Same Idempotency-Key: the course created first', content: { application/json: { schema: { $ref: '#/components/schemas/TreatmentCourseView' } } } }
        '400': { $ref: '#/components/responses/Problem', description: validation }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden, doctor-details-missing, not-own-patient or module-off.' }
        '404': { $ref: '#/components/responses/Problem', description: record-not-found }
        '409': { $ref: '#/components/responses/Problem', description: idempotency-conflict }
  /emr/courses/{courseId}:
    parameters:
      - { name: courseId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [SAH-58]
      operationId: getTreatmentCourse
      summary: One course with its sittings (views "Visits" and "Table")
      description: >-
        SAH-58-1, SAH-58-2 (ADR-022 D12). Header, sittings with number, date, encounter chip and id (OPD visit token or
        IPD number from ipd), status computed on read (PLANNED, TODAY, DONE), items, charge and note; a DAY_CARE or IPD
        sitting linked to an admission is settledInIpd with the admission's running or final bill total ("Billed in
        IPD"). addOptions lists the add choices of the kind (DAY_CARE and IPD left out when IPD is OFF). canPlan is true
        for the course's doctor and an OWNER with doctor details; canAdmit for OWNER and FRONT_DESK when IPD is on.
        Money is in billing (GET /api/v1/billing/courses/{courseId}/account). No log line holds the patient name or
        the items. 0.7.0 (SAH-75-10, ADR-026 D4; changed): statuses REMOVED (not returned), DONE, MISSED, TODAY,
        PLANNED in that order of precedence; displayNo renumbers the sittings shown; allowedActions per sitting for the
        caller. The same view is embedded in the doctor screens (SAH-75-3).
      x-required-role: OWNER, DOCTOR, VISITING_DOCTOR, FRONT_DESK, BILLING
      responses:
        '200': { description: The course, content: { application/json: { schema: { $ref: '#/components/schemas/TreatmentCourseView' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem', description: course-not-found }
  /emr/courses/{courseId}/sittings:
    parameters:
      - { name: courseId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [SAH-58]
      operationId: addCourseSitting
      summary: Add a sitting ("<choice> added to the course")
      description: >-
        SAH-58-2 (ADR-022 D12). addOptionKey is one of the course kind's add options. An OPD option copies the last
        sitting's charge; a DAY_CARE or IPD option has charge 0, admissionRequested true and the note "Admission
        request. Rate set at admission." (tagged B-1). The new sitting gets the next number (never reused) under the
        course row lock, so two different adds at once are both kept in order; the same Idempotency-Key twice makes
        one sitting. Only the course's doctor or an OWNER with doctor details (403 not-own-patient); NURSE, FRONT_DESK,
        BILLING, PHARMACIST, COUNSELLOR 403. Audit COURSE_SITTING_ADDED.
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CourseSittingAddInput' } } }
      responses:
        '201': { description: Added, content: { application/json: { schema: { $ref: '#/components/schemas/TreatmentCourseView' } } } }
        '200': { description: Same Idempotency-Key, content: { application/json: { schema: { $ref: '#/components/schemas/TreatmentCourseView' } } } }
        '400': { $ref: '#/components/responses/Problem', description: validation }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden, not-own-patient or module-off.' }
        '404': { $ref: '#/components/responses/Problem', description: course-not-found }
        '409': { $ref: '#/components/responses/Problem', description: idempotency-conflict }
  /emr/courses/{courseId}/sittings/{sittingId}:
    parameters:
      - { name: courseId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: sittingId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [SAH-58]
      operationId: changeCourseSitting
      summary: Change a planned sitting (date, kind, items, charge, note)
      description: >-
        SAH-58-2 (ADR-022 D12). PLANNED or TODAY sittings only; DONE: 409 sitting-done (a correction is an addendum on
        its visit, SAH-51). encounterKind can change between OPD and DAY_CARE or IPD only before a visit or admission
        is linked (409 sitting-not-available); a change to DAY_CARE or IPD sets admissionRequested ("Will be done as a
        day-care admission. Admission request created."; the IPD request list is SAH-67-3). revision of the course must
        match (409 course-changed). Audit COURSE_SITTING_CHANGED (date, kind, charge before and after; no item text).
        0.7.0: a MISSED sitting answers 409 sitting-not-available ("Rebook it first"); a removed one 404
        sitting-not-found; regimenKey (CHEMO only, else 400 validation) is optional and absent keeps it.
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CourseSittingChangeInput' } } }
      responses:
        '200': { description: Changed, content: { application/json: { schema: { $ref: '#/components/schemas/TreatmentCourseView' } } } }
        '400': { $ref: '#/components/responses/Problem', description: validation }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden, not-own-patient or module-off.' }
        '404': { $ref: '#/components/responses/Problem', description: 'course-not-found or sitting-not-found.' }
        '409': { $ref: '#/components/responses/Problem', description: 'course-changed, sitting-done or sitting-not-available.' }
  /emr/courses/{courseId}/sittings/{sittingId}/link-visit:
    parameters:
      - { name: courseId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: sittingId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [SAH-58]
      operationId: linkCourseSittingVisit
      summary: This is today's sitting (link today's OPD visit to a planned OPD sitting)
      description: >-
        SAH-58-2 (ADR-022 D12, H5: the control is not drawn; default label "This is today's <unit>"). The visit must be
        an OPD visit of the course's patient in this clinic, not linked to another sitting (409 visit-already-linked);
        the sitting must be an unlinked PLANNED OPD sitting (409 sitting-not-available). The sitting becomes TODAY and
        DONE when that visit's record is signed (SAH-51). Repeating the same link: 200, nothing written. Audit
        COURSE_SITTING_VISIT_LINKED. 0.7.0: an unlinked OPD sitting in status TODAY (planned for today) is accepted as
        PLANNED is; MISSED, DONE and removed sittings are not (409 sitting-not-available, 404 for removed). The sign
        sets the linked sitting's doneAt only when it is not set yet (ADR-025 D1 step 9 narrowed, ADR-026 D4).
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CourseSittingLinkVisitInput' } } }
      responses:
        '200': { description: Linked, content: { application/json: { schema: { $ref: '#/components/schemas/TreatmentCourseView' } } } }
        '400': { $ref: '#/components/responses/Problem', description: validation }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden or not-own-patient.' }
        '404': { $ref: '#/components/responses/Problem', description: 'course-not-found, sitting-not-found or encounter-not-found.' }
        '409': { $ref: '#/components/responses/Problem', description: 'course-changed, visit-already-linked or sitting-not-available.' }
  /emr/courses/{courseId}/sittings/{sittingId}/mark-done:
    parameters:
      - { name: courseId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: sittingId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [SAH-75]
      operationId: markCourseSittingDone
      summary: '"Mark <unit> done" on the Today card'
      description: >-
        SAH-75-10 (ADR-026 D4). TODAY → DONE: sets doneAt, doneSource MARK_DONE and the doctor. The charge is not a
        stored row: billing counts a DONE sitting's charge on every read, so marking done here and signing the linked
        visit (SAH-58-2, ADR-025 D1 step 9) end in the same single state and one charge, whichever comes first. Toast
        "<Unit> <displayNo> done · ₹ <chargePaise> added to the account"; when settledInIpd the charge stays on the IPD
        bill and the toast reads "<Unit> <displayNo> done · billed in IPD" (ADR-026 H2). Optional visitId (the OPD visit
        of the EMR hosting the panel): when the sitting has no link it is linked first in the same transaction, with
        the link-visit checks (audit COURSE_SITTING_VISIT_LINKED too). PLANNED, MISSED or DONE: 409
        sitting-not-available or sitting-done; stale revision or a second press: 409 course-changed "This sitting
        changed. Reload."; removed: 404 sitting-not-found. Only the course's doctor or an OWNER with doctor details
        (403 not-own-patient); FRONT_DESK and BILLING 403 (they collect only); NURSE, PHARMACIST, COUNSELLOR 403; another
        clinic's course 404. Audit COURSE_SITTING_MARKED_DONE (course id; sittingId, sittingNo, displayNo, status
        before and after; no items).
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CourseSittingMarkDoneInput' } } }
      responses:
        '200': { description: Done, content: { application/json: { schema: { $ref: '#/components/schemas/TreatmentCourseView' } } } }
        '400': { $ref: '#/components/responses/Problem', description: validation }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden or not-own-patient.' }
        '404': { $ref: '#/components/responses/Problem', description: 'course-not-found, sitting-not-found or encounter-not-found.' }
        '409': { $ref: '#/components/responses/Problem', description: 'course-changed, sitting-done, sitting-not-available or visit-already-linked.' }
  /emr/courses/{courseId}/sittings/{sittingId}/missed:
    parameters:
      - { name: courseId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: sittingId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [SAH-75]
      operationId: markCourseSittingMissed
      summary: '"Patient did not come"'
      description: >-
        SAH-75-10 (ADR-026 D4). TODAY with no linked visit or admission → MISSED (missedAt, the doctor). No charge;
        nothing in billing changes. Toast "Marked missed." (OQ-75-4: no reminder is sent or claimed). A linked sitting
        (the patient came) or any other status: 409 sitting-not-available. Roles, 409 course-changed and 404 as
        mark-done. Audit COURSE_SITTING_MISSED.
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CourseSittingRevisionInput' } } }
      responses:
        '200': { description: Missed, content: { application/json: { schema: { $ref: '#/components/schemas/TreatmentCourseView' } } } }
        '400': { $ref: '#/components/responses/Problem', description: validation }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden or not-own-patient.' }
        '404': { $ref: '#/components/responses/Problem', description: 'course-not-found or sitting-not-found.' }
        '409': { $ref: '#/components/responses/Problem', description: 'course-changed, sitting-done or sitting-not-available.' }
  /emr/courses/{courseId}/sittings/{sittingId}/rebook:
    parameters:
      - { name: courseId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: sittingId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [SAH-75]
      operationId: rebookCourseSitting
      summary: '"Rebook" a missed sitting'
      description: >-
        SAH-75-10 (ADR-026 D4). MISSED → PLANNED (TODAY when the date is today, OPD): clears missedAt and sets
        plannedDate. The date must be today or later in Asia/Kolkata (400 validation "Choose today or a later date.").
        Not MISSED: 409 sitting-not-available. Toast "Rebooked for <date>". Booking a chair or an appointment stays the
        "next sitting" flow (SAH-69-3). Roles, 409 course-changed and 404 as mark-done. Audit COURSE_SITTING_REBOOKED
        (dates before and after).
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CourseSittingDateInput' } } }
      responses:
        '200': { description: Rebooked, content: { application/json: { schema: { $ref: '#/components/schemas/TreatmentCourseView' } } } }
        '400': { $ref: '#/components/responses/Problem', description: validation }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden or not-own-patient.' }
        '404': { $ref: '#/components/responses/Problem', description: 'course-not-found or sitting-not-found.' }
        '409': { $ref: '#/components/responses/Problem', description: 'course-changed, sitting-done or sitting-not-available.' }
  /emr/courses/{courseId}/sittings/{sittingId}/reschedule:
    parameters:
      - { name: courseId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: sittingId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [SAH-75]
      operationId: rescheduleCourseSitting
      summary: '"Reschedule: <date> ▾" on a planned sitting'
      description: >-
        SAH-75-10 (ADR-026 D4). PLANNED (any encounter kind) → the new plannedDate, today or later (400 validation
        "Choose today or a later date."); an OPD sitting moved to today shows TODAY. Date only: items, charge and kind
        do not change (use PUT …/sittings/{sittingId} for those). The design's sample date list is not used. Other
        statuses: 409 sitting-not-available or sitting-done. Roles, 409 course-changed and 404 as mark-done. Audit
        COURSE_SITTING_RESCHEDULED.
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CourseSittingDateInput' } } }
      responses:
        '200': { description: Rescheduled, content: { application/json: { schema: { $ref: '#/components/schemas/TreatmentCourseView' } } } }
        '400': { $ref: '#/components/responses/Problem', description: validation }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden or not-own-patient.' }
        '404': { $ref: '#/components/responses/Problem', description: 'course-not-found or sitting-not-found.' }
        '409': { $ref: '#/components/responses/Problem', description: 'course-changed, sitting-done or sitting-not-available.' }
  /emr/courses/{courseId}/sittings/{sittingId}/remove:
    parameters:
      - { name: courseId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: sittingId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [SAH-75]
      operationId: removeCourseSitting
      summary: '"Remove" a planned sitting from the plan'
      description: >-
        SAH-75-10 (ADR-026 D4). PLANNED only (TODAY, MISSED: 409 sitting-not-available; DONE: 409 sitting-done). The
        row is kept with removedAt (never deleted) and leaves the view, the counts, the step strip, the estimate and the
        IPD request list; the later sittings' displayNo move up (sittingNo never changes, ADR-026 H1). No receipt,
        payment or advance is touched; an IPD deposit earmarked to it stays as course credit. Toast "<Unit> removed from
        plan". Roles, 409 course-changed and 404 as mark-done. Audit COURSE_SITTING_REMOVED (course id, sittingId,
        sittingNo, displayNo, status before; no items).
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CourseSittingRevisionInput' } } }
      responses:
        '200': { description: Removed, content: { application/json: { schema: { $ref: '#/components/schemas/TreatmentCourseView' } } } }
        '400': { $ref: '#/components/responses/Problem', description: validation }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden or not-own-patient.' }
        '404': { $ref: '#/components/responses/Problem', description: 'course-not-found or sitting-not-found.' }
        '409': { $ref: '#/components/responses/Problem', description: 'course-changed, sitting-done or sitting-not-available.' }
  /emr/courses/{courseId}/sittings/{sittingId}/admission-request:
    parameters:
      - { name: courseId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: sittingId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [SAH-75]
      operationId: requestCourseSittingAdmission
      summary: '"Move to day care / IPD" (OPD sitting) or "Request admission" (planned day-care or IPD sitting)'
      description: >-
        SAH-75-10 (ADR-026 D4, OQ-75-5, OQ-45-31). A PLANNED OPD sitting becomes encounterKind DAY_CARE (default) or the
        IPD sent, with admissionRequested true and its charge kept; the card shows "IPD · Day care · request" and the
        toast "Will be done as a day-care admission. Admission request created.". A PLANNED DAY_CARE or IPD sitting
        gets admissionRequested true (the doctor's "Request admission"; OWNER and FRONT_DESK see "Admit now", which opens
        the existing SAH-23 sheet with treatmentCourseSittingId). The request reaches ipd's GET
        /api/v1/ipd/admission-requests through the existing opd.api TreatmentCoursePort (opd never calls ipd). Already
        requested: 200, nothing written. IPD OFF: 403 module-off. A sitting linked to a visit or admission, MISSED or
        DONE: 409 sitting-not-available or sitting-done. Roles, 409 course-changed and 404 as mark-done. Audit
        COURSE_SITTING_ADMISSION_REQUESTED (encounter kind before and after).
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CourseSittingAdmissionRequestInput' } } }
      responses:
        '200': { description: Requested, content: { application/json: { schema: { $ref: '#/components/schemas/TreatmentCourseView' } } } }
        '400': { $ref: '#/components/responses/Problem', description: validation }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden, not-own-patient or module-off.' }
        '404': { $ref: '#/components/responses/Problem', description: 'course-not-found or sitting-not-found.' }
        '409': { $ref: '#/components/responses/Problem', description: 'course-changed, sitting-done or sitting-not-available.' }
  /emr/specialty-reference/{profile}:
    parameters:
      - { name: profile, in: path, required: true, schema: { $ref: '#/components/schemas/EmrSpecialtyProfile' } }
    get:
      tags: [SAH-49, SAH-60, SAH-61, SAH-62, SAH-63, SAH-64, SAH-65, SAH-66]
      operationId: getEmrSpecialtyReference
      summary: Lists, thresholds and reference tables a specialty screen needs (read-only, tagged)
      description: >-
        ADR-023 D4. Product rules from code (thresholds, fixed lists, engines' constants) and global reference tables
        (IAP schedule, growth bands, milestones, joint reference, chemotherapy protocols), so the screen can compute
        live; the server recomputes on every save and read and its answer wins. Every rule value carries the tag "value
        from the EMR mockup, accepted by the human in DEC-039, not clinically reviewed" (returned in tagNote). Two
        clinic-specific parts: dental suggestions and surgical procedures carry the clinic's tariff match (active
        service with the same name ignoring case and spaces, ADR-023 H17) or null ("Not in tariff"); sample rates of
        the mockup are never returned. ETag supported; the content changes only with a release or a migration. Write
        methods answer 403 forbidden for every role. A profile outside the seven: 400 bad-request (the generic renderer
        has no reference).
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      responses:
        '200': { description: The reference, content: { application/json: { schema: { $ref: '#/components/schemas/EmrSpecialtyReference' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /emr/records/{recordId}/specialty-history:
    parameters:
      - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [SAH-60, SAH-61, SAH-62, SAH-63, SAH-65]
      operationId: getEmrSpecialtyHistory
      summary: Earlier values the specialty screen shows (vitals history and trend, ANC visits, growth points, earlier cycles, physio progress)
      description: >-
        ADR-023 D2 (read on demand, ADR-022 D10 pattern: at most the 500 newest records of the patient are scanned).
        Blocks by the record's profile: gm and onco vitals (this record's entries, then earlier entries of SIGNED
        records, newest first; columns of SAH-60-1 with flags) and trend (last 5 BP and last 5 sugar readings: BP from
        vitals entries, sugar from the Chronic disease tracker section's blood sugar field, mg/dL); og ancVisits (this
        pregnancy's earlier records: same pregnancyCourseId, today's row last) and formFCount; paeds growthPoints
        (weight for age from signed records and today); onco cycles (from SENT orders: cycle number, date, weight, BSA,
        protocol, level, labs; side-effect grades from SIGNED records) with cycle1WeightKg and lifetime doxorubicin;
        physio progress (sessions done of planned, first and last pain and ROM, goals achieved; "Only the first visit
        is recorded." when nothing earlier). IPD round records outside the caller's IPD scope are left out and
        someHidden is true ("Some readings are hidden"). Empty until SAH-51 signs records, except the oncology blocks
        read from orders. Same access as GET /emr/records/{recordId}. No audit. Nothing here is logged.
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      responses:
        '200': { description: History blocks, content: { application/json: { schema: { $ref: '#/components/schemas/EmrSpecialtyHistory' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden, doctor-details-missing, not-own-patient or outside-scope.' }
        '404': { $ref: '#/components/responses/Problem', description: record-not-found }
  /emr/records/{recordId}/surgery-booking:
    parameters:
      - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [SAH-64, SAH-71]
      operationId: bookSurgery
      summary: Book OT and admission ("<procedure> booked for <date>, <slot>. Ward bed requested.")
      description: >-
        SAH-64-3, SAH-71-1, SAH-71-2 (ADR-023 D8). surgery profile, OPD_VISIT, DRAFT, own patient. The booking rule
        (tagged C-7, L-3, B-3) is checked on the stored values: an active diagnosis item in the diagnosis section, every
        item of sx_consent ticked, and pre-authorisation sent (sx_preauth) when the payer is not SELF; otherwise 409
        booking-not-ready with detail "Before booking: <diagnosis, n consent item(s), pre-authorisation>." and nothing
        is written. In one transaction: the booking is stamped in sx_plan (time, doctor, plan fingerprint); the
        patient's ACTIVE SURGERY course started from this record is used or created; with IPD TRIAL or ON one DAY_CARE
        (Day care) or IPD sitting is added, or updated while no admission is linked, with planned date = OT date, items
        = procedure, charge = package amount, note "OT <date>, <slot>", admissionRequested true (the IPD request list
        is SAH-67-3); with IPD OFF no sitting is made and the message is "Booked. This clinic has no IPD, so no ward bed
        was requested." (ADR-023 H14). After a change of plan, consent or pre-auth the state is CHANGED ("Changed after
        booking. Book again"); booking again updates the sitting only while it has no admission. Same Idempotency-Key:
        the first result. OT date and slot are text (no OT schedule, OQ-45-28); no SMS (OQ-45-27). Audit
        EMR_SURGERY_BOOKED (record, course and sitting ids; never the procedure).
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmrRevisionInput' } } }
      responses:
        '200': { description: Booked (or the same key's first result), content: { application/json: { schema: { $ref: '#/components/schemas/SurgeryBookingResult' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation or not-applicable (not the surgery profile or not an OPD visit).' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden, doctor-details-missing or not-own-patient.' }
        '404': { $ref: '#/components/responses/Problem', description: record-not-found }
        '409': { $ref: '#/components/responses/Problem', description: 'booking-not-ready, emr-record-changed, emr-record-signed or idempotency-conflict.' }
  /emr/records/{recordId}/chemo-order:
    parameters:
      - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [SAH-66]
      operationId: getChemoOrder
      summary: The order sheet of this oncology visit (A protocol, B doses, C sequence, D safety checks, second check, send)
      description: >-
        SAH-66-1, SAH-66-2 (ADR-023 D6). onco profile, OPD_VISIT. Recomputed by the server on read (doses, lifetime
        dose, checks, fingerprint). Before the first save: 200 with status NONE and the sheet worked out from the
        decision and the default protocol (none chosen: protocolKey null). No decision yet: decisionRecorded false and
        the screen shows "No decision yet. Finish the assessment and confirm today's decision.". Same access as the
        record. No audit for a read.
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      responses:
        '200': { description: The order sheet, content: { application/json: { schema: { $ref: '#/components/schemas/ChemoOrderView' } } } }
        '400': { $ref: '#/components/responses/Problem', description: not-applicable }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem', description: record-not-found }
    put:
      tags: [SAH-66]
      operationId: saveChemoOrder
      summary: Save the order sheet (protocol, dose level and reason, final doses, pre-medicines, allergy, consent, scheme)
      description: >-
        SAH-66-1, SAH-66-2 (ADR-023 D4, D6; every number tagged C-8). Creates the order on the first save (revision 0)
        and returns it recomputed: calculated = dose per m² × BSA used × level ÷ 100; rounded to the drug's vial step;
        final = rounded unless finalMg is sent (an edit more than 5% from calculated is flagged); lifetime doxorubicin
        against 450 mg/m²; the ten checks. Level below 100 without a reason is stored but the check fails. A change of
        anything in the fingerprint clears a confirmed second check (audit CHEMO_SECOND_CHECK_CLEARED; the sheet says
        "Order changed after the second check. A new confirmation is needed."). SENT or HELD: 409 chemo-order-sent.
        Stale revision: 409 chemo-order-changed. Record SIGNED: 409 emr-record-signed. Audit CHEMO_ORDER_SAVED (ids,
        protocol key, level, checks passed). Unknown protocol or drug key: 400 validation.
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChemoOrderInput' } } }
      responses:
        '200': { description: Saved and recomputed, content: { application/json: { schema: { $ref: '#/components/schemas/ChemoOrderView' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation or not-applicable.' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem', description: record-not-found }
        '409': { $ref: '#/components/responses/Problem', description: 'chemo-order-changed, chemo-order-sent or emr-record-signed.' }
  /emr/records/{recordId}/chemo-order/checker-options:
    parameters:
      - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [SAH-66]
      operationId: listChemoCheckerOptions
      summary: People who may be named as the independent second checker (not the prescriber)
      description: >-
        SAH-66-2 (ADR-023 D6, H7). ACTIVE members of this clinic with role NURSE, PHARMACIST, DOCTOR, VISITING_DOCTOR,
        or OWNER with doctor details, never the record's doctor or anyone who saved this order. Names are staff names
        (not patient data). hasPin tells whether the person has a PIN set (way b possible); a locked or switched-off
        PIN is not revealed here.
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      responses:
        '200':
          description: Options
          content: { application/json: { schema: { type: array, maxItems: 300, items: { $ref: '#/components/schemas/ChemoCheckerOption' } } } }
        '400': { $ref: '#/components/responses/Problem', description: not-applicable }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem', description: 'record-not-found or order-not-found.' }
  /emr/records/{recordId}/chemo-order/checker:
    parameters:
      - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [SAH-66]
      operationId: nameChemoChecker
      summary: Name the independent second checker (naming does not complete the check)
      description: >-
        SAH-66-2 (ADR-023 D6; human-decided difference from the mockup, SO-45-42). Only while every safety check passes
        (409 checks-failing, "Clear the red checks before the second check."). checkerMembershipId must be one of
        checker-options; the prescriber (the record's doctor or anyone who saved the order) is refused with 400
        validation "The second check must be done by someone other than the prescriber."; another clinic's or an
        unknown id is 400 validation "Choose a checker from the list.". null removes the name. Naming another person or
        removing the name clears a confirmation. The sheet then shows "Waiting for <name> to confirm the second check";
        the stage Second check is not marked. Audit CHEMO_CHECKER_NAMED (membership id, role).
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChemoCheckerInput' } } }
      responses:
        '200': { description: Named, content: { application/json: { schema: { $ref: '#/components/schemas/ChemoOrderView' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation or not-applicable.' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem', description: 'record-not-found or order-not-found.' }
        '409': { $ref: '#/components/responses/Problem', description: 'checks-failing, chemo-order-changed or chemo-order-sent.' }
  /emr/records/{recordId}/chemo-order/second-check:
    parameters:
      - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [SAH-66]
      operationId: confirmChemoSecondCheckByPin
      summary: The named checker confirms at the prescriber's device with their own colleague PIN
      description: >-
        SAH-66-3 way (b) (ADR-023 D6, ADR-010, ADR-014). Called by the prescriber's session; the PIN is the named
        checker's own. Order: checkerMembershipId equals the named checker (else 409 chemo-order-changed: the name
        changed or none is named), every check passes (409 checks-failing), orderRevision and fingerprint equal the
        current ones (409 chemo-order-changed); then the colleague PIN is checked by the platform outside any
        transaction with the SAH-38 rules unchanged: wrong-pin 403 "That PIN is not right." (no tries left shown),
        pin-locked 403, pin-not-set 409, rate-limit 429, colleague-pin-limit 429 (neutral text "Too many wrong PIN tries
        for this person. Choose another checker."), pin-check-failed 503 "We could not check the PIN. Try again.",
        pin-unavailable 503; a wrong try counts even though nothing else is written. Then, under the order row lock,
        revision and fingerprint are checked again and the confirmation is recorded (checker membership and user id,
        role, way PIN, time, fingerprint). Already confirmed by the same checker with the same fingerprint: 200, nothing
        written. The PIN is never stored, logged, audited or echoed. Audit CHEMO_SECOND_CHECK_CONFIRMED (ids, role,
        way).
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details (the prescriber's session)
      x-required-permission: clinic.consultation.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChemoSecondCheckPinInput' } } }
      responses:
        '200': { description: Confirmed, content: { application/json: { schema: { $ref: '#/components/schemas/ChemoOrderView' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation or not-applicable.' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden, not-own-patient, wrong-pin or pin-locked.' }
        '404': { $ref: '#/components/responses/Problem', description: 'record-not-found or order-not-found.' }
        '409': { $ref: '#/components/responses/Problem', description: 'checks-failing, chemo-order-changed, chemo-order-sent or pin-not-set.' }
        '429': { $ref: '#/components/responses/Problem', description: 'rate-limit or colleague-pin-limit (no retryAfterSeconds for the pair cap).' }
        '503': { $ref: '#/components/responses/Problem', description: 'pin-check-failed or pin-unavailable.' }
  /emr/records/{recordId}/chemo-order/send:
    parameters:
      - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [SAH-66]
      operationId: sendChemoOrder
      summary: Sign and send to pharmacy (only with every check passed and the second check confirmed)
      description: >-
        SAH-66-2 (ADR-023 D6). The server decides at send time: decision is a Give decision, all ten checks pass on a
        fresh recomputation (409 checks-failing), and the confirmation exists with the current fingerprint (409
        second-check-not-confirmed, "The second check is not confirmed yet."); fingerprint in the body must equal the
        current one (409 chemo-order-changed). The database refuses SENT without a matching confirmation (second line).
        Sets SENT with time and prescriber ("✓ Sent to pharmacy"; "Sent <drug dose list> · pharmacy preparing"). No
        message goes to a pharmacy module (OQ-45-28); Chair stays "Later". A SENT order with the same fingerprint
        answers 200 with the order (a retry makes one order). After SENT the order is read-only; a correction is an
        addendum with a new order and a new second check (SAH-51-5). Audit CHEMO_ORDER_SENT (record, order, protocol
        key, level, checks passed, checker user id, role, way).
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChemoOrderActionInput' } } }
      responses:
        '200': { description: Sent, content: { application/json: { schema: { $ref: '#/components/schemas/ChemoOrderView' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation or not-applicable.' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem', description: 'record-not-found or order-not-found.' }
        '409': { $ref: '#/components/responses/Problem', description: 'checks-failing, second-check-not-confirmed, chemo-order-changed or emr-record-signed.' }
  /emr/records/{recordId}/chemo-order/hold:
    parameters:
      - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [SAH-66]
      operationId: recordChemoHold
      summary: Record the hold (decision Delay 1 week or Stop chemo)
      description: >-
        SAH-66-2, SAH-70-1 (ADR-023 D6). Only when the recorded decision is DELAY_1_WEEK or STOP (else 409
        checks-failing with detail "Record the hold needs a Delay or Stop decision."). Status HELD with kind, reason
        text (default the first failed reason) and date; no second check is needed; nothing is sent. The footer then
        asks for nothing more on this sheet. HELD is read-only. Repeating answers 200. Audit CHEMO_HOLD_RECORDED (order
        id, kind).
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChemoHoldInput' } } }
      responses:
        '200': { description: Held, content: { application/json: { schema: { $ref: '#/components/schemas/ChemoOrderView' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation or not-applicable.' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem', description: record-not-found }
        '409': { $ref: '#/components/responses/Problem', description: 'checks-failing, chemo-order-changed, chemo-order-sent or emr-record-signed.' }
  /emr/chemo-checks:
    get:
      tags: [SAH-66]
      operationId: listMyChemoChecks
      summary: Waiting for my second check (own sign-in way)
      description: >-
        SAH-66-3 way (a) (ADR-023 D6, H7: the page is not drawn). Orders of this clinic in DRAFT that name the caller's
        own membership as checker and are not confirmed, oldest named first (namedAt ascending, then orderId; 0.5.2,
        ADR-023 D14: the longest waiting order stays on top), page size 20. The patient's name, UHID, age and
        sex are shown so the checker knows whose order it is (screen only, never logged). No EMR record access is
        granted by this list. FRONT_DESK, BILLING, COUNSELLOR 403.
      x-required-role: NURSE, PHARMACIST, DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 1000, default: 0 } }
      responses:
        '200': { description: Orders waiting for me, content: { application/json: { schema: { $ref: '#/components/schemas/ChemoCheckPage' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /emr/chemo-checks/{orderId}:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [SAH-66]
      operationId: getChemoCheck
      summary: Read-only summary of one order for its named checker
      description: >-
        SAH-66-3 way (a). Protocol, dose level and reason, each drug with calculated, rounded and final dose, BSA used
        and its source, labs drawn time, decision, every safety check and the fingerprint the checker confirms. Doses
        cannot be edited. Only the named checker (403 not-named-checker for anyone else of this clinic; the prescriber
        403 checker-is-prescriber); another clinic's order 404 order-not-found. No audit for a read.
      x-required-role: NURSE, PHARMACIST, DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      responses:
        '200': { description: Summary, content: { application/json: { schema: { $ref: '#/components/schemas/ChemoCheckSummary' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden, not-named-checker or checker-is-prescriber.' }
        '404': { $ref: '#/components/responses/Problem', description: order-not-found }
  /emr/chemo-checks/{orderId}/confirm:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [SAH-66]
      operationId: confirmChemoSecondCheck
      summary: Confirm second check (own sign-in)
      description: >-
        SAH-66-3 way (a) (ADR-023 D6). The signed-in caller must be the named checker (403 not-named-checker) and not a
        prescriber (403 checker-is-prescriber). Under the order row lock: DRAFT (409 chemo-order-sent), every check
        passes (409 checks-failing), fingerprint equals the current one (409 chemo-order-changed: the order changed
        after the summary was read). Records checker membership and user id, role, way SIGN_IN, time, fingerprint; the
        prescriber then sees "Second check confirmed by <name>, <role>, 11:05 AM IST". Repeating with the same
        fingerprint: 200, nothing written. Audit CHEMO_SECOND_CHECK_CONFIRMED (ids, role, way).
      x-required-role: NURSE, PHARMACIST, DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChemoCheckConfirmInput' } } }
      responses:
        '200': { description: Confirmed, content: { application/json: { schema: { $ref: '#/components/schemas/ChemoCheckSummary' } } } }
        '400': { $ref: '#/components/responses/Problem', description: validation }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden, not-named-checker or checker-is-prescriber.' }
        '404': { $ref: '#/components/responses/Problem', description: order-not-found }
        '409': { $ref: '#/components/responses/Problem', description: 'checks-failing, chemo-order-changed or chemo-order-sent.' }
  /emr/visit-templates:
    get:
      tags: [SAH-60]
      operationId: listEmrVisitTemplates
      summary: The clinic's visit templates ("Start from a visit template")
      description: >-
        SAH-60-4 (ADR-023 D10). Active templates of this clinic, by name. Applying one is a client merge into the
        visit's values followed by the normal draft save (duplicates skipped, allergy check and bill lines as 0.4.0);
        Undo removes exactly the item ids the merge added. Service prices are the clinic tariff's, never the mockup's.
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      responses:
        '200':
          description: Templates
          content: { application/json: { schema: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/EmrVisitTemplate' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [SAH-60]
      operationId: createEmrVisitTemplate
      summary: Save as visit template (analyst addition, ADR-023 H12)
      description: >-
        SAH-60-4. Name 1 to 60 (unique in the clinic ignoring case, 400 validation "A template with this name exists"),
        sub line up to 120, items copied from the client (master keys or text, no patient data). Shared by the clinic's
        doctors. At most 100 per clinic (400 visit-template-limit). Audit EMR_VISIT_TEMPLATE_CREATED (id, item counts).
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmrVisitTemplateInput' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/EmrVisitTemplate' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation or visit-template-limit.' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /emr/records/{recordId}/edit-hold:
    parameters:
      - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [SAH-51]
      operationId: takeEmrEditHold
      summary: Take or renew the edit hold ("Edit this visit", the 30-second tick, "Take over")
      description: >-
        SAH-51-4 (ADR-025 D4). One doctor edits a record at a time. The hold is free, expired or the caller's: it is
        taken or renewed until now + 120 seconds (database clock; ADR-025 H5). Held by another doctor and not expired:
        409 emr-record-held with holderName ("Open for editing by Dr. <name>"), unless takeOver is true and the caller
        is OWNER with doctor details, who then takes it (the other doctor's next save or tick gets 409 emr-record-held
        and turns read-only); takeOver true from anyone else is 403 forbidden. One audit EMR_EDIT_HOLD_TAKEN_OVER
        (record id, previous holder membership id) for a take-over only; taking and renewing write no audit. A SIGNED
        record: 409 emr-record-signed. Same access as a draft save. 0.6.2 (ADR-025 D4, DEC-048 H35): on an IPD_ROUND
        record the admission's admitting doctor may also take over (same audit EMR_EDIT_HOLD_TAKEN_OVER); on OPD_VISIT
        and ER_ASSESSMENT records only OWNER with doctor details. There is no maximum hold lifetime
        in this phase: a hold lives as long as its holder saves or ticks.
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details (take over OWNER with doctor details; on an IPD_ROUND record also the admitting doctor)
      x-required-permission: clinic.consultation.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmrEditHoldInput' } } }
      responses:
        '200': { description: The hold now, content: { application/json: { schema: { $ref: '#/components/schemas/EmrEditHold' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden, doctor-details-missing, not-own-patient or outside-scope.' }
        '404': { $ref: '#/components/responses/Problem', description: record-not-found }
        '409': { $ref: '#/components/responses/Problem', description: 'emr-record-held or emr-record-signed.' }
    delete:
      tags: [SAH-51]
      operationId: releaseEmrEditHold
      summary: Release the caller's edit hold (the doctor leaves the EMR)
      description: 'SAH-51-4. Releases the hold only when it is the caller''s; otherwise changes nothing. Always 204 for an accessible record (a closed tab is covered by expiry). No audit.'
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      responses:
        '204': { description: Released or nothing to release }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem', description: record-not-found }
  /emr/records/{recordId}/finish-check:
    parameters:
      - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [SAH-51, SAH-67, SAH-68, SAH-69, SAH-63, SAH-70, SAH-71]
      operationId: checkEmrFinish
      summary: '"Check before completing": what is missing and what the sign will do'
      description: >-
        SAH-51-1, SAH-67-1, SAH-67-2, SAH-68-2, SAH-68-3 (ADR-025 D2). Called when the doctor taps Complete (and again
        when a choice in the dialog changes). Answers ready false with blockers when something is missing (the client
        then does not open the dialog: it lists the missing sections, or "Remove the drug or confirm the allergy alert
        before completing.", and opens the first missing section's part). Otherwise the effects the sign would have,
        computed now: workflow move, follow-up and appointment, bill lines with their billed state, patient record
        update, IPD order checks, Emergency triage and outcome, profile effects, information rows and the share state.
        The summary rows of the dialog are composed by the client from the record (as the live case paper); the server
        decides readiness. Writes nothing for OPD_VISIT and ER_ASSESSMENT records. For IPD_ROUND records each new order
        row is checked by ipd's SAH-31 check exactly as "Check and order": a hard stop writes SAH-31's deny clinical
        event and IPD_MED_ORDER_BLOCKED audit; a warning writes its record-access row; nothing is ordered. Same access as
        the sign. Never logged. 0.6.1 (ADR-025 D7, D19): effects.profile is the profile's named block
        (EmrFinishProfileEffects) and effects.prints lists the documents that will print after the sign. 0.6.3
        (DEC-051 D2): when the record's encounter is closed (IPD_ROUND on a discharged admission, ER_ASSESSMENT on an
        Emergency case no longer WAITING or SEEN), the answer is 409 encounter-closed, as for PUT …/draft. This is
        checked after access and before readiness, so nothing is checked or written. The blocker keys ENCOUNTER_CLOSED
        and CASE_CLOSED therefore never appear in a 200 for that reason.
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmrFinishChoices' } } }
      responses:
        '200': { description: Readiness and effects, content: { application/json: { schema: { $ref: '#/components/schemas/EmrFinishCheck' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation.' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden, doctor-details-missing, not-own-patient, outside-scope or module-off.' }
        '404': { $ref: '#/components/responses/Problem', description: record-not-found }
        '409': { $ref: '#/components/responses/Problem', description: 'emr-record-signed, or encounter-closed (0.6.3, DEC-051 D2: the admission is discharged or the Emergency case is closed).' }
  /emr/records/{recordId}/sign:
    parameters:
      - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [SAH-51, SAH-67, SAH-68, SAH-69, SAH-63, SAH-70, SAH-71]
      operationId: signEmrRecord
      summary: Sign the record and do the encounter's next step in one action
      description: >-
        SAH-51-2, SAH-67-1, SAH-67-2, SAH-68-2, SAH-68-3, SAH-69-3, SAH-63-3, SAH-70-2, SAH-71-3 (ADR-025 D1, D6 to D9,
        D13). One transaction: a refusal anywhere answers the problem and nothing is written (the record stays a
        draft and editable; the client offers a retry). Checks, in order: Emergency case lock (case not WAITING or SEEN
        409 case-closed "This patient is no longer in the queue."); record SIGNED (same Idempotency-Key and body: 200
        with the first result and replayed true; otherwise 409 emr-record-signed "Already signed by Dr. <name>.");
        revision (409 emr-record-changed); another doctor's edit hold (409 emr-record-held); access (403); readiness
        (409 emr-not-ready with blockers); encounter open (IPD discharged 409 encounter-closed "This admission is
        closed"). Then by encounter: OPD_VISIT — the follow-up with the chosen interval (due = visit day + 3, 7, 15
        days or 1 or 3 calendar months, Asia/Kolkata; reason "Review after treatment"; one per visit) and an
        appointment on the first free slot of that day or the next 7 days (none: date only); the visit moves to its
        next workflow step through the existing workflow (skip rules and fee timing; already past With doctor:
        ALREADY_MOVED; a refused move 409 workflow-move-refused); the visit bill's EMR lines made equal to the ticked
        services (a removal on a paid bill 409 already-billed); the profile's finish (dental done rows as bill lines and
        next sitting, physio session done and next session, onco follow-up from the next cycle date). IPD_ROUND — new
        order rows placed through ipd's SAH-31 order path with their clientKey (any not placed: 409
        ipd-order-not-placed with rows, nothing kept), the round marked done in ipd for the round date, investigations
        advised passed to the nursing sheet as text; no bill line (DEC-042 H8). ER_ASSESSMENT — the outcome: DISCHARGE
        closes the case as SAH-28 "Treat and release"; REFER_OUT as "Refer out" with the referral line on the case
        paper; ADMIT sends the admission request (the case stays in the queue until admitted); SEND_TO_OPD issues an
        OPD token for opdPatientId with the signer as doctor (409 opd-doctor-not-available) and closes the case as
        SENT_TO_OPD. For every type: allergies and long-term conditions written back to the patient record when
        changed (removals only with confirmAllergyRemoval; a record changed since the visit opened is left as it is and
        the answer says CONFLICT, the sign still completes); master items counted once for "Your most used" (typed
        items never); a linked course sitting marked done (0.7.0: only when not already done by "Mark <unit> done",
        ADR-026 D4, so one state and one charge); 0.7.0 (OQ-75-16, ADR-026 D6): the allergies written back also include
        the allergy chips of the Dental "Medical history and alerts" card; status SIGNED with the signer and the time; the edit hold
        released. One audit EMR_RECORD_SIGNED (ids, counts and outcome keys only). share.whatsappPrescription true is
        400 needs-whatsapp-service (DEC-040). After a 200 the client prints and returns to the Queue (OPD) or IPD
        (round, Emergency) with the same filter and view. 0.6.1: outcome.prints names the documents to print, in
        order (also on a replay, computed from the signed record). 0.6.2 (ADR-025 D1, D8; security pre-review L2,
        DEC-048 H31): (1) IPD_ROUND and ER_ASSESSMENT records answer 409 ipd-read-only ("IPD is read-only. Nothing can
        be changed.") while IPD is Read-only, checked after access and before readiness, so nothing is placed, marked
        or closed (a replay of an already signed record still answers 200). (2) IPD_ROUND: before any order is placed
        the new rows are checked by ipd's SAH-31 check; when any row is a hard stop, SAH-31's deny clinical event and
        IPD_MED_ORDER_BLOCKED audit are written and committed in their own step (they stay although the sign is
        refused), then the sign answers 409 ipd-order-not-placed with rows and writes nothing else. The answer is the
        same as in 0.6.0; only the record of the hard stop is new.
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details (IPD round, ADR-025 H8, the admitting doctor or OWNER)
      x-required-permission: clinic.consultation.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmrSignInput' }
            examples:
              opd: { value: { revision: 12, choices: {} } }
              er: { value: { revision: 4, choices: { erOutcome: { kind: REFER_OUT, referTo: District hospital, referNote: For CT head } } } }
      responses:
        '200': { description: Signed (or the first result of the same Idempotency-Key), content: { application/json: { schema: { $ref: '#/components/schemas/EmrSignResult' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation or needs-whatsapp-service.' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden, doctor-details-missing, not-own-patient, outside-scope or module-off.' }
        '404': { $ref: '#/components/responses/Problem', description: 'record-not-found; patient-not-found (SEND_TO_OPD with a patient not of this clinic).' }
        '409': { $ref: '#/components/responses/Problem', description: 'emr-record-signed, emr-record-changed, emr-record-held, ipd-read-only (0.6.2, IPD_ROUND and ER_ASSESSMENT while IPD is Read-only), emr-not-ready (blockers), encounter-closed, case-closed, workflow-move-refused, already-billed, ipd-order-not-placed (rows: EmrIpdOrderNotPlacedRow, 0.6.3, no clinical text), opd-doctor-not-available or idempotency-conflict.' }
  /emr/records/{recordId}/addenda:
    parameters:
      - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [SAH-51, SAH-67]
      operationId: addEmrAddendum
      summary: Add an addendum to a signed record ("Add addendum")
      description: >-
        SAH-51-5 (ADR-025 D3). SIGNED records only (a draft: 409 emr-record-not-signed). The record's doctor or OWNER
        with doctor details (OPD own patient; IPD and Emergency: IPD scope). reason 1 to 200 and text 1 to 4,000 after
        trimming, plain text without control characters (400 validation "Enter a reason" / "Enter the correction or
        addition" / the length); at most 50 per record (400 addendum-limit). Stored with the user and the database time
        and never changed or deleted; the original record, workflow step, bill lines, follow-up and orders are not
        touched. One audit EMR_ADDENDUM_ADDED (record id, addendum id; never the text). Same key twice: the first
        result. 0.6.2 (ADR-025 D3, DEC-048 H29; narrower than 0.6.0): who may add, by record type. OPD_VISIT: the
        visit's doctor or OWNER with doctor details (as 0.6.0). IPD_ROUND: the doctor who signed the note, the
        admission's admitting doctor, or OWNER with doctor details. ER_ASSESSMENT: the doctor who signed the
        assessment, or OWNER with doctor details. Any other doctor, even with IPD scope, 403 not-own-patient (a
        correction to another doctor's signed note stays with that doctor). IPD scope (403 outside-scope) and the
        VISITING_DOCTOR rule (403 forbidden on IPD and Emergency records) still apply first.
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details (OPD own visit; IPD round the signer or admitting doctor; Emergency the signer; OWNER any)
      x-required-permission: clinic.consultation.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmrAddendumInput' } } }
      responses:
        '201': { description: Added, content: { application/json: { schema: { $ref: '#/components/schemas/EmrAddendum' } } } }
        '200': { description: The first result of the same Idempotency-Key, content: { application/json: { schema: { $ref: '#/components/schemas/EmrAddendum' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation or addendum-limit.' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden, doctor-details-missing, not-own-patient or outside-scope.' }
        '404': { $ref: '#/components/responses/Problem', description: record-not-found }
        '409': { $ref: '#/components/responses/Problem', description: 'emr-record-not-signed or idempotency-conflict.' }
  /emr/records/{recordId}/encounter-vitals:
    parameters:
      - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [SAH-68, SAH-72]
      operationId: getEmrEncounterVitals
      summary: Vitals a nurse recorded for this encounter (pre-fill and "New vitals recorded. Use them?")
      description: >-
        SAH-68-1 (ADR-025 D12). IPD_ROUND: the latest nursing-chart entry of the admission on the round date (SAH-30,
        read through ipd with its scope rules) as current, and the latest before that day as earlier ("Last taken by
        <name>, <date and time>. Doctor's entry for this visit is still needed."; earlier values are never copied in).
        OPD_VISIT and ER_ASSESSMENT: no nurse vitals are captured today (the OPD vitals step and SAH-28 triage store
        none; ADR-025 H10): sources says NOT_CAPTURED and current and earlier are null. The client pre-fills only empty
        fields, re-reads on each autosave tick and offers "New vitals recorded. Use them?" when sourceEntryId changes.
        No audit for this read; never logged.
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      responses:
        '200': { description: The readings, content: { application/json: { schema: { $ref: '#/components/schemas/EmrEncounterVitals' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden, not-own-patient or outside-scope.' }
        '404': { $ref: '#/components/responses/Problem', description: record-not-found }
  /emr/records/{recordId}/ipd-order-options:
    parameters:
      - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [SAH-67]
      operationId: getEmrIpdOrderOptions
      summary: The IPD medicine catalogue, frequencies and override reasons for the round's Prescription
      description: 'SAH-67-1 (ADR-025 D8). IPD_ROUND records only (else 400 not-applicable). The same lists as the SAH-31 EMR sheet, read through ipd without a view entry. Hint under the section: "Checks allergies, duplicates and interactions. A pharmacist checks every order before the first dose."'
      x-required-role: DOCTOR, or OWNER with doctor details (VISITING_DOCTOR has no IPD access)
      x-required-permission: clinic.consultation.write
      responses:
        '200': { description: Options, content: { application/json: { schema: { $ref: '#/components/schemas/EmrIpdOrderOptions' } } } }
        '400': { $ref: '#/components/responses/Problem', description: not-applicable }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden, outside-scope or module-off.' }
        '404': { $ref: '#/components/responses/Problem', description: record-not-found }
  /emr/records/{recordId}/admission-prefill:
    parameters:
      - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [SAH-67]
      operationId: getEmrAdmissionPrefill
      summary: Facts for the existing IPD admission sheet ("Admit to IPD")
      description: >-
        SAH-67-3 (ADR-025 D10). OPD_VISIT and ER_ASSESSMENT records (IPD_ROUND 400 not-applicable). IPD must be TRIAL
        or ON (OFF: 403 module-off; the client shows SAH-52-4's "OPD only" sheet). Patient name, age, sex and mobile
        through patient.api (an Emergency case without a patient: its name, age and sex, no mobile), the suggested
        admission type (emergency for an Emergency visit type or case, else planned), the visit's active diagnoses, the
        OT procedure and stay when booked (SAH-64-3), the open request of this record, the patient's open admission
        ("Already admitted · <IP number>") and whether the caller may admit directly (OWNER with doctor details). Screen
        only: never logged, audited or put in a problem detail. 0.6.2 (ADR-025 D10, DEC-048 H34): patient.mobile is
        returned only when canAdmitDirectly is true (the sheet then needs it); for every other caller it is null.
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      responses:
        '200': { description: Pre-fill, content: { application/json: { schema: { $ref: '#/components/schemas/EmrAdmissionPrefill' } } } }
        '400': { $ref: '#/components/responses/Problem', description: not-applicable }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden, not-own-patient, outside-scope or module-off.' }
        '404': { $ref: '#/components/responses/Problem', description: record-not-found }
  /emr/records/{recordId}/admission-request:
    parameters:
      - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/AdmissionRequestIdempotencyKey' }
    post:
      tags: [SAH-67]
      operationId: requestEmrAdmission
      summary: '"Send admission request" (and the owner''s path to the sheet)'
      description: >-
        SAH-67-3, OQ-45-31 default (ADR-025 D10). OPD_VISIT and ER_ASSESSMENT records in DRAFT (SIGNED 409
        emr-record-signed; IPD_ROUND 400 not-applicable); IPD TRIAL or ON. The patient already has an open admission:
        409 already-admitted with the admission's IP number. One OPEN request per record: a repeat (or another key while
        one is open) answers 200 with the open request. Stores the type (planned, emergency, daycare), the stay for "IPD
        n days", the doctor's note, the diagnoses and OT procedure at this moment, and sets admissionAdvised (header tag
        "Admission advised"; button "Admission requested"). Owner, front desk and nurse see it on IPD → Admission
        requests (docs/api/ipd.yaml 0.3.0) and complete it with bed, deposit and consent (SAH-23); the owner with doctor
        details completes it at once in the sheet opened after this answer. The request closes when any admission of
        that patient (or of that Emergency case) is made. One audit EMR_ADMISSION_REQUESTED (record id, request id,
        type; never diagnoses or note). 0.6.2 (ADR-025 D10; security pre-review L1, L7), checks in this order after
        the role, access and not-applicable checks: (1) Idempotency-Key already used in this clinic: when it was used
        on this record with the same body (the request hash covers the record id, type, stay and note) 200 with that
        request, whatever the record's state now; used on another record or with another body 409
        idempotency-conflict, and nothing of the other record is returned. A key starting "sign-" is reserved for the
        requests the sign makes itself (Emergency outcome ADMIT) and answers 400 validation. (2) SIGNED 409
        emr-record-signed. (3) The encounter is closed (the OPD visit finished or cancelled, the Emergency case no
        longer WAITING or SEEN) 409 encounter-closed. (4) Another doctor holds the record's edit hold and it has not
        expired 409 emr-record-held with holderName (ADR-025 D4). (5) Open admission 409 already-admitted. (6) An
        OPEN request of this record 200 with it; else 201. The IPD module state (403 module-off) is part of the access
        checks.
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmrAdmissionRequestInput' } } }
      responses:
        '201': { description: Requested, content: { application/json: { schema: { $ref: '#/components/schemas/EmrAdmissionRequestView' } } } }
        '200': { description: The open request already made, content: { application/json: { schema: { $ref: '#/components/schemas/EmrAdmissionRequestView' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation or not-applicable.' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden, not-own-patient, outside-scope or module-off.' }
        '404': { $ref: '#/components/responses/Problem', description: record-not-found }
        '409': { $ref: '#/components/responses/Problem', description: 'emr-record-signed, encounter-closed, emr-record-held (0.6.2, holderName), already-admitted or idempotency-conflict (0.6.2: also the same key on another record).' }
  /emr/records/{recordId}/cancer-journey:
    parameters:
      - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [SAH-75]
      operationId: saveCancerJourney
      summary: Save the patient's Cancer journey (stage, biology, intent, line, board date)
      description: >-
        SAH-75-7 (ADR-026 D7; OQ-75-7 answered by the human: a simple edit form per patient opened from the strip; the
        form layout is ours). The journey belongs to the record's patient, not to the visit: each save appends version
        expectedVersion + 1 (earlier versions are kept, never changed); the strip reads the latest
        (EmrSpecialtyView.onco.journey). The record's access applies: clinic.consultation.write, own patient (OWNER with
        doctor details any); the record must be an OPD_VISIT of the onco profile (else 400 not-applicable) and DRAFT
        (SIGNED: 409 emr-record-signed). expectedVersion is the version read (0 when none): stale 409 journey-changed
        ("The journey was changed. Reload."). Values outside the lists or limits (a stage group not in the list, Ki-67
        above 100, a board date more than 365 days ahead): 400 validation with fieldErrors. Lists are not clinically
        reviewed (ADR-026 H6). NURSE, FRONT_DESK, BILLING, PHARMACIST, COUNSELLOR 403; another clinic's record 404.
        Audit ONC_JOURNEY_UPDATED (version and the names of the changed fields; never a value). Never logged.
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CancerJourneyInput' } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/CancerJourney' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation or not-applicable.' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden or not-own-patient.' }
        '404': { $ref: '#/components/responses/Problem', description: record-not-found }
        '409': { $ref: '#/components/responses/Problem', description: 'emr-record-signed or journey-changed.' }
  /emr/records/{recordId}/free-slots:
    parameters:
      - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [SAH-63, SAH-69, SAH-51]
      operationId: listEmrFreeSlots
      summary: The record doctor's next free appointment slots (physio "Book session n+1", dental and follow-up preview)
      description: >-
        SAH-63-3, SAH-69-3, SAH-51-6 (ADR-025 D6, D7). OPD_VISIT records. Free slots of the visit's doctor from the
        Appointments slot settings (SAH-11), leave and taken slots respected, from the given date (default tomorrow,
        Asia/Kolkata) for up to 7 days, oldest first. Empty: "No free slot. Pick a date from Appointments." Reads only.
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 12, default: 4 } }
      responses:
        '200': { description: Slots, content: { application/json: { schema: { type: array, maxItems: 12, items: { $ref: '#/components/schemas/EmrFreeSlot' } } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation or not-applicable.' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem', description: record-not-found }
  /emr/triage-levels:
    get:
      tags: [SAH-67]
      operationId: listEmrTriageLevels
      summary: The clinic's triage levels for the Emergency visit type
      description: 'SAH-67-4 (ADR-025 D11). The SAH-28 scale of the clinic (read through ipd), or the SAH-28 default 3-colour scale when the clinic has no Emergency settings (also with IPD off). Most urgent first.'
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      responses:
        '200': { description: Scale and levels, content: { application/json: { schema: { $ref: '#/components/schemas/EmrTriageScale' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' }
      description: 'Made by the client per user action (a uuid). The same key with the same body returns the first result; with another body 409 idempotency-conflict. Kept 24 hours at least.'
    AdmissionRequestIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 64, pattern: '^(?!sign-)[A-Za-z0-9_-]{8,64}$' }
      description: '0.6.2 (ADR-025 D10, security pre-review L1). As IdempotencyKey, bound to the record: a key replays only on the record it was first used on with the same body; on another record or with another body 409 idempotency-conflict. Keys starting "sign-" are reserved for the requests the sign makes itself ("sign-" + the record id as 32 hex digits) and answer 400 validation, so no client key can take or block them (a client uuid never starts with "sign-").'
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status]
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
              fieldErrors:
                type: array
                items: { type: object, required: [field, message], properties: { field: { type: string }, message: { type: string } } }
              rows:
                type: array
                maxItems: 20
                description: '0.6.3 (DEC-051 D3). Only on 409 ipd-order-not-placed (POST /emr/records/{recordId}/sign): one row per IPD order row that was not placed.'
                items: { $ref: '#/components/schemas/EmrIpdOrderNotPlacedRow' }
  schemas:
    DoctorSlotSettings:
      type: object
      required: [doctorMembershipId, slotMinutes, workingDays, walkInEveryNth, maxOnlinePerDay, sessions]
      properties:
        doctorMembershipId: { type: string, format: uuid }
        slotMinutes: { type: integer, minimum: 5, maximum: 60 }
        workingDays: { type: array, items: { type: integer, minimum: 0, maximum: 6 }, description: 0=Sunday..6=Saturday. }
        walkInEveryNth: { type: integer, minimum: 0, description: 0 means no slots are reserved for walk-ins. }
        maxOnlinePerDay: { type: integer, minimum: 0 }
        sessions: { type: array, maxItems: 2, items: { type: object, required: [startTime, endTime], properties: { startTime: { type: string }, endTime: { type: string } } } }
    BookingRules:
      type: object
      required: [closeBeforeHours, remindBeforeHours, noShowAfterMinutes, followPriority, selfBook, overbook]
      properties:
        closeBeforeHours: { type: integer, minimum: 0, maximum: 48 }
        remindBeforeHours: { type: integer, minimum: 0, maximum: 48, description: Stored only; no notification channel yet. }
        noShowAfterMinutes: { type: integer, minimum: 0, maximum: 180 }
        followPriority: { type: boolean }
        selfBook: { type: boolean, description: Stored only; no patient-facing booking channel yet. }
        overbook: { type: boolean }
    AppointmentCreate:
      type: object
      required: [patientId, doctorMembershipId, apptDate, apptTime, visitType, source]
      properties:
        patientId: { type: string, format: uuid }
        doctorMembershipId: { type: string, format: uuid }
        apptDate: { type: string, format: date }
        apptTime: { type: string }
        visitType: { type: string, enum: [NEW, FOLLOW_UP] }
        source: { type: string, enum: [PHONE, WHATSAPP, FRONT_DESK] }
        note: { type: [string, 'null'] }
    Appointment:
      type: object
      required: [id, patientId, patientName, doctorMembershipId, doctorName, apptDate, apptTime, status, visitType, source]
      properties:
        id: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        patientName: { type: string }
        age: { type: integer }
        sex: { type: string, enum: [F, M, O] }
        mobile: { type: string }
        doctorMembershipId: { type: string, format: uuid }
        doctorName: { type: string }
        apptDate: { type: string, format: date }
        apptTime: { type: string }
        status: { type: string, enum: [BOOKED, ARRIVED, NOSHOW, CANCELLED] }
        visitType: { type: string, enum: [NEW, FOLLOW_UP] }
        source: { type: string, enum: [PHONE, WHATSAPP, FRONT_DESK, EMR], description: '0.6.0: EMR = booked by the doctor''s sign (follow-up, dental next sitting, physio next session; ADR-025 D6, D7). Never sent by a client (AppointmentCreate keeps its three values).' }
        note: { type: [string, 'null'] }
        visitId: { type: [string, 'null'], format: uuid }
        tokenNo: { type: [integer, 'null'] }
    VisitStage:
      type: string
      enum: [WAITING, VITALS, WITH_DOCTOR, COUNSEL, BILLING, DONE]
    VisitCreate:
      type: object
      required: [patientId, doctorMembershipId]
      properties:
        patientId: { type: string, format: uuid }
        doctorMembershipId: { type: string, format: uuid }
    Visit:
      type: object
      required: [id, tokenNo, patientId, patientName, age, sex, doctorMembershipId, doctorName, visitType, stage, feePaise, createdAt, workflowVersionNo]
      properties:
        id: { type: string, format: uuid }
        tokenNo: { type: integer }
        workflowVersionNo: { type: integer, description: 'The published workflow version this visit was issued under (SAH-12 fix). The board moves the card through THAT version''s steps, so the client reads the steps from GET /workflow/versions.' }
        patientId: { type: string, format: uuid }
        patientName: { type: string }
        age: { type: integer }
        sex: { type: string, enum: [F, M, O] }
        doctorMembershipId: { type: string, format: uuid }
        doctorName: { type: string }
        visitType: { type: string, enum: [NEW, FOLLOW_UP, REVISIT, EMERGENCY], description: 'REVISIT (0.3.0, SAH-52-2) and EMERGENCY (0.6.0, SAH-67-4) are set only by the doctor from the EMR; POST /visits still gives NEW or FOLLOW_UP.' }
        triageLevel: { type: [integer, 'null'], minimum: 1, maximum: 5, description: '0.6.0 (SAH-67-4). Set only when visitType is EMERGENCY. The Queue shows an "Emergency" group at the top: most urgent (1) first, then longest waiting (createdAt). The card shows triageLevelName as text and triageTone as colour.' }
        triageLevelName: { type: [string, 'null'], description: '0.6.0. Name of the level in the clinic''s scale ("Red · Immediate").' }
        triageTone: { type: [string, 'null'], enum: [crit, warn, good, null], description: '0.6.0. Colour token of the level (SAH-28 EmergencyLevel.tone), always with the text.' }
        feeChange:
          type: [object, 'null']
          description: '0.6.0 (SAH-68-2). Present only in the answer of PATCH /visits/{id}/visit-type; absent elsewhere. ALREADY_BILLED: "Already billed. Ask billing to adjust." (the fee did not change).'
          required: [outcome, beforePaise, afterPaise]
          properties:
            outcome: { type: string, enum: [UPDATED, UNCHANGED, ALREADY_BILLED] }
            beforePaise: { type: integer }
            afterPaise: { type: integer }
        stage: { $ref: '#/components/schemas/VisitStage' }
        feePaise: { type: integer }
        createdAt: { type: string, format: date-time }
        emrRecordId: { type: [string, 'null'], format: uuid, description: 'SAH-46 (0.3.0). The EMR record of this visit; null before the first "Open EMR".' }
        emrStatus: { type: string, enum: [NONE, DRAFT, SIGNED], description: 'SAH-46 (0.3.0). NONE before the first open. SIGNED (SAH-51) opens read-only. Not shown on the card as text by this contract; the card uses it to open read-only.' }
    VisitTypeInput:
      type: object
      additionalProperties: false
      required: [visitType]
      properties:
        visitType: { type: string, enum: [NEW, FOLLOW_UP, REVISIT, EMERGENCY], description: 'EMERGENCY is available from 0.6.0 (SAH-67-4) and needs triageLevel.' }
        triageLevel: { type: [integer, 'null'], minimum: 1, maximum: 5, description: '0.6.0. Required for EMERGENCY (a level of GET /emr/triage-levels, else 400 validation "Choose a triage level"); must be absent or null for every other type.' }
    TodayTask:
      type: object
      required: [visitId, tokenNo, patientName, stage, doctorName, waitMinutes]
      properties:
        visitId: { type: string, format: uuid }
        tokenNo: { type: integer }
        patientName: { type: string }
        stage: { $ref: '#/components/schemas/VisitStage' }
        doctorName: { type: string }
        waitMinutes: { type: integer, description: Minutes since the token was created. }
    TodayDoctor:
      type: object
      required: [doctorMembershipId, doctorName, nextTokens]
      properties:
        doctorMembershipId: { type: string, format: uuid }
        doctorName: { type: string }
        nowWithDoctor:
          type: [object, 'null']
          description: The visit currently in With doctor for this doctor, or null for "Room free".
          required: [visitId, tokenNo, patientName, age, sex, visitType]
          properties:
            visitId: { type: string, format: uuid }
            tokenNo: { type: integer }
            patientName: { type: string }
            age: { type: integer }
            sex: { type: string, enum: [F, M, O] }
            visitType: { type: string, enum: [NEW, FOLLOW_UP, REVISIT, EMERGENCY], description: 'EMERGENCY added in 0.6.0 (SAH-67-4).' }
        nextTokens: { type: array, items: { type: integer }, description: 'Token numbers in Waiting or Vitals for this doctor, oldest first.' }
    TodaySummary:
      type: object
      required: [patientsTotal, newCount, followUpCount, waitingCount, inOpdCount, longestWaitMinutes, followUpsDue, followUpsReturned, followUpsMissed, doctors, myTasks]
      properties:
        patientsTotal: { type: integer }
        newCount: { type: integer }
        followUpCount: { type: integer }
        waitingCount: { type: integer, description: Visits in Waiting or Vitals. }
        inOpdCount: { type: integer, description: Visits not yet Done. }
        longestWaitMinutes: { type: integer }
        followUpsDue: { type: integer }
        followUpsReturned: { type: integer, description: Follow-ups returned since the start of today (Asia/Kolkata). }
        followUpsMissed: { type: integer }
        doctors: { type: array, items: { $ref: '#/components/schemas/TodayDoctor' } }
        myTasks: { type: array, items: { $ref: '#/components/schemas/TodayTask' }, description: Visits in a stage the signed-in role owns (same rule as the Queue's My tasks filter). }
    FollowUpStatus:
      type: string
      enum: [DUE, MISSED, UPCOMING, RETURNED]
      description: Computed from today's Asia/Kolkata date, never stored.
    FollowUp:
      type: object
      description: 'SAH-14. SAH-27 (ADR-004): a follow-up comes either from an OPD visit (sourceVisitId set) or from an IPD discharge (sourceAdmissionId set); exactly one of the two is set. Both kinds are listed, counted, closed on the next visit with the same doctor and shown the same way (patient, mobile, doctor, due date, reason, status).'
      required: [id, patientId, patientName, doctorMembershipId, doctorName, dueDate, reason, status, sourceVisitId, sourceAdmissionId]
      properties:
        id: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        patientName: { type: string }
        mobile: { type: [string, 'null'], description: Shown on screen only; never logged. }
        doctorMembershipId: { type: string, format: uuid }
        doctorName: { type: string }
        dueDate: { type: string, format: date }
        reason: { type: string, description: 'The follow-up reason as stored. SAH-27 (OQ-27-10, ADR-004 review decision b): for a follow-up added by an IPD discharge (sourceAdmissionId set) the stored text is "Review after discharge · <reason for admission>"; roles outside the clinical set (OWNER, FRONT_DESK, NURSE, DOCTOR, VISITING_DOCTOR) see only "Review after discharge". Visit follow-ups are not masked.' }
        status: { $ref: '#/components/schemas/FollowUpStatus' }
        daysLate: { type: integer, description: 'Days past the due date; 0 unless status is MISSED.' }
        sourceVisitId: { type: [string, 'null'], format: uuid, description: 'The visit that created it; null for a follow-up added by an IPD discharge (SAH-27).' }
        sourceAdmissionId: { type: [string, 'null'], format: uuid, description: 'SAH-27. The IPD admission whose discharge added it; null for a visit follow-up. An opaque id: opd never reads IPD data with it.' }
        returnedVisitId: { type: [string, 'null'], format: uuid }
        appointmentDate: { type: [string, 'null'], format: date, description: '0.6.0 (SAH-51-6, SAH-68-2). The appointment the doctor''s sign booked for this follow-up; null when none was booked (no free slot within 7 days, or no interval was chosen).' }
        appointmentTime: { type: [string, 'null'], description: '0.6.0. HH:mm of that appointment ("11:05 AM" on screen).' }
    FollowUpList:
      type: object
      required: [counts, items]
      properties:
        counts:
          type: object
          required: [due, missed, upcoming, returned]
          properties:
            due: { type: integer }
            missed: { type: integer }
            upcoming: { type: integer }
            returned: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/FollowUp' } }
    WorkflowStepKey:
      type: string
      enum: [token, queue, vitals, consult, counsel, casepaper, billing, followup]
    WorkflowStepOwner:
      type: string
      enum: [FRONT_DESK, NURSE, DOCTOR, OWNER]
      description: A role code. Omitted for steps with no owner (queue, casepaper, followup).
    WorkflowStep:
      type: object
      required: [key, on]
      properties:
        key: { $ref: '#/components/schemas/WorkflowStepKey' }
        on: { type: boolean, description: "token/queue/consult/billing are always true; rejected with 400 otherwise." }
        owner: { $ref: '#/components/schemas/WorkflowStepOwner' }
    WorkflowSteps:
      type: object
      required: [steps]
      properties:
        steps:
          type: array
          description: Fixed display/flow order - token first, consult before counsel and billing, casepaper/followup after consult. 8 entries, one per WorkflowStepKey.
          items: { $ref: '#/components/schemas/WorkflowStep' }
    WorkflowVersion:
      type: object
      required: [versionNo, steps, publishedAt]
      properties:
        versionNo: { type: integer }
        steps: { type: array, items: { $ref: '#/components/schemas/WorkflowStep' } }
        publishedAt: { type: string, format: date-time }
        publishedByName: { type: string }
    Service:
      type: object
      required: [name, category, priceRupees]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, minLength: 1, maxLength: 120 }
        category: { type: string, enum: [Consultation, Procedure, Nursing, Lab, Radiology, Dental, Package] }
        priceRupees: { type: integer, minimum: 0 }
        active: { type: boolean, default: true }
    ServiceUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        category: { type: string, enum: [Consultation, Procedure, Nursing, Lab, Radiology, Dental, Package] }
        priceRupees: { type: integer, minimum: 0 }
        active: { type: boolean }
    FeeSettings:
      type: object
      required: [feeTiming, followUpDays, followUpFee, discountLimits, upiOnBill]
      properties:
        feeTiming: { type: string, enum: [before, after, split] }
        followUpDays: { type: integer, minimum: 1, maximum: 30 }
        followUpFee: { type: string, enum: [free, half, full] }
        discountLimits: { type: object, description: 'Percent by role. Keys are Role values: OWNER, FRONT_DESK, NURSE, BILLING. A role with no key has no discount right.', additionalProperties: { type: integer, minimum: 0, maximum: 100 } }
        upiOnBill: { type: boolean }
    Medicine:
      type: object
      required: [id, name, favourite]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        form: { type: string }
        schedule: { type: string }
        usualDose: { type: string }
        favourite: { type: boolean }
    CasePaperSettings:
      type: object
      required: [size, preprinted, caps, sections]
      properties:
        size: { type: string, enum: [A5, A4] }
        secondLanguage: { type: [string, 'null'], enum: [mr, hi, null] }
        preprinted: { type: boolean }
        caps: { type: boolean }
        sections:
          type: object
          description: 'Section key to on or off. Keys: complaints, vitals, history, exam, diagnosis, inv, rx, advice, next. rx is always on.'
          additionalProperties: { type: boolean }
    AlertRuleInput:
      type: object
      required: [when, cond, then]
      properties:
        when: { type: string, enum: [Token, Vitals, Consultation, Billing, Case paper print, Discount, Follow-up] }
        cond: { type: string, enum: [not done in 10 min, waiting over 30 min, waiting over 45 min, bill not paid, above role limit, missed by 2 days, unpaid at day closing] }
        then: { type: string, enum: [Alert nurse, Alert owner, Flag red to the doctor, Block print, Needs owner approval, Send WhatsApp reminder, Move up in the queue] }
    AlertRule:
      type: object
      required: [id, when, cond, then, enabled]
      properties:
        id: { type: [string, 'null'], format: uuid, description: Null while the starter rules are not yet saved. }
        when: { type: string }
        cond: { type: string }
        then: { type: string }
        enabled: { type: boolean }
    AlertRuleSuggestion:
      type: object
      required: [index, when, cond, then, why]
      properties:
        index: { type: integer }
        when: { type: string }
        cond: { type: string }
        then: { type: string }
        why: { type: string }
    AlertRules:
      type: object
      required: [rules, suggestions, options]
      properties:
        rules: { type: array, items: { $ref: '#/components/schemas/AlertRule' } }
        suggestions: { type: array, items: { $ref: '#/components/schemas/AlertRuleSuggestion' }, description: Only suggestions not yet added. }
        options:
          type: object
          required: [when, cond, then]
          properties:
            when: { type: array, items: { type: string } }
            cond: { type: array, items: { type: string } }
            then: { type: array, items: { type: string } }
    StarterKey:
      type: string
      enum: [gm, dental, og, paeds, physio, ortho, eye, ent, derm, diab, cardio, ayush, onco, surgery, psych]
      description: >-
        0.3.0 (ADR-020 D4). The 15 starter departments, keys from the EMR mockup DEPTS list: General Medicine,
        Dental, Obstetrics & Gynaecology, Paediatrics, Physiotherapy, Orthopaedics, Ophthalmology, ENT, Dermatology
        & Cosmetology, Diabetology, Cardiology, AYUSH (Ayurveda), Medical Oncology, General Surgery, Psychiatry &
        Counselling. Replaces the four SAH-44 template codes; there is no Homeopathy department.
    DepartmentKey:
      type: string
      pattern: '^[a-z][a-z0-9_]{1,39}$'
      description: 'A department key in a path or body: a StarterKey for the 15 starter-backed departments, or a server-made key d_<10 characters> for an added department (never reused). Well-formed but unknown answers 404; malformed answers 400 bad-request.'
    SectionKey:
      type: string
      pattern: '^[a-z][a-z0-9_]{1,39}$'
      description: 'Stable key of a library section (ADR-020 D3), the EMR mockup S keys, for example vitals, complaints, allergy, dental_chart, pcpndt. Permanent once a version or record refers to it.'
    FieldKey:
      type: string
      pattern: '^[a-z][a-z0-9_]{0,39}$'
      description: 'Stable key of a field within its section, derived from the mockup label (for example bp_systolic).'
    EmrSearchMaster:
      type: string
      enum: [complaints, investigations, advice]
      description: SAH-43-1. Masters searched under /emr/masters; diagnoses and medicines keep GET /diagnoses and GET /medicines.
    EmrMaster:
      type: string
      enum: [complaints, diagnoses, medicines, investigations, advice]
      description: SAH-43. Every quick-option master.
    EmrMasterItem:
      type: object
      required: [id, name, specialtyHint]
      properties:
        id: { type: string, format: uuid, description: 'Stable across environments (derived from the name).' }
        name: { type: string, minLength: 1, maxLength: 200 }
        specialtyHint: { oneOf: [{ $ref: '#/components/schemas/StarterKey' }, { type: 'null' }], description: 'Ordering hint only; null = general. 0.3.0: a starter department key.' }
        nameMr: { type: [string, 'null'], maxLength: 200, description: 'Advice only (0.3.0, ADR-020 D13): Marathi text; null when not supplied (print falls back to English). Always null for complaints and investigations.' }
        nameHi: { type: [string, 'null'], maxLength: 200, description: 'Advice only: Hindi text; null when not supplied.' }
    EmrMasterPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/EmrMasterItem' } }
        total: { type: integer, minimum: 0, description: 'Every match, not only this page.' }
        page: { type: integer, minimum: 0 }
        pageSize: { type: integer, const: 20 }
    EmrQuickOption:
      type: object
      required: [itemKey, name, icd10Code, form, favourite, useCount, lastUsedAt]
      properties:
        itemKey: { type: string, maxLength: 40, description: 'The master item: uuid text for complaints, investigations, advice and medicines; the ICD-10 code for diagnoses. This is what a visit refers to.' }
        name: { type: string }
        icd10Code: { type: [string, 'null'], description: 'Diagnoses only; null for other masters.' }
        form: { type: [string, 'null'], description: 'Medicines only (Tablet, Syrup, …); null otherwise.' }
        favourite: { type: [boolean, 'null'], description: 'Medicines only: a clinic favourite (SAH-7); null otherwise.' }
        useCount: { type: integer, minimum: 0, description: 'Signed visits of this doctor in this clinic that used the item; 0 when never used.' }
        lastUsedAt: { type: [string, 'null'], format: date-time, description: 'Signature time of the latest such visit; null when never used.' }
        nameMr: { type: [string, 'null'], maxLength: 200, description: 'Advice only (0.3.0): Marathi text or null; null for other masters.' }
        nameHi: { type: [string, 'null'], maxLength: 200, description: 'Advice only (0.3.0): Hindi text or null; null for other masters.' }
    EmrQuickOptionList:
      type: object
      required: [master, items]
      properties:
        master: { $ref: '#/components/schemas/EmrMaster' }
        items: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/EmrQuickOption' } }
    EmrChoiceSource:
      type: string
      enum: [DOCTOR_SPECIALTY, DOCTOR_DEPARTMENT, CLINIC_DEFAULT, SWITCHED]
      description: 'Why this department (ADR-020 D7, SAH-46-3). SWITCHED only on a record whose doctor switched department.'
    EmrLayoutSource:
      type: string
      enum: [PUBLISHED, STARTER]
      description: 'PUBLISHED = a published version of the department; STARTER = the department was never published, so its starter layout is used ("Using the starter layout").'
    EmrDepartmentChoice:
      type: object
      required: [departmentKey, departmentName, starterKey, layoutSource, versionNo, choiceSource]
      properties:
        departmentKey: { $ref: '#/components/schemas/DepartmentKey' }
        departmentName: { type: string, maxLength: 60 }
        starterKey: { oneOf: [{ $ref: '#/components/schemas/StarterKey' }, { type: 'null' }], description: 'Pass it as specialty to the master and quick-option searches.' }
        layoutSource: { $ref: '#/components/schemas/EmrLayoutSource' }
        versionNo: { type: [integer, 'null'], minimum: 1, description: 'Null when layoutSource is STARTER.' }
        choiceSource: { $ref: '#/components/schemas/EmrChoiceSource' }
    EmrDoctorContext:
      type: object
      required: [membershipId, name, role, specialty, degree, registrationNo, missing, department, departments]
      properties:
        membershipId: { type: string, format: uuid }
        name: { type: string, description: 'From the user, not the doctor details. Screen only, never logged.' }
        role: { type: string, enum: [OWNER, DOCTOR, VISITING_DOCTOR] }
        specialty: { type: [string, 'null'], maxLength: 120, description: As saved in Team and access (free text). }
        degree: { type: [string, 'null'], maxLength: 120 }
        registrationNo: { type: [string, 'null'], maxLength: 80, description: Never logged. }
        missing: { type: array, items: { type: string, enum: [DEGREE, REGISTRATION_NO] }, description: 'Empty fields the case paper needs (NMC rule as written in the BRD). Nothing is blocked (OQ-43-11).' }
        department: { $ref: '#/components/schemas/EmrDepartmentChoice' }
        departments:
          type: array
          maxItems: 65
          description: 'Published departments this doctor is assigned to (SAH-54-3), by name.'
          items:
            type: object
            required: [departmentKey, name]
            properties:
              departmentKey: { $ref: '#/components/schemas/DepartmentKey' }
              name: { type: string, maxLength: 60 }
    EmrPart:
      type: string
      enum: [ASSESSMENT, TREATMENT]
    EmrSectionKind:
      type: string
      enum: [COMMON, SPECIALTY, COMPLIANCE]
      description: 'Mockup groups core, spec, comp. Tag on the row: "Common", "<initials> specialty", "Compliance".'
    EmrFillerRole:
      type: string
      enum: [DOCTOR, NURSE, RECEPTION]
      description: '"Who can fill this section": Doctor, Nurse / assistant, Reception. Stored and shown only; no role but the doctor writes the EMR in phases 1 and 2 (OQ-45-14).'
    EmrFieldType:
      type: string
      enum: [TEXT, RICH_TEXT, NUMBER, NUMBER_UNIT, NUMBER_TREND, CALCULATED, FORMULA, RULE, REFERENCE, DATE, CALENDAR, TOGGLE, DROPDOWN, DROPDOWNS, SINGLE_CHOICE, MULTI_SELECT, CHECKLIST, CHIPS, SEARCH_LIST, TABLE, GRID, PATTERN, TEMPLATE, DOCTOR_HOSPITAL, CHART, BODY_MAP, TOOTH_PICKER, LIBRARY, FILE, SIGNATURE]
      description: >-
        ADR-020 D3. The 30 field types of the mockup library (labels such as "Number + unit", "Search list", "Body
        map"). The Form builder (SAH-59) will add values; a client shows an unknown value as "Not available yet" and
        never fails. The screen label of a type is the mockup's (for example NUMBER_UNIT "Number + unit").
    EmrValueKind:
      type: string
      enum: [TEXT, NUMBER, NUMBER_UNIT, DATE, BOOLEAN, CHOICE, MULTI_CHOICE, ITEM_LIST, TABLE, STRUCTURED, DISPLAY_ONLY, LATER, COMPONENT, COVERED]
      description: >-
        0.4.0 (ADR-022 D2): COMPONENT = the field is a shared component (EmrFieldDefinition.component says which) and
        stores EmrListValue, EmrPrescriptionValue or EmrBodyMapValue; COVERED = a sibling the component replaces (for
        example complaints.duration, rx.dose_frequency): not rendered, not stored, never required.
        How the generic renderer edits and stores a field (ADR-020 D3, fixed by type). Stored JSON: TEXT string
        (TEXT, PATTERN, DOCTOR_HOSPITAL up to 2,000; RICH_TEXT plain text up to 10,000; no HTML); NUMBER number
        (finite, at most 4 decimals, field min and max when set, else -1000000 to 1000000); NUMBER_UNIT
        EmrNumberUnitValue; DATE "YYYY-MM-DD"; BOOLEAN boolean; CHOICE string (an option key, or free text up to 200
        when the field has no options); MULTI_CHOICE array of up to 50 such strings; ITEM_LIST array of up to 50
        EmrItemListEntry; TABLE array of up to 50 rows, each an object of column key to string up to 500; STRUCTURED
        EmrStructuredValue; DISPLAY_ONLY and LATER store nothing (DISPLAY_ONLY shows the meta text; LATER shows the
        control disabled with a "Later" note, OQ-45-28). Empty means null, "", or an empty array.
    EmrOptionsSource:
      type: string
      enum: [NONE, FIELD, MASTER, SERVICES]
      description: 'NONE: no list (free text). FIELD: the field''s own options. MASTER: a SAH-43 master (search GET /emr/masters, GET /diagnoses, GET /medicines; quick options apply). SERVICES: the clinic''s active services (GET /services?active=true).'
    EmrFieldOption:
      type: object
      required: [key, label, isNone]
      properties:
        key: { $ref: '#/components/schemas/FieldKey' }
        label: { type: string, minLength: 1, maxLength: 80 }
        isNone: { type: boolean, description: 'The "None" or "Nothing abnormal" option of a required choice field (SAH-53-1). 0.7.0: with presentation CHIPS, choosing it clears the field''s other chips and choosing another clears it.' }
        alert: { type: boolean, default: false, description: '0.7.0 (SAH-75-6, ADR-026 D6). Shown red when chosen (for example a tobacco habit, an ulcer). Seed data, tagged; false when absent (older versions).' }
        hint: { type: [string, 'null'], minLength: 1, maxLength: 60, description: '0.7.1 (ADR-026 D13). Second line of a tile, as drawn (Contraception "Barrier", "Daily pill", "IUCD, 5–10 years"). Seed data, tagged; null when absent (options and versions saved before 0.7.1, and every option without a drawn second line).' }
    EmrTableColumn:
      type: object
      required: [key, label]
      properties:
        key: { $ref: '#/components/schemas/FieldKey' }
        label: { type: string, maxLength: 80 }
    EmrFieldDefinition:
      type: object
      required: [key, label, type, valueKind, meta, required, optionsSource, master, allowFreeText, options, columns, min, max]
      properties:
        key: { $ref: '#/components/schemas/FieldKey' }
        label: { type: string, minLength: 1, maxLength: 120 }
        type: { $ref: '#/components/schemas/EmrFieldType' }
        valueKind: { $ref: '#/components/schemas/EmrValueKind' }
        meta: { type: string, maxLength: 200, description: 'The grey hint under the label, as in the mockup (for example "mmHg · alert above 140").' }
        required: { type: boolean, description: 'Required field: the section is Done only when it is filled (fillable kinds only).' }
        optionsSource: { $ref: '#/components/schemas/EmrOptionsSource' }
        master: { oneOf: [{ $ref: '#/components/schemas/EmrMaster' }, { type: 'null' }], description: 'Set only when optionsSource is MASTER.' }
        allowFreeText: { type: boolean, description: 'A typed entry not in the list is accepted ("New to list" for search lists; it stays on this patient''s record only, OQ-45-17).' }
        options: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/EmrFieldOption' }, description: 'Empty unless optionsSource is FIELD.' }
        columns: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/EmrTableColumn' }, description: 'TABLE kind only; one column entry "Entry" when the mockup gives none.' }
        min: { type: [number, 'null'], description: 'NUMBER kinds only; null in the seed (no range is drawn).' }
        max: { type: [number, 'null'] }
        presentation:
          type: string
          enum: [DEFAULT, CHIPS]
          default: DEFAULT
          description: >-
            0.7.0 (SAH-75-6, ADR-026 D6). CHIPS: a CHOICE field is a single-choice chip row (pressing the chosen chip again
            clears it) and a MULTI_CHOICE field a many-choice chip row; chips are 44 px high (OQ-45-30). Seed data (the
            Dental assessment cards dental_hx, dental_pain, dental_extraoral, dental_intraoral, dental_xray,
            dental_medhx). DEFAULT when absent (versions and starter layouts saved before 0.7.0). Stored values do not
            change: CHOICE an option key, MULTI_CHOICE an array of option keys. 0.7.1 (ADR-026 D13): also menstrual.cycle,
            menstrual.cycle_length, menstrual.flow, menstrual.dysmenorrhoea ("Pain") and contraception.method. When at least
            one option of a CHIPS field has a hint, the field draws as tiles instead of a chip row: one tile per option in
            a three-column grid (two below 600 px), label in bold and the hint as a second line, at least 56 px high, the
            chosen tile with a 2 px accent border and the accent tint; choice and clearing rules are the chip rules.
        component:
          type: [object, 'null']
          description: '0.4.0 (ADR-022 D2). Set only when valueKind is COMPONENT. Fixed in code from the field type and options source.'
          required: [type, listKind]
          properties:
            type: { type: string, enum: [EMR_LIST, PRESCRIPTION, BODY_MAP, FOLLOW_UP, IPD_ORDERS], description: '0.6.0 (ADR-025 D6, D8): FOLLOW_UP on followup.next_visit of OPD_VISIT records (EmrFollowUpValue; followup.reason is COVERED); IPD_ORDERS on rx.drug of IPD_ROUND records (EmrIpdOrdersValue, instead of PRESCRIPTION). The binding depends on the record''s encounter type and is computed on read, never stored in versions.' }
            listKind: { oneOf: [{ $ref: '#/components/schemas/EmrListKind' }, { type: 'null' }], description: 'EMR_LIST only.' }
            billsVisit: { type: boolean, description: 'True only for procedures.procedure on an OPD visit: BILL_TODAY items become visit bill lines (SAH-48-4).' }
    EmrLibrarySection:
      type: object
      required: [key, name, kind, description, alwaysShown, fields, usedBy]
      properties:
        key: { $ref: '#/components/schemas/SectionKey' }
        name: { type: string, minLength: 1, maxLength: 120 }
        kind: { $ref: '#/components/schemas/EmrSectionKind' }
        description: { type: string, maxLength: 500 }
        alwaysShown: { type: boolean, description: 'True only for Allergies: it cannot be hidden in any department (OQ-45-6).' }
        fields: { type: array, maxItems: 40, items: { $ref: '#/components/schemas/EmrFieldDefinition' } }
        usedBy: { type: array, items: { $ref: '#/components/schemas/StarterKey' }, description: 'Starters that place this section.' }
    EmrLayoutSection:
      type: object
      description: 'One section of a layout with its settings and definition (configurator, versions, starter, doctor layout, record snapshot).'
      required: [key, source, name, kind, description, part, position, shown, required, print, copy, collapsed, whoCanFill, hideLocked, hideLockReason, fields]
      properties:
        key: { $ref: '#/components/schemas/SectionKey' }
        source: { type: string, enum: [LIBRARY, FORM], description: 'LIBRARY: a library section. FORM (0.4.0, SAH-59): a clinic form as a custom section (tag "Custom"); key = formKey; fields is empty and form carries the definition.' }
        formKey: { oneOf: [{ $ref: '#/components/schemas/EmrFormKey' }, { type: 'null' }], description: 'FORM only.' }
        formVersionNo: { type: [integer, 'null'], minimum: 1, description: 'FORM only, in a record snapshot: the form version the record was opened with. Null in department layouts (they resolve the live version at open).' }
        form: { oneOf: [{ $ref: '#/components/schemas/EmrFormDefinition' }, { type: 'null' }], description: 'FORM only, in a record snapshot or the doctor layout: the definition of that version.' }
        name: { type: string, maxLength: 120 }
        kind: { $ref: '#/components/schemas/EmrSectionKind' }
        description: { type: string, maxLength: 500 }
        part: { $ref: '#/components/schemas/EmrPart' }
        position: { type: integer, minimum: 1, description: 'Position in the department''s overall order (both parts).' }
        shown: { type: boolean, description: 'Show in EMR ("Doctor sees this section in <department>").' }
        required: { type: boolean, description: 'Required to close visit; always false when shown is false.' }
        print: { type: boolean, description: 'Print on prescription ("Appears on the printed Rx / summary"). Chooses which sections reach the printed Rx; size, language, letterhead and capitals stay in Case paper and Rx (OQ-45-10).' }
        copy: { type: boolean, description: 'Copy from last visit ("Pre-fills with the previous values").' }
        collapsed: { type: boolean, description: 'Collapsed by default ("Doctor taps to open it").' }
        whoCanFill: { type: array, uniqueItems: true, maxItems: 3, items: { $ref: '#/components/schemas/EmrFillerRole' } }
        hideLocked: { type: boolean, description: 'Show is fixed on: Allergies everywhere; PCPNDT Form F in a department started from Obstetrics & Gynaecology (OQ-45-7, OQ-45-29 default).' }
        hideLockReason: { type: [string, 'null'], maxLength: 200, description: 'Short reason shown next to the locked switch, for example "Allergies are always shown for patient safety."' }
        fields: { type: array, maxItems: 40, items: { $ref: '#/components/schemas/EmrFieldDefinition' }, description: 'Read-only list "Fields (n)" in the configurator (SO-45-9: "+ Add field" is not available).' }
        specialtyEditor:
          type: [object, 'null']
          description: '0.5.0 (ADR-023 D1, D3). Only in a record snapshot: set when the record''s specialty profile has an editor for this section key. The section''s value is then {"specialty": EmrSpecialtyValue} with this component; its library fields return valueKind COVERED. Computed on read, never stored in versions. Null in configurator, version and doctor-layout reads.'
          required: [component, profile]
          properties:
            component: { $ref: '#/components/schemas/EmrSpecialtyComponent' }
            profile: { $ref: '#/components/schemas/EmrSpecialtyProfile' }
    EmrLayoutSettingsSection:
      type: object
      additionalProperties: false
      required: [key, part, shown, required, print, copy, collapsed, whoCanFill]
      properties:
        key: { $ref: '#/components/schemas/SectionKey' }
        part: { $ref: '#/components/schemas/EmrPart' }
        shown: { type: boolean }
        required: { type: boolean }
        print: { type: boolean }
        copy: { type: boolean }
        collapsed: { type: boolean }
        whoCanFill: { type: array, uniqueItems: true, maxItems: 3, items: { $ref: '#/components/schemas/EmrFillerRole' } }
    EmrLayoutSettingsInput:
      type: object
      additionalProperties: false
      description: 'Save draft and Publish body. The array order is the department order; every section of the department exactly once. Moving to the other part changes part only; Up and Down swap with the next section of the same part.'
      required: [revision, origin, sections]
      properties:
        revision: { type: integer, format: int64, minimum: 0, description: 'From GET /emr/departments/{departmentKey}; 0 for a department never saved.' }
        origin: { type: string, enum: [EDIT, RESET], description: 'RESET when the working copy came from "Reset to template" (audit EMR_DEPARTMENT_RESET). Publish accepts both and audits EMR_DEPARTMENT_PUBLISHED.' }
        sections: { type: array, minItems: 1, maxItems: 120, items: { $ref: '#/components/schemas/EmrLayoutSettingsSection' } }
        tenantId: { description: 'Accepted and ignored (the clinic is the signed-in user''s).' }
        clinicId: { description: 'Accepted and ignored.' }
    EmrStarterSummary:
      type: object
      required: [starterKey, name, initials, colour, description, sectionCount, specialtySectionCount, offAtStart]
      properties:
        starterKey: { $ref: '#/components/schemas/StarterKey' }
        name: { type: string, maxLength: 60 }
        initials: { type: string, pattern: '^[A-Z0-9]{1,3}$' }
        colour: { type: string, pattern: '^#[0-9A-F]{6}$' }
        description: { type: [string, 'null'], maxLength: 300, description: 'Wizard "Template preview" line; drawn only for Physiotherapy, null for the others.' }
        sectionCount: { type: integer, minimum: 1 }
        specialtySectionCount: { type: integer, minimum: 0, description: 'The number on the wizard card.' }
        offAtStart: { type: array, items: { type: string }, description: 'Names for "Turned off by default: <sections>. You can switch them back on."' }
    EmrStarterDetail:
      allOf:
        - { $ref: '#/components/schemas/EmrStarterSummary' }
        - type: object
          required: [layoutVersion, sections]
          properties:
            layoutVersion: { type: integer, minimum: 1, description: 'Starter layout version (changes only by migration). 0.7.0: every starter moves to a new version by the SAH-75-4 seed (rxformat not required everywhere; required and shown defaults of the doctor screens; local_exam in gm and surgery; the six Dental cards); visits already opened keep their version.' }
            sections: { type: array, items: { $ref: '#/components/schemas/EmrLayoutSection' }, description: 'Every section, hidden ones too, in starter order.' }
    EmrDepartmentStatus:
      type: string
      enum: [TEMPLATE, DRAFT, LIVE]
      description: 'TEMPLATE = never saved by the clinic (v0); DRAFT = saved, never published; LIVE = at least one published version (OQ-45-11).'
    EmrDepartmentSummary:
      type: object
      required: [departmentKey, name, initials, colour, starterKey, sourceKind, copiedFromKey, status, publishedVersion, hasDraft, sectionsTotal, sectionsOn, requiredOn, doctorCount, rooms]
      properties:
        departmentKey: { $ref: '#/components/schemas/DepartmentKey' }
        name: { type: string, minLength: 1, maxLength: 60 }
        initials: { type: string, pattern: '^[A-Z0-9]{1,3}$' }
        colour: { type: string, pattern: '^#[0-9A-F]{6}$' }
        starterKey: { oneOf: [{ $ref: '#/components/schemas/StarterKey' }, { type: 'null' }], description: 'Null for a department started blank.' }
        sourceKind: { type: string, enum: [STARTER, BLANK, COPY] }
        copiedFromKey: { oneOf: [{ $ref: '#/components/schemas/DepartmentKey' }, { type: 'null' }] }
        status: { $ref: '#/components/schemas/EmrDepartmentStatus' }
        publishedVersion: { type: integer, minimum: 0, description: 'Shown as v<n>; 0 = never published.' }
        hasDraft: { type: boolean, description: 'A saved draft differs from what doctors see.' }
        sectionsTotal: { type: integer, minimum: 0 }
        sectionsOn: { type: integer, minimum: 0, description: '"x of y sections on": shown sections of the working layout.' }
        requiredOn: { type: integer, minimum: 0 }
        doctorCount: { type: integer, minimum: 0 }
        rooms: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 40 } }
    EmrDepartmentList:
      type: object
      required: [canEdit, departments]
      properties:
        canEdit: { type: boolean, description: 'True only for OWNER; others see the page read-only with "Only the owner can change this."' }
        departments: { type: array, maxItems: 65, items: { $ref: '#/components/schemas/EmrDepartmentSummary' } }
    EmrDepartmentView:
      allOf:
        - { $ref: '#/components/schemas/EmrDepartmentSummary' }
        - type: object
          required: [canEdit, revision, layoutSource, sections]
          properties:
            canEdit: { type: boolean }
            revision: { type: integer, format: int64, minimum: 0, description: 'Send back with Save draft or Publish. 0 for a department never saved.' }
            layoutSource: { type: string, enum: [DRAFT, PUBLISHED, STARTER], description: 'Where the working layout comes from; also the baseline of the unsaved-changes count.' }
            sections:
              type: array
              items: { $ref: '#/components/schemas/EmrLayoutSection' }
              description: >-
                Every section, hidden ones too, in the working order. 0.7.0 (SAH-75-4, ADR-026 D2; changed): the
                department's section set is the latest published version's sections plus the current starter layout's
                sections (when the department has a starterKey) plus live forms, and Save draft and Publish check
                against that set. A starter section the working copy lacks is appended at its starter position: for a
                department with a published version with shown false and required false (offered for adding: the owner
                switches Show on; doctors see nothing new until a publish), for a department never published with the
                starter's own settings. Nothing is written by the read. A section never leaves the set. "Reset to
                template" returns the current starter's settings.
    EmrDraftSaveResult:
      type: object
      required: [outcome, department]
      properties:
        outcome: { type: string, enum: [SAVED, NOTHING_NEW], description: 'SAVED: "Draft saved. Doctors still see the published layout." NOTHING_NEW: "Nothing new to save".' }
        department: { $ref: '#/components/schemas/EmrDepartmentView' }
    EmrPublishResult:
      type: object
      required: [outcome, publishedVersion, department]
      properties:
        outcome: { type: string, enum: [PUBLISHED, NOTHING_TO_PUBLISH], description: 'PUBLISHED: "<department> published as v<n>. New visits use it from now." NOTHING_TO_PUBLISH: "Nothing to publish".' }
        publishedVersion: { type: integer, minimum: 0 }
        department: { $ref: '#/components/schemas/EmrDepartmentView' }
    EmrResetTarget:
      type: object
      required: [departmentKey, basis, sections]
      properties:
        departmentKey: { $ref: '#/components/schemas/DepartmentKey' }
        basis: { type: string, enum: [STARTER, BLANK] }
        sections: { type: array, items: { $ref: '#/components/schemas/EmrLayoutSettingsSection' }, description: 'Starting settings for exactly this department''s sections, in starter order.' }
    EmrPublishedLayout:
      type: object
      required: [departmentKey, departmentName, starterKey, layoutSource, versionNo, sections]
      properties:
        departmentKey: { $ref: '#/components/schemas/DepartmentKey' }
        departmentName: { type: string }
        starterKey: { oneOf: [{ $ref: '#/components/schemas/StarterKey' }, { type: 'null' }] }
        layoutSource: { $ref: '#/components/schemas/EmrLayoutSource' }
        versionNo: { type: [integer, 'null'], minimum: 1 }
        sections: { type: array, items: { $ref: '#/components/schemas/EmrLayoutSection' }, description: 'Shown sections only, in order.' }
    EmrDepartmentVersion:
      type: object
      required: [departmentKey, versionNo, publishedAt, publishedByName, sections]
      properties:
        departmentKey: { $ref: '#/components/schemas/DepartmentKey' }
        versionNo: { type: integer, minimum: 1 }
        publishedAt: { type: string, format: date-time }
        publishedByName: { type: string }
        sections: { type: array, items: { $ref: '#/components/schemas/EmrLayoutSection' }, description: 'Every section as published, hidden ones too.' }
    EmrDepartmentCreateInput:
      type: object
      additionalProperties: false
      required: [name, source, copyPrintFlags, doctorMembershipIds, rooms]
      properties:
        name: { type: string, minLength: 1, maxLength: 60, description: 'Trimmed; unique in the clinic ignoring case, counting the 15 starter names.' }
        initials: { type: [string, 'null'], pattern: '^[A-Z0-9]{1,3}$', description: 'Derived from the name when null.' }
        colour: { type: [string, 'null'], pattern: '^#[0-9A-F]{6}$', description: 'From a fixed palette when null.' }
        source:
          type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { type: string, enum: [STARTER, BLANK, COPY] }
            starterKey: { $ref: '#/components/schemas/StarterKey' }
            copyFromDepartmentKey: { $ref: '#/components/schemas/DepartmentKey' }
          description: 'starterKey is required for STARTER, copyFromDepartmentKey for COPY; neither for BLANK (400 validation otherwise).'
        copyPrintFlags: { type: boolean, description: '"Also create a matching print template". False clears every Print flag.' }
        sections: { type: array, maxItems: 120, items: { $ref: '#/components/schemas/EmrLayoutSettingsSection' }, description: 'Optional (step 2 Review sections). When sent, replaces the source settings and follows the draft rules.' }
        doctorMembershipIds: { type: array, maxItems: 50, uniqueItems: true, items: { type: string, format: uuid } }
        rooms: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 40 }, description: 'Text labels such as "Room 2" or "Chair 1" (OQ-45-19); unique ignoring case.' }
        tenantId: { description: 'Accepted and ignored.' }
        clinicId: { description: 'Accepted and ignored.' }
    EmrDoctorOption:
      type: object
      required: [membershipId, name, role, degree]
      properties:
        membershipId: { type: string, format: uuid }
        name: { type: string, description: 'Screen only, never logged.' }
        role: { type: string, enum: [DOCTOR, VISITING_DOCTOR] }
        degree: { type: [string, 'null'], maxLength: 120 }
    EmrEncounterType:
      type: string
      enum: [OPD_VISIT, IPD_ROUND, ER_ASSESSMENT]
      description: 'OPD_VISIT opens as "Consultation" (encounterId = OPD visit id); IPD_ROUND as "Daily progress note" (encounterId = IPD admission id; one record per Asia/Kolkata day, OQ-43-27 default); ER_ASSESSMENT as "Emergency assessment" (encounterId = emergency case id).'
    EmrOpenInput:
      type: object
      additionalProperties: false
      required: [encounterType, encounterId]
      properties:
        encounterType: { $ref: '#/components/schemas/EmrEncounterType' }
        encounterId: { type: string, format: uuid }
    EmrStageOutcome:
      type: string
      enum: [MOVED, ALREADY_WITH_DOCTOR, ALREADY_UPDATED, NOT_APPLICABLE]
      description: 'SAH-46-2. ALREADY_UPDATED: the visit was moved by someone else or the workflow did not allow the move; the EMR still opens and the page says the queue status was already updated. NOT_APPLICABLE: IPD, Emergency, or an OPD stage after With doctor.'
    EmrOpenResult:
      type: object
      required: [created, stageOutcome, record]
      properties:
        created: { type: boolean }
        stageOutcome: { $ref: '#/components/schemas/EmrStageOutcome' }
        record: { $ref: '#/components/schemas/EmrRecordView' }
    AgeDetail:
      type: object
      description: >-
        0.5.3 (SAH-73, ADR-024 D1, D2; same shape as docs/api/patient.yaml AgeDetail, filled by patient.api). With a
        date of birth, as of today IST: completed years 2 or more → YEARS; else completed months 3 or more → MONTHS (3
        to 23); else days 14 or more → WEEKS (days ÷ 7 floored); else DAYS (0 to 13). Without one: YEARS with the stored
        whole number. Text: YEARS "<n> yrs", MONTHS "<n> months", WEEKS "<n> weeks", DAYS "<n> days" ("1 day").
      required: [value, unit, fromDateOfBirth]
      properties:
        value: { type: integer, minimum: 0, maximum: 130 }
        unit: { type: string, enum: [YEARS, MONTHS, WEEKS, DAYS] }
        fromDateOfBirth: { type: boolean }
    EmrRecordHeader:
      type: object
      description: 'SAH-47-1, SAH-52-1. Screen only: never logged, audited or put in an error message.'
      required: [patientId, patientName, initials, age, sex, uhid, allergyText, allergyStatus, chronicText, lastVisitDaysAgo, visitOrdinal, visitType, doctor, admission, emergency]
      properties:
        patientId: { type: [string, 'null'], format: uuid, description: 'Null for an Emergency case not yet admitted (no patient record exists, ADR-005).' }
        patientName: { type: string, maxLength: 120, description: 'For an Emergency case without a patient, the case display name (for example "Unknown male, about 40").' }
        initials: { type: string, maxLength: 3 }
        age: { type: [integer, 'null'], minimum: 0, maximum: 130, description: '0.5.3: effective completed years from patient.api.' }
        ageDetail: { oneOf: [{ $ref: '#/components/schemas/AgeDetail' }, { type: 'null' }], description: '0.5.3 (SAH-73-4). Null when patientId is null. The Paediatrics header shows it ("18 months · Boy"); other departments show age as before.' }
        sex: { type: string, enum: [F, M, O] }
        uhid: { type: [string, 'null'], description: 'Null shows "New patient".' }
        allergyText: { type: [string, 'null'], description: 'Red tag "Allergy: <text>" only when recorded; null shows no red tag (OQ-45-23). Changed in 0.7.1 (ADR-026 D12): null unless allergyStatus is RECORDED.' }
        allergyStatus:
          type: string
          enum: [RECORDED, NONE_RECORDED, NOT_RECORDED]
          description: >-
            0.7.1 (SAH-75-7, SAH-75-11 P6, ADR-026 D12; OQ-45-23). Worked out by the patient module from the patient
            record's allergy text (patient.api PatientClinical.allergyStatus), never from the request. NOT_RECORDED: no
            text (null or blank); nothing was asked or written. NONE_RECORDED: the whole text, trimmed, ignoring case and
            trailing full stops, is one none word: none, nil, nka, nkda, none known, no known allergy, no known allergies,
            no known drug allergy, no known drug allergies (the doctor's explicit "None" at sign writes "No known
            allergy", ADR-025 D13; the Dental "None" chip writes the same, ADR-026 D6). RECORDED: any other text
            (allergyText holds it). Paediatrics draws the grey chip "No known allergy" and Oncology the grey watch chip
            "No known drug allergy" only for NONE_RECORDED; every department shows the red tag only for RECORDED and
            nothing for NOT_RECORDED. Null patientId (Emergency case without a patient): NOT_RECORDED. Screen only: never
            logged, audited or put in a problem detail.
        chronicText: { type: [string, 'null'], description: 'Amber tag "Known: <text>".' }
        mlc: { type: boolean, description: '0.4.0 (SAH-57-3). True when a body map of this record has an MLC pin: header tag "MLC" (text and colour).' }
        lastVisitDaysAgo: { type: [integer, 'null'], minimum: 0, description: '"Last visit: n days ago"; null when there is no earlier visit.' }
        visitOrdinal: { type: [integer, 'null'], minimum: 1, description: 'OPD only: "3rd visit".' }
        visitType: { type: [string, 'null'], enum: [NEW, FOLLOW_UP, REVISIT, EMERGENCY, null], description: 'OPD only; the control of SAH-52-2. EMERGENCY (0.6.0): header tag "Emergency" and the control reads "Emergency · <triageLevelName>".' }
        triageLevel: { type: [integer, 'null'], minimum: 1, maximum: 5, description: '0.6.0. OPD visit of type EMERGENCY only.' }
        triageLevelName: { type: [string, 'null'], description: '0.6.0. As Visit.triageLevelName.' }
        doctor:
          type: object
          required: [membershipId, name, room]
          properties:
            membershipId: { type: string, format: uuid }
            name: { type: string }
            room: { type: [string, 'null'], description: 'The department''s first room label.' }
        admission:
          type: [object, 'null']
          description: 'IPD_ROUND only, read from ipd ("IPD · day n").'
          required: [admissionId, ipNumber, dayNumber, status]
          properties:
            admissionId: { type: string, format: uuid }
            ipNumber: { type: string }
            dayNumber: { type: integer, minimum: 1 }
            status: { type: string }
        emergency:
          type: [object, 'null']
          description: 'ER_ASSESSMENT only, read from ipd (read-only triage level).'
          required: [caseId, triageLevel, triageLevelName, status]
          properties:
            caseId: { type: string, format: uuid }
            triageLevel: { type: integer, minimum: 1 }
            triageLevelName: { type: string }
            status: { type: string }
    EmrSnapshot:
      type: object
      description: 'SAH-46-3 (ADR-020 D8). The layout the record was opened with, expanded from an immutable published version or starter layout: shown sections only, in order. Later publishes, resets and setting changes never alter it.'
      required: [departmentKey, departmentName, starterKey, layoutSource, versionNo, choiceSource, takenAt, sections]
      properties:
        departmentKey: { $ref: '#/components/schemas/DepartmentKey' }
        departmentName: { type: string }
        starterKey: { oneOf: [{ $ref: '#/components/schemas/StarterKey' }, { type: 'null' }] }
        layoutSource: { $ref: '#/components/schemas/EmrLayoutSource' }
        versionNo: { type: [integer, 'null'], minimum: 1, description: 'Department version, or the starter layout version when layoutSource is STARTER.' }
        choiceSource: { $ref: '#/components/schemas/EmrChoiceSource' }
        takenAt: { type: string, format: date-time }
        sections: { type: array, items: { $ref: '#/components/schemas/EmrLayoutSection' } }
    EmrSectionStatus:
      type: string
      enum: [DONE, REQUIRED, OPTIONAL]
      description: 'Card tag Done, Required or Optional. Done: every required fillable field filled; with no required field, at least one field filled; never while copied values wait for confirmation (OQ-45-25, OQ-45-26).'
    EmrRecordSection:
      type: object
      required: [key, status, values, copiedFrom, copyPendingConfirmation, updatedAt]
      properties:
        key: { $ref: '#/components/schemas/SectionKey' }
        status: { $ref: '#/components/schemas/EmrSectionStatus' }
        values: { type: object, additionalProperties: true, description: 'Field key to value, shaped by the field''s valueKind (EmrValueKind). Empty object when nothing is entered.' }
        copiedFrom:
          type: [object, 'null']
          description: '"Copied from <date>": the last signed record of the same department. 0.7.1 (ADR-026 D13): a generic field value is copied only when it fits the new record''s field definition (same valueKind; for CHOICE and MULTI_CHOICE fields with FIELD options, every key is an option of the new definition); a value that does not fit is left out, never an error. When nothing of a section fits, the section is not copied.'
          required: [recordId, date]
          properties:
            recordId: { type: string, format: uuid }
            date: { type: string, format: date }
        copyPendingConfirmation: { type: boolean }
        updatedAt: { type: [string, 'null'], format: date-time }
        legacyValues: { type: [object, 'null'], additionalProperties: true, readOnly: true, description: '0.5.0 (ADR-023 D2). Generic values saved in phases 2 and 3 for a section that now has a specialty editor; shown read-only until the first specialty save replaces them. 0.6.0: also the old next_visit and reason values of an OPD follow-up section, now the FOLLOW_UP component.' }
        prefilledFrom:
          type: [object, 'null']
          readOnly: true
          description: '0.6.0 (SAH-68-1). "Recorded by <recordedByName> · Nurse at <time>" while the values are the nurse''s entry; null once the doctor changed them.'
          required: [source, sourceEntryId, recordedByName, recordedAt]
          properties:
            source: { type: string, enum: [IPD_NURSING_CHART] }
            sourceEntryId: { type: string, format: uuid }
            recordedByName: { type: string }
            recordedAt: { type: string, format: date-time }
    EmrPartProgress:
      type: object
      required: [part, requiredDone, requiredTotal, complete, sectionsDone, sectionsTotal]
      properties:
        part: { $ref: '#/components/schemas/EmrPart' }
        requiredDone: { type: integer, minimum: 0, description: 'Badge "n of m required".' }
        requiredTotal: { type: integer, minimum: 0 }
        complete: { type: boolean, description: 'Tick replaces the number (also when requiredTotal is 0).' }
        sectionsDone: { type: integer, minimum: 0, description: 'Left list "done/total".' }
        sectionsTotal: { type: integer, minimum: 0 }
    EmrRecordView:
      type: object
      required: [id, encounterType, encounterId, roundDate, status, readOnly, readOnlyReason, revision, header, layout, sections, parts, stillNeeded, readyToComplete, uiState, admissionAdvised, referralLine, departmentOptions, ipd]
      properties:
        id: { type: string, format: uuid }
        encounterType: { $ref: '#/components/schemas/EmrEncounterType' }
        encounterId: { type: string, format: uuid }
        roundDate: { type: [string, 'null'], format: date, description: 'IPD_ROUND only (Asia/Kolkata day).' }
        status: { type: string, enum: [DRAFT, SIGNED], description: 'SIGNED arrives with SAH-51 (0.6.0): immutable; "Complete" is not shown; corrections are addenda.' }
        readOnly: { type: boolean }
        readOnlyReason: { type: [string, 'null'], enum: [SIGNED, ENCOUNTER_CLOSED, IPD_READ_ONLY, HISTORY, HELD_BY_OTHER, null], description: 'HISTORY (0.4.0): an earlier signed record opened from Past visits. HELD_BY_OTHER (0.6.0): another doctor holds the edit hold; banner "Open for editing by Dr. <editHold.holderName>", no Save draft, Complete or change controls; "Edit this visit" once editHold has expired, "Take over" for canTakeOver.' }
        signedAt: { type: [string, 'null'], format: date-time, description: '0.6.0. Shown in IST ("24 Oct 2026, 11:05 AM IST").' }
        signedByName: { type: [string, 'null'], description: '0.6.0. The signing doctor''s name, read through platform.api.' }
        editHold: { oneOf: [{ $ref: '#/components/schemas/EmrEditHold' }, { type: 'null' }], description: '0.6.0 (SAH-51-4). Null when nobody holds the record or it is signed.' }
        addenda: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/EmrAddendum' }, description: '0.6.0 (SAH-51-5). Newest last; shown under the signature as "Addendum · <date and time> · Dr. <name>: <reason>. <text>".' }
        admission: { $ref: '#/components/schemas/EmrAdmissionState' }
        canAddAddendum: { type: boolean, description: '0.6.0. SIGNED, the caller is the record''s doctor or OWNER with doctor details, fewer than 50 addenda.' }
        allergyAlerts: { type: array, maxItems: 60, items: { $ref: '#/components/schemas/EmrAllergyAlert' }, description: '0.4.0 (SAH-48-2, ADR-022 D5). Drug-class clashes of active prescription rows (and form medicine lists) with the allergy classes picked in this visit''s Allergies section. 0.7.0 (SAH-75-6, ADR-026 D6): also the classes of the allergy chips of the Dental "Medical history and alerts" card (PENICILLIN); the class-set change rule of ADR-022 D5 applies to the union.' }
        completeBlockers: { type: array, items: { type: string, enum: [ALLERGY_ALERT] }, description: '0.4.0. ALLERGY_ALERT: footer "Remove the drug or confirm the allergy alert before completing." in place of "Still needed"; readyToComplete is false.' }
        lastSignedPrescription:
          type: [object, 'null']
          description: '0.4.0 (SAH-48-1). The patient''s latest signed record with medicines; null disables "Repeat last Rx" with "No earlier prescription" (always null until SAH-51).'
          required: [recordId, date]
          properties:
            recordId: { type: string, format: uuid }
            date: { type: string, format: date }
        printPreferences: { $ref: '#/components/schemas/EmrPrintPreferences' }
        prescriptionIsOrder: { type: boolean, description: '0.4.0. False: the EMR prescription never creates an IPD medicine order (SAH-31 stays the only path, OQ-43-24). 0.6.0 (SAH-67-1, ADR-025 D8): true on IPD_ROUND records, whose Prescription field is the IPD_ORDERS component; its rows are placed at sign by ipd''s own SAH-31 order path (allergy, duplicate and interaction checks, pharmacist check). False on OPD_VISIT and ER_ASSESSMENT records.' }
        revision: { type: integer, format: int64, minimum: 0 }
        header: { $ref: '#/components/schemas/EmrRecordHeader' }
        layout: { $ref: '#/components/schemas/EmrSnapshot' }
        sections: { type: array, items: { $ref: '#/components/schemas/EmrRecordSection' }, description: 'One entry per section of layout, in layout order. Values of sections not in the layout (after a department switch) are kept on the server and not returned.' }
        parts: { type: array, minItems: 2, maxItems: 2, items: { $ref: '#/components/schemas/EmrPartProgress' } }
        stillNeeded: { type: array, items: { $ref: '#/components/schemas/SectionKey' }, description: 'Required sections not Done, in layout order: footer "Still needed: <names>." (names from layout, lower case).' }
        readyToComplete: { type: boolean, description: 'Footer "Ready to complete." 0.6.0: Complete calls POST …/finish-check and then POST …/sign (SAH-51).' }
        stillNeededItems: { type: array, items: { $ref: '#/components/schemas/EmrStillNeededItem' }, description: '0.5.0 (ADR-023 D3). The footer list in order, with the profile''s labels and items (for example "n side effect grade(s)", "today''s decision", "OT booking"). stillNeeded and readyToComplete include these items.' }
        specialty: { oneOf: [{ $ref: '#/components/schemas/EmrSpecialtyView' }, { type: 'null' }], description: '0.5.0 (ADR-023). Null for the generic profile, IPD_ROUND and ER_ASSESSMENT records.' }
        uiState:
          type: object
          required: [part, sectionKey]
          properties:
            part: { $ref: '#/components/schemas/EmrPart' }
            sectionKey: { oneOf: [{ $ref: '#/components/schemas/SectionKey' }, { type: 'null' }] }
        admissionAdvised: { type: boolean, description: 'Header tag "Admission advised"; Admit to IPD button pressed.' }
        referralLine: { type: [string, 'null'], maxLength: 300 }
        departmentOptions:
          type: array
          description: 'Departments the doctor may switch to while the record is a draft (header switch).'
          items:
            type: object
            required: [departmentKey, name]
            properties:
              departmentKey: { $ref: '#/components/schemas/DepartmentKey' }
              name: { type: string }
        ipd:
          type: object
          required: [state, canSwitchOn]
          description: 'For the Admit to IPD button (SAH-52-4): hidden on IPD_ROUND; when state is OFF the sheet offers "Advise admission + referral" and, for the owner, "Switch on IPD".'
          properties:
            state: { type: string, enum: [OFF, TRIAL, ON, READ_ONLY] }
            canSwitchOn: { type: boolean, description: 'True only for OWNER.' }
    EmrRecordSectionInput:
      type: object
      additionalProperties: false
      required: [key, values]
      properties:
        key: { $ref: '#/components/schemas/SectionKey' }
        values: { type: object, additionalProperties: true, maxProperties: 40, description: 'All values of the section (replaces the stored ones); at most 32 KB.' }
        confirmCopy: { type: boolean, default: false, description: 'Confirms copied values (OQ-45-26).' }
        prefill:
          type: [object, 'null']
          additionalProperties: false
          description: '0.6.0 (SAH-68-1, ADR-025 D12). The nurse entry the values were pre-filled from (GET …/encounter-vitals). The server stores prefilledFrom (source, entry, recorder, time) only while the values equal that entry; when the doctor changed them it stores none and the doctor is the recorder. The nurse''s entry is never changed.'
          required: [source, sourceEntryId]
          properties:
            source: { type: string, enum: [IPD_NURSING_CHART] }
            sourceEntryId: { type: string, format: uuid }
    EmrRecordDraftInput:
      type: object
      additionalProperties: false
      required: [revision, uiState, sections]
      properties:
        revision: { type: integer, format: int64, minimum: 0 }
        uiState:
          type: object
          additionalProperties: false
          required: [part, sectionKey]
          properties:
            part: { $ref: '#/components/schemas/EmrPart' }
            sectionKey: { oneOf: [{ $ref: '#/components/schemas/SectionKey' }, { type: 'null' }] }
        sections: { type: array, maxItems: 120, items: { $ref: '#/components/schemas/EmrRecordSectionInput' }, description: 'Only sections changed since the last save; may be empty (saves the position only).' }
        screen: { oneOf: [{ $ref: '#/components/schemas/EmrScreenInput' }, { type: 'null' }], description: '0.5.0 (ADR-023 D2, D5). Screen facts; omitted or null leaves them unchanged.' }
        saveKind: { type: string, enum: [MANUAL, AUTO], default: MANUAL, description: '0.6.0 (SAH-51-3, ADR-025 D5). AUTO: the 30-second tick or the part switch; writes no EMR_RECORD_DRAFT_SAVED audit. MANUAL: "Save draft" ("Draft saved"); audited as before.' }
    EmrSwitchDepartmentInput:
      type: object
      additionalProperties: false
      required: [departmentKey, revision]
      properties:
        departmentKey: { $ref: '#/components/schemas/DepartmentKey' }
        revision: { type: integer, format: int64, minimum: 0 }
    EmrAdmissionAdviceInput:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: { type: integer, format: int64, minimum: 0 }
        referralLine: { type: [string, 'null'], minLength: 1, maxLength: 300, description: 'Optional referral line for the case paper (never logged or audited).' }
    EmrNumberUnitValue:
      type: object
      additionalProperties: false
      required: [value, unit]
      properties:
        value: { type: number }
        unit: { type: string, maxLength: 20 }
    EmrItemListEntry:
      type: object
      additionalProperties: false
      required: [itemKey, text, newToList]
      properties:
        itemKey: { type: [string, 'null'], maxLength: 40, description: 'SAH-43 item key (uuid text or ICD-10 code) or a service id; null for typed text.' }
        text: { type: string, minLength: 1, maxLength: 200, description: 'The name as shown (copied, so a later master change does not alter the record).' }
        newToList: { type: boolean, description: 'Typed, not in the list: tagged "New to list", stays on this patient''s record only, never ranked (OQ-45-17).' }
    EmrStructuredValue:
      type: object
      required: [text]
      properties:
        text: { type: string, maxLength: 2000, description: 'Phase 2 generic entry for body map, tooth picker, template, library and grouped dropdown fields; specialty editors add properties next to it.' }
    EmrListKind:
      type: string
      enum: [COMPLAINTS, DIAGNOSIS, INVESTIGATIONS, ADVICE, SERVICES]
      description: 'SAH-56 (ADR-022 D3). The five EMR list kinds of the mockup #EmrList.'
    EmrListItem:
      type: object
      additionalProperties: false
      required: [id, itemKey, text, newToList, attr1, attr2, active]
      description: >-
        One item of an EMR list. Attribute values by kind (fixed product lists, mockup #EmrList; defaults in brackets):
        COMPLAINTS attr1 duration D1 D2 D3 D5 W1 W2 M1 OVER_M1 (D3; "1 day" … "Over 1 month"), attr2 severity MILD
        MODERATE SEVERE (MODERATE); DIAGNOSIS attr1 type PROVISIONAL FINAL DIFFERENTIAL COMORBIDITY (PROVISIONAL), attr2
        status ACTIVE CHRONIC RESOLVED (ACTIVE); INVESTIGATIONS attr1 priority ROUTINE URGENT BEFORE_NEXT_VISIT
        (ROUTINE), attr2 where CLINIC_LAB OUTSIDE_LAB (CLINIC_LAB); ADVICE attr1 language EN MR HI (the record's print
        language, else the clinic's), attr2 sendBy PRINT (WHATSAPP and PRINT_WHATSAPP answer 400 needs-whatsapp-service
        until DEC-040); SERVICES attr1 qty 1 2 3 4 (1), attr2 billing BILL_TODAY NO_CHARGE IN_PACKAGE (BILL_TODAY). Any
        other value: 400 validation.
      properties:
        id: { type: string, format: uuid, description: 'Made by the client when the item is added; the idempotency key (Undo, retries, bill line).' }
        itemKey: { type: [string, 'null'], maxLength: 40, description: 'Master item key (uuid text; ICD-10 code for diagnoses) or service id; null for a typed item.' }
        text: { type: string, minLength: 1, maxLength: 200, description: 'Name as shown (copied). A typed item gets its first letter capitalised by the server. Same text twice on one list (ignoring case): 400 duplicate-item.' }
        code: { type: [string, 'null'], maxLength: 10, readOnly: true, description: 'Diagnosis only: the ICD-10 code of a master item, set by the server; never for a typed diagnosis.' }
        newToList: { type: boolean, description: 'Typed, not in the master: tag "New to list"; stays on this patient''s record only; never ranked (OQ-45-17).' }
        attr1: { type: string, maxLength: 20 }
        attr2: { type: string, maxLength: 20 }
        active: { type: boolean, description: 'Active switch of the Table view. Inactive items are muted and left out of Done, the case paper, bill lines and checks.' }
        addedAt: { type: [string, 'null'], format: date-time, readOnly: true, description: 'Server-stamped on the first save that holds the id ("Added on", shown in IST).' }
        addedByMembershipId: { type: [string, 'null'], format: uuid, readOnly: true }
        addedByName: { type: [string, 'null'], readOnly: true, description: 'Response only: "Added by", read through platform.api (not copied).' }
        unitPricePaise: { type: [integer, 'null'], readOnly: true, description: 'SERVICES only, response only: the tariff price for the chip ("₹ 1,500").' }
        billed: { type: [string, 'null'], enum: [ON_BILL, ON_PAID_BILL, null], readOnly: true, description: 'SERVICES on an OPD visit, response only: the line is on the visit bill; ON_PAID_BILL means it can no longer be removed or changed here ("Already billed. Ask billing to adjust.").' }
    EmrListValue:
      type: object
      additionalProperties: false
      required: [component, kind, schemaVersion, items]
      properties:
        component: { type: string, const: EMR_LIST }
        kind: { $ref: '#/components/schemas/EmrListKind' }
        schemaVersion: { type: integer, const: 1 }
        items: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/EmrListItem' }, description: 'Order of adding.' }
    EmrRxFrequency:
      type: string
      enum: ['1-0-0', '1-0-1', '0-0-1', '1-1-1', '0-1-0']
      description: 'Shown with OD, BD, HS and TDS (SAH-48-1). 0.5.0 adds 0-1-0 (Calcium + Vit D3 supplement, SAH-61-4, tagged C-4); the SAH-48 chips still offer the first four.'
    EmrRxWhen:
      type: string
      enum: [AFTER_FOOD, BEFORE_FOOD, BEDTIME, MORNING_EMPTY_STOMACH]
      description: 'After food, Before food, Bedtime, "Morning, empty stomach".'
    EmrPrescriptionRow:
      type: object
      additionalProperties: false
      required: [id, medicineId, name, form, frequency, days, when, source]
      properties:
        id: { type: string, format: uuid, description: 'Made by the client; the idempotency key.' }
        medicineId: { type: [string, 'null'], format: uuid, description: 'Master medicine; null only for a typed medicine (never allergy-checked; ADR-022 H6).' }
        name: { type: string, minLength: 1, maxLength: 160, description: 'Generic name and strength first, as stored ("Telmisartan 40 mg"). Printed in capitals only when the clinic''s capitals setting is on. Same name twice: 400 duplicate-item.' }
        form: { type: [string, 'null'], maxLength: 40 }
        frequency: { oneOf: [{ $ref: '#/components/schemas/EmrRxFrequency' }, { type: 'null' }], description: '0.5.0: null only when frequencyText is set (dose by weight, take-home "Once, day 2", "3 times a day"). Readers must accept null.' }
        days: { type: integer, minimum: 1, maximum: 365, description: 'Minus and plus change it by 1 up to 7 and by 7 above; never below 1.' }
        when: { $ref: '#/components/schemas/EmrRxWhen' }
        source: { type: string, enum: [SEARCH, FAVOURITE, REPEAT, COPY, TYPED, DOSE_BY_WEIGHT, SPECIALTY_LIST], description: '0.5.0 adds DOSE_BY_WEIGHT (SAH-62-3) and SPECIALTY_LIST (ANC supplements SAH-61-4, take-home SAH-70-1).' }
        doseText: { type: [string, 'null'], maxLength: 60, description: '0.5.0. For example "4.5 ml (108 mg)".' }
        frequencyText: { type: [string, 'null'], maxLength: 120, description: '0.5.0. Fixed text such as "every 6 hours if needed, at most 4 doses a day" (tagged C-5).' }
        note: { type: [string, 'null'], maxLength: 120, description: '0.5.0. For example "Calculated by weight", "2 h apart from iron", "Nausea".' }
        calculation:
          type: [object, 'null']
          additionalProperties: false
          description: '0.5.0 (SAH-62-3, ADR-023 D4, tagged C-5). Dose by weight. The server recomputes mg = min(maxMg, round(weightKg × mgPerKg)) and ml = round(mg ÷ mgPerMl, 1) for doseRuleKey and refuses a mismatch (400 dose-calculation-mismatch). When today''s weight later differs from weightKg, specialty.paeds.doseWeightChanged lists the row ("Weight changed. Add the dose again."); the row is never changed silently.'
          required: [doseRuleKey, weightKg, mg, ml]
          properties:
            doseRuleKey: { type: string, enum: [PARACETAMOL_120_5, PARACETAMOL_250_5, IBUPROFEN_100_5] }
            weightKg: { type: number, minimum: 0.5, maximum: 150 }
            mg: { type: integer, minimum: 1, maximum: 500 }
            ml: { type: number, minimum: 0.1, maximum: 50, multipleOf: 0.1 }
            capped: { type: boolean, readOnly: true }
        allergyReview:
          type: [object, 'null']
          additionalProperties: false
          description: '"I have reviewed the alert and want to prescribe anyway" for this row and class (ADR-022 D5). reviewedAt and reviewedByMembershipId are stamped by the server; one audit EMR_ALLERGY_ALERT_REVIEWED. A save that changes the visit''s allergy classes clears every review, including one sent in that same save (0.6.3, DEC-051 D1): it is not stamped or audited.'
          required: [allergyClass, confirmed]
          properties:
            allergyClass: { type: string, maxLength: 20 }
            confirmed: { type: boolean }
            reviewedAt: { type: [string, 'null'], format: date-time, readOnly: true }
            reviewedByMembershipId: { type: [string, 'null'], format: uuid, readOnly: true }
        addedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        addedByMembershipId: { type: [string, 'null'], format: uuid, readOnly: true }
    EmrPrescriptionValue:
      type: object
      additionalProperties: false
      required: [component, schemaVersion, rows]
      properties:
        component: { type: string, const: PRESCRIPTION }
        schemaVersion: { type: integer, const: 1 }
        rows: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/EmrPrescriptionRow' } }
    EmrBodyMapPin:
      type: object
      additionalProperties: false
      required: [no, side, x, y, region, where, finding, cause, severity, sizeCm, note, mlc]
      description: 'SAH-57-2 (ADR-022 D8). Lists are fixed product lists from the mockup (tagged C-10, L-1).'
      properties:
        no: { type: integer, minimum: 1, maximum: 999, description: 'Pin number; never reused (a new pin must be at least nextPinNo).' }
        side: { type: string, enum: [FRONT, BACK] }
        x: { type: number, minimum: 0, maximum: 1, description: 'Position across the drawing (0 left, 1 right).' }
        y: { type: number, minimum: 0, maximum: 1 }
        region: { type: string, pattern: '^[a-z][a-z0-9_]{1,39}$', description: 'Key of a drawn body region (left and right separate), fixed in code from the mockup drawing.' }
        where: { type: string, maxLength: 80, description: '"Where" text (region name or the body part chosen).' }
        finding: { type: string, enum: [WOUND, SWELLING, TENDERNESS, BRUISE, BURN, RASH, LUMP, FRACTURE_SUSPECTED, SCAR, PAIN], description: 'FRACTURE_SUSPECTED is shown "Fracture?".' }
        cause: { type: string, enum: [NO_INJURY, FALL, ROAD_ACCIDENT, ASSAULT, ANIMAL_BITE, BURN, SPORTS, WORK_INJURY], description: 'NO_INJURY is "No injury (illness)".' }
        severity: { type: string, enum: [MILD, MODERATE, SEVERE] }
        sizeCm: { type: number, minimum: 0, maximum: 50, multipleOf: 0.5, description: '0 = not measured ("—").' }
        note: { type: string, maxLength: 500, description: '"What happened / notes". Clinical text: never logged or audited.' }
        mlc: { type: boolean, description: 'Medico-legal case. Set true by the server when the cause is set to ROAD_ACCIDENT, ASSAULT or BURN (tagged L-1); otherwise as sent.' }
        recordedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        recordedByMembershipId: { type: [string, 'null'], format: uuid, readOnly: true }
        recordedByName: { type: [string, 'null'], readOnly: true }
    EmrBodyMapValue:
      type: object
      additionalProperties: false
      required: [component, schemaVersion, pins, nextPinNo, noFindingsConfirmed]
      properties:
        component: { type: string, const: BODY_MAP }
        schemaVersion: { type: integer, const: 1 }
        pins: { type: array, maxItems: 60, items: { $ref: '#/components/schemas/EmrBodyMapPin' } }
        nextPinNo: { type: integer, minimum: 1, readOnly: true, description: 'Kept by the server; sent values are ignored.' }
        noFindingsConfirmed: { type: boolean, description: '"No local findings" (analyst addition in SAH-57-4) makes a required body map Done with no pin.' }
        legacyText: { type: [string, 'null'], maxLength: 2000, readOnly: true, description: 'Text typed in phase 2 for this field, kept.' }
    EmrAllergyClass:
      type: object
      required: [classKey, label]
      properties:
        classKey: { type: string, enum: [SULFA, PENICILLIN] }
        label: { type: string, maxLength: 60, description: '"Sulfa drugs", "Penicillin".' }
    EmrAllergyAlert:
      type: object
      required: [sectionKey, fieldKey, rowId, medicineKey, medicineName, allergyClass, allergyClassLabel, reviewed, reviewedAt, reviewedByName]
      description: 'Alert text "<drug> contains a sulfa drug. This patient is allergic to sulfa drugs." or "<drug> is a penicillin. This patient is allergic to penicillin." (tagged C-2). Screen only; never logged.'
      properties:
        sectionKey: { $ref: '#/components/schemas/SectionKey' }
        fieldKey: { $ref: '#/components/schemas/FieldKey' }
        rowId: { type: string, format: uuid }
        medicineKey: { type: string, maxLength: 40 }
        medicineName: { type: string }
        allergyClass: { type: string, enum: [SULFA, PENICILLIN] }
        allergyClassLabel: { type: string }
        reviewed: { type: boolean }
        reviewedAt: { type: [string, 'null'], format: date-time }
        reviewedByName: { type: [string, 'null'] }
    EmrMedicineOption:
      type: object
      required: [medicineId, name, form, favourite, allergyClass, defaultFrequency, defaultDays, defaultWhen]
      properties:
        medicineId: { type: string, format: uuid }
        name: { type: string, maxLength: 160, description: 'Generic name and strength.' }
        form: { type: string, maxLength: 40, description: 'Shown below the name ("Tablet"; with a class: "Tablet · contains a sulfa drug").' }
        favourite: { type: boolean }
        allergyClass: { type: [string, 'null'], enum: [SULFA, PENICILLIN, null], description: 'Drug-class flag of the master (tagged C-2).' }
        defaultFrequency: { $ref: '#/components/schemas/EmrRxFrequency' }
        defaultDays: { type: integer, minimum: 1, maximum: 365 }
        defaultWhen: { $ref: '#/components/schemas/EmrRxWhen' }
        useCount: { type: integer, minimum: 0, description: 'This doctor''s signed uses (0 until SAH-51).' }
    EmrMedicinePage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/EmrMedicineOption' } }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 0 }
        pageSize: { type: integer, const: 20 }
    EmrCopyItemsInput:
      type: object
      additionalProperties: false
      required: [source, what]
      properties:
        source: { type: string, enum: [LAST_SIGNED_PRESCRIPTION, PAST_RECORD] }
        sourceRecordId: { type: [string, 'null'], format: uuid, description: 'Required for PAST_RECORD; must be null for LAST_SIGNED_PRESCRIPTION (400 validation).' }
        what: { type: string, enum: [MEDICINES, TESTS], description: 'TESTS is not allowed with LAST_SIGNED_PRESCRIPTION.' }
    EmrCopyItemsResult:
      type: object
      required: [added, skipped, record]
      properties:
        added: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0, description: 'Already on today''s list.' }
        record: { $ref: '#/components/schemas/EmrRecordView' }
    EmrPrintPreferences:
      type: object
      additionalProperties: false
      required: [language, paperSize]
      properties:
        language: { type: [string, 'null'], enum: [EN, MR, HI, null], description: 'Null = the clinic''s Case paper and Rx language.' }
        paperSize: { type: [string, 'null'], enum: [A4, A5, null], description: 'Null = the clinic''s paper size.' }
    EmrCasePaperHeading:
      type: string
      enum: [CHIEF_COMPLAINTS, ALLERGIES, MEDICAL_HISTORY, EXAMINATION, DIAGNOSIS, INVESTIGATIONS, MEDICINES, PROCEDURES, ADVICE, FOLLOW_UP, VITALS_LINE, NONE]
      description: 'The ten headings in order, the vitals line, or NONE (never printed as content). ADR-022 D9 gives the section map.'
    EmrCasePaperContext:
      type: object
      required: [letterhead, departmentName, doctor, patient, visitLine, clinicDefaults, chosen, headings, sectionHeadings, signature, printBlocked, share]
      description: 'SAH-55 (ADR-022 D9). Screen and print only; never logged or stored.'
      properties:
        letterhead:
          type: object
          required: [clinicName, address, phone]
          properties:
            clinicName: { type: string }
            address: { type: [string, 'null'] }
            phone: { type: [string, 'null'] }
        departmentName: { type: string }
        doctor:
          type: object
          required: [name, qualification, registrationNo]
          properties:
            name: { type: string }
            qualification: { type: [string, 'null'] }
            registrationNo: { type: [string, 'null'], description: 'Null prints "Reg. no. not set" (OQ-43-11).' }
        patient:
          type: object
          required: [name, age, sex, uhid]
          properties:
            name: { type: string }
            age: { type: [integer, 'null'], description: '0.5.3: effective completed years from patient.api.' }
            ageDetail: { oneOf: [{ $ref: '#/components/schemas/AgeDetail' }, { type: 'null' }], description: '0.5.3 (SAH-73-4). The Paediatrics case paper meta prints it ("18 months · Boy"); other departments print age as before. Null without a patient record.' }
            sex: { type: string, enum: [F, M, O] }
            uhid: { type: [string, 'null'], description: 'Null prints "New patient".' }
        visitLine: { type: string, description: 'For example "OPD · follow-up visit".' }
        clinicDefaults:
          type: object
          required: [paperSize, language, capitals]
          properties:
            paperSize: { type: string, enum: [A4, A5] }
            language: { type: string, enum: [EN, MR, HI] }
            capitals: { type: boolean, description: 'Medicine names in capital letters on the print, and the footer line "Medicines in generic names, capital letters (NMC)." (SAH-7 caps).' }
        chosen: { $ref: '#/components/schemas/EmrPrintPreferences' }
        headings:
          type: array
          minItems: 10
          maxItems: 10
          description: 'The ten headings in order with the mockup''s Marathi and Hindi words (tagged until a language reviewer checks them).'
          items:
            type: object
            required: [heading, en, mr, hi]
            properties:
              heading: { $ref: '#/components/schemas/EmrCasePaperHeading' }
              en: { type: string }
              mr: { type: string }
              hi: { type: string }
        sectionHeadings:
          type: array
          description: 'Every section of the record''s layout with the heading its values go under.'
          items:
            type: object
            required: [sectionKey, heading]
            properties:
              sectionKey: { $ref: '#/components/schemas/SectionKey' }
              heading: { $ref: '#/components/schemas/EmrCasePaperHeading' }
        signature:
          type: object
          required: [signed, signerName, signedAt]
          properties:
            signed: { type: boolean, description: 'False until SAH-51: the signature area stays empty and the prescription prints "Not valid without signature". 0.6.0: true once SIGNED; the area shows the doctor''s name, the signing time in IST and the registration number (or "—", OQ-43-11).' }
            signerName: { type: [string, 'null'] }
            signedAt: { type: [string, 'null'], format: date-time }
        addenda: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/EmrAddendum' }, description: '0.6.0 (SAH-51-5). Printed under the signature, newest last.' }
        printBlocked: { type: [string, 'null'], enum: [ALLERGY_ALERT, null], description: 'ALLERGY_ALERT: Print disabled with "Resolve the allergy alert first".' }
        share:
          type: object
          required: [available, reason]
          properties:
            available: { type: boolean, const: false, description: 'Always false in 0.4.0 (WhatsApp and ABHA wait for DEC-040 and the human''s module edits).' }
            reason: { type: string, description: '"Needs the WhatsApp and ABHA services".' }
    EmrPastVisit:
      type: object
      required: [kind, id, date, title, place, signed]
      properties:
        kind: { type: string, enum: [OPD, IPD, IPD_ROUND], description: 'Chip OPD or IPD (IPD_ROUND rows show the IPD chip).' }
        id: { type: string, format: uuid, description: 'Record id (OPD, IPD_ROUND) or admission id (IPD).' }
        date: { type: string, format: date }
        title: { type: string, maxLength: 200, description: 'OPD: first active diagnosis, else first complaint, else the visit type. IPD: reason for admission (" · day care" for a daycare admission).' }
        place: { type: string, maxLength: 200, description: '"Dr. <name> · <department>" or "Dr. <name> · <ward> bed <code>".' }
        signed: { type: boolean }
    EmrPastVisitPage:
      type: object
      required: [counts, someHidden, items, page, pageSize, hasMore]
      properties:
        counts:
          type: object
          required: [opd, ipd]
          description: '"n OPD · m IPD" for the patient (scope-filtered); totals, not this page.'
          properties:
            opd: { type: integer, minimum: 0 }
            ipd: { type: integer, minimum: 0 }
        someHidden: { type: boolean, description: '"Some entries are hidden" (IPD ward scope, SAH-34).' }
        items: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/EmrPastVisit' } }
        page: { type: integer, minimum: 0 }
        pageSize: { type: integer, const: 8 }
        hasMore: { type: boolean, description: '"Load more".' }
    EmrPastVisitDetail:
      type: object
      required: [kind, id, signed, lines, medicines, results, tests, canCopyMedicines, canRepeatTests, copyDisabledReason, open]
      properties:
        kind: { type: string, enum: [OPD, IPD, IPD_ROUND] }
        id: { type: string, format: uuid }
        signed: { type: boolean, description: 'False: "No signed record yet." and no details.' }
        lines:
          type: array
          items: { type: object, required: [label, value], properties: { label: { type: string }, value: { type: string } } }
          description: 'Label and value (Complaints, Findings, Diagnosis, Advice, Done, Plan, …).'
        medicines:
          type: array
          items: { type: object, required: [name, frequency, days, when], properties: { name: { type: string }, frequency: { $ref: '#/components/schemas/EmrRxFrequency' }, days: { type: integer }, when: { $ref: '#/components/schemas/EmrRxWhen' } } }
        medicinesHeading: { type: string, enum: [MEDICINES, DISCHARGE_MEDICINES, TAKE_HOME_MEDICINES], description: '0.7.0 (SAH-75-8 G16-1). "Medicines" for an OPD visit; "Discharge medicines" for IPD and IPD_ROUND rows; "Take-home medicines" for an OPD record of the oncology profile with a SENT chemotherapy order (day-care chemotherapy visit). Absent reads MEDICINES.' }
        results:
          type: array
          items: { type: object, required: [test, value, abnormal], properties: { test: { type: string }, value: { type: string }, abnormal: { type: boolean, description: 'As stored; "Abnormal" in red.' } } }
        tests: { type: array, items: { type: string } }
        canCopyMedicines: { type: boolean }
        canRepeatTests: { type: boolean }
        copyDisabledReason: { type: [string, 'null'], enum: [RECORD_SIGNED, null], description: 'RECORD_SIGNED: "This visit is signed".' }
        open:
          type: object
          required: [target, id]
          description: 'RECORD: "Open full visit" (GET /emr/records/{recordId}/past-records/{id}); ADMISSION: "Open discharge summary" (the IPD admission view).'
          properties:
            target: { type: string, enum: [RECORD, ADMISSION] }
            id: { type: string, format: uuid }
    EmrKeyFacts:
      type: object
      required: [starterKey, facts]
      properties:
        starterKey: { oneOf: [{ $ref: '#/components/schemas/StarterKey' }, { type: 'null' }] }
        facts:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: object
            required: [key, label, value, important]
            properties:
              key: { type: string, maxLength: 40 }
              label: { type: string, maxLength: 40, description: 'Tagged label set of the department (SAH-50-2).' }
              value: { type: [string, 'null'], maxLength: 300, description: 'Null shows "Not recorded".' }
              important: { type: boolean, description: 'Red, and the text says what it is (colour is not the only signal).' }
    EmrFormKey:
      type: string
      pattern: '^f_[a-z2-7]{10}$'
      description: 'Server-made form key; also the section key of the form in layouts and records (library keys never start with f_).'
    EmrFormStarterKey:
      type: string
      enum: [diabetic_foot, gcs, morse, mlc_injury, pre_anaesthetic, untitled]
    EmrFormFieldType:
      type: string
      enum: [SHORT_TEXT, LONG_TEXT, NUMBER, DATE, TIME, YES_NO, SINGLE_CHOICE, MULTI_CHOICE, DROPDOWN, VITALS_BLOCK, BODY_MAP, TOOTH_CHART, MEDICINE_LIST, LAB_TESTS, DIAGNOSIS, SCORE, SCORE_BAND, SECTION_HEADING, INFO_NOTE, SIGNATURE, PHOTO, FILE_UPLOAD, HANDWRITING_PAD]
      description: >-
        The 23 palette types of #FormBuilder (Basic, Clinical, Layout). Stored values (ADR-022 D11): SHORT_TEXT string
        ≤ 200; LONG_TEXT ≤ 4,000; NUMBER within min and max; DATE YYYY-MM-DD; TIME HH:mm; YES_NO boolean; SINGLE_CHOICE
        and DROPDOWN an option key; MULTI_CHOICE option keys; VITALS_BLOCK EmrFormVitalsValue; BODY_MAP EmrBodyMapValue;
        MEDICINE_LIST EmrPrescriptionValue (allergy-checked); LAB_TESTS EmrListValue kind INVESTIGATIONS (nothing is
        sent to a lab); DIAGNOSIS EmrListValue kind DIAGNOSIS; SCORE, SCORE_BAND, SECTION_HEADING, INFO_NOTE store
        nothing (computed or display); TOOTH_CHART is LATER until SAH-49-1; SIGNATURE, PHOTO, FILE_UPLOAD,
        HANDWRITING_PAD are LATER (shown disabled with "Later"; nothing stored; OQ-45-27, OQ-45-28).
    EmrFormVitalsValue:
      type: object
      additionalProperties: false
      properties:
        bpSystolic: { type: [number, 'null'], minimum: 0, maximum: 400 }
        bpDiastolic: { type: [number, 'null'], minimum: 0, maximum: 300 }
        pulse: { type: [number, 'null'], minimum: 0, maximum: 400 }
        spo2: { type: [number, 'null'], minimum: 0, maximum: 100 }
        temperatureF: { type: [number, 'null'], minimum: 80, maximum: 115 }
        weightKg: { type: [number, 'null'], minimum: 0, maximum: 400 }
        heightCm: { type: [number, 'null'], minimum: 0, maximum: 260 }
    EmrFormOption:
      type: object
      additionalProperties: false
      required: [key, label, score]
      properties:
        key: { $ref: '#/components/schemas/FieldKey' }
        label: { type: string, minLength: 1, maxLength: 120 }
        labelMr: { type: [string, 'null'], maxLength: 120 }
        labelHi: { type: [string, 'null'], maxLength: 120 }
        score: { type: integer, minimum: -100, maximum: 100, description: '"score is used by Σ fields"; 0 when none (tagged C-9).' }
    EmrFormScoreRule:
      type: object
      additionalProperties: false
      required: [kind, fieldKey, threshold, points]
      properties:
        kind: { type: string, enum: [NUMBER_BELOW, CHOSEN_COUNT_BELOW], description: 'NUMBER_BELOW: a NUMBER field below threshold; CHOSEN_COUNT_BELOW: fewer than threshold options chosen in a MULTI_CHOICE field.' }
        fieldKey: { $ref: '#/components/schemas/FieldKey' }
        threshold: { type: number }
        points: { type: integer, minimum: -100, maximum: 100 }
    EmrFormField:
      type: object
      additionalProperties: false
      required: [key, type, label, required, width, print, copyFromLast, whoCanFill]
      properties:
        key: { $ref: '#/components/schemas/FieldKey' }
        type: { $ref: '#/components/schemas/EmrFormFieldType' }
        label: { type: string, minLength: 1, maxLength: 200, description: 'Plain text; no markup is run.' }
        labelMr: { type: [string, 'null'], maxLength: 200, description: 'Printed with English when the print language is EN_MR (analyst addition, SAH-59-5).' }
        labelHi: { type: [string, 'null'], maxLength: 200 }
        help: { type: [string, 'null'], maxLength: 500 }
        required: { type: boolean }
        width: { type: integer, minimum: 1, maximum: 6, description: 'Columns of the six-column grid.' }
        unit: { type: [string, 'null'], maxLength: 20 }
        min: { type: [number, 'null'], description: 'Hard limit (NUMBER): outside answers "Outside <min>–<max>".' }
        max: { type: [number, 'null'] }
        normalFrom: { type: [number, 'null'], description: 'Normal range: a value inside min and max but outside from and to is accepted and flagged "Abnormal" (tagged C-9).' }
        normalTo: { type: [number, 'null'] }
        options: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/EmrFormOption' }, description: 'SINGLE_CHOICE, MULTI_CHOICE, DROPDOWN (1 to 30). YES_NO has the fixed options yes and no (scores may be sent for them).' }
        print: { type: boolean, description: '"Print on paper".' }
        copyFromLast: { type: boolean, description: '"Copy from last visit": pre-filled from the patient''s last signed entry of the same form, marked "Copied from <date>".' }
        whoCanFill: { type: array, uniqueItems: true, maxItems: 4, items: { type: string, enum: [DOCTOR, NURSE, RECEPTION, PATIENT] }, description: 'Stored and shown only (OQ-45-14).' }
        standardCode: { type: [string, 'null'], maxLength: 60, description: 'Stored text such as "LOINC 32443-7" or a SNOMED CT code; no exchange (DEC-040).' }
        showIf:
          type: [object, 'null']
          additionalProperties: false
          description: '"Show this field: if <field> is <value>"; null = Always. Source: an earlier YES_NO, SINGLE_CHOICE, MULTI_CHOICE or DROPDOWN field.'
          required: [fieldKey, optionKey]
          properties:
            fieldKey: { $ref: '#/components/schemas/FieldKey' }
            optionKey: { $ref: '#/components/schemas/FieldKey' }
        score:
          type: [object, 'null']
          additionalProperties: false
          description: 'SCORE only: "Adds up the scores of" and points rules.'
          required: [sourceFieldKeys, rules]
          properties:
            sourceFieldKeys: { type: array, maxItems: 40, uniqueItems: true, items: { $ref: '#/components/schemas/FieldKey' } }
            rules: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/EmrFormScoreRule' } }
        band:
          type: [object, 'null']
          additionalProperties: false
          description: 'SCORE_BAND only: the band shown is the one with the highest from not above the total (tagged C-9).'
          required: [sourceFieldKey, bands]
          properties:
            sourceFieldKey: { $ref: '#/components/schemas/FieldKey' }
            bands:
              type: array
              minItems: 1
              maxItems: 10
              items: { type: object, additionalProperties: false, required: [from, label], properties: { from: { type: number }, label: { type: string, minLength: 1, maxLength: 120 } } }
    EmrFormUseIn:
      type: object
      additionalProperties: false
      required: [departmentKeys, places]
      description: '"Use in departments". Default and rule: the clinic''s own departments (SAH-59-4 note).'
      properties:
        departmentKeys: { type: array, maxItems: 65, uniqueItems: true, items: { $ref: '#/components/schemas/DepartmentKey' }, description: 'The clinic''s departments visible to doctors (unknown or unpublished added department: 400 validation).' }
        places: { type: array, uniqueItems: true, items: { type: string, enum: [EMERGENCY, IPD_WARD] }, description: 'EMERGENCY = the Emergency assessment; IPD_WARD = the IPD daily progress note.' }
    EmrFormSettings:
      type: object
      additionalProperties: false
      required: [useIn, emrPart, visitTypes, whoCanFill, printLanguage, approvalRequired]
      properties:
        useIn: { $ref: '#/components/schemas/EmrFormUseIn' }
        emrPart: { $ref: '#/components/schemas/EmrPart' }
        visitTypes: { type: array, uniqueItems: true, items: { type: string, enum: [NEW_CONSULT, FOLLOW_UP, PROCEDURE_VISIT, TELECONSULT, IPD_DAILY_ROUND] }, description: 'Stored and shown only (one configuration for all visit types, OQ-45-18; ADR-022 H10). Teleconsult starts no call.' }
        whoCanFill: { type: array, uniqueItems: true, items: { type: string, enum: [DOCTOR, NURSE, RECEPTION, PATIENT] }, description: 'Stored and shown only; a link to the patient on WhatsApp waits for DEC-040.' }
        printLanguage: { type: string, enum: [EN, EN_MR, EN_HI] }
        approvalRequired: { type: boolean, default: true, description: '"Approval before publishing"; On by default.' }
    EmrFormDefinition:
      type: object
      required: [schemaVersion, name, settings, fields]
      properties:
        schemaVersion: { type: integer, const: 1 }
        name: { type: string, minLength: 1, maxLength: 80 }
        settings: { $ref: '#/components/schemas/EmrFormSettings' }
        fields: { type: array, maxItems: 80, items: { $ref: '#/components/schemas/EmrFormField' } }
    EmrFormDraftInput:
      type: object
      additionalProperties: false
      required: [revision, name, settings, fields]
      properties:
        revision: { type: integer, format: int64, minimum: 0 }
        name: { type: string, minLength: 1, maxLength: 80, description: 'Unique in the clinic ignoring case.' }
        settings: { $ref: '#/components/schemas/EmrFormSettings' }
        fields: { type: array, maxItems: 80, items: { $ref: '#/components/schemas/EmrFormField' } }
        tenantId: { description: 'Accepted and ignored.' }
        clinicId: { description: 'Accepted and ignored.' }
    EmrFormRevisionInput:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: { type: integer, format: int64, minimum: 0 }
    EmrFormSendBackInput:
      type: object
      additionalProperties: false
      required: [revision, reason]
      properties:
        revision: { type: integer, format: int64, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 300 }
    EmrFormCreateInput:
      type: object
      additionalProperties: false
      required: [starterKey]
      properties:
        starterKey: { $ref: '#/components/schemas/EmrFormStarterKey' }
        name: { type: [string, 'null'], minLength: 1, maxLength: 80, description: 'Null takes the starter''s name (made unique with " (2)" when taken).' }
    EmrFormState:
      type: string
      enum: [DRAFT, WAITING_APPROVAL, SENT_BACK, LIVE, RETIRED]
      description: 'Header chip "v<n> · draft", "v<n> · waiting approval", "v<n> · live". SENT_BACK shows the reason.'
    EmrFormSummary:
      type: object
      required: [formKey, name, state, chipVersionNo, liveVersionNo, starterKey, useIn, emrPart, fieldCount, logicCount, scoredCount, updatedAt]
      properties:
        formKey: { $ref: '#/components/schemas/EmrFormKey' }
        name: { type: string }
        state: { $ref: '#/components/schemas/EmrFormState' }
        chipVersionNo: { type: integer, minimum: 1, description: 'The version the chip names (the draft''s, else the live one).' }
        liveVersionNo: { type: integer, minimum: 0, description: '0 = never live.' }
        starterKey: { oneOf: [{ $ref: '#/components/schemas/EmrFormStarterKey' }, { type: 'null' }] }
        useIn: { $ref: '#/components/schemas/EmrFormUseIn' }
        emrPart: { $ref: '#/components/schemas/EmrPart' }
        fieldCount: { type: integer, minimum: 0, description: '"12 fields · 2 with logic · 3 scored".' }
        logicCount: { type: integer, minimum: 0 }
        scoredCount: { type: integer, minimum: 0 }
        updatedAt: { type: string, format: date-time }
    EmrFormList:
      type: object
      required: [canEdit, canApprove, forms]
      properties:
        canEdit: { type: boolean }
        canApprove: { type: boolean }
        forms: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/EmrFormSummary' } }
    EmrFormVersion:
      type: object
      required: [formKey, versionNo, definition, publishedAt, publishedByName, approvedByName]
      properties:
        formKey: { $ref: '#/components/schemas/EmrFormKey' }
        versionNo: { type: integer, minimum: 1 }
        definition: { $ref: '#/components/schemas/EmrFormDefinition' }
        publishedAt: { type: string, format: date-time }
        publishedByName: { type: string }
        approvedByName: { type: [string, 'null'], description: 'Null when published without approval.' }
    EmrFormView:
      allOf:
        - { $ref: '#/components/schemas/EmrFormSummary' }
        - type: object
          required: [canEdit, canApprove, revision, definition, sentBackReason, versions]
          properties:
            canEdit: { type: boolean }
            canApprove: { type: boolean }
            revision: { type: integer, format: int64, minimum: 0 }
            definition: { $ref: '#/components/schemas/EmrFormDefinition', description: 'The working definition: the draft, else the live version.' }
            sentBackReason: { type: [string, 'null'] }
            versions:
              type: array
              description: 'Every published version (state LIVE for the current one, else SUPERSEDED) and the draft, newest first.'
              items:
                type: object
                required: [versionNo, state, at, byName]
                properties:
                  versionNo: { type: integer, minimum: 1 }
                  state: { type: string, enum: [DRAFT, WAITING_APPROVAL, SENT_BACK, LIVE, SUPERSEDED] }
                  at: { type: string, format: date-time }
                  byName: { type: string }
    EmrFormStarterSummary:
      type: object
      required: [starterKey, name, description, suitedFor]
      properties:
        starterKey: { $ref: '#/components/schemas/EmrFormStarterKey' }
        name: { type: string }
        description: { type: string, description: 'One line, for example "Risk score, ulcer follow-up, advice".' }
        suitedFor: { type: string, description: 'Departments it suits, as drawn ("General Medicine, Diabetology").' }
    EmrFormStarterDetail:
      allOf:
        - { $ref: '#/components/schemas/EmrFormStarterSummary' }
        - type: object
          required: [definition]
          properties:
            definition: { $ref: '#/components/schemas/EmrFormDefinition' }
    TreatmentCourseKind:
      type: string
      enum: [DENTAL, ANC, CHEMO, SURGERY, REHAB]
      description: 'Units: DENTAL Sitting, ANC Visit, CHEMO Cycle, SURGERY Step, REHAB Session (mockup #TreatmentCourse).'
    CourseEncounterKind:
      type: string
      enum: [OPD, DAY_CARE, IPD]
      description: 'Encounter chip OPD, Day care, IPD.'
    CourseSittingStatus:
      type: string
      enum: [PLANNED, TODAY, DONE, MISSED]
      description: >-
        Computed on read: TODAY when a linked OPD visit is today's or a linked admission is not discharged; DONE when the
        linked visit's record is signed (SAH-51) or the admission is discharged. 0.7.0 (SAH-75-10, ADR-026 D4; changed),
        in this order: a removed sitting is never returned; DONE also when doneAt is set by "Mark <unit> done"; MISSED
        ("Patient did not come", red); TODAY also for an unlinked OPD sitting whose plannedDate is today (Asia/Kolkata);
        else PLANNED. Chips "Done", "Today", "Planned", "Missed".
    CourseAddOption:
      type: object
      required: [key, label, encounterKind]
      description: 'Add choices per kind, fixed (mockup addOpts): DENTAL opd_sitting "OPD sitting", day_care_admission "Day-care admission", ipd_admission "IPD admission"; ANC anc_visit "ANC visit", emergency_admission "Emergency admission", delivery_admission "Delivery admission"; CHEMO chemo_cycle "Chemo cycle" (DAY_CARE), review_opd "Review OPD", side_effects_admission "Admission for side effects"; SURGERY opd_review "OPD review", re_admission "Re-admission", day_care_procedure "Day-care procedure"; REHAB extra_session "Extra session", bedside_session "Bedside session (IPD)".'
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9_]{1,39}$' }
        label: { type: string }
        encounterKind: { $ref: '#/components/schemas/CourseEncounterKind' }
    CourseSitting:
      type: object
      required: [id, sittingNo, encounterKind, encounterLabel, encounterRef, plannedDate, status, items, chargePaise, note, admissionRequested, settledInIpd, ipdBillTotalPaise, opdVisitId, admissionId, displayNo, doneSource, regimenKey, allowedActions]
      properties:
        id: { type: string, format: uuid }
        sittingNo: { type: integer, minimum: 1, description: 'Shown S<n>; never reused.' }
        encounterKind: { $ref: '#/components/schemas/CourseEncounterKind' }
        encounterLabel: { type: string, description: 'For example "OPD sitting", "Delivery admission".' }
        encounterRef: { type: [string, 'null'], description: 'OPD visit token or the IPD number from ipd; null while planned.' }
        plannedDate: { type: [string, 'null'], format: date }
        status: { $ref: '#/components/schemas/CourseSittingStatus' }
        items: { type: array, maxItems: 20, items: { type: string, maxLength: 200 }, description: 'Work done or planned. Clinical text: never logged or audited.' }
        chargePaise: { type: integer, minimum: 0, description: 'Tariff price or the package price the doctor sets; never the mockup''s sample rates.' }
        note: { type: [string, 'null'], maxLength: 300 }
        admissionRequested: { type: boolean, description: '"Admission request. Rate set at admission." The IPD request list is SAH-67-3.' }
        settledInIpd: { type: boolean, description: 'Linked to an admission: billed in IPD, out of the course account (ADR-022 H1).' }
        ipdBillTotalPaise: { type: [integer, 'null'], description: 'Running or final bill total of the linked admission ("Billed in IPD · ₹ x").' }
        opdVisitId: { type: [string, 'null'], format: uuid }
        admissionId: { type: [string, 'null'], format: uuid }
        displayNo: { type: integer, minimum: 1, description: '0.7.0 (ADR-026 D4). The number shown (S<n>, "<Unit> n", physio "Session n of m", the oncology cycle): rank among the course''s non-removed sittings by sittingNo, so a removal renumbers the later ones. sittingNo stays the stable key.' }
        doneSource: { type: [string, 'null'], enum: [MARK_DONE, SIGN, null], description: '0.7.0. How doneAt was set; null for a sitting not done by either (also a sitting done by discharge, and rows done before 0.7.0, which read as SIGN).' }
        regimenKey: { type: [string, 'null'], pattern: '^[A-Z][A-Z0-9_]{1,39}$', description: '0.7.0 (SAH-75-7, ADR-026 D7). CHEMO courses only: the protocol of this cycle (ChemoProtocol key, for example AC, PACLI_3W); drives the plan chips "AC1", "P1". Null for other kinds.' }
        allowedActions:
          type: array
          uniqueItems: true
          items: { type: string, enum: [MARK_DONE, MISSED, REBOOK, RESCHEDULE, REMOVE, REQUEST_ADMISSION, ADMIT] }
          description: >-
            0.7.0 (SAH-75-10). What the caller may do on this sitting now; the client draws the buttons from it and the
            server checks again. TODAY: MARK_DONE "Mark <unit> done" and, when unlinked, MISSED "Patient did not come";
            MISSED: REBOOK; PLANNED: RESCHEDULE "Reschedule: <date> ▾", REMOVE, and for an OPD sitting REQUEST_ADMISSION
            "Move to day care / IPD", for a DAY_CARE or IPD sitting ADMIT "Admit now" (OWNER, FRONT_DESK when IPD is TRIAL
            or ON) or REQUEST_ADMISSION "Request admission" (a doctor who is not the owner, when not yet requested);
            DONE: none. Empty for FRONT_DESK and BILLING except ADMIT; DAY_CARE and IPD actions left out when IPD is OFF.
    TreatmentCourseSummary:
      type: object
      required: [id, courseNo, kind, unit, name, startedOn, status, sittingCount, doneCount]
      properties:
        id: { type: string, format: uuid }
        courseNo: { type: string, description: '"TC-0412" style; the number is the clinic''s own.' }
        kind: { $ref: '#/components/schemas/TreatmentCourseKind' }
        unit: { type: string, enum: [SITTING, VISIT, CYCLE, STEP, SESSION] }
        name: { type: string, maxLength: 120 }
        startedOn: { type: string, format: date }
        status: { type: string, enum: [ACTIVE] }
        sittingCount: { type: integer, minimum: 0, description: '0.7.0: removed sittings are not counted.' }
        doneCount: { type: integer, minimum: 0, description: '0.7.0: DONE only (MISSED is not done).' }
    TreatmentCourseView:
      allOf:
        - { $ref: '#/components/schemas/TreatmentCourseSummary' }
        - type: object
          required: [patientId, doctorMembershipId, doctorName, note, revision, sittings, addOptions, canPlan, canAdmit, accountNote, estimateSigned]
          properties:
            patientId: { type: string, format: uuid }
            doctorMembershipId: { type: string, format: uuid }
            doctorName: { type: string }
            note: { type: [string, 'null'], maxLength: 300, description: 'Sub line, for example "estimate signed by patient".' }
            revision: { type: integer, format: int64, minimum: 0 }
            sittings: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/CourseSitting' } }
            addOptions: { type: array, items: { $ref: '#/components/schemas/CourseAddOption' }, description: 'DAY_CARE and IPD options left out when IPD is OFF.' }
            canPlan: { type: boolean, description: 'The course''s doctor or an OWNER with doctor details.' }
            canAdmit: { type: boolean, description: '"Admit now" for OWNER and FRONT_DESK when IPD is TRIAL or ON: opens the existing IPD admission sheet with treatmentCourseSittingId.' }
            accountNote: { type: string, description: '"one running account: advances and part payments carry across visits".' }
            estimateSigned: { type: boolean, description: '0.7.0 (SAH-75-10, G15-4). The sub line reads "Started <date> · <doctor>" and adds "estimate signed by patient" only when true (set by fromPlan with a signed estimate; a course from before 0.7.0 whose note is exactly that text reads true). The words "sample rates" never exist.' }
    TreatmentCourseCreateInput:
      type: object
      additionalProperties: false
      required: [fromRecordId, kind]
      properties:
        fromRecordId: { type: string, format: uuid, description: 'The open EMR record; the course''s patient is its patient (own-patient rule).' }
        kind: { $ref: '#/components/schemas/TreatmentCourseKind' }
        name: { type: [string, 'null'], minLength: 1, maxLength: 120, description: 'Null takes the kind''s default name.' }
        note: { type: [string, 'null'], maxLength: 300 }
        sittings:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/CourseSittingPlanInput' }
        fromPlan: { type: boolean, default: false, description: '0.5.0 (ADR-023 D7). DENTAL only: build the sittings from the record''s treatment plan; sittings must then be empty.' }
        tenantId: { description: 'Accepted and ignored.' }
        clinicId: { description: 'Accepted and ignored.' }
    CourseSittingPlanInput:
      type: object
      additionalProperties: false
      required: [addOptionKey]
      properties:
        addOptionKey: { type: string, pattern: '^[a-z][a-z0-9_]{1,39}$' }
        plannedDate: { type: [string, 'null'], format: date }
        items: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 200 } }
        chargePaise: { type: integer, minimum: 0, maximum: 10000000000, multipleOf: 100, description: 'Whole rupees.' }
        note: { type: [string, 'null'], maxLength: 300 }
        regimenKey: { type: [string, 'null'], pattern: '^[A-Z][A-Z0-9_]{1,39}$', description: '0.7.0 (ADR-026 D7). CHEMO courses only (else 400 validation); an existing ChemoProtocol key (else 400 validation).' }
    CourseSittingAddInput:
      type: object
      additionalProperties: false
      required: [revision, addOptionKey]
      properties:
        revision: { type: integer, format: int64, minimum: 0 }
        addOptionKey: { type: string, pattern: '^[a-z][a-z0-9_]{1,39}$' }
        plannedDate: { type: [string, 'null'], format: date }
        regimenKey: { type: [string, 'null'], pattern: '^[A-Z][A-Z0-9_]{1,39}$', description: '0.7.0. CHEMO only. Absent or null on a chemo_cycle option copies the previous cycle sitting''s regimen.' }
    CourseSittingChangeInput:
      type: object
      additionalProperties: false
      required: [revision, encounterKind, plannedDate, items, chargePaise, note]
      properties:
        revision: { type: integer, format: int64, minimum: 0 }
        encounterKind: { $ref: '#/components/schemas/CourseEncounterKind' }
        plannedDate: { type: [string, 'null'], format: date }
        items: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 200 } }
        chargePaise: { type: integer, minimum: 0, maximum: 10000000000, multipleOf: 100 }
        note: { type: [string, 'null'], maxLength: 300, description: 'For example "Admission deposit is due by 36 weeks." (stored text; no reminder, no block).' }
        regimenKey: { type: [string, 'null'], pattern: '^[A-Z][A-Z0-9_]{1,39}$', description: '0.7.0. CHEMO only; absent keeps the stored value.' }
    CourseSittingLinkVisitInput:
      type: object
      additionalProperties: false
      required: [revision, visitId]
      properties:
        revision: { type: integer, format: int64, minimum: 0 }
        visitId: { type: string, format: uuid }
    CourseSittingRevisionInput:
      type: object
      additionalProperties: false
      description: '0.7.0 (SAH-75-10). The course revision the screen holds; stale is 409 course-changed "This sitting changed. Reload.".'
      required: [revision]
      properties:
        revision: { type: integer, format: int64, minimum: 0 }
    CourseSittingMarkDoneInput:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: { type: integer, format: int64, minimum: 0 }
        visitId: { type: [string, 'null'], format: uuid, description: 'The OPD visit of the EMR hosting the panel; links an unlinked sitting first (link-visit checks). Null or absent: no link.' }
    CourseSittingDateInput:
      type: object
      additionalProperties: false
      required: [revision, plannedDate]
      properties:
        revision: { type: integer, format: int64, minimum: 0 }
        plannedDate: { type: string, format: date, description: 'Today or later, Asia/Kolkata (400 validation "Choose today or a later date.").' }
    CourseSittingAdmissionRequestInput:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: { type: integer, format: int64, minimum: 0 }
        encounterKind: { type: [string, 'null'], enum: [DAY_CARE, IPD, null], default: DAY_CARE, description: 'For an OPD sitting: the kind it moves to (the drawn button moves to DAY_CARE). Ignored for a DAY_CARE or IPD sitting.' }
    # ---------------------------------------------------------------- 0.5.0 · EMR phase 4 (ADR-023) ----
    EmrSpecialtyProfile:
      type: string
      enum: [gm, dental, og, paeds, physio, onco, surgery]
      description: 'ADR-023 D1. The mockup SCREENS map: chosen by the record snapshot''s starterKey on OPD_VISIT records. Every other starter, no starter, IPD_ROUND and ER_ASSESSMENT use the generic renderer (no profile).'
    EmrSpecialtyComponent:
      type: string
      enum: [VITALS_LOG, EXAM_GENERAL, TOOTH_CHART, DENTAL_PLAN, DENTAL_DONE, LAB_WORK, CONSENT_CHECKLIST, ANC_CHECK, FORM_F, GYNAE_EXAM, GROWTH, IMMUNIZATION, MILESTONES, WEIGHT_DOSE, PAIN_SCORE, POSTURE_GAIT, ROM_TABLE, MMT_TABLE, SPECIAL_TESTS, GOALS, MODALITIES, HOME_EXERCISES, SESSION_NOTE, SURGICAL_EXAM, SURGERY_FITNESS, SURGERY_PLAN, PREAUTH, PREOP_ORDERS, ONC_TOX, ONC_EXAM, ONC_LABS, ONC_ECOG, CHEMO_PLAN, OUTCOME_SCALES, DENTAL_MED_HISTORY]
      description: >-
        0.7.0 (SAH-75-6, ADR-026 D6): dental dental_medhx DENTAL_MED_HISTORY ("Medical history and alerts"). The other
        five Dental assessment cards are library sections with presentation CHIPS (generic renderer), not editors.
        ADR-023 D3 anchor map: gm vitals VITALS_LOG, exam EXAM_GENERAL; dental dental_chart TOOTH_CHART, tx_plan
        DENTAL_PLAN, dental_done DENTAL_DONE, dental_lab LAB_WORK, consent CONSENT_CHECKLIST; og anc ANC_CHECK, pcpndt
        FORM_F, gyn_exam GYNAE_EXAM; paeds growth GROWTH, immunization IMMUNIZATION, milestones MILESTONES, wtdose
        WEIGHT_DOSE; physio pain PAIN_SCORE, posture POSTURE_GAIT, rom ROM_TABLE, mmt MMT_TABLE, special_tests
        SPECIAL_TESTS, func_scales OUTCOME_SCALES (0.5.1), goals GOALS, modalities MODALITIES, hep HOME_EXERCISES,
        sessions SESSION_NOTE; surgery
        sx_findings SURGICAL_EXAM, sx_fitness SURGERY_FITNESS, sx_plan SURGERY_PLAN, sx_consent CONSENT_CHECKLIST,
        sx_preauth PREAUTH, sx_preop PREOP_ORDERS; onco vitals VITALS_LOG, onc_tox ONC_TOX, onc_bsa ONC_EXAM, onc_labs
        ONC_LABS, onc_ecog ONC_ECOG, onc_regimen CHEMO_PLAN. A client shows an unknown component with the generic
        renderer.
    EmrSpecialtyValue:
      description: 'ADR-023 D2. Stored under values.specialty of the anchor section; component must equal the section''s specialtyEditor.component (else 400 validation). All server-stamped properties sent by a client are ignored. Per-section size limit 32 KB as before.'
      oneOf:
        - { $ref: '#/components/schemas/SpVitalsLog' }
        - { $ref: '#/components/schemas/SpExamGeneral' }
        - { $ref: '#/components/schemas/SpToothChart' }
        - { $ref: '#/components/schemas/SpDentalPlan' }
        - { $ref: '#/components/schemas/SpEmpty' }
        - { $ref: '#/components/schemas/SpLabWork' }
        - { $ref: '#/components/schemas/SpConsentChecklist' }
        - { $ref: '#/components/schemas/SpAncCheck' }
        - { $ref: '#/components/schemas/SpFormF' }
        - { $ref: '#/components/schemas/SpGynaeExam' }
        - { $ref: '#/components/schemas/SpGrowth' }
        - { $ref: '#/components/schemas/SpImmunization' }
        - { $ref: '#/components/schemas/SpMilestones' }
        - { $ref: '#/components/schemas/SpPainScore' }
        - { $ref: '#/components/schemas/SpPostureGait' }
        - { $ref: '#/components/schemas/SpRomTable' }
        - { $ref: '#/components/schemas/SpMmtTable' }
        - { $ref: '#/components/schemas/SpSpecialTests' }
        - { $ref: '#/components/schemas/SpGoals' }
        - { $ref: '#/components/schemas/SpModalities' }
        - { $ref: '#/components/schemas/SpHomeExercises' }
        - { $ref: '#/components/schemas/SpSessionNote' }
        - { $ref: '#/components/schemas/SpSurgicalExam' }
        - { $ref: '#/components/schemas/SpSurgeryFitness' }
        - { $ref: '#/components/schemas/SpSurgeryPlan' }
        - { $ref: '#/components/schemas/SpPreauth' }
        - { $ref: '#/components/schemas/SpPreopOrders' }
        - { $ref: '#/components/schemas/SpOncTox' }
        - { $ref: '#/components/schemas/SpOncExam' }
        - { $ref: '#/components/schemas/SpOncLabs' }
        - { $ref: '#/components/schemas/SpOncEcog' }
        - { $ref: '#/components/schemas/SpChemoPlan' }
        - { $ref: '#/components/schemas/SpOutcomeScales' }
        - { $ref: '#/components/schemas/SpDentalMedHistory' }
    SpStamp:
      type: object
      readOnly: true
      description: 'Server stamp: when and by whom (membership); the name is read through platform.api on read, never copied.'
      required: [at, byMembershipId]
      properties:
        at: { type: string, format: date-time }
        byMembershipId: { type: string, format: uuid }
        byName: { type: [string, 'null'] }
    SpEmpty:
      type: object
      additionalProperties: false
      description: 'DENTAL_DONE (derived from DENTAL_PLAN rows done on this record''s date) and WEIGHT_DOSE (adds prescription rows) store nothing but their marker.'
      required: [component, schemaVersion]
      properties:
        component: { type: string, enum: [DENTAL_DONE, WEIGHT_DOSE] }
        schemaVersion: { type: integer, const: 1 }
    SpVitalsLog:
      type: object
      additionalProperties: false
      description: 'SAH-60-1, SAH-65-2 (ADR-023 D3). One entry per "Record general examination" (or change of a value). Flags are computed by the server (GM C-1; Oncology C-1, C-8) and returned in EmrSpecialtyView; adult limits are never applied in Paediatrics. Limits below are input sanity limits (ADR-023 H18), not clinical thresholds. Done: one entry in this record.'
      required: [component, schemaVersion, entries]
      properties:
        component: { type: string, const: VITALS_LOG }
        schemaVersion: { type: integer, const: 1 }
        entries:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [id]
            properties:
              id: { type: string, format: uuid, description: 'Made by the client; the idempotency key.' }
              bpSystolic: { type: [integer, 'null'], minimum: 40, maximum: 300 }
              bpDiastolic: { type: [integer, 'null'], minimum: 20, maximum: 200 }
              pulse: { type: [integer, 'null'], minimum: 20, maximum: 250 }
              spo2: { type: [integer, 'null'], minimum: 50, maximum: 100 }
              temperature: { type: [object, 'null'], additionalProperties: false, required: [value, unit], properties: { value: { type: number, multipleOf: 0.1 }, unit: { type: string, enum: [F, C], description: 'F in gm (85 to 110), C in onco (30 to 43); ADR-023 H19.' } } }
              respRate: { type: [integer, 'null'], minimum: 4, maximum: 80 }
              pain: { type: [integer, 'null'], minimum: 0, maximum: 10 }
              weightKg: { type: [number, 'null'], minimum: 0.3, maximum: 300, multipleOf: 0.1 }
              heightCm: { type: [number, 'null'], minimum: 30, maximum: 250, multipleOf: 0.5 }
              how: { type: string, enum: [TYPED], readOnly: true, description: 'Handwriting and Voice are Later (OQ-45-27); NURSE comes with SAH-72.' }
              recorded: { $ref: '#/components/schemas/SpStamp' }
    SpExamGeneral:
      type: object
      additionalProperties: false
      description: 'SAH-60-3 (tagged C-10). Signs cycle absent → present → not asked; "All absent"; systems Normal or Abnormal, "All normal" fills the drawn texts. Systems in the drawn order (0.5.1 adds general, ADR-023 D13): General "No pallor, icterus, cyanosis, oedema", CVS "S1 S2 heard, no murmur", RS "Air entry equal, clear", P/A "Soft, non-tender", CNS "Conscious, oriented, no focal deficit" (reference list gmSystems). Done: one sign or system marked and every Abnormal system has text.'
      required: [component, schemaVersion, signs, systems]
      properties:
        component: { type: string, const: EXAM_GENERAL }
        schemaVersion: { type: integer, const: 1 }
        signs:
          type: object
          additionalProperties: false
          properties:
            pallor: { $ref: '#/components/schemas/SpSignState' }
            icterus: { $ref: '#/components/schemas/SpSignState' }
            cyanosis: { $ref: '#/components/schemas/SpSignState' }
            clubbing: { $ref: '#/components/schemas/SpSignState' }
            lymphadenopathy: { $ref: '#/components/schemas/SpSignState' }
            oedema: { $ref: '#/components/schemas/SpSignState' }
            dehydration: { $ref: '#/components/schemas/SpSignState' }
        systems:
          type: object
          additionalProperties: false
          properties:
            general: { $ref: '#/components/schemas/SpSystemFinding', description: '0.5.1. "General" line of the mockup.' }
            cvs: { $ref: '#/components/schemas/SpSystemFinding' }
            rs: { $ref: '#/components/schemas/SpSystemFinding' }
            pa: { $ref: '#/components/schemas/SpSystemFinding' }
            cns: { $ref: '#/components/schemas/SpSystemFinding' }
    SpSignState:
      type: [string, 'null']
      enum: [ABSENT, PRESENT, null]
    SpSystemFinding:
      type: [object, 'null']
      additionalProperties: false
      required: [state]
      properties:
        state: { type: string, enum: [NORMAL, ABNORMAL] }
        text: { type: [string, 'null'], maxLength: 1000, description: 'Normal: the drawn default text (CVS "S1 S2 heard, no murmur" …). Abnormal: "What did you find?" (required for the system to count).' }
        chips: { type: array, maxItems: 10, items: { type: string, maxLength: 40 }, description: 'Oncology system chips (New murmur, Raised JVP, Tachycardia, S3 …), as drawn.' }
    SpToothChart:
      type: object
      additionalProperties: false
      description: 'SAH-49-1 (tagged C-3). Teeth are always stored by FDI number (11–48 adult, 51–85 primary); only teeth that differ from Healthy / no surfaces / G0 are stored. Child tab keeps adult teeth stored but hidden. Done: one tooth not Healthy, or allHealthyConfirmed.'
      required: [component, schemaVersion, numbering, dentition, showNumbers, teeth, shade, gum, allHealthyConfirmed]
      properties:
        component: { type: string, const: TOOTH_CHART }
        schemaVersion: { type: integer, const: 1 }
        numbering: { type: string, enum: [FDI, UNIVERSAL, PALMER], description: 'Display only; FDI at start.' }
        dentition: { type: string, enum: [ADULT, CHILD], description: 'Tab; opens on CHILD for a patient under 13 (ADR-023 H15).' }
        showNumbers: { type: boolean, description: '"Numbers" switch, this visit only.' }
        teeth:
          type: array
          maxItems: 52
          items:
            type: object
            additionalProperties: false
            required: [tooth, condition, surfaces, mobility]
            properties:
              tooth: { type: integer, minimum: 11, maximum: 85, description: 'FDI number; quadrant digit 1–8, tooth digit 1–8 (adult) or 1–5 (primary); others 400.' }
              condition: { type: string, enum: [HEALTHY, CARIES, FILLED, RCT, CROWN, MISSING, TO_EXTRACT, IMPLANT] }
              surfaces: { type: array, uniqueItems: true, maxItems: 5, items: { type: string, enum: [M, O, D, B, L] }, description: 'Only for CARIES, FILLED, CROWN (else must be empty, 400).' }
              mobility: { type: integer, minimum: 0, maximum: 3, description: 'G0 to G3.' }
        shade: { type: string, enum: [A1, B1, A2, A3, C2], description: 'A2 at start.' }
        gum: { type: string, enum: [PINK, LIGHT_BROWN, DARK_BROWN], description: 'PINK at start.' }
        allHealthyConfirmed: { type: boolean, description: '"All teeth healthy" (analyst addition).' }
    SpDentalPlan:
      type: object
      additionalProperties: false
      description: 'SAH-49-2, SAH-69-1 (tagged C-3, B-2). Same tooth and procedure twice (ignoring case): 400 duplicate-item. Status tap PLANNED → IN_PROGRESS → DONE → PLANNED; doneOn is stamped with this record''s date. Estimate: tariff price when a service matches (estimateSource TARIFF, never sent by the client), else "Not in tariff" and the typed amount. signEstimate true stamps estimate.signed; any later change of rows, teeth, procedures or amounts sets state CHANGED ("Estimate changed. Sign again") and clears the tick. Done: one row.'
      required: [component, schemaVersion, rows]
      properties:
        component: { type: string, const: DENTAL_PLAN }
        schemaVersion: { type: integer, const: 1 }
        rows:
          type: array
          maxItems: 60
          items:
            type: object
            additionalProperties: false
            required: [id, tooth, procedureKey, procedureText, phase, status, sittingsPlanned, currentSitting]
            properties:
              id: { type: string, format: uuid }
              tooth: { type: integer, minimum: 11, maximum: 85 }
              procedureKey: { type: [string, 'null'], enum: [COMPOSITE_FILLING, ROOT_CANAL, PFM_CROWN, REPLACE_FILLING, CROWN_RECEMENTATION, IMPLANT_WITH_CROWN, BRIDGE, EXTRACTION, IMPLANT_REVIEW, null], description: 'A suggestion of C-3; null for a typed procedure (EMR list "Procedure / service" search).' }
              procedureText: { type: string, minLength: 1, maxLength: 160, description: 'With ticked surfaces in brackets, for example "Composite filling (O)".' }
              serviceId: { type: [string, 'null'], format: uuid, readOnly: true }
              phase: { type: integer, minimum: 1, maximum: 3 }
              status: { type: string, enum: [PLANNED, IN_PROGRESS, DONE] }
              sittingsPlanned: { type: integer, minimum: 1, maximum: 6, description: 'Root canal 3 at start (tagged C-3); 1–6 analyst addition.' }
              currentSitting: { type: integer, minimum: 1, maximum: 6, description: '"Sitting n of m".' }
              typedEstimatePaise: { type: [integer, 'null'], minimum: 0, maximum: 10000000000, multipleOf: 100, description: 'Only when the procedure is not in the tariff; kept on the plan only.' }
              estimatePaise: { type: [integer, 'null'], readOnly: true }
              estimateSource: { type: string, enum: [TARIFF, TYPED, NONE], readOnly: true }
              sittingSharesPaise: { type: array, readOnly: true, items: { type: integer }, description: 'Equal parts rounded to ₹ 50, last takes the rest (analyst reading, flagged).' }
              doneOn: { type: [string, 'null'], format: date, readOnly: true }
        signEstimate: { type: boolean, writeOnly: true, description: 'Tick "Estimate signed by patient". Ignored when there is no row (the print is disabled "Add a treatment first").' }
        estimate:
          type: object
          readOnly: true
          required: [state, totalPaise]
          properties:
            state: { type: string, enum: [NOT_SIGNED, SIGNED, CHANGED] }
            totalPaise: { type: integer, minimum: 0 }
            signed: { oneOf: [{ $ref: '#/components/schemas/SpStamp' }, { type: 'null' }] }
            signedTotalPaise: { type: [integer, 'null'] }
        courseId: { type: [string, 'null'], format: uuid, readOnly: true, description: 'The DENTAL course started from this plan (fromPlan).' }
    SpLabWork:
      type: object
      additionalProperties: false
      description: 'SAH-69-2. Nothing is ordered; no message to a lab (OQ-45-28). A due date before today on a new or changed item: 400 validation on dueDate. Done: one item.'
      required: [component, schemaVersion, items]
      properties:
        component: { type: string, const: LAB_WORK }
        schemaVersion: { type: integer, const: 1 }
        items:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [id, planRowId, tooth, item, labName, dueDate]
            properties:
              id: { type: string, format: uuid }
              planRowId: { type: [string, 'null'], format: uuid }
              tooth: { type: [integer, 'null'], minimum: 11, maximum: 85 }
              item: { type: string, enum: [CROWN, BRIDGE, DENTURE, ALIGNER] }
              labName: { type: [string, 'null'], maxLength: 80, description: 'Free text (no vendor list exists).' }
              dueDate: { type: [string, 'null'], format: date }
    SpConsentChecklist:
      type: object
      additionalProperties: false
      description: 'SAH-69-2 (dental: one item per plan row the doctor adds, key = plan row id, formLabel free text), SAH-71-2 (surgery: the five fixed items PROCEDURE_RISKS "Procedure, benefits and risks explained", CONVERSION_TO_OPEN, ANAESTHESIA, BLOOD_TRANSFUSION, PHOTOS_VIDEO; none ticked at start). Tagged L-3. The signature image is Later (OQ-45-28); the tick is the record. Done: at least one item and every item ticked. Audit EMR_CONSENT_RECORDED (ticked count, total).'
      required: [component, schemaVersion, items]
      properties:
        component: { type: string, const: CONSENT_CHECKLIST }
        schemaVersion: { type: integer, const: 1 }
        items:
          type: array
          maxItems: 60
          items:
            type: object
            additionalProperties: false
            required: [key, confirmed]
            properties:
              key: { type: string, maxLength: 40 }
              formLabel: { type: [string, 'null'], maxLength: 80 }
              confirmed: { type: boolean }
              confirmedStamp: { oneOf: [{ $ref: '#/components/schemas/SpStamp' }, { type: 'null' }] }
    SpAncCheck:
      type: object
      additionalProperties: false
      description: 'SAH-61-1, SAH-61-4 (tagged C-4). LMP is read from the menstrual section; obstetric score and previous LSCS from the obstetric section. Ordering a due order or PIH workup or NST records it here only; the client also adds the tests to Investigations (no lab order, OQ-45-28). Supplements ticked are added by the client as prescription rows (source SPECIALTY_LIST). Done: one of today''s values.'
      required: [component, schemaVersion, today, symptoms, orders, scans]
      properties:
        component: { type: string, const: ANC_CHECK }
        schemaVersion: { type: integer, const: 1 }
        datingScanEdd: { type: [string, 'null'], format: date, description: 'Wins over LMP for EDD and GA.' }
        today:
          type: object
          additionalProperties: false
          properties:
            weightKg: { type: [number, 'null'], minimum: 25, maximum: 200, multipleOf: 0.1 }
            bpSystolic: { type: [integer, 'null'], minimum: 40, maximum: 300 }
            bpDiastolic: { type: [integer, 'null'], minimum: 20, maximum: 200 }
            fundalHeightCm: { type: [integer, 'null'], minimum: 5, maximum: 50 }
            fetalHeartBpm: { type: [integer, 'null'], minimum: 50, maximum: 250, multipleOf: 2 }
            hbGdl: { type: [number, 'null'], minimum: 2, maximum: 20, multipleOf: 0.1 }
        symptoms: { type: array, uniqueItems: true, items: { type: string, enum: [HEADACHE, BLURRED_VISION, BLEEDING_LEAKING, REDUCED_MOVEMENTS] } }
        orders:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [key]
            properties:
              key: { type: string, enum: [PIH_WORKUP, NST, OGTT_75G, TD_2ND_DOSE, GROWTH_SCAN_FORM_F] }
              ordered: { oneOf: [{ $ref: '#/components/schemas/SpStamp' }, { type: 'null' }] }
        anaemiaPlanAdded: { type: boolean }
        supplements: { type: array, uniqueItems: true, items: { type: string, enum: [IRON, CALCIUM_VIT_D3, FOLIC_ACID] } }
        scans:
          type: array
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [key, done]
            properties:
              key: { type: string, enum: [DATING, NT, ANOMALY, GROWTH, DOPPLER_NST] }
              done: { type: boolean }
              finding: { type: [string, 'null'], maxLength: 200 }
        nextAncWeeks: { type: [integer, 'null'], minimum: 4, maximum: 42, description: 'The doctor''s choice ("Next ANC at 30 weeks"); no rule sets it.' }
        planNote: { type: [string, 'null'], maxLength: 200 }
        pregnancyCourseId: { type: [string, 'null'], format: uuid, readOnly: true, description: 'The patient''s ACTIVE ANC course, stamped by the server.' }
    SpFormF:
      type: object
      additionalProperties: false
      description: 'SAH-61-2 (tagged L-2). Required while an obstetric scan is ordered in this record (ANC GROWTH_SCAN_FORM_F or an ANC scan order; ADR-023 H10) and not marked. Referral slip file and declaration signature are Later (OQ-45-28). A removed scan order keeps the form ("Scan removed. Form F kept"). Audit EMR_FORM_F_MARKED (record id).'
      required: [component, schemaVersion, filledAndSigned]
      properties:
        component: { type: string, const: FORM_F }
        schemaVersion: { type: integer, const: 1 }
        filledAndSigned: { type: boolean, description: '"Form F filled and declaration signed".' }
        marked: { oneOf: [{ $ref: '#/components/schemas/SpStamp' }, { type: 'null' }] }
        scanKey: { type: [string, 'null'], readOnly: true }
        scanRemoved: { type: boolean, readOnly: true }
    SpGynaeExam:
      type: object
      additionalProperties: false
      description: 'SAH-61-3. Done: one finding and the chaperone recorded (name or declined; analyst safety rule). The chaperone''s name is personal data: never logged.'
      required: [component, schemaVersion]
      properties:
        component: { type: string, const: GYNAE_EXAM }
        schemaVersion: { type: integer, const: 1 }
        perAbdomen: { type: [string, 'null'], maxLength: 1000 }
        perSpeculum: { type: [string, 'null'], maxLength: 1000 }
        perVaginum: { type: [string, 'null'], maxLength: 1000 }
        chaperoneName: { type: [string, 'null'], maxLength: 80 }
        chaperoneDeclined: { type: boolean, description: '"Declined by patient"; chaperoneName must then be null.' }
    SpGrowth:
      type: object
      additionalProperties: false
      description: 'SAH-62-1 (tagged C-5). Steps 0.1 kg, 0.5 cm. Notes come from the growth band reference (only the drawn 18-month bands exist; otherwise "Centile not available for this age", OQ-45-32). Done: today''s weight.'
      required: [component, schemaVersion]
      properties:
        component: { type: string, const: GROWTH }
        schemaVersion: { type: integer, const: 1 }
        weightKg: { type: [number, 'null'], minimum: 0.3, maximum: 150, multipleOf: 0.1 }
        lengthCm: { type: [number, 'null'], minimum: 25, maximum: 200, multipleOf: 0.5 }
        headCircCm: { type: [number, 'null'], minimum: 20, maximum: 70, multipleOf: 0.5 }
        previous:
          type: [object, 'null']
          readOnly: true
          description: 'Copied from the last signed Paediatrics visit for comparison only ("Copied from <date>").'
          properties:
            date: { type: string, format: date }
            weightKg: { type: [number, 'null'] }
            lengthCm: { type: [number, 'null'] }
            headCircCm: { type: [number, 'null'] }
    SpImmunization:
      type: object
      additionalProperties: false
      description: 'SAH-62-2 (tagged C-5). Only vaccines DUE_TODAY or OVERDUE may be added; a vaccine given in an earlier record cannot be added or removed (400 validation). givenOn = today, stamped. Done: scheduleReviewed or one vaccine given today. 0.7.0 (SAH-75-9, ADR-026 D8; supersedes ADR-023 D4 "due today only"): "Mark all due as given" adds every DUE_TODAY and every OVERDUE vaccine of EmrSpecialtyView.paeds.vaccines in one save, never a LATER one; toast "<n> vaccines recorded" (batch numbers Later, OQ-75-13). A vaccineKey sent twice is stored once. Clinical rule from the mockup, not clinically reviewed.'
      required: [component, schemaVersion, givenToday, scheduleReviewed]
      properties:
        component: { type: string, const: IMMUNIZATION }
        schemaVersion: { type: integer, const: 1 }
        givenToday:
          type: array
          maxItems: 30
          items:
            type: object
            additionalProperties: false
            required: [vaccineKey]
            properties:
              vaccineKey: { type: string, pattern: '^[a-z][a-z0-9_]{1,39}$' }
              given: { oneOf: [{ $ref: '#/components/schemas/SpStamp' }, { type: 'null' }] }
        scheduleReviewed: { type: boolean, description: '"Schedule reviewed" (analyst addition).' }
    SpMilestones:
      type: object
      additionalProperties: false
      description: 'SAH-62-2 (tagged C-5). Only age bands in the reference (18 months); other ages "Milestones for this age are not set up" and nothing is stored. Done: one milestone toggled.'
      required: [component, schemaVersion, ageBandMonths, achieved, notYet]
      properties:
        component: { type: string, const: MILESTONES }
        schemaVersion: { type: integer, const: 1 }
        ageBandMonths: { type: integer, minimum: 0, maximum: 216 }
        achieved: { type: array, uniqueItems: true, items: { type: string, maxLength: 40 } }
        notYet: { type: array, uniqueItems: true, items: { type: string, maxLength: 40 } }
    SpPainScore:
      type: object
      additionalProperties: false
      description: 'SAH-63-1 (tagged C-6). NPRS 0 "no pain" to 10 "worst pain". Done: a score. 0.7.0 (SAH-75-5, OQ-75-3, ADR-026 D5): card "Pain site" is one marker on the shared body figure (front view, "R" and "L" as drawn) set by tapping the body, plus the one-line note in site (for example "Right knee, medial side · worse on stairs, better with rest"); no findings register, no MLC. Done unchanged.'
      required: [component, schemaVersion, score]
      properties:
        component: { type: string, const: PAIN_SCORE }
        schemaVersion: { type: integer, const: 1 }
        score: { type: [integer, 'null'], minimum: 0, maximum: 10 }
        site: { type: [string, 'null'], maxLength: 120, description: '0.7.0: the note under the figure (was 80). Clinical text: never logged.' }
        siteMarker:
          type: [object, 'null']
          additionalProperties: false
          description: '0.7.0. The marked region; null when none. A point outside the figure (no region at that point) is 400 validation and the rest of the save is refused with it.'
          required: [side, x, y, region]
          properties:
            side: { type: string, enum: [FRONT], description: 'Front view only, as drawn (ADR-026 H8).' }
            x: { type: number, minimum: 0, maximum: 1 }
            y: { type: number, minimum: 0, maximum: 1 }
            region: { type: string, pattern: '^[a-z][a-z0-9_]{1,39}$', description: 'Body-map region key (EmrBodyMapPin.region list, fixed in code).' }
    SpPostureGait:
      type: object
      additionalProperties: false
      required: [component, schemaVersion, gait]
      properties:
        component: { type: string, const: POSTURE_GAIT }
        schemaVersion: { type: integer, const: 1 }
        gait: { type: [string, 'null'], enum: [NORMAL, ANTALGIC, WITH_STICK, WITH_WALKER, null] }
    SpRomTable:
      type: object
      additionalProperties: false
      description: 'SAH-63-1 (tagged C-6). joint knee uses the reference rows (normal values, bar %); any other joint is typed and has no normal range (gap shown to the human). Done: one value.'
      required: [component, schemaVersion, joint, rows]
      properties:
        component: { type: string, const: ROM_TABLE }
        schemaVersion: { type: integer, const: 1 }
        joint: { type: string, minLength: 1, maxLength: 40, description: '"knee" or typed text.' }
        rows:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [movement, rightDeg, leftDeg]
            properties:
              movement: { type: string, minLength: 1, maxLength: 40, description: 'A reference item key (flexion, extension, flexion_passive) or typed text.' }
              rightDeg: { type: [integer, 'null'], minimum: -30, maximum: 200 }
              leftDeg: { type: [integer, 'null'], minimum: -30, maximum: 200 }
    SpMmtTable:
      type: object
      additionalProperties: false
      description: 'SAH-63-1 (tagged C-6). Manual muscle testing 0 to 5; outside is 400 validation.'
      required: [component, schemaVersion, rows]
      properties:
        component: { type: string, const: MMT_TABLE }
        schemaVersion: { type: integer, const: 1 }
        rows:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [group, right, left]
            properties:
              group: { type: string, minLength: 1, maxLength: 60 }
              right: { type: [integer, 'null'], minimum: 0, maximum: 5 }
              left: { type: [integer, 'null'], minimum: 0, maximum: 5 }
    SpSpecialTests:
      type: object
      additionalProperties: false
      description: 'SAH-63-1 (tagged C-6). Tap cycles NOT_DONE → POSITIVE (red) → NEGATIVE (green) → NOT_DONE.'
      required: [component, schemaVersion, joint, results]
      properties:
        component: { type: string, const: SPECIAL_TESTS }
        schemaVersion: { type: integer, const: 1 }
        joint: { type: string, minLength: 1, maxLength: 40 }
        results:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [test, result]
            properties:
              test: { type: string, minLength: 1, maxLength: 60 }
              result: { type: string, enum: [NOT_DONE, POSITIVE, NEGATIVE] }
    SpGoals:
      type: object
      additionalProperties: false
      description: 'SAH-63-2. Goals stay achieved in later sessions (carried by Copy from last visit when on). achievedOn stamped when a goal becomes achieved.'
      required: [component, schemaVersion, goals]
      properties:
        component: { type: string, const: GOALS }
        schemaVersion: { type: integer, const: 1 }
        goals:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [id, text, achieved]
            properties:
              id: { type: string, format: uuid }
              text: { type: string, minLength: 1, maxLength: 200 }
              achieved: { type: boolean }
              achievedOn: { type: [string, 'null'], format: date, readOnly: true }
    SpModalities:
      type: object
      additionalProperties: false
      description: 'SAH-63-2 (tagged C-6). Keys IFT, HOT_PACK, ULTRASOUND, TENS, EXERCISE_THERAPY, TAPING with the drawn default parameters (reference); a typed modality has key null and stays on this record only (OQ-45-17). In SESSION mode the footer reads "Select at least one treatment given today." until one is given.'
      required: [component, schemaVersion, given]
      properties:
        component: { type: string, const: MODALITIES }
        schemaVersion: { type: integer, const: 1 }
        given:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [key, text, params]
            properties:
              key: { type: [string, 'null'], enum: [IFT, HOT_PACK, ULTRASOUND, TENS, EXERCISE_THERAPY, TAPING, null] }
              text: { type: string, minLength: 1, maxLength: 60 }
              params: { type: [string, 'null'], maxLength: 80 }
    SpHomeExercises:
      type: object
      additionalProperties: false
      description: 'SAH-63-4. Exercise names are typed (the exercise library is Later, OQ-45-28); pictures Later.'
      required: [component, schemaVersion, items]
      properties:
        component: { type: string, const: HOME_EXERCISES }
        schemaVersion: { type: integer, const: 1 }
        items:
          type: array
          maxItems: 30
          items:
            type: object
            additionalProperties: false
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string, minLength: 1, maxLength: 120 }
              sets: { type: [integer, 'null'], minimum: 1, maximum: 20 }
              reps: { type: [integer, 'null'], minimum: 1, maximum: 100 }
              holdSeconds: { type: [integer, 'null'], minimum: 0, maximum: 600 }
    SpSessionNote:
      type: object
      additionalProperties: false
      required: [component, schemaVersion, note]
      properties:
        component: { type: string, const: SESSION_NOTE }
        schemaVersion: { type: integer, const: 1 }
        note: { type: [string, 'null'], maxLength: 2000 }
    SpSurgicalExam:
      type: object
      additionalProperties: false
      description: 'SAH-64-1 (tagged C-10).'
      required: [component, schemaVersion, abdomen, herniaSites]
      properties:
        component: { type: string, const: SURGICAL_EXAM }
        schemaVersion: { type: integer, const: 1 }
        abdomen: { type: array, uniqueItems: true, items: { type: string, enum: [SOFT, TENDER_RIGHT_UPPER, TENDER_RIGHT_LOWER, GUARDING, DISTENDED, LUMP_FELT] } }
        murphySign: { type: [string, 'null'], enum: [POSITIVE, NEGATIVE, null] }
        jaundice: { type: [string, 'null'], enum: [NO, YES, null] }
        herniaSites: { type: array, uniqueItems: true, items: { type: string, enum: [NORMAL, RIGHT_INGUINAL, LEFT_INGUINAL, UMBILICAL, INCISIONAL] } }
        perRectal: { type: [string, 'null'], enum: [NOT_NEEDED, NORMAL, PILES, FISSURE, MASS, null] }
    SpSurgeryFitness:
      type: object
      additionalProperties: false
      description: 'SAH-64-2 (tagged C-7). Warnings (information, not a block): a blood thinner other than NONE, an illness other than NONE, PAC UNFIT. Summary in EmrSpecialtyView.surgery.fitness.'
      required: [component, schemaVersion, otherIllness, pac, tests]
      properties:
        component: { type: string, const: SURGERY_FITNESS }
        schemaVersion: { type: integer, const: 1 }
        asa: { type: [string, 'null'], enum: [I, II, III, IV, null] }
        otherIllness: { type: array, uniqueItems: true, items: { type: string, enum: [NONE, DIABETES, HIGH_BP, HEART_DISEASE, ASTHMA_COPD, KIDNEY_DISEASE] } }
        bloodThinner: { type: [string, 'null'], enum: [NONE, ASPIRIN, CLOPIDOGREL, WARFARIN_DOAC, null] }
        pac: { type: string, enum: [NOT_DONE, FIT, FIT_WITH_CAUTION, UNFIT], description: 'NOT_DONE at start.' }
        tests:
          type: array
          maxItems: 11
          items:
            type: object
            additionalProperties: false
            required: [key, state]
            properties:
              key: { type: string, enum: [CBC, LFT, KFT, PT_INR, BLOOD_SUGAR, ECG, CHEST_XRAY, HIV, HBSAG, HCV, BLOOD_GROUP] }
              state: { type: string, enum: [PENDING, NORMAL, ABNORMAL] }
              result: { type: [string, 'null'], maxLength: 200, description: 'Typed by the doctor (no Lab module).' }
    SpSurgeryPlan:
      type: object
      additionalProperties: false
      description: 'SAH-64-3, SAH-71-1 (tagged C-7, B-1, B-2, B-3). Procedure defaults (anaesthesia, stay) come from the reference and can be changed. Package: tariff price (packageSource TARIFF) or typed by the doctor or owner ("Not in tariff"); never the mockup''s sample rate. Booking is written only by POST /emr/records/{recordId}/surgery-booking. Done: booking state BOOKED.'
      required: [component, schemaVersion, procedureKey, procedureText, anaesthesia, admission, payer]
      properties:
        component: { type: string, const: SURGERY_PLAN }
        schemaVersion: { type: integer, const: 1 }
        procedureKey: { type: [string, 'null'], enum: [LAP_CHOLECYSTECTOMY, OPEN_CHOLECYSTECTOMY, LAP_HERNIA_TEP, OPEN_MESH_HERNIOPLASTY, LAP_APPENDICECTOMY, HAEMORRHOIDECTOMY, EXCISION_LIPOMA, INCISION_DRAINAGE, null], description: 'Null for a typed procedure (no default, no rate).' }
        procedureText: { type: [string, 'null'], maxLength: 160 }
        approach: { type: [string, 'null'], maxLength: 200 }
        anaesthesia: { type: [string, 'null'], enum: [GA, SPINAL, LOCAL, LOCAL_SEDATION, null] }
        admission: { type: [string, 'null'], enum: [DAY_CARE, IPD_1_DAY, IPD_1_2_DAYS, IPD_2_DAYS, IPD_4_5_DAYS, null] }
        otDate: { type: [string, 'null'], format: date }
        slotText: { type: [string, 'null'], maxLength: 40, description: 'Text label, for example "OT 2 · 10:00" (no OT schedule, OQ-45-28).' }
        payer: { type: string, enum: [SELF, INSURANCE_TPA, MJPJAY_PMJAY, COMPANY] }
        typedPackagePaise: { type: [integer, 'null'], minimum: 0, maximum: 10000000000, multipleOf: 100 }
        packagePaise: { type: [integer, 'null'], readOnly: true }
        packageSource: { type: string, enum: [TARIFF, TYPED, NONE], readOnly: true }
        booking:
          type: [object, 'null']
          readOnly: true
          properties:
            stamp: { $ref: '#/components/schemas/SpStamp' }
            courseId: { type: string, format: uuid }
            sittingId: { type: [string, 'null'], format: uuid }
            admissionRequested: { type: boolean }
    SpPreauth:
      type: object
      additionalProperties: false
      description: 'SAH-71-1 (tagged B-3, L-5). Nothing is sent to an insurer or scheme.'
      required: [component, schemaVersion, sent]
      properties:
        component: { type: string, const: PREAUTH }
        schemaVersion: { type: integer, const: 1 }
        sent: { type: boolean, description: '"Pre-authorisation sent". 0.7.0 (SAH-75-11 G-S7): means the clinic requested pre-authorisation; the button reads "Send pre-authorisation to <payer>", then "✓ Pre-authorisation sent to <payer>", and the toast never claims the payer received it (no integration).' }
        sentOn: { type: [string, 'null'], format: date }
        reference: { type: [string, 'null'], maxLength: 60 }
    SpPreopOrders:
      type: object
      additionalProperties: false
      description: 'SAH-71-3 (tagged C-7). Instructions on the pre-op sheet, never medicine orders ("Medicine orders are placed by the ward", OQ-43-24). No blood bank request (OQ-45-28). Blood chip keys are the mockup''s chips, listed in the reference.'
      required: [component, schemaVersion, ticked, extraLines]
      properties:
        component: { type: string, const: PREOP_ORDERS }
        schemaVersion: { type: integer, const: 1 }
        ticked: { type: array, uniqueItems: true, items: { type: string, enum: [NIL_BY_MOUTH, INHALER_MORNING, ANTIBIOTIC_INDUCTION, PART_PREPARATION, CLOT_PREVENTION, ADMIT_7AM_OT_10AM] } }
        extraLines: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 200 } }
        blood: { type: [string, 'null'], enum: [NOT_NEEDED, GROUP_AND_SAVE, ONE_UNIT_RESERVED, null], description: '0.5.2 (ADR-023 D14): the mockup''s Blood chips "Not needed", "Group and save", "1 unit reserved" (reference surgeryBlood keys), single choice. Another value is 400 validation; a stored value outside the set reads as null.' }
    SpOncTox:
      type: object
      additionalProperties: false
      description: 'SAH-65-1 (tagged C-8). Nine symptoms; the patient''s grade is shown but is not the confirmed grade. Done (and footer "n side effect grade(s)"): all nine confirmed.'
      required: [component, schemaVersion, symptoms, events]
      properties:
        component: { type: string, const: ONC_TOX }
        schemaVersion: { type: integer, const: 1 }
        symptoms:
          type: array
          maxItems: 9
          items:
            type: object
            additionalProperties: false
            required: [key, patientGrade, confirmedGrade]
            properties:
              key: { type: string, enum: [NAUSEA, VOMITING, MOUTH_SORES, LOOSE_MOTIONS, TINGLING_NUMBNESS, FATIGUE, FEVER_LOW_COUNTS, PAIN, LOSS_OF_APPETITE] }
              patientGrade: { type: [integer, 'null'], minimum: 0, maximum: 4 }
              confirmedGrade: { type: [integer, 'null'], minimum: 0, maximum: 4 }
        events: { type: array, uniqueItems: true, items: { type: string, enum: [ER_VISIT, ADMITTED, FEVER_38_AT_HOME, BLOOD_TRANSFUSION, ANTIBIOTICS, MISSED_ORAL_MEDICINES] } }
    SpOncExam:
      type: object
      additionalProperties: false
      description: 'SAH-65-2 (tagged C-8; ADR-023 H1: the whole "2 · Examination" card is stored here because the Oncology starter hides exam). BSA, weight change, lesion change, response and line readiness are computed (EmrSpecialtyView.onco). Systems as drawn (reference lists oncSystems and oncSystemChips): cvs "Heart (CVS)", rs "Lungs (RS)", pa "Abdomen", cns "Nervous system", bone "Spine and bones" (0.5.1, ADR-023 D13). Done (footer "systemic exam"): weight, height and every one of the five systems marked.'
      required: [component, schemaVersion, capAt2, signs, lesions, newLesionSeen, breastSkin, systems, line]
      properties:
        component: { type: string, const: ONC_EXAM }
        schemaVersion: { type: integer, const: 1 }
        heightCm: { type: [number, 'null'], minimum: 50, maximum: 250, multipleOf: 0.5 }
        weightKg: { type: [number, 'null'], minimum: 2, maximum: 300, multipleOf: 0.1 }
        capAt2: { type: boolean, description: '"Cap at 2.0 m²".' }
        signs:
          type: object
          additionalProperties: false
          properties:
            pallor: { $ref: '#/components/schemas/SpSignState' }
            icterus: { $ref: '#/components/schemas/SpSignState' }
            cyanosis: { $ref: '#/components/schemas/SpSignState' }
            clubbing: { $ref: '#/components/schemas/SpSignState' }
            lymphNodes: { $ref: '#/components/schemas/SpSignState' }
            pedalOedema: { $ref: '#/components/schemas/SpSignState' }
            dehydration: { $ref: '#/components/schemas/SpSignState' }
        lesions:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [id, name, baselineCm, todayCm]
            properties:
              id: { type: string, format: uuid }
              name: { type: string, minLength: 1, maxLength: 60 }
              baselineCm: { type: number, minimum: 0, maximum: 50, multipleOf: 0.1 }
              lastCm: { type: [number, 'null'], readOnly: true, description: 'Today''s size of the previous record (copied on open when copy is on).' }
              todayCm: { type: [number, 'null'], minimum: 0, maximum: 50, multipleOf: 0.1 }
        newLesionSeen: { type: boolean }
        breastSkin: { type: array, uniqueItems: true, items: { type: string, enum: [SKIN_REDNESS, PEAU_D_ORANGE, ULCERATION, NIPPLE_RETRACTION, FIXED_TO_CHEST_WALL, LUMP_NOW_MOBILE] } }
        systems:
          type: object
          additionalProperties: false
          properties:
            cvs: { $ref: '#/components/schemas/SpSystemFinding' }
            rs: { $ref: '#/components/schemas/SpSystemFinding' }
            pa: { $ref: '#/components/schemas/SpSystemFinding' }
            cns: { $ref: '#/components/schemas/SpSystemFinding' }
            bone: { $ref: '#/components/schemas/SpSystemFinding', description: '0.5.1. "Spine and bones" (hint "Bone spread"; chips Spine tenderness, Rib tenderness, Restricted movement). Tagged C-8.' }
        line:
          type: object
          additionalProperties: false
          required: [device, checks]
          properties:
            device: { type: [string, 'null'], enum: [PORT, PICC, PERIPHERAL, null] }
            checks: { type: array, uniqueItems: true, items: { type: string, enum: [FLUSHES_FREELY, BLOOD_RETURN, NO_REDNESS_SWELLING, NO_PAIN, DRESSING_CLEAN, FLUSHED_4_WEEKS] }, description: 'Ready for a vesicant when FLUSHES_FREELY, BLOOD_RETURN and NO_REDNESS_SWELLING are ticked (PORT only).' }
        bodyMap:
          oneOf: [{ $ref: '#/components/schemas/EmrBodyMapValue' }, { type: 'null' }]
          description: >-
            0.7.0 (SAH-75-5, ADR-026 D5). The Examination tab "Body map" ("Body map · mark lumps, nodes, skin lesions,
            port site"; second line "Optional" with no pins, "n marked" with pins), opening on the patient's recorded
            sex. Same rules as every body map (ADR-022 D8): pin numbers, server-stamped properties, the MLC rule L-1 and
            the EMR_MLC_FLAG_CHANGED audit, and EmrRecordHeader.mlc counts it. Optional: ONC_EXAM Done does not need it.
            Null or absent when nothing is marked.
    SpOncLabs:
      type: object
      additionalProperties: false
      description: 'SAH-65-3 (tagged C-8). Typed by the doctor ("Typed by the doctor (labs are not connected yet)", OQ-45-28). Steps 0.2, 100, 10, 0.1, 0.1, 5, 1. Done: all seven values and drawnAt.'
      required: [component, schemaVersion, drawnAt, values]
      properties:
        component: { type: string, const: ONC_LABS }
        schemaVersion: { type: integer, const: 1 }
        drawnAt: { type: [string, 'null'], format: date-time, description: 'Default now; a time in the future is 400 validation.' }
        values:
          type: object
          additionalProperties: false
          properties:
            hb: { type: [number, 'null'], minimum: 1, maximum: 25 }
            anc: { type: [integer, 'null'], minimum: 0, maximum: 100000 }
            plt: { type: [integer, 'null'], minimum: 0, maximum: 2000, description: '×10³/µL' }
            cr: { type: [number, 'null'], minimum: 0, maximum: 30 }
            bili: { type: [number, 'null'], minimum: 0, maximum: 50 }
            alt: { type: [integer, 'null'], minimum: 0, maximum: 5000 }
            lvef: { type: [integer, 'null'], minimum: 5, maximum: 90 }
        source: { type: string, enum: [TYPED], readOnly: true }
    SpOncEcog:
      type: object
      additionalProperties: false
      description: 'SAH-65-3 (tagged C-8). 0 Fully active … 4 Fully bedbound; fit for chemo at 2 or lower.'
      required: [component, schemaVersion, grade]
      properties:
        component: { type: string, const: ONC_ECOG }
        schemaVersion: { type: integer, const: 1 }
        grade: { type: [integer, 'null'], minimum: 0, maximum: 4 }
    SpChemoPlan:
      type: object
      additionalProperties: false
      description: 'SAH-70-1, SAH-70-2 (tagged C-8). Ticked take-home lines are added by the client to the prescription (source SPECIALTY_LIST; allergy check applies); the first, second, third and fifth are ticked at the start of a cycle. Next cycle date default = today + the protocol interval, or + 7 days when delayed (computed in EmrSpecialtyView.onco.nextCycle). Referrals print as referral lines; nothing is sent (OQ-45-28). Done (footer "send chemo order" or "record the hold"): the order is SENT or HELD.'
      required: [component, schemaVersion, takeHome, referrals]
      properties:
        component: { type: string, const: CHEMO_PLAN }
        schemaVersion: { type: integer, const: 1 }
        takeHome:
          type: array
          uniqueItems: true
          items: { type: string, enum: [ONDANSETRON_8, DEXAMETHASONE_4, PANTOPRAZOLE_40, PEGFILGRASTIM_6, BENZYDAMINE_MOUTHWASH, LOPERAMIDE_2] }
          description: >-
            The six drawn lines (reference list oncTakeHome, tagged C-8): Ondansetron 8 mg "1-0-1 × 3 days" Nausea;
            Dexamethasone 4 mg "1-0-1 × 2 days" Delayed nausea; Pantoprazole 40 mg "1-0-0 × 5 days" Stomach protection;
            Pegfilgrastim 6 mg SC "Once, day 2" Prevents low counts / fever; Benzydamine mouthwash "3 times a day × 7
            days" Mouth sores; Loperamide 2 mg "After each loose motion (max 8)" Loose motions (0.5.1, ADR-023 D13; no
            days drawn, H22). At the start of a cycle ONDANSETRON_8, DEXAMETHASONE_4, PANTOPRAZOLE_40 and
            BENZYDAMINE_MOUTHWASH are ticked; PEGFILGRASTIM_6 is also ticked when EmrSpecialtyView.onco.pegfilgrastimSuggested
            is true; LOPERAMIDE_2 is not ticked. These start values apply only while no CHEMO_PLAN value is stored for the
            record; after that the stored list wins. While the start values apply and pegfilgrastimSuggested is true, the
            Pegfilgrastim reason reads "Prevents low counts / fever · suggested: fever / regimen" (as drawn).
        nextCycleDate: { type: [string, 'null'], format: date }
        imagingText: { type: [string, 'null'], maxLength: 200 }
        referrals:
          type: array
          uniqueItems: true
          items: { type: string, enum: [RADIOTHERAPY, SURGICAL_ONCOLOGY, PALLIATIVE_CARE, DIETITIAN, PSYCHO_ONCOLOGY_COUNSELLING, FERTILITY_COUNSELLING, SOCIAL_WORKER_SCHEME_PAPERS, CARDIOLOGY_ECHO] }
          description: 'The eight drawn chips (reference list oncReferrals; 0.5.1 adds the last four, ADR-023 D13): Radiotherapy, Surgical oncology, Palliative care, Dietitian, Psycho-oncology counselling, Fertility counselling, "Social worker (scheme papers)", "Cardiology (echo)". None ticked at the start (SAH-70-2). Each ticked one prints as a referral line; nothing is sent (OQ-45-28).'
        cycleNote: { type: [string, 'null'], maxLength: 4000, description: '"Cycle note (written for you)" as edited by the doctor; composed by fixed templates from recorded fields only.' }
    SpOutcomeScales:
      type: object
      additionalProperties: false
      description: >-
        0.5.1 (ADR-023 D13, tagged C-6). Physiotherapy section func_scales "Outcome scales" (Scale ODI, NDI, WOMAC, LEFS;
        Score). One total score per scale, typed by the therapist: the library calls the score "Calculated" but no
        questionnaire is drawn (ADR-023 H20; questionnaires later). Limits are the scales' ranges used as sanity limits
        (H18): ODI 0–100, NDI 0–50, WOMAC 0–96, LEFS 0–80; outside is 400 validation on rows[i].score. The same scale
        twice is 400 duplicate-item. The comparison chip "<scale> <previous> → <today>" (mockup "WOMAC 48 → 41" in the
        range-of-motion card) comes from EmrSpecialtyView.physio.outcomeScales. Done: one score. Copy from last visit:
        nothing. Shown in both visit modes. Case paper: 4 Examination.
      required: [component, schemaVersion, rows]
      properties:
        component: { type: string, const: OUTCOME_SCALES }
        schemaVersion: { type: integer, const: 1 }
        rows:
          type: array
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [scale, score]
            properties:
              scale: { type: string, enum: [ODI, NDI, WOMAC, LEFS] }
              score: { type: [integer, 'null'], minimum: 0, maximum: 100, description: 'Whole points; the per-scale maximum above applies.' }
    SpDentalMedHistory:
      type: object
      additionalProperties: false
      description: >-
        0.7.0 (SAH-75-6, ADR-026 D6; tagged). Dental card "Medical history and alerts" / "Ask before any injection,
        extraction or surgery" on section dental_medhx. Groups "Conditions", "Medicines", "Allergies" (round chips, many
        at once; a chosen chip shows "✓ " and, except NONE, red). NONE together with another key of the same group is 400
        validation (the client clears one when the other is chosen). Button "Mark as reviewed" sets reviewedWithPatient
        true ("✓ Reviewed with patient", card border back to normal); pressing again sets it false and clears review.
        Done (and the required flag of the Dental starter): reviewedWithPatient true; the assessment bar otherwise reads
        "Still needed in assessment: medical history review." Alert banners are computed by the server
        (EmrSpecialtyView.dental.medicalAlerts). PENICILLIN joins the visit's allergy classes for the SAH-48 drug-class
        check (ADR-022 D5 rules unchanged). At signing the allergy chips join the visit's confirmed allergy list written to
        the patient record (OQ-75-16, ADR-025 D13 extended): labels "Penicillin", "Local anaesthetic", "Latex",
        "Painkillers (NSAIDs)"; NONE is an explicit None only when no allergy is recorded in this card or the Allergies
        section. Audit EMR_DENTAL_MEDHX_REVIEWED ({reviewed}); never the chips. Clinical data: never logged.
      required: [component, schemaVersion, conditions, medicines, allergies, reviewedWithPatient]
      properties:
        component: { type: string, const: DENTAL_MED_HISTORY }
        schemaVersion: { type: integer, const: 1 }
        conditions: { type: array, uniqueItems: true, items: { type: string, enum: [DIABETES, HIGH_BP, HEART_DISEASE, THYROID, ASTHMA, BLEEDING_DISORDER, EPILEPSY, PREGNANT, NONE] }, description: 'Diabetes, High BP, Heart disease, Thyroid, Asthma, Bleeding disorder, Epilepsy, Pregnant, None.' }
        medicines: { type: array, uniqueItems: true, items: { type: string, enum: [BLOOD_THINNERS, ASPIRIN, BISPHOSPHONATES, STEROIDS, THYROID_MEDICINE, NONE] }, description: 'Blood thinners, Aspirin, Bisphosphonates, Steroids, Thyroid medicine, None.' }
        allergies: { type: array, uniqueItems: true, items: { type: string, enum: [PENICILLIN, LOCAL_ANAESTHETIC, LATEX, NSAIDS, NONE] }, description: 'Penicillin, Local anaesthetic, Latex, "Painkillers (NSAIDs)", None. Only PENICILLIN has a drug class (ADR-026 H15).' }
        reviewedWithPatient: { type: boolean }
        review: { oneOf: [{ $ref: '#/components/schemas/SpStamp' }, { type: 'null' }], readOnly: true, description: 'Server stamp of the review (who and when); null when not reviewed.' }
    OncDecisionKey:
      type: string
      enum: [GIVE_AS_PLANNED, GIVE_REDUCED, DELAY_1_WEEK, CHANGE_REGIMEN, STOP]
      description: '"Give as planned" (Full dose today), "Give, reduce dose" (Next level down), "Delay 1 week" (Repeat counts, re-book), "Change regimen" (New protocol), "Stop chemo" (Palliative / supportive care). Tagged C-8.'
    OncDeviationReason:
      type: string
      enum: [PATIENT_PREFERENCE, TUMOUR_BOARD_ADVICE, COUNTS_RECOVERING, CLINICAL_JUDGEMENT, SCHEME_COST]
      description: 'Patient preference, Tumour board advice, "Counts recovering, recheck tomorrow", Clinical judgement, "Scheme / cost reasons".'
    EmrScreenInput:
      type: object
      additionalProperties: false
      properties:
        mode: { type: [string, 'null'], enum: [ANC, GYNAE, FIRST_VISIT, SESSION, null], description: 'og: ANC or GYNAE ("This visit is"); physio: FIRST_VISIT or SESSION. Another value for the profile: 400 validation.' }
        oncDecision:
          type: [object, 'null']
          additionalProperties: false
          description: 'onco only (ADR-023 D5). null leaves it unchanged.'
          required: [choice]
          properties:
            choice: { $ref: '#/components/schemas/OncDecisionKey' }
            reasonKey: { oneOf: [{ $ref: '#/components/schemas/OncDeviationReason' }, { type: 'null' }] }
    EmrStillNeededItem:
      type: object
      description: '0.5.1 (ADR-023 D13): a section in EmrSpecialtyView.hiddenSectionKeys (hidden by the visit mode) is never an item, whatever its Required setting, and is not in stillNeeded nor a reason for readyToComplete false. PHYSIO_TREATMENT_TODAY is an item only in SESSION mode.'
      required: [key, sectionKey, label, count]
      properties:
        key: { type: string, description: 'A section key, or a profile item: ONC_DECISION, PHYSIO_TREATMENT_TODAY.' }
        sectionKey: { oneOf: [{ $ref: '#/components/schemas/SectionKey' }, { type: 'null' }], description: 'The card to open first; null for a screen item without a section.' }
        label: { type: string, description: 'Lower-case section name, or the profile label ("OT booking", "systemic exam", "today''s decision", "send chemo order", "record the hold", "n side effect grade(s)").' }
        count: { type: [integer, 'null'], description: 'For "n side effect grade(s)".' }
    EmrFlag:
      type: object
      required: [field, label, alert]
      description: 'A computed note shown with text and colour (never colour alone).'
      properties:
        field: { type: string, maxLength: 40 }
        label: { type: string, maxLength: 120, description: 'For example "High", "Fever · rule out infection before chemo", "Below 3rd centile".' }
        alert: { type: boolean }
    EmrSpecialtyView:
      type: object
      description: 'ADR-023 D4. Results computed by the server on every read and save from the stored values; the client may compute the same live, the server''s answer wins. Only the block of the record''s profile is set. Screen only: never logged.'
      required: [profile, mode, tagNote]
      properties:
        profile: { $ref: '#/components/schemas/EmrSpecialtyProfile' }
        mode:
          type: [string, 'null']
          enum: [ANC, GYNAE, FIRST_VISIT, SESSION, null]
          description: >-
            0.5.1: the effective mode. The stored screen mode when set; else og ANC; physio SESSION when physio.sessionNo
            is above 1, else FIRST_VISIT; null for the other profiles.
        hiddenSectionKeys:
          type: array
          items: { $ref: '#/components/schemas/SectionKey' }
          description: >-
            0.5.1 (ADR-023 D13; stories SAH-61-1, SAH-61-3, SAH-63; mockup isAnc, isGyn, isAssess, isSession). Sections
            the effective mode hides ("The screen shows only the sections for the visit type you pick."): og ANC hides
            gyn_exam, infertility, contraception and (0.7.0, BR75-9, ADR-026 D9) menstrual; og GYNAE hides obstetric, anc, pcpndt, usg, except that pcpndt is not
            hidden while og.formFRequired is true (legal duty, H21); physio FIRST_VISIT hides modalities, sessions;
            physio SESSION hides special_tests, posture; empty for the other profiles. Only keys present in the record's
            layout are listed. A hidden section keeps its stored values (a draft save may still carry them), is not
            rendered, and is never in stillNeededItems or stillNeeded nor a reason for readyToComplete false. The client
            uses this list; its own copy is a fallback before the first read.
        tagNote: { type: string, description: '"value from the EMR mockup, accepted by the human in DEC-039, not clinically reviewed".' }
        vitalsFlags: { type: array, items: { $ref: '#/components/schemas/EmrFlag' }, description: 'Latest entry of VITALS_LOG: gm C-1 (systolic ≥ 140 or diastolic ≥ 90 High, systolic < 90 Low, pulse > 100 High < 60 Low, SpO2 < 95 Low, temperature ≥ 99.5 °F Fever < 96 Low, RR > 20 High); onco C-1, C-8 (systolic ≥ 160 or < 90 "Check again", diastolic ≥ 100 High, pulse > 100 "Fast · check for fever, anaemia, heart", temperature ≥ 38 °C "Fever · rule out infection before chemo", SpO2 < 94 "Low · examine lungs").' }
        dental:
          type: [object, 'null']
          properties:
            estimateTotalPaise: { type: integer }
            estimateState: { type: string, enum: [NOT_SIGNED, SIGNED, CHANGED] }
            doneTodayRowIds: { type: array, items: { type: string, format: uuid } }
            childTabDefault: { type: boolean, description: '0.5.3 (SAH-73-5, ADR-023 H15): true when the effective age is under 13 completed years: from the date of birth as of today IST when recorded (12 years 11 months opens Child, exactly 13 opens Adult), else from the whole-number age. The doctor can still switch the tab; the open tab is not stored.' }
            medicalAlerts:
              type: array
              maxItems: 7
              description: >-
                0.7.0 (SAH-75-6, ADR-026 D6; tagged). Banners inside "Medical history and alerts", in this order, each only
                when its condition holds: PENICILLIN_ALLERGY "Penicillin allergy." "Avoid amoxicillin; use a non-penicillin
                antibiotic." (allergy PENICILLIN); BLEEDING_RISK "Bleeding risk." "Check INR or stop advice with the
                physician before extraction or surgery." (BLOOD_THINNERS, ASPIRIN or BLEEDING_DISORDER); DIABETES
                "Diabetes." "Check sugar before surgery; healing is slower."; BP_HEART "BP / heart." "Check BP; limit
                adrenaline in local anaesthetic." (HIGH_BP or HEART_DISEASE); PREGNANT "Pregnant." "Avoid X-rays unless
                essential; second trimester is safest for treatment."; BISPHOSPHONATES "Bisphosphonates." "Risk of jaw bone
                problems after extraction or implant."; TOBACCO_USE "Tobacco use." "Screen the mouth for pre-cancer patches
                and counsel to quit." (dental_hx habits tobacco_chewing, gutkha, paan_betel or smoking in this record). They
                warn; they never block (the drug-class block is allergyAlerts). The recap reads "<complaints> · pain n/10 ·
                n medical alert(s): <titles>".
              items:
                type: object
                required: [key, title, text]
                properties:
                  key: { type: string, enum: [PENICILLIN_ALLERGY, BLEEDING_RISK, DIABETES, BP_HEART, PREGNANT, BISPHOSPHONATES, TOBACCO_USE] }
                  title: { type: string }
                  text: { type: string }
        og:
          type: [object, 'null']
          properties:
            gestationalAge: { type: [object, 'null'], properties: { weeks: { type: integer }, days: { type: integer } }, description: 'Null shows "Not recorded"; fundal check then "Needs LMP or dating scan".' }
            edd: { type: [string, 'null'], format: date }
            eddSource: { type: string, enum: [LMP, DATING_SCAN, NONE], description: 'LMP: Naegele, LMP + 280 days (tagged C-4).' }
            daysToEdd: { type: [integer, 'null'] }
            obstetricScore: { type: [string, 'null'], description: 'For example "G2 P1 L1 A0".' }
            weightChangeKg: { type: [number, 'null'], description: '"+x kg since last visit".' }
            notes: { type: array, items: { $ref: '#/components/schemas/EmrFlag' }, description: 'BP "High: 140/90 or above" / "Normal"; fundal "Does not match <n> weeks" (|cm − GA weeks| > 2) / "Matches gestational age"; FHR "Outside 110–160" / "Normal (110–160)"; Hb "Mild/Moderate/Severe anaemia" (< 11, < 10, < 7) / "Normal". Tagged C-4.' }
            alerts: { type: array, items: { type: string, enum: [POSSIBLE_PRE_ECLAMPSIA, ANAEMIA_MILD, ANAEMIA_MODERATE, ANAEMIA_SEVERE, WARNING_SIGN] }, description: 'Advice, never a block; listed as information at Complete (SAH-51-1).' }
            riskChips: { type: array, items: { $ref: '#/components/schemas/EmrFlag' } }
            scanStates: { type: array, items: { type: object, properties: { key: { type: string }, state: { type: string, enum: [DONE, DUE, LATER] } } }, description: 'Windows: dating 6–9 w, NT 11–13+6 w, anomaly 18–22 w, growth 28–32 w, Doppler or NST from 36 w (tagged C-4).' }
            dueOrders: { type: array, items: { type: object, properties: { key: { type: string }, window: { type: string }, ordered: { type: boolean } } } }
            formFRequired: { type: boolean }
            formFCount: { type: [object, 'null'], properties: { complete: { type: integer }, total: { type: integer } }, description: '"n of m forms complete for this pregnancy".' }
        paeds:
          type: [object, 'null']
          description: >-
            0.5.3 (SAH-73-4, ADR-024 D7). Without a date of birth (dateOfBirthRecorded false): ageMonths and ageDays
            null, no vaccine DUE_TODAY or OVERDUE (every not-given vaccine LATER, none can be added: 400 as SAH-62-2),
            weight note "Centile not available for this age", milestonesSetUp false, the header shows the whole-number
            age; never an estimate from the age. Dose by weight never uses the age (SAH-62-3). A corrected date of birth
            recomputes everything on the next read; GIVEN vaccines keep their dates.
          properties:
            dateOfBirthRecorded: { type: boolean, description: '0.5.3. False shows "Date of birth not recorded. Add it in Patients to see due vaccines and the child''s age." (SO-73-6; no link or edit in the EMR).' }
            dateOfBirth: { type: [string, 'null'], format: date, description: '0.5.3. For the printed vaccination card only ("13 Jun 2025", SAH-62-2). Null when not recorded. Paediatrics records only; never logged, audited or put in a problem detail.' }
            ageMonths: { type: [integer, 'null'], minimum: 0, description: '0.5.3: completed months from the date of birth as of today IST ("18 months"); drives the weight band, the milestone band and "Growth today". Null without a date.' }
            ageDays: { type: [integer, 'null'], minimum: 0, maximum: 30, description: '0.5.3: days after the completed months ("18 months 12 days" in Growth today). Null without a date.' }
            growthNotes: { type: array, maxItems: 1, items: { $ref: '#/components/schemas/EmrFlag' }, description: 'Weight only (field "weightKg"): from the WEIGHT growth bands; "Centile not available for this age" when no band holds the age (OQ-45-32); empty when there is no weight today. 0.5.1 (DEC-044, ADR-023 H8): the server never sends a note for lengthCm or headCircCm, not even "Centile not available for this age"; those values show without a note until WHO tables exist (later story).' }
            vaccines: { type: array, description: '0.5.3: states from the date of birth with the H9 windows (window from date of birth + from, to date of birth + to, end exclusive, today IST): not given and today in the window DUE_TODAY; not given and today on or after the end OVERDUE; GIVEN when given in this or an earlier record; else LATER.', items: { type: object, required: [vaccineKey, state], properties: { vaccineKey: { type: string }, state: { type: string, enum: [GIVEN, DUE_TODAY, OVERDUE, LATER] }, givenOn: { type: [string, 'null'], format: date }, givenHere: { type: boolean, description: 'Given in this record (can be undone in this visit).' } } } }
            dueTodayCount: { type: integer }
            overdueCount: { type: integer }
            nextDue: { type: [object, 'null'], properties: { vaccineKey: { type: string }, groupLabel: { type: string } } }
            milestonesSetUp: { type: boolean, description: 'False shows "Milestones for this age are not set up".' }
            doseWeightKg: { type: [number, 'null'], description: '"Uses today''s weight: x kg"; null shows "Record today''s weight first".' }
            doseWeightChangedRowIds: { type: array, items: { type: string, format: uuid }, description: '"Weight changed. Add the dose again."' }
        physio:
          type: [object, 'null']
          properties:
            sessionNo: { type: [integer, 'null'] }
            sessionsPlanned: { type: [integer, 'null'] }
            packageName: { type: [string, 'null'] }
            romPercents: { type: array, items: { type: object, properties: { movement: { type: string }, rightPct: { type: [integer, 'null'] }, normal: { type: [string, 'null'] } } } }
            outcomeScales:
              type: array
              maxItems: 4
              description: '0.5.1 (ADR-023 D13). One entry per scale scored today or in the latest earlier SIGNED Physiotherapy record of the patient in this clinic (previous empty until SAH-51 signs records). The chip reads "<scale> <previousScore> → <todayScore>" (mockup "WOMAC 48 → 41"), or "<scale> <todayScore>" with no previous.'
              items:
                type: object
                required: [scale, previousScore, previousDate, todayScore]
                properties:
                  scale: { type: string, enum: [ODI, NDI, WOMAC, LEFS] }
                  previousScore: { type: [integer, 'null'] }
                  previousDate: { type: [string, 'null'], format: date }
                  todayScore: { type: [integer, 'null'] }
        surgery:
          type: [object, 'null']
          properties:
            fitness: { type: object, properties: { state: { type: string, enum: [FIT, TESTS_PENDING, PAC_NOT_DONE, NOT_FIT] }, text: { type: string, description: '"Fit for surgery", "<n> test(s) pending: <names>", "PAC not done", "Not fit yet: <names> abnormal", "Not fit yet: PAC unfit".' } } }
            depositPaise: { type: [integer, 'null'], description: 'SELF: round(package × 0.5 ÷ 1,000) × 1,000; other payers ₹ 10,000 (tagged B-1, B-3).' }
            payerChip: { type: string, description: '"Self-pay", "<payer> · pre-auth pending", "<payer> · pre-auth sent".' }
            bookState: { type: string, enum: [NOT_BOOKED, READY, BOOKED, CHANGED] }
            bookMissing: { type: array, items: { type: string }, description: '"diagnosis", "n consent item(s)", "pre-authorisation".' }
            consentCount: { type: object, properties: { ticked: { type: integer }, total: { type: integer } } }
        onco:
          type: [object, 'null']
          properties:
            bsa: { type: [number, 'null'], description: '√(height × weight ÷ 3600), 2 decimals.' }
            bsaUsed: { type: [number, 'null'] }
            capped: { type: boolean }
            cycle1WeightKg: { type: [number, 'null'] }
            weightChangePct: { type: [number, 'null'] }
            recalculateDoses: { type: boolean, description: '|weight change| ≥ 10 %.' }
            lesionChanges: { type: array, items: { type: object, properties: { id: { type: string, format: uuid }, pctFromBaseline: { type: [number, 'null'] }, colour: { type: string, enum: [GREEN, RED, NONE] } } } }
            sums: { type: object, properties: { baseline: { type: number }, previous: { type: number }, today: { type: number }, nadir: { type: number }, pctFromBaseline: { type: number }, pctFromNadir: { type: number } } }
            response: { type: [string, 'null'], enum: [COMPLETE_RESPONSE, PARTIAL_RESPONSE, STABLE_DISEASE, PROGRESSIVE_DISEASE, null] }
            labFails: { type: array, items: { type: object, properties: { key: { type: string }, direction: { type: string, enum: [BELOW_NEEDED, ABOVE_NEEDED] } } } }
            labsBadge: { type: string, description: '"2 out of range" or "Within limits".' }
            labsFresh: { type: [boolean, 'null'], description: 'Drawn within 72 hours before now; false shows "Older than 72 hours".' }
            fever: { type: boolean }
            feverOrAdmissionEvent: { type: boolean, description: 'Confirmed FEVER_LOW_COUNTS ≥ 1, FEVER_38_AT_HOME or ADMITTED (mockup; ADR-023 H3).' }
            pegfilgrastimSuggested: { type: boolean, description: '0.5.1 (mockup gcsf, tagged C-8): true when the order''s protocol is TC or feverOrAdmissionEvent is true. Drives the Pegfilgrastim start tick and note (SpChemoPlan.takeHome).' }
            worstGrade: { type: [integer, 'null'] }
            ecogText: { type: [string, 'null'], description: '"ECOG n · fit for chemo" / "ECOG n · usually not fit for chemo".' }
            lineReady: { type: [boolean, 'null'], description: 'Null when no device; text "Port: no blood return yet" when false.' }
            suggestion: { oneOf: [{ $ref: '#/components/schemas/OncDecisionKey' }, { type: 'null' }], description: 'Order: STOP (ECOG ≥ 3), DELAY_1_WEEK (count or organ fail, or fever), CHANGE_REGIMEN (PD or LVEF < 50), GIVE_REDUCED (worst grade ≥ 3 or fever/admission event), GIVE_AS_PLANNED. Null until ECOG is chosen.' }
            reasons: { type: array, items: { type: object, required: [key, ok, text], properties: { key: { type: string, enum: [ECOG, COUNTS_FEVER, WORST_GRADE, RESPONSE, HEART, LINE] }, ok: { type: boolean }, text: { type: string } } } }
            decision:
              type: [object, 'null']
              properties:
                choice: { $ref: '#/components/schemas/OncDecisionKey' }
                reasonKey: { oneOf: [{ $ref: '#/components/schemas/OncDeviationReason' }, { type: 'null' }] }
                suggestionAtDecision: { $ref: '#/components/schemas/OncDecisionKey' }
                stamp: { $ref: '#/components/schemas/SpStamp' }
            factsChanged: { type: boolean, description: '"Facts changed. Suggested now: <decision>".' }
            alerts: { type: array, items: { type: string, enum: [GRADE_3_PLUS, LAB_OUT_OF_RANGE, FEVER, WEIGHT_CHANGE_10, CUMULATIVE_OVER_400, PORT_NO_BLOOD_RETURN] }, description: '"Patient alerts (n)".' }
            cumulativeDoxorubicinMgM2: { type: [number, 'null'] }
            cycleNo: { type: [integer, 'null'] }
            nextCycle: { type: [object, 'null'], properties: { defaultDate: { type: string, format: date }, label: { type: string, enum: [NEXT_CHEMO, REBOOKED_CHEMO] }, bloodTestDate: { type: string, format: date }, echo: { type: string, description: '"Before next cycle" when last LVEF < 55 %, else "Before paclitaxel".' } } }
            orderStatus: { type: string, enum: [NONE, DRAFT, SENT, HELD] }
            journey: { $ref: '#/components/schemas/OncJourneyStrip' }
            watch:
              type: object
              required: [doxorubicinGivenMgM2, doxorubicinLimitMgM2]
              description: >-
                0.7.0 (SAH-75-7, ADR-026 D7). Watch chips on the right of the patient line. "Doxorubicin <given> / 450
                mg/m²" (amber) shown only when doxorubicinGivenMgM2 is not null. The scheme chip ("<scheme> · ₹ <amount>
                left") has no data source in Sahaj and is never shown (OQ-75-8, ADR-026 H4). "No known drug allergy" follows
                the header rule (only when "none" was recorded, OQ-45-23): 0.7.1, shown (grey) only when
                header.allergyStatus is NONE_RECORDED (ADR-026 D12).
              properties:
                doxorubicinGivenMgM2: { type: [number, 'null'], description: 'The outside dose entered on the latest SENT order plus the doxorubicin of the patient''s SENT orders in this clinic (per m² × level), excluding this record''s own order; null when none. The order sheet''s own check (cumulativeDoxorubicinMgM2, rule C-8) is unchanged.' }
                doxorubicinLimitMgM2: { type: number, const: 450, description: 'Lifetime anthracycline limit, tagged C-8.' }
            dayCareBed: { type: [string, 'null'], maxLength: 40, description: '0.7.0 (SAH-75-11 O2-2). Bed label of the admission linked to today''s CHEMO sitting (read from ipd through CourseAdmissionSource); the order sheet sub line "Decision: <decision> · Day-care bed <n> · Intent: <intent>" leaves the part out when null.' }
    OncJourneyStrip:
      type: object
      required: [record, diagnosisText, plan]
      description: >-
        0.7.0 (SAH-75-7, ADR-026 D7). "Cancer journey snapshot": five cells built by the server on every record read and
        save (never half filled). Diagnosis: diagnosisText (line 1) and "Stage <stageGroup> · <tnmText>" (line 2, accent);
        Biology: markersText and "Ki-67 <ki67Pct>% · <geneticsText>"; Intent · line: "<intent> · <setting>" and "<lineNo
        as 1st, 2nd …> line · board <boardDate>"; Plan: "Plan · <plan.title>" with "Cycle <cycleNo> of <cycleCount> · day
        1" (or "Cycle n delayed") and one chip per cycle; Response (clinical): onco.response and onco.sums.pctFromBaseline
        ("Not measured" without lesions). A part with no value is left out; a cell with no value reads "Not recorded".
        Screen only: never logged.
      properties:
        record: { oneOf: [{ $ref: '#/components/schemas/CancerJourney' }, { type: 'null' }], description: 'The patient''s latest journey version; null: stage, biology and intent cells read "Not recorded" and "Edit" opens an empty form.' }
        diagnosisText: { type: [string, 'null'], maxLength: 200, description: 'First active diagnosis item of this record, else of the patient''s latest SIGNED oncology record; null "Not recorded".' }
        plan:
          type: [object, 'null']
          description: 'From the patient''s newest ACTIVE CHEMO course; null reads "No chemotherapy plan".'
          required: [courseId, title, cycleNo, cycleCount, cycles]
          properties:
            courseId: { type: string, format: uuid }
            title: { type: string, maxLength: 200, description: 'Runs of consecutive regimens of the cycle sittings, "AC ×4 → Paclitaxel ×4"; the course name when no regimen is set.' }
            cycleNo: { type: [integer, 'null'], minimum: 1, description: 'displayNo among the cycle sittings of today''s (or the next planned) cycle.' }
            cycleCount: { type: integer, minimum: 0, description: 'Non-removed chemo_cycle sittings.' }
            cycles:
              type: array
              maxItems: 50
              items:
                type: object
                required: [sittingId, label, state]
                properties:
                  sittingId: { type: string, format: uuid }
                  label: { type: string, maxLength: 8, description: 'Regimen short label + ordinal within that regimen ("AC1", "P1"; AC, P for both paclitaxel protocols, TC; tagged), "C<n>" with no regimen.' }
                  state: { type: string, enum: [GIVEN, TODAY, PLANNED, DELAYED, MISSED], description: 'GIVEN green "Given" (DONE); TODAY accent "Today"; PLANNED grey "Planned"; DELAYED amber "Delayed 1 week" (today''s cycle while the recorded decision is DELAY_1_WEEK); MISSED red "Missed" (not drawn, ADR-026 H12).' }
    CancerJourney:
      type: object
      description: '0.7.0 (SAH-75-7, ADR-026 D7). One version of the patient''s Cancer journey. Lists are ours, not clinically reviewed (ADR-026 H6). Clinical data: never logged, audited (values) or put in a problem detail.'
      required: [version, stageGroup, tnmText, markersText, ki67Pct, geneticsText, intent, setting, lineNo, boardDate, recordedAt, recordedByName]
      properties:
        version: { type: integer, minimum: 1 }
        stageGroup: { oneOf: [{ $ref: '#/components/schemas/CancerStageGroup' }, { type: 'null' }] }
        tnmText: { type: [string, 'null'], maxLength: 40, description: 'For example "cT2 cN2 M0".' }
        markersText: { type: [string, 'null'], maxLength: 80, description: 'For example "ER+ PR+ HER2−".' }
        ki67Pct: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        geneticsText: { type: [string, 'null'], maxLength: 60, description: 'For example "BRCA pending".' }
        intent: { type: [string, 'null'], enum: [CURATIVE, PALLIATIVE, null], description: '"Curative", "Palliative".' }
        setting: { type: [string, 'null'], enum: [NEOADJUVANT, ADJUVANT, DEFINITIVE, ADVANCED, null], description: '"Neoadjuvant", "Adjuvant", "Definitive", "Advanced / metastatic".' }
        lineNo: { type: [integer, 'null'], minimum: 1, maximum: 10, description: '"1st line", "2nd line" …' }
        boardDate: { type: [string, 'null'], format: date, description: 'Tumour board date; "board 26 Jul".' }
        recordedAt: { type: string, format: date-time, readOnly: true }
        recordedByName: { type: string, readOnly: true, description: 'Read through platform.api, never copied.' }
    CancerStageGroup:
      type: string
      enum: ['0', I, IA, IB, IC, II, IIA, IIB, IIC, III, IIIA, IIIB, IIIC, IV, IVA, IVB, IVC]
      description: '0.7.0. Stage groups offered by the journey form; another value is 400 validation (ADR-026 H6).'
    CancerJourneyInput:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      description: 'Every field optional; a field sent null clears it in the new version, an absent field keeps the previous version''s value.'
      properties:
        expectedVersion: { type: integer, minimum: 0, description: 'The version read (0 when none); stale 409 journey-changed.' }
        stageGroup: { oneOf: [{ $ref: '#/components/schemas/CancerStageGroup' }, { type: 'null' }] }
        tnmText: { type: [string, 'null'], minLength: 1, maxLength: 40 }
        markersText: { type: [string, 'null'], minLength: 1, maxLength: 80 }
        ki67Pct: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        geneticsText: { type: [string, 'null'], minLength: 1, maxLength: 60 }
        intent: { type: [string, 'null'], enum: [CURATIVE, PALLIATIVE, null] }
        setting: { type: [string, 'null'], enum: [NEOADJUVANT, ADJUVANT, DEFINITIVE, ADVANCED, null] }
        lineNo: { type: [integer, 'null'], minimum: 1, maximum: 10 }
        boardDate: { type: [string, 'null'], format: date, description: 'Not before 1900-01-01 and not more than 365 days after today (Asia/Kolkata); 400 validation otherwise.' }
        tenantId: { description: 'Accepted and ignored.' }
        clinicId: { description: 'Accepted and ignored.' }
    EmrSpecialtyReference:
      type: object
      description: 'ADR-023 D4. Lists and thresholds per profile; every block carries the tag. Display labels are the mockup''s words. Only the block of the requested profile is set.'
      required: [profile, tagNote]
      properties:
        profile: { $ref: '#/components/schemas/EmrSpecialtyProfile' }
        tagNote: { type: string }
        lists:
          type: object
          propertyNames:
            enum: [gmSigns, gmSystems, gmFollowUp, dentalConditions, dentalSurfaces, dentalMobility, dentalShades, dentalGumTones, dentalSuggestions, dentalNextIntervals, dentalLabItems, dentalMedConditions, dentalMedMedicines, dentalMedAllergies, ancSymptoms, ancDueOrders, ancScans, ancSupplements, gynaeQuickOrders, iapGroups, iapVaccines, milestones, paedsDoseRules, physioGaits, physioModalities, jointRom, jointMmt, jointSpecialTests, outcomeScales, surgeryProcedures, surgeryPayers, surgeryConsentItems, surgeryTests, surgeryPreopOrders, surgeryBlood, oncSymptoms, oncEvents, oncSystems, oncSystemChips, oncLabs, oncEcog, oncDecisions, oncDeviationReasons, oncDoseLevels, oncReductionReasons, oncTakeHome, oncReferrals]
          additionalProperties: { type: array, items: { $ref: '#/components/schemas/EmrReferenceItem' } }
          description: >-
            0.5.1 (ADR-023 D13.1): fixed list names. The response for a profile has exactly that profile's lists below,
            items in the drawn order; a name outside this set is never sent. Item key formats: ENUM = the contract enum
            value the client stores (for example CARIES); PROP = the property name in the stored value (for example
            pallor); TABLE = the global reference table key, ^[a-z][a-z0-9_]{1,39}$, the same string the client stores.
            Item fields not named are null.

            gm: gmSigns (PROP of SpExamGeneral.signs: pallor, icterus, cyanosis, clubbing, lymphadenopathy, oedema,
            dehydration); gmSystems (PROP of SpExamGeneral.systems: general, cvs, rs, pa, cns; label "General", "CVS",
            "RS", "P/A", "CNS"; sub = the drawn normal text); gmFollowUp (keys 3d, 7d, 15d, 1m, 3m; number = the count,
            group = DAYS or MONTHS).

            dental: dentalConditions (ENUM SpToothChart condition); dentalSurfaces (ENUM M, O, D, B, L); dentalMobility
            (keys "0" to "3", label G0 to G3); dentalShades (ENUM shade); dentalGumTones (ENUM gum); dentalSuggestions
            (ENUM SpDentalPlan procedureKey, one item per condition and procedure pair: group = the condition key,
            number = phase, defaults.sittings = sittings planned at start, tariff = the clinic's match or null "Not in
            tariff"); dentalNextIntervals (keys 3d, 7d, 14d, 1m; number and group as gmFollowUp); dentalLabItems (ENUM
            SpLabWork item); 0.7.0 (SAH-75-6): dentalMedConditions, dentalMedMedicines, dentalMedAllergies (ENUM
            SpDentalMedHistory conditions, medicines, allergies, drawn order, NONE last; dentalMedAllergies PENICILLIN has
            group = PENICILLIN, the drug class).

            og: ancSymptoms (ENUM SpAncCheck symptoms); ancDueOrders (ENUM SpAncCheck orders key; sub = the window, for
            example "24–28 w", "give today"); ancScans (ENUM SpAncCheck scans key; sub = the window); ancSupplements (keys
            IRON, CALCIUM_VIT_D3, FOLIC_ACID; label as drawn; defaults.frequency; note = the drawn note; medicine);
            gynaeQuickOrders (keys PAP_SMEAR, PELVIC_USG, THYROID_PROFILE, CBC, HORMONES; the client adds the label to
            Investigations).

            paeds: iapGroups (TABLE emr_immunization_group.group_key, for example birth, week_6, month_16_18; sub = the
            window text; number = position); iapVaccines (TABLE emr_immunization_vaccine.vaccine_key, for example bcg,
            opv_0, hep_b_1, dtwp_booster_1; group = its group_key; the key is SpImmunization.givenToday[].vaccineKey and
            EmrSpecialtyView.paeds.vaccines[].vaccineKey); milestones (TABLE emr_milestone.milestone_key, for example
            walks_alone; group = domain GROSS_MOTOR, FINE_MOTOR, SOCIAL or LANGUAGE; number = the age band in months;
            the key is what SpMilestones.achieved and notYet store); paedsDoseRules (ENUM doseRuleKey PARACETAMOL_120_5,
            PARACETAMOL_250_5, IBUPROFEN_100_5; label = the medicine; number = mg per kg; defaults.frequencyText;
            medicine; the maximum mg and mg per ml are thresholds).

            physio: physioGaits (ENUM SpPostureGait gait); physioModalities (ENUM SpModalities key; sub = the drawn
            default parameters); jointRom, jointMmt, jointSpecialTests (TABLE emr_joint_item.item_key, for example
            flexion, quadriceps, mcmurray_medial; group = joint_key, today only knee; jointRom sub = the normal range text
            and number = the normal maximum in degrees; a reference row stores this key in SpRomTable movement,
            SpMmtTable group or SpSpecialTests test, a typed row stores its text); outcomeScales (ENUM SpOutcomeScales
            scale ODI, NDI, WOMAC, LEFS; number = the maximum score).

            surgery: surgeryProcedures (ENUM SpSurgeryPlan procedureKey; defaults.anaesthesia and defaults.admission;
            tariff); surgeryPayers (ENUM payer); surgeryConsentItems (keys PROCEDURE_RISKS, CONVERSION_TO_OPEN,
            ANAESTHESIA, BLOOD_TRANSFUSION, PHOTOS_VIDEO); surgeryTests (ENUM SpSurgeryFitness tests key);
            surgeryPreopOrders (ENUM SpPreopOrders ticked); surgeryBlood (keys NOT_NEEDED "Not needed", GROUP_AND_SAVE
            "Group and save", ONE_UNIT_RESERVED "1 unit reserved"; the key is what SpPreopOrders.blood stores).

            onco: oncSymptoms (ENUM SpOncTox symptoms key); oncEvents (ENUM SpOncTox events); oncSystems (PROP of
            SpOncExam.systems: cvs "Heart (CVS)", rs "Lungs (RS)", pa "Abdomen", cns "Nervous system", bone "Spine and
            bones"; sub = the drawn hint, for example "Anthracycline: watch for heart failure"); oncSystemChips (key =
            the chip label as stored in SpSystemFinding.chips, group = the system key); oncLabs (PROP of
            SpOncLabs.values: hb, anc, plt, cr, bili, alt, lvef; sub = the unit; number = the step; the limit is a
            threshold); oncEcog (keys "0" to "4"; label = the drawn text); oncDecisions (ENUM OncDecisionKey; sub = the
            drawn second line); oncDeviationReasons (ENUM OncDeviationReason); oncDoseLevels (keys "100", "90", "80",
            "75"; number = the percent); oncReductionReasons (ENUM ChemoOrderInput reductionReasonKey); oncTakeHome (ENUM
            SpChemoPlan.takeHome, six lines; label = the medicine; defaults.frequency or defaults.frequencyText and
            defaults.days as drawn (LOPERAMIDE_2 has no days, H22); note = the reason; defaultOn as in
            SpChemoPlan.takeHome; medicine); oncReferrals (ENUM SpChemoPlan.referrals, eight; defaultOn false).
        thresholds:
          type: object
          additionalProperties: { type: number }
          description: 'Named numbers the screen uses live (for example ancBpSystolicHigh 140, oncLabHbMin 8, oncBsaCap 2.0, oncDoxorubicinLifetime 450, paedsParacetamolMgPerKg 15). The server recomputes; never the authority.'
        protocols: { type: array, items: { $ref: '#/components/schemas/ChemoProtocol' }, description: 'onco only.' }
        growthBands: { type: array, items: { type: object, properties: { measure: { type: string }, sex: { type: [string, 'null'] }, ageMonthsFrom: { type: integer }, ageMonthsTo: { type: integer }, upperExclusive: { type: [number, 'null'] }, label: { type: string }, alert: { type: boolean } } }, description: 'paeds only.' }
    EmrReferenceItem:
      type: object
      required: [key, label]
      properties:
        key: { type: string, maxLength: 40 }
        label: { type: string, maxLength: 200 }
        sub: { type: [string, 'null'], maxLength: 200, description: 'Second line (phase, parameters, window, dose text, description).' }
        group: { type: [string, 'null'], maxLength: 40 }
        number: { type: [number, 'null'], description: 'Phase, step, minutes or similar when the list needs one number.' }
        tariff: { type: [object, 'null'], properties: { serviceId: { type: string, format: uuid }, pricePaise: { type: integer } }, description: 'dental suggestions and surgical procedures: the clinic''s matching active service, null = "Not in tariff".' }
        note: { type: [string, 'null'], maxLength: 120, description: '0.5.1. The drawn reason or note (take-home "Nausea", supplement "2 h apart from iron"); goes to EmrPrescriptionRow.note.' }
        defaultOn: { type: [boolean, 'null'], description: '0.5.1. Ticked at start, where the list has a start state (oncTakeHome, oncReferrals). For PEGFILGRASTIM_6 false here; the start tick then follows EmrSpecialtyView.onco.pegfilgrastimSuggested.' }
        defaults:
          type: [object, 'null']
          additionalProperties: false
          description: '0.5.1. Starting values the client copies into the row it adds; the doctor can change them. Only the properties the list names are set.'
          properties:
            frequency: { oneOf: [{ $ref: '#/components/schemas/EmrRxFrequency' }, { type: 'null' }] }
            frequencyText: { type: [string, 'null'], maxLength: 120, description: 'For example "Once, day 2", "After each loose motion (max 8)".' }
            days: { type: [integer, 'null'], minimum: 1, maximum: 365, description: 'Null when not drawn; the Prescription''s usual new-row default then applies.' }
            sittings: { type: [integer, 'null'], minimum: 1, maximum: 6 }
            anaesthesia: { type: [string, 'null'], enum: [GA, SPINAL, LOCAL, LOCAL_SEDATION, null] }
            admission: { type: [string, 'null'], enum: [DAY_CARE, IPD_1_DAY, IPD_1_2_DAYS, IPD_2_DAYS, IPD_4_5_DAYS, null] }
        medicine:
          type: [object, 'null']
          required: [medicineId, name, form]
          description: '0.5.1. ancSupplements, paedsDoseRules, oncTakeHome: the seeded master medicine (opd.medicine, V2026_12_11_1020) matched by the server, so the added prescription row carries medicineId and the drug-class allergy check applies (SAH-48-2). Null if no active master row matches; the client then adds a typed row (never allergy-checked, ADR-022 H6).'
          properties:
            medicineId: { type: string, format: uuid }
            name: { type: string }
            form: { type: [string, 'null'] }
    ChemoProtocol:
      type: object
      required: [key, label, subLine, intervalDays, emeticRisk, suggestedOnChange, drugs, premeds]
      properties:
        key: { type: string, enum: [AC, PACLI_3W, PACLI_WEEKLY, TC] }
        label: { type: string }
        subLine: { type: string, description: 'For example "Doxorubicin + cyclophosphamide · every 21 days".' }
        intervalDays: { type: integer }
        emeticRisk: { type: string, enum: [HIGH, MODERATE, LOW] }
        suggestedOnChange: { type: boolean, description: 'Tag "Suggested" when the decision is Change regimen (paclitaxel 3-weekly, as drawn; ADR-023 H6).' }
        drugs:
          type: array
          items:
            type: object
            required: [drugKey, name, dosePerM2, infusionMinutes, vialStepMg, vesicant, anthracycline]
            properties:
              drugKey: { type: string }
              name: { type: string }
              dosePerM2: { type: number, description: 'AC doxorubicin 60, cyclophosphamide 600; paclitaxel 175 (3-weekly) or 80 (weekly); TC docetaxel 75, cyclophosphamide 600 (tagged C-8).' }
              infusionMinutes: { type: integer }
              vialStepMg: { type: integer, description: 'doxorubicin 5, cyclophosphamide 20, paclitaxel 10, docetaxel 10.' }
              vesicant: { type: boolean }
              anthracycline: { type: boolean, description: 'Counts toward the 450 mg/m² lifetime limit.' }
              note: { type: [string, 'null'] }
        premeds: { type: array, items: { type: object, required: [key, text, minutes], properties: { key: { type: string }, text: { type: string }, minutes: { type: integer } } } }
    EmrSpecialtyHistory:
      type: object
      required: [profile, someHidden]
      description: 'ADR-023 D2. Blocks for the record''s profile; empty arrays until SAH-51 signs records (oncology cycles are read from SENT orders).'
      properties:
        profile: { $ref: '#/components/schemas/EmrSpecialtyProfile' }
        someHidden: { type: boolean, description: '"Some readings are hidden" (IPD scope).' }
        vitals: { type: array, maxItems: 100, items: { type: object, properties: { recordedAt: { type: string, format: date-time }, recordedByName: { type: string }, bp: { type: [string, 'null'] }, pulse: { type: [integer, 'null'] }, spo2: { type: [integer, 'null'] }, temperature: { type: [string, 'null'] }, respRate: { type: [integer, 'null'] }, pain: { type: [integer, 'null'] }, how: { type: string }, flags: { type: array, items: { $ref: '#/components/schemas/EmrFlag' } } } } }
        trend:
          type: [object, 'null']
          properties:
            bp: { type: array, maxItems: 5, items: { type: object, properties: { date: { type: string, format: date }, systolic: { type: integer }, diastolic: { type: integer } } }, description: 'Target line 140 systolic (tagged C-1).' }
            sugar: { type: array, maxItems: 5, items: { type: object, properties: { date: { type: string, format: date }, mgdl: { type: number } } } }
        ancVisits: { type: array, maxItems: 40, items: { type: object, properties: { date: { type: string, format: date }, gestationalAge: { type: [string, 'null'] }, weightKg: { type: [number, 'null'] }, bp: { type: [string, 'null'] }, fundalHeightCm: { type: [integer, 'null'] }, hbGdl: { type: [number, 'null'] }, note: { type: [string, 'null'] }, today: { type: boolean } } } }
        growthPoints: { type: array, maxItems: 100, items: { type: object, properties: { date: { type: string, format: date }, ageMonths: { type: [number, 'null'], description: '0.5.3 (ADR-024 D7): the age at the point''s date, completed months + remaining days ÷ 30.4375, one decimal (chart position only). Null without a date of birth or for a date before it; such a point is not plotted.' }, weightKg: { type: [number, 'null'] }, lengthCm: { type: [number, 'null'] }, headCircCm: { type: [number, 'null'] } } } }
        oncologyCycles: { type: array, maxItems: 60, items: { type: object, properties: { cycleNo: { type: integer }, date: { type: string, format: date }, protocolKey: { type: string }, levelPct: { type: integer }, weightKg: { type: [number, 'null'] }, bsaUsed: { type: [number, 'null'] }, labs: { type: object, additionalProperties: { type: [number, 'null'] } }, grades: { type: [object, 'null'], additionalProperties: { type: [integer, 'null'] } }, lesions: { type: array, maxItems: 10, description: '0.7.0 (SAH-75-11 O-6). Lesion sizes recorded at that cycle (ONC_EXAM of the SIGNED record of the cycle; empty before SAH-51 signs it), for the lesion trend line.', items: { type: object, required: [name, cm], properties: { name: { type: string, maxLength: 60 }, cm: { type: [number, 'null'] } } } } } } }
        dentalToothHistory:
          type: array
          maxItems: 200
          description: '0.7.0 (SAH-75-11 D6). Earlier work per tooth for "History of <tooth>": plan rows marked done in the patient''s SIGNED dental records in this clinic, newest first; the client filters by tooth and shows "No earlier work on this tooth." when none (wording not drawn). Empty for other profiles.'
          items:
            type: object
            required: [tooth, date, text]
            properties:
              tooth: { type: string, pattern: '^[1-8][1-8]$', description: 'FDI tooth number.' }
              date: { type: string, format: date }
              text: { type: string, maxLength: 200, description: 'The procedure as written on the plan row (sitting n of m when more than one).' }
        physioProgress:
          type: [object, 'null']
          properties:
            sessionsDone: { type: integer }
            sessionsPlanned: { type: [integer, 'null'] }
            painFirst: { type: [integer, 'null'] }
            painLast: { type: [integer, 'null'] }
            romFirst: { type: [object, 'null'], additionalProperties: true }
            romLast: { type: [object, 'null'], additionalProperties: true }
            goalsAchieved: { type: array, items: { type: string } }
            onlyFirstVisit: { type: boolean, description: '"Only the first visit is recorded."' }
            painBySession: { type: array, maxItems: 60, description: '0.7.0 (SAH-75-11 P-3). PAIN_SCORE of the earlier SIGNED sessions of the active REHAB course, by displayNo, for "Sessions 1–3: 7, 6, 5. Today: n — improving." (the comparison word is the client''s: improving, same as last session, worse than last session).', items: { type: object, required: [sessionNo, score], properties: { sessionNo: { type: integer, minimum: 1 }, score: { type: integer, minimum: 0, maximum: 10 } } } }
    EmrRevisionInput:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: { type: integer, format: int64, minimum: 0, description: 'The record revision the screen holds; stale is 409 emr-record-changed.' }
    SurgeryBookingResult:
      type: object
      required: [record, courseId, sittingId, admissionRequested, message]
      properties:
        record: { $ref: '#/components/schemas/EmrRecordView' }
        courseId: { type: string, format: uuid }
        sittingId: { type: [string, 'null'], format: uuid }
        admissionRequested: { type: boolean }
        message: { type: string, description: '"<procedure> booked for <date>, <slot>. Ward bed requested." or "Booked. This clinic has no IPD, so no ward bed was requested."' }
    ChemoOrderInput:
      type: object
      additionalProperties: false
      required: [revision, protocolKey, levelPct]
      properties:
        revision: { type: integer, format: int64, minimum: 0, description: 'The order revision; 0 for the first save.' }
        protocolKey: { type: string, enum: [AC, PACLI_3W, PACLI_WEEKLY, TC] }
        levelPct: { type: integer, enum: [100, 90, 80, 75] }
        reductionReasonKey: { type: [string, 'null'], enum: [LOW_NEUTROPHILS_LAST_CYCLE, FEVER_LOW_COUNTS, GRADE_3_SIDE_EFFECT, NEUROPATHY, LIVER_FUNCTION, FRAILTY, null], description: '"Reason for reduction (required)" when level < 100 (tagged C-8).' }
        reductionReasonText: { type: [string, 'null'], minLength: 1, maxLength: 200, description: 'Typed reason (instead of a key).' }
        finalDoses: { type: array, maxItems: 6, items: { type: object, additionalProperties: false, required: [drugKey, finalMg], properties: { drugKey: { type: string, maxLength: 40 }, finalMg: { type: number, minimum: 0, maximum: 10000 } } }, description: 'Only edited doses; omitted drugs take the rounded dose.' }
        premedsNotGiven: { type: array, maxItems: 10, uniqueItems: true, items: { type: string, maxLength: 40 } }
        allergyConfirmed: { type: boolean, description: '"No known drug allergy · confirmed" only when the doctor confirmed (OQ-45-23).' }
        consentNewSigned: { type: boolean, description: '"New consent signed today" (tagged L-3).' }
        scheme: { type: string, enum: [APPROVED, PREAUTH_RAISED, NOT_IN_PACKAGE, SELF_PAY], description: 'SELF_PAY is not drawn (ADR-023 H5).' }
        priorOutsideDoxorubicinMgM2: { type: number, minimum: 0, maximum: 2000, description: '"Earlier doses before this clinic" (analyst addition).' }
    ChemoOrderView:
      type: object
      required: [status, recordId, decisionRecorded, protocolKey, levelPct, drugs, premeds, emeticRisk, checks, passedCount, totalCount, secondCheck, stages, send, fingerprint]
      description: 'SAH-66-1, SAH-66-2 (ADR-023 D6). Recomputed by the server on every read. Screen only; no dose or drug is logged.'
      properties:
        id: { type: [string, 'null'], format: uuid }
        recordId: { type: string, format: uuid }
        status: { type: string, enum: [NONE, DRAFT, SENT, HELD] }
        revision: { type: integer, format: int64 }
        decisionRecorded: { type: boolean }
        decision: { oneOf: [{ $ref: '#/components/schemas/OncDecisionKey' }, { type: 'null' }] }
        protocolKey: { type: [string, 'null'], enum: [AC, PACLI_3W, PACLI_WEEKLY, TC, null] }
        protocolTags: { type: object, additionalProperties: { type: string, enum: [IN_PLAN, SUGGESTED, NEW_CONSENT] }, description: 'Per protocol: "In plan", "Suggested", "New consent".' }
        levelPct: { type: integer, enum: [100, 90, 80, 75] }
        reductionReason: { type: [string, 'null'] }
        bsa: { type: object, properties: { raw: { type: [number, 'null'] }, used: { type: [number, 'null'] }, capped: { type: boolean }, source: { type: string, description: '"BSA from today''s weight".' } } }
        weightChangePct: { type: [number, 'null'] }
        recalculated: { type: boolean, description: '"Weight changed by x%. Doses recalculated".' }
        drugs:
          type: array
          items:
            type: object
            required: [drugKey, name, dosePerM2, calculatedMg, roundedMg, finalMg, finalEdited, moreThan5Pct, lifetime]
            properties:
              drugKey: { type: string }
              name: { type: string }
              dosePerM2: { type: number }
              calculatedMg: { type: [number, 'null'] }
              roundedMg: { type: [number, 'null'] }
              finalMg: { type: [number, 'null'] }
              finalEdited: { type: boolean }
              moreThan5Pct: { type: boolean, description: '"More than 5% from calculated" (analyst addition).' }
              vesicant: { type: boolean }
              lifetime: { type: [object, 'null'], properties: { earlierMgM2: { type: number }, thisCycleMgM2: { type: number }, totalMgM2: { type: number }, limitMgM2: { type: number, const: 450 }, red: { type: boolean, description: 'Above 400.' } }, description: 'Anthracycline only; others "No lifetime limit".' }
              infusionMinutes: { type: integer }
              note: { type: [string, 'null'] }
        premeds: { type: array, items: { type: object, properties: { key: { type: string }, text: { type: string }, minutes: { type: integer }, given: { type: boolean } } } }
        emeticRisk: { type: [string, 'null'], enum: [HIGH, MODERATE, LOW, null] }
        labsDrawnAt: { type: [string, 'null'], format: date-time }
        allergyConfirmed: { type: boolean }
        consentNewSigned: { type: boolean }
        scheme: { type: [string, 'null'] }
        priorOutsideDoxorubicinMgM2: { type: number }
        checks:
          type: array
          items:
            type: object
            required: [key, passed, detail]
            properties:
              key: { type: string, enum: [DECISION_RECORDED, FIT_TO_TREAT, LABS_72H, BSA_TODAY, CUMULATIVE_DOSE, REDUCTION_REASON, ALLERGIES_REVIEWED, CONSENT_REGIMEN, SCHEME_APPROVAL, LINE_VESICANT] }
              passed: { type: boolean }
              detail: { type: string, description: 'For example "Counts, organ tests OK · no fever", "Doxorubicin under 450 mg/m²", "Pick a reason above".' }
              action: { type: [string, 'null'], enum: [GO, CONFIRM, UNDO, MARK_SIGNED, RAISE_PREAUTH, null] }
        passedCount: { type: integer, description: 'Header "n of m passed".' }
        totalCount: { type: integer, description: '9, or 10 with a vesicant drug (ADR-023 H4).' }
        checker: { type: [object, 'null'], properties: { membershipId: { type: string, format: uuid }, name: { type: string }, role: { type: string }, namedAt: { type: string, format: date-time } } }
        secondCheck:
          type: object
          required: [state]
          properties:
            state: { type: string, enum: [NOT_NAMED, WAITING, CONFIRMED, CLEARED], description: 'WAITING "Waiting for <name> to confirm the second check"; CLEARED "Order changed after the second check. A new confirmation is needed."' }
            confirmedByName: { type: [string, 'null'] }
            confirmedRole: { type: [string, 'null'] }
            via: { type: [string, 'null'], enum: [SIGN_IN, PIN, null] }
            confirmedAt: { type: [string, 'null'], format: date-time }
        stages: { type: object, properties: { decided: { type: boolean }, dosesChecked: { type: boolean }, secondCheck: { type: boolean }, pharmacy: { type: string, enum: [NOT_SENT, SENT] }, chair: { type: string, enum: [LATER] } } }
        send: { type: object, properties: { ready: { type: boolean }, note: { type: string, description: '"<n> check(s) still red", "Waiting for the second check" or "All checks passed. Ready to send."' }, holdMode: { type: boolean, description: 'Decision Delay or Stop: "Record the hold" replaces "Send chemo order".' } } }
        sentAt: { type: [string, 'null'], format: date-time }
        sentByName: { type: [string, 'null'] }
        hold: { type: [object, 'null'], properties: { kind: { type: string, enum: [DELAY, STOP] }, reason: { type: string }, date: { type: string, format: date } } }
        factsChangedSinceSent: { type: boolean, description: '"Facts changed after sending"; the sent doses stay.' }
        fingerprint: { type: string, pattern: '^[0-9a-f]{64}$', description: 'SHA-256 of the canonical order text (ADR-023 D6, D14; 0.5.2): every doctor input of the order (protocol, level, reduction reason, edited final doses, pre-medicines not given, allergy confirmation, new consent, scheme, earlier outside doxorubicin), every computed value (weight and height used, BSA, each drug''s doses, lifetime totals, labs values and drawn time, decision), every check''s key and pass or fail, and the named checker. Display text and relative times are not covered. A change of any covered value clears a confirmed second check. Opaque to clients; sent back by checker, second-check and send calls.' }
    ChemoCheckerOption:
      type: object
      required: [membershipId, name, role, hasPin]
      properties:
        membershipId: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [NURSE, PHARMACIST, DOCTOR, VISITING_DOCTOR, OWNER] }
        hasPin: { type: boolean }
    ChemoCheckerInput:
      type: object
      additionalProperties: false
      required: [revision, checkerMembershipId]
      properties:
        revision: { type: integer, format: int64, minimum: 0 }
        checkerMembershipId: { type: [string, 'null'], format: uuid }
    ChemoSecondCheckPinInput:
      type: object
      additionalProperties: false
      required: [orderRevision, fingerprint, checkerMembershipId, pin]
      properties:
        orderRevision: { type: integer, format: int64, minimum: 0 }
        fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        checkerMembershipId: { type: string, format: uuid, description: 'Must equal the named checker.' }
        pin: { type: string, writeOnly: true, description: 'The named checker''s own 4-digit PIN; malformed counts as a wrong try (ADR-010). Never logged, stored or echoed.' }
    ChemoOrderActionInput:
      type: object
      additionalProperties: false
      required: [revision, fingerprint]
      properties:
        revision: { type: integer, format: int64, minimum: 0 }
        fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
    ChemoHoldInput:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: { type: integer, format: int64, minimum: 0 }
        reasonText: { type: [string, 'null'], minLength: 1, maxLength: 300 }
    ChemoCheckPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            type: object
            required: [orderId, patientName, uhid, age, sex, prescriberName, protocolLabel, namedAt]
            properties:
              orderId: { type: string, format: uuid }
              patientName: { type: string }
              uhid: { type: [string, 'null'] }
              age: { type: [integer, 'null'] }
              sex: { type: string, enum: [F, M, O] }
              prescriberName: { type: string }
              protocolLabel: { type: string }
              namedAt: { type: string, format: date-time }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer, const: 20 }
    ChemoCheckSummary:
      type: object
      required: [orderId, patientName, uhid, age, sex, prescriberName, protocolLabel, levelPct, drugs, bsa, labsDrawnAt, decision, checks, secondCheck, fingerprint, canConfirm]
      description: 'SAH-66-3 way (a). Read-only; no dose can be edited here.'
      properties:
        orderId: { type: string, format: uuid }
        patientName: { type: string }
        uhid: { type: [string, 'null'] }
        age: { type: [integer, 'null'] }
        sex: { type: string, enum: [F, M, O] }
        prescriberName: { type: string }
        protocolLabel: { type: string }
        levelPct: { type: integer }
        reductionReason: { type: [string, 'null'] }
        drugs: { type: array, items: { type: object, properties: { name: { type: string }, calculatedMg: { type: number }, roundedMg: { type: number }, finalMg: { type: number }, moreThan5Pct: { type: boolean } } } }
        bsa: { type: object, properties: { used: { type: number }, capped: { type: boolean }, source: { type: string } } }
        labsDrawnAt: { type: [string, 'null'], format: date-time }
        decision: { $ref: '#/components/schemas/OncDecisionKey' }
        checks: { type: array, items: { type: object, properties: { key: { type: string }, passed: { type: boolean }, detail: { type: string } } } }
        secondCheck: { type: object, properties: { state: { type: string, enum: [WAITING, CONFIRMED] }, via: { type: [string, 'null'] }, confirmedAt: { type: [string, 'null'], format: date-time } } }
        fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        canConfirm: { type: boolean, description: 'All checks pass and not yet confirmed: the only action is "Confirm second check".' }
    ChemoCheckConfirmInput:
      type: object
      additionalProperties: false
      required: [fingerprint]
      properties:
        fingerprint: { type: string, pattern: '^[0-9a-f]{64}$', description: 'From the summary the checker read.' }
    EmrVisitTemplate:
      type: object
      required: [id, name, subLine, items]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 60 }
        subLine: { type: [string, 'null'], maxLength: 120 }
        items: { $ref: '#/components/schemas/EmrVisitTemplateItems' }
    EmrVisitTemplateInput:
      type: object
      additionalProperties: false
      required: [name, items]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        subLine: { type: [string, 'null'], maxLength: 120 }
        items: { $ref: '#/components/schemas/EmrVisitTemplateItems' }
    EmrVisitTemplateItems:
      type: object
      additionalProperties: false
      description: 'Clinical text and master keys only; never patient data. Each list at most 20.'
      properties:
        complaints: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/EmrItemListEntry' } }
        diagnoses: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/EmrItemListEntry' } }
        investigations: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/EmrItemListEntry' } }
        services: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/EmrItemListEntry' } }
        medicines: { type: array, maxItems: 20, items: { type: object, additionalProperties: false, required: [medicineId, name], properties: { medicineId: { type: [string, 'null'], format: uuid }, name: { type: string, maxLength: 160 }, frequency: { oneOf: [{ $ref: '#/components/schemas/EmrRxFrequency' }, { type: 'null' }] }, days: { type: [integer, 'null'], minimum: 1, maximum: 365 }, when: { oneOf: [{ $ref: '#/components/schemas/EmrRxWhen' }, { type: 'null' }] } } } }
        advice: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/EmrItemListEntry' } }
        repeatLastRx: { type: boolean, description: 'Apply also runs "Repeat last Rx" (SAH-48-1).' }
    EmrEditHoldInput:
      type: object
      additionalProperties: false
      properties:
        takeOver: { type: boolean, default: false, description: '0.6.0 (SAH-51-4). "Take over" after "Dr. <name> is editing. Take over?"; OWNER with doctor details, and 0.6.2 (H35) on an IPD_ROUND record also the admission''s admitting doctor; anyone else 403 forbidden.' }
    EmrEditHold:
      type: object
      description: '0.6.0 (SAH-51-4, ADR-025 D4). The holder''s name is a staff name: on screen only, never logged.'
      required: [holderMembershipId, holderName, expiresAt, mine, canTakeOver]
      properties:
        holderMembershipId: { type: string, format: uuid }
        holderName: { type: string }
        expiresAt: { type: string, format: date-time, description: '120 seconds after the holder''s last save or tick (database clock).' }
        mine: { type: boolean }
        canTakeOver: { type: boolean, description: 'True when the hold is another doctor''s and the caller is OWNER with doctor details or, 0.6.2 (H35), the admitting doctor of an IPD_ROUND record''s admission.' }
    EmrAddendumInput:
      type: object
      additionalProperties: false
      required: [reason, text]
      properties:
        reason: { type: string, minLength: 1, maxLength: 200, description: '"Reason" (required, short text). Plain text, trimmed, no control characters. Never logged or audited.' }
        text: { type: string, minLength: 1, maxLength: 4000, description: '"Correction or addition" (required). Plain text with line breaks, trimmed, no other control characters. Never logged or audited.' }
    EmrAddendum:
      type: object
      readOnly: true
      required: [id, reason, text, createdAt, createdByName]
      properties:
        id: { type: string, format: uuid }
        reason: { type: string }
        text: { type: string }
        createdAt: { type: string, format: date-time, description: 'Database time; shown in IST.' }
        createdByName: { type: string, description: 'Read through platform.api ("Dr. <name>").' }
    EmrAdmissionState:
      type: object
      description: '0.6.0 (SAH-67-3, ADR-025 D10). Drives the Admit to IPD button: NONE "Admit to IPD"; ADVISED (SAH-52-4, IPD off or advice only) pressed "Admission advised"; REQUESTED "Admission requested"; ADMITTED "Admitted · <ipNumber>"; ALREADY_ADMITTED "Already admitted · <ipNumber>" (opens that admission read-only). Hidden on IPD_ROUND records.'
      required: [state, requestId, admissionId, ipNumber]
      properties:
        state: { type: string, enum: [NONE, ADVISED, REQUESTED, ADMITTED, ALREADY_ADMITTED] }
        requestId: { type: [string, 'null'], format: uuid }
        admissionId: { type: [string, 'null'], format: uuid }
        ipNumber: { type: [string, 'null'] }
    EmrFollowUpInterval:
      type: string
      enum: [D3, D7, D15, M1, M3]
      description: '0.6.0 (SAH-51-6, SO-45-13). 3 days, 7 days, 15 days, 1 month, 3 months (the reference list gmFollowUp keys 3d, 7d, 15d, 1m, 3m map one to one). Months are calendar months on the Asia/Kolkata visit day, clamped to the month''s last day.'
    EmrFollowUpValue:
      type: object
      additionalProperties: false
      description: '0.6.0 (SAH-51-6, ADR-025 D6). Component FOLLOW_UP stored under followup.next_visit of an OPD_VISIT record. Done when an interval is chosen. Note under the chips: "Books an appointment on that day."; the SMS part shows disabled "SMS reminders: later" (OQ-45-27). The reason is always "Review after treatment" (OQ-43-32); no diagnosis.'
      required: [component, schemaVersion, interval]
      properties:
        component: { type: string, const: FOLLOW_UP }
        schemaVersion: { type: integer, const: 1 }
        interval: { oneOf: [{ $ref: '#/components/schemas/EmrFollowUpInterval' }, { type: 'null' }] }
        dueDate: { type: [string, 'null'], format: date, readOnly: true, description: 'Computed by the server from the visit day; ignored when sent.' }
    EmrIpdOrderRow:
      type: object
      additionalProperties: false
      required: [id, drugKey, frequencyKey]
      properties:
        id: { type: string, format: uuid, description: 'Made by the client; it is the SAH-31 clientKey at sign (one order per row, whatever the retries).' }
        drugKey: { type: string, minLength: 1, maxLength: 40, description: 'An ipd DrugKey of GET …/ipd-order-options.' }
        frequencyKey: { type: string, minLength: 1, maxLength: 20, description: 'An ipd FrequencyKey of GET …/ipd-order-options.' }
        orderId: { type: [string, 'null'], format: uuid, readOnly: true, description: 'Set at sign when ipd placed the order; ignored when sent.' }
        orderedAt: { type: [string, 'null'], format: date-time, readOnly: true }
    EmrIpdOrdersValue:
      type: object
      additionalProperties: false
      description: '0.6.0 (SAH-67-1, ADR-025 D8). Component IPD_ORDERS under rx.drug of an IPD_ROUND record: the new medicines of this round, ordered at sign through ipd''s SAH-31 path. Done when at least one row exists. The chart''s existing orders are not listed here (they stay on the IPD EMR sheet).'
      required: [component, schemaVersion, rows]
      properties:
        component: { type: string, const: IPD_ORDERS }
        schemaVersion: { type: integer, const: 1 }
        rows: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/EmrIpdOrderRow' } }
    EmrIpdOrderOptions:
      type: object
      required: [drugs, frequencies, overrideReasons]
      properties:
        drugs:
          type: array
          items:
            type: object
            required: [key, name, route, highAlert]
            properties:
              key: { type: string }
              name: { type: string, maxLength: 80 }
              route: { type: string, maxLength: 20 }
              highAlert: { type: [string, 'null'], description: '"<name> · high-alert" in the select.' }
        frequencies: { type: array, items: { $ref: '#/components/schemas/EmrKeyLabel' } }
        overrideReasons: { type: array, items: { $ref: '#/components/schemas/EmrKeyLabel' } }
    EmrKeyLabel:
      type: object
      required: [key, label]
      properties:
        key: { type: string }
        label: { type: string }
    EmrErOutcome:
      type: object
      additionalProperties: false
      description: '0.6.0 (SAH-67-2, ADR-025 D9). "ER outcome": Discharge from ER, Admit to IPD, Refer out, Send to OPD; none chosen at start.'
      required: [kind]
      properties:
        kind: { type: string, enum: [DISCHARGE, ADMIT, REFER_OUT, SEND_TO_OPD] }
        referTo: { type: [string, 'null'], minLength: 1, maxLength: 120, description: 'REFER_OUT only, required: the place, typed. Goes on the case paper''s referral line; never logged or sent to ipd.' }
        referNote: { type: [string, 'null'], maxLength: 300, description: 'REFER_OUT only, optional.' }
        opdPatientId: { type: [string, 'null'], format: uuid, description: 'SEND_TO_OPD only, required (ADR-025 H2): the patient chosen with the patient search; the new OPD token is for this patient with the signing doctor.' }
        admission: { oneOf: [{ $ref: '#/components/schemas/EmrAdmissionRequestInput' }, { type: 'null' }], description: 'ADMIT only: the request''s type (emergency preselected), stay and note.' }
    EmrFinishChoices:
      type: object
      additionalProperties: false
      description: '0.6.0. The choices made in the finish dialog. Fields that do not apply to the record''s encounter or profile must be absent or null (400 validation).'
      properties:
        erOutcome: { oneOf: [{ $ref: '#/components/schemas/EmrErOutcome' }, { type: 'null' }], description: 'ER_ASSESSMENT: required at sign (409 emr-not-ready ER_OUTCOME_REQUIRED without it).' }
        ipdOrderReasons:
          type: array
          maxItems: 20
          description: 'IPD_ROUND: for a row whose SAH-31 check answered NEEDS_REASON, the reason chosen and the checkToken shown (SAH-31 rules; recorded in ipd''s audit trail).'
          items:
            type: object
            additionalProperties: false
            required: [rowId, overrideReasonKey, checkToken]
            properties:
              rowId: { type: string, format: uuid }
              overrideReasonKey: { type: string }
              checkToken: { type: string, minLength: 22, maxLength: 22, pattern: '^[A-Za-z0-9_-]{22}$' }
        dental:
          type: [object, 'null']
          additionalProperties: false
          description: 'Dental profile (SAH-69-3). "Next sitting": 3 days, 7 days (start), 14 days, 1 month; tagged C-3. Null when every plan row is done ("Confirm").'
          properties:
            nextInterval: { type: [string, 'null'], enum: [D3, D7, D14, M1, null] }
        physio:
          type: [object, 'null']
          additionalProperties: false
          description: 'Physiotherapy profile (SAH-63-3). The slot chosen for session n+1 from GET …/free-slots, or a date only when none is free; null when the package is complete.'
          properties:
            nextSlot:
              type: [object, 'null']
              required: [date]
              properties:
                date: { type: string, format: date }
                time: { type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        confirmAllergyRemoval: { type: boolean, default: false, description: 'SAH-68-3. "Remove from the patient record": without it an allergy removed in this visit stays in the patient record.' }
        share:
          type: object
          additionalProperties: false
          properties:
            whatsappPrescription: { type: boolean, default: false, description: '"Send prescription to patient on WhatsApp" is shown switched off ("Needs the WhatsApp service"); true answers 400 needs-whatsapp-service (DEC-040).' }
    EmrFinishBlocker:
      type: object
      required: [key, message]
      properties:
        key: { type: string, enum: [STILL_NEEDED, ALLERGY_ALERT, IPD_ORDER_BLOCKED, IPD_ORDER_NEEDS_REASON, ENCOUNTER_CLOSED, CASE_CLOSED, HELD_BY_OTHER, ER_OUTCOME_REQUIRED, PATIENT_REQUIRED, PATIENT_FACTS_TOO_LONG, PROFILE] }
        message: { type: string, description: 'Screen text, for example "Still needed: complaints, diagnosis.", "Remove the drug or confirm the allergy alert before completing.", "This admission is closed", "Pick the treatments given today first". No patient data.' }
        sectionKeys: { type: array, items: { $ref: '#/components/schemas/SectionKey' }, description: 'STILL_NEEDED: in layout order; the client opens the first one''s part and highlights it.' }
        rowIds: { type: array, items: { type: string, format: uuid }, description: 'IPD order rows concerned.' }
    EmrFinishBillLine:
      type: object
      description: '0.6.3 (DEC-051 D4): amountPaise = unitPaise × qty for every line.'
      required: [name, qty, unitPaise, amountPaise, state]
      properties:
        name: { type: string }
        qty: { type: integer, minimum: 1, description: 'The quantity, for display ("× 2"). Dental plan lines (source DENTAL_PLAN) are always 1.' }
        unitPaise: { type: integer, minimum: 0, description: '0.6.3 (DEC-051 D4). Price of one unit, for display: the clinic service price (SERVICE), or the row''s charge by tariff or typed amount (DENTAL_PLAN, equal to amountPaise).' }
        amountPaise: { type: integer, minimum: 0, description: '0.6.3 (DEC-051 D4). The line total: qty × unitPaise. This is the amount the line adds to the bill.' }
        state: { type: string, enum: [NEW, ON_BILL, ALREADY_BILLED], description: 'ALREADY_BILLED: "Already billed. Ask billing to adjust." (the bill is not edited).' }
        source: { type: string, enum: [SERVICE, DENTAL_PLAN] }
    EmrFinishOrderCheck:
      type: object
      required: [rowId, drugName, frequencyLabel, outcome, texts, checkToken]
      properties:
        rowId: { type: string, format: uuid }
        drugName: { type: string }
        frequencyLabel: { type: string }
        outcome: { type: string, enum: [PASS, NEEDS_REASON, BLOCKED, ORDERED], description: 'BLOCKED: "Not ordered: <first hard stop>", confirm disabled until the row is removed. NEEDS_REASON: SAH-31 warning lines and the select "Reason to continue (recorded in the audit trail)". ORDERED: already placed (a retry).' }
        texts: { type: array, items: { type: string }, description: 'SAH-31 hard-stop or warning lines as shown by SAH-31; never the patient''s allergy text.' }
        checkToken: { type: [string, 'null'] }
    EmrIpdOrderNotPlacedRow:
      type: object
      additionalProperties: false
      description: >-
        0.6.3 (DEC-051 D3, ADR-025 D8). One row of the 409 ipd-order-not-placed body. It holds the row id, the drug,
        the outcome, the check kind and a fixed reason, and nothing else. It never carries the patient's allergy
        text, the SAH-31 finding text, any other clinical text, the frequency or a check token. A problem detail
        never holds clinical text: ipd.yaml OrderFinding says its text may hold the allergy text and is screen only.
        The doctor sees the allergy on the record and the full SAH-31 lines by checking again (POST …/finish-check,
        EmrFinishOrderCheck), which the dialog does after this answer.
      required: [rowId, drugName, outcome, checkKind, reason]
      properties:
        rowId: { type: string, format: uuid, description: 'The IPD_ORDERS row id (the SAH-31 clientKey).' }
        drugName: { type: string, maxLength: 200, description: 'The catalogue name of the drug ordered (ipd catalogue), not patient data.' }
        outcome: { type: string, enum: [BLOCKED, NEEDS_REASON], description: 'BLOCKED: a SAH-31 hard stop. NEEDS_REASON: a SAH-31 warning with no reason to continue (or the chart changed since the check).' }
        checkKind:
          type: [string, 'null']
          enum: [ALLERGY_PENICILLIN, ALLERGY_SULFA, ALLERGY_CROSS_CEPHALOSPORIN, ALLERGIES_NOT_RECORDED, DUPLICATE, INTERACTION, null]
          description: 'The code of the first SAH-31 finding that stopped the row (a hard stop before a warning), the same values as ipd.yaml FindingCode. Null only when ipd refused the row without a finding.'
        reason:
          type: string
          enum: ['Not ordered: a safety check stopped this medicine.', 'Not ordered: a reason to continue is needed.']
          description: 'A fixed text chosen by outcome (BLOCKED the first, NEEDS_REASON the second). It is never built from patient or finding data.'
    EmrFinishCheck:
      type: object
      required: [ready, blockers, encounterType, effects, info, share]
      properties:
        ready: { type: boolean }
        blockers: { type: array, items: { $ref: '#/components/schemas/EmrFinishBlocker' } }
        encounterType: { $ref: '#/components/schemas/EmrEncounterType' }
        effects:
          type: object
          properties:
            stage:
              type: [object, 'null']
              description: 'OPD: the next workflow step ("usually billing"); ALREADY_MOVED when the card is already past With doctor.'
              required: [outcome, to]
              properties:
                outcome: { type: string, enum: [WILL_MOVE, ALREADY_MOVED] }
                to: { oneOf: [{ $ref: '#/components/schemas/VisitStage' }, { type: 'null' }] }
            followUp:
              type: [object, 'null']
              required: [dueDate, interval, firstFreeSlot]
              properties:
                interval: { oneOf: [{ $ref: '#/components/schemas/EmrFollowUpInterval' }, { type: 'null' }], description: 'Null: the clinic''s follow-up window applies (SAH-14), shown as the date.' }
                dueDate: { type: string, format: date }
                firstFreeSlot: { oneOf: [{ $ref: '#/components/schemas/EmrFreeSlot' }, { type: 'null' }], description: 'Null: "No free slot found. Book the appointment from Appointments."' }
                ignoredInterval: { type: boolean, description: 'Dental next sitting chosen too: the follow-up uses the sitting date (ADR-025 H7).' }
            billLines: { type: array, items: { $ref: '#/components/schemas/EmrFinishBillLine' } }
            billTotalPaise: { type: integer, description: '0.6.3 (DEC-051 D4): the sum of billLines[].amountPaise (line totals; not multiplied by qty again).' }
            patientRecord:
              type: [object, 'null']
              description: 'SAH-68-3. Information row "Patient record will be updated: Allergies, Long-term conditions"; conflict "The patient''s record changed. Review before updating" (the visit still signs).'
              required: [fields, removals, conflict]
              properties:
                fields: { type: array, items: { type: string, enum: [ALLERGIES, LONG_TERM_CONDITIONS] } }
                removals: { type: array, items: { type: string }, description: 'Allergy items removed in this visit (the tick "Remove from the patient record" applies to these). Screen only.' }
                conflict: { type: boolean }
            ipdOrders: { type: array, items: { $ref: '#/components/schemas/EmrFinishOrderCheck' } }
            investigationsAdvised: { type: [string, 'null'], description: 'IPD_ROUND: "Investigations advised" text that nursing will see; no lab order (OQ-45-28).' }
            emergency:
              type: [object, 'null']
              required: [triageLevel, triageLevelName, outcome]
              properties:
                triageLevel: { type: integer }
                triageLevelName: { type: string }
                outcome: { type: [string, 'null'], enum: [DISCHARGE, ADMIT, REFER_OUT, SEND_TO_OPD, null] }
            profile:
              oneOf: [{ $ref: '#/components/schemas/EmrFinishProfileEffects' }, { type: 'null' }]
              description: '0.6.1 (ADR-025 D7, DEC-047): the block of the record''s profile, chosen by its profile property; null for records without a profile (generic renderer, IPD_ROUND, ER_ASSESSMENT). 0.6.0 described free keys; the named blocks replace that. Display only.'
            prints:
              type: array
              maxItems: 5
              uniqueItems: true
              items: { $ref: '#/components/schemas/EmrFinishPrint' }
              description: '0.6.1 (ADR-025 D19). The documents the client prints after the sign, in this order; the dialog may name them (for example "Admission letter and pre-op instructions will print."). Empty for IPD_ROUND and for ER outcomes other than DISCHARGE.'
        info: { type: array, items: { type: string }, description: 'Advice-only rows that never block (for example unresolved ANC alerts).' }
        share:
          type: object
          required: [whatsapp, abha]
          properties:
            whatsapp: { type: object, required: [available, reason], properties: { available: { type: boolean, const: false }, reason: { type: string, description: '"Needs the WhatsApp service".' } } }
            abha: { type: object, required: [available, reason], properties: { available: { type: boolean, const: false }, reason: { type: string, description: '"Needs the ABDM service".' } } }
    EmrFinishPrint:
      type: string
      enum: [PRESCRIPTION, CYCLE_RECORD, CHEMO_CALENDAR, ADMISSION_LETTER, PREOP_SHEET]
      description: >-
        0.6.1 (ADR-025 D19, DEC-047). A document the client prints by itself after a 200 of the sign, one browser
        print each, in this order, with headings in the record's print language (OQ-45-32: English headings where
        reviewed Marathi or Hindi words are not supplied). PRESCRIPTION: every OPD_VISIT record (for Medical Oncology
        it is the take-home prescription, SAH-70-2) and ER_ASSESSMENT with outcome DISCHARGE; never IPD_ROUND.
        CYCLE_RECORD: onco, always (SAH-70-2). CHEMO_CALENDAR: onco when a next cycle date is set (none after Stop
        chemo). ADMISSION_LETTER and PREOP_SHEET: surgery when the OT booking is BOOKED (SAH-71-3). Never in this
        list (on-demand buttons, also on a signed record): vaccination card (paeds, SAH-62-4), home exercise
        programme and progress report (physio, SAH-63-4), estimate (dental SAH-69-1, surgery SAH-71-1) and the
        chemo calendar before signing (SAH-70-1). Every print is composed in the browser from answers the client
        already has (ADR-025 D19 table): no print endpoint, nothing stored, never logged.
    EmrFinishProfileEffects:
      description: >-
        0.6.1 (ADR-025 D7, D19; DEC-047). The profile block of "Check before completing": facts the client cannot
        read from the record view and the values its profile lines need, computed by the profile's
        SpecialtyFinishContributor preview (reads only). The client composes the lines (ADR-025 D2) with the words
        given in each block; the composer's section rows follow. Values the record does not hold show "Not
        recorded". Screen only: never logged, audited or put in a problem detail.
      oneOf:
        - { $ref: '#/components/schemas/EmrFinishGmEffects' }
        - { $ref: '#/components/schemas/EmrFinishDentalEffects' }
        - { $ref: '#/components/schemas/EmrFinishOgEffects' }
        - { $ref: '#/components/schemas/EmrFinishPaedsEffects' }
        - { $ref: '#/components/schemas/EmrFinishPhysioEffects' }
        - { $ref: '#/components/schemas/EmrFinishOncoEffects' }
        - { $ref: '#/components/schemas/EmrFinishSurgeryEffects' }
      discriminator:
        propertyName: profile
        mapping:
          gm: '#/components/schemas/EmrFinishGmEffects'
          dental: '#/components/schemas/EmrFinishDentalEffects'
          og: '#/components/schemas/EmrFinishOgEffects'
          paeds: '#/components/schemas/EmrFinishPaedsEffects'
          physio: '#/components/schemas/EmrFinishPhysioEffects'
          onco: '#/components/schemas/EmrFinishOncoEffects'
          surgery: '#/components/schemas/EmrFinishSurgeryEffects'
    EmrFinishGmEffects:
      type: object
      description: 'General Medicine (SAH-51-1, SAH-60): no profile facts; the dialog shows the composer''s section rows only.'
      required: [profile]
      properties:
        profile: { type: string, const: gm }
    EmrFinishDentalEffects:
      type: object
      description: >-
        SAH-69-3, mockup #DoctorDental dialog "Send to billing?". Lines: one "• <name> — sitting <no> of <of>" per
        done row with its charge (mockup "36 · Root canal treatment — sitting 2 of 3"; the sitting part is left out
        when of is 1), the services of effects.billLines with source SERVICE, "Estimate total <estimateTotalPaise>"
        and "Next sitting: <interval label>" with the date and slot. allRowsDone: no next-sitting line, the confirm
        reads "Confirm" and nothing is booked.
      required: [profile, doneRows, estimateTotalPaise, allRowsDone, carriedRowCount, nextSittingInterval, nextSittingDate, nextSittingSlot]
      properties:
        profile: { type: string, const: dental }
        doneRows:
          type: array
          maxItems: 60
          description: 'The plan rows of EmrSpecialtyView.dental.doneTodayRowIds, in plan order. Their charges are the same lines as effects.billLines with source DENTAL_PLAN (already in billTotalPaise); the client shows each charge once.'
          items:
            type: object
            required: [rowId, name, sitting, amountPaise]
            properties:
              rowId: { type: string, format: uuid }
              name: { type: string, maxLength: 170, description: '"<tooth> · <procedureText>", for example "36 · Root canal treatment".' }
              sitting:
                type: object
                required: [no, of]
                properties:
                  no: { type: integer, minimum: 1, maximum: 6, description: 'The sitting done today (the row''s currentSitting).' }
                  of: { type: integer, minimum: 1, maximum: 6, description: 'The row''s sittingsPlanned.' }
              amountPaise: { type: [integer, 'null'], minimum: 0, description: 'This sitting''s charge: the tariff price or the typed estimate, split as ADR-023 D4 (DEC-044 H17). Null: no tariff match and no typed amount; the row makes no bill line ("Not in tariff").' }
        estimateTotalPaise: { type: integer, minimum: 0, description: 'EmrSpecialtyView.dental.estimateTotalPaise.' }
        allRowsDone: { type: boolean, description: 'Every plan row is DONE once today''s rows are counted.' }
        carriedRowCount: { type: integer, minimum: 0, description: 'Rows still Planned or In progress that the next sitting carries over (SAH-69-3).' }
        nextSittingInterval: { type: [string, 'null'], enum: [D3, D7, D14, M1, null], description: 'The request''s choices.dental.nextInterval, D7 when absent; null when allRowsDone. Labels "3 days", "7 days", "14 days", "1 month" (tagged C-3).' }
        nextSittingDate: { type: [string, 'null'], format: date, description: 'The visit''s Asia/Kolkata day plus the interval; also the follow-up due date (ADR-025 H7). Null when allRowsDone.' }
        nextSittingSlot: { oneOf: [{ $ref: '#/components/schemas/EmrFreeSlot' }, { type: 'null' }], description: 'First free slot of the visit''s doctor on that date or the next 7 days. Null with a date: "No free slot found. Book the appointment from Appointments."' }
    EmrFinishOgEffects:
      type: object
      description: >-
        SAH-61-1, SAH-61-3, mockup #DoctorGynae dialog "Complete this visit?". ANC lines: "ANC visit <ancVisitNo> at
        <weeks>w <days>d · BP <bpSystolic>/<bpDiastolic> · Hb <hbGdl>", "Ordered: <orderedLabels joined, or
        nothing>", "Next ANC at <nextAncWeeks> weeks" (left out when null). GYNAE lines are composed from the record
        as drawn: "Gynae visit · cycle <cycle>, flow <flow>", "Contraception: <choice>", "Orders: <investigations
        added today, or none>". Unresolved ANC alerts are info rows, never blockers.
      required: [profile, mode, ancVisitNo, gestationalAge, bpSystolic, bpDiastolic, hbGdl, orderedLabels, nextAncWeeks]
      properties:
        profile: { type: string, const: og }
        mode: { type: string, enum: [ANC, GYNAE], description: 'EmrSpecialtyView.mode.' }
        ancVisitNo: { type: [integer, 'null'], minimum: 1, description: 'ANC: the number of SIGNED records of the clinic whose ANC_CHECK carries the same pregnancyCourseId, plus 1 (this visit). Null for GYNAE or without an active ANC course.' }
        gestationalAge: { type: [object, 'null'], required: [weeks, days], properties: { weeks: { type: integer }, days: { type: integer } }, description: 'EmrSpecialtyView.og.gestationalAge; null shows "Not recorded".' }
        bpSystolic: { type: [integer, 'null'] }
        bpDiastolic: { type: [integer, 'null'] }
        hbGdl: { type: [number, 'null'] }
        orderedLabels: { type: array, maxItems: 10, items: { type: string }, description: 'ANC orders with an ordered stamp in this record (ANC_CHECK.orders), as their reference labels.' }
        nextAncWeeks: { type: [integer, 'null'], description: 'ANC_CHECK.nextAncWeeks, the doctor''s choice (no rule sets it).' }
    EmrFinishPaedsEffects:
      type: object
      description: >-
        SAH-62-4, mockup #DoctorPaeds dialog "Complete this visit?". Lines: "Weight <weightKg> kg (<weightNote>)" (the
        bracket left out when weightNote is null; "Not recorded" without a weight), "Vaccines given today: <labels
        joined, or none>", "Prescription: <medicine names joined with "; ", or none>" (from the record). The
        WhatsApp reminder tick stays off with "Needs the WhatsApp service".
      required: [profile, weightKg, weightNote, vaccinesGivenToday, nextDue]
      properties:
        profile: { type: string, const: paeds }
        weightKg: { type: [number, 'null'], description: 'GROWTH.weightKg of this record.' }
        weightNote: { type: [string, 'null'], description: 'The text of EmrSpecialtyView.paeds.growthNotes[0] (weight band note or "Centile not available for this age").' }
        vaccinesGivenToday:
          type: array
          maxItems: 30
          items:
            type: object
            required: [vaccineKey, label]
            properties:
              vaccineKey: { type: string }
              label: { type: string, description: 'The vaccine''s reference label (emr_immunization_vaccine.label).' }
        nextDue:
          type: [object, 'null']
          required: [vaccineKey, label, groupLabel]
          properties:
            vaccineKey: { type: string }
            label: { type: string }
            groupLabel: { type: string, description: 'The age group, for example "18 months".' }
    EmrFinishPhysioEffects:
      type: object
      description: >-
        SAH-63-3, mockup #DoctorPhysio dialog "Complete session <sessionNo>?" ("Complete this visit?" when sessionNo is
        null). Lines: "Pain <painScore>/10 (was <previousPainScore> last session)" (the bracket left out when
        previousPainScore is null), "Treatment: <modalities given today, or none>" and "<n> home exercises" from the
        record. "Book session <nextSessionNo>" offers the slots of GET /emr/records/{recordId}/free-slots (choice
        physio.nextSlot). packageComplete: no booking; message "Session <sessionNo> done · package complete".
      required: [profile, courseId, sessionNo, packageSize, nextSessionNo, packageComplete, painScore, previousPainScore]
      properties:
        profile: { type: string, const: physio }
        courseId: { type: [string, 'null'], format: uuid, description: 'The active REHAB course the visit''s sitting belongs to; null when the visit is not linked to one (no session is used or booked).' }
        sessionNo: { type: [integer, 'null'], minimum: 1, description: 'The linked sitting''s number (EmrSpecialtyView.physio.sessionNo).' }
        packageSize: { type: [integer, 'null'], minimum: 1, description: 'The course''s sitting count (sessionsPlanned; package of 10 at start, tagged C-6).' }
        nextSessionNo: { type: [integer, 'null'], description: 'sessionNo + 1; null when packageComplete or no course.' }
        packageComplete: { type: boolean, description: 'sessionNo equals packageSize: "All sessions used".' }
        painScore: { type: [integer, 'null'], minimum: 0, maximum: 10, description: 'PAIN_SCORE.score of this record.' }
        previousPainScore: { type: [integer, 'null'], minimum: 0, maximum: 10, description: 'PAIN_SCORE.score of the patient''s latest earlier SIGNED Physiotherapy record in this clinic.' }
    EmrFinishOncoEffects:
      type: object
      description: >-
        SAH-70-1, SAH-70-2. No finish dialog is drawn for Medical Oncology (the mockup completes with "Visit
        completed · cycle note saved, prescriptions printed in <language>"); ADR-025 H18 default: the "Check before
        completing" dialog with the lines "Cycle <cycleNo> · <decision label>" and "<Next chemo | Re-booked chemo>
        <date with day name> · cycle <nextCycleNo>" (the mockup's fact-cell words; the second line left out after
        Stop chemo), then the composer rows. The footer words "Cycle record, take-home medicines and calendar will
        print." come from effects.prints.
      required: [profile, cycleNo, decision, orderStatus, nextCycleNo, nextCycleLabel, nextCycleDate, nextCycleSittingId, cycleChargePaise, followUpFromNextCycle]
      properties:
        profile: { type: string, const: onco }
        cycleNo: { type: [integer, 'null'], minimum: 1, description: 'EmrSpecialtyView.onco.cycleNo.' }
        decision: { oneOf: [{ $ref: '#/components/schemas/OncDecisionKey' }, { type: 'null' }] }
        orderStatus: { type: string, enum: [NONE, DRAFT, SENT, HELD] }
        nextCycleNo: { type: [integer, 'null'], description: 'cycleNo + 1 when nextCycleDate is set.' }
        nextCycleLabel: { type: [string, 'null'], enum: [NEXT_CHEMO, REBOOKED_CHEMO, null], description: '"Next chemo" or "Re-booked chemo" (Delay 1 week).' }
        nextCycleDate: { type: [string, 'null'], format: date, description: 'CHEMO_PLAN.nextCycleDate, else EmrSpecialtyView.onco.nextCycle.defaultDate; null after Stop chemo.' }
        nextCycleSittingId: { type: [string, 'null'], format: uuid, description: 'The planned CHEMO course sitting already added for that date (SAH-70-1); null when none (for example IPD off, ADR-023 H13: the date shows on the sheet and the calendar only).' }
        cycleChargePaise: { type: [integer, 'null'], minimum: 0, description: 'That sitting''s charge, kept on the course account (no visit bill line, ADR-025 H9).' }
        followUpFromNextCycle: { type: boolean, description: 'True when no follow-up interval is chosen and the follow-up due date is nextCycleDate (ADR-025 D7).' }
    EmrFinishSurgeryEffects:
      type: object
      description: >-
        SAH-71-3. No finish dialog is drawn for General Surgery (the mockup completes with "Visit completed ·
        admission letter, pre-op advice and estimate printed"); ADR-025 H18 default: the "Check before completing"
        dialog with the line "OT booking: <procedureText> · <otDate>, <slotText>" when BOOKED, then the composer rows;
        the prints are named from effects.prints. After a 200 the dialog message "Go to ward and OT with the booking"
        shows beside the print buttons (SAH-71-3).
      required: [profile, bookState, procedureText, otDate, slotText, admission, admissionRequested, fitnessText]
      properties:
        profile: { type: string, const: surgery }
        bookState: { type: string, enum: [NOT_BOOKED, READY, BOOKED, CHANGED], description: 'EmrSpecialtyView.surgery.bookState.' }
        procedureText: { type: [string, 'null'] }
        otDate: { type: [string, 'null'], format: date }
        slotText: { type: [string, 'null'], description: 'For example "OT 2 · 10:00" (text only, OQ-45-28).' }
        admission: { type: [string, 'null'], enum: [DAY_CARE, IPD_1_DAY, IPD_1_2_DAYS, IPD_2_DAYS, IPD_4_5_DAYS, null], description: 'SURGERY_PLAN.admission; labels from the reference.' }
        admissionRequested: { type: boolean, description: 'The booking''s sitting asked for a ward bed, or the record has an OPEN admission request.' }
        fitnessText: { type: [string, 'null'], description: 'EmrSpecialtyView.surgery.fitness.text.' }
    EmrSignInput:
      type: object
      additionalProperties: false
      required: [revision, choices]
      properties:
        revision: { type: integer, format: int64, minimum: 0 }
        choices: { $ref: '#/components/schemas/EmrFinishChoices' }
    EmrSignOutcome:
      type: object
      description: 'What the sign did; ids, dates and counts only. The client builds the message: OPD "Visit completed · calling next patient" ("Rx sent" is not used until a send exists, DEC-040); dental "Sent to billing · next sitting booked in <interval>"; physio "Session n done · session n+1 booked <slot>" or "Session m done · package complete"; IPD "Round done"; Emergency the outcome.'
      required: [stage, followUp, billLines, billTotalPaise, ipdOrders, round, emergency, patientRecord, course]
      properties:
        stage:
          type: [object, 'null']
          required: [outcome, to]
          properties:
            outcome: { type: string, enum: [MOVED, ALREADY_MOVED] }
            to: { oneOf: [{ $ref: '#/components/schemas/VisitStage' }, { type: 'null' }] }
        followUp:
          type: [object, 'null']
          required: [id, dueDate, appointmentDate, appointmentTime]
          properties:
            id: { type: string, format: uuid }
            dueDate: { type: string, format: date }
            appointmentDate: { type: [string, 'null'], format: date }
            appointmentTime: { type: [string, 'null'] }
            noFreeSlot: { type: boolean, description: 'True: "No free slot found. Book the appointment from Appointments."' }
        billLines: { type: integer, minimum: 0 }
        billTotalPaise: { type: integer }
        ipdOrders: { type: array, items: { type: object, required: [rowId, orderId], properties: { rowId: { type: string, format: uuid }, orderId: { type: string, format: uuid } } } }
        round: { type: [object, 'null'], required: [admissionId, roundDate], properties: { admissionId: { type: string, format: uuid }, roundDate: { type: string, format: date } } }
        emergency:
          type: [object, 'null']
          required: [outcome]
          properties:
            outcome: { type: string, enum: [DISCHARGE, ADMIT, REFER_OUT, SEND_TO_OPD] }
            admissionRequestId: { type: [string, 'null'], format: uuid }
            opdVisitId: { type: [string, 'null'], format: uuid }
            tokenNo: { type: [integer, 'null'] }
        patientRecord: { type: string, enum: [UPDATED, NOT_CHANGED, CONFLICT] }
        course:
          type: [object, 'null']
          properties:
            sittingDoneId: { type: [string, 'null'], format: uuid }
            nextSittingId: { type: [string, 'null'], format: uuid }
            nextAppointmentDate: { type: [string, 'null'], format: date }
            nextAppointmentTime: { type: [string, 'null'] }
            packageComplete: { type: boolean }
        prints:
          type: array
          maxItems: 5
          uniqueItems: true
          items: { $ref: '#/components/schemas/EmrFinishPrint' }
          description: '0.6.1 (ADR-025 D19). Always present from 0.6.1. The documents to print now, in order, by the rules of EmrFinishPrint applied to the signed record (encounter, profile, ER outcome, OT booking, next cycle date). Computed on every answer, also on a replay; not stored in sign_result.'
    EmrSignResult:
      type: object
      required: [replayed, outcome, record]
      properties:
        replayed: { type: boolean, description: 'True when this answers a repeat of the same Idempotency-Key; nothing was done again.' }
        outcome: { $ref: '#/components/schemas/EmrSignOutcome' }
        record: { $ref: '#/components/schemas/EmrRecordView', description: 'The signed record (read-only).' }
    EmrVitalsReading:
      type: object
      description: 'Values with units as the nurse recorded them; recordedByName from Team and access. Screen only, never logged.'
      required: [sourceEntryId, source, recordedByName, recordedAt]
      properties:
        sourceEntryId: { type: string, format: uuid }
        source: { type: string, enum: [IPD_NURSING_CHART] }
        recordedByName: { type: string }
        recordedAt: { type: string, format: date-time }
        bpSystolic: { type: [integer, 'null'] }
        bpDiastolic: { type: [integer, 'null'] }
        pulse: { type: [integer, 'null'] }
        spo2: { type: [integer, 'null'] }
        temperature: { type: [object, 'null'], required: [value, unit], properties: { value: { type: number }, unit: { type: string, enum: ['°C', '°F'] } } }
        respiratoryRate: { type: [integer, 'null'] }
    EmrEncounterVitals:
      type: object
      required: [current, earlier, sources]
      properties:
        current: { oneOf: [{ $ref: '#/components/schemas/EmrVitalsReading' }, { type: 'null' }] }
        earlier:
          type: [object, 'null']
          description: '"Last taken by <recordedByName>, <date and time>. Doctor''s entry for this visit is still needed." Values are not sent.'
          required: [recordedByName, recordedAt]
          properties:
            recordedByName: { type: string }
            recordedAt: { type: string, format: date-time }
        sources:
          type: object
          required: [opd, ipd, er]
          properties:
            opd: { type: string, enum: [NOT_CAPTURED] }
            ipd: { type: string, enum: [AVAILABLE, NOT_APPLICABLE] }
            er: { type: string, enum: [NOT_CAPTURED] }
    EmrAdmissionPrefill:
      type: object
      description: 'Screen only (SAH-67-3): never logged, audited or put in a problem detail.'
      required: [patient, suggestedType, diagnoses, procedure, plannedStayDays, openRequest, openAdmission, canAdmitDirectly, emergencyCaseId]
      properties:
        patient:
          type: object
          required: [patientId, name, age, sex, mobile]
          properties:
            patientId: { type: [string, 'null'], format: uuid, description: 'Null for an Emergency case not yet admitted.' }
            name: { type: string }
            age: { type: [integer, 'null'] }
            sex: { type: string, enum: [F, M, O] }
            mobile: { type: [string, 'null'], description: '0.6.2 (H34): set only when canAdmitDirectly is true and the patient has one; null otherwise, and always null for an Emergency case without a patient.' }
        suggestedType: { type: string, enum: [planned, emergency, daycare] }
        diagnoses: { type: array, maxItems: 50, items: { type: string } }
        procedure: { type: [string, 'null'], description: 'From the OT booking (SAH-64-3), when booked.' }
        plannedStayDays: { type: [integer, 'null'], description: 'From the OT booking''s "IPD n days".' }
        emergencyCaseId: { type: [string, 'null'], format: uuid }
        openRequest: { oneOf: [{ $ref: '#/components/schemas/EmrAdmissionRequestView' }, { type: 'null' }] }
        openAdmission: { type: [object, 'null'], required: [admissionId, ipNumber], properties: { admissionId: { type: string, format: uuid }, ipNumber: { type: string } } }
        canAdmitDirectly: { type: boolean, description: 'OWNER with doctor details: the existing sheet can be completed now (bed, deposit, consent; SAH-23). Others: "Send admission request".' }
    EmrAdmissionRequestInput:
      type: object
      additionalProperties: false
      required: [admissionType]
      properties:
        admissionType: { type: string, enum: [planned, emergency, daycare], description: 'As the mockup''s request: planned, emergency (preselected for an Emergency visit or case), daycare; "IPD n days" is planned with plannedStayDays.' }
        plannedStayDays: { type: [integer, 'null'], minimum: 1, maximum: 60 }
        note: { type: [string, 'null'], maxLength: 300, description: 'The doctor''s note for the ward. Never logged or audited.' }
    EmrAdmissionRequestView:
      type: object
      required: [id, status, admissionType, plannedStayDays, createdAt, admissionId, ipNumber]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [OPEN, ADMITTED] }
        admissionType: { type: string, enum: [planned, emergency, daycare] }
        plannedStayDays: { type: [integer, 'null'] }
        createdAt: { type: string, format: date-time }
        admissionId: { type: [string, 'null'], format: uuid }
        ipNumber: { type: [string, 'null'] }
    EmrFreeSlot:
      type: object
      required: [date, time]
      properties:
        date: { type: string, format: date }
        time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: 'Shown "Wed 5:00 PM".' }
    EmrTriageScale:
      type: object
      required: [scale, clinicDefault, levels]
      properties:
        scale: { type: integer, enum: [3, 5] }
        clinicDefault: { type: boolean, description: 'True when the clinic has no Emergency settings and the SAH-28 default 3-colour scale is used.' }
        levels:
          type: array
          items:
            type: object
            required: [level, name, description, tone]
            properties:
              level: { type: integer, minimum: 1, maximum: 5 }
              name: { type: string }
              description: { type: string }
              tone: { type: string, enum: [crit, warn, good] }
    EmrReprint:
      type: object
      description: '0.6.0 (SAH-51-6, ADR-025 D15). Read-only; screen and print only. 0.6.1: layout, specialty and specialtyReference added (always present; specialty and specialtyReference null without a profile), so the shared composer prints the same words as the doctor''s case paper.'
      required: [visitId, recordId, reprint, signedAt, context, sections, addenda, layout, specialty, specialtyReference]
      properties:
        visitId: { type: string, format: uuid }
        recordId: { type: string, format: uuid }
        reprint: { type: boolean, const: true, description: 'The paper shows "Reprint".' }
        signedAt: { type: string, format: date-time }
        context: { $ref: '#/components/schemas/EmrCasePaperContext' }
        sections:
          type: array
          description: 'Only sections with Print on prescription on in the record''s snapshot, in layout order, with the signed values (inactive list items left out).'
          items:
            type: object
            required: [key, name, heading, values]
            properties:
              key: { $ref: '#/components/schemas/SectionKey' }
              name: { type: string }
              heading: { $ref: '#/components/schemas/EmrCasePaperHeading' }
              values: { type: object, additionalProperties: true }
        addenda: { type: array, items: { $ref: '#/components/schemas/EmrAddendum' } }
        followUpDate: { type: [string, 'null'], format: date }
        layout:
          $ref: '#/components/schemas/EmrSnapshot'
          description: '0.6.1 (ADR-025 D15, DEC-047). The record''s frozen snapshot with only the sections listed in sections (same order), each with its field definitions, option labels and, for a form section, its form definition. The composer turns every stored key (choice options, table columns, form choices) into its label from here, exactly as for the live case paper.'
        specialty:
          oneOf: [{ $ref: '#/components/schemas/EmrSpecialtyView' }, { type: 'null' }]
          description: >-
            0.6.1. The profile's computed block (only that block set) for the lines the paper prints from it (for
            example "Fitness: ASA <grade> · <summary>", the weight note, vaccines given today). Computed from the signed
            values with the signing day (Asia/Kolkata) as today, so ages, vaccine states and the next due vaccine read
            as they did when signed; for Paediatrics it also feeds the vaccination card (SAH-62-4). Null without a
            profile. 0.6.2 (ADR-025 D15, DEC-048 H32): what is filled depends on the caller. DOCTOR or VISITING_DOCTOR
            of the record's visit, and OWNER: the whole block. FRONT_DESK and PHARMACIST: profile, mode,
            hiddenSectionKeys and tagNote, and in the profile block only the keys that a section listed in sections
            reads when printed; every other key of the block is left out (the block's keys are optional) and the
            other profiles' blocks stay null; vitalsFlags is sent only when the section holding VITALS_LOG prints.
            For Paediatrics the immunization data the vaccination card prints (vaccines, groups, given and due states
            as of the signing day) is also kept, whether or not its section prints; dateOfBirth stays null for
            PHARMACIST (0.5.3 rule). Never sent to these two roles unless the section that reads it is printed:
            Obstetrics dating, EDD, gestational age, ANC check results, formFRequired and formFCount; Oncology
            decision and lab flags; Surgery payer and deposit; the Dental estimate. specialtyReference is unchanged
            (product data, ADR-025 H24).
        specialtyReference:
          oneOf: [{ $ref: '#/components/schemas/EmrSpecialtyReference' }, { type: 'null' }]
          description: '0.6.1. The profile''s reference (as GET /emr/specialty-reference/{profile}), for the labels of specialty keys (procedures, vaccines and groups, pre-op orders, blood, modalities, referrals). Product data, no patient data. Null without a profile.'
