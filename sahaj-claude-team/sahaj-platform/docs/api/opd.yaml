      description: >-
        SAH-46-3 (ADR-020 D7, D8). Any department visible to doctors (a published department, or a starter-backed
        one using its starter layout). A new layout reference replaces the old one, choiceSource SWITCHED; no entered
        value is deleted (sections not in the new layout are kept and not shown). Not saved as the doctor's default.
        The same department answers 200 and writes nothing. A SIGNED record: 409 emr-record-signed. Stale revision:
        409 emr-record-changed. An added department never published: 404 department-not-published. One audit entry
        EMR_RECORD_DEPARTMENT_SWITCHED.
