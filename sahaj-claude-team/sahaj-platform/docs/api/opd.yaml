      responses:
        '200': { description: The record after the change, content: { application/json: { schema: { $ref: '#/components/schemas/EmrRecordView' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation or not-applicable.' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem', description: record-not-found }
        '409': { $ref: '#/components/responses/Problem', description: 'emr-record-changed or emr-record-signed.' }
  /emr/allergy-classes:
    get:
      tags: [SAH-48]
      operationId: listEmrAllergyClasses
      summary: Drug allergy classes the Allergies section can pick (sulfa, penicillin)
      description: >-
        SAH-48-2 (ADR-022 D5). Global reference data, changed by migration only: exactly the two classes drawn in the
        mockup, SULFA "Sulfa drugs" and PENICILLIN "Penicillin" (tagged C-2, not clinically reviewed). The Allergies
        section stores a picked class as an item of allergy.drug_allergy with itemKey = classKey; typed allergy text
        (itemKey null) never triggers the check. Write methods answer 403 forbidden for every role.
