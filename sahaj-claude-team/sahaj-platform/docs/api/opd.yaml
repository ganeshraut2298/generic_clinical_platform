        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /emr/medicines:
    get:
      tags: [SAH-48]
      operationId: searchEmrMedicines
      summary: Medicine search for the prescription (generic names, ranked by the doctor's own use)
      description: >-
        SAH-48-1 (ADR-022 D4). The SAH-7 global medicine master, prefix match on the name ignoring case (the rules of
        GET /emr/masters for q: trimmed, at most 100 characters, % _ and \ literal, never logged). Order: medicines this
        doctor used on signed visits by use count, then the clinic's favourites, then name A to Z. Each item carries
        the drug's allergy class (tagged) and the row defaults (frequency, days, when) the prescription uses when it is
        added. GET /medicines (SAH-7) is unchanged.
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 500, default: 0 } }
      responses:
        '200': { description: One page of 20, content: { application/json: { schema: { $ref: '#/components/schemas/EmrMedicinePage' } } } }
        '400': { $ref: '#/components/responses/Problem', description: validation }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /emr/medicine-favourites:
    get:
      tags: [SAH-48]
      operationId: listEmrMedicineFavourites
      summary: The clinic's favourite medicines with their saved frequency, days and when ("My favourites")
      description: >-
        SAH-48-1 (ADR-022 D4). The clinic's SAH-7 favourites, one list per clinic (no department filter: not drawn and
        not in the story), name A to Z, with the master's defaults. A medicine with no saved defaults gets frequency =
        its SAH-7 schedule when that is 1-0-0, 1-0-1, 0-0-1 or 1-1-1, else 1-0-1; days 5; when AFTER_FOOD (ADR-022 H6,
        default awaiting the human). The client hides favourites already on the prescription.
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      responses:
        '200':
          description: Favourites
          content: { application/json: { schema: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/EmrMedicineOption' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /emr/records/{recordId}/copy-items:
    parameters:
      - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [SAH-48, SAH-50]
      operationId: copyEmrItems
      summary: Repeat last Rx, Copy medicines to today, Repeat these tests
      description: >-
        SAH-48-1, SAH-50-4 (ADR-022 D6). Copies the medicines (with frequency, days and when) or the tests of a SIGNED
        record of the same patient in this clinic into this record's prescription (rx.drug) or investigations
        (investigations.lab_tests). source LAST_SIGNED_PRESCRIPTION uses the patient's latest signed record that has
        medicines (any department); PAST_RECORD uses sourceRecordId. Items already present (same name or test text,
        ignoring case) are skipped, so a double tap adds once; no revision is needed (the record row is locked). The
        drug-class allergy check runs on the result. Tests are only listed: nothing is sent to a lab (OQ-45-28). Same
        access as a draft save (own patient; NURSE, FRONT_DESK, BILLING, PHARMACIST, COUNSELLOR 403). A SIGNED target:
        409 emr-record-signed ("This visit is signed"). Target section not in the record's layout: 409
        section-not-in-layout. Source not found, not signed, another patient's or another clinic's: 404
        past-visit-not-found. One audit entry EMR_ITEMS_COPIED (source record id, what, added, skipped; never names).
        Message "n medicine(s) copied to today's prescription" or "n test(s) added to today's orders".
      x-required-role: DOCTOR, VISITING_DOCTOR, or OWNER with doctor details
      x-required-permission: clinic.consultation.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmrCopyItemsInput' }
            examples:
              repeatLastRx: { value: { source: LAST_SIGNED_PRESCRIPTION, what: MEDICINES } }
              repeatTests: { value: { source: PAST_RECORD, sourceRecordId: 0b6f6a52-1d3e-4b7a-9a10-3c2d1e0f9a88, what: TESTS } }
      responses:
        '200': { description: Copied (added may be 0), content: { application/json: { schema: { $ref: '#/components/schemas/EmrCopyItemsResult' } } } }
        '400': { $ref: '#/components/responses/Problem', description: validation }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden, doctor-details-missing, not-own-patient or outside-scope.' }
        '404': { $ref: '#/components/responses/Problem', description: 'record-not-found or past-visit-not-found.' }
        '409': { $ref: '#/components/responses/Problem', description: 'emr-record-signed, section-not-in-layout or encounter-drafts-not-enabled.' }
  /emr/records/{recordId}/print-preferences:
