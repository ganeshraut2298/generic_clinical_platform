        OWNER, NURSE, DOCTOR (DOCTOR reads only); FRONT_DESK, BILLING, PHARMACIST, VISITING_DOCTOR and every
        other role 403 forbidden. Check order: role 403 forbidden; module Off 403 module-off; then one READ
        COMMITTED read-write transaction (it writes the access row): the role is read again from the active
        membership (platform.api TeamMemberPort.findActiveByUserId; no active membership or a role outside
        OWNER, NURSE, DOCTOR 403 forbidden); admission not found or another clinic's 404 not-found (row-level
        security); the admission's patient not found through patient.api PatientClinicalPort 404 not-found
        (never a placeholder; a merged-away patient reads the kept record, ADR-009 B9). Allowed in Read-only
        state and for a DISCHARGED admission (AC11; canGive is then false). Takes no lock. After the 404 checks
        pass it writes one patient.record_access row through patient.api PatientAccessPort, the rule of GET
        /admissions/{id}/nursing (ADR-011 D10; story AC9 says the opening is not logged, OQ-30-7: deviation in
        the safer direction for the human, ADR-011 Q7); no clinical event (the mockup logs only the EMR
        opening) and no audit row. A 403 or 404 writes nothing. asOf is the database clock (clock_timestamp(),
        read through a repository call; never the application or device clock); every slot state, lateHours
        and doseCount are computed by the server (DoseSlots, ADR-011 D2) against that asOf. Lists the orders
        of the admission with status PENDING or ACTIVE (REJECTED and STOPPED are not listed), chart order
        (orderedAt ascending, then id), each with the slots of today (the IST date of asOf) and today's dose
        records; not paged (ADR-011 D12). Loaded when the tab is chosen and after every dose answer (the
        answers carry it); not polled. Never logged.
        SAH-35 (ADR-012 D4): also loaded, once and for that patient only, when Give is tapped on a row of the
        Safety board's Medicine round (never per row, never on a refresh); the same rules apply, so each tap
        writes one record-access row (OQ-35-6). The client takes the order MedicineRoundRow.orderId and the slot
        MedicineRoundRow.slotAt from this answer and opens the Give sheet with its data. When the slot is no
        longer givable the sheet does not open; the client shows, and reloads the board: slot GIVEN, HELD or
        REFUSED "This dose is already recorded."; the order not in orders "This medicine was stopped. Its doses
        can no longer be recorded."; status DISCHARGED "This patient is not admitted any more. Doses cannot be
        recorded."; giveLockReason IPD_READONLY "IPD is read-only. Doses cannot be recorded."; any other case
        (slot not found, not DUE or LATE, or canGive false) "Reload the page and try again.". A failed read: the
        toast "We could not load the medicines. Try again." and the board stays.
