  /admissions/{id}/transfer:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [SAH-26, SAH-29]
      description: 'SAH-29 (AC5; OQ-26-4, as the mockup): for an admission with a package the transfer works exactly as below (same checks, same transfer row, same audit), but the running bill of a package admission never shows bed-transfer segments, so the bed difference is not billed; the days beyond the package are billed at the rate of the bed the patient is in now (RunningBill). OWNER, FRONT_DESK, NURSE. Check order: admission exists (404) and is Admitted (409 not-admitted); target bed exists (404) and is not the current bed (400); target bed is Available (409 bed-not-free, "That bed is no longer free. Pick another."); owner rule for a higher category (403 owner-approval-needed, "Moving to <category> needs the owner''s approval. Ask the clinic owner."). One transaction: admission bed, new bed Occupied, old bed Cleaning, transfer row (append-only), audit IPD_BED_TRANSFER (ids, codes, categories, segment days, rule values; never name or reason). Module off 403 module-off; Read-only 409 ipd-readonly. Messages: same bed 400 field toBedId "The patient is already in this bed. Pick another."; not admitted 409 "This patient is not admitted any more. The patient cannot be moved." Problem types: owner-approval-needed (403), bed-not-free, not-admitted, ipd-readonly (409). Free beds are ordered by category, then room creation order (no-room beds last), then code.'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [toBedId], properties: { toBedId: { type: string, format: uuid }, reason: { type: [string, 'null'], enum: ['Needs closer monitoring', 'Moving to a step-down bed', 'Patient or family request', 'Isolation', null], description: 'Optional; stored, not shown.' } } } } }
      responses:
