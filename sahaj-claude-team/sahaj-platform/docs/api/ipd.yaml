                    status: ADMITTED
                    state: 'on'
                    asOf: '2026-11-06T05:35:00Z'
                    patient: { patientId: 0b7d7d3e-3d5c-4f0b-8b9e-2a9d6f1c0a10, name: Ramesh Kale, uhid: PT-00042, age: 64, sex: M, bedCode: G-03, allergyText: None known, allergyStatus: NONE_KNOWN }
                    doseCount: 1
                    canGive: true
                    giveLockReason: null
                    orders:
                      - orderId: 1f0c2b7a-7a1e-4c55-9a43-5d2f8c3e9b01
                        drugKey: hep
                        drugName: Inj. Heparin 5,000 IU
                        route: SC
                        highAlert: Anticoagulant
                        frequencyKey: bd
                        frequencyLabel: Twice daily
                        orderedByName: Dr. Meera Kulkarni
                        status: ACTIVE
                        slots:
                          - slotAt: '2026-11-06T02:30:00Z'
                            state: GIVEN
                            lateHours: null
                            canGive: false
                            dose: { id: 9a1d3c55-2b8e-4f61-8d0a-6e7f1b2c3d44, slotAt: '2026-11-06T02:30:00Z', outcome: GIVEN, reason: null, recordedAt: '2026-11-06T02:34:00Z', recordedByName: Sr. Anjali Pawar, secondCheckByName: Sr. Rupali More }
                          - { slotAt: '2026-11-06T14:30:00Z', state: LATER, lateHours: null, canGive: false, dose: null }
                    secondNurses:
                      - { membershipId: 5e2f8a1b-9c3d-4e7f-8a6b-1c2d3e4f5a6b, name: Sr. Rupali More }
                      - { membershipId: 7a8b9c0d-1e2f-4a3b-9c4d-5e6f7a8b9c0d, name: Br. Nikhil Jadhav }
