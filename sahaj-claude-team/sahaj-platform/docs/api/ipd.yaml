  /medicine-orders/{id}/doses:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 'The order id (MarOrder.orderId).' }
    post:
      tags: [SAH-32]
      description: >-
        Given and Record not given (mockup sfgiveok, sfnogive), the footer buttons of the Give sheet opened from
        a DUE or LATE slot (MarSlot.canGive). One dose record per order and slot, append-only: never changed or
        deleted, no undo (AC9, OQ-32-5; ADR-011 D1). NURSE, OWNER (OQ-32-3; DOCTOR reads only); every other role
        403 forbidden, detail "Only nurses and the clinic owner can give medicines." (contract wording: the
        mockup's "Only nurses and doctors can give medicines." would contradict itself when sent to a refused
        DOCTOR; ADR-011 D3, Q3). Check order (ADR-011 D4 to D6), each step stopping the request: (1) role 403
        forbidden; module Off 403 module-off; Read-only 409 ipd-readonly ("IPD is read-only. Nothing can be
        changed."; AC11). (2) Body format 400 problem type validation, every format error together in the order
        clientKey, slotAt, outcome (texts on DoseInput). (3) In a first READ COMMITTED transaction, no lock:
        membership re-read (NURSE or OWNER, else 403 forbidden with the same text); order missing or another
        clinic's 404 not-found; the admission's patient missing 404 not-found; client-key replay (below);
        admission not ADMITTED 409 not-admitted ("This patient is not admitted any more. Doses cannot be
        recorded."); order PENDING 409 order-not-verified ("This order is not checked by the pharmacist yet.");
        order STOPPED 409 order-state ("This medicine was stopped. Its doses can no longer be recorded.");
        order REJECTED 409 order-state ("This order was rejected by the pharmacist. It cannot be given.");
        slotAt not one of the order's dose times (FrequencyKey) on today's IST date by the database clock 400
        field slotAt ("This is not a dose time of this medicine today. Reload the page and try again."); slot
        before the order started (verified today and slotAt more than 60 minutes before verifiedAt; AC10,
        OQ-32-2) 409 dose-before-start ("This dose time is before the pharmacist checked the order."); slot
        more than 60 whole minutes ahead 409 dose-not-due ("This dose is not due yet. It can be given from 1
        hour before its time."); a record for this order and slot exists (any recorder, any outcome) 409
        dose-recorded ("This dose is already recorded."; AC4: never twice, by two nurses or a double tap). Then
        for outcome GIVEN the bedside checks (AC6), in this order: wristband empty after normalisation 400 field
        wristband "Scan the wristband first."; wristband not equal to the patient's UHID (both normalised: NFKC,
        every white-space, control and format character removed, upper case; a value longer than 200
        characters counts as not equal) 409 wristband-mismatch, detail "Wristband does not match this patient.
        Stop. Check the patient before giving anything." (no name in a problem detail), and the clinical event
        (kind deny) "Stopped at the identity check: entered <scan>, expected <UHID> (<drug name>)" (SAH-38, ADR-014
        D11, from that release; rows written before keep "Stopped at the wristband check: scanned ...") where <scan>
        is the normalised text when it matches the UHID-shape pattern ^[A-Z]{2,6}-[0-9]{5,9}$ (2 to 6 letters,
        a hyphen, 5 to 9 digits: 8 to 16 characters; the server's pattern in WristbandCheck is the authority),
        and otherwise the words "text that is not a UHID" (ADR-011 D4; never free text in the log). The pattern
        is bounded to what the UHID generator produces (patient.next_uhid(): 'PT-' and the sequence padded to
        at least 5 digits; a UHID is at most 22 characters, 'PT-' plus up to 19 digits), so a 10-digit mobile or
        a 14-digit ABHA-like run never reaches the log. A scan that is a UHID with more than 9 digits is shown
        in the deny entry only as "text that is not a UHID"; the match check itself still compares the whole
        normalised text with any UHID. The identity scan stored on a GIVEN dose equals the UHID and never
        exceeds 40 characters. Plus the audit
        IPD_DOSE_WRISTBAND_MISMATCH (orderId, admissionId, drugKey, slotAt), written and committed although the
        answer is 409; identityConfirmed not true 400 field identityConfirmed "Confirm the second identifier:
        name and date of birth."; for a high-alert medicine: secondNurseId missing or secondNursePin not exactly
        4 ASCII digits 400 (fields secondNurseId, secondNursePin) "High-alert medicine: a second nurse must check
        it and enter a 4-digit PIN."; secondNurseId is the caller's own membership 400 field secondNurseId "The
        second check must be a different nurse."; secondNurseId not an active NURSE member of the clinic 400
        field secondNurseId "Choose a nurse from the list." (contract wording). (4) High-alert GIVEN only, outside
        any transaction: the second nurse's own personal staff PIN through platform.api
        StaffPinPort.checkColleague (ADR-011 D7, PROPOSED platform addition), in its own platform transaction
        that commits first (a wrong try counts on the second nurse's PIN although this request fails), in the
        order of ADR-014 D3: SAHAJ_PIN_PEPPER not set 503 pin-unavailable "PIN checks are not available right
        now. Try again later."; the caller already has 5 failed colleague checks in 15 minutes or 10 in 24
        hours (in memory until HARD-2) 429 rate-limit "Too many PIN tries in a short time. Try again in a few
        minutes." (SAH-38: the second nurse's own failed-check limit is no longer used, so other people's
        wrong tries never block naming that nurse); not eligible any more 400 field secondNurseId "Choose a
        nurse from the list."; the second nurse has no PIN (any reason) 409 pin-not-set "The second nurse has
        not set a PIN yet. Choose another nurse."; locked 403 pin-locked "The second nurse's PIN is locked after
        5 wrong tries. Choose another nurse, or try again at <h:mm AM/PM>." (IST; retryAfterSeconds); SAH-38
        pair cap: the caller already made 5 wrong tries of this second nurse's PIN within a rolling 7 days
        (durable in the database, the same after a restart and on every instance; cleared by a right PIN typed
        by the same caller for the same nurse, or by a new PIN) 429 colleague-pin-limit "Too many wrong PIN
        tries for this nurse. Choose another nurse." (the PIN is not compared, nothing is counted; no
        retryAfterSeconds, no count; another nurse can be named at once); wrong 403 wrong-pin "That PIN is not
        right." (no tries-left count for a colleague's PIN, so a guesser is not told when to stop before a lock;
        the try counts on the second nurse's PIN and on the pair; security review S4; the caller's own PIN
        answer on verify keeps the count); the fifth wrong try in a row locks that PIN for 15 minutes and answers
        pin-locked, and because a colleague typed it the lock never counts toward switching the PIN off (SAH-38,
        ADR-014 D6: a colleague check never answers pin-not-set because of its own tries); the PIN store could
        not be read or written in time (a timeout, a lost connection or a lock failure) 503 pin-check-failed
        "We could not check the PIN. Try again." (fail closed: nothing recorded, nothing counted, the same answer
        whether the PIN was right or wrong; a database constraint or permission refusal, 23514, 23503 or 42501,
        is a code fault and stays a 500 server error, ADR-014 D5). A
        format-only check is never accepted (AC6). For a medicine that is not high-alert, secondNurseId and
        secondNursePin are ignored (not checked, not stored, the PIN never sent anywhere). For outcome NOT_GIVEN
        (AC8): reasonKey missing or not a NotGivenReasonKey 400 field reasonKey "Choose why the dose is not
        given."; wristband, identityConfirmed, secondNurseId and secondNursePin are not required and are
        ignored. (5) The locked READ COMMITTED transaction (declared explicitly): token role, module, Read-only
        and membership again; the order read, then the bare admission row locked (select id, status from
        ipd.admission ... for no key update; the only lock, shared with vitals, escalation and order actions;
        ADR-011 D6), then the order and the admission, bed and ward read again in new statements; the database
        clock read after the lock; every check of step 3 again (a UHID changed meanwhile by a merge: the deny
        entry and audit are written instead of the dose and the answer is 409 wristband-mismatch); the second
        nurse still an active NURSE and not the caller. Then one dose record: outcome GIVEN, or REFUSED for
        reason PATIENT_REFUSED and HELD for any other reason; recorded by the caller; the second nurse (high-alert
        GIVEN); the normalised wristband text (GIVEN); identityConfirmed (GIVEN); recordedAt = clock_timestamp().
        Clinical event (kind give): GIVEN "Gave <drug name> (<slot time> dose) · identity checked against UHID"
        plus " · second check by <second nurse display name>" for a high-alert medicine (SAH-38, ADR-014 D11,
        security review S3: the record never claims a wristband scan that may not have happened; events written
        before that release keep "· wristband scanned", nothing is rewritten); NOT_GIVEN "Did not give <drug
        name> (<slot time> dose) · <reason label>" (slot time as "8 AM", "8:30 AM"). Audit IPD_DOSE_GIVEN
        (doseId, orderId, admissionId, drugKey, slotAt, outcome GIVEN, highAlert, secondCheckUserId) or
        IPD_DOSE_NOT_GIVEN (doseId, orderId, admissionId, drugKey, slotAt, outcome HELD or REFUSED, reasonKey);
        never the patient's name, the scanned text or the PIN. 201 DoseRecorded. A database refusal (the unique
        order and slot, the insert guard trigger) is a code fault: 500, the whole transaction rolled back.
        Replay (ADR-011 D8): a dose with this clientKey exists for this order with the same slotAt, the same
        outcome (and the same reasonKey for NOT_GIVEN, the same secondNurseId for a high-alert GIVEN) 200
        DoseRecorded with replayed true; no PIN is checked and nothing is written except one
        patient.record_access row (the answer carries the MAR); any of them different 409 client-key-reused
        ("This dose was already recorded with different values. Reload the page."); the clientKey was used for
        another order 400 field clientKey "Reload the page and try again.". Client (AC5, AC7, AC8, AC13): Given
        and Record not given are disabled while the request runs; a slot is shown as recorded only after a 201
        or 200; 201 or 200 GIVEN: toast "<drug name> recorded as given to <patient name>", the Give sheet closes
        and the MAR tab shows mar; NOT_GIVEN: toast "Recorded: <drug name> not given · <reason label>. The
        doctor sees this on the chart.", the sheet closes; 409 wristband-mismatch: the error toast "Wristband
        does not match <patient name>. Stop. Check the patient before giving anything." and under the box (crit,
        alert icon) "Wrong patient. This band is not <patient name>'s." (names from the MAR the client holds);
        400 with fieldErrors: the error toast with detail, and for the PIN errors (wrong-pin, pin-locked,
        pin-not-set, colleague-pin-limit, rate-limit, pin-check-failed) the detail under "Their PIN" (pin-not-set
        here is the second nurse's state: the client never reads GET /api/v1/platform/me/pin for it); SAH-38
        ward line (ADR-014 D10, NEW text T6, client only): for a high-alert medicine, after pin-locked,
        pin-not-set, rate-limit or colleague-pin-limit, and whenever secondNurses is empty, one more line under
        the reason, in the same polite live region: "No second PIN works? Do not give this medicine yet. Choose
        another nurse, or ask the nurse in charge or the clinic owner. Never share a PIN." (not for wrong-pin,
        pin-unavailable or pin-check-failed; hidden when another nurse is chosen in "Checked by" or another
        answer arrives; there is no bypass, no "give anyway" and no paper option); 409 dose-recorded, order-state, order-not-verified,
        dose-not-due, dose-before-start, not-admitted: the error toast with detail, the sheet closes and the MAR
        is reloaded; any other failure (5xx, network): the sheet stays open with everything entered except the
        PIN, which is cleared (the PIN is cleared after every answer). clientKey: made when the Give sheet opens,
        kept while the same request is retried, a new one for a new sheet and after 409 client-key-reused. No
        offline queue. SAH-35 (ADR-012 D4): unchanged when the Give sheet was opened from a Medicine round row
        of the Safety board (every check, status code, event and audit above applies; there is no other way to
        record a dose from the board); the client then, after 201 or 200, shows the same toast, closes the
        sheet, stays on the Safety tab and reloads GET /safety (not the mar of the answer), with focus on the
        Give button of the next row or the panel heading; after 409 dose-recorded, order-state,
        order-not-verified, not-admitted, dose-not-due, dose-before-start, ipd-readonly or 400 on slotAt it
        shows the detail, closes the sheet and reloads GET /safety; any other failure keeps the sheet open as
        above.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DoseInput' }
            examples:
              given:
                summary: Given, not high-alert (8 AM IST dose)
                value: { clientKey: 2b4f6a8c-1d3e-4f50-9a7b-3c5d7e9f1a2b, slotAt: '2026-11-06T02:30:00Z', outcome: GIVEN, wristband: PT-00042, identityConfirmed: true }
              givenHighAlert:
                summary: Given, high-alert with the second nurse's PIN
                value: { clientKey: 4d6f8a0c-2e4a-4b6c-8d0e-1f3a5c7e9b1d, slotAt: '2026-11-06T02:30:00Z', outcome: GIVEN, wristband: PT-00042, identityConfirmed: true, secondNurseId: 5e2f8a1b-9c3d-4e7f-8a6b-1c2d3e4f5a6b, secondNursePin: '4821' }
              notGiven:
                summary: Record not given
                value: { clientKey: 6f8a0c2e-4b6d-4e8f-9a1b-3c5d7e9f1b3d, slotAt: '2026-11-06T02:30:00Z', outcome: NOT_GIVEN, reasonKey: PATIENT_REFUSED }
      responses:
        '200': { description: 'Replay of a dose already recorded with this clientKey and the same values: the stored dose and the MAR now; only the record-access row is written', content: { application/json: { schema: { $ref: '#/components/schemas/DoseRecorded' } } } }
        '201': { description: 'Recorded: the dose and the MAR after the save', content: { application/json: { schema: { $ref: '#/components/schemas/DoseRecorded' } } } }
        '400':
          description: 'validation (fieldErrors on clientKey, slotAt, outcome, wristband, identityConfirmed, secondNurseId, secondNursePin, reasonKey; one bedside message at a time in the order of AC6); or bad-request when the {id} path value is not a UUID (type https://sahaj.in/problems/bad-request, title "Bad Request", detail "The request could not be understood. Check it and try again.", no fieldErrors)'
          content:
            application/problem+json:
              schema: { type: object }
              examples:
                scanFirst: { value: { type: 'https://sahaj.in/problems/validation', title: Check the details, status: 400, detail: Scan the wristband first., fieldErrors: [{ field: wristband, message: Scan the wristband first. }] } }
                sameNurse: { value: { type: 'https://sahaj.in/problems/validation', title: Check the details, status: 400, detail: The second check must be a different nurse., fieldErrors: [{ field: secondNurseId, message: The second check must be a different nurse. }] } }
                malformedId: { summary: 'The {id} path value is not a UUID (components/responses/BadRequest)', value: { type: 'https://sahaj.in/problems/bad-request', title: Bad Request, status: 400, detail: The request could not be understood. Check it and try again. } }
        '401': { $ref: '#/components/responses/Problem' }
        '403':
          description: 'forbidden ("Only nurses and the clinic owner can give medicines."); module-off; wrong-pin and pin-locked (the second nurse''s PIN); outside-scope (SAH-34; components/responses/OutsideScope; checked in step 3 after the 404 checks and again in step 5 after the admission row lock, before any dose, deny entry or audit; a refused request checks no PIN. The second nurse need not be in scope, OQ-34-25)'
          content:
            application/problem+json:
              schema: { type: object }
              examples:
                forbidden: { value: { type: 'https://sahaj.in/problems/forbidden', title: Forbidden, status: 403, detail: Only nurses and the clinic owner can give medicines. } }
                wrongPin: { summary: 'The second nurse''s PIN is wrong (no tries-left count)', value: { type: 'https://sahaj.in/problems/wrong-pin', title: Wrong PIN, status: 403, detail: That PIN is not right. } }
        '404': { $ref: '#/components/responses/Problem', description: 'not-found (order missing or another clinic''s, or the patient record missing)' }
        '409':
          description: 'ipd-readonly; not-admitted; order-not-verified; order-state; dose-before-start; dose-not-due; dose-recorded; wristband-mismatch (the deny entry is written); client-key-reused; pin-not-set (the second nurse has no PIN)'
          content:
            application/problem+json:
              schema: { type: object }
              examples:
                mismatch: { value: { type: 'https://sahaj.in/problems/wristband-mismatch', title: Wristband does not match, status: 409, detail: Wristband does not match this patient. Stop. Check the patient before giving anything. } }
                recorded: { value: { type: 'https://sahaj.in/problems/dose-recorded', title: Dose already recorded, status: 409, detail: This dose is already recorded. } }
                notVerified: { value: { type: 'https://sahaj.in/problems/order-not-verified', title: Order not checked, status: 409, detail: This order is not checked by the pharmacist yet. } }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429':
          description: 'rate-limit (the caller''s colleague PIN limit; retryAfterSeconds); colleague-pin-limit (SAH-38 pair cap; no retryAfterSeconds)'
          content:
            application/problem+json:
              schema: { type: object }
              examples:
                pairLimit: { summary: 'SAH-38: 5 wrong tries of this nurse''s PIN by this caller within 7 days', value: { type: 'https://sahaj.in/problems/colleague-pin-limit', title: Too many wrong PIN tries, status: 429, detail: Too many wrong PIN tries for this nurse. Choose another nurse. } }
        '503':
          description: 'pin-unavailable (SAHAJ_PIN_PEPPER not set); pin-check-failed (SAH-38: the PIN store could not be read or written in time: a timeout, a lost connection or a lock failure only; a database constraint or permission refusal is a code fault, 500, ADR-014 D5). Fail closed: nothing is recorded.'
          content:
            application/problem+json:
              schema: { type: object }
              examples:
                checkFailed: { value: { type: 'https://sahaj.in/problems/pin-check-failed', title: PIN check failed, status: 503, detail: We could not check the PIN. Try again. } }
      x-scope-guard: { kind: order-locked, story: SAH-34 }
  /card-setup:
    get:
      tags: [SAH-37]
      description: 'Clinic setup > Patient card (mockup cfgIpCard, pcBar, Published versions; ADR-015). OWNER, FRONT_DESK, NURSE, DOCTOR (token role and the role re-read from the active membership, both); BILLING, PHARMACIST, VISITING_DOCTOR and every other role 403 forbidden. Check order: role 403 forbidden; module Off 403 module-off; membership re-read 403 forbidden. Allowed in Trial, On and Read-only. Answers the catalogue, the Sahaj standard setup, the templates and the live setup for every allowed role; draft and versions only for OWNER (absent, not null, for the other roles, which never see an unpublished draft: AC10). A clinic that never published gets the standard setup as v1; reading never creates a row. A stored setup is repaired before it is answered (ADR-015 D3: locked items put back, unknown keys dropped, new catalogue items added); the stored row is not rewritten. Writes nothing, no record-access row (no patient data). The Overview tile line "<Layout> · Sahaj default|customized · v<n>[ · draft]" comes from live and draft.'
      responses:
        '200': { description: The card setup, content: { application/json: { schema: { $ref: '#/components/schemas/CardSetupView' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden (the shared forbidden problem: title "Not allowed", detail "You do not have access to this.") or module-off' }
  /card-setup/draft:
    put:
      tags: [SAH-37]
      description: 'Save draft (mockup pcsave). OWNER only (token role and the membership role re-read in the transaction; a demoted owner 403 forbidden, nothing stored). Check order: role 403 forbidden; module Off 403 module-off; body 400 validation (every rule of CardSetup, all field errors together; detail is the first message; nothing stored); IPD Read-only 409 ipd-readonly; then, under the clinic IPD advisory lock (ADR-015 D5), 409 card-setup-changed when the live version is not baseVersion, or a draft exists and its revision is not draftRevision, or no draft exists and draftRevision is not null. When the setup (canonical form) equals the live setup, any stored draft is removed, no history line is written and the answer has draft null (AC8: no draft pill). When the setup (canonical form) equals the stored draft, the save changes nothing: the revision stays, no history line is written and the answer carries the stored draft unchanged. Otherwise the draft is stored with a new revision (CardDraft.revision: an opaque clock-based token that changes on every save that changes the draft and never repeats for the clinic, also after a Discard or a Publish; DEC-028 addendum), savedAt and savedBy, and one Clinic setup change-history line is written in the same transaction (platform.api AuditLog, action IPD_CARD_DRAFT_SAVED, entity type IPD_CONFIG; after: liveVersion, draftRevision, changedParts; never labels or patient data). Toast (client): "Draft saved. Staff still see the live card until you publish."'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CardSetupWrite' } } }
      responses:
        '200': { description: 'The setup view after the save (draft with the new revision, or null)', content: { application/json: { schema: { $ref: '#/components/schemas/CardSetupView' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation (fieldErrors; rules V1 to V15 and messages in CardSetup and docs/architecture/SAH-37-patient-card-setup.md section 4; errors sorted by rule number, body order within a rule). V15 (DEC-032 G-4): a field label, compared after NFC, trimming, collapsing inner spaces and case folding, may not equal the standard name of any other of the 25 catalogue fields or the label of a field placed before it in the body (equal to the field''s own standard name is allowed; it is stored as ""). Field setup.sections[i].fields[j].label, message "This name is already used by another field." (fixed text, the typed label is never echoed; at most one error per label path, V15 is not reported for a label that already fails V7, V10, V11, V12 or V14); or bad-request for a body that cannot be read (components/responses/BadRequest)' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden (the shared forbidden problem: title "Not allowed", detail "You do not have access to this."; the same text whether the token role or the membership re-read refuses; no text of its own) or module-off' }
        '409':
          description: 'ipd-readonly ("IPD is read-only. Nothing can be changed."); card-setup-changed'
          content:
            application/problem+json:
              schema: { type: object }
              examples:
                changed: { value: { type: 'https://sahaj.in/problems/card-setup-changed', title: Card setup changed, status: 409, detail: The card setup was changed by someone else. Reload to see it. } }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
    delete:
      tags: [SAH-37]
      description: 'Discard draft (mockup pcdiscard). OWNER only (membership re-read). Check order: role 403 forbidden; module Off 403 module-off; draftRevision missing or not an integer 400 bad-request; Read-only 409 ipd-readonly; under the clinic IPD advisory lock: a draft exists and its revision is not draftRevision 409 card-setup-changed (another owner saved a newer draft; it is not discarded). No draft: 200, nothing to do. Otherwise the draft row is deleted; the live setup is unchanged. No history line (OQ-37-9, as the mockup cfgLog). Toast (client): "Draft discarded. The live card is unchanged."'
      parameters:
        - { name: draftRevision, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 }, description: 'The draft revision the editor loaded (CardDraft.revision, an opaque token), sent back unchanged.' }
      responses:
        '200': { description: 'The setup view, draft null', content: { application/json: { schema: { $ref: '#/components/schemas/CardSetupView' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden (the shared forbidden problem: title "Not allowed", detail "You do not have access to this.") or module-off' }
        '409': { $ref: '#/components/responses/Problem', description: 'ipd-readonly; card-setup-changed ("The card setup was changed by someone else. Reload to see it.")' }
  /card-setup/publish:
    post:
      tags: [SAH-37]
      description: 'Publish (mockup pcpublish). OWNER only (membership re-read). The body carries the editor''s setup (saved or not) and the tokens it loaded. Check order: role 403 forbidden; module Off 403 module-off; body 400 validation (as PUT /card-setup/draft); Read-only 409 ipd-readonly; under the clinic IPD advisory lock: the tokens as PUT /card-setup/draft 409 card-setup-changed; the setup (canonical form) equals the live setup 409 card-setup-unchanged ("There are no changes to publish."). Then, in one transaction: insert version live + 1 (2 for the first publish) with the canonical setup, isStandard, changedParts, publishedBy and publishedAt; delete the draft; one Clinic setup change-history line (AuditLog IPD_CARD_PUBLISHED, entity type IPD_CONFIG; before: version n - 1; after: version n, changedParts, isStandard, factsOn = the field keys of the sensitive facts the published card switches on (diagnosis, the vitals fields, mobile), keys only, never a label or patient data). A unique-index clash on the version (a second publish that slipped past the lock) answers 409 card-setup-changed, never 500. A double tap makes one version: the second request carries the old baseVersion and gets 409 (AC8). Staff see the new card at their next list reload, at most 60 seconds (OQ-37-7); no push, no notification. Toast (client): "Patient card v<n> is live for every role. <Changed parts> updated."'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CardSetupWrite' } } }
      responses:
        '200': { description: 'The setup view after the publish (live is the new version, draft null)', content: { application/json: { schema: { $ref: '#/components/schemas/CardSetupView' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation (fieldErrors; rules V1 to V15 as PUT /card-setup/draft, including V15: a field label that equals, after NFC, trimming, collapsing inner spaces and case folding, the standard name of any other catalogue field or the label of a field placed before it, field setup.sections[i].fields[j].label, message "This name is already used by another field."); or bad-request for a body that cannot be read (components/responses/BadRequest)' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden (the shared forbidden problem: title "Not allowed", detail "You do not have access to this."; the same text whether the token role or the membership re-read refuses; no text of its own) or module-off' }
        '409':
          description: 'ipd-readonly; card-setup-changed; card-setup-unchanged'
          content:
            application/problem+json:
              schema: { type: object }
              examples:
                changed: { value: { type: 'https://sahaj.in/problems/card-setup-changed', title: Card setup changed, status: 409, detail: The card setup was changed by someone else. Reload to see it. } }
                unchanged: { value: { type: 'https://sahaj.in/problems/card-setup-unchanged', title: Nothing to publish, status: 409, detail: There are no changes to publish. } }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /emergency-access/patients:
    get:
      tags: [SAH-34]
      summary: Emergency access picker (34E)
      description: >-
        The select "Patient" of the sheet "Emergency access" (mockup sfbg; ADR-017 D4; design note section 4).
        Only for a caller whose scope is narrower than all: token role and membership role NURSE and
        AdmissionList.scope.kind not ALL (the clinic switch is on). Every other caller, also a NURSE while the
        switch is off, 403 forbidden "Emergency access is only for staff who see some wards."; VISITING_DOCTOR
        keeps 403 forbidden until story 34D. The operation is reachable by every IPD token role (OWNER, DOCTOR,
        VISITING_DOCTOR, NURSE, FRONT_DESK, BILLING, PHARMACIST, COUNSELLOR) so that each one that is not a NURSE
        gets this same fixed sentence (problem type forbidden, title "Not allowed") before anything is read; a
        token without an IPD role gets the generic 403 forbidden. The same applies to POST /emergency-access.
        Check order: role 403 forbidden; module Off 403 module-off (the role check comes first, the IPD order
        kept by ADR-017 D3; both are fixed-text 403s; SAH-34 security review finding 9, decided 10 Nov 2026, design
        note section 1.2); then one REPEATABLE READ transaction (not read-only, because it writes the audit row
        below): membership re-read (NURSE, else 403 forbidden); scope build (kind ALL 403 forbidden). Allowed in
        Trial, On and Read-only (OQ-34-29). Lists every ADMITTED admission
        of the clinic outside the caller's scope (bed not in her live wards and no active grant of hers), with
        identity only: name, bed code, UHID and the admission id (option P1, as the mockup; a directory of
        admitted patients before a reason is given, listed for the security review and the privacy register,
        OQ-34-11). No diagnosis, allergy, vitals, notes or bill. Ordered by bed code (code-point order; the
        mockup gives no order). Not paged (bounded by the bed limit). Writes exactly one platform audit event per
        successful read (SAH-34 security review finding 1, decided 10 Nov 2026): action
        IPD_EMERGENCY_ACCESS_PICKER_VIEWED, entity type IPD_EMERGENCY_ACCESS, entity id null, actor the caller's
        user id, before null, after {"count": N} where N is the number of items returned (0 included). No
        admission id, patient id, name, UHID or bed code is in the audit row. It is written at the end of the
        same transaction, after the list is built; if it fails the request fails (500) and no list is returned.
        A refused request (401, 403) writes no audit row. No record-access row and no clinical event; the names
        are never logged. Empty items: the sheet shows "You can already see every admitted
        patient." and only Cancel. The client shows each option as "<patientName> · bed <bedCode> · <uhid>"
        (UHID in place of the mockup's MRN, OQ-36-8).
      responses:
        '200': { description: 'Out-of-scope admitted patients and the reasons', content: { application/json: { schema: { $ref: '#/components/schemas/EmergencyAccessPicker' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden (not a NURSE, or the caller''s scope is all) or module-off' }
      x-scope-guard: { kind: grant, story: SAH-34, note: 'Lists the complement of the caller''s scope; identity fields only.' }
  /emergency-access:
    get:
      tags: [SAH-34]
      summary: Owner's list of emergency access to review (34F)
      description: >-
        The next pages of the panel "Emergency access to review" (mockup ipSafety bgRow) for "Show 25 more"
        (OQ-34-32; contract wording). The first page comes with GET /safety (SafetyBoard.emergencyAccess) in the
        board's transaction. OWNER only (token role and membership role); every other role 403 forbidden. Check
        order: role 403 forbidden; module Off 403 module-off; limit or cursor invalid 400 (field limit or cursor,
        "Reload the page and try again."); one read-only REPEATABLE READ transaction with the membership re-read
        (OWNER, else 403 forbidden). Allowed in Trial, On and Read-only. Lists every grant of the clinic with no
        review yet, also after it expired, after the patient was discharged and after the grantee became inactive
        (DEC-031 deviation, AC 67): opened_at ascending (oldest first), then id; keyset paging; waiting is always
        the full count. Names (staff, patient) are read at display time; bedCode is the bed at the time of the
        grant. Writes nothing: no record-access row (DEC-015 rule for the board), no audit; never logged.
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 25, default: 25 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' }, description: 'Opaque; EmergencyAccessReviewPage.nextCursor of the previous page. Absent for the first page.' }
      responses:
        '200': { description: One page of unreviewed grants, content: { application/json: { schema: { $ref: '#/components/schemas/EmergencyAccessReviewPage' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'limit or cursor invalid (field limit or cursor, "Reload the page and try again.")' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden (token role or membership role not OWNER) or module-off' }
      x-scope-guard: { kind: grant-owner, story: SAH-34, note: 'OWNER only; owner scope is all.' }
    post:
      tags: [SAH-34]
      summary: Open emergency access for 30 minutes (34E)
      description: >-
        "Open for 30 minutes" (mockup sfbgok; ADR-017 D4, D6). Same callers as GET /emergency-access/patients
        (NURSE with a scope narrower than all); OWNER, DOCTOR, FRONT_DESK, BILLING, PHARMACIST and a NURSE while
        the switch is off 403 forbidden "Emergency access is only for staff who see some wards."; VISITING_DOCTOR
        403 until 34D. Allowed in Trial, On and Read-only (OQ-34-29). Check order: role 403 forbidden; module Off
        403 module-off (role first, as GET /emergency-access/patients; ADR-017 D3, design note section 1.2); body 400 problem type validation with fieldErrors, every error together in the order
        admissionId, reasonKey, confirmed (admissionId missing or not a UUID "Choose a patient."; reasonKey
        missing or not an EmergencyAccessReasonKey "Choose a reason for emergency access."; confirmed not the JSON
        value true "Tick the box to confirm this access is recorded."); nothing stored. Then one READ COMMITTED
        transaction (declared explicitly): membership re-read (NURSE, else 403 forbidden); scope build (kind ALL
        403 forbidden); the bare admission row locked (select id, status from ipd.admission ... for no key update;
        the lock every grant of the admission takes, so two taps or two requests make at most one grant per
        user); admission not found, another clinic's or not ADMITTED 404 not-found ("This patient is not admitted
        any more."); the admission is already in the caller's scope (its bed is in her live wards, or she has an
        active grant on it: same membership, expires_at later than clock_timestamp()) 409 already-in-scope ("This
        patient is already in your list."), no row written and the existing expiry unchanged. Then, in the same
        transaction: one ipd.emergency_access_grant row (admission, the bed now, user, membership, membership
        role, reasonKey; opened_at and expires_at = opened_at + 30 minutes stamped by the database trigger with
        clock_timestamp(), never sent and never changeable); the clinical event (kind bg) "Emergency access opened
        · <reason label>" with the grant id, actor = the caller, admission set (no name, no free text); one
        patient.record_access row through patient.api PatientAccessPort (R1, ids only); the audit
        IPD_EMERGENCY_ACCESS_OPENED (entity type IPD_EMERGENCY_ACCESS, entity id the grant id; grantId,
        admissionId, reasonKey, expiresAt). Any failure rolls back all of
        them: no grant exists. No extension, no early end, no edit, no delete (no endpoint). The grant adds the
        admission to the caller's scope for her own role's endpoints until expiresAt, the discharge, or a change
        of her role or membership, whichever comes first; it is checked on every request against the database
        clock. Application log: ids, tenantId, requestId and the reason key only. Client: the button is
        disabled while the request runs; on 201 the sheet closes, the list search is cleared, the list reloads
        and the toast reads "Emergency access to <patientName> for 30 minutes. The owner will see this on the
        Safety board." (DEC-031 deviation; never "The owner has been told."); on 409 already-in-scope the sheet
        closes and the list reloads; on any other failure the sheet stays open with the choices kept and shows the
        detail, or "We could not open emergency access. Try again." for a 5xx or network failure; nothing is
        queued offline.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmergencyAccessInput' }
            examples:
              open: { value: { admissionId: 6c1b8e8e-0d0a-4b8e-9a52-7f0f3c1d2e33, reasonKey: DETERIORATING, confirmed: true } }
      responses:
        '201': { description: 'Opened: the grant', content: { application/json: { schema: { $ref: '#/components/schemas/EmergencyAccessGrant' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation (fieldErrors on admissionId, reasonKey, confirmed); or malformed-request ("Request could not be read", "The request body is missing or is not valid JSON.", no fieldErrors) for a body that cannot be read or that carries a field not in EmergencyAccessInput (additionalProperties false; the name is never echoed)' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden ("Emergency access is only for staff who see some wards.") or module-off' }
        '404': { $ref: '#/components/responses/Problem', description: 'not-found (admission missing, another clinic''s, or not admitted)' }
        '409':
          description: 'already-in-scope (the patient is in the caller''s wards, or she already has active emergency access to the patient)'
          content:
            application/problem+json:
              schema: { type: object }
              examples:
                inScope: { value: { type: 'https://sahaj.in/problems/already-in-scope', title: Already in your list, status: 409, detail: This patient is already in your list. } }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
      x-scope-guard: { kind: grant, story: SAH-34 }
  /emergency-access/{id}/review:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 'The grant id (EmergencyAccessReviewRow.grantId).' }
    post:
      tags: [SAH-34]
      summary: Mark an emergency access as reviewed (34F)
      description: >-
        "Mark reviewed" (mockup sfbgrev; ADR-017 D5, D6). OWNER only; every other role 403 forbidden. No body:
        the review is the only change a grant can ever get, so a guarded update replaces a version token (the
        BA's {version} proposal is not used). Allowed in Trial, On and Read-only (it records oversight;
        OQ-34-29). Check order: role 403 forbidden; module Off 403 module-off; an {id} that is not a UUID 400
        bad-request. Then one READ COMMITTED transaction: membership re-read (OWNER, else 403 forbidden); grant
        not found or another clinic's 404 not-found; the grant was opened by the caller (user id) 403 forbidden
        "You cannot review your own emergency access."; then update ... set reviewed_by = the caller where id =
        :id and reviewed_at is null (reviewed_at stamped by the database trigger with clock_timestamp(), version
        + 1); no row updated 409 already-reviewed ("Already reviewed."; two owners or a double tap), nothing
        written. Then the clinical event (kind bg) "Reviewed emergency access" with the grant id, actor = the
        owner, admission set (no staff or patient name: the trail shows the grantee by reading the grant at
        display time, ClinicalEvent.grantStaffName) and the audit IPD_EMERGENCY_ACCESS_REVIEWED (entity type
        IPD_EMERGENCY_ACCESS, entity id the grant id; grantId, admissionId). The review fields can never be changed or cleared (database trigger). No comment, outcome
        or history (not in the mockup, AC 77). Client: the button is disabled while the request runs; on 200 the
        toast "Marked as reviewed", the row leaves the panel and the board reloads; on 409 already-reviewed the
        notice "Already reviewed." and the panel reloads; on any other failure the row stays and the error is
        shown.
      responses:
        '200': { description: Reviewed, content: { application/json: { schema: { $ref: '#/components/schemas/EmergencyAccessReviewResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden (not OWNER; or the owner opened this grant: "You cannot review your own emergency access.") or module-off' }
        '404': { $ref: '#/components/responses/Problem', description: 'not-found (grant missing or another clinic''s)' }
        '409':
          description: 'already-reviewed'
          content:
            application/problem+json:
              schema: { type: object }
              examples:
                reviewed: { value: { type: 'https://sahaj.in/problems/already-reviewed', title: Already reviewed, status: 409, detail: Already reviewed. } }
        '413': { $ref: '#/components/responses/PayloadTooLarge', description: 'A body sent to this operation, which declares none, over the size limit.' }
      x-scope-guard: { kind: grant-owner, story: SAH-34 }
  /ward-assignments:
    get:
      tags: [SAH-34]
      summary: Nurse ward assignments and the clinic switch (34A data part)
      x-needs-human: 'The nurse-to-ward screen is not in the mockup yet (DEC-031 item 2, OQ-34-1). This endpoint is the data part of story 34A, built with 34B (OQ-34-35); no screen calls it until the human adds the screen to docs/design/mockup and the screen map. Names and texts here are contract proposals.'
      description: >-
        OWNER only (token role and membership role); every other role 403 forbidden. Check order: role 403
        forbidden; module Off 403 module-off; one read-only transaction with the membership re-read (OWNER).
        Allowed in Trial, On and Read-only. Answers the switch "Nurses see only their wards", every ward of the
        clinic (in the order of IpdLayout.wards) with its live nurses, every active NURSE member with the wards
        she has, and the count of active nurses with no ward. Nurse names through platform.api TeamMemberPort
        (active NURSE members only; an assignment of an inactive membership is not listed and counts for
        nothing). Writes nothing; never logged.
      responses:
        '200': { description: Assignments and the switch, content: { application/json: { schema: { $ref: '#/components/schemas/WardAssignments' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden or module-off' }
  /ward-assignments/{wardId}:
    parameters:
      - { name: wardId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [SAH-34]
      summary: Set the nurses of one ward (34A data part)
      x-needs-human: 'The nurse-to-ward screen is not in the mockup yet (DEC-031 item 2, OQ-34-1). Data part of 34A only (OQ-34-35).'
      description: >-
        OWNER only. The body is the whole new set of live nurses of the ward (several nurses per ward; a nurse may
        be in several wards). Check order: role 403 forbidden; module Off 403 module-off; body 400 problem type
        validation (membershipIds missing, more than 100, not UUIDs or repeated: field membershipIds "Choose
        nurses from the list."); Read-only 409 ipd-readonly; then one READ COMMITTED transaction under the clinic
        IPD advisory lock: membership re-read (OWNER); ward not found or another clinic's 404 not-found; every id
        must be an active NURSE member of the clinic (platform.api TeamMemberPort), else 400 field membershipIds
        "Choose nurses from the list.". Live rows of the ward not in the set get removed_at (database clock) and
        removed_by; ids not yet live get a new row (assigned_at by the database clock, assigned_by); rows are
        never deleted. The same set as now: 200, nothing written. Otherwise audit IPD_WARD_ASSIGNMENT_CHANGED
        (entity type IPD_WARD_ASSIGNMENT, entity id the ward id; wardId, added and removed membership ids; never
        names). Removing a nurse's last ward while the switch is
        on is allowed: she then sees no patient (fail closed) and nursesWithoutWard in the answer shows it. Takes
        effect at each nurse's next request.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WardAssignmentInput' }
      responses:
        '200': { description: 'Assignments and the switch after the change', content: { application/json: { schema: { $ref: '#/components/schemas/WardAssignments' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation (field membershipIds); or malformed-request ("Request could not be read", "The request body is missing or is not valid JSON.", no fieldErrors) for a body that cannot be read or that carries a field not in WardAssignmentInput (additionalProperties false; the name is never echoed); or bad-request when the {wardId} path value is not a UUID (components/responses/BadRequest)' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden or module-off' }
        '404': { $ref: '#/components/responses/Problem', description: 'not-found (ward missing or another clinic''s)' }
        '409': { $ref: '#/components/responses/Problem', description: 'ipd-readonly' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /ward-scope:
    put:
      tags: [SAH-34]
      summary: Switch "Nurses see only their wards" on or off (34A data part)
      x-needs-human: 'The switch has no screen in the mockup yet (DEC-031 item 2). Data part of 34A only (OQ-34-35). The label "Nurses see only their wards" is from ADR-016 M2, not from the mockup.'
      description: >-
        OWNER only. Per-clinic switch (DEC-031 M2), stored in ipd.config.nurse_ward_scope, off by default (also
        when the clinic has no ipd.config row). Check order: role 403 forbidden; module Off 403 module-off; body
        400 (on missing or not a JSON boolean: field on "Choose on or off"); Read-only 409 ipd-readonly; then
        one READ COMMITTED transaction under the clinic IPD advisory lock: membership re-read (OWNER); on = true
        while one or more active NURSE members have no live ward 409 nurse-without-ward ("Assign a ward to every
        nurse before you switch this on.", OQ-34-21; nothing stored). This check runs on every request with on =
        true, also when the switch is already on: a repeated "on" while a nurse has no ward answers 409
        nurse-without-ward (the switch stays on and nothing is written), so the answer always tells the owner
        that a nurse sees no patient. on = false is never refused by this check. Upserts the setting; audit
        IPD_WARD_SCOPE_CHANGED (entity type IPD_CONFIG, entity id null; before and after values only) when the
        value changed; the same value with the check passed: 200, nothing written.
        Applies at once: every user's next request builds the scope from it (OQ-34-5; no publish step, C1).
        Go-live condition for the human: the clinical sign-off owner (OQ-30-6) reads ADR-016 section 8 before any
        clinic switches it on (OQ-34-31).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WardScopeInput' }
      responses:
        '200': { description: 'Assignments and the switch after the change', content: { application/json: { schema: { $ref: '#/components/schemas/WardAssignments' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation (field on); or malformed-request ("Request could not be read", "The request body is missing or is not valid JSON.", no fieldErrors) for a body that cannot be read or that carries a field not in WardScopeInput (additionalProperties false; the name is never echoed)' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden or module-off' }
        '409':
          description: 'ipd-readonly; nurse-without-ward'
          content:
            application/problem+json:
              schema: { type: object }
              examples:
                nurseWithoutWard: { value: { type: 'https://sahaj.in/problems/nurse-without-ward', title: Nurse without a ward, status: 409, detail: Assign a ward to every nurse before you switch this on. } }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status]
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
              fieldErrors:
                type: array
                items: { type: object, required: [field, message], properties: { field: { type: string }, message: { type: string } } }
    BadRequest:
      description: 'bad-request: a path value is not of its declared type (an {id} that is not a UUID). Spring''s own text is replaced by a fixed sentence (ProblemExceptionHandler); the submitted value is never echoed; no fieldErrors.'
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status]
            properties:
              type: { type: string, const: 'https://sahaj.in/problems/bad-request' }
              title: { type: string, const: Bad Request }
              status: { type: integer, const: 400 }
              detail: { type: string, const: The request could not be understood. Check it and try again. }
          examples:
            malformedId: { value: { type: 'https://sahaj.in/problems/bad-request', title: Bad Request, status: 400, detail: The request could not be understood. Check it and try again. } }
    PayloadTooLarge:
      description: 'payload-too-large: the request body is over the size limit (RequestBodySizeLimitFilter): 64 KB for a signed-in user (property sahaj.request-body.max-bytes, never below 4 KB; the detail names the configured limit, in KB or, when not a whole number of KB, in bytes), 4 KB for any request without a signed-in user. The body is not read past the limit and nothing is saved.'
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status, detail]
            properties:
              type: { type: string, const: 'https://sahaj.in/problems/payload-too-large' }
              title: { type: string, const: Request too large }
              status: { type: integer, const: 413 }
              detail: { type: string, examples: [The request body must be 64 KB or smaller., The request body must be 4 KB or smaller.] }
          examples:
            signedIn: { value: { type: 'https://sahaj.in/problems/payload-too-large', title: Request too large, status: 413, detail: The request body must be 64 KB or smaller. } }
            notSignedIn: { value: { type: 'https://sahaj.in/problems/payload-too-large', title: Request too large, status: 413, detail: The request body must be 4 KB or smaller. } }
    OutsideScope:
      description: 'SAH-34 (ADR-017 D2, DEC-031 E2). outside-scope: the admission (directly, or through the order or escalation of the path) exists in the caller''s clinic but is not in the caller''s patient scope (not in her wards, and no active emergency access grant of hers counted against the database clock). Answered only to a role that may use the operation, after the 404 checks. The body never carries a patient name, bed, ward, UHID or admission data. Nothing is written: no row, no clinical event, no audit, no record-access row (OQ-34-24); one INFO log line with tenantId, requestId, route, userId and admissionId. Client (AC 38, 39; SAH-40 pattern): close the sheet, clear that patient''s clinical data from the screen and memory, show "This patient is not in your wards." ("Your emergency access to this patient has ended." when the row carried AdmittedPatientRow.emergencyAccess; plus "Nothing was saved." after a save), and reload the list; the page is not locked.'
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status, detail]
            properties:
              type: { type: string, const: 'https://sahaj.in/problems/outside-scope' }
              title: { type: string, const: Outside your scope }
              status: { type: integer, const: 403 }
              detail: { type: string, const: This patient is not in your wards. }
          examples:
            outsideScope: { value: { type: 'https://sahaj.in/problems/outside-scope', title: Outside your scope, status: 403, detail: This patient is not in your wards. } }
  schemas:
    CategoryKey:
      type: string
      enum: [gen, semi, pvt, icu]
    Bed:
      type: object
      required: [id, code, categoryKey, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        categoryKey: { $ref: '#/components/schemas/CategoryKey' }
        status: { type: string, enum: [free, occ, clean, blk, res], description: Always free in SAH-22. }
    Room:
      type: object
      required: [id, name, beds]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        beds: { type: array, items: { $ref: '#/components/schemas/Bed' } }
    Ward:
      type: object
      required: [id, name, station, bedCount, rooms, beds]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        station: { type: string }
        bedCount: { type: integer }
        rooms: { type: array, items: { $ref: '#/components/schemas/Room' }, description: Rooms with their beds (always returned; the page hides them when roomLevel is off). }
        beds: { type: array, items: { $ref: '#/components/schemas/Bed' }, description: 'All beds of the ward (in rooms or not), for the flat view.' }
    Category:
      type: object
      required: [key, name, ratePaise, multiplier, beds]
      properties:
        key: { $ref: '#/components/schemas/CategoryKey' }
        name: { type: string, description: 'General, Semi-private, Private or ICU.' }
        ratePaise: { type: integer }
        multiplier: { type: number }
        beds: { type: integer, description: Beds currently in this category. }
    IpdLayout:
      type: object
      required: [state, roomLevel, bedLimit, bedCount, wards, categories, charges]
      properties:
        state: { type: string, enum: [trial, on, readonly], description: Never off (off answers 403). }
        roomLevel: { type: boolean }
        bedLimit: { type: integer }
        bedCount: { type: integer }
        wards: { type: array, items: { $ref: '#/components/schemas/Ward' } }
        categories: { type: array, items: { $ref: '#/components/schemas/Category' } }
        charges:
          type: object
          required: [bedDayCut, nursingPaise, visitPaise]
          properties:
            bedDayCut: { type: string, enum: [midnight, 24h] }
            nursingPaise: { type: integer }
            visitPaise: { type: integer }
    PayMode:
      type: string
      enum: [Cash, UPI, Card]
    AdmissionType:
      type: string
      enum: [planned, emergency, daycare, maternity]
    Payer:
      type: string
      enum: [Self, Insurance, Corporate]
    AdmissionRulesInput:
      type: object
      required: [depositPaise, categoryAddPaise, emergencyWithoutDeposit, alertPercent]
      properties:
        depositPaise:
          type: object
          required: [planned, emergency, daycare, maternity]
          properties:
            planned: { type: integer, minimum: 0, maximum: 100000000 }
            emergency: { type: integer, minimum: 0, maximum: 100000000 }
            daycare: { type: integer, minimum: 0, maximum: 100000000 }
            maternity: { type: integer, minimum: 0, maximum: 100000000 }
        categoryAddPaise:
          type: object
          required: [gen, semi, pvt, icu]
          properties:
            gen: { type: integer, minimum: 0, maximum: 100000000 }
            semi: { type: integer, minimum: 0, maximum: 100000000 }
            pvt: { type: integer, minimum: 0, maximum: 100000000 }
            icu: { type: integer, minimum: 0, maximum: 100000000 }
        emergencyWithoutDeposit: { type: boolean }
        alertPercent: { type: integer, minimum: 50, maximum: 100, multipleOf: 5 }
    AdmissionRules:
      allOf:
        - $ref: '#/components/schemas/AdmissionRulesInput'
        - type: object
          required: [confirmed]
          properties:
            confirmed: { type: boolean }
    AdmissionOptions:
      type: object
      required: [doctors, beds, rules]
      properties:
        doctors: { type: array, items: { type: object, required: [membershipId, name], properties: { membershipId: { type: string, format: uuid }, name: { type: string } } } }
        beds:
          type: array
          description: 'Free beds only. Server sends them ordered by category (General, Semi-private, Private, ICU), then room, then code (SAH-26); the client keeps that order within a category.'
          items:
            type: object
            required: [id, code, wardName, categoryKey, categoryName, ratePaise]
            properties:
              id: { type: string, format: uuid }
              code: { type: string }
              wardName: { type: string }
              categoryKey: { $ref: '#/components/schemas/CategoryKey' }
              categoryName: { type: string }
              ratePaise: { type: integer, description: Bed charge a day of the category. }
        rules: { $ref: '#/components/schemas/AdmissionRules' }
        emergencyCase: { oneOf: [{ $ref: '#/components/schemas/EmergencyHandoff' }, { type: 'null' }], description: 'SAH-28. Set when the request had emergencyCaseId; null or absent otherwise.' }
    AdmissionRequestRow:
      type: object
      description: '0.3.0 (SAH-67-3, ADR-025 D10). One waiting request. kind EMR: a doctor''s request from the EMR (requestId set); COURSE_SITTING: a planned day-care or IPD sitting of a treatment course (sittingId set). On screen only; never logged.'
      required: [kind, requestId, sittingId, emergencyCaseId, patientId, patientName, age, sex, admissionType, plannedStayDays, doctorName, diagnoses, note, requestedAt, openAdmission]
      properties:
        kind: { type: string, enum: [EMR, COURSE_SITTING] }
        requestId: { type: [string, 'null'], format: uuid }
        sittingId: { type: [string, 'null'], format: uuid }
        courseNo: { type: [string, 'null'], description: 'COURSE_SITTING: "TC-0412".' }
        emergencyCaseId: { type: [string, 'null'], format: uuid, description: 'Set for a request from an Emergency assessment; Admit sends it as emergencyCaseId.' }
        patientId: { type: [string, 'null'], format: uuid, description: 'Null for an Emergency case not yet admitted.' }
        patientName: { type: string, description: 'Or the Emergency case''s display name.' }
        age: { type: [integer, 'null'] }
        sex: { type: [string, 'null'], enum: [F, M, O, null] }
        admissionType: { $ref: '#/components/schemas/AdmissionType' }
        plannedStayDays: { type: [integer, 'null'], description: '"IPD <n> days".' }
        doctorName: { type: string }
        diagnoses: { type: [string, 'null'], maxLength: 200, description: 'Pre-fills the sheet''s reason. Clinical text. 0.3.1 (H33): present for OWNER and NURSE; always null for FRONT_DESK.' }
        note: { type: [string, 'null'], maxLength: 300, description: 'The doctor''s note for the ward. Clinical text. 0.3.1 (H33): present for OWNER and NURSE; always null for FRONT_DESK.' }
        requestedAt: { type: string, format: date-time }
        openAdmission: { type: [object, 'null'], required: [admissionId, ipNumber], properties: { admissionId: { type: string, format: uuid }, ipNumber: { type: string } }, description: '"Already admitted · <IP number>"; no Admit button.' }
    AdmissionRequestList:
      type: object
      required: [items, canAdmit]
      properties:
        canAdmit: { type: boolean, description: 'IPD Trial or On and an admit role; false in Read-only.' }
        items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/AdmissionRequestRow' }, description: 'Newest first. Empty: "No admission requests."' }
    AdmissionInput:
      type: object
      required: [patientId, doctorMembershipId, admissionType, bedId, payer, consentSigned]
      properties:
        patientId: { type: string, format: uuid }
        doctorMembershipId: { type: string, format: uuid }
        admissionType: { $ref: '#/components/schemas/AdmissionType' }
        bedId: { type: string, format: uuid }
        reason: { type: [string, 'null'], maxLength: 200, description: Clinical text; never logged or audited. Blank is stored as Under evaluation. }
        payer: { $ref: '#/components/schemas/Payer' }
        depositPaise: { type: [integer, 'null'], minimum: 0, maximum: 100000000, description: Whole rupees. Zero or null for no deposit. }
        depositMode: { oneOf: [{ $ref: '#/components/schemas/PayMode' }, { type: 'null' }], description: Required when depositPaise > 0. }
        consentSigned: { type: boolean }
        emergencyCaseId: { type: [string, 'null'], format: uuid, description: 'SAH-28. Optional. The emergency case this admission comes from: the admission gets source EMERGENCY and the case becomes ADMITTED in the same transaction (409 case-closed when it is no longer in the queue). Missing or null = an admission from the front desk (source DIRECT).' }
        admissionRequestId: { type: [string, 'null'], format: uuid, description: '0.3.0 (SAH-67-3, ADR-025 D10). Optional. The open EMR admission request this admission completes. It must be OPEN and for this patient (or for emergencyCaseId when the request came from an Emergency case), else 409 admission-request-not-available ("This request was already admitted or changed. Reload the list.") and nothing is written. Whether sent or not, every OPEN request of this patient, and of emergencyCaseId when sent, is marked ADMITTED with this admission in the same transaction (the doctor''s button then shows "Admitted · <IP number>").' }
        treatmentCourseSittingId: { type: [string, 'null'], format: uuid, description: '0.2.0 (SAH-58-2, ADR-022 D12). Optional. The planned day-care or IPD sitting of a treatment course this admission does ("Admit now"). The sitting must belong to the same patient (409 course-sitting-not-available otherwise; nothing written). The earmarked course credit is carried in as a deposit with source COURSE; depositPaise is a further desk deposit as today.' }
    DepositState:
      type: string
      enum: [OK, DUE, NOT_NEEDED]
      description: OK when the payer is Self and the deposit meets the minimum; DUE when Self and below it; NOT_NEEDED when the payer is Insurance or Corporate.
    AdmissionRow:
      type: object
      required: [id, ipNumber, patientId, patientName, age, sex, doctorName, bedCode, categoryName, wardName, admissionType, payer, dayNumber, depositPaise, depositState, admittedAt, runningBillPaise, depositLow, goingHomeToday]
      properties:
        id: { type: string, format: uuid }
        ipNumber: { type: string }
        patientId: { type: string, format: uuid }
        patientName: { type: string }
        age: { type: [integer, 'null'] }
        sex: { type: [string, 'null'] }
        doctorName: { type: string }
        bedCode: { type: string }
        categoryName: { type: string }
        wardName: { type: string }
        admissionType: { $ref: '#/components/schemas/AdmissionType' }
        payer: { $ref: '#/components/schemas/Payer' }
        dayNumber: { type: integer, description: 'Billed bed days (SAH-25 fix): equals bill.billDays, so the list, tile and sheet show one number. 1 on the admission day; counts Asia/Kolkata calendar days with the midnight cut, whole 24 hours with the 24h cut.' }
        depositPaise: { type: integer, description: Total of deposits. }
        minimumDepositPaise: { type: integer }
        runningBillPaise: { type: integer, description: SAH-25. Total of the running bill. }
        depositLow: { type: boolean, description: 'SAH-25. Payer is Self and total x 100 >= deposit x alertPercent.' }
        depositState: { $ref: '#/components/schemas/DepositState' }
        admittedAt: { type: string, format: date-time }
        goingHomeToday: { type: boolean, description: 'SAH-27 (assumption OQ-27-5). True when the admission is ADMITTED and has a discharge sign-off whose signedAt falls on today''s IST date. Drives the teal pill "Going home today" in the Status column (instead of the Insurance, Corporate and Deposit pills (the mockup is exclusive)). Always false for a DISCHARGED admission.' }
    AdmissionList:
      type: object
      required: [bedsTotal, bedsOccupied, bedsAvailable, canAdmit, depositAlerts, alertPercent, dischargedToday, goingHomeToday, emergency, safety, asOf, wards, card, cardSetup, items, scope]
      properties:
        scope: { $ref: '#/components/schemas/AdmissionScope', description: 'SAH-34 (34B, 34C). The caller''s patient scope for the chip "Patients in their wards · N of M", the Admitted tab number (N for a scoped user, OQ-34-28), the zero-ward and empty texts, "My patients", the Emergency access button and the Safety tab gate (scope.admitted above 0, see safety). Always present, for every role and every scope kind, ALL included (no patient data). With scope.kind WARDS, items, depositAlerts, goingHomeToday and safety.counts are computed on the visible set; bedsTotal, bedsOccupied, bedsAvailable, dischargedToday and emergency stay clinic-wide.' }
        cardSetup: { $ref: '#/components/schemas/ResolvedCardSetup', description: 'SAH-37 (ADR-015 D4). The published card setup the Cards view draws, for every allowed role, read in the same transaction as the rows. The Sahaj standard setup (v1) when the clinic never published.' }
        asOf: { type: string, format: date-time, description: 'SAH-36 (ADR-013 D2, D7). Database clock (clock_timestamp()) of this answer, read once; base of every minute count and of vitalsDue in the rows. The time in "Could not refresh. Showing data from <asOf as 11:05 AM>." when a 60-second reload fails (the last answer stays on screen). For every role (FRONT_DESK has no safety.counts.asOf).' }
        wards: { type: array, items: { $ref: '#/components/schemas/WardOption' }, description: 'SAH-36 (story 2, AC14, AC20, AC21). Every ward of the clinic, in the order of IpdLayout.wards (the Beds setup), also wards with no admitted patient, for the select "Ward" after the option "All wards". Filtering is on the device by AdmittedPatientRow.wardId.' }
        card: { $ref: '#/components/schemas/AdmittedCardAbilities', description: 'SAH-36 (story 5; ADR-013 D5). What the card shows for this caller, once for the whole list (every listed patient is ADMITTED, so abilities depend only on the role and the IPD state).' }
        safety: { oneOf: [{ $ref: '#/components/schemas/AdmissionSafety' }, { type: 'null' }], description: 'SAH-33. The Safety tab count and the banner of the Admitted patients tab, for OWNER, DOCTOR and NURSE (token role and membership role both); null for every other role, which has no Safety tab. The client shows the Safety tab, as the last tab, when safety is not null and scope.admitted (M, every ADMITTED admission of the clinic) is above 0 (mockup sfTabOn: ipAdm().length > 0, the clinic count, not the caller''s visible count), in Trial, On and Read-only state. SAH-34 (34C, AC 37): the gate is M, not items, so a scoped NURSE with no ward or no patient in her wards (items empty, scope.visible 0) still reaches the Safety tab and its scope note; for a caller with scope.kind ALL, items holds every admitted patient, so M equals the number of items.' }
        emergency: { $ref: '#/components/schemas/EmergencyCounts', description: 'SAH-28. Second tile "Emergency" (after Beds occupied, before Deposit alerts and Going home today) and the count on the Emergency tab.' }
        bedsTotal: { type: integer }
        bedsOccupied: { type: integer }
        bedsAvailable: { type: integer }
        canAdmit: { type: boolean, description: 'True for OWNER, FRONT_DESK, NURSE when IPD is not read-only.' }
        depositAlerts: { type: integer, description: Admitted patients with depositLow. }
        dischargedToday: { type: integer, minimum: 0, description: 'SAH-27. Admissions discharged on today''s IST date (N in the tile text "N discharged · M planned").' }
        goingHomeToday: { type: integer, minimum: 0, description: 'SAH-27. Admitted patients with goingHomeToday true (M in "N discharged · M planned"). The tile number is dischargedToday + goingHomeToday.' }
        alertPercent: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/AdmittedPatientRow' }, description: 'Newest admission first (the order of the cards and of the table; no sort, OQ-36-13). Not paged: bounded by the clinic''s bed limit. SAH-36: the items are AdmittedPatientRow (AdmissionRow plus the card facts).' }
    WardOption:
      type: object
      description: 'SAH-36. One option of the select "Ward" on the Admitted tab: the ward name; value the id.'
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 80 }
    AdmittedCardAbilities:
      type: object
      description: >-
        SAH-36 (story 5, AC43, AC44, AC51; ADR-013 D5). Card abilities for the caller, the same for every row.
        Each is true only when the token role and the role re-read from the active membership are both in the
        set named, and the IPD state allows it; each set is the narrower of the mockup's default card
        (pcDefault acl.act) and what the server already allows (OQ-36-4). A false action is not shown (no
        disabled button). A convenience only: every endpoint the opened sheets call checks role, membership,
        state and admission status again, unchanged. Action row order on the card: Nursing (primary), EMR,
        Transfer, Discharge, each with its icon and word (nurse, emr, swap, door icons), at least 44 px, with the
        accessible name "<Action> for <patientName>". When no action is true the row is not drawn.
      required: [nursing, emr, transfer, discharge, deposit, depositLowFlag, visibleGroups]
      properties:
        deposit: { type: boolean, description: 'SAH-37 (rule 10, AC40). OWNER, FRONT_DESK; IPD Trial or On (false in Read-only). The quick action "Deposit" (deposit icon), shown only when it is also switched on in cardSetup.actions; opens the admission sheet of SAH-23 at its "Running bill and deposit" part (start view, ADR-013 D6). Every ability is computed from CardAccessRule (ADR-015 D3), the same rule the catalogue''s "who" line is serialised from. An action is shown when it is in cardSetup.actions and its ability is true; the setup never grants.' }
        visibleGroups:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/CardDataGroup' }
          description: 'SAH-37 (rule 11, AC56; ADR-015 D4). The data groups this caller may see on the card (token role and membership role): OWNER all five; FRONT_DESK patient, contact, billing; NURSE and DOCTOR patient, clinical, vitals. The card draws a field only when its group is listed (billing fields are in every row for the unchanged Table view; a display rule for them, ADR-013 D3). A section with no field to draw is not drawn.'
        nursing: { type: boolean, description: 'OWNER, NURSE, DOCTOR; IPD Trial, On or Read-only. Opens the Nursing sheet of SAH-30/32 for the row (GET /admissions/{id}/nursing, record access as today); closing it returns focus to this button.' }
        emr: { type: boolean, description: 'OWNER, NURSE, DOCTOR; IPD Trial, On or Read-only. Opens the EMR sheet of SAH-31 (GET /admissions/{id}/emr, record access and view event as today); closing it returns focus to this button.' }
        transfer: { type: boolean, description: 'OWNER, NURSE, FRONT_DESK; IPD Trial or On (false in Read-only). Opens the admission sheet of SAH-23 (GET /admissions/{id}) with the "Move to another bed" row of SAH-26 open and focused (ADR-013 D6; no separate Transfer sheet and no reason field, OQ-36-11). When the detail answer has canTransfer false the sheet opens on its main view.' }
        discharge: { type: boolean, description: 'OWNER, DOCTOR; IPD Trial or On (false in Read-only). Opens the admission sheet straight on the SAH-27 discharge view, making the same requests as the button "Start discharge" (ADR-013 D6). When the detail answer has canStartDischarge false the sheet opens on its main view.' }
        depositLowFlag: { type: boolean, description: 'OWNER, FRONT_DESK. The card shows the flag "Deposit low" for a row with depositLow true only when this is true (the mockup''s default card hides billing from DOCTOR and NURSE; OQ-36-4). A display rule, not a privacy control: the Table view still shows the bill and deposit columns to all four roles, unchanged.' }
    AdmittedPatientRow:
      description: >-
        SAH-36 (story 1, AC3 to AC7; ADR-013). One admitted patient of GET /admissions: AdmissionRow (unchanged,
        also what the Table view shows) plus the card facts. The Standard card (mockup pcCard, layout standard,
        uniform grid), top to bottom: round initials of patientName (decorative, aria-hidden); patientName as a
        button with the tooltip "Open bill and bed details", which opens the admission sheet (ADR-013 D6); under
        it "UHID <uhid> · <age> · <Male|Female|Other>" (label OQ-36-8; "—" for a null uhid, age or sex; never
        "null" or "undefined"); the bed block "Bed" and bedCode; the flags line (order and rules in
        AdmittedClinicalFlags; Going home today and Deposit low from this row); "Admitted on" admittedAt as "24
        Oct 2026, 9:20 AM IST"; "Length of stay" "Day 1 (today)" when the IST date of admittedAt is the IST
        date of AdmissionList.asOf, otherwise "<dayNumber> days" ("1 day" when dayNumber is 1, possible only
        with the 24-hour cut; ADR-013 Q8); "Ward" wardName; "Room" roomName or "—"; "Doctor" doctorName; the
        action row (AdmittedCardAbilities). Long name, ward or room cut with an ellipsis, full text in the
        tooltip and the accessible name. The card is an article named "<patientName>, bed <bedCode>". Search
        (on the device only) matches, ignoring case and leading or trailing spaces, part of patientName, uhid,
        bedCode or ipNumber. Flags "Going home today" (blue, door icon) when goingHomeToday, for all four roles;
        "Deposit low" (crit, deposit icon) when depositLow and AdmissionList.card.depositLowFlag. Names, UHID and
        clinical data on screen only; never logged.
      allOf:
        - $ref: '#/components/schemas/AdmissionRow'
        - type: object
          required: [uhid, wardId, roomName]
          properties:
            uhid: { type: [string, 'null'], description: 'The patient''s UHID from the patient record, read through patient.api PatientClinicalPort (one batch call per answer). Null only when the patient record cannot be found (a data fault; the row is never dropped).' }
            wardId: { type: string, format: uuid, description: 'Ward of the current bed; the value matched by the ward filter (ward names are not used as keys).' }
            roomName: { type: [string, 'null'], maxLength: 80, description: 'Room of the current bed; null when the bed has no room or the clinic uses no rooms (IpdLayout.roomLevel false), shown as "—" (ADR-013 Q7).' }
            clinical: { $ref: '#/components/schemas/AdmittedClinicalFlags', description: 'Present only when the token role and the role re-read from the active membership are both OWNER, DOCTOR or NURSE. For every other caller (FRONT_DESK) the property is absent from the JSON: not null, not an empty object (AC34; ADR-013 D3).' }
            mine: { type: boolean, description: 'SAH-34 (34C, AC 33; OQ-34-9). For the filter "My patients" only (not a security rule). OWNER and DOCTOR: the admitting doctor is the caller''s membership. NURSE: the bed''s ward is one of her live wards (switch on or off); false for a patient she sees only through emergency access. Absent for FRONT_DESK (no button, as the mockup). No membership id is sent.' }
            emergencyAccess: { $ref: '#/components/schemas/AdmittedEmergencyAccess', description: 'SAH-34 (34E, AC 51; OQ-34-33). Present only on a row the caller sees only through her own active emergency access grant; absent on every other row and for every other user (a grant of one user never shows to another). Drives the grey card flag "Emergency access" (key icon, accessible text "Emergency access") and its tooltip.' }
            mobile: { type: [string, 'null'], maxLength: 20, description: 'SAH-37 (field Mobile, group contact; ADR-015 D6). The patient''s mobile number from the patient record (patient.api PatientLookupPort.findAllCurrent, one batch). Present only when the token role and the membership role are both OWNER or FRONT_DESK and (cardFacts=setup) the published setup has Mobile on in a section that is on, or cardFacts=all; absent otherwise (never sent to NURSE or DOCTOR). Null when the record has no mobile (card "—"). Never logged.' }
    AdmittedClinicalFlags:
      type: object
      description: >-
        SAH-36 (story 4, AC29 to AC37; ADR-013 D4). The clinical facts behind the card flags, for OWNER, DOCTOR
        and NURSE only, from existing rules computed by the server at AdmissionList.asOf (no rule in the
        browser). Flags, in this order, each with an icon and words (never colour alone): (1) the escalation
        flag: escalation.status OPEN "Not seen · <escalation.waitingMinutes> min" (crit, siren icon; tooltip
        "Early warning escalation raised <waitingMinutes> min ago, past the <targetMinutes> min target, not seen
        by a doctor" when pastTarget, "... within the <targetMinutes> min target ..." otherwise) or ACK "Doctor
        reviewing" (warn, siren icon); (2) allergy.status RECORDED "Allergy: <allergy.text>" (crit, alert icon;
        cut by width, the full text in the tooltip and the accessible name); (3) latestEws.risk MEDIUM "EWS
        <score> · Medium" (warn, heart icon) or HIGH "EWS <score> · High" (crit, heart icon; the card also gets
        the red outline, mockup pc-crit); (4) vitalsDue "Vitals due" (warn, clock icon); then, from the row,
        "Going home today" and "Deposit low". Flags (1) to (3) are safety flags and are never folded into "+N"
        (OQ-36-1); Vitals due, Going home today and Deposit low may fold into a chip "+N" whose tooltip and
        accessible name list them ("2 more: Vitals due, Deposit low"). Minute counts are never counted up on the
        device between reloads (OQ-36-10). The later "Dose overdue" flag (after SAH-35) is added here as an
        optional dosesLate for NURSE and OWNER only, second in the order (ADR-013 D9); it is not in this
        version and no placeholder is shown. Clinical data: on screen only; never logged or audited.
      required: [escalation, latestEws, vitalsDue, allergy]
      properties:
        escalation: { oneOf: [{ $ref: '#/components/schemas/CardEscalationFlag' }, { type: 'null' }], description: 'The admission''s escalation with status OPEN or ACK (at most one, SAH-30); null when none is open. The same rows as AdmissionSafety.counts and the banner (one read, same snapshot).' }
        latestEws: { oneOf: [{ $ref: '#/components/schemas/EwsSummary' }, { type: 'null' }], description: 'Score and risk of the latest vitals record (recordedAt descending, then id descending; same rule as AdmissionDetail.latestEws); null when no vitals were recorded. No flag for LOW.' }
        vitalsDue: { type: boolean, description: 'Same rule and function as AdmissionDetail.vitalsDue (SAH-30 AC10): no vitals yet, or more than 240 whole minutes from the latest recordedAt to AdmissionList.asOf.' }
        allergy: { $ref: '#/components/schemas/CardAllergy' }
        diagnosis: { type: string, minLength: 1, maxLength: 200, description: 'SAH-37 (field Diagnosis, group clinical; ADR-015 D6). The reason for admission (ipd.admission.reason, "Under evaluation" when it was left blank; the same value as DischargeSheet.diagnosis and EmrSheet.diagnosis). Present only when (cardFacts=setup) the published setup has Diagnosis on, or cardFacts=all; absent otherwise. Clinical text: on screen only, never logged.' }
        roundDoneToday: { type: boolean, description: '0.3.0 (SAH-67-1, ADR-025 D8). True when a doctor signed this admission''s daily progress note in the EMR for today''s IST date. Flag "Round done" (good, tick icon, with the text), after Deposit low; may fold into "+N". Read from ipd''s round record in the same set read (no extra query per patient). Always present for OWNER, DOCTOR, NURSE; not part of the card setup.' }
        latestVitals: { oneOf: [{ $ref: '#/components/schemas/CardLatestVitals' }, { type: 'null' }], description: 'SAH-37 (fields BP, Pulse, SpO₂, Temp, RR, Last recorded; group vitals; ADR-015 D6). The latest vitals record (the same record as latestEws). Present only when (cardFacts=setup) the published setup has at least one of those six fields on, or cardFacts=all; absent otherwise. Null when no vitals were recorded (card "No vitals recorded yet"; Last recorded "Not recorded" in amber).' }
    CardEscalationFlag:
      type: object
      description: 'SAH-36. The open escalation of one admitted patient for the card flag; values from EscalationClock at AdmissionList.asOf (ADR-007 D5), equal to the EscalationRow of the Safety board at the same snapshot. No id, score or names (the card does not act on it; Acknowledge and Call senior stay on the Safety board).'
      required: [status, waitingMinutes, targetMinutes, pastTarget]
      properties:
        status: { type: string, enum: [OPEN, ACK], description: 'OPEN "Not seen · N min" (crit); ACK "Doctor reviewing" (warn).' }
        waitingMinutes: { type: integer, minimum: 0, description: 'Whole minutes from the start of the response clock (reopenedAt, else raisedAt) to asOf, rounded down; the N of "Not seen · N min" (the same number as the red notice of the Safety board).' }
        targetMinutes: { type: integer, enum: [15, 60], description: '15 for HIGH, 60 for MEDIUM; for the tooltip.' }
        pastTarget: { type: boolean, description: 'As EscalationRow.pastTarget: OPEN and the exact time since the clock start is more than targetMinutes; false for ACK. Chooses "past" or "within" in the tooltip.' }
    CardAllergy:
      type: object
      description: 'SAH-36 (AC33; OQ-36-6). Allergy of the patient record (SAH-8), read through patient.api PatientClinicalPort in one batch call; status by the SAH-31 allergy-status function (AllergyStatus, ADR-009 D2), never by matching in the browser. Only RECORDED shows a flag; NONE_KNOWN and NOT_RECORDED show none (as the mockup). A patient record that cannot be found gives NOT_RECORDED.'
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/AllergyStatus' }
        text: { type: string, minLength: 1, maxLength: 400, description: 'Present only when status is RECORDED: the allergy field as stored, never cut in the data. Absent for NONE_KNOWN and NOT_RECORDED. Clinical data: on screen only; never logged, audited or put in a clinical event.' }
    DepositEntry:
      type: object
      required: [id, amountPaise, mode, collectedAt, collectedByName]
      properties:
        id: { type: string, format: uuid }
        amountPaise: { type: integer }
        mode: { oneOf: [{ $ref: '#/components/schemas/PayMode' }, { type: 'null' }], description: '0.2.0: null only when source is COURSE (no cash was taken at the desk).' }
        source: { type: string, enum: [DESK, COURSE], description: '0.2.0 (ADR-022 D12). COURSE: credit carried from a treatment course at admission ("From treatment course TC-<n>").' }
        courseNo: { type: [string, 'null'], description: '0.2.0. COURSE only: the course number.' }
        collectedAt: { type: string, format: date-time }
        collectedByName: { type: string }
    AdmissionDetail:
      description: 'SAH-27: for a DISCHARGED admission every value is fixed at discharge: dayNumber is finalBill.billDays, runningBillPaise is finalBill.totalPaise, depositLow and goingHomeToday are false, bill is rebuilt from the frozen final bill (never recomputed from today''s rates or clock), and canCollectDeposit, canAddCharge, canTransfer and canStartDischarge are false. bedCode, categoryName and wardName are those of the bed the patient left.'
      allOf:
        - $ref: '#/components/schemas/AdmissionRow'
        - type: object
          required: [reason, deposits, canCollectDeposit, bill, canAddCharge, canTransfer, transferRules, status, dischargedAt, canStartDischarge, discharge, finalBill, canOpenNursing, vitalsDue, latestEws, canOpenEmr, package]
          properties:
            package: { oneOf: [{ $ref: '#/components/schemas/AdmissionPackage' }, { type: 'null' }], description: 'SAH-29 (AC2). The admission''s own copy of the package taken when it was attached (ipd.admission package columns); null when the admission has no package. Later changes to the package list never change it. Sent to all four roles (they already see the bill). The sheet draws no separate field for it: the Summary strip shows no new field (AC4); the package shows only as the bill lines of RunningBill. Same value for a DISCHARGED admission (its bill comes from finalBill). The package name is never logged and never put in audit before_json or after_json as free text (AdmissionPackage).' }
            canOpenEmr: { type: boolean, description: 'SAH-31 (AC1, OQ-31-7; ADR-009 D11). Shows the footer button "EMR" (emr icon) of the admission sheet, which opens the EMR sheet (GET /admissions/{id}/emr): true when the token role and the role re-read from the active membership are both OWNER, DOCTOR or NURSE, the admission is ADMITTED and IPD is Trial, On or Read-only (Read-only added to the story so a doctor can still read and stop medicines; ADR-009 Q6); false otherwise, and always false for a DISCHARGED admission and for FRONT_DESK, BILLING and every other role.' }
            canOpenNursing: { type: boolean, description: 'SAH-30. Shows the footer button "Nursing" (nurse icon) that opens the Nursing sheet: true for OWNER, NURSE and DOCTOR in Trial, On and Read-only state, for an ADMITTED or a DISCHARGED admission (AC1, AC11); false for every other role. Whether the sheet can save is NursingSheet.canRecord.' }
            vitalsDue: { type: [boolean, 'null'], description: 'SAH-30 (AC10), for the later patient card. True when the admission is ADMITTED and has no vitals, or the whole minutes from its latest vitals recordedAt to the read time (the database clock, clock_timestamp(), never the application clock; review M1) (rounded down) are more than 240 (mockup pcDue); false otherwise and always false for a DISCHARGED admission. Null for a role without vitals access (FRONT_DESK; ADR-006 Q6). The Nursing sheet shows no flag for it.' }
            latestEws: { oneOf: [{ $ref: '#/components/schemas/EwsSummary' }, { type: 'null' }], description: 'SAH-30, for the later patient card. The score and risk of the latest vitals record; null when there are no vitals, and null for a role without vitals access (FRONT_DESK). For a DISCHARGED admission it is the last record before discharge.' }
            status: { type: string, enum: [ADMITTED, DISCHARGED], description: SAH-27. }
            dischargedAt: { type: [string, 'null'], format: date-time, description: 'SAH-27. Set when DISCHARGED.' }
            canStartDischarge: { type: boolean, description: 'SAH-27. Shows the footer button "Start discharge": true for OWNER, FRONT_DESK, NURSE, DOCTOR while ADMITTED and IPD is not read-only.' }
            discharge: { oneOf: [{ $ref: '#/components/schemas/DischargeRecord' }, { type: 'null' }], description: 'SAH-27. Null while ADMITTED; the discharge record once DISCHARGED.' }
            finalBill: { oneOf: [{ $ref: '#/components/schemas/FinalBill' }, { type: 'null' }], description: 'SAH-27. Null while ADMITTED; the frozen final bill and settlement once DISCHARGED. Later rate changes in Clinic setup never change it.' }
            bill: { $ref: '#/components/schemas/RunningBill' }
            canAddCharge: { type: boolean }
            canTransfer: { type: boolean, description: 'SAH-26. True for OWNER, FRONT_DESK, NURSE while admitted and IPD is not read-only.' }
            transferRules: { $ref: '#/components/schemas/TransferRules' }
            mobile: { type: [string, 'null'], description: 'Returned only to OWNER and FRONT_DESK (null for NURSE and DOCTOR). On screen only; never logged.' }
            reason: { type: string }
            deposits: { type: array, items: { $ref: '#/components/schemas/DepositEntry' } }
            canCollectDeposit: { type: boolean }
    BedStatus:
      type: string
      enum: [free, occ, clean, blk, res]
      description: Available, Occupied, Cleaning, Blocked, Reserved.
    BoardBed:
      type: object
      required: [id, code, categoryKey, categoryName, ratePaise, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        categoryKey: { $ref: '#/components/schemas/CategoryKey' }
        categoryName: { type: string }
        ratePaise: { type: integer, description: Bed charge a day of the category. }
        status: { $ref: '#/components/schemas/BedStatus' }
        admissionId: { type: [string, 'null'], format: uuid, description: Set when occupied. }
        patientName: { type: [string, 'null'], description: Set when occupied. On screen only; never logged. }
        dayNumber: { type: [integer, 'null'], description: 'Billed bed days, same as the list and bill.billDays. Set when occupied.' }
        doctorShortName: { type: [string, 'null'], description: First two words of the doctor's name. Set when occupied. }
        depositLow: { type: [boolean, 'null'], description: SAH-25. Set when occupied. }
        goingHomeToday: { type: [boolean, 'null'], description: 'SAH-27. Set when occupied: same rule as AdmissionRow.goingHomeToday. Shows the flag "Going home today" on the bed tile, before "Deposit low".' }
        outsideScope: { type: boolean, description: 'SAH-34 (34B, AC 9; OQ-34-6). Present and true only for an occupied bed whose patient is outside the caller''s scope; then admissionId, patientName, dayNumber, doctorShortName, depositLow and goingHomeToday are null (absent from the data, not hidden by the screen) and the tile shows the bed code, the category and the status "Occupied" only (no name, day, doctor or flag). The tile does nothing on click: it opens no sheet and calls nothing; it stays in the tab order marked aria-disabled, like other tiles with no action. Absent (never false) for every other bed and for every caller whose scope is all.' }
    BoardRoom:
      type: object
      required: [id, name, beds]
      properties:
        id: { type: [string, 'null'], format: uuid, description: Null for the group of beds without a room. }
        name: { type: string, description: Empty for the group of beds without a room. }
        beds: { type: array, items: { $ref: '#/components/schemas/BoardBed' } }
    BoardWard:
      type: object
      required: [id, name, station, occupied, total, hasFreeBed, rooms]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        station: { type: string }
        occupied: { type: integer }
        total: { type: integer }
        hasFreeBed: { type: boolean }
        firstFreeBedId: { type: [string, 'null'], format: uuid, description: First Available bed in room then code order. }
        rooms: { type: array, items: { $ref: '#/components/schemas/BoardRoom' }, description: 'With roomLevel on the rooms that have beds, plus a no-room group if needed; with roomLevel off a single group with an empty name.' }
    BedBoard:
      type: object
      required: [state, roomLevel, canAdmit, canChangeBeds, counts, wards]
      properties:
        state: { type: string, enum: [trial, on, readonly] }
        roomLevel: { type: boolean }
        canAdmit: { type: boolean }
        canChangeBeds: { type: boolean, description: 'True for OWNER, FRONT_DESK, NURSE when IPD is not read-only.' }
        counts:
          type: object
          required: [free, occ, clean, res, blk]
          properties:
            free: { type: integer }
            occ: { type: integer }
            clean: { type: integer }
            res: { type: integer }
            blk: { type: integer }
        wards: { type: array, items: { $ref: '#/components/schemas/BoardWard' } }
    ChargeServiceKey:
      type: string
      enum: [visit, ivfluid, injection, cbc, xray, oxygen, dressing, ecg, nebulisation, physio]
    ChargeServices:
      type: array
      items:
        type: object
        required: [key, name, basePaise]
        properties:
          key: { $ref: '#/components/schemas/ChargeServiceKey' }
          name: { type: string }
          basePaise: { type: integer }
    BillLine:
      type: object
      required: [name, unitPaise, qty, amountPaise]
      properties:
        name: { type: string }
        unitPaise: { type: integer }
        qty: { type: integer }
        amountPaise: { type: integer, description: unitPaise times qty. }
        segment: { type: boolean, description: 'SAH-26. True for a line of a bed the patient was moved away from ("Bed · General (before transfer)", "Doctor visits · General rate"). Absent or false otherwise. Always false on a package admission (SAH-29: no segment lines).' }
    RunningBill:
      type: object
      description: >-
        SAH-25/26, SAH-29. Worked out by the server on read (one function for the sheet, the Admitted list, the
        Deposit low pill, the Deposit alerts tile and the board flag, so the numbers agree; never stored before
        discharge). billDays is the SAH-25 rule "Bed day counted". Without a package the lines are as SAH-25/26.
        With a package (AdmissionDetail.package not null; AC3, mockup ipLines) the lines are, in this order, and a
        line with quantity 0 is dropped:
        (1) "Package · <package.name> (bed, nursing and surgeon for <package.includedDays> days)", qty 1, unitPaise
        package.pricePaise (the copy on the admission; the package price counts from the first day, AC4; the text
        is the mockup template, also for 0 and 1 days: OQ-29-4);
        (2) "Bed · <categoryName> beyond the package", unitPaise the bed charge a day of the category of the bed the
        patient is in now (no multiplier), qty = max(0, billDays - max(1, package.includedDays)) (a day-care package,
        0 days, includes 1 bed day);
        (3) the extra charges of SAH-25, one line per service and base price in order of first charge, named
        "<service> · not in package", unitPaise = base price x multiplier of the current category, half-up to whole
        paise, amount = unitPaise x qty (as SAH-25; earlier charges are re-priced after a transfer, OQ-29-5).
        A package admission has no "Doctor visits" line, no "Nursing care" line and no bed-transfer segment lines
        (segment false everywhere), whatever ipd.bed_transfer holds. categoryName, multiplier and therefore the heading
        note of the Running bill panel ("Bed day counted at midnight · <categoryName> rate ×<multiplier> on
        services") are unchanged. totalPaise, depositPercent and AdmissionRow.depositLow use these lines.
      required: [billDays, bedDayCut, categoryName, multiplier, lines, totalPaise, paidPaise, depositPercent]
      properties:
        billDays: { type: integer }
        bedDayCut: { type: string, enum: [midnight, 24h] }
        categoryName: { type: string }
        multiplier: { type: number }
        lines: { type: array, items: { $ref: '#/components/schemas/BillLine' } }
        totalPaise: { type: integer }
        paidPaise: { type: integer }
        depositPercent: { type: [integer, 'null'], description: 'Bill as a share of the deposit, rounded; null when there is no deposit.' }
        alertPercent: { type: integer }
    AdmissionPackage:
      type: object
      description: 'SAH-29 (AC2). The copy of a package kept on one admission (ipd.admission.package_name, package_price_paise, package_days; all three set or none). Not a link to ipd.package: changing or switching off the package later never changes it. AdmissionDetail.package is this named schema or null (no inline object). Privacy rule (SAH-29 code review #3, security review S-3): on an admission a package name can imply a procedure, so it is treated like clinical text. A package name is never written to an application log line, and never put in an audit after_json or before_json as free text; when a write that attaches a package to an admission is added (none exists yet: sahaj_app has no grant on the three columns), its audit records ids, pricePaise and includedDays only. It is sent only in answers that already carry the bill (the same four roles), and toString of the Java views hides it.'
      required: [name, pricePaise, includedDays]
      properties:
        name: { type: string, minLength: 1, maxLength: 80, description: 'Package name as it was when attached. On screen only (the bill line "Package · <name> …"); never logged, never in audit before_json or after_json.' }
        pricePaise: { type: integer, minimum: 0, maximum: 100000000, multipleOf: 100, description: 'Package price in paise, whole rupees (at most ₹10,00,000).' }
        includedDays: { type: integer, minimum: 0, maximum: 60, description: 'Bed days included; 0 = day-care (the bill counts it as 1 bed day).' }
    IpdPackage:
      type: object
      description: >-
        SAH-29 (AC1). One row of the Packages panel (mockup cfgIpAdm): a chip "<includedDays> days" (the mockup
        template, also "1 days" for 1; OQ-29-4) or "Day-care" when includedDays is 0; the name in bold; the fixed small
        text "Bed, nursing and surgeon included · extra days and exclusions at normal rates" (client constant, not
        sent); the price at the right as "₹45,000". No action on the row.
      required: [id, name, pricePaise, includedDays]
      properties:
        id: { type: string, format: uuid, description: 'Row key only; nothing in this slice takes it as input.' }
        name: { type: string, minLength: 1, maxLength: 80 }
        pricePaise: { type: integer, minimum: 0, maximum: 100000000, multipleOf: 100, description: 'Whole rupees, in paise.' }
        includedDays: { type: integer, minimum: 0, maximum: 60, description: '0 = day-care.' }
    PackageList:
      type: object
      description: 'SAH-29. The answer of GET /packages.'
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/IpdPackage' }, description: 'Active packages of the clinic in the order they were created (created_at, then id). Empty when the clinic has none (OQ-29-3).' }
    TransferRules:
      type: object
      required: [upgradeNeedsOwner, newRateFrom]
      properties:
        upgradeNeedsOwner: { type: boolean, description: 'true = "Owner approves" (only the OWNER may move to a higher category); false = "Front desk can do it".' }
        newRateFrom: { type: string, enum: [same, next], description: 'same = new bed rate starts on the day of the transfer; next = the next day.' }
    DischargeType:
      type: string
      enum: [normal, lama, referred, death]
      description: 'SAH-27. Labels in this order: normal "Normal" (default), lama "On request (LAMA)", referred "Referred", death "Death". The toast writes the label in lower case ("discharged (on request (lama))").'
    DischargeTemplateKey:
      type: string
      enum: [general, surgical, maternity, daycare]
      description: 'SAH-27. Labels in this order: general "General medicine", surgical "Surgical", maternity "Maternity", daycare "Day-care".'
    DischargeTypeOption:
      type: object
      required: [key, label]
      properties:
        key: { $ref: '#/components/schemas/DischargeType' }
        label: { type: string }
    DischargeTemplateOption:
      type: object
      required: [key, label]
      properties:
        key: { $ref: '#/components/schemas/DischargeTemplateKey' }
        label: { type: string }
    DischargeSettingsInput:
      type: object
      required: [approvalChain, followUpDays]
      properties:
        templateKey: { oneOf: [{ $ref: '#/components/schemas/DischargeTemplateKey' }, { type: 'null' }], description: 'Summary template. Missing or null = no template chosen ("Choose a template").' }
        approvalChain: { type: boolean, description: 'Approval chain switch. On: steps "Doctor signs the summary", "Billing clearance", "Nursing handover"; off: "Summary signed", "Final bill".' }
        followUpDays: { type: integer, minimum: 1, maximum: 30, description: 'Follow-up after discharge, in days (stepper, step 1).' }
    DischargeSettings:
      type: object
      required: [templateKey, approvalChain, followUpDays, types, templates, opdFollowUpRule, canEdit]
      properties:
        templateKey: { oneOf: [{ $ref: '#/components/schemas/DischargeTemplateKey' }, { type: 'null' }], description: Null when no template is chosen. }
        approvalChain: { type: boolean, description: Default true. }
        followUpDays: { type: integer, minimum: 1, maximum: 30, description: Default 7. }
        types: { type: array, items: { $ref: '#/components/schemas/DischargeTypeOption' }, description: 'The read-only line "Discharge types": always the four types in DischargeType order, shown as chips.' }
        templates: { type: array, items: { $ref: '#/components/schemas/DischargeTemplateOption' }, description: The four templates in DischargeTemplateKey order. }
        opdFollowUpRule:
          type: object
          description: 'From the OPD fee settings (SAH-7) through opd.api FollowUpPort; read-only here. The hint says "free" when fee is free and "charged" for half or full.'
          required: [days, fee]
          properties:
            days: { type: integer, minimum: 1, maximum: 30 }
            fee: { type: string, enum: [free, half, full] }
        canEdit: { type: boolean, description: True for OWNER when IPD is not read-only. }
    DischargeSignature:
      type: object
      description: 'SAH-27. The latest sign-off of the admission. It applies to a discharge only when its type and templateKey equal the ones chosen on the sheet; otherwise the checkbox shows unticked.'
      required: [type, templateKey, signedByName, signedAt]
      properties:
        type: { $ref: '#/components/schemas/DischargeType' }
        templateKey: { $ref: '#/components/schemas/DischargeTemplateKey' }
        signedByName: { type: string, description: Name of the person who ticked the box. }
        signedAt: { type: string, format: date-time }
    DischargeSheet:
      type: object
      description: 'SAH-27. Data for the Discharge sheet. Title "Discharge <patientName>", subtitle "<ipNumber> · bed <bedCode> · day <dayNumber>". The client builds the steps from approvalChain and whether signature matches the chosen type and template (AC2), the button text from bill.balancePaise (AC6), and shows "—" for the follow-up row and the death notice when the chosen type is death.'
      required: [admissionId, ipNumber, patientName, bedCode, dayNumber, approvalChain, types, templates, defaultType, defaultTemplateKey, signature, canSign, canDischarge, canRefund, preview, bill, followUpDays, followUpDate, openEscalation, signoffBeforeEscalation]
      properties:
        signoffBeforeEscalation: { type: boolean, description: 'SAH-33 review fix (security review SAH-33 M1, ADR-007 R2). True when openEscalation is true, signature is not null and signature.signedAt is not later than the start of that escalation''s response clock (reopenedAt, else raisedAt): the doctor signed before this escalation was raised or re-opened, so the sign-off does not cover it. False otherwise. When true the client shows the checkbox unticked whatever the chosen type (canSign decides whether it can be ticked; ticking it appends a new sign-off, PUT /admissions/{id}/discharge/signoff), and for death, lama or referred the warning notice reads "This patient has an early warning escalation that started after the doctor signed the summary. A doctor must record the response or sign the summary again." (contract wording, the 409 escalation-open text; pending clinical sign-off, ADR-007 Q2, Q17) instead of the close-at-discharge warning; for normal the notice is the normal one. The Discharge button is not disabled by it; the server decides.' }
        openEscalation: { type: boolean, description: 'SAH-33 (AC14, ADR-007 D6). True when the admission has an early warning escalation with status OPEN or ACK. Boolean only (no score or status): FRONT_DESK opens this sheet. When true the sheet shows a warning notice (crit) above the footer, depending on the chosen type: normal "This patient has an early warning escalation that is not closed. A doctor must record the response first." (story; the discharge then answers 409 escalation-open); death, lama or referred "This patient has an early warning escalation that is not closed. Completing this discharge closes it as "Closed at discharge", with no doctor response recorded." (contract wording, pending clinical sign-off). The Discharge button is not disabled by it; the server decides.' }
        admissionId: { type: string, format: uuid }
        ipNumber: { type: string }
        patientName: { type: string, description: On screen only; never logged. }
        bedCode: { type: string }
        dayNumber: { type: integer, description: 'Billed bed days: same as AdmissionRow.dayNumber.' }
        approvalChain: { type: boolean, description: From Discharge setup. }
        types: { type: array, items: { $ref: '#/components/schemas/DischargeTypeOption' } }
        templates: { type: array, items: { $ref: '#/components/schemas/DischargeTemplateOption' } }
        defaultType: { $ref: '#/components/schemas/DischargeType' }
        defaultTemplateKey: { $ref: '#/components/schemas/DischargeTemplateKey', description: 'The template of Discharge setup; when none is chosen: maternity for a maternity admission, daycare for a daycare admission, surgical for an admission with a package (SAH-29: AdmissionDetail.package not null; mockup ipdis), otherwise general.' }
        signature: { oneOf: [{ $ref: '#/components/schemas/DischargeSignature' }, { type: 'null' }], description: 'The latest sign-off, or null when nobody has signed.' }
        canSign: { type: boolean, description: 'True for DOCTOR and OWNER when IPD is not read-only (OQ-27-1); others see the checkbox disabled.' }
        canDischarge: { type: boolean, description: 'True for OWNER and FRONT_DESK when IPD is not read-only (OQ-27-1).' }
        canRefund: { type: boolean, description: 'True for OWNER when IPD is not read-only (OQ-27-3).' }
        preview:
          type: object
          description: 'Summary preview rows. Diagnosis = diagnosis. Stay = "<stayDays> days · bed <bedCode> · <doctorName> · <doctorSpecialty>" ("1 day" when stayDays is 1; the specialty part is left out when doctorSpecialty is null). Treatment = fixed text "As recorded in the case sheet and nursing notes". Follow-up = "OPD review on <followUpDate as 31 Oct 2026> with <doctorShortName>", or "—" for death. Checkbox = "Summary checked and signed by <doctorName>".'
          required: [diagnosis, stayDays, bedCode, doctorName, doctorShortName, doctorSpecialty]
          properties:
            diagnosis: { type: string, description: 'The reason for admission. Clinical text; on screen only, never logged or audited.' }
            stayDays: { type: integer, minimum: 1, description: The bill days of SAH-25. }
            bedCode: { type: string }
            doctorName: { type: string, description: The admitting doctor. }
            doctorShortName: { type: string, description: 'First two words of the admitting doctor''s name (same rule as BoardBed.doctorShortName).' }
            doctorSpecialty: { type: [string, 'null'], description: The admitting doctor's specialty from the team profile; null when not set. }
        bill:
          type: object
          description: 'Block "Final bill": "Total charges" totalPaise, "Deposits received" depositsPaise (shown with a minus sign), then "To collect now" (balancePaise > 0), "To refund" (< 0) or "Settled" (0) with the amount without sign. Send totalPaise back as expectedTotalPaise.'
          required: [totalPaise, depositsPaise, balancePaise]
          properties:
            totalPaise: { type: integer, minimum: 0, description: The running bill total as it is now (SAH-25/26). }
            depositsPaise: { type: integer, minimum: 0 }
            balancePaise: { type: integer, description: totalPaise minus depositsPaise; negative means a refund. }
        followUpDays: { type: integer, minimum: 1, maximum: 30 }
        followUpDate: { type: string, format: date, description: 'Today''s IST date plus followUpDays: the date in the preview and the notice. The discharge itself uses the IST discharge day.' }
    DischargeSignoffInput:
      type: object
      required: [type, templateKey]
      properties:
        type: { $ref: '#/components/schemas/DischargeType' }
        templateKey: { $ref: '#/components/schemas/DischargeTemplateKey' }
    DischargeInput:
      type: object
      required: [type, templateKey, expectedTotalPaise]
      properties:
        type: { $ref: '#/components/schemas/DischargeType' }
        templateKey: { $ref: '#/components/schemas/DischargeTemplateKey' }
        expectedTotalPaise: { type: integer, minimum: 0, maximum: 10000000000, description: 'The bill.totalPaise the user saw. Only compared with the server total (409 bill-changed when different); never used as an amount.' }
        expectedDepositsPaise: { type: integer, minimum: 0, maximum: 10000000000, description: 'The bill deposits (depositsPaise of the sheet) the user saw. Compared with the server deposits total: a deposit added between opening the sheet and pressing the button changes the amount to collect or refund, so it answers 409 bill-changed too (QA finding F-27-2). Never used as an amount.' }
        mode: { oneOf: [{ $ref: '#/components/schemas/PayMode' }, { type: 'null' }], description: 'Collect by / Refund by (UPI is the default on screen). Required when the server balance is not 0; ignored when it is 0.' }
    DischargeRecord:
      type: object
      description: SAH-27. What the discharge recorded. Insert only.
      required: [type, templateKey, signedByName, signedAt, dischargedByName, dischargedAt, followUpDays, followUpDate]
      properties:
        type: { $ref: '#/components/schemas/DischargeType' }
        templateKey: { $ref: '#/components/schemas/DischargeTemplateKey' }
        signedByName: { type: string, description: Who signed the summary that applied. }
        signedAt: { type: string, format: date-time }
        dischargedByName: { type: string }
        dischargedAt: { type: string, format: date-time }
        followUpDays: { type: integer, minimum: 1, maximum: 30, description: The Discharge setup value at the time of discharge. }
        followUpDate: { type: [string, 'null'], format: date, description: 'IST discharge day plus followUpDays; null for death (no follow-up is added).' }
    FinalBill:
      type: object
      description: 'SAH-27. The final bill frozen at discharge, with its settlement. Append-only; never recomputed.'
      required: [lines, billDays, totalPaise, depositsPaise, balancePaise, outcome, mode, settledByName, settledAt]
      properties:
        lines: { type: array, items: { $ref: '#/components/schemas/BillLine' }, description: 'The running bill lines as they were at discharge, in the same order.' }
        billDays: { type: integer, minimum: 1 }
        totalPaise: { type: integer, minimum: 0 }
        depositsPaise: { type: integer, minimum: 0 }
        balancePaise: { type: integer, description: 'totalPaise minus depositsPaise: positive was collected, negative was refunded, 0 was settled.' }
        outcome: { type: string, enum: [collected, refunded, settled], description: 'Toast text: "₹X collected by <mode>", "₹X refunded by <mode>" or "bill settled".' }
        mode: { oneOf: [{ $ref: '#/components/schemas/PayMode' }, { type: 'null' }], description: Null when settled. }
        settledByName: { type: string }
        settledAt: { type: string, format: date-time }
    TriageScale:
      type: integer
      enum: [3, 5]
      description: 'SAH-28. 3 = "3 colours" (default), 5 = "5 levels".'
    TriageLevel:
      type: integer
      minimum: 1
      maximum: 5
      description: 'SAH-28. 1 is the most urgent level of either scale (Red or Level 1). With scale 3 only 1 to 3 are valid.'
    TriageTarget:
      type: integer
      minimum: 0
      maximum: 240
      multipleOf: 5
      description: 'SAH-28. Minutes to see a doctor. 0 is shown "Now" in setup and "now" on the form and the card.'
    EmergencyLevel:
      type: object
      description: >-
        SAH-28. One level of the clinic's current scale, in level order. 3 colours: 1 Red · Immediate (crit),
        2 Yellow · Urgent (warn), 3 Green · Can wait (good). 5 levels: 1 Level 1 · Resuscitation (crit),
        2 Level 2 · Emergent (crit), 3 Level 3 · Urgent (warn), 4 Level 4 · Less urgent (good),
        5 Level 5 · Non-urgent (good). Names and descriptions are fixed (OQ-28-2).
      required: [level, name, description, tone, targetMinutes]
      properties:
        level: { $ref: '#/components/schemas/TriageLevel' }
        name: { type: string, examples: [Red, Level 2] }
        description: { type: string, examples: [Immediate, Emergent] }
        tone: { type: string, enum: [crit, warn, good], description: 'Colour token of docs/design/tokens.md (--crit, --warn, --good) for the level button, the card stripe and the setup dot; always paired with the name.' }
        targetMinutes: { $ref: '#/components/schemas/TriageTarget' }
    EmergencyCaseStatus:
      type: string
      enum: [WAITING, SEEN, ADMITTED, RELEASED, REFERRED, SENT_TO_OPD]
      description: 'SAH-28. WAITING and SEEN are in the queue; ADMITTED, RELEASED and REFERRED are closed and never reopen. 0.3.0 (SAH-67-2, ADR-025 D9): SENT_TO_OPD is closed too ("Sent to OPD"), set only by the doctor''s Emergency outcome "Send to OPD" from the EMR; a client must treat an unknown status as closed.'
    EmergencyCounts:
      type: object
      description: 'SAH-28. Counts for the menu badge, the tile "Emergency" and the Emergency tab. No names.'
      required: [writable, queue, overTarget]
      properties:
        writable: { type: boolean, description: 'True when IPD is Trial or On. False in Read-only: the tile number shows "—" and the tab, the header button and the menu item are not shown.' }
        queue: { type: integer, minimum: 0, description: 'Cases with status WAITING or SEEN. The badge and the tab count; the badge is hidden at 0 (mockup).' }
        overTarget: { type: integer, minimum: 0, description: 'WAITING cases with overTarget true. Tile text "All within target time" at 0, otherwise "<n> over target time" in the critical colour.' }
    EmergencyCase:
      type: object
      description: 'SAH-28. One card of the queue. displayName, age, sex and complaint are on screen only; never logged or audited. The mobile is not sent here (the card does not show it); the Admit hand-off carries it.'
      required: [id, displayName, age, sex, complaint, identityPending, level, levelName, bay, status, arrivedAt, waitingMinutes, targetMinutes, overTarget, seenAt]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string, maxLength: 80, description: 'The name, or "Unknown male, about 40" for an unknown patient.' }
        age: { type: [integer, 'null'], minimum: 0, maximum: 120, description: 'Shown "?" when null.' }
        sex: { type: string, enum: [M, F, O], description: 'Shown as the letter after the age ("40 M").' }
        complaint: { type: string, maxLength: 200 }
        identityPending: { type: boolean, description: 'Registered with "Name not known yet": warning pill "Identity pending".' }
        level: { $ref: '#/components/schemas/TriageLevel' }
        levelName: { type: string, description: 'Name of the level in the current scale, for the card and the toasts.' }
        bay: { type: [string, 'null'], pattern: '^ER-([1-9]|10)$', description: 'ER-1 to ER-10, given at registration to a level 1 case when a bay was free; shown " · ER-1" after the age and sex.' }
        status: { $ref: '#/components/schemas/EmergencyCaseStatus' }
        arrivedAt: { type: string, format: date-time }
        waitingMinutes: { type: integer, minimum: 0, description: 'Whole minutes from arrivedAt to asOf, rounded down; both from the database clock (ADR-005 D6).' }
        targetMinutes: { $ref: '#/components/schemas/TriageTarget' }
        overTarget: { type: boolean, description: 'status WAITING and waitingMinutes > targetMinutes (with target 0 any wait of 1 minute or more). Pill "Waiting <m> min · target <t> min" ("target now" for 0): neutral when false, critical with the alert icon and a highlighted card when true. SEEN shows the pill "Seen by doctor" instead; always false when not WAITING.' }
        seenAt: { type: [string, 'null'], format: date-time }
    EmergencyQueue:
      type: object
      description: 'SAH-28. The Emergency page and the answer of every emergency action. Panel note "Most urgent first, then longest waiting · bays free <baysFree> of <baysTotal>". Empty cases: "No one in emergency right now."'
      required: [state, scale, levels, defaultLevel, unknownPatientRegistration, baysTotal, baysFree, counts, cases, canRegister, canRetriage, canAct, canAdmit, asOf]
      properties:
        state: { type: string, enum: [trial, on, readonly] }
        scale: { $ref: '#/components/schemas/TriageScale' }
        levels: { type: array, items: { $ref: '#/components/schemas/EmergencyLevel' }, description: 'The current scale''s levels in order: the Triage level buttons ("<description> · within <t> min" or "<description> · now"), the card level list and the card stripe.' }
        defaultLevel: { $ref: '#/components/schemas/TriageLevel', description: 'Always 2 (the second level of either scale): the form''s initial and reset level.' }
        unknownPatientRegistration: { type: boolean, description: 'Shows the checkbox "Name not known yet".' }
        baysTotal: { type: integer, minimum: 0, maximum: 10 }
        baysFree: { type: integer, minimum: 0, maximum: 10, description: 'Bays of ER-1 to ER-<baysTotal> not held by a WAITING or SEEN case.' }
        counts: { $ref: '#/components/schemas/EmergencyCounts' }
        cases: { type: array, items: { $ref: '#/components/schemas/EmergencyCase' }, description: 'WAITING and SEEN cases: level ascending, then arrivedAt ascending, then id (as a UUID compare: java.util.UUID order, not the PostgreSQL uuid order).' }
        canRegister: { type: boolean, description: 'Shows the Quick registration panel. True for OWNER, FRONT_DESK, NURSE, DOCTOR when IPD is not read-only.' }
        canRetriage: { type: boolean, description: 'Shows the level list on the card. True for OWNER, FRONT_DESK, NURSE, DOCTOR when IPD is not read-only.' }
        canAct: { type: boolean, description: 'Shows Doctor has seen (WAITING cases only), Treat and release and Refer out. True for OWNER, NURSE, DOCTOR when IPD is not read-only.' }
        canAdmit: { type: boolean, description: 'Shows Admit. True for OWNER, FRONT_DESK, NURSE when IPD is not read-only (the SAH-23 admit roles).' }
        asOf: { type: string, format: date-time, description: 'The database clock instant the waits were computed at (clock_timestamp(); for an action, the same instant that stamped it; ADR-005 D6).' }
        actedCase:
          oneOf:
            - $ref: '#/components/schemas/EmergencyCase'
            - $ref: '#/components/schemas/EmergencyCaseRef'
          description: 'Only in the answer of an action: the case the action applied to, in its new state (also when it has left the queue). Source of the toast text. Always the full EmergencyCase, except in the 200 answer to a repeated clientKey on POST /emergency/cases when the case is closed or the caller is not its registrant: then EmergencyCaseRef (id, level, status) and the client shows no toast (security review L1).'
    EmergencyCaseRef:
      type: object
      additionalProperties: false
      description: 'SAH-28. The smallest view of a case: no name, age, sex, complaint, bay or times. Used as actedCase in the 200 answer to a repeated clientKey when the case is closed or the caller did not register it (security review L1).'
      required: [id, level, status]
      properties:
        id: { type: string, format: uuid }
        level: { $ref: '#/components/schemas/TriageLevel' }
        status: { $ref: '#/components/schemas/EmergencyCaseStatus' }
    EmergencyCaseInput:
      type: object
      description: 'SAH-28. Quick registration. Messages are listed on POST /emergency/cases. Types are strict: identityUnknown must be a JSON boolean and age and level JSON numbers; a JSON string such as "true", "40" or "2" is refused with the field''s message, never converted.'
      required: [clientKey, identityUnknown, sex, complaint, level]
      properties:
        clientKey: { type: string, format: uuid, description: 'Made by the client for one registration (AC13). Kept while the same request is retried after a failure; a new one is made after a success or when the user changes a field. Unique per clinic.' }
        identityUnknown: { type: boolean, description: 'The checkbox "Name not known yet"; the client always sends true or false. Allowed true only when Unknown patient registration is on. Missing, null or not a boolean: 400 field identityUnknown, "Reload the page and try again." (never read as false).' }
        name: { type: [string, 'null'], maxLength: 80, description: 'Required (not blank and at least one letter) unless identityUnknown; ignored when identityUnknown is true. IPD text rule (IpdText, listed on POST /emergency/cases).' }
        age: { type: [integer, 'null'], minimum: 0, maximum: 120, description: 'Age (approx.). Empty = null. A JSON number; a string such as "40" is refused.' }
        sex: { type: string, enum: [M, F, O], description: 'Male (default on the form), Female, Other.' }
        mobile: { type: [string, 'null'], pattern: '^[6-9][0-9]{9}$', description: 'Mobile of patient or relative (optional). Same 10-digit rule as a patient mobile, so the Admit hand-off can register it. Empty or null = none. On screen only; never logged.' }
        complaint: { type: string, maxLength: 200, description: 'Main complaint; not blank after trimming and at least one letter or digit; IPD text rule (IpdText, listed on POST /emergency/cases). Clinical text: never logged or audited.' }
        level: { $ref: '#/components/schemas/TriageLevel', description: 'Must be 1 to the clinic''s scale. A JSON number; a string such as "2" is refused.' }
    EmergencyLevelInput:
      type: object
      required: [level]
      properties:
        level: { $ref: '#/components/schemas/TriageLevel', description: 'Must be 1 to the clinic''s scale.' }
    EmergencySettingsInput:
      type: object
      description: 'SAH-28. Emergency and triage setup, sent whole on each change.'
      required: [scale, targets3, targets5, bays, unknownPatientRegistration]
      properties:
        scale: { $ref: '#/components/schemas/TriageScale' }
        targets3: { type: array, minItems: 3, maxItems: 3, items: { $ref: '#/components/schemas/TriageTarget' }, description: 'Targets of Red, Yellow, Green. Default [5, 30, 120]. Kept when the 5-level scale is in use.' }
        targets5: { type: array, minItems: 5, maxItems: 5, items: { $ref: '#/components/schemas/TriageTarget' }, description: 'Targets of Level 1 to Level 5. Default [0, 10, 30, 60, 120]. Kept when the 3-colour scale is in use.' }
        bays: { type: integer, minimum: 0, maximum: 10, description: 'Emergency bays (stepper, step 1). Default 2.' }
        unknownPatientRegistration: { type: boolean, description: 'Default true.' }
    EmergencySettings:
      allOf:
        - $ref: '#/components/schemas/EmergencySettingsInput'
        - type: object
          required: [levels, canEdit]
          properties:
            levels: { type: array, items: { $ref: '#/components/schemas/EmergencyLevel' }, description: 'The current scale''s levels with their targets: one setup row each ("<name> · <description>", hint "Target time to see a doctor", stepper "<name> target" from Now to 240 min in steps of 5).' }
            canEdit: { type: boolean, description: True for OWNER when IPD is not read-only; other roles see the page read-only. }
    EmergencyHandoff:
      type: object
      description: >-
        SAH-28. What the Admit-a-patient sheet needs from an emergency case (AC7). The sheet shows the subtitle
        "From Emergency", preselects Admission type emergency, fills Reason for admission with complaint and
        preselects suggestedBedId. The Patient field uses the existing patient search and registration
        (OQ-28-1): identityPending false opens the search with displayName and mobile; identityPending true
        opens "Register a new patient" with displayName, age and sex filled. Name, mobile and complaint are on
        screen only; never logged.
      required: [caseId, displayName, age, sex, mobile, complaint, identityPending, level, levelName, suggestedBedId]
      properties:
        caseId: { type: string, format: uuid, description: Send back as AdmissionInput.emergencyCaseId. }
        displayName: { type: string }
        age: { type: [integer, 'null'], minimum: 0, maximum: 120 }
        sex: { type: string, enum: [M, F, O] }
        mobile: { type: [string, 'null'], description: 'The mobile typed at registration, for the patient search or the registration dialog. Sent to the admit roles (OWNER, FRONT_DESK, NURSE). Read while the case is open; it is cleared when the case closes (released, referred or admitted; security review M1(a)). Opening the hand-off is audited (IPD_ER_HANDOFF_OPENED).' }
        complaint: { type: string, maxLength: 200, description: Prefills Reason for admission. }
        identityPending: { type: boolean }
        level: { $ref: '#/components/schemas/TriageLevel' }
        levelName: { type: string }
        suggestedBedId: { type: [string, 'null'], format: uuid, description: 'For level 1 (the most urgent level) the first Available ICU bed, otherwise the first Available General bed, in the order of AdmissionOptions.beds; when that category has no Available bed, the first Available bed of any category in that order (mockup openAdmit); null when no bed is Available, and the client shows the toast "No free bed. Mark a cleaned bed ready, or transfer a patient." and does not open the sheet.' }
    EwsRisk:
      type: string
      enum: [LOW, MEDIUM, HIGH]
      description: >-
        SAH-30. Risk of an early warning score, computed by the server only (ADR-006 D3): HIGH when the total is 7
        or more; MEDIUM when the total is 5 or more, or any one parameter scores 3; LOW otherwise. Labels Low,
        Medium, High; toasts and clinical events write them in lower case. Notice colour: LOW good (green), MEDIUM
        warn (amber), HIGH crit (red), always paired with the text.
    EwsSummary:
      type: object
      description: 'SAH-30. Score of one vitals record.'
      required: [score, risk, recordedAt]
      properties:
        score: { type: integer, minimum: 0, maximum: 15, description: 'Sum of the five parameter scores (each 0 to 3).' }
        risk: { $ref: '#/components/schemas/EwsRisk' }
        recordedAt: { type: string, format: date-time }
    LatestVitals:
      type: object
      description: >-
        SAH-30. The latest vitals record of the admission (recordedAt descending, then id descending). Clinical
        data: on screen only, never logged or audited. The five fields of the sheet are prefilled from it (AC2,
        mockup; OQ-30-8): BP with bp, Temp with tempC written with one decimal ("37.0"), the others as whole
        numbers.
      required: [id, bp, bpSystolic, bpDiastolic, pulse, spo2, tempC, rr, ewsScore, ewsRisk, recordedAt, recordedByName]
      properties:
        id: { type: string, format: uuid }
        bp: { type: string, pattern: '^[0-9]{2,3}/[0-9]{2,3}$', description: '"<bpSystolic>/<bpDiastolic>" without leading zeros, for example 120/80.' }
        bpSystolic: { type: integer, minimum: 40, maximum: 300 }
        bpDiastolic: { type: integer, minimum: 20, maximum: 200, description: Stored and shown; not scored. }
        pulse: { type: integer, minimum: 1, maximum: 300, description: Per minute. }
        spo2: { type: integer, minimum: 1, maximum: 100, description: Per cent. }
        tempC: { type: number, minimum: 25.0, maximum: 45.0, multipleOf: 0.1, description: 'Degrees Celsius, one decimal.' }
        rr: { type: integer, minimum: 1, maximum: 300, description: Breaths per minute. }
        ewsScore: { type: integer, minimum: 0, maximum: 15 }
        ewsRisk: { $ref: '#/components/schemas/EwsRisk' }
        recordedAt: { type: string, format: date-time, description: 'Database time of the save.' }
        recordedByName: { type: string, description: 'Display name of the user who saved it, by the same lookup as DepositEntry.collectedByName ("Team member" when the name cannot be found).' }
    NursingNote:
      type: object
      description: 'SAH-30. One nursing note. Shown "<ago> · <recordedByName>" and the text. Clinical text: on screen only, never logged or audited.'
      required: [id, text, recordedAt, recordedByName]
      properties:
        id: { type: string, format: uuid }
        text: { type: string, minLength: 1, maxLength: 1000, description: 'As stored: NFC, stripped at both ends, line breaks as LF.' }
        recordedAt: { type: string, format: date-time }
        recordedByName: { type: string, description: 'Same lookup as LatestVitals.recordedByName.' }
    NursingSheet:
      type: object
      description: >-
        SAH-30. The Nursing sheet, tab "Vitals and notes" (mockup pcNursing). Title "Nursing · <patientName>";
        subtitle "Bed <bedCode> · last vitals <ago of latest.recordedAt>", or "Bed <bedCode>" when latest is null
        (the mockup's assigned-nurse part is left out: ward assignment does not exist; card story). Body in this
        order: the score notice when latest is set, "Early warning score <ewsScore> · Low" + ". Routine vitals
        every 4 hours." (good), "· Medium" + ". Repeat vitals within 1 hour." (warn), "· High" + ". Inform the
        doctor now and repeat vitals every 30 minutes." (crit); the fields BP mmHg (placeholder 120/80), Pulse /min
        (80), SpO₂ % (98), Temp °C (37.0), RR /min (16), prefilled from latest; Nursing note (3 rows, placeholder
        "What you observed and did", always empty when the sheet opens); when readOnlyReason is ROLE the notice
        "Your role can view vitals but not record them."; Recent notes (recentNotes, or "No notes yet"). Footer
        Close, and "Save vitals and note" (check icon) only when canRecord. When canRecord is false the fields and
        the note are disabled. "Ago" text (formed by the client, from whole minutes m = (asOf - instant) rounded
        down, negative taken as 0): m under 60 "m min ago" (also "0 min ago"); from 60 "H h M min ago", or "H h
        ago" when M is 0 (H = m div 60, M = m mod 60; no days: 30 hours is "30 h ago"; mockup pcAgo).
        SAH-32 (AC1; mockup sfNsTabs): the sheet body starts with two tabs using the accessible tab pattern
        (role tablist with aria-label "Nursing", role tab, aria-selected, arrow keys move between tabs):
        "Vitals and notes" (heart icon, selected when the sheet opens; this sheet) and "Medicines (MAR)" (pill
        icon), followed by a small count doseCount shown only when above 0. Choosing "Medicines (MAR)" loads GET
        /admissions/{id}/mar (Mar) in the same sheet; choosing "Vitals and notes" loads this sheet again. Both
        tabs are shown to every role that can open the sheet (OWNER, NURSE, DOCTOR).
      required: [admissionId, patientName, bedCode, status, state, canRecord, readOnlyReason, asOf, latest, vitalsDue, recentNotes, doseCount]
      properties:
        latestRound:
          type: [object, 'null']
          description: '0.3.0 (SAH-67-1, ADR-025 D8). The latest daily progress note a doctor signed in the EMR for this admission; null when none. Shown above Recent notes as "Round done · <signedAt as 11:05 AM IST> · Dr. <doctorName>" and, when set, "Investigations advised: <investigationsAdvised>" (text only; no lab order is made, OQ-45-28). Clinical text: on screen only, never logged.'
          required: [roundDate, signedAt, doctorName, investigationsAdvised]
          properties:
            roundDate: { type: string, format: date }
            signedAt: { type: string, format: date-time }
            doctorName: { type: string }
            investigationsAdvised: { type: [string, 'null'], maxLength: 1000 }
        admissionId: { type: string, format: uuid }
        patientName: { type: string, description: 'For the title and the toasts. On screen only; never logged.' }
        bedCode: { type: string, description: 'The current bed; for a DISCHARGED admission the bed the patient left.' }
        status: { type: string, enum: [ADMITTED, DISCHARGED] }
        state: { type: string, enum: [trial, on, readonly], description: 'IPD state of the clinic; never off (Off answers 403).' }
        canRecord: { type: boolean, description: 'True only when both the token role and the role re-read from the active membership are OWNER or NURSE (so a shown Save is never refused for the role), while ADMITTED, when IPD is Trial or On.' }
        readOnlyReason:
          oneOf:
            - { type: string, enum: [ROLE, IPD_READONLY, NOT_ADMITTED] }
            - { type: 'null' }
          description: 'Null when canRecord is true. Otherwise the first that applies: ROLE (the token role or the membership role is DOCTOR: shows the notice "Your role can view vitals but not record them."), IPD_READONLY, NOT_ADMITTED. Only ROLE shows a notice (mockup; ADR-006 Q5).'
        asOf: { type: string, format: date-time, description: 'The database clock (clock_timestamp()) when the answer is built: at the read for GET, after the writes for a 201, at the replay for a 200. Never the application or device clock (review M1). Never before latest.recordedAt. Base of every "ago" text and of vitalsDue.' }
        latest: { oneOf: [{ $ref: '#/components/schemas/LatestVitals' }, { type: 'null' }], description: 'Null when no vitals were ever recorded for the admission: no notice, empty fields, subtitle without "last vitals".' }
        vitalsDue: { type: boolean, description: 'Same rule as AdmissionDetail.vitalsDue, with asOf as the read time (never null here: every role that can read the sheet may see vitals). Not shown on the sheet; for the later card.' }
        recentNotes: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/NursingNote' }, description: 'The last three notes of the admission, newest first: recordedAt descending, then id descending. Empty: "No notes yet".' }
        doseCount: { type: integer, minimum: 0, description: 'SAH-32 (AC1; ADR-011 D2, D12). The count on the tab "Medicines (MAR)": the slots of today (IST date of asOf) of the admission''s Active orders whose state is DUE or LATE (Mar.doseCount, same rule, same asOf). 0 for a DISCHARGED admission. Shown only when above 0. Added to the story''s technical note ("NursingSheet gains no field") so the badge shows on the default tab without a second request.' }
    VitalsInput:
      type: object
      description: >-
        SAH-30. The five vitals as typed in the five text fields, and the optional note. The vitals are strings so
        that the server is the only judge of the format and gives one message (no lossy JSON number coercion,
        mirrors the mockup's single BP field). The client may check the same format first and show the same toast
        without calling the server; the server always checks again. Format (AC4; message on every failing field
        "Enter all five vitals. BP as 120/80."): bp missing, null, or not ^[0-9]{2,3}/[0-9]{2,3}$ after stripping
        spaces at both ends (two whole numbers of 2 or 3 ASCII digits, "/" between, no space inside); pulse, spo2
        or rr missing, null, not ^[0-9]{1,3}$ after stripping, or 0; temp missing, null, not
        ^[0-9]{1,2}([.][0-9])?$ after stripping (at most one decimal, "." as the separator), or 0. Plausible
        range (OQ-30-4 proposal, to refuse typing mistakes such as 370 for 37.0 or 98.6 in Fahrenheit; checked
        only on a field whose format is right; this wording is the contract's, not the mockup's): systolic 40 to
        300 and diastolic 20 to 200 "Check the BP. Systolic 40 to 300, diastolic 20 to 200."; pulse 1 to 300
        "Check the pulse. Enter 1 to 300 per minute."; spo2 1 to 100 "Check the SpO₂. Enter 1 to 100 %."; temp
        25.0 to 45.0 "Check the temperature. Enter 25.0 to 45.0 °C."; rr 1 to 300 "Check the RR. Enter 1 to 300
        per minute." Bounds are inclusive. Systolic at or below diastolic is not refused (ADR-006 Q8).
      required: [clientKey, bp, pulse, spo2, temp, rr]
      properties:
        clientKey: { type: string, format: uuid, description: 'Made by the client when the sheet opens (pattern of SAH-28 EmergencyCaseInput.clientKey). Kept while the same values are retried after a failure; a new one after a success or when the user changes a field or the note. A repeat for the same admission with the same values (the five vitals and whether a note is sent) answers 200 with the first record and writes only the record-access row; with any value different it answers 409 client-key-reused and writes nothing.' }
        bp: { type: [string, 'null'], maxLength: 16, examples: ['120/80'], description: 'Systolic/diastolic mmHg.' }
        pulse: { type: [string, 'null'], maxLength: 16, examples: ['80'], description: 'Per minute, whole number.' }
        spo2: { type: [string, 'null'], maxLength: 16, examples: ['98'], description: 'Per cent, whole number.' }
        temp: { type: [string, 'null'], maxLength: 16, examples: ['37.0'], description: 'Degrees Celsius, at most one decimal.' }
        rr: { type: [string, 'null'], maxLength: 16, examples: ['16'], description: 'Breaths per minute, whole number.' }
        note:
          type: [string, 'null']
          maxLength: 4000
          description: >-
            Nursing note, optional (AC4). Missing, null, or empty after stripping at both ends = no note is stored
            and no error is given (noteAdded false, no nursing_note row; the vitals are saved). Stripping (SAH-33
            review fix, code review SAH-33 item 3, ADR-007 R6) removes at both ends every code point that is
            white space (Java Character.isWhitespace) or a space separator (Unicode general category Zs, so also
            U+00A0, U+2007, U+202F, U+1680, U+2000 to U+200A, U+205F, U+3000), together with line breaks; a note
            made only of such code points (for example only no-break spaces) counts as no note and nothing is
            stored. Steps, in this order (each failure is one field error on note and stops the note
            checks): (1) raw size: a raw note longer than 4,000 UTF-16 code units (Java String.length(), before
            any normalisation) 400 field note "Keep the note to 1,000 characters." (security review SAH-30 L8: no
            unbounded NFC; the schema maxLength 4000 is this raw bound, the stored limit is step 5); (2) Unicode
            NFC; (3) line breaks CR LF and CR become LF, and every tab (U+0009) becomes one space (U+0020) (review
            N7: a pasted tab is no longer refused); (4) the IPD text rule (IpdText, as the SAH-23 admission reason
            and the SAH-28 name and complaint) on the whole text before stripping, the LF being the one allowed
            control character (the field is a 3-row text area; ADR-006 Q7). Refused: every other control
            character (C0 other than tab and line breaks, DEL, C1), every Format (Cf) character (soft hyphen,
            direction marks and overrides, U+200B, U+2060 to U+2064, U+FEFF, tag characters), unassigned,
            private-use and surrogate code points, U+2028/U+2029, the blank-looking letters (U+115F, U+1160,
            U+3164, U+FFA0, U+2800, U+180E), U+034F and the variation selectors U+FE00 to U+FE0F; ZWJ or ZWNJ is
            allowed only directly after a virama and directly before a letter. Fine: letters of every script
            (Devanagari and the other Indian scripts with their conjuncts), digits, punctuation, symbols, spaces,
            tabs (stored as a space) and line breaks. Message (field note), unchanged: "Note cannot contain control
            or text-direction characters"; (5) stripped (white space and space separators, as above); more than 1,000 Unicode code points (a line break counts
            as one) 400 field note "Keep the note to 1,000 characters." Clinical text: never logged, audited or put
            in a clinical event.
    OpenEscalation:
      type: object
      description: 'SAH-30. The admission''s open early warning escalation (status OPEN or ACK) after the save. Acknowledge, response and senior calls are SAH-33 (Safety board; EscalationRow). After a REOPENED outcome status is OPEN, ewsRisk HIGH and targetMinutes 15.'
      required: [id, ewsScore, ewsRisk, targetMinutes, status, raisedAt]
      properties:
        id: { type: string, format: uuid }
        ewsScore: { type: integer, minimum: 0, maximum: 15, description: 'The highest score since it was raised.' }
        ewsRisk: { type: string, enum: [MEDIUM, HIGH] }
        targetMinutes: { type: integer, enum: [15, 60], description: '15 for HIGH, 60 for MEDIUM: "doctor review within 15 min" or "within 1 hour".' }
        status: { type: string, enum: [OPEN, ACK] }
        raisedAt: { type: string, format: date-time, description: 'The first raise; not changed by an update.' }
    VitalsSaved:
      description: 'SAH-30. Answer of POST /admissions/{id}/vitals: the Nursing sheet after the save (or now, for a replay), the saved record and the escalation outcome.'
      allOf:
        - $ref: '#/components/schemas/NursingSheet'
        - type: object
          required: [saved, escalation]
          properties:
            saved:
              type: object
              description: 'The record this request stored, or for a replay the record the first request with this clientKey stored. Source of the toast.'
              required: [vitalsId, ewsScore, ewsRisk, recordedAt, noteAdded, replayed]
              properties:
                vitalsId: { type: string, format: uuid }
                ewsScore: { type: integer, minimum: 0, maximum: 15 }
                ewsRisk: { $ref: '#/components/schemas/EwsRisk' }
                recordedAt: { type: string, format: date-time }
                noteAdded: { type: boolean, description: 'A note was stored with this record.' }
                replayed: { type: boolean, description: 'True on a 200 repeat of a clientKey with the same values: no vitals, note, escalation, event or audit was written by this request (only the record-access row).' }
            escalation:
              type: object
              required: [outcome, open]
              properties:
                outcome: { type: string, enum: [RAISED, UPDATED, REOPENED, NONE], description: 'What this request did to the escalation: RAISED a new one, UPDATED the open one to a higher score (status kept), REOPENED (SAH-33 AC12: an Acknowledged MEDIUM escalation went back to OPEN because the new risk is HIGH; acknowledgement cleared, response clock restarted), or NONE (LOW score, an open one with an equal or higher score, or a replay). The toast is the same for RAISED, UPDATED and REOPENED (AC22).' }
                open: { oneOf: [{ $ref: '#/components/schemas/OpenEscalation' }, { type: 'null' }], description: 'The open escalation of the admission after this request, whatever the outcome; null when none is open. Its targetMinutes goes in the escalation toast.' }
    EscalationStatus:
      type: string
      enum: [OPEN, ACK, DONE]
      description: >-
        SAH-33. OPEN = raised, not yet seen by a doctor; ACK = acknowledged by a doctor, response not recorded yet;
        DONE = closed. Transitions (ADR-007 D2, enforced in Java and by the database guard): OPEN to ACK
        (Acknowledge), OPEN or ACK to DONE (Close escalation, or the discharge close of ADR-007 D6), ACK to OPEN
        only when a vitals save raises the risk from MEDIUM to HIGH (REOPENED). DONE is final.
    EscalationResponseAction:
      type: string
      enum: [BEDSIDE_REVIEW, TREATMENT_CHANGED, MOVED_ICU_HDU, RAPID_RESPONSE, NO_CHANGE, CLOSED_AT_DISCHARGE]
      description: >-
        SAH-33. What was done. Labels, in the order of the select "What was done" (mockup sfresp):
        BEDSIDE_REVIEW "Reviewed at the bedside" (preselected), TREATMENT_CHANGED "Treatment changed",
        MOVED_ICU_HDU "Moved to ICU or HDU", RAPID_RESPONSE "Rapid response team called", NO_CHANGE "Reviewed, no
        change needed". CLOSED_AT_DISCHARGE "Closed at discharge" is set only by the discharge (ADR-007 D6) and is
        refused in a request (400 field action "Choose what was done").
    EscalationResponseActionOption:
      type: object
      required: [key, label]
      properties:
        key: { $ref: '#/components/schemas/EscalationResponseAction' }
        label: { type: string }
    EscalationResponse:
      type: object
      description: 'SAH-33. The recorded response of a closed escalation. note is clinical text: shown to OWNER, DOCTOR and NURSE on the board only; never in a notice, a toast, the clinical event log, an audit row or an application log.'
      required: [action, actionLabel, note, closedByName, closedAt]
      properties:
        action: { $ref: '#/components/schemas/EscalationResponseAction' }
        actionLabel: { type: string, description: 'The label of action (EscalationResponseAction).' }
        note: { type: [string, 'null'], maxLength: 1000, description: 'Plan and next vitals, as stored (NFC, stripped, line breaks as LF). Null only for CLOSED_AT_DISCHARGE.' }
        closedByName: { type: string, description: 'Who closed it ("Team member" when not found). Returned, not shown in this story (ADR-007 Q7: the closed line shows the acknowledging doctor, as the mockup).' }
        closedAt: { type: string, format: date-time, description: 'Database clock at the close.' }
    EscalationRow:
      type: object
      description: >-
        SAH-33. One row of the panel "Early warning escalations" (mockup escRow). Display, in this order: the
        badge with ewsScore and the word "High" or "Medium" (crit for HIGH, warn for MEDIUM; always with the word);
        "<patientName> · bed <bedCode>" in bold; the small line "Raised by <raisedByName> <ago of
        minutesSinceRaised> · target 15 min" ("target 1 hour" when targetMinutes is 60), followed by " ·
        escalated to senior <seniorCalls>×" when seniorCalls is above 0; for ACK the small line (eye icon)
        "Acknowledged by <acknowledgedByName> · response not recorded yet"; for DONE the small line (check icon)
        "<response.actionLabel> · <response.note> · <acknowledgedByName>" (mockup e.ack; ADR-007 Q7); the status
        pill: OPEN and not pastTarget "Not seen" (crit), OPEN and pastTarget "Overdue · not seen" (crit, row
        highlighted), ACK "Doctor reviewing" (warn), DONE "Closed" (good); the buttons: Acknowledge (primary) when
        canAcknowledge; Record response when canRespond (primary for ACK, secondary for OPEN); Call senior (siren
        icon; primary when pastTarget, secondary otherwise) when canCallSenior. "Ago" text as NursingSheet (m
        under 60 "m min ago", from 60 "H h M min ago" or "H h ago"), built from the whole minutes sent here, never
        from the device clock. Names and the plan are on screen only; never logged. The Response sheet (Record
        response): title "Response · <patientName>", subtitle "EWS <ewsScore> (<ewsRisk in lower case>) · raised
        <ago of minutesSinceRaised> by <raisedByName>", the select "What was done" (SafetyBoard.responseActions,
        the first preselected), the text area "Plan and next vitals" (3 rows, placeholder "For example: oxygen
        increased to 6 L, repeat vitals in 30 minutes"), footer Cancel and "Close escalation" (check icon); the
        sheet sends version as it was when the sheet opened.
      required: [id, admissionId, version, patientName, bedCode, ewsScore, ewsRisk, targetMinutes, status, raisedAt, raisedByName, minutesSinceRaised, reopenedAt, waitingMinutes, pastTarget, seniorCalls, acknowledgedByName, acknowledgedAt, response, canAcknowledge, canRespond, canCallSenior]
      properties:
        id: { type: string, format: uuid }
        admissionId: { type: string, format: uuid }
        version: { type: integer, minimum: 0, description: 'Send back on every action; a changed version answers 409 escalation-changed (AC13). Raised by 1 on every change of status, score, risk, target, acknowledgement or response; not by a senior call.' }
        patientName: { type: string, description: 'On screen only; never logged. "Patient" when the patient record cannot be found (a data fault; the row is never dropped from a safety board).' }
        bedCode: { type: string, description: 'The current bed.' }
        ewsScore: { type: integer, minimum: 3, maximum: 15, description: 'The highest score of the current open period (replaced on update or re-open).' }
        ewsRisk: { type: string, enum: [MEDIUM, HIGH] }
        targetMinutes: { type: integer, enum: [15, 60], description: '15 for HIGH, 60 for MEDIUM (as stored by SAH-30).' }
        status: { $ref: '#/components/schemas/EscalationStatus' }
        raisedAt: { type: string, format: date-time, description: 'The first raise; never changed (also after a re-open).' }
        raisedByName: { type: string, description: 'The nurse who saved the vitals that raised it ("Team member" when not found).' }
        minutesSinceRaised: { type: integer, minimum: 0, description: 'Whole minutes from raisedAt to asOf, rounded down. The "ago" of the row and of the Response sheet subtitle.' }
        reopenedAt: { type: [string, 'null'], format: date-time, description: 'Set when the escalation was re-opened by a risk rise (AC12); the response clock then starts here. Not shown in this story (ADR-007 Q5).' }
        waitingMinutes: { type: integer, minimum: 0, description: 'Whole minutes from the start of the response clock (reopenedAt, else raisedAt) to asOf, rounded down. The "ago" of the red notice.' }
        pastTarget: { type: boolean, description: 'status OPEN and the exact time from the start of the response clock to asOf is more than targetMinutes (ADR-007 D5: at 15:00 not past, after it past). Always false for ACK and DONE: acknowledging stops the overdue state (mockup).' }
        seniorCalls: { type: integer, minimum: 0, description: 'Times a nurse used Call senior. Send back as SeniorCallInput.seniorCalls.' }
        acknowledgedByName: { type: [string, 'null'], description: 'Set for ACK, and for DONE when a doctor acknowledged or closed it (the closing doctor when it was closed from OPEN). Null for OPEN.' }
        acknowledgedAt: { type: [string, 'null'], format: date-time, description: 'Database clock at the acknowledgement (or at the close from OPEN). Not shown in this story (OQ-33-6 open).' }
        response: { oneOf: [{ $ref: '#/components/schemas/EscalationResponse' }, { type: 'null' }], description: 'Set for DONE only.' }
        canAcknowledge: { type: boolean, description: 'status OPEN and the token role and the membership role are both OWNER or DOCTOR. Not affected by Read-only (DEC-015 OQ-33-9).' }
        canRespond: { type: boolean, description: 'status OPEN or ACK and both roles OWNER or DOCTOR.' }
        canCallSenior: { type: boolean, description: 'status OPEN and both roles NURSE.' }
    SafetyCounts:
      type: object
      description: 'SAH-33. Counts only, no names (ADR-005 D3). Escalations of ADMITTED admissions of the clinic; from SAH-35 also the dose slots of the Medicine round (ADR-012 D3). The Safety tab number is open + dosesLate (+ PharmacistChecksSummary.waiting + emergencyAccessWaiting for OWNER; SAH-34 AC 71, OQ-34-30), hidden at 0 (mockup sfCount).'
      required: [open, pastTarget, dosesDue, dosesLate, changeToken, asOf]
      properties:
        open: { type: integer, minimum: 0, description: 'Escalations with status OPEN or ACK. Part of the number next to the Safety tab name (with dosesLate, and waiting and emergencyAccessWaiting for OWNER) and the tile "Escalations open"; always equal to the rows of SafetyBoard.escalations that are not DONE.' }
        dosesDue: { type: integer, minimum: 0, description: 'SAH-35. Dose slots of today in state DUE (from 60 whole minutes before to 60 whole minutes after the slot time, no dose record) of ACTIVE orders of ADMITTED admissions (DoseSlots, ADR-011 D2; ADR-012 D1). LATE slots are not included. The tile "Doses due or overdue" shows dosesDue + dosesLate. Not added to the tab number (OQ-35-3). Always the full count, also when MedicineRound.truncated is true.' }
        dosesLate: { type: integer, minimum: 0, description: 'SAH-35. Dose slots of today in state LATE (more than 60 whole minutes after the slot time, no dose record) of ACTIVE orders of ADMITTED admissions. The tile small text "<dosesLate> overdue" ("0 overdue" when none; the figure in crit when above 0) and the dose term of the tab number. Always the full count.' }
        pastTarget: { type: integer, minimum: 0, description: 'Escalations with pastTarget true.' }
        changeToken: { type: string, minLength: 22, maxLength: 22, pattern: '^[A-Za-z0-9_-]{22}$', description: 'SAH-33 review fix (code review SAH-33 item 2, ADR-007 R1). Opaque; the client only compares it for equality with the last one it saw and reloads the board or the banner when it, open or pastTarget differ. Computed from the same snapshot as open and pastTarget: a hash of the id and version of every escalation counted in open (status OPEN or ACK of ADMITTED admissions), with no name, score or text in it (ADR-007 R1 gives the exact rule). It changes when such an escalation is raised, acknowledged, closed, re-opened or gets a higher score; not on a senior call (version unchanged) and not when only the minutes pass. SAH-35 (ADR-012 D3): the sorted lines also hold one line per dose slot counted in dosesDue or dosesLate (all of them, not only the 200 rows), "dose:<order id lower case>:<slotAt as epoch seconds>:<LATE or DUE>", with the same join, SHA-256, 16 bytes and base64url; with no dose in the window the token is the SAH-33 token. It then also changes when a dose is recorded by anyone, a slot enters the window or turns from DUE to LATE, or an order or admission with a slot in the window starts or ends; not when only lateHours grows. No name, medicine or text is in it.' }
        asOf: { type: string, format: date-time, description: 'Database clock the counts were computed at.' }
        emergencyAccessWaiting: { type: integer, minimum: 0, description: 'SAH-34 (34F, AC 64, AC 71; OQ-34-30, a deviation from the mockup''s sfCount). OWNER only (token role and membership role); absent for every other role. Emergency access grants of the clinic with no review yet (also expired, discharged or of an inactive grantee). The same figure as the tile "Emergency access", SafetyBoard.emergencyAccess.waiting and the panel rows; added to the OWNER''s Safety tab number (open + dosesLate + PharmacistChecksSummary.waiting + emergencyAccessWaiting). For OWNER, when at least one grant is unreviewed, the changeToken also holds exactly one sorted line "bg:<count>:<newest grant id lower case>", where count is this figure (decimal, no padding) and the newest grant is the unreviewed one with the latest opened_at, then the highest id (order by opened_at desc, id desc limit 1, partial index ix_emergency_access_grant_unreviewed); with none unreviewed there is no bg line (SAH-34 security review finding 4, 10 Nov 2026, replacing the earlier one line per unreviewed grant, which read every id). A new grant changes the newest id; a review alone lowers the count; so a new grant or a review changes it. Same hash, length and pattern as before; clients compare for equality only and need no change (every OWNER token differs once after the deploy, which costs one reload).' }
    SafetyBannerItem:
      type: object
      required: [escalationId, admissionId, patientName, ewsScore]
      properties:
        escalationId: { type: string, format: uuid }
        admissionId: { type: string, format: uuid }
        patientName: { type: string, description: 'On screen only; never logged.' }
        ewsScore: { type: integer, minimum: 3, maximum: 15 }
    AdmissionSafety:
      type: object
      description: >-
        SAH-33 (AC19, mockup sfban), part of AdmissionList for OWNER, DOCTOR and NURSE. When pastTarget is not
        empty the Admitted patients tab shows at the top the notice (crit, siren icon) "<patientName> · EWS
        <ewsScore>, <patientName> · EWS <ewsScore>" in bold (items joined with ", ") followed by " escalated and
        not seen by a doctor within target." and the primary button "Open safety board", which switches to the
        Safety tab. With pastTarget empty there is no banner. SAH-35 (ADR-012 D3): counts carries dosesDue and
        dosesLate from the same function as GET /safety and GET /safety/summary (GET /admissions runs the two
        dose reads for OWNER, DOCTOR and NURSE only, without names), so the Safety tab number (counts.open +
        counts.dosesLate, plus waiting and counts.emergencyAccessWaiting for OWNER, SAH-34 AC 71) is right on
        page load and the change token equals the
        summary's at the same snapshot. When the summary's changeToken differs on this tab the client reloads
        GET /admissions, at most once per 60-second poll. SAH-36 (ADR-013 D7): while the Admitted tab is shown
        and the browser tab is visible, the client reloads GET /admissions itself every 60 seconds and takes the
        tab number and the token from each answer's counts, so it does not poll GET /safety/summary on that tab;
        the summary poll on the other tabs is unchanged. The banner stays above the toolbar in both views.
      required: [counts, pastTarget]
      properties:
        counts: { $ref: '#/components/schemas/SafetyCounts' }
        pastTarget: { type: array, items: { $ref: '#/components/schemas/SafetyBannerItem' }, description: 'OPEN escalations past target, in SafetyBoard.escalations order.' }
    SafetyBoard:
      type: object
      description: >-
        SAH-33. The Safety tab (mockup ipSafety), top to bottom (AC2): (1) when counts.pastTarget is above 0 the
        red notice (crit, siren icon): in bold "1 escalation past the response target." or "<n> escalations past
        the response target.", then for each escalation with pastTarget true, in escalations order, "<patientName>
        (EWS <ewsScore>) raised <ago of waitingMinutes>" joined with "; ", then ".", then " Acknowledge, then
        record what you did." when view is DOCTOR or " Call the senior doctor now." when view is NURSE; (2) the
        tiles: "Escalations open" with counts.open (in crit when counts.pastTarget is above 0) and the small text
        "<counts.pastTarget> past target" (crit) or "All within target"; for view NURSE a second tile "Your
        patients" with yourPatients and the small text "In your wards" (mockup; OQ-33-2 open: until wards exist it
        counts every admitted patient); SAH-31 (ADR-009 D11): for OWNER only, right after "Escalations open", the
        tile "Pharmacist checks" with PharmacistChecks.waiting (warn when above 0) and the small text "Orders waiting
        before the first dose", from GET /pharmacist-checks; SAH-35 (ADR-012 D7): for OWNER, DOCTOR and NURSE,
        after "Pharmacist checks" (OWNER) or "Escalations open" and before "Your patients" (NURSE), the tile "Doses
        due or overdue" with counts.dosesDue + counts.dosesLate (in crit when counts.dosesLate is above 0) and the
        small text "<counts.dosesLate> overdue"; the tile of SAH-34 (Emergency access) is not shown; (3) the panel
        "Early warning escalations" (siren icon), subtitle "High score: doctor within 15 min. Medium: within 1
        hour. A nurse can call the senior doctor if the target passes.", the rows (EscalationRow), empty "No
        escalations. Scores of 5 and above raise one automatically when vitals are saved."; (4) SAH-31, for OWNER
        only: the panel "Pharmacist check" (PharmacistChecks, loaded with GET /pharmacist-checks; shieldu icon);
        SAH-35: the panel "Medicine round" (MedicineRound, pill icon) for OWNER, DOCTOR and NURSE; (5) the panel
        "Clinical audit trail" (ClinicalEventPage, loaded with GET /clinical-events). Emergency access (SAH-34) is
        not shown.
        SAH-34 (ADR-017; replaces the two "not shown" sentences above and the OQ-33-2 note on yourPatients):
        every row and count is on the caller's scope (AC 15); for view NURSE the note above the tiles from
        scope ("This board shows your wards only (<visible> of <admitted> patients)." when scope.kind is WARDS and
        hasWard; "No wards are assigned to you, so this board shows no patients." when hasWard is false; no note
        when ALL), and the tile "Your patients" with small text "In your wards" (WARDS) or "All admitted
        patients" (ALL). For OWNER only, the fourth tile "Emergency access" with emergencyAccess.waiting and the
        small text "Waiting for your review" (warn when above 0), and, when waiting is above 0, the panel
        "Emergency access to review" (key icon) below "Medicine round" and above "Clinical audit trail", subtitle
        "Staff opened patients outside their wards. Check each reason.", rows EmergencyAccessReviewRow, button
        "Show 25 more" while emergencyAccess.nextCursor is not null (GET /emergency-access). x-needs-human
        (OQ-34-26): when otherWardsPastTarget is above 0 a red notice "<n> escalation(s) past the response
        target in other wards. Tell the doctor now, or use Emergency access if you must act." (no names).
      required: [state, view, asOf, counts, yourPatients, responseActions, escalations, medicineRound]
      properties:
        scope: { $ref: '#/components/schemas/SafetyScope', description: 'SAH-34 (34B AC 19, 34C AC 37). Sent for view NURSE only (with kind ALL when the switch is off, or WARDS); absent for view DOCTOR, that is OWNER and DOCTOR, who are never narrowed (AC 18).' }
        emergencyAccess: { $ref: '#/components/schemas/EmergencyAccessReviewPage', description: 'SAH-34 (34F). OWNER only (token role and membership role); absent for every other role, which never receives the tile or the panel. The first page (up to 25 rows, oldest first) read in the board''s transaction; waiting equals counts.emergencyAccessWaiting.' }
        otherWardsPastTarget:
          type: integer
          minimum: 0
          x-needs-human: 'OQ-34-26 (SAFETY; needs the human and the clinical sign-off OQ-30-6). A business-analyst addition (story AC 20, AC 37), not in the mockup or ADR-016. Optional: if the human says no, this field and its red notice are dropped and nothing else in the contract changes.'
          description: 'SAH-34 (AC 20). Present only for view NURSE with scope.kind WARDS (also with hasWard false); absent for OWNER, DOCTOR and an unscoped NURSE. The number of OPEN escalations of ADMITTED admissions outside the caller''s scope that are past their response target (EscalationRow.pastTarget rule, same asOf), 0 when none. A number only: no name, bed, ward, score or id. Computed as one aggregate in the board''s transaction, never by loading out-of-scope rows. Not part of counts, the tiles, the tab number or the rows.'
        state: { type: string, enum: [trial, on, readonly], description: 'IPD state; never off (403). The actions stay allowed in readonly (DEC-015 OQ-33-9).' }
        view: { type: string, enum: [DOCTOR, NURSE], description: 'From the membership role: DOCTOR for OWNER and DOCTOR, NURSE for NURSE. Chooses the notice ending, the second tile and the audit trail subtitle.' }
        asOf: { type: string, format: date-time, description: 'Database clock (clock_timestamp()) of this answer; base of every minute count and of pastTarget. The time shown in "Could not refresh. Showing data from <time>."' }
        counts: { $ref: '#/components/schemas/SafetyCounts' }
        yourPatients: { type: [integer, 'null'], minimum: 0, description: 'view NURSE: admitted patients the nurse can see (SAH-34: equals scope.visible; every admitted patient while the clinic switch is off). Null for view DOCTOR.' }
        responseActions: { type: array, items: { $ref: '#/components/schemas/EscalationResponseActionOption' }, description: 'The five doctor actions in select order (never CLOSED_AT_DISCHARGE).' }
        escalations: { type: array, items: { $ref: '#/components/schemas/EscalationRow' }, description: 'Every escalation of every ADMITTED admission that is OPEN or ACK, and every DONE one closed within the last 24 hours before asOf (SAH-33 review fix, security review L5, OQ-33-13 proposal, ADR-007 R5; older closed ones are in the clinical audit trail only): not DONE first, then ewsScore descending, then the earlier response clock start (reopenedAt, else raisedAt) first (a tie-break not in the mockup), then id (java.util.UUID order; deterministic only, it carries no meaning, ADR-007 R7).' }
        medicineRound: { $ref: '#/components/schemas/MedicineRound' }
    MedicineRoundSlotState:
      type: string
      enum: [LATE, DUE]
      description: 'SAH-35. The two MarSlotState values listed in the Medicine round (ADR-011 D2, same whole-minute rule): LATE more than 60 whole minutes after the slot time; DUE from 60 whole minutes before to 60 whole minutes after it.'
    MedicineRoundRow:
      type: object
      description: >-
        SAH-35. One row of the panel "Medicine round" (mockup doseRow): one dose slot of today, with no dose
        record, of an ACTIVE order of an ADMITTED admission. Display, in this order: drugName in bold, followed
        for a high-alert medicine (highAlert not null) by the red pill "High-alert" (crit; the class is not shown
        here, mockup); the small line "<patientName> · bed <bedCode> · <slot time> dose" with the slot time in
        IST as "8 AM", "2 PM", "8:30 AM" (minutes left out when 0); the status pill "<lateHours> h late" (crit)
        for LATE or "Due now" (warn) for DUE (the text always carries the meaning, never the colour alone); the
        primary button "Give" when MedicineRound.canGive, accessible name "Give <drugName> to <patientName>",
        target at least 44 px. Give loads GET /admissions/{admissionId}/mar once and opens the SAH-32 Give sheet
        for orderId and slotAt (ADR-012 D4). Names and medicine on screen only; never logged, never in a toast
        seen by another user.
      required: [admissionId, orderId, slotAt, state, lateHours, drugName, highAlert, patientName, bedCode]
      properties:
        admissionId: { type: string, format: uuid, description: 'For the MAR read on Give (GET /admissions/{id}/mar).' }
        orderId: { type: string, format: uuid, description: 'MarOrder.orderId in the MAR answer; the path id of POST /medicine-orders/{id}/doses.' }
        slotAt: { type: string, format: date-time, description: 'The dose time of today as an instant; matched against MarSlot.slotAt and sent as DoseInput.slotAt.' }
        state: { $ref: '#/components/schemas/MedicineRoundSlotState' }
        lateHours: { type: [integer, 'null'], minimum: 1, description: 'For LATE: whole hours late, rounded down (61 to 119 minutes is 1); null for DUE. The pill "<lateHours> h late".' }
        drugName: { type: string, maxLength: 80, description: 'From the drug catalogue.' }
        highAlert: { type: [string, 'null'], maxLength: 40, description: 'Anticoagulant, Insulin or Concentrated electrolyte; null for other medicines. Not null shows the pill "High-alert".' }
        patientName: { type: string, description: 'Read through patient.api at display time; "Patient" when the record cannot be found (a data fault; the row is never dropped). On screen only; never logged.' }
        bedCode: { type: string, description: 'The current bed of the admission.' }
    MedicineRound:
      type: object
      description: >-
        SAH-35 (ADR-012). The panel "Medicine round" (pill icon), below "Pharmacist check" (OWNER) or "Early
        warning escalations" and above "Clinical audit trail": subtitle "Doses due in the next hour and doses
        not given on time. Clock: <SafetyBoard.asOf as 11:05 AM>." (server clock in IST, never the device clock);
        when giveLockReason is IPD_READONLY the line (lock icon) "IPD is read-only. Doses cannot be recorded."
        (DEC-018 text; OQ-35-8); the rows (MedicineRoundRow) or, when rows is empty, "No doses due right now.";
        when truncated the line "Showing the 200 most overdue doses." (contract wording, OQ-35-4, OQ-35-9). The
        tile and the tab number use SafetyBoard.counts (full counts), never the number of rows. No text says
        that anyone was alerted (no notifications in phase 1).
      required: [canGive, giveLockReason, truncated, rows]
      properties:
        canGive: { type: boolean, description: 'Token role and membership role both NURSE or OWNER, and IPD Trial or On (ADR-012 D6). When false no row shows a Give button. A convenience only: POST /medicine-orders/{id}/doses checks everything again.' }
        giveLockReason:
          oneOf:
            - { type: string, enum: [ROLE, IPD_READONLY] }
            - { type: 'null' }
          description: 'Null when canGive is true; otherwise the first that applies: ROLE (DOCTOR: rows without Give and no line; OQ-35-1) or IPD_READONLY (rows without Give and the read-only line).'
        truncated: { type: boolean, description: 'True when more than 200 slots qualify; rows then holds the first 200 in the order below.' }
        rows:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/MedicineRoundRow' }
          description: 'LATE before DUE; inside each, slotAt ascending (most late first, mockup); tie-break not in the mockup (OQ-35-4): bedCode ascending (code-point order), then drugName ascending, then orderId (java.util.UUID order; deterministic only). At most 200 (ADR-012 D2).'
    EscalationVersionInput:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 0, description: 'EscalationRow.version as shown. A JSON number; a string such as "3" is refused (field version, "Reload the page and try again.").' }
    EscalationResponseInput:
      type: object
      required: [version, action, note]
      properties:
        version: { type: integer, minimum: 0, description: 'EscalationRow.version when the Response sheet opened.' }
        action: { $ref: '#/components/schemas/EscalationResponseAction', description: 'One of the five doctor actions; CLOSED_AT_DISCHARGE or any other value 400 field action "Choose what was done".' }
        note:
          type: [string, 'null']
          maxLength: 4000
          description: >-
            Plan and next vitals (required). The rules of VitalsInput.note (SAH-30, OQ-33-14), in this order, each
            failure one field error on note that stops the note checks: (1) raw longer than 4,000 UTF-16 code
            units, before any normalisation: "Keep the plan to 1,000 characters."; (2) Unicode NFC; (3) CR LF and
            CR become LF, a tab becomes one space; (4) the IPD text rule (IpdText) with LF as the one allowed
            control character: "Plan cannot contain control or text-direction characters"; (5) stripped at both
            ends, where stripping removes every code point that is white space (Java Character.isWhitespace) or a
            space separator (Unicode Zs: also U+00A0, U+2007, U+202F, U+1680, U+2000 to U+200A, U+205F, U+3000)
            and line breaks (SAH-33 review fix, code review item 3, ADR-007 R6; the same stripping as
            VitalsInput.note): missing, null or empty after it, for example a plan of only no-break spaces, "Write
            the plan and when vitals are next due." (story and mockup; the server refuses it even when the client
            check is skipped, AC10); more
            than 1,000 Unicode code points "Keep the plan to 1,000 characters.". Stored as the result of steps 2
            to 5. Clinical text: never logged, audited or put in a clinical event (DEC-015 OQ-33-7).
    SeniorCallInput:
      type: object
      required: [version, seniorCalls]
      properties:
        version: { type: integer, minimum: 0, description: 'EscalationRow.version as shown.' }
        seniorCalls: { type: integer, minimum: 0, description: 'EscalationRow.seniorCalls as shown. Compared with the stored count (POST /escalations/{id}/call-senior, ADR-007 R4): equal, the call is recorded (unless the same user called in the last 60 seconds); stored higher, the call was already recorded (by the caller: nothing written; by another user: an "already called" entry for the caller); stored lower, 409 escalation-changed.' }
    EscalationActionResult:
      type: object
      description: 'SAH-33. Answer of acknowledge, respond and call-senior. The client builds the toast from escalation.patientName and then reloads the board (AC20).'
      required: [asOf, replayed, escalation]
      properties:
        asOf: { type: string, format: date-time, description: 'Database clock after the writes.' }
        replayed: { type: boolean, description: 'True when this request did not make the change itself: the same user''s earlier request already did it (ADR-007 D7), or, on call-senior, the same user called within the last 60 seconds, or another user''s call was already recorded (then only the "already called" entry is written; ADR-007 R4). Nothing is audited on a replay. The toast is the same.' }
        escalation: { $ref: '#/components/schemas/EscalationRow' }
    ClinicalEventKind:
      type: string
      enum: [give, order, verify, esc, view, bg, deny, stop, info]
      description: 'SAH-30/33. Icon of the entry (mockup kic): give pill, order emr, verify shieldu, esc siren, view eye, bg key, deny alert, stop x, info history. SAH-30 and SAH-33 write info and esc only; SAH-31 writes view, deny, order, stop and verify (ADR-009 D7); SAH-32 writes give (dose given or not given) and deny (stopped at the wristband check) (ADR-011 D9); SAH-34 writes bg: "Emergency access opened · <reason label>" (EmergencyAccessReasonKey labels) and "Reviewed emergency access" (ADR-017 D6), each linked to its grant; a refused out-of-scope request writes no entry (OQ-34-24).'
    ClinicalEvent:
      type: object
      description: >-
        SAH-33. One entry of the panel "Clinical audit trail": the kind icon, text in bold, the small line
        "<actorName>" followed by " · <patientName> · bed <bedCode>" when admissionId is set, and the time on the
        right: "11:05 AM" when the IST date of at is the IST date of ClinicalEventPage.asOf, otherwise "24 Oct,
        11:05 AM" (IST).
      required: [id, kind, text, at, actorName, admissionId, patientName, bedCode]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/ClinicalEventKind' }
        text: { type: string, minLength: 1, maxLength: 300, description: 'Fixed template text with numbers (and, from SAH-31/32, medicine names; from SAH-32 the second nurse''s display name in "second check by <name>" and UHIDs in the wristband deny entry, ADR-011 D9); never a patient name, mobile, ABHA number or note.' }
        at: { type: string, format: date-time }
        actorName: { type: string, description: 'Read at display time; "Team member" when not found.' }
        admissionId: { type: [string, 'null'], format: uuid }
        patientName: { type: [string, 'null'], description: 'Read from the admission''s patient when the list is built (never stored in the entry); null when admissionId is null; "Patient" when the record cannot be found. On screen only; never logged.' }
        bedCode: { type: [string, 'null'], description: 'The admission''s current bed, or the last bed for a discharged patient (not the bed at the time of the entry; ADR-007 D13). Null when admissionId is null.' }
        grantStaffName: { type: string, description: 'SAH-34 (34F, AC 70; OQ-34-20). Present only on the bg entry "Reviewed emergency access": the name of the staff member who opened the reviewed grant, read at display time through the entry''s grant id ("Team member" when not found); never stored in the entry. The client shows "Reviewed emergency access by <grantStaffName>" (the mockup''s text). Absent on every other entry. On screen only; never logged.' }
    ClinicalEventPage:
      type: object
      required: [asOf, items, nextCursor]
      properties:
        asOf: { type: string, format: date-time, description: 'Database clock of the answer; decides "today" for the time format.' }
        items: { type: array, items: { $ref: '#/components/schemas/ClinicalEvent' }, description: 'Newest first (at descending, then seq descending). Empty first page: "Nothing recorded yet."' }
        nextCursor: { type: [string, 'null'], maxLength: 64, description: 'Set when older entries exist: send as cursor with limit 50 for "Show earlier entries". Opaque (ADR-007 D13); a cursor that does not decode is refused (400).' }
    DrugKey:
      type: string
      pattern: '^[a-z0-9_]{1,20}$'
      description: >-
        SAH-31. Key of a medicine of the catalogue (ipd.drug; ADR-009 D3). Starting list (demo content from the
        mockup SF_DRUGS, OQ-31-1, blocking for go-live), in select order: pcm "Tab. Paracetamol 650 mg" (Oral),
        panto "Inj. Pantoprazole 40 mg" (IV), ondan "Inj. Ondansetron 4 mg" (IV), ns "IV Normal saline 500 ml"
        (IV), ceft "Inj. Ceftriaxone 1 g" (IV, cephalosporin), amox "Tab. Amoxicillin + clavulanate 625 mg" (Oral,
        penicillin), pip "Inj. Piperacillin + tazobactam 4.5 g" (IV, penicillin), cotri "Tab. Cotrimoxazole 960
        mg" (Oral, sulfa), asp "Tab. Aspirin 75 mg" (Oral, antiplatelet), ibu "Tab. Ibuprofen 400 mg" (Oral,
        NSAID), met "Tab. Metformin 500 mg" (Oral), hep "Inj. Heparin 5,000 IU" (SC, anticoagulant, high-alert
        Anticoagulant), ins "Inj. Regular insulin, sliding scale" (SC, insulin, high-alert Insulin), kcl "Inj.
        Potassium chloride 20 mmol in 500 ml" (IV infusion, potassium, high-alert Concentrated electrolyte). A
        key not in the catalogue is refused (400 field drugKey "Choose a medicine from the list"). Not editable
        by a clinic.
    FrequencyKey:
      type: string
      enum: [od, bd, tds, q8]
      description: >-
        SAH-31. How often (mockup SF_FREQ), labels in select order: od "Once daily", bd "Twice daily", tds "Three
        times daily", q8 "8-hourly". Dose times (IST, for SAH-32): od 8:00 AM; bd 8:00 AM and 8:00 PM; tds 8:00
        AM, 2:00 PM and 8:00 PM; q8 6:00 AM, 2:00 PM and 10:00 PM. Any other value 400 field frequencyKey "Choose
        how often" (contract wording).
    OverrideReasonKey:
      type: string
      enum: [BENEFIT_MONITORED, SPECIALIST_ADVISED, ALLERGY_HISTORY_CHECKED, CARDIOLOGY_STENT]
      description: >-
        SAH-31. Reason to continue past a warning (mockup SF_OVR; demo content, OQ-31-1), labels in select order:
        BENEFIT_MONITORED "Benefit outweighs the risk, monitoring in place", SPECIALIST_ADVISED "Specialist
        advised this combination", ALLERGY_HISTORY_CHECKED "Allergy history checked with the patient: mild rash
        only, no anaphylaxis", CARDIOLOGY_STENT "Recent coronary stent, cardiology advised". Any other value 400
        field overrideReasonKey "Choose a reason from the list" (contract wording).
    RejectReasonKey:
      type: string
      enum: [ALLERGY_CONFLICT, INTERACTION_RISK, WRONG_DOSE, DUPLICATE_THERAPY]
      description: >-
        SAH-31. "Reason, sent to the doctor" of a rejection (mockup sfrej), labels in select order:
        ALLERGY_CONFLICT "Allergy conflict" (preselected), INTERACTION_RISK "Interaction risk too high",
        WRONG_DOSE "Wrong dose or frequency", DUPLICATE_THERAPY "Duplicate therapy". Nothing is sent in phase 1;
        the doctor reads it in the EMR list.
    MedicineOrderStatus:
      type: string
      enum: [PENDING, ACTIVE, REJECTED, STOPPED]
      description: >-
        SAH-31. Pill labels and colours (mockup SF_ST): PENDING "Pharmacist check" (warn, amber), ACTIVE "Active"
        (good, green), REJECTED "Rejected" (crit, red), STOPPED "Stopped" (wait, grey). Transitions (ADR-009 D1,
        enforced in Java and by the database guard): PENDING to ACTIVE (verify), PENDING to REJECTED (reject),
        PENDING or ACTIVE to STOPPED (stop). REJECTED and STOPPED are final. SAH-32 (ADR-011 D2, D15): PENDING
        and ACTIVE orders are listed on the MAR (PENDING slots "Waiting for pharmacist"; only ACTIVE slots can
        be given); REJECTED and STOPPED orders are not listed and their slots can no longer be recorded. SAH-31
        must be released together with SAH-32 (its toasts name the MAR).
    AllergyStatus:
      type: string
      enum: [NONE_KNOWN, NOT_RECORDED, RECORDED]
      description: >-
        SAH-31. The allergy chip of the identity bar (mockup sfIdBar; story AC2), computed by the server (ADR-009
        D2, keyword list extended after security review S1), first that applies: the text names an allergy
        class the check knows (any case; also matched with hyphens and spaces removed, so "Co-trimoxazole"
        matches; penicillin: "penicillin", "amoxic", "amoxy", "cillin", "augmentin", "pcn"; sulfa: "sulfa",
        "sulpha", "sulf", "sulph", "cotrimox", "septran", "bactrim") RECORDED; the text contains "none known"
        NONE_KNOWN; the text is null, empty after stripping, contains "not recorded", or is only "unknown", "not
        known" (a final full stop ignored) or only question marks ("?") NOT_RECORDED; otherwise RECORDED. Demo
        keyword matching, not clinically validated (OQ-31-1, OQ-31-4: blocking for go-live). Chip: NONE_KNOWN "No known
        allergies" (good, check icon); NOT_RECORDED "Allergies not recorded" (nr style, alert icon); RECORDED
        "Allergy: <allergyText>" (crit, alert icon). The first rule is safer than the mockup, which shows the
        green chip for a text such as "Penicillin; none known otherwise".
    FindingCode:
      type: string
      enum: [ALLERGY_PENICILLIN, ALLERGY_SULFA, DUPLICATE, ALLERGY_CROSS_CEPHALOSPORIN, ALLERGIES_NOT_RECORDED, INTERACTION]
      description: 'SAH-31. Which rule of MedicineSafetyCheck found it (ADR-009 D2). The first three are hard stops, the others warnings.'
    OrderFinding:
      type: object
      description: >-
        SAH-31. One finding of the safety check, with the exact text of the story and the mockup (sfCheck):
        ALLERGY_PENICILLIN "Documented allergy: <allergy text>. <drug name> is a penicillin."; ALLERGY_SULFA
        "Documented allergy: <allergy text>. <drug name> is a sulfa drug."; DUPLICATE "<drug name> is already on
        the chart. Change the existing order instead of adding a second one."; ALLERGY_CROSS_CEPHALOSPORIN
        (Moderate) "Penicillin allergy: possible cross-reaction with cephalosporins. Confirm what reaction the
        patient had."; ALLERGIES_NOT_RECORDED (Moderate) "Allergies are not recorded. Ask the patient and record
        them before the first dose."; INTERACTION "<rule text> (<other drug name> is on the chart).", rule texts
        "Bleeding risk: heparin with aspirin" (Major), "Bleeding risk: heparin with an NSAID" (Major), "Stomach
        bleeding risk: aspirin with an NSAID" (Moderate). The text may hold the patient's allergy text: clinical
        data, on screen only; never logged, audited or put in a clinical event or a problem detail.
      required: [code, severity, otherDrugKey, text]
      properties:
        code: { $ref: '#/components/schemas/FindingCode' }
        severity: { type: string, enum: [HARD_STOP, MAJOR, MODERATE], description: 'HARD_STOP for a hard stop; a warning is shown "<Major|Moderate>: <text>" (the severity in bold in the notices, plain in the queue rows).' }
        otherDrugKey: { oneOf: [{ $ref: '#/components/schemas/DrugKey' }, { type: 'null' }], description: 'For DUPLICATE and INTERACTION the drug on the chart; null otherwise.' }
        text: { type: string, minLength: 1, maxLength: 600 }
    OrderCheck:
      type: object
      description: 'SAH-31. Result of MedicineSafetyCheck for one drug against the admission''s live orders (Pharmacist check and Active, the checked order itself excluded) and the patient''s allergy text, run by the server now. Outcome: any hard stop blocks; else any warning needs a reason; else clear.'
      required: [allergyStatus, hardStops, warnings, checkToken]
      properties:
        allergyStatus: { $ref: '#/components/schemas/AllergyStatus' }
        hardStops: { type: array, items: { $ref: '#/components/schemas/OrderFinding' }, description: 'In check order (allergy classes penicillin then sulfa, then duplicate). The first one is the one named in the "Order blocked" log entry.' }
        warnings: { type: array, items: { $ref: '#/components/schemas/OrderFinding' }, description: 'In check order (cephalosporin cross-reaction, allergies not recorded, then interactions in chart order and rule order).' }
        checkToken: { type: string, minLength: 22, maxLength: 22, pattern: '^[A-Za-z0-9_-]{22}$', description: 'Opaque fingerprint of allergyStatus and the findings (codes, severities, other drug keys; no text; ADR-009 D2). Send back as MedicineOrderInput.checkToken with a reason, and as VerifyOrderInput.checkToken; a different current token means the findings changed.' }
    DrugOption:
      type: object
      description: 'SAH-31. One option of the select "Medicine": "<name>", or "<name> · high-alert" when highAlert is set (mockup).'
      required: [key, name, route, highAlert]
      properties:
        key: { $ref: '#/components/schemas/DrugKey' }
        name: { type: string, maxLength: 80 }
        route: { type: string, maxLength: 20, description: 'Oral, IV, SC or IV infusion.' }
        highAlert: { type: [string, 'null'], maxLength: 40, description: 'High-alert group (Anticoagulant, Insulin, Concentrated electrolyte), null for other medicines.' }
    KeyLabel:
      type: object
      description: 'SAH-31. One option of a fixed select: the key sent to the server and the label shown.'
      required: [key, label]
      properties:
        key: { type: string }
        label: { type: string }
    EmrPatient:
      type: object
      description: >-
        SAH-31. The identity bar (mockup sfIdBar), always at the top of the EMR sheet and of the Pharmacist check
        sheet: name in bold; small line "<uhid> · <age> · <Male|Female|Other> · bed <bedCode>" (sex M Male, F
        Female, O Other); the allergy chip by allergyStatus. On screen only; never logged.
      required: [patientId, name, uhid, age, sex, bedCode, allergyText, allergyStatus]
      properties:
        patientId: { type: string, format: uuid }
        name: { type: string }
        uhid: { type: string }
        age: { type: [integer, 'null'] }
        sex: { type: [string, 'null'], enum: [F, M, O, null] }
        bedCode: { type: string, description: 'Current bed; for a DISCHARGED admission the bed the patient left.' }
        allergyText: { type: [string, 'null'], maxLength: 400, description: 'The patient file''s allergy field as stored (SAH-8), read through patient.api. Clinical data: on screen only, never logged, audited or put in a clinical event.' }
        allergyStatus: { $ref: '#/components/schemas/AllergyStatus' }
    MedicineOrderRow:
      type: object
      description: >-
        SAH-31. One order in the block "Medicines on chart" (mockup sfOrdBlock list): the drug name, then the red
        pill "High-alert" when highAlert is set; the small line "<route> · <frequencyLabel> · <orderedByName>",
        followed by " · override: <overrideReason.label>" when overrideReason is set and, for REJECTED, " ·
        rejected: <rejectReason.label>" (OQ-31-5; contract wording); the status pill (MedicineOrderStatus); the
        button "Stop" (sm, ghost) when canStop. SAH-32 (OQ-32-4, ADR-011 D11): when lastDose is set, a second
        small line under it (contract wording, not in the mockup): "Last dose <slot>: Given · <time of
        recordedAt> · <last word of recordedByName>", "Last dose <slot>: Refused · <reason.label>" or "Last dose
        <slot>: Not given · <reason.label>" (the two not-given lines in warn colour), where <slot> is "8 AM" when
        the IST date of slotAt is the IST date of EmrSheet.asOf, otherwise "24 Oct, 8 PM". Names on screen only.
      required: [id, drugKey, drugName, route, highAlert, frequencyKey, frequencyLabel, status, orderedByName, orderedAt, overrideReason, verifiedByName, verifiedAt, rejectReason, rejectedByName, rejectedAt, stoppedByName, stoppedAt, canStop, lastDose]
      properties:
        id: { type: string, format: uuid }
        drugKey: { $ref: '#/components/schemas/DrugKey' }
        drugName: { type: string }
        route: { type: string }
        highAlert: { type: [string, 'null'] }
        frequencyKey: { $ref: '#/components/schemas/FrequencyKey' }
        frequencyLabel: { type: string }
        status: { $ref: '#/components/schemas/MedicineOrderStatus' }
        orderedByName: { type: string, description: '"Team member" when not found.' }
        orderedAt: { type: string, format: date-time }
        overrideReason: { oneOf: [{ $ref: '#/components/schemas/KeyLabel' }, { type: 'null' }], description: 'Key is an OverrideReasonKey.' }
        verifiedByName: { type: [string, 'null'] }
        verifiedAt: { type: [string, 'null'], format: date-time }
        rejectReason: { oneOf: [{ $ref: '#/components/schemas/KeyLabel' }, { type: 'null' }], description: 'Key is a RejectReasonKey; set for REJECTED only.' }
        rejectedByName: { type: [string, 'null'] }
        rejectedAt: { type: [string, 'null'], format: date-time }
        stoppedByName: { type: [string, 'null'] }
        stoppedAt: { type: [string, 'null'], format: date-time }
        canStop: { type: boolean, description: 'status PENDING or ACTIVE, the admission ADMITTED, and the token role and the membership role both OWNER or DOCTOR. Allowed in Read-only state (ADR-009 D1).' }
        lastDose: { oneOf: [{ $ref: '#/components/schemas/DoseRow' }, { type: 'null' }], description: 'SAH-32 (OQ-32-4, ADR-011 D11): the dose record of this order with the latest slotAt (any day, any outcome), for every status including STOPPED; null when no dose was recorded. This is where the doctor sees "Not given" and "Refused" ("The doctor sees this on the chart.").' }
    EmrSheet:
      type: object
      description: >-
        SAH-31. The EMR sheet (mockup pcEmr). Title "EMR · <patient.name>"; subtitle "<patient.uhid> · <age> ·
        <Male|Female|Other> · <admittingDoctorName>". Body in this order, the identity bar and the strip always at
        the top: (1) the identity bar (EmrPatient); (2) the strip with "Diagnosis" (diagnosis) and "Day"
        (dayNumber) (the mockup's third item "Stage" belongs to the patient card story and is not shown); (3) the
        block "Medicines on chart" with the small text "Doctor's orders · pharmacist checked before the first
        dose", the orders (MedicineOrderRow) or "No medicines ordered yet"; (4) when canOrder the order form:
        "Medicine" (select of drugs, "<name>" or "<name> · high-alert"), "How often" (select of frequencies),
        the notices of the last check (POST /admissions/{id}/medicine-orders), the button "Check and order"
        (shieldu icon) or "Order with this reason", "Clear" once a check ran, and the hint "Checks allergies,
        duplicates and interactions. A pharmacist checks every order before the first dose."; when
        orderLockReason is ROLE the line "Only doctors can order medicines." with a lock icon instead (story AC4);
        IPD_READONLY the line "IPD is read-only. Medicines can be stopped but not added." and NOT_ADMITTED the
        line "This patient is not admitted any more.", shown in the same way as the ROLE line (review fix R6,
        DEC-017 "Review decisions"; contract wording, not in the mockup); (5) the line (eye icon) "Opening this record is logged in the
        clinical audit trail."; footer "Done". The mockup's block "Results" is not built (no results module;
        story). The sheet is loaded when it opens and after each action answer; it is not polled.
      required: [admissionId, status, state, asOf, patient, admittingDoctorName, diagnosis, dayNumber, orders, canOrder, orderLockReason, drugs, frequencies, overrideReasons]
      properties:
        admissionId: { type: string, format: uuid }
        status: { type: string, enum: [ADMITTED, DISCHARGED] }
        state: { type: string, enum: [trial, on, readonly], description: 'IPD state; never off (403).' }
        asOf: { type: string, format: date-time, description: 'Database clock of the answer.' }
        patient: { $ref: '#/components/schemas/EmrPatient' }
        admittingDoctorName: { type: string, description: 'As AdmissionRow.doctorName.' }
        diagnosis: { type: string, description: 'The reason for admission (AdmissionDetail.reason). Clinical text: on screen only.' }
        dayNumber: { type: integer, minimum: 1, description: 'Billed bed days, as AdmissionRow.dayNumber (one number on every screen).' }
        orders: { type: array, items: { $ref: '#/components/schemas/MedicineOrderRow' }, description: 'Every order of the admission (never deleted), chart order: orderedAt ascending, then id. Not paged (ADR-009 D8).' }
        canOrder: { type: boolean, description: 'Token role and membership role both OWNER or DOCTOR, the admission ADMITTED and IPD Trial or On.' }
        orderLockReason:
          oneOf:
            - { type: string, enum: [ROLE, IPD_READONLY, NOT_ADMITTED] }
            - { type: 'null' }
          description: 'Null when canOrder is true; otherwise the first that applies, each with one line in place of the order form: ROLE (NURSE) "Only doctors can order medicines."; IPD_READONLY "IPD is read-only. Medicines can be stopped but not added."; NOT_ADMITTED "This patient is not admitted any more." (the last two: review fix R6, DEC-017; contract wording, not in the mockup).'
        drugs: { type: array, items: { $ref: '#/components/schemas/DrugOption' }, description: 'The catalogue in select order (14 in the starting list); the first is preselected.' }
        frequencies: { type: array, items: { $ref: '#/components/schemas/KeyLabel' }, description: 'The four FrequencyKey options in select order; the first is preselected.' }
        overrideReasons: { type: array, items: { $ref: '#/components/schemas/KeyLabel' }, description: 'The four OverrideReasonKey options in select order, shown after "Choose a reason" (no reason preselected).' }
    MedicineOrderInput:
      type: object
      description: >-
        SAH-31. Body of POST /admissions/{id}/medicine-orders. Field messages (400 validation, every field error
        together): clientKey missing or not a UUID "Reload the page and try again."; drugKey missing, null or not
        in the catalogue "Choose a medicine from the list"; frequencyKey missing, null or not one of FrequencyKey
        "Choose how often"; overrideReasonKey present and not one of OverrideReasonKey "Choose a reason from the
        list" (story AC5: 400 for a reason not in the list); checkToken present and not 22 characters of A-Z a-z
        0-9 _ - "Reload the page and try again.". The last three texts are contract wording. Unknown properties are
        ignored.
      required: [clientKey, drugKey, frequencyKey]
      properties:
        clientKey: { type: string, format: uuid, description: 'Idempotency key (pattern of SAH-28/30; ADR-009 D4): a repeat with the same values answers the first order (200, replayed true); with other values 409 client-key-reused.' }
        drugKey: { $ref: '#/components/schemas/DrugKey' }
        frequencyKey: { $ref: '#/components/schemas/FrequencyKey' }
        overrideReasonKey: { oneOf: [{ $ref: '#/components/schemas/OverrideReasonKey' }, { type: 'null' }], description: 'Only after an answer NEEDS_REASON. Ignored (not stored) when the check finds no warning.' }
        checkToken: { type: [string, 'null'], minLength: 22, maxLength: 22, pattern: '^[A-Za-z0-9_-]{22}$', description: 'check.checkToken of the NEEDS_REASON answer the doctor saw; required together with overrideReasonKey, otherwise the answer is NEEDS_REASON again.' }
    MedicineOrderAnswer:
      type: object
      description: 'SAH-31. Answer of POST /admissions/{id}/medicine-orders: 201 PLACED; 200 BLOCKED, NEEDS_REASON, or PLACED with replayed true. The client must switch on outcome (ADR-009 D4).'
      required: [outcome, replayed, check, order, sheet]
      properties:
        outcome: { type: string, enum: [PLACED, BLOCKED, NEEDS_REASON] }
        replayed: { type: boolean, description: 'True only for PLACED by an earlier request with the same clientKey; nothing was written by this request except a record-access row.' }
        check: { $ref: '#/components/schemas/OrderCheck', description: 'For PLACED the check as it was when the order was placed by this request (for a replay: run now, for information).' }
        order: { oneOf: [{ $ref: '#/components/schemas/MedicineOrderRow' }, { type: 'null' }], description: 'The placed order for PLACED (source of the toast); null otherwise.' }
        sheet: { $ref: '#/components/schemas/EmrSheet', description: 'The EMR sheet now (no view entry is written for it).' }
    PharmacistCheckRow:
      type: object
      description: >-
        SAH-31. One waiting order of the panel "Pharmacist check" (mockup pendRow): in bold "<drugName> ·
        <frequencyLabel>"; the small line "<patient.name> · bed <patient.bedCode> · <allergy> · ordered by
        <orderedByName> at <time of orderedAt>" where <allergy> is patient.allergyText, or "Allergies not
        recorded" when it is null or empty, and the time is "11:05 AM" when the IST date of orderedAt is the IST
        date of PharmacistChecks.asOf, otherwise "24 Oct, 11:05 AM" (contract wording; the mockup shows
        "Yesterday"); every check.hardStops text (crit, alert icon); every check.warnings as "<Major|Moderate>:
        <text>" (warn, alert icon); "Doctor's reason: <overrideReason.label>" when set; the buttons "Reject"
        (ghost) and "Verify" (primary). Verify is disabled when canVerify is false, with the hint by
        verifyLockReason: HARD_STOP "Hard stop: reject this order" (mockup), SELF "The doctor who ordered this
        cannot verify it. Ask the pharmacist." (story), IPD_READONLY "IPD is read-only. Nothing can be changed.".
        The Verify sheet (mockup sfver): title "Pharmacist check · <drugName>", subtitle "<patient.name> ·
        <patient.uhid> · ordered by <orderedByName>"; the identity bar (EmrPatient); when check.warnings is not
        empty the warn notice with one line per warning "<Major|Moderate>: <text>" (severity in bold) and
        "Doctor's reason: <overrideReason.label>" (bold label) when set, otherwise the good notice "No allergy,
        duplicate or interaction found."; "Verified by" (PharmacistChecks.verifierName, read-only: the mockup's
        list of names is not built) and "PIN" (4 digits, numeric keypad, masked, never prefilled, cleared after
        every answer); footer "Cancel" and "Verify order" (check icon); it sends checkToken of this row. PIN
        states (ADR-010 D12, contract wording, not in the mockup): when the sheet opens the client reads GET
        /api/v1/platform/me/pin; available false: in place of the PIN field the warn notice "PIN checks are not
        available right now. Try again later." and Verify order disabled; NOT_SET (or a 409 pin-not-set answer,
        after which the client reads GET /me/pin again and picks the text below by notSetReason, never by the
        detail text; if that read shows SET, the PIN field is shown again; review fix R4): the warn notice "You have not set your PIN yet. Set it to verify orders." (RESET_BY_OWNER: "The clinic
        owner reset your PIN. Set a new one to verify orders."; TOO_MANY_LOCKS: "Your PIN was switched off after
        too many wrong tries. Set a new one to verify orders.") with the button "Set my PIN" (key icon), which
        opens the Set PIN sheet and comes back to this sheet with the PIN field after a save, and Verify order
        disabled; LOCKED (or a 403 pin-locked answer): the warn notice "Your PIN is locked after 5 wrong tries.
        Try again at <lockedUntil as 11:20 AM>." with the link button "Set a new PIN", and Verify order disabled
        until lockedUntil; SET: the PIN field. The Reject sheet
        (mockup sfrej): title "Reject · <drugName>", subtitle "<patient.name> · ordered by <orderedByName>", the
        select "Reason, sent to the doctor" (PharmacistChecks.rejectReasons, the first preselected), footer
        "Cancel" and "Reject order" (red). Names and allergy text on screen only; never logged.
      required: [orderId, admissionId, drugKey, drugName, highAlert, frequencyKey, frequencyLabel, patient, orderedByName, orderedAt, overrideReason, check, canVerify, verifyLockReason, canReject]
      properties:
        orderId: { type: string, format: uuid }
        admissionId: { type: string, format: uuid }
        drugKey: { $ref: '#/components/schemas/DrugKey' }
        drugName: { type: string }
        highAlert: { type: [string, 'null'] }
        frequencyKey: { $ref: '#/components/schemas/FrequencyKey' }
        frequencyLabel: { type: string }
        patient: { $ref: '#/components/schemas/EmrPatient' }
        orderedByName: { type: string }
        orderedAt: { type: string, format: date-time }
        overrideReason: { oneOf: [{ $ref: '#/components/schemas/KeyLabel' }, { type: 'null' }] }
        check: { $ref: '#/components/schemas/OrderCheck', description: 'Run now, the order itself excluded from the live orders.' }
        canVerify: { type: boolean, description: 'No hard stop now, the order not placed by the caller, IPD Trial or On, and the token and membership roles both PHARMACIST or OWNER. Does not depend on the PIN (checked on the request).' }
        verifyLockReason:
          oneOf:
            - { type: string, enum: [HARD_STOP, SELF, IPD_READONLY] }
            - { type: 'null' }
          description: 'Null when canVerify is true; otherwise the first that applies in the order HARD_STOP, SELF, IPD_READONLY.'
        canReject: { type: boolean, description: 'Token and membership roles both PHARMACIST or OWNER; allowed in Read-only state.' }
    PharmacistChecks:
      type: object
      description: >-
        SAH-31. The panel "Pharmacist check" (shieldu icon) with the subtitle "Every new order is checked before
        the first dose. The person who ordered cannot verify it.", the rows (PharmacistCheckRow) or, when waiting
        is 0, "No orders waiting."; then "Show more orders" while nextCursor is set. Also the tile "Pharmacist
        checks" (waiting; small text "Orders waiting before the first dose"; warn colour when above 0). For
        OWNER they sit inside the Safety tab of SAH-33 (SafetyBoard order); for PHARMACIST the Safety tab shows
        only this tile and this panel (ADR-009 D11, decided in DEC-017).
      required: [state, asOf, waiting, verifierName, rejectReasons, items, nextCursor]
      properties:
        state: { type: string, enum: [trial, on, readonly] }
        asOf: { type: string, format: date-time, description: 'Database clock of the answer; decides "today" for the time format.' }
        waiting: { type: integer, minimum: 0, description: 'All PENDING orders of ADMITTED admissions of the clinic (not only this page).' }
        verifierName: { type: string, description: 'The signed-in user''s display name, for "Verified by" in the Verify sheet.' }
        rejectReasons: { type: array, items: { $ref: '#/components/schemas/KeyLabel' }, description: 'The four RejectReasonKey options in select order.' }
        items: { type: array, items: { $ref: '#/components/schemas/PharmacistCheckRow' }, description: 'Oldest first: orderedAt ascending, then id ascending.' }
        nextCursor: { type: [string, 'null'], maxLength: 64, description: 'Opaque; send as cursor for the next page. Null on the last page.' }
    PharmacistChecksSummary:
      type: object
      description: 'SAH-31. Counts only (ADR-005 D3): no names, drugs or text.'
      required: [waiting, changeToken, asOf]
      properties:
        waiting: { type: integer, minimum: 0 }
        changeToken: { type: string, minLength: 22, maxLength: 22, pattern: '^[A-Za-z0-9_-]{22}$', description: 'Opaque; compare for equality only. Hash of the sorted id and version of every counted order (ADR-007 R1 encoding; ADR-009 D8). Changes when an order starts or stops waiting.' }
        asOf: { type: string, format: date-time }
    VerifyOrderInput:
      type: object
      required: [pin, checkToken]
      properties:
        pin: { type: [string, 'null'], maxLength: 16, examples: ['4821'], description: 'The signed-in verifier''s own personal staff PIN (ADR-010; set with PUT /api/v1/platform/me/pin). Exactly 4 ASCII digits, else 400 field pin "Enter the 4-digit PIN.". A string, so leading zeros survive. Never logged, audited, stored in clear or echoed.' }
        checkToken: { type: [string, 'null'], description: 'PharmacistCheckRow.check.checkToken as shown in the sheet; 22 characters of A-Z a-z 0-9 _ -, else 400 field checkToken "Reload the page and try again.".' }
    RejectOrderInput:
      type: object
      required: [reasonKey]
      properties:
        reasonKey: { oneOf: [{ $ref: '#/components/schemas/RejectReasonKey' }, { type: 'null' }], description: 'Missing, null or any other value 400 field reasonKey "Choose a reason" (contract wording).' }
    PharmacistActionResult:
      type: object
      description: 'SAH-31. Answer of verify and reject. The client builds the toast from result and shows checks (the first page of the queue now; pages loaded before with "Show more orders" collapse to this first page, accepted, review R10). The checks page carried here shows patient names and allergy text, so it writes one record-access row per distinct patient on it, in the same transaction, exactly as GET /pharmacist-checks does (ADR-009 Q17, decided by the tech lead in the safer direction, DEC-017).'
      required: [result, checks]
      properties:
        result:
          type: object
          required: [orderId, drugName, outcome, replayed, actorName, rejectReason]
          properties:
            orderId: { type: string, format: uuid }
            drugName: { type: string }
            outcome: { type: string, enum: [VERIFIED, REJECTED] }
            replayed: { type: boolean, description: 'True when the same user''s earlier request already did it; nothing was written by this request.' }
            actorName: { type: string, description: 'The verifier or rejecter (the caller): "<drugName> verified by <actorName>. It is now on the MAR."' }
            rejectReason: { oneOf: [{ $ref: '#/components/schemas/KeyLabel' }, { type: 'null' }], description: 'For REJECTED: "Order rejected · <label>."' }
        checks: { $ref: '#/components/schemas/PharmacistChecks' }
    NotGivenReasonKey:
      type: string
      enum: [PATIENT_REFUSED, HELD_DOCTOR, NIL_BY_MOUTH, NOT_AVAILABLE, AWAY_FROM_WARD]
      description: >-
        SAH-32. Reason of "If you are not giving it" (mockup sfGive select sf-why), labels in select order:
        PATIENT_REFUSED "Patient refused", HELD_DOCTOR "Held on doctor's advice", NIL_BY_MOUTH "Nil by mouth",
        NOT_AVAILABLE "Medicine not available", AWAY_FROM_WARD "Patient away from the ward". PATIENT_REFUSED is
        stored as outcome REFUSED, every other reason as HELD (AC8).
    DoseOutcome:
      type: string
      enum: [GIVEN, HELD, REFUSED]
      description: 'SAH-32. Stored outcome of a dose record (ADR-011 D1). Slot texts: GIVEN "<time of recordedAt> · <last word of recordedByName>"; HELD "Not given · <reason.label>"; REFUSED "Refused · <reason.label>".'
    DoseRow:
      type: object
      description: >-
        SAH-32. One recorded dose (ipd.dose_administration; append-only, never changed or deleted). Times in IST
        as "8 AM", "8:04 AM" (minutes left out when 0). Names on screen only; never logged.
      required: [id, slotAt, outcome, reason, recordedAt, recordedByName, secondCheckByName]
      properties:
        id: { type: string, format: uuid }
        slotAt: { type: string, format: date-time, description: 'The dose time this record is for.' }
        outcome: { $ref: '#/components/schemas/DoseOutcome' }
        reason: { oneOf: [{ $ref: '#/components/schemas/KeyLabel' }, { type: 'null' }], description: 'Key is a NotGivenReasonKey; null for GIVEN.' }
        recordedAt: { type: string, format: date-time, description: 'Database clock at the insert (clock_timestamp()).' }
        recordedByName: { type: string, description: 'The nurse or owner who recorded it; "Team member" when not found. The chip shows its last word (mockup), the hint "Given by <recordedByName>".' }
        secondCheckByName: { type: [string, 'null'], description: 'The second nurse of a high-alert GIVEN dose; hint ", checked by <name>". Null otherwise; "Team member" when not found.' }
    MarSlotState:
      type: string
      enum: [GIVEN, HELD, REFUSED, NOT_RECORDED, WAITING, BEFORE_START, LATE, DUE, LATER]
      description: >-
        SAH-32. State of one slot of today, computed by the server (DoseSlots, ADR-011 D2) against Mar.asOf, first
        that applies: a dose record → GIVEN, HELD or REFUSED (see DoseOutcome; GIVEN with a check icon); the
        admission is not ADMITTED → NOT_RECORDED (grey, "<time>" and the small text "Not recorded"; contract
        wording); the order is PENDING → WAITING (grey, "Waiting for pharmacist"); the order was verified today
        and the slot is more than 60 minutes before verifiedAt → BEFORE_START (grey, "Before the order started";
        contract wording; AC10, OQ-32-2); more than 60 whole minutes after the slot time → LATE (red button,
        "<lateHours> h late · Give"); from 60 minutes before to 60 minutes after → DUE (amber button, "Due now ·
        Give"); more than 60 whole minutes before → LATER (grey, "Later today", not clickable). Whole minutes are
        rounded down: exactly 60 minutes after is DUE, 61 is LATE; exactly 60 minutes ahead is DUE, 61 is LATER.
        The mockup's "N min late" text never occurs.
    MarSlot:
      type: object
      description: 'SAH-32. One dose time of today (mockup sfSlotChip): the time ("8 AM", "2 PM", "8:30 AM") on top, the small text by state below.'
      required: [slotAt, state, lateHours, canGive, dose]
      properties:
        slotAt: { type: string, format: date-time, description: 'The dose time of today (IST date of Mar.asOf) as an instant; send it back as DoseInput.slotAt.' }
        state: { $ref: '#/components/schemas/MarSlotState' }
        lateHours: { type: [integer, 'null'], minimum: 1, description: 'For LATE: whole hours late, rounded down (61 to 119 minutes is 1); null otherwise. Also the Give sheet subtitle part " · <lateHours> h late".' }
        canGive: { type: boolean, description: 'State DUE or LATE, the order ACTIVE and Mar.canGive. The slot of state DUE or LATE is a button; it is disabled when canGive is false (AC3, AC4).' }
        dose: { oneOf: [{ $ref: '#/components/schemas/DoseRow' }, { type: 'null' }], description: 'The record for GIVEN, HELD, REFUSED; null otherwise.' }
    MarOrder:
      type: object
      description: >-
        SAH-32. One order block of the MAR (mockup sfMar row and sfMedHead): the drug name in bold; for a
        high-alert medicine the red pill (alert icon) "High-alert · <highAlert>" with the hint "High-alert
        medicine: a second nurse checks every dose"; the small line "<route> · <frequencyLabel> ·
        <orderedByName>"; the status pill "Pharmacist check" (warn) or "Active" (good); the row of slots; for
        PENDING the line (lock icon) "Cannot be given until the pharmacist checks the order.".
      required: [orderId, drugKey, drugName, route, highAlert, frequencyKey, frequencyLabel, orderedByName, status, slots]
      properties:
        orderId: { type: string, format: uuid }
        drugKey: { $ref: '#/components/schemas/DrugKey' }
        drugName: { type: string, maxLength: 80 }
        route: { type: string, maxLength: 20 }
        highAlert: { type: [string, 'null'], maxLength: 40, description: 'Anticoagulant, Insulin or Concentrated electrolyte; null for other medicines. The Give sheet step 2 title uses it in lower case.' }
        frequencyKey: { $ref: '#/components/schemas/FrequencyKey' }
        frequencyLabel: { type: string }
        orderedByName: { type: string, description: '"Team member" when not found.' }
        status: { type: string, enum: [PENDING, ACTIVE] }
        slots: { type: array, minItems: 1, maxItems: 3, items: { $ref: '#/components/schemas/MarSlot' }, description: 'One per dose time of the frequency, in time order.' }
    SecondNurseOption:
      type: object
      description: 'SAH-32. One option of "Checked by" in the Give sheet (high-alert step).'
      required: [membershipId, name]
      properties:
        membershipId: { type: string, format: uuid, description: 'Send as DoseInput.secondNurseId.' }
        name: { type: string, description: 'Display name. On screen only.' }
    Mar:
      type: object
      description: >-
        SAH-32. The tab "Medicines (MAR)" of the Nursing sheet (mockup sfMar). Title stays "Nursing ·
        <patient.name>"; subtitle "Bed <patient.bedCode> · medicine round, today <time of asOf>" (IST, "11:05
        AM"; the mockup's assigned-nurse part is left out as in NursingSheet: ward assignment does not exist).
        Body in this order: the tabs (NursingSheet; "Medicines (MAR)" selected, count doseCount); the identity bar
        (patient, EmrPatient: name, "<uhid> · <age> · <Male|Female|Other> · bed <bedCode>", allergy chip); when
        giveLockReason is IPD_READONLY the line "IPD is read-only. Doses cannot be recorded." and when
        NOT_ADMITTED the line "This patient is not admitted any more." (lock icon; contract wording, ADR-011 D3;
        ROLE shows no line, the buttons are disabled, mockup); the order blocks (MarOrder) or, when orders is
        empty, "No medicines on the chart. The doctor orders them from EMR."; the closing line (shieldu icon)
        "Every dose needs the wristband scan and the patient's name and date of birth. High-alert medicines also
        need a second nurse."; footer the primary button "Done". The Give sheet (mockup sfGive), opened from a
        slot with canGive: title "Give · <drugName>"; subtitle "<slot time> dose · <route> · <frequencyLabel>"
        plus " · <lateHours> h late" when LATE; the identity bar; step "1 · Confirm the patient with two
        identifiers" with the box (accessible name "Wristband MRN", placeholder "Scan the wristband or type the
        MRN", autocomplete off; it accepts typing and a keyboard-type barcode scanner; Enter in the box does not
        submit), a polite live line under it for the mismatch message, and the checkbox "The patient said their
        name and date of birth, or a relative confirmed them"; for a high-alert medicine step "2 · Second nurse
        check · high-alert <highAlert in lower case>" with the small text "A second nurse checks the drug, dose,
        patient and route, then enters their PIN.", "Checked by" (select, "Choose a nurse" first, then
        secondNurses) and "Their PIN" (4 digits, numeric keypad, masked, autocomplete off, never prefilled,
        cleared after every answer; under it the reason of a PIN answer and, in the cases of POST
        /medicine-orders/{id}/doses, the SAH-38 ward line "No second PIN works? Do not give this medicine yet.
        Choose another nurse, or ask the nurse in charge or the clinic owner. Never share a PIN.", also shown at
        once when secondNurses is empty); the last step "2 · If you are not giving it" ("3 ·" for a high-alert
        medicine) with "Reason" (select, "Choose a reason" first, then notGivenReasons); footer "Record not
        given" (ghost) and "Given" (primary, check icon). There is no "Scan wristband" button (OQ-32-1, ADR-011
        D4: the mockup's button copies the patient's own UHID, so the check would pass by itself). Names, UHID
        and allergy text on screen only; never logged.
      required: [admissionId, status, state, asOf, patient, doseCount, canGive, giveLockReason, orders, secondNurses, notGivenReasons]
      properties:
        admissionId: { type: string, format: uuid }
        status: { type: string, enum: [ADMITTED, DISCHARGED] }
        state: { type: string, enum: [trial, on, readonly], description: 'IPD state; never off (403).' }
        asOf: { type: string, format: date-time, description: 'Database clock of the answer (clock_timestamp()): base of "today", every slot state, lateHours, doseCount and the subtitle time. Never the device clock.' }
        patient: { $ref: '#/components/schemas/EmrPatient' }
        doseCount: { type: integer, minimum: 0, description: 'Slots in state DUE or LATE (of ACTIVE orders); 0 for DISCHARGED. The tab count, shown only when above 0 (equals NursingSheet.doseCount at the same instant).' }
        canGive: { type: boolean, description: 'Token role and membership role both NURSE or OWNER, the admission ADMITTED, IPD Trial or On (ADR-011 D3; OQ-32-3).' }
        giveLockReason:
          oneOf:
            - { type: string, enum: [ROLE, IPD_READONLY, NOT_ADMITTED] }
            - { type: 'null' }
          description: 'Null when canGive is true; otherwise the first that applies: ROLE (DOCTOR; no line), IPD_READONLY, NOT_ADMITTED (one line each, see Mar).'
        orders: { type: array, items: { $ref: '#/components/schemas/MarOrder' }, description: 'Orders with status PENDING or ACTIVE, chart order (orderedAt ascending, then id). Not paged.' }
        secondNurses: { type: array, items: { $ref: '#/components/schemas/SecondNurseOption' }, description: 'Active NURSE members of the clinic, the caller excluded (never the signed-in person), by name. Empty when canGive is false. OWNER and DOCTOR are not offered (ADR-011 D7, Q6).' }
        notGivenReasons: { type: array, items: { $ref: '#/components/schemas/KeyLabel' }, description: 'The five NotGivenReasonKey options in select order, shown after "Choose a reason" (none preselected).' }
    DoseInput:
      type: object
      description: >-
        SAH-32. Body of POST /medicine-orders/{id}/doses. Format messages (400 validation, every format error
        together in this order, detail = the first): clientKey missing or not a UUID "Reload the page and try
        again."; slotAt missing or not a date-time "Reload the page and try again."; outcome missing or not GIVEN
        or NOT_GIVEN "Reload the page and try again.". The bedside messages (wristband, identityConfirmed,
        secondNurseId, secondNursePin) and reasonKey are checked after the order and slot rules, one at a time,
        in the order of the operation (AC6, AC8). Unknown properties are ignored.
      required: [clientKey, slotAt, outcome]
      properties:
        clientKey: { type: string, format: uuid, description: 'Idempotency key (ADR-011 D8): made when the Give sheet opens; a repeat with the same values answers the first record (200, replayed true).' }
        slotAt: { type: string, format: date-time, description: 'MarSlot.slotAt as received; must be a dose time of the order''s frequency on today''s IST date.' }
        outcome: { type: string, enum: [GIVEN, NOT_GIVEN], description: 'GIVEN for "Given", NOT_GIVEN for "Record not given".' }
        wristband: { type: [string, 'null'], maxLength: 200, description: 'GIVEN: the box as typed or scanned (the box allows at most 200 characters, maxlength 200). Compared with the patient''s UHID after normalisation (NFKC; every white-space, control and format character removed; upper case). Empty after normalisation 400 "Scan the wristband first."; not equal 409 wristband-mismatch. As built, the server does not answer a longer value with a 400 format error: more than 200 UTF-16 units is not normalised and counts as not equal (409 wristband-mismatch; the deny entry says "text that is not a UHID"). Ignored for NOT_GIVEN. Never logged.' }
        identityConfirmed: { type: [boolean, 'null'], description: 'GIVEN: the checkbox "The patient said their name and date of birth, or a relative confirmed them"; anything but true 400 "Confirm the second identifier: name and date of birth.". Stored as the nurse''s statement. Ignored for NOT_GIVEN.' }
        secondNurseId: { type: [string, 'null'], format: uuid, description: 'High-alert GIVEN: SecondNurseOption.membershipId. Missing 400 "High-alert medicine: a second nurse must check it and enter a 4-digit PIN."; the caller''s own membership 400 "The second check must be a different nurse."; not an active NURSE of the clinic 400 "Choose a nurse from the list.". Ignored for a medicine that is not high-alert and for NOT_GIVEN.' }
        secondNursePin: { type: [string, 'null'], maxLength: 16, examples: ['4821'], description: 'High-alert GIVEN: the second nurse''s own personal staff PIN (ADR-010, ADR-011 D7). Not exactly 4 ASCII digits 400 "High-alert medicine: a second nurse must check it and enter a 4-digit PIN.". A string, so leading zeros survive. Never logged, audited, stored or echoed. Ignored (never checked) for a medicine that is not high-alert and for NOT_GIVEN.' }
        reasonKey: { oneOf: [{ $ref: '#/components/schemas/NotGivenReasonKey' }, { type: 'null' }], description: 'NOT_GIVEN: missing, null or any other value 400 field reasonKey "Choose why the dose is not given.". Ignored for GIVEN.' }
    DoseRecorded:
      type: object
      description: 'SAH-32. Answer of POST /medicine-orders/{id}/doses: 201 recorded, 200 replay. Toasts are built from dose and mar (ADR-011 D8).'
      required: [replayed, dose, mar]
      properties:
        replayed: { type: boolean, description: 'True when an earlier request with the same clientKey recorded this dose; nothing was written by this request except a record-access row.' }
        dose: { $ref: '#/components/schemas/DoseRow' }
        mar: { $ref: '#/components/schemas/Mar', description: 'The MAR now (asOf after the save).' }
    VitalMark:
      type: string
      enum: [CHECK, CRITICAL]
      description: 'SAH-37 (rule 20, DEC-027 point 5, OQ-37-11; ADR-015 D6). Mark of one vital tile, from the SAH-30 per-parameter points of EarlyWarningScore (ADR-006 D3), never from a new limit and never in the browser: 3 points CRITICAL (word "Critical", title "Critical"), 1 or 2 points CHECK (word "Check", title "Outside normal range"), 0 points no mark (property absent). Colour is never the only signal. Clinical sign-off of the bands (OQ-30-6) covers it; go-live condition: a clinician signs off the tile marks (DEC-027).'
    CardReading:
      type: object
      required: [value]
      properties:
        value: { type: number, description: 'Pulse /min, SpO₂ %, RR /min as whole numbers; Temp °C with one decimal (multipleOf 0.1).' }
        mark: { $ref: '#/components/schemas/VitalMark', description: 'Absent when the reading scores 0 points.' }
    CardBpReading:
      type: object
      required: [systolic, diastolic]
      properties:
        systolic: { type: integer, minimum: 40, maximum: 300 }
        diastolic: { type: integer, minimum: 20, maximum: 200, description: Shown; not scored. }
        mark: { $ref: '#/components/schemas/VitalMark', description: 'From the systolic points only (diastolic is not scored). Absent at 0 points.' }
    CardLatestVitals:
      type: object
      description: 'SAH-37 (ADR-015 D6). The latest vitals record of an admitted patient for the card (recordedAt descending, then id descending; the record behind AdmittedClinicalFlags.latestEws), read in the existing batch read R4 (no call per patient). Each reading is present only when its field is switched on in the published setup (or cardFacts=all); absent otherwise. Tile text: "<value> <unit>", "—" when the field is on but the reading is absent for this caller. Clinical data: on screen only, never logged or audited.'
      required: [recordedAt]
      properties:
        recordedAt: { type: string, format: date-time, description: 'Database time of the save. Last recorded "<N> min ago" (mockup pcAgo: "2 h 5 min ago" from 60 minutes) from AdmissionList.asOf minus recordedAt, never the device clock.' }
        recordedByName: { type: string, description: 'Present only when Last recorded is on (or cardFacts=all). Display name of the user who saved it (platform.api ActorDirectoryPort.displayNames, one batch; "Team member" when the name cannot be found). Shown "<ago> · <recordedByName>".' }
        bp: { $ref: '#/components/schemas/CardBpReading', description: 'Present when BP is on. Shown "136/84 mmHg".' }
        pulse: { $ref: '#/components/schemas/CardReading', description: 'Present when Pulse is on. "/min".' }
        spo2: { $ref: '#/components/schemas/CardReading', description: 'Present when SpO₂ is on. "%".' }
        temp: { $ref: '#/components/schemas/CardReading', description: 'Present when Temp is on. "°C", one decimal.' }
        rr: { $ref: '#/components/schemas/CardReading', description: 'Present when RR is on. "/min".' }
    CardLayout:
      type: string
      enum: [compact, standard, expanded]
      description: 'SAH-37 (rule 5, mockup PC_LAY). compact "Compact" "Key facts on one line, icon actions. Fits 4–5 cards a row."; standard "Standard" "Sections with labels and vital tiles. The Sahaj default."; expanded "Expanded" "Every field and section titles." (no Last nursing note, DEC-027 point 4).'
    CardSectionKey:
      type: string
      enum: [header, status, stay, care, vitals, clinical, billing]
      description: 'SAH-37 (mockup PC_S). header Card header (locked: always on, always first), status Workflow status (safety), stay Admission and bed, care Care team, vitals Vitals (safety), clinical Clinical (safety), billing Billing.'
    CardFieldKey:
      type: string
      enum: [name, uhid, ageSex, bed, ipNumber, mobile, alerts, admittedOn, lengthOfStay, ward, room, admissionType, doctor, bp, pulse, spo2, temp, rr, ews, lastRecorded, diagnosis, allergies, runningBill, deposit, payer]
      description: 'SAH-37 (mockup PC_F; only fields with data in phase 1, OQ-37-3: no Workflow stage, no Assigned nurse). Standard names, groups and safety flags in CardCatalogue.fields; the table is in docs/architecture/SAH-37-patient-card-setup.md section 1.'
    CardActionKey:
      type: string
      enum: [nursing, emr, transfer, discharge, deposit]
      description: 'SAH-37 (mockup PC_A; no Case paper, no Update stage, OQ-37-3).'
    CardDataGroup:
      type: string
      enum: [patient, contact, clinical, vitals, billing]
      description: 'SAH-37 (rule 11, mockup PC_G). patient "Patient and admission": OWNER, FRONT_DESK, NURSE, DOCTOR; contact "Contact details": OWNER, FRONT_DESK; clinical "Clinical details": OWNER, DOCTOR, NURSE; vitals "Vitals and early warning": OWNER, DOCTOR, NURSE; billing "Billing": OWNER, FRONT_DESK. Fixed (no Roles and access in phase 1); it only narrows what the server already allows.'
    CardRole:
      type: string
      enum: [OWNER, DOCTOR, NURSE, FRONT_DESK]
      description: 'SAH-37. The roles that have the Admitted list; the "View as" choices of the preview ("Owner / Admin", "Doctor", "Nurse", "Front desk"; OQ-37-4).'
    CardFieldPlacement:
      type: object
      additionalProperties: false
      required: [key, on, label]
      properties:
        key: { $ref: '#/components/schemas/CardFieldKey' }
        on: { type: boolean, description: 'Patient name, UHID, Alerts, Early warning, Allergies: must be true ("<Field> is a safety field and cannot be hidden."; Patient name "Patient name stays first in the Card header.").' }
        label:
          type: string
          maxLength: 400
          description: 'The owner''s own name for the field; "" keeps the standard name. Stored trimmed and NFC-normalised. Rules (400 validation, field setup.sections[i].fields[j].label): over 400 UTF-16 units refused before normalisation, then more than 40 code points "Keep the label to 40 characters."; a control or text-direction character "Label cannot contain control or text-direction characters"; Patient name, UHID, Alerts, Early warning and Allergies must be "" or their standard name ("The label of <Field> cannot be changed."; DEC-027 point 2). Plain text, shown as typed (never markup).'
    CardSection:
      type: object
      additionalProperties: false
      required: [key, on, fields]
      properties:
        key: { $ref: '#/components/schemas/CardSectionKey' }
        on: { type: boolean, description: 'header, status, vitals and clinical must be true ("The <Section> section is a safety section and stays on."; header "The Card header section is always first and always on."). A section that holds a safety field must be on ("<Field> is a safety field. Move it to a section that is switched on.").' }
        fields: { type: array, maxItems: 25, items: { $ref: '#/components/schemas/CardFieldPlacement' }, description: 'In card order. May be empty ("Drop a field here"). Patient name only in header, first.' }
    CardActionPlacement:
      type: object
      additionalProperties: false
      required: [key, on]
      properties:
        key: { $ref: '#/components/schemas/CardActionKey' }
        on: { type: boolean }
    CardSetup:
      type: object
      additionalProperties: false
      description: >-
        SAH-37 (ADR-015 D3). One card setup in canonical form (stored, edited and sent back whole). Validated
        on Save draft and Publish (all errors together, 400 validation with fieldErrors, nothing stored):
        layout "Choose Compact, Standard or Expanded."; cardsPerRow "Choose 2, 3 or 4 cards per row.";
        sections: exactly the 7 CardSectionKey values, each once ("Unknown section.", "Each section can appear
        only once.", "The <Section> section is missing."), header first; fields: exactly the 25 CardFieldKey
        values once across all sections ("Unknown field.", "Each field can appear only once.", "<Field> is
        missing from the card setup."); actions: exactly the 5 CardActionKey values, each once ("Unknown quick
        action.", "Each quick action can appear only once.", "The <Action> quick action is missing."); and the
        locked-item, label and placement rules of CardSection and CardFieldPlacement. Full table:
        docs/architecture/SAH-37-patient-card-setup.md section 4. Holds no patient data.
      required: [layout, cardsPerRow, sections, actions]
      properties:
        layout: { $ref: '#/components/schemas/CardLayout' }
        cardsPerRow: { type: integer, enum: [2, 3, 4], description: 'Default cards per row on a desktop (rule 5). Each person may switch it for the visit (SAH-36); tablets 2, phones 1.' }
        sections: { type: array, minItems: 7, maxItems: 7, items: { $ref: '#/components/schemas/CardSection' }, description: In card order. }
        actions: { type: array, minItems: 5, maxItems: 5, items: { $ref: '#/components/schemas/CardActionPlacement' }, description: 'In card order; default Nursing, EMR, Transfer, Discharge on, Deposit off.' }
    CardSetupWrite:
      type: object
      additionalProperties: false
      description: 'SAH-37. Body of PUT /card-setup/draft and POST /card-setup/publish (ADR-015 D5). The tokens are those of the CardSetupView the editor loaded or last received.'
      required: [baseVersion, draftRevision, setup]
      properties:
        baseVersion: { type: integer, minimum: 1, description: 'CardLive.version when the editor loaded. Differs from the live version now: 409 card-setup-changed.' }
        draftRevision: { type: [integer, 'null'], format: int64, minimum: 1, description: 'CardDraft.revision (opaque clock-based token; the client never computes or compares it) when the editor loaded or last received, sent back unchanged; null when there was no draft. A stored draft with another revision, or no stored draft while this is not null: 409 card-setup-changed.' }
        setup: { $ref: '#/components/schemas/CardSetup' }
    CardChangedPart:
      type: string
      enum: [layout, sections, fields, quickActions]
      description: 'SAH-37 (mockup pcChanges). layout: layout or cards per row; sections: section order or on/off; fields: any field''s section, order, on/off or label; quickActions: order or on/off. Words on screen: layout, sections, fields, quick actions ("Layout, fields updated.", "Changed: layout, fields").'
    CardCatalogueSection:
      type: object
      required: [key, name, description, locked, safety]
      properties:
        key: { $ref: '#/components/schemas/CardSectionKey' }
        name: { type: string }
        description: { type: string, description: 'Setup row text, for example "Name, identifiers and bed · always first".' }
        locked: { type: boolean, description: 'Card header: "Always on" pill, lock icon, fixed first, no switch.' }
        safety: { type: boolean, description: 'Workflow status, Vitals, Clinical: "Safety · always on" pill (green) instead of a switch.' }
    CardCatalogueField:
      type: object
      required: [key, name, group, required, safety, allowedSections]
      properties:
        key: { $ref: '#/components/schemas/CardFieldKey' }
        name: { type: string, description: 'Standard name, also the label placeholder ("Label for <name>").' }
        group: { $ref: '#/components/schemas/CardDataGroup' }
        required: { type: boolean, description: 'Patient name only: pill "Required", fixed first in the Card header.' }
        safety: { type: boolean, description: 'UHID, Alerts, Early warning, Allergies: pill "Safety · always on", tooltip "Patient safety: cannot be hidden", label box disabled.' }
        allowedSections: { type: array, items: { $ref: '#/components/schemas/CardSectionKey' }, description: 'Patient name: header only; every other field: all sections.' }
        unit: { type: string, description: 'Vital readings only: mmHg, /min, %, °C, /min.' }
    CardCatalogueGroup:
      type: object
      required: [key, name, visibleTo]
      properties:
        key: { $ref: '#/components/schemas/CardDataGroup' }
        name: { type: string, description: 'Patient and admission, Contact details, Clinical details, Vitals and early warning, Billing.' }
        visibleTo: { type: array, items: { $ref: '#/components/schemas/CardRole' }, description: 'From CardAccessRule (the rule GET /admissions enforces). The preview hides a field whose group does not list the "View as" role.' }
    CardCatalogueAction:
      type: object
      required: [key, name, icon, description, usableBy, allowedInReadOnly]
      properties:
        key: { $ref: '#/components/schemas/CardActionKey' }
        name: { type: string }
        icon: { type: string, enum: [nurse, emr, swap, door, deposit] }
        description: { type: string, description: 'For example "Record vitals and a nursing note".' }
        usableBy: { type: array, items: { $ref: '#/components/schemas/CardRole' }, description: 'The "who" line (shield icon), read-only: Nursing and EMR OWNER, NURSE, DOCTOR; Transfer OWNER, NURSE, FRONT_DESK; Discharge OWNER, DOCTOR; Deposit OWNER, FRONT_DESK. From CardAccessRule, the same rule as AdmittedCardAbilities (single copy, ADR-015 D3). No "Change who can use each action" button.' }
        allowedInReadOnly: { type: boolean, description: 'Nursing, EMR true; Transfer, Discharge, Deposit false.' }
    CardCatalogue:
      type: object
      description: 'SAH-37 (ADR-015 D3). Fixed Sahaj content serialised from the server constants: the setup editor, the preview and the "who" line read it; the browser holds no copy.'
      required: [sections, fields, groups, actions, viewAsRoles, labelMaxLength]
      properties:
        sections: { type: array, items: { $ref: '#/components/schemas/CardCatalogueSection' } }
        fields: { type: array, items: { $ref: '#/components/schemas/CardCatalogueField' } }
        groups: { type: array, items: { $ref: '#/components/schemas/CardCatalogueGroup' } }
        actions: { type: array, items: { $ref: '#/components/schemas/CardCatalogueAction' } }
        viewAsRoles: { type: array, items: { $ref: '#/components/schemas/CardRole' }, description: 'OWNER, DOCTOR, NURSE, FRONT_DESK; default "View as" is NURSE.' }
        labelMaxLength: { type: integer, const: 40 }
    CardTemplate:
      type: object
      description: 'SAH-37 (rule 6, mockup PC_PRESET). Applied by the editor to its draft: the draft''s layout, sections and actions become those of the template; cardsPerRow is kept. Toast "<Template> template applied to your draft. Publish to use it.".'
      required: [key, name, description, layout, sections, actions]
      properties:
        key: { type: string, enum: [smallClinic, nursingHome, hospital] }
        name: { type: string, description: 'Small clinic, Nursing home, Hospital.' }
        description: { type: string, description: '"Compact card, no billing", "Standard card with deposit action", "Expanded card, billing section, all actions".' }
        layout: { $ref: '#/components/schemas/CardLayout' }
        sections: { type: array, items: { $ref: '#/components/schemas/CardSection' } }
        actions: { type: array, items: { $ref: '#/components/schemas/CardActionPlacement' } }
    CardLive:
      type: object
      required: [version, isStandard, setup, publishedAt, publishedByName]
      properties:
        version: { type: integer, minimum: 1, description: '1 = the Sahaj standard card the clinic started with (never stored).' }
        isStandard: { type: boolean, description: 'Pill "Sahaj standard card · v<n> live" (teal) when true, "Customized · v<n> live" (blue) otherwise; Overview tile "Sahaj default" / "customized".' }
        setup: { $ref: '#/components/schemas/CardSetup', description: Repaired on read. }
        publishedAt: { type: [string, 'null'], format: date-time, description: 'Null for v1.' }
        publishedByName: { type: [string, 'null'], description: 'Null for v1 (shown "Sahaj").' }
    CardDraft:
      type: object
      required: [revision, baseVersion, setup, savedAt, savedByName, changedParts]
      properties:
        revision: { type: integer, format: int64, minimum: 1, description: 'Opaque clock-based concurrency token (about 1.79e15, below 2^53, so a browser number holds it exactly; DEC-028 addendum): it grows and changes on every Save draft that changes the draft and never repeats for the clinic, also after a Discard or a Publish (so a stale editor can never match a newer draft, AC12). A save whose setup equals the stored draft changes nothing: the revision stays and no history line is written. The client must not read meaning into the number (it is not a count of saves and does not start at 1); send it back unchanged as draftRevision.' }
        baseVersion: { type: integer, minimum: 1, description: 'The live version the draft was saved against.' }
        setup: { $ref: '#/components/schemas/CardSetup', description: Repaired on read. }
        savedAt: { type: string, format: date-time, description: '"· saved 11:05 AM" (IST).' }
        savedByName: { type: string }
        changedParts: { type: array, minItems: 1, items: { $ref: '#/components/schemas/CardChangedPart' }, description: 'Against the live setup; "Draft · N change(s) not published".' }
    CardVersion:
      type: object
      required: [version, summary, isStandard, changedParts, publishedAt, publishedByName, live]
      properties:
        version: { type: integer, minimum: 1 }
        summary: { type: string, description: '"Sahaj standard patient card (default)" for v1; "Back to the Sahaj standard card" when isStandard; otherwise "Changed: <parts>".' }
        isStandard: { type: boolean }
        changedParts: { type: array, items: { $ref: '#/components/schemas/CardChangedPart' }, description: Empty for v1. }
        publishedAt: { type: [string, 'null'], format: date-time, description: 'Null for v1 ("When the clinic was created"); else "24 Oct 2026, 11:05 AM IST".' }
        publishedByName: { type: [string, 'null'], description: 'Null for v1 ("Sahaj").' }
        live: { type: boolean, description: 'True for the newest only (pill "Live").' }
    CardSetupView:
      type: object
      description: 'SAH-37. Answer of every /card-setup operation. draft and versions are present only for OWNER (token role and membership role); for FRONT_DESK, NURSE and DOCTOR they are absent from the JSON (not null).'
      required: [catalogue, standard, templates, live, canEdit, readOnlyReason, state]
      properties:
        catalogue: { $ref: '#/components/schemas/CardCatalogue' }
        standard: { $ref: '#/components/schemas/CardSetup', description: 'The Sahaj standard setup (DEC-027: the SAH-36 card plus the locked Allergies and Early warning lines; readings, Last recorded and Diagnosis off; Billing off; Deposit action off; Standard, 3 per row). Reset to default replaces the editor''s draft with it ("Draft reset to the Sahaj standard card. Publish to apply it.").' }
        templates: { type: array, items: { $ref: '#/components/schemas/CardTemplate' } }
        live: { $ref: '#/components/schemas/CardLive' }
        draft: { oneOf: [{ $ref: '#/components/schemas/CardDraft' }, { type: 'null' }], description: 'OWNER only; null when there is no draft (a draft equal to live is never kept).' }
        versions: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/CardVersion' }, description: 'OWNER only. Newest first, at most 50; v1 is the last row once fewer than 50 versions were published. No restore.' }
        canEdit: { type: boolean, description: 'True only for OWNER when IPD is Trial or On. False: every control disabled; Save, Discard, Reset and Publish not offered.' }
        readOnlyReason: { type: [string, 'null'], enum: [ROLE, IPD_READONLY, null], description: 'ROLE: foot text "set by the clinic owner". IPD_READONLY: the existing IPD Read-only message. Null when canEdit.' }
        state: { type: string, enum: [trial, on, readonly], description: 'IPD state, for the preview''s action rule (allowedInReadOnly).' }
    ResolvedCardSection:
      type: object
      required: [key, name, fields]
      properties:
        key: { $ref: '#/components/schemas/CardSectionKey' }
        name: { type: string, description: 'Section title in the Expanded layout.' }
        fields:
          type: array
          items:
            type: object
            required: [key, label, group, safety]
            properties:
              key: { $ref: '#/components/schemas/CardFieldKey' }
              label: { type: string, maxLength: 40, description: 'The owner''s label, or the standard name when it is empty. Plain text.' }
              group: { $ref: '#/components/schemas/CardDataGroup' }
              safety: { type: boolean }
    ResolvedCardSetup:
      type: object
      description: 'SAH-37 (ADR-015 D4, D8). The published setup ready to draw: repaired, only sections and fields that are on, labels resolved, in card order; actions that are on, in order. The shared card component draws it; a field is drawn only when its group is in AdmissionList.card.visibleGroups and an action only when its ability in AdmissionList.card is true. A client that cannot read it draws the Sahaj standard card with the notice "Could not load the card setup. Showing the standard card.".'
      required: [version, isStandard, fallback, layout, cardsPerRow, sections, actions]
      properties:
        version: { type: integer, minimum: 1 }
        isStandard: { type: boolean }
        fallback: { type: boolean, description: 'True when the stored live setup could not be read and the standard setup is answered instead; the page shows "Could not load the card setup. Showing the standard card.".' }
        layout: { $ref: '#/components/schemas/CardLayout' }
        cardsPerRow: { type: integer, enum: [2, 3, 4], description: 'The opening "Cards per row" on a desktop; the person''s own choice during the visit wins (SAH-36 AC1).' }
        sections: { type: array, items: { $ref: '#/components/schemas/ResolvedCardSection' } }
        actions: { type: array, items: { $ref: '#/components/schemas/CardActionKey' } }
    ScopeKind:
      type: string
      enum: [ALL, WARDS, OWN]
      description: 'SAH-34 (ADR-017 D1). ALL: every admitted patient (OWNER, DOCTOR, FRONT_DESK, BILLING, PHARMACIST; NURSE while the clinic switch is off). WARDS: a NURSE with the switch on, whose patients are those whose current bed is in one of her live wards (none when she has no ward: hasWard false). OWN: reserved for VISITING_DOCTOR (story 34D); never sent in phase 1. Fixed in code (DEC-031 C1).'
    AdmissionScope:
      type: object
      description: 'SAH-34 (34B AC 8, 34C AC 26 to 32). The caller''s scope on GET /admissions. No patient data. The chip (shield icon) "Patients in their wards · <visible> of <admitted>" with the tooltip and accessible name "As Nurse you see patients in their wards (<visible> of <admitted>). The owner sets your wards in Clinic setup." is shown when kind is not ALL and admitted is above 0 (OQ-34-27 wording).'
      required: [kind, visible, admitted, canOpenEmergencyAccess]
      properties:
        kind: { $ref: '#/components/schemas/ScopeKind' }
        visible: { type: integer, minimum: 0, description: 'N: the admitted patients the caller can see (the number of items, including those seen through her own active emergency access). The Admitted tab number for a scoped user (OQ-34-28).' }
        admitted: { type: integer, minimum: 0, description: 'M: every ADMITTED admission of the clinic, as a number only (the hospital census; low sensitivity, as the mockup).' }
        hasWard: { type: boolean, description: 'NURSE only (absent for every other role): she has at least one live ward assignment (with the switch on or off). Shows "My patients" to a nurse (AC 32) and, with kind WARDS and false, the text "No wards are assigned to you, so no patients are shown. Ask the owner to assign your ward. If a patient needs you now, use Emergency access." (AC 29).' }
        canOpenEmergencyAccess: { type: boolean, description: 'True when kind is not ALL and the token role and the membership role are both NURSE, in IPD Trial, On or Read-only (OQ-34-29). Shows the ghost button "Emergency access" (key icon) on the chip (AC 44). A convenience: POST /emergency-access checks again.' }
    AdmittedEmergencyAccess:
      type: object
      description: 'SAH-34 (34E). The caller''s own active grant on this row.'
      required: [expiresAt]
      properties:
        expiresAt: { type: string, format: date-time, description: 'Database time when the grant ends (opened + 30 minutes). Tooltip of the flag: "Emergency access until <time as 11:35 AM> IST" (OQ-34-33). No countdown on the device; the list drops the patient at the first reload after this time.' }
    SafetyScope:
      type: object
      description: 'SAH-34. The scope of a view NURSE Safety board, for the note above the tiles (AC 37). No patient data.'
      required: [kind, visible, admitted, hasWard]
      properties:
        kind: { $ref: '#/components/schemas/ScopeKind' }
        visible: { type: integer, minimum: 0, description: 'Equals yourPatients.' }
        admitted: { type: integer, minimum: 0 }
        hasWard: { type: boolean }
    EmergencyAccessReasonKey:
      type: string
      enum: [DETERIORATING, COVERING_BREAK, DUTY_DOCTOR_ASKED]
      description: 'SAH-34 (D-3a; three fixed reasons, no free text, OQ-34-12). Labels in the order of the select "Reason" (placeholder "Choose a reason"; mockup sfbg): DETERIORATING "Patient deteriorating, rapid response", COVERING_BREAK "Covering for a colleague on break", DUTY_DOCTOR_ASKED "Asked to help by the duty doctor". The same label is used in the bg entry and the owner''s panel.'
    EmergencyAccessReason:
      type: object
      required: [key, label]
      properties:
        key: { $ref: '#/components/schemas/EmergencyAccessReasonKey' }
        label: { type: string, maxLength: 60 }
    EmergencyAccessPatient:
      type: object
      description: 'SAH-34. One option of the select "Patient": identity only. On screen only; never logged.'
      required: [admissionId, patientName, bedCode, uhid]
      properties:
        admissionId: { type: string, format: uuid }
        patientName: { type: string, description: '"Patient" when the record cannot be found.' }
        bedCode: { type: string, description: 'The current bed.' }
        uhid: { type: [string, 'null'], description: 'Null only when the patient record cannot be found (shown as "—").' }
    EmergencyAccessPicker:
      type: object
      required: [items, reasons]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/EmergencyAccessPatient' }, description: 'Out-of-scope ADMITTED admissions, bedCode ascending (code-point order). Empty: "You can already see every admitted patient."' }
        reasons: { type: array, minItems: 3, maxItems: 3, items: { $ref: '#/components/schemas/EmergencyAccessReason' }, description: 'The three reasons in select order.' }
    EmergencyAccessInput:
      type: object
      required: [admissionId, reasonKey, confirmed]
      additionalProperties: false
      description: 'SAH-34. There is no duration, start, end, patient or user field: the server sets them. A field not listed here (for example a duration or a time sent by a client), or a body that is not a JSON object, is refused with 400 malformed-request (type https://sahaj.in/problems/malformed-request, title "Request could not be read", detail "The request body is missing or is not valid JSON.", no fieldErrors; the unknown name is never echoed). bad-request is only for a path value that is not a UUID.'
      properties:
        admissionId: { type: string, format: uuid, description: 'EmergencyAccessPatient.admissionId. Missing or not a UUID: field admissionId "Choose a patient."' }
        reasonKey: { $ref: '#/components/schemas/EmergencyAccessReasonKey', description: 'Missing or another value: field reasonKey "Choose a reason for emergency access."' }
        confirmed: { type: boolean, const: true, description: 'The checkbox "I understand this access is recorded with my name and reviewed by the owner". Anything but the JSON value true: field confirmed "Tick the box to confirm this access is recorded."' }
    EmergencyAccessGrant:
      type: object
      description: 'SAH-34. Answer of POST /emergency-access. patientName is for the toast only; on screen only, never logged.'
      required: [id, admissionId, patientName, bedCode, reasonKey, reasonLabel, openedAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        admissionId: { type: string, format: uuid }
        patientName: { type: string }
        bedCode: { type: string, description: 'The bed at the time of the grant.' }
        reasonKey: { $ref: '#/components/schemas/EmergencyAccessReasonKey' }
        reasonLabel: { type: string, maxLength: 60 }
        openedAt: { type: string, format: date-time, description: 'Database clock (clock_timestamp()) at the insert.' }
        expiresAt: { type: string, format: date-time, description: 'openedAt + 30 minutes, set by the database. Never extended.' }
    EmergencyAccessReviewRow:
      type: object
      description: 'SAH-34 (34F, AC 66). One row of "Emergency access to review": "<staffName> opened <patientName> · bed <bedCode>", small line "<reasonLabel> · <time> · outside their wards" (time of openedAt in IST: "11:05 AM" when its IST date is the IST date of asOf, else "24 Oct, 11:05 AM"), and the button "Mark reviewed" (check icon, at least 44 px, accessible name "Mark reviewed: <staffName> opened <patientName>"). Two grants on one patient are two rows. Names read at display time; on screen only; never logged.'
      required: [grantId, admissionId, staffName, patientName, bedCode, reasonKey, reasonLabel, openedAt, expiresAt, admissionStatus]
      properties:
        grantId: { type: string, format: uuid, description: 'The path id of POST /emergency-access/{id}/review.' }
        admissionId: { type: string, format: uuid }
        staffName: { type: string, description: 'The grantee, through platform.api ActorDirectoryPort; "Team member" when not found (also for an inactive member whose name is gone).' }
        patientName: { type: string, description: '"Patient" when the record cannot be found.' }
        bedCode: { type: string, description: 'The bed at the time of the grant (not the bed now; the patient may have moved or gone home).' }
        reasonKey: { $ref: '#/components/schemas/EmergencyAccessReasonKey' }
        reasonLabel: { type: string, maxLength: 60 }
        openedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        admissionStatus: { type: string, enum: [ADMITTED, DISCHARGED], description: 'Returned for the owner; the mockup shows no text for it, so no text is drawn.' }
    EmergencyAccessReviewPage:
      type: object
      required: [asOf, waiting, items, nextCursor]
      properties:
        asOf: { type: string, format: date-time, description: 'Database clock; decides "today" for the time format.' }
        waiting: { type: integer, minimum: 0, description: 'Every unreviewed grant of the clinic (full count, not the page size). Tile "Emergency access" N.' }
        items: { type: array, maxItems: 25, items: { $ref: '#/components/schemas/EmergencyAccessReviewRow' }, description: 'Oldest openedAt first, then id.' }
        nextCursor: { type: [string, 'null'], maxLength: 64, description: 'Set when more unreviewed grants exist: "Show 25 more" calls GET /emergency-access with it.' }
    EmergencyAccessReviewResult:
      type: object
      required: [grantId, reviewedAt, waiting]
      properties:
        grantId: { type: string, format: uuid }
        reviewedAt: { type: string, format: date-time, description: 'Database clock at the review.' }
        waiting: { type: integer, minimum: 0, description: 'Unreviewed grants left after this review.' }
    WardAssignmentNurse:
      type: object
      x-needs-human: 'Screen not in the mockup yet (34A).'
      required: [membershipId, name, wardIds]
      properties:
        membershipId: { type: string, format: uuid }
        name: { type: string, description: 'Display name (platform.api TeamMemberPort).' }
        wardIds: { type: array, uniqueItems: true, items: { type: string, format: uuid }, description: 'Her live wards; empty when none.' }
    WardAssignmentWard:
      type: object
      x-needs-human: 'Screen not in the mockup yet (34A).'
      required: [wardId, wardName, nurseMembershipIds]
      properties:
        wardId: { type: string, format: uuid }
        wardName: { type: string, maxLength: 80 }
        nurseMembershipIds: { type: array, uniqueItems: true, items: { type: string, format: uuid }, description: 'Live assignments of active NURSE members.' }
    WardAssignments:
      type: object
      x-needs-human: 'Screen not in the mockup yet (34A; DEC-031 item 2).'
      required: [wardScope, wards, nurses, nursesWithoutWard]
      properties:
        wardScope: { type: boolean, description: 'The clinic switch "Nurses see only their wards" (false when never set).' }
        wards: { type: array, items: { $ref: '#/components/schemas/WardAssignmentWard' }, description: 'Every ward, in the order of IpdLayout.wards.' }
        nurses: { type: array, items: { $ref: '#/components/schemas/WardAssignmentNurse' }, description: 'Every active NURSE member, by name.' }
        nursesWithoutWard: { type: integer, minimum: 0, description: 'Active NURSE members with no live ward. Switching on is refused while above 0.' }
    WardAssignmentInput:
      type: object
      x-needs-human: 'Screen not in the mockup yet (34A).'
      required: [membershipIds]
      additionalProperties: false
      description: 'SAH-34. A field not listed here, or a body that is not a JSON object: 400 malformed-request (no fieldErrors; the name is never echoed).'
      properties:
        membershipIds: { type: array, maxItems: 100, uniqueItems: true, items: { type: string, format: uuid }, description: 'The whole new set of nurses of the ward (empty removes every nurse). Each must be an active NURSE member: field membershipIds "Choose nurses from the list."' }
    WardScopeInput:
      type: object
      x-needs-human: 'Screen not in the mockup yet (34A).'
      required: ['on']
      additionalProperties: false
      description: 'SAH-34. A field not listed here, or a body that is not a JSON object: 400 malformed-request (no fieldErrors; the name is never echoed).'
      properties:
        'on': { type: boolean, description: 'true = nurses see only their wards. Not a JSON boolean: field on "Choose on or off".' }
