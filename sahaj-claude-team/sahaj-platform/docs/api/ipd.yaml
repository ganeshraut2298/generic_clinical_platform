        '400': { $ref: '#/components/responses/Problem', description: 'validation (the operation''s own field errors); or bad-request when the {id} path value is not a UUID (components/responses/BadRequest)' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden, module-off or owner-approval-needed; outside-scope (SAH-34; components/responses/OutsideScope; after the 404 check, before not-admitted)' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
      x-scope-guard: { kind: admission-locked, story: SAH-34, note: 'Checked after the admission row lock on the bed the patient is in before the move. The 200 answer is returned to the caller even when the new bed is outside her wards; her next request for the patient is refused.' }
