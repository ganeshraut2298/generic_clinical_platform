      description: 'OWNER only; other roles see the page read-only (canEdit false) and answer 403 forbidden. The whole setting is sent each time; the page saves each change at once. Check order: role 403 forbidden (the role check runs first, as on every IPD endpoint); module Off 403 module-off (answered to the owner); body 400 (templateKey "Choose a template from the list", approvalChain "Choose on or off", followUpDays "Enter 1 to 30 days"); Read-only 409 ipd-readonly. A missing or null templateKey stores no template ("Choose a template"). Audited as IPD_DISCHARGE_SETTINGS_UPDATED with the before and after values of templateKey, approvalChain and followUpDays. A change never alters a sign-off or a discharge already recorded (each keeps its own type, template and follow-up days).'
