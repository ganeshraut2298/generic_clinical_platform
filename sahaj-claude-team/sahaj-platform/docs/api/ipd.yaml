openapi: 3.1.0
info:
  title: Sahaj IPD API
  version: 0.3.2
  description: '0.3.2 (14 Nov 2026, SAH-75-10 and SAH-75-11, DEC-052; ADR-026 D4, D7; no path, property or table change): (1) GET /admission-requests: a course sitting moved to day care or IPD by the doctor ("Move to day care / IPD", "Request admission", opd POST /emr/courses/{courseId}/sittings/{sittingId}/admission-request) is listed as every requested sitting is; a sitting removed from the plan or marked missed is not listed. (2) POST /admissions with treatmentCourseSittingId answers 409 course-sitting-not-available also when the sitting was removed, missed or done (opd.api TreatmentCoursePort.linkAdmission). (3) ipd''s implementation of the opd.api port CourseAdmissionSource also returns the bed label of the linked admission (the oncology order sheet line "Day-care bed <n>"); no HTTP operation is added. 0.3.1 (13 Nov 2026, ADR-025 D10 and D8/D9; DEC-048 H33; security pre-review M3 and L2; applied under DEC-047; no path, property or table change): (1) GET /admission-requests: diagnoses and note are filled for OWNER and NURSE only and are null for FRONT_DESK (who gets patient, type, stay, requesting doctor and time); nurse rows stay hospital-wide because a request has no ward yet. "Admit" from FRONT_DESK opens the sheet with an empty reason. (2) The opd.api ports ipd implements for the EMR sign refuse while IPD is Read-only, as every IPD write: EmrRoundPort.recordSignedRound and EmrEmergencyPort.close check the IPD state (the opd sign checks it first and answers opd''s 409 ipd-read-only, docs/api/opd.yaml 0.6.2; the port check is the backstop). (3) EmrIpdOrderPort: a SAH-31 hard stop met at the EMR sign writes its deny clinical event and IPD_MED_ORDER_BLOCKED audit in its own committed step before the sign is refused (DEC-048 H31; ADR-025 D8). 0.3.0 (13 Nov 2026, EMR phase 5, ADR-025; additive): (1) GET /admission-requests lists the doctors'' admission requests from the EMR (SAH-67-3, OQ-45-31 default) and the treatment-course sittings waiting for admission (ADR-022 H13) for OWNER, FRONT_DESK and NURSE; POST /admissions accepts admissionRequestId, and any admission of a patient (or of an Emergency case) closes that patient''s or case''s open requests in the admission transaction (through opd.api EmrAdmissionRequestPort; IPD_ADMITTED gains admissionRequestId). (2) EmergencyCaseStatus gains SENT_TO_OPD (closed, never reopens): the doctor''s "Send to OPD" outcome from the Emergency assessment, which sets the case''s patient and the OPD visit it was sent to; audit IPD_ER_SENT_TO_OPD (case id, level, bay, closedAt, visit id). The doctor''s Discharge from ER and Refer out outcomes run the existing release and refer logic. (3) AdmittedClinicalFlags gains roundDoneToday (flag "Round done") and NursingSheet gains latestRound (the signed daily progress note''s time, doctor and "Investigations advised" text), from the new round record ipd keeps when a doctor signs the day''s note in the EMR (audit IPD_ROUND_SIGNED). (4) ipd implements the new opd.api ports EmrIpdOrderPort (the EMR round''s new medicines are checked and placed by the SAH-31 order service itself, same checks, audits, clinical events and pharmacist check), EmrRoundPort, EmrEmergencyPort, EmrVitalsSource, and EmrEncounterSource.openAdmissionOf; none adds an HTTP operation. No IPD bill line comes from the EMR (DEC-042 H8). Phase 1 contract, SAH-22 (wards, rooms, beds, bed categories and charges), SAH-23 to SAH-27 (admissions, board, charges, transfer, discharge), SAH-28 (emergency queue, triage and Emergency setup; ADR-005) and SAH-30 (nursing vitals, nursing notes and early warning score; ADR-006) and SAH-33 (Safety board: early warning escalations and the clinical audit trail; ADR-007) and SAH-31 (medicine orders with safety checks, EMR sheet and the pharmacist check; ADR-009) and SAH-32 (Medicines (MAR) tab of the Nursing sheet and giving a dose with the bedside checks; ADR-011) and SAH-35 (Medicine round on the Safety board: doses due or overdue across admitted patients, dose counts on the Safety tab; ADR-012) and SAH-36 (Admitted patients as uniform cards: card facts, role-gated clinical flags and card abilities on GET /admissions; ADR-013) and SAH-37 (Clinic setup > Patient card: live setup, versions and one draft per clinic, locked safety items checked by the server; the Admitted cards follow the published setup; ADR-015) and SAH-29 (Packages, read-only slice decided by the human on 9 Nov 2026: the Packages list of Clinic setup > Admission and deposits, the package copy on an admission and the package lines of the running bill; docs/architecture/SAH-29-ipd-packages.md; there is no endpoint that creates, changes or attaches a package). Every call answers 401 (problem type unauthorized) without a valid session, and 403 (problem type module-off, "In-patients (IPD) is not switched on for your clinic.") when IPD is Off for the clinic; every write answers 409 (ipd-readonly, "IPD is read-only. Nothing can be changed.") when IPD is Read-only. SAH-22 reads are for any clinic role and its writes are OWNER only; from SAH-23 the roles are stated on each operation, and a role outside them answers 403 (problem type forbidden). Another clinic''s record answers 404 (row-level security). Money is integer paise. Calendar dates are Asia/Kolkata (IST) dates as YYYY-MM-DD strings; instants are date-time. Errors are RFC 9457 application/problem+json; the type is https://sahaj.in/problems/<slug> and the slugs below are written without the prefix. Two general rules apply to every operation (release audit DEC-025, code review #2): (1) an {id} path value that is not a UUID answers 400 problem type bad-request (components/responses/BadRequest: title "Bad Request", detail "The request could not be understood. Check it and try again.", no fieldErrors, nothing submitted is echoed); it is listed on every operation with an {id} path parameter, merged into the description where the operation also has its own 400 validation answer. (2) A request body over the size limit answers 413 problem type payload-too-large (components/responses/PayloadTooLarge: title "Request too large", detail "The request body must be 64 KB or smaller."); the limit is 64 KB for a signed-in user (property sahaj.request-body.max-bytes, never below 4 KB; the detail names the configured limit) and 4 KB for any request without a signed-in user, where the detail reads "4 KB". It is listed on every operation with a request body and applies equally to a body sent to an operation that declares none. SAH-34 (ADR-017; design note docs/architecture/SAH-34-ward-scoping-and-break-glass.md): one patient scope per request, built from the signed-in user, the clinic switch "Nurses see only their wards" (ipd.config, off by default) and the server''s data, never from the request. Every operation marked x-scope-guard applies it: lists filter (kind list), by-id reads and writes refuse with 403 problem type outside-scope (components/responses/OutsideScope: title "Outside your scope", detail "This patient is not in your wards.", no patient data), answered after the role, module, membership and 404 checks and before the operation''s own state checks; writes decide it after the admission row lock. Operations without x-scope-guard are exempt (the written list of the design note, section 1.3); IpdScopeCoverageTest compares this contract with the code. With the switch off (every clinic at deploy) every answer is as before SAH-34. Fields marked x-needs-human are optional and wait for the human. 0.2.0 (12 Nov 2026, SAH-58-2, ADR-022 D12; additive): POST /admissions accepts treatmentCourseSittingId (Admit now from a treatment course); in the admission transaction ipd links the planned day-care or IPD sitting through opd.api TreatmentCoursePort (409 course-sitting-not-available when it is not a planned, unlinked day-care or IPD sitting of this patient in an active course) and carries the course credit earmarked for that sitting through billing.api CourseCreditPort, recorded as a deposit with source COURSE (no mode) and shown on the running bill as "From treatment course TC-<n>"; the toast reads "Admitted · <IP number>. Advance from this course is carried to the IPD bill.". IPD_ADMITTED audit gains treatmentCourseId and carriedPaise. DepositEntry gains source and courseNo. ipd also implements the opd.api ports PatientIpdHistorySource (EMR Past visits, SAH-50; ward scope and break-glass applied as on a by-id read) and CourseAdmissionSource (status, IP number and bill total of admissions linked to course sittings); neither adds an HTTP operation here.'
servers:
  - url: /api/v1/ipd
security:
  - bearer: []
paths:
  /layout:
    get:
      tags: [SAH-22]
      responses:
        '200': { description: 'The whole bed layout, categories and charges', content: { application/json: { schema: { $ref: '#/components/schemas/IpdLayout' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /wards:
    post:
      tags: [SAH-22]
      description: Name 1 to 80 characters, unique in the clinic ignoring case. With rooms on, a first room named Room (100 x number of wards + 1) is created too.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 80 } } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/IpdLayout' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /wards/{id}/rooms:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [SAH-22]
      description: Adds a room named Room (highest room number in the ward + 1), or 100 x the ward position + 1.
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/IpdLayout' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /beds:
    post:
      tags: [SAH-22]
      description: Adds a bed. 409 problem type bed-limit ("Your plan allows N beds. Ask Sahaj to raise the limit.") at the clinic's bed limit. Code and default category are derived as described in SAH-22 AC5.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [wardId], properties: { wardId: { type: string, format: uuid }, roomId: { type: [string, 'null'], format: uuid } } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/IpdLayout' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /beds/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [SAH-22]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [categoryKey], properties: { categoryKey: { $ref: '#/components/schemas/CategoryKey' } } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/IpdLayout' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation (the operation''s own field errors); or bad-request when the {id} path value is not a UUID (components/responses/BadRequest)' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
    delete:
      tags: [SAH-22]
      description: 409 problem type bed-occupied when a patient is in the bed.
      responses:
        '200': { description: Removed, content: { application/json: { schema: { $ref: '#/components/schemas/IpdLayout' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /room-level:
    put:
      tags: [SAH-22]
      description: Use rooms on or off. Stored rooms and bed links are kept.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [on], properties: { on: { type: boolean } } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/IpdLayout' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /categories/{key}:
    parameters:
      - { name: key, in: path, required: true, schema: { $ref: '#/components/schemas/CategoryKey' } }
    put:
      tags: [SAH-22]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [ratePaise, multiplier], properties: { ratePaise: { type: integer, minimum: 0, maximum: 10000000 }, multiplier: { type: number, minimum: 0.5, maximum: 5, description: Up to two decimals. } } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/IpdLayout' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /charges:
    put:
      tags: [SAH-22]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [bedDayCut, nursingPaise, visitPaise], properties: { bedDayCut: { type: string, enum: [midnight, 24h] }, nursingPaise: { type: integer, minimum: 0, maximum: 10000000 }, visitPaise: { type: integer, minimum: 0, maximum: 10000000 } } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/IpdLayout' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /admission-rules:
    get:
      tags: [SAH-23]
      description: OWNER, FRONT_DESK, NURSE, DOCTOR.
      responses:
        '200': { description: Minimum deposit rules, content: { application/json: { schema: { $ref: '#/components/schemas/AdmissionRules' } } } }
        '403': { $ref: '#/components/responses/Problem' }
    put:
      tags: [SAH-23]
      description: OWNER only. Whole rupees (multiples of 100 paise) between 0 and 100000000 paise; alertPercent 50 to 100 in steps of 5. Keeps the confirmed flag as it is.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdmissionRulesInput' } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/AdmissionRules' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /admission-rules/confirm:
    post:
      tags: [SAH-23]
      description: OWNER only. Marks the deposit rules as confirmed (idempotent).
      responses:
        '200': { description: Confirmed, content: { application/json: { schema: { $ref: '#/components/schemas/AdmissionRules' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admission-options:
    get:
      tags: [SAH-23, SAH-28]
      description: 'Data for the Admit-a-patient sheet. OWNER, FRONT_DESK, NURSE. SAH-28: with emergencyCaseId (the Admit button on an emergency card) the answer also carries emergencyCase, the hand-off data for the sheet (subtitle "From Emergency", Admission type Emergency, Reason for admission = the complaint, the suggested bed, and the name, age, sex and mobile for the patient search or the "Register a new patient" dialog). Check order with emergencyCaseId: role 403 forbidden; module Off 403 module-off; case not found or another clinic''s 404 not-found; case closed (Admitted, Released or Referred) 409 case-closed ("This patient is no longer in the queue."). The mobile is read from the case while it is open (it is cleared when the case closes, so the hand-off is the only answer that carries it). Reading it with emergencyCaseId changes no case, writes no record-access row (an emergency case has no patient record before it is admitted; OQ-28-1), and writes one audit row IPD_ER_HANDOFF_OPENED for each 200 answer (security review M3): the case id and the acting user id only (the audit row''s actor), never the name, age, sex, mobile or complaint; a 403, 404 or 409 writes no audit row. The case, the setup and the beds are read in one REPEATABLE READ transaction (read-write because of the audit row; ADR-005 D6), so a scale change during the read cannot give a 500. The queue list (GET /emergency) and the counts stay unlogged. Without emergencyCaseId the answer is as in SAH-23, emergencyCase is null and nothing is audited.'
      parameters:
        - { name: emergencyCaseId, in: query, required: false, schema: { type: string, format: uuid }, description: 'SAH-28. The emergency case being admitted.' }
      responses:
        '200': { description: 'Doctors, free beds, rules', content: { application/json: { schema: { $ref: '#/components/schemas/AdmissionOptions' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admissions:
    get:
      tags: [SAH-23, SAH-27, SAH-28, SAH-33, SAH-35, SAH-36, SAH-37]
      description: 'OWNER, FRONT_DESK, NURSE, DOCTOR. Admitted patients only: a discharged patient leaves the list, the Admitted count and the deposit alert count (SAH-27). There is no discharged list (OQ-27-6). SAH-28: the answer also carries emergency (EmergencyCounts) for the second tile "Emergency" and the count on the Emergency tab of Beds and admissions. SAH-33 (ADR-007 D8): the answer also carries safety (AdmissionSafety) for OWNER, DOCTOR and NURSE, null for every other role: the count on the Safety tab and the red banner "Open safety board" at the top of the Admitted patients tab. The role for safety is the token role and the role re-read from the active membership (platform.api TeamMemberPort.findActiveByUserId); safety is null unless both are OWNER, DOCTOR or NURSE. Writes no record-access row (a list). SAH-36 (ADR-013): the same answer feeds the Cards and the Table view of the Admitted tab. The rows are AdmittedPatientRow (uhid, wardId, roomName, and clinical only for OWNER, DOCTOR and NURSE: absent, not null, for every other role); the list carries asOf, wards (ward filter) and card (action abilities, once per list). One read-only REPEATABLE READ transaction, one asOf (database clock), a fixed number of set queries whatever the number of patients (ADR-013 D2); never one request per patient. The membership is re-read once, first: no active membership, or a membership role other than OWNER, FRONT_DESK, NURSE or DOCTOR, answers 403 forbidden (ADR-013 D3; a tightening). No search, ward, limit or cursor parameter: search, ward filter and "Show 24 more" work on the device over the whole loaded list, and the typed search text is never sent (ADR-013 D8). Still writes no record-access row, on first load or on reload (ADR-013 D10; OQ-36-7, human to confirm). The client reloads it every 60 seconds while the Admitted tab and the browser tab are visible, and after any change; on that tab this reload replaces the GET /safety/summary poll (ADR-013 D7). Never logged (names, UHID, allergy text, scores). SAH-37 (ADR-015 D4, D6): the answer also carries cardSetup (the published card setup, repaired and resolved; read in the same transaction, so the facts and the setup of one answer always agree, AC60), card.visibleGroups and card.deposit. The new card facts (clinical.diagnosis, clinical.latestVitals, mobile) are sent only when both the caller may see their data group (token role and membership role; CardDataGroup) and, with cardFacts=setup, the published setup has the field switched on in a section that is on; otherwise they are absent (not null). With the Sahaj standard setup none of them is sent. A fixed number of set queries still: at most one more for the live setup, one batch of recorder names (only when Last recorded is on) and one batch patient read for the owner''s mobile (only when Mobile is on and the caller is OWNER). Still no record-access row. Never logged (diagnosis, readings, mobile).'
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [ADMITTED], default: ADMITTED } }
        - name: cardFacts
          in: query
          required: false
          schema: { type: string, enum: [setup, all], default: setup }
          description: 'SAH-37 (ADR-015 D6, D7). setup (default; the Admitted page and its 60-second reload): new card facts only for fields the published setup switches on. all: every new card fact the caller may see, whatever the setup says; OWNER only (token role and membership role), for the live preview of Clinic setup > Patient card, read when that page opens and on Try again, never polled; any other role 403 forbidden (the shared forbidden problem: title "Not allowed", detail "You do not have access to this."; no text of its own). Any other value 400 bad-request.'
      responses:
        '200': { description: Admitted patients with bed counts, content: { application/json: { schema: { $ref: '#/components/schemas/AdmissionList' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'status or cardFacts is not one of its values (as today for status; components/responses/BadRequest shape)' }
        '403': { $ref: '#/components/responses/Problem', description: 'module-off; forbidden (role or membership outside OWNER, FRONT_DESK, NURSE, DOCTOR; or cardFacts=all from a role other than OWNER; always the shared forbidden problem, detail "You do not have access to this.")' }
      x-scope-guard:
        kind: list
        story: SAH-34
        note: 'Rows filtered to the caller''s scope in the same set read (ward of the current bed in the nurse''s live wards, or the admission of an active emergency access grant of hers). AdmissionList.scope (N of M, hasWard, canOpenEmergencyAccess), AdmittedPatientRow.mine and AdmittedPatientRow.emergencyAccess are added. depositAlerts, goingHomeToday and safety.counts follow the scoped set; bed counts, dischargedToday and emergency stay clinic-wide; wards lists every ward (OQ-34-22). A NURSE with no live ward while the switch is on gets items empty, never every patient. Still no record-access row (DEC-021); with the switch on the list shows only the user''s wards.'
    post:
      tags: [SAH-23, SAH-28]
      description: 'OWNER, FRONT_DESK, NURSE. Check order and messages: patient exists (404); not already admitted (409 already-admitted); doctor is an active doctor (400); bed exists and is free (409 bed-not-free); consent signed (400); deposit at least the minimum when payer is Self unless emergency and the clinic allows emergency without deposit (400). One transaction: IP number, admission, bed occupied, first deposit. SAH-28: with emergencyCaseId (Admit from an emergency card) the case is checked first, after the clinic IPD advisory lock is taken and before the patient check: case not found or another clinic''s 404 not-found; case not Waiting or Seen 409 case-closed ("This patient is no longer in the queue."; also when someone released, referred or admitted it while the sheet was open). The case row is locked for update. Then the SAH-23 order runs unchanged (admissionType is not forced; the sheet only preselects Emergency). In the same transaction: the admission is stored with source EMERGENCY (DIRECT without emergencyCaseId), and the case becomes ADMITTED with closedAt (the database clock read after the clinic lock, clock_timestamp(); ADR-005 D6), closedBy, admissionId and patientId = the admitted patient, which frees its bay, and its mobile is cleared (set to null) in the same update (security review M1(a); the patient record now holds the mobile); audits IPD_ADMITTED (source EMERGENCY) and IPD_ER_ADMITTED (case id, admission id, level, bay, closedAt; never the name, mobile, age or complaint). Any later failure rolls both back, and the case stays in the queue. Cancelling the sheet sends nothing.'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdmissionInput' } } }
      responses:
        '201': { description: Admitted, content: { application/json: { schema: { $ref: '#/components/schemas/AdmissionDetail' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /admission-requests:
    get:
      tags: [SAH-67, SAH-58]
      operationId: listAdmissionRequests
      summary: Admission requests waiting for a bed (from the doctors' EMR and from treatment courses)
      description: >-
        SAH-67-3 (OQ-45-31 default; ADR-025 D10) and the course sittings of ADR-022 H13. OWNER, FRONT_DESK, NURSE
        (the admit roles); every other role 403 forbidden; module Off 403 module-off; allowed in Read-only (the Admit
        button is then hidden). Open EMR requests (read through opd.api EmrAdmissionRequestPort) and planned
        day-care or IPD course sittings with admissionRequested (opd.api TreatmentCoursePort), newest first, at most
        200. Each row: patient name, age and sex (or an Emergency case's display name), the type ("Planned",
        "Emergency", "Day care", or "IPD <n> days"), the requesting doctor, the diagnoses text and the doctor's note,
        the time. "Admit" opens the existing admission sheet pre-filled (patient, admission type, reason from the
        diagnoses) with admissionRequestId (or treatmentCourseSittingId, or emergencyCaseId for a case); bed, deposit
        and consent follow SAH-23. A request of a patient who already has an open admission shows "Already admitted ·
        <IP number>" without Admit. Writes no record-access row (a list). Names, diagnoses and notes on screen only;
        never logged. Not filtered by ward scope (a request has no bed yet). 0.3.1 (ADR-025 D10, DEC-048 H33): the
        clinical text goes only to the roles that need it. OWNER and NURSE: diagnoses and note as stored. FRONT_DESK:
        diagnoses and note are null on every row (the row shows patient, type, stay, requesting doctor and time), and
        "Admit" opens the sheet with an empty reason (stored as "Under evaluation" when left blank, SAH-23). Nurse rows
        stay hospital-wide.
      responses:
        '200': { description: Requests, content: { application/json: { schema: { $ref: '#/components/schemas/AdmissionRequestList' } } } }
        '401': { $ref: '#/components/responses/Problem' }
