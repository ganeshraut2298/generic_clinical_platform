  /admissions/{id}/discharge:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [SAH-27, SAH-33]
      description: 'Data for the Discharge sheet (mockup openDis). OWNER, FRONT_DESK, NURSE, DOCTOR. Changes no IPD data and never creates a settings row. Check order: module Off 403 module-off; role 403 forbidden; admission not found or another clinic''s 404; not Admitted 409 not-admitted ("This patient is not admitted any more."). After the 404 and not-admitted checks pass, writes one patient.record_access row through patient.api (the sheet returns the patient name and the diagnosis; ADR-004 review decision a). A 403, 404 or 409 answer writes nothing. Allowed in Read-only state (the flags canSign, canDischarge and canRefund are then false). The bill is the running bill as it is now (SAH-25/26), computed by the server. SAH-33 (ADR-007 D6): openEscalation tells the sheet that the admission has an early warning escalation that is not closed (status OPEN or ACK), for the warning shown before the button is pressed (DischargeSheet.openEscalation); it is a boolean only, with no score, because FRONT_DESK opens the sheet. SAH-33 review fix (security review SAH-33 M1, ADR-007 R2): signoffBeforeEscalation tells the sheet that the latest sign-off is not later than the start of the response clock of that escalation, so it does not cover it (DischargeSheet.signoffBeforeEscalation).'
      responses:
        '200': { description: Discharge sheet, content: { application/json: { schema: { $ref: '#/components/schemas/DischargeSheet' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden or module-off; outside-scope (SAH-34; components/responses/OutsideScope; after the 404 check, before not-admitted and before the record-access row)' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
      x-scope-guard: { kind: admission, story: SAH-34 }
    post:
      tags: [SAH-27, SAH-33]
      description: 'Completes the discharge (mockup ipdisok). OWNER, FRONT_DESK (OQ-27-1). Before the story order: role 403 forbidden (the role check runs first, as on every IPD endpoint; module Off 403 module-off is then answered to allowed roles); body 400 (type "Choose a discharge type", templateKey "Choose a summary template", expectedTotalPaise or expectedDepositsPaise "Review the final bill and try again"). SAH-33 review fix (security review SAH-33 M2, ADR-007 R3): the first step inside the discharge transaction, before the advisory lock and before any write, reads the caller''s membership again (platform.api TeamMemberPort.findActiveByUserId): no active membership, or a membership role other than OWNER or FRONT_DESK, 403 forbidden and nothing written, so a removed or demoted member cannot discharge (or close an escalation) with an old session; the refund-needs-owner check below uses this membership role, not the token role. Then, in this order (SAH-27 AC7): admission not found or another clinic''s 404; not Admitted 409 not-admitted ("This patient is not admitted any more. The patient cannot be discharged."; also the answer to a repeated tap or a second user, AC9); IPD Read-only 409 ipd-readonly; the latest sign-off of the admission is not for the sent type and template 409 summary-not-signed ("The doctor signs the summary first"); SAH-33 (ADR-007 D6, OQ-33-5, security review SAH-30 L4; clinical sign-off pending): the admission has an early warning escalation that is not closed (status OPEN or ACK, read after the admission row lock below, so a vitals save that raises or re-opens one cannot race past this check) and the signed type is normal 409 escalation-open ("This patient has an early warning escalation that is not closed. A doctor must record the response first."; nothing written); for the types death, lama and referred, when the latest sign-off (the one that passed summary-not-signed) is not later than the start of the escalation''s response clock (reopenedAt, else raisedAt; strictly later is required, both instants are database time; security review SAH-33 M1, ADR-007 R2), 409 escalation-open ("This patient has an early warning escalation that started after the doctor signed the summary. A doctor must record the response or sign the summary again."; nothing written); otherwise the discharge goes on and closes the escalation in the same transaction (below). For normal the first refusal applies whatever the sign-off time, because signing again cannot lift it; expectedTotalPaise or expectedDepositsPaise differs from the server''s running bill total or deposits 409 bill-changed ("The bill changed. Review the final bill and try again."); the server balance is below 0 and the role is not OWNER 403 refund-needs-owner ("Only the owner can refund a deposit."; OQ-27-3); the server balance is not 0 and mode is missing 400 field mode "Choose UPI, Cash or Card". The amount collected or refunded is always the server balance (total minus deposits), never a request value; mode is ignored and stored empty when the balance is 0. One transaction under the clinic IPD advisory lock with the admission and its bed locked for update: final bill frozen (every line, total, deposits, balance, bill days, bed category, multiplier, day cut), settlement recorded, admission DISCHARGED with dischargedAt, bed to Cleaning (clean), discharge record written, and unless the type is death an OPD follow-up created through opd.api FollowUpPort (admitting doctor; due on the IST discharge day plus followUpDays; reason "Review after discharge · <reason for admission>" cut to 200 characters); SAH-33: for death, lama or referred with an escalation not closed, after the admission is marked DISCHARGED, the escalation becomes DONE with response action CLOSED_AT_DISCHARGE, no plan, closed by the caller (the acknowledgement, if any, is kept), the clinical event (kind esc) "Escalation closed at discharge (death) · no doctor response recorded" ("(on request (lama))", "(referred)": the DischargeType label in lower case) and the audit IPD_ESCALATION_CLOSED_AT_DISCHARGE (escalationId, admissionId, ewsScore, ewsRisk, statusBefore, dischargeType). A bed transfer (SAH-26) never touches the escalation. Audited as IPD_DISCHARGED (admission id, IP number, type, total, balance, mode, bed code; never the patient name, mobile or reason). Answers the admission in its discharged state; the client builds the toast from discharge, finalBill, bedCode and patientName.'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DischargeInput' } } }
      responses:
        '200': { description: The discharged admission with the frozen final bill, content: { application/json: { schema: { $ref: '#/components/schemas/AdmissionDetail' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation (the operation''s own field errors); or bad-request when the {id} path value is not a UUID (components/responses/BadRequest)' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden, module-off or refund-needs-owner; outside-scope (SAH-34; components/responses/OutsideScope; after the 404 check under the admission lock, before not-admitted)' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem', description: 'not-admitted, ipd-readonly, summary-not-signed, escalation-open (SAH-33: an escalation not closed and the signed type is normal; or the type is death, lama or referred and the sign-off is not later than the escalation''s response clock start), bill-changed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
      x-scope-guard: { kind: admission-locked, story: SAH-34, note: 'OWNER and FRONT_DESK are scope all in phase 1; the guard is called for uniformity. A discharge ends the effect of every emergency access grant on the admission (grants stay for review).' }
  /admissions/{id}/discharge/signoff:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [SAH-27, SAH-33]
      description: 'The checkbox "Summary checked and signed by <doctor>" (mockup data-dis signed). DOCTOR, OWNER (OQ-27-1); other roles 403 forbidden. The role is not taken from the token alone: the server re-reads the caller''s membership in this clinic and answers 403 forbidden unless it is active with role DOCTOR or OWNER (a removed or changed member cannot sign with an old session). Check order: module Off 403 module-off; role 403 forbidden; body 400 (type "Choose a discharge type", templateKey "Choose a summary template"); admission not found or another clinic''s 404; not Admitted 409 not-admitted ("This patient is not admitted any more. The summary cannot be signed."); Read-only 409 ipd-readonly. Locks the admission row for update so a sign-off and a discharge never interleave. Appends a sign-off (who, when, type, template) and audits IPD_DISCHARGE_SIGNED (admission id, type, template). When the latest sign-off already has the same type and template nothing is written and the sheet is returned as it is (a double tap is harmless), except (SAH-33 review fix, security review SAH-33 M1, ADR-007 R2) when the admission has an escalation not closed (status OPEN or ACK) and that sign-off is not later than the start of its response clock (reopenedAt, else raisedAt): then a new sign-off is appended and audited as above, so a doctor who has seen the escalation can sign again (the read of the escalation runs under the admission lock this call already takes). A sign-off cannot be undone; choosing another type or template on the sheet simply no longer matches it, and the doctor signs again. A sign-off on today''s IST date marks the patient Going home today (OQ-27-5).'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DischargeSignoffInput' } } }
      responses:
        '200': { description: The sheet with the new signature, content: { application/json: { schema: { $ref: '#/components/schemas/DischargeSheet' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation (the operation''s own field errors); or bad-request when the {id} path value is not a UUID (components/responses/BadRequest)' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden or module-off; outside-scope (SAH-34; components/responses/OutsideScope)' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
      x-scope-guard: { kind: admission-locked, story: SAH-34, note: 'DOCTOR and OWNER are scope all in phase 1; the guard is called for uniformity.' }
  /admissions/{id}/nursing:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [SAH-30]
      description: >-
        The Nursing sheet, tab "Vitals and notes" (mockup pcNursing). Opened from the Nursing button of the
        admission sheet (AdmissionDetail.canOpenNursing; OQ-30-1). OWNER, NURSE, DOCTOR (OQ-30-3); FRONT_DESK,
        BILLING, VISITING_DOCTOR and every other role 403 forbidden. Check order: role 403 forbidden (the role
        check runs first, as on every IPD endpoint); module Off 403 module-off; then, inside the read
        transaction, the role is read again from the caller's active membership (platform.api
        TeamMemberPort.findActiveByUserId, the OwnerGuard pattern; security review SAH-30 M1): no active
        membership, or a membership role outside OWNER, NURSE, DOCTOR 403 forbidden, so a role change applies at
        once and not when the access token expires; admission not found or another clinic's 404 not-found
        (row-level security); the admission's patient not found through patient.api PatientLookupPort 404
        not-found (never a placeholder name; review N6). canRecord and readOnlyReason use the role re-read from
        the membership (NursingSheet.canRecord). Allowed in Read-only state and for a DISCHARGED admission
        (AC11); canRecord is then false. Changes no IPD data and takes no lock. After the 404 checks pass it
        writes one patient.record_access row through patient.api PatientAccessPort, as GET /admissions/{id} and
        GET /admissions/{id}/discharge already do (ADR-006 D6; DEC-013 item 13; story AC13 is amended by the
        business-analyst once the human confirms). A 403 or 404 answer writes nothing. asOf is the database
        clock at the read (clock_timestamp(), read through a repository call; never the application clock;
        review M1), and vitalsDue is computed against that same asOf; the client forms every "ago" text from
        asOf minus the instant (NursingSheet), never from the device clock. The sheet is loaded when it opens
        and is not polled; its "ago" texts do not tick while it is open (mockup).
      responses:
        '200': { description: The Nursing sheet, content: { application/json: { schema: { $ref: '#/components/schemas/NursingSheet' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden (token role, or the role re-read from the membership, is not OWNER, NURSE or DOCTOR) or module-off; outside-scope (SAH-34; components/responses/OutsideScope; after the 404 checks, before the record-access row)' }
        '404': { $ref: '#/components/responses/Problem', description: 'not-found (admission missing, another clinic''s, or its patient missing)' }
      x-scope-guard: { kind: admission, story: SAH-34 }
  /admissions/{id}/vitals:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [SAH-30, SAH-33]
      description: >-
        Save vitals and note (mockup pcvsave, wrapped by the Safety layer: sfLog, sfRaise). OWNER, NURSE
        (OQ-30-3); DOCTOR, FRONT_DESK, BILLING, VISITING_DOCTOR and every other role 403 forbidden. Check order:
        role 403 forbidden; module Off 403 module-off; Read-only 409 ipd-readonly ("IPD is read-only. Nothing can
        be changed."); clientKey missing or not a UUID 400 (field clientKey, "Reload the page and try again.");
        body 400 problem type validation with fieldErrors (rules and messages on VitalsInput; every field error
        together, in the order bp, pulse, spo2, temp, rr, note; detail is the first message). The body is checked
        before any lock is taken. Then one READ COMMITTED transaction (declared explicitly, review M3). Its first
        step, before any lock: the role is read again from the caller's active membership (platform.api
        TeamMemberPort.findActiveByUserId, the OwnerGuard pattern; security review SAH-30 M1): no active
        membership, or a membership role other than OWNER or NURSE, 403 forbidden and nothing written, so a nurse
        moved to another role is refused at once and not when the access token expires. The transaction then
        takes exactly one row lock, the admission row; no IPD tenant advisory lock and no bed lock (ADR-006 D4:
        the bare admission row is locked first with select id, status ... for no key update, and the joined
        admission, bed and ward row is read in a second statement, review M2). Under it, in this order: admission
        not found or another clinic's 404 not-found; the admission's patient not found through patient.api
        PatientLookupPort 404 not-found (never a placeholder name; review N6); a vitals record with the same
        clientKey already exists for this admission: the request is a replay. Its parsed values (systolic,
        diastolic, pulse, spo2, temp in tenths, rr) and whether it carries a note (noteAdded: the note is not
        empty after the note rules of VitalsInput.note) are compared with the stored record; the note text itself
        is not compared (the note row is not linked to the vitals row, ADR-006 D2). All seven equal: 200 with the
        sheet as it is now, saved = that first record with replayed true and escalation.outcome NONE; nothing is
        written, audited or put in the clinical event log, but one patient.record_access row is written through
        patient.api PatientAccessPort, as on GET /admissions/{id}/nursing, because the answer is the full sheet
        (security review SAH-30 L2). Any one different: 409 problem type client-key-reused, detail "This reading
        was already saved with different values. Reload the page and try again.", and nothing is written (no
        access row either; security review SAH-30 L1: a reused key never silently drops a new reading). The
        clientKey was already used for another admission of the clinic 400 (field clientKey, "Reload the page and
        try again."); not Admitted 409 not-admitted ("This patient is not admitted any more. Vitals cannot be
        saved."). Then, with one instant t for every row of the save (the database transaction time): the score and risk are
        computed by the server from the five values (EarlyWarningScore, ADR-006 D3; the client never sends a
        score); one ipd.vitals row (the five values, score, risk, recorded_at t, recorded_by the caller,
        clientKey); one ipd.nursing_note row when the note is not empty after stripping (same user and t); the
        clinical event "Recorded vitals · EWS N (low)" (kind info; "medium", "high"). For MEDIUM or HIGH the
        escalation rule (AC8): with no open escalation (status OPEN or ACK) for the admission, one is inserted
        (score, risk, target 15 minutes for HIGH or 60 for MEDIUM, status OPEN, raised_at t, raised_by the
        caller), outcome RAISED, clinical event "Raised early warning escalation · EWS N (medium) · doctor review
        within 1 hour" ("within 15 min" for HIGH; kind esc); with an open one whose score is lower than the new
        score, its score, risk and target are replaced (raised_at, raised_by, status and any acknowledgement are
        kept, except on a re-open, below; version + 1), outcome UPDATED, clinical event "Escalation updated · EWS now N (high)" (kind esc);
        with an open one whose score is equal or higher, nothing changes, outcome NONE. SAH-33 (AC12, ADR-007 D4,
        security review SAH-30 L3; DEC-015 OQ-33-4, clinical sign-off pending): when the open one is Acknowledged
        (status ACK) with risk MEDIUM and the new risk is HIGH, it is re-opened in the same transaction: status
        OPEN, score, risk HIGH and target 15 replaced, the acknowledgement cleared, the response clock restarted at
        t (reopenedAt; raisedAt and raisedBy are kept), version + 1, outcome REOPENED, clinical event "Escalation
        re-opened · EWS now N (high) · doctor review within 15 min" (kind esc), audit IPD_ESCALATION_REOPENED
        (escalationId, admissionId, ewsScore, ewsRisk, previousScore, previousRisk); the earlier "Acknowledged
        escalation after N min" stays in the log. An Acknowledged one with a higher score inside the same risk
        (or HIGH to a higher HIGH) is UPDATED as above and stays ACK. A LOW score never raises,
        updates, re-opens or closes an escalation (outcome NONE). Nothing is ever edited or deleted (OQ-30-5: a wrong entry
        is followed by a new one). Audits IPD_VITALS_RECORDED (admissionId, vitalsId, ewsScore, ewsRisk,
        noteAdded, escalationId, escalationOutcome RAISED, UPDATED, REOPENED or NONE; never a vital value, the note
        or a name). No message is sent
        to anyone (OQ-30-2; notifications are not in phase 1). Answers 201 VitalsSaved: the sheet after the save
        (latest = the new record, the new note first in recentNotes). asOf, on the 201 and on a 200 replay, is
        the database clock read after the writes (clock_timestamp(), never the application clock; review M1),
        so asOf is never before latest.recordedAt and the subtitle reads "last vitals 0 min ago" unless the save
        waited a minute or more on the lock; vitalsDue is computed against that same asOf. Toast, built by the
        client: saved.ewsRisk LOW, or MEDIUM or HIGH with escalation.open null (only possible on a replay after
        the escalation was closed): "Vitals saved for <patientName> · early warning <saved.ewsScore> (low)" (risk
        in lower case; unchanged); MEDIUM or HIGH with escalation.open set: "Escalation raised for <patientName> ·
        EWS <saved.ewsScore> · doctor review within 15 min. Tell the doctor now: no alert is sent."
        (open.targetMinutes 15) or "Escalation raised for <patientName> · EWS <saved.ewsScore> · doctor review
        within 1 hour. Tell the doctor now: no alert is sent." (60). This wording departs from the mockup (which
        ends " · duty doctor alerted") on purpose, because no alert is sent in phase 1 (security review SAH-30 M2;
        DEC-013 item 13); SAH-33 keeps it unchanged (AC22, OQ-33-11: the board only helps when someone looks at
        it). The escalation toast reads "raised" also when the open escalation was updated, re-opened or left as
        it was (mockup sfRaise; ADR-006 question Q2). Client
        behaviour (AC12): Save is disabled while the request runs; a 400, 403, 404, 409 (including
        client-key-reused), 5xx or network failure keeps every typed value and the note and shows the problem
        detail as an error toast; the sheet is shown as saved only after a 200 or 201; there is no offline queue.
        clientKey is made when the sheet opens, kept while the same values are retried after a failure, and
        replaced after a success or when the user changes a field or the note; after a 409 client-key-reused the
        client makes a new key and keeps the typed values (a retry with the old key would be refused again;
        tech lead decision, DEC-013 item 13). After a success Save
        stays disabled until the user types in a field or the note (review M4). Same-values confirmation (security
        review SAH-30 M3, DEC-013 item 13; no server change): when latest is set and the five typed values, after
        the client format check, equal latest exactly (bpSystolic, bpDiastolic, pulse, spo2, tempC to one
        decimal, rr; the note is not part of the comparison), the first tap on Save sends nothing and shows the
        notice "These are the same values as the last reading. Check them against the patient, then choose
        Save again to confirm." (contract wording, not the mockup's); the second tap saves; any edit of a field or the note
        removes the notice and needs the confirmation again. The server accepts equal values as a new reading.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VitalsInput' } } }
      responses:
        '200': { description: 'Repeat of a clientKey already used for this admission, with the same values: the sheet now and the first record; only the record-access row is written', content: { application/json: { schema: { $ref: '#/components/schemas/VitalsSaved' } } } }
        '201': { description: 'Saved: the sheet after the save, the saved record and the escalation outcome', content: { application/json: { schema: { $ref: '#/components/schemas/VitalsSaved' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation (fieldErrors on bp, pulse, spo2, temp, rr, note, or clientKey: missing, not a UUID, or used for another admission); or bad-request when the {id} path value is not a UUID (components/responses/BadRequest)' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden (token role, or the role re-read from the membership, is not OWNER or NURSE) or module-off; outside-scope (SAH-34; components/responses/OutsideScope; after the admission lock and the 404 checks, before the clientKey replay check and not-admitted; nothing written, no record-access row)' }
        '404': { $ref: '#/components/responses/Problem', description: 'not-found (admission missing, another clinic''s, or its patient missing)' }
        '409': { $ref: '#/components/responses/Problem', description: 'ipd-readonly; client-key-reused ("This reading was already saved with different values. Reload the page and try again."); not-admitted' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
      x-scope-guard: { kind: admission-locked, story: SAH-34, note: 'An emergency access grant that expired before the lock was taken does not count (checked against clock_timestamp() under the lock).' }
  /emergency:
    get:
      tags: [SAH-28]
      description: >-
        The Emergency page (mockup ipEr): levels of the clinic's triage scale, bays, quick-registration
        options and the queue. OWNER, FRONT_DESK, NURSE, DOCTOR; others 403 forbidden. Check order: role 403
        forbidden; module Off 403 module-off. Allowed in Read-only state (every can* flag is then false; the menu
        item, tab and header button are hidden by the client). The queue holds the cases with status WAITING or
        SEEN, ordered by level (1 = most urgent first), then by arrivedAt (longest wait first), then id (as a
        UUID compare: the server's java.util.UUID order, which is not the PostgreSQL uuid order; it only makes the
        order stable).
        waitingMinutes and overTarget are computed at read time from arrivedAt and the clinic's current targets;
        nothing is stored or scheduled. The "now" of the waits is the database clock (clock_timestamp(), the same
        clock that stamps arrivedAt, seenAt and closedAt; ADR-005 D6) and is returned as asOf. The setup and the
        open cases are read in one snapshot (one REPEATABLE READ read-only transaction, ADR-005 D6), so a scale
        change saved during the read can never pair a level-4 or level-5 case with the 3-colour setup. This read
        writes nothing, takes no lock, and writes no record-access row or audit row (a list; no case has a
        patient record before admission; OQ-28-1). The client reloads it every 60 seconds while the page is
        open; every action below answers the same shape, so no reload is needed after an action.
      responses:
        '200': { description: The emergency queue, content: { application/json: { schema: { $ref: '#/components/schemas/EmergencyQueue' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /emergency/summary:
    get:
      tags: [SAH-28]
      description: >-
        Counts only (no names or clinical text), for the badge of the menu item "Emergency" (ADR-005: the shell
        reads the badge from the owning module, not from GET /platform/me). OWNER, FRONT_DESK, NURSE, DOCTOR;
        others 403 forbidden. Module Off 403 module-off. Allowed in Read-only state (writable false). Same rules
        as EmergencyQueue.counts, read in one snapshot (REPEATABLE READ, read-only) with the waits on the
        database clock (ADR-005 D6). The shell calls it only when /me.menu contains emergency: after sign-in,
        every 60 seconds, and it takes the counts of any EmergencyQueue answer it sees.
      responses:
        '200': { description: Counts, content: { application/json: { schema: { $ref: '#/components/schemas/EmergencyCounts' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /emergency/cases:
    post:
      tags: [SAH-28]
      description: >-
        Register and add to queue (mockup erreg). OWNER, FRONT_DESK, NURSE, DOCTOR; others 403 forbidden. Check
        order: role 403 forbidden; module Off 403 module-off; Read-only 409 ipd-readonly; clientKey missing or not
        a UUID 400 (field clientKey, "Reload the page and try again."). Then, under the clinic IPD advisory lock:
        when a case with the same clientKey already exists in this clinic the answer is 200 and nothing is
        written or audited, whatever the body says (AC13: a repeat never puts the patient twice in the queue).
        In that 200 actedCase is the full card (EmergencyCase, in its current state) only while the case is
        WAITING or SEEN and the caller is the user who registered it (registeredBy); otherwise (the case is
        closed, or another user sends the key) actedCase is EmergencyCaseRef and holds only id, level and status
        (security review L1). The client shows the registration toast only when actedCase has displayName; with
        an EmergencyCaseRef it shows no toast, clears the form and makes a new clientKey. Otherwise the body is
        checked, all field errors together as 400 problem type validation with fieldErrors, in this order:
        identityUnknown missing, null or not a JSON boolean (field identityUnknown, "Reload the page and try
        again."; the name checks are then skipped); identityUnknown true while Unknown patient registration is
        off (field identityUnknown, "Unknown patient registration is off. Enter a name."); identityUnknown false
        and name with a control or text-direction character (field name, "Name cannot contain control or
        text-direction characters"; checked on the NFC text before trimming, and then the other name checks are
        skipped); identityUnknown false and name blank or with no letter, for example only digits, punctuation or
        marks (field name, the same message for both: Enter a name, or tick "Name not known yet"); name over 80
        characters (field name, "Enter a name of up to 80 characters"); age not a whole
        number 0 to 120 (field age, "Enter the age as a whole number from 0 to 120, or leave it empty"); sex
        missing or not M, F or O (field sex, "Choose male, female or other"); mobile not empty and not a 10-digit
        mobile number (field mobile, "Enter a 10-digit mobile number, or leave it empty"); complaint with a
        control or text-direction character (field complaint, "Complaint cannot contain control or
        text-direction characters"; checked on the NFC text before trimming, and then the other complaint checks
        are skipped); complaint blank or with no letter and no digit, for example only punctuation or marks
        (field complaint, the same message for both: "Enter the main complaint"); complaint over 200 characters
        (field complaint, "Enter the main complaint in up to 200 characters"); level outside 1 to the clinic's
        scale (field level, "Choose a triage level"). The control or text-direction check of name and complaint
        is the IPD text rule (IpdText), which refuses any code point of Unicode general category Cf (format), Cc
        (control), Cn (unassigned), Co (private use) or Cs (surrogate), the line and paragraph separators U+2028
        and U+2029, the Hangul fillers U+115F, U+1160, U+3164 and U+FFA0, U+2800 (braille blank), U+180E, U+034F
        and the variation selectors U+FE00 to U+FE0F; the one allowance is ZWJ (U+200D) or ZWNJ (U+200C) directly
        after a virama and directly before a letter. This wider refusal set applies to every IpdText input: the
        SAH-26 ward, room and bed names, the SAH-23 admission reason, the SAH-28 name and complaint here, and the
        SAH-30 nursing note (where line breaks are allowed, see VitalsInput.note). Numeric fields must be JSON numbers: age and level sent as
        JSON strings (for example "40" or "2") are refused, never converted, with that field's message above, in
        the same list as the other field errors. Only the two messages of AC4 come from the story; the others
        are this contract's wording. Name and complaint are trimmed; an empty mobile string is stored as null;
        lengths count Unicode code points. Stored: displayName = the trimmed name, or for identityUnknown
        "Unknown male, about 40" ("female" for F, "person" for O; "?" for an empty age), identityPending =
        identityUnknown, the age, sex, mobile, complaint and level, status WAITING, arrivedAt = the database clock
        at the insert after the clinic lock (the column default clock_timestamp(), ADR-005 D6; never the
        transaction start time), registeredBy
        = the caller, and the bay: only when level is 1 (the most urgent level of either
        scale) and a bay is free, the lowest-numbered free bay of ER-1 to ER-<bays> (a bay is used while a WAITING
        or SEEN case holds it); otherwise null. Appends a triage event (REGISTERED, level, scale, at = the
        database clock at its insert, at or a few microseconds after arrivedAt and never before it, by). Audits
        IPD_ER_REGISTERED (case id, level, scale, bay, arrivedAt; never the name, age, sex, mobile or complaint).
        No patient record is created (OQ-28-1) and no message is sent to the duty doctor (OQ-28-5). Answers 201
        with the queue and actedCase = the new case; the client builds the toast "<displayName> added to the
        emergency queue · <levelName>" plus " · bay <bay>" when bay is set, then clears the form (level back to
        the default level) and makes a new clientKey.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmergencyCaseInput' } } }
      responses:
        '200': { description: 'Repeat of a clientKey already used: nothing written; actedCase is the full first case only while it is open and the caller registered it, otherwise EmergencyCaseRef (id, level, status)', content: { application/json: { schema: { $ref: '#/components/schemas/EmergencyQueue' } } } }
        '201': { description: 'Registered: the queue with actedCase', content: { application/json: { schema: { $ref: '#/components/schemas/EmergencyQueue' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /emergency/cases/{id}/seen:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [SAH-28]
      description: >-
        Doctor has seen (mockup erseen). OWNER, NURSE, DOCTOR; others (FRONT_DESK too) 403 forbidden. Check order:
        role 403 forbidden; module Off 403 module-off; Read-only 409 ipd-readonly; under the clinic IPD advisory
        lock with the case row locked for update: case not found or another clinic's 404 not-found; case
        ADMITTED, RELEASED or REFERRED 409 case-closed ("This patient is no longer in the queue."). A WAITING case
        becomes SEEN with seenAt = the database clock read after the clinic lock (clock_timestamp(), ADR-005 D6)
        and seenBy = the caller, and IPD_ER_SEEN is audited (case id, level, seenAt). A case already SEEN is answered as it is and nothing is written (a double tap is harmless). The
        case stays in the queue with its bay and arrival time; it is never over target once seen. Toast
        "<displayName> seen by the duty doctor".
      responses:
        '200': { description: 'The queue with actedCase', content: { application/json: { schema: { $ref: '#/components/schemas/EmergencyQueue' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /emergency/cases/{id}/level:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [SAH-28]
      description: >-
        Re-triage from the level list on the card (mockup erlvl, accessible name "Triage level for <name>"). OWNER,
        FRONT_DESK, NURSE, DOCTOR; others 403 forbidden. Check order: role 403 forbidden; module Off 403
        module-off; Read-only 409 ipd-readonly; level outside 1 to the clinic's scale 400 (field level, "Choose a
        triage level"); under the clinic IPD advisory lock with the case row locked for update: case not found or
        another clinic's 404 not-found; case closed 409 case-closed ("This patient is no longer in the queue.").
        Allowed for WAITING and SEEN cases. Changes the level only: arrivedAt (and so the wait), status and bay
        are kept; a bay is never given or taken by a re-triage (OQ-28-6). Appends a triage event (RETRIAGED,
        fromLevel, level, scale, at, by; at = the database clock read after the clinic lock, so racing
        re-triages are stored in the order they were applied, ADR-005 D6) and audits IPD_ER_RETRIAGED (case id, level before and after, at). The
        same level as now is answered as it is and nothing is written. Toast "<displayName> re-triaged to
        <levelName> · logged".
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmergencyLevelInput' } } }
      responses:
        '200': { description: 'The queue with actedCase', content: { application/json: { schema: { $ref: '#/components/schemas/EmergencyQueue' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation (the operation''s own field errors); or bad-request when the {id} path value is not a UUID (components/responses/BadRequest)' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /emergency/cases/{id}/release:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [SAH-28]
      description: >-
        Treat and release (mockup errel). OWNER, NURSE, DOCTOR; others (FRONT_DESK too) 403 forbidden. Check
        order: role 403 forbidden; module Off 403 module-off; Read-only 409 ipd-readonly; under the clinic IPD
        advisory lock with the case row locked for update: case not found or another clinic's 404 not-found; case
        not WAITING or SEEN 409 case-closed ("This patient is no longer in the queue."; also the answer to a
        repeated tap). The case becomes RELEASED with closedAt = the database clock read after the clinic lock
        (clock_timestamp(), ADR-005 D6) and closedBy = the caller; it leaves the queue and its bay is free. The
        case's mobile is cleared (set to null) in the same update (security review M1(a)); name, age, sex and
        complaint stay (retention is a human decision, DEC-013 item 12). No OPD visit and no bill are created (OQ-28-3). Audits IPD_ER_RELEASED (case
        id, level, bay, closedAt). Toast "<displayName> treated and released".
      responses:
        '200': { description: 'The queue with actedCase (now RELEASED)', content: { application/json: { schema: { $ref: '#/components/schemas/EmergencyQueue' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /emergency/cases/{id}/refer:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [SAH-28]
      description: >-
        Refer out (mockup erref). OWNER, NURSE, DOCTOR; others (FRONT_DESK too) 403 forbidden. Same check order,
        lock and 409 case-closed as release. The case becomes REFERRED with closedAt (database clock after the
        clinic lock, as release) and closedBy; it leaves the queue and its bay is free, and its mobile is cleared
        in the same update, as release. No referral letter is printed. Audits IPD_ER_REFERRED (case id, level, bay,
        closedAt). Toast "<displayName> referred out".
      responses:
        '200': { description: 'The queue with actedCase (now REFERRED)', content: { application/json: { schema: { $ref: '#/components/schemas/EmergencyQueue' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /emergency-settings:
    get:
      tags: [SAH-28]
      description: >-
        Clinic setup > Emergency and triage (key iper; mockup cfgIpEr), visible when IPD is Trial, On or
        Read-only. OWNER, FRONT_DESK, NURSE, DOCTOR; others 403 forbidden. Module Off 403 module-off. Defaults
        (scale 3, targets3 5/30/120, targets5 0/10/30/60/120, bays 2, unknown patient registration on) when the
        clinic never saved them; reading never creates a row. The setup overview line, if shown, is built by the
        client: "3 colours · <bays> bays" or "5 levels · <bays> bays".
      responses:
        '200': { description: Emergency setup, content: { application/json: { schema: { $ref: '#/components/schemas/EmergencySettings' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    put:
      tags: [SAH-28]
      description: >-
        OWNER only; other roles see the page read-only (canEdit false) and answer 403 forbidden. The whole setting
        is sent each time; the page saves each change at once (scale choice, each target stepper, bays stepper,
        switch). Check order: role 403 forbidden; module Off 403 module-off; Read-only 409 ipd-readonly; body 400
        problem type validation (scale "Choose 3 colours or 5 levels"; targets3 or targets5 wrong count or a value
        not 0 to 240 in steps of 5 "Choose a target from now to 240 minutes, in steps of 5"; bays "Choose 0 to 10
        bays"; unknownPatientRegistration "Choose on or off"). Known leniency, accepted: unlike POST
        /emergency/cases, a numeric value sent as a JSON string (for example scale "5", a target "30" or bays
        "2") is tolerated and read as the number, then checked with the same limits; this endpoint is OWNER only
        and the client always sends JSON numbers. There is no order rule between the target times
        of a scale: each target is checked on its own, so for example Red 120 with Green 5 is accepted (the
        mockup has no such rule). This is a decision pending the human (code review SAH-28 item 7, DEC-013 item
        10); no order check is added without the human. One transaction under the clinic IPD advisory lock.
        Both target sets are stored as sent, so the set of the scale not in use is kept (AC9). When scale changes,
        every WAITING or SEEN case gets its level mapped (AC10; OQ-28-2 clinical sign-off): 3 to 5 is 1 (Red) to
        2, 2 (Yellow) to 3, 3 (Green) to 5; 5 to 3 is 1 and 2 to 1 (Red), 3 to 2 (Yellow), 4 and 5 to 3 (Green).
        Each mapped case gets a triage event (SCALE_CHANGED, fromLevel, level, new scale, at = the database
        clock read after the clinic lock, by = the owner);
        arrivedAt, status and bay are kept. Targets of the new scale apply at once. Lowering bays never takes a
        bay from a case: a case keeps ER-n until it closes, and bays free counts only ER-1 to ER-<bays>. Audits
        IPD_ER_SETTINGS_UPDATED with the before and after values of scale, targets3, targets5, bays and
        unknownPatientRegistration and the number of cases remapped (never a name). When nothing differs from
        the stored values nothing is written or audited. Switching Unknown patient registration off does not
        change cases already registered as unknown.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmergencySettingsInput' } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/EmergencySettings' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /safety:
    get:
      tags: [SAH-33, SAH-35]
      description: >-
        The Safety board (mockup ipSafety): the Safety tab of Beds and admissions, the last tab (after Admitted
        patients, and after Emergency when that tab is shown). OWNER, DOCTOR, NURSE (DEC-015 OQ-33-1); FRONT_DESK,
        BILLING, VISITING_DOCTOR, PHARMACIST and every other role 403 forbidden (PHARMACIST gets the tab with
        SAH-31). Check order: role 403 forbidden (token role, checked first as on every IPD endpoint); module Off
        403 module-off; then, in one read-only REPEATABLE READ transaction (ADR-005 D6, so the counts, the notice
        and the rows always agree), the role is read again from the caller's active membership (platform.api
        TeamMemberPort.findActiveByUserId; security review SAH-30 M1): no active membership, or a membership role
        outside OWNER, DOCTOR, NURSE, 403 forbidden. Allowed in Read-only state (DEC-015 OQ-33-9; the action flags
        stay as for Trial and On). Rows: every early warning escalation that is open or acknowledged, and every
        closed one whose closedAt is within the last 24 hours before asOf (closedAt later than asOf minus 24
        hours, database clock; SAH-33 review fix, security review SAH-33 L5, OQ-33-13 proposal, ADR-007 R5), of
        every ADMITTED admission of the clinic (a discharged patient leaves the board with his escalations;
        mockup). An escalation closed longer ago is no longer on the board; it stays in the clinical audit trail
        ("Escalation closed: <action label>") and its stored plan is kept (never deleted). A closed row on the
        board still carries its plan text (EscalationResponse.note).
        The nurse sees every admitted patient until wards exist (OQ-33-2, open). asOf is the database clock
        (clock_timestamp()) read in the same transaction; every minute count and pastTarget is computed against
        it (ADR-007 D5); the device clock is never used. Patient names are read through patient.api
        PatientLookupPort.findAll, staff names through platform.api ActorDirectoryPort ("Team member" when not
        found). Writes nothing: no record-access row (DEC-015 OQ-33-8; ADR-007 D12), no audit; never logged.
        The client loads it when the tab opens, every 60 seconds while it is open, and after every action
        (AC20); while loading it shows "Loading"; a failed refresh keeps the last answer and shows the notice
        "Could not refresh. Showing data from <time of the last asOf, as 11:05 AM>."
        SAH-35 (ADR-012): the answer also carries medicineRound (the panel "Medicine round" and the tile "Doses
        due or overdue") and counts.dosesDue and counts.dosesLate, computed in the same transaction against the
        same asOf by the SAH-32 slot rule (DoseSlots, ADR-011 D2) over every ACTIVE medicine order of every
        ADMITTED admission of the clinic: two set-based reads (the orders, and today's dose records of the
        admitted admissions), never a read per patient (ADR-012 D1). A slot is listed when it has no dose record
        and is DUE (from 60 whole minutes before to 60 whole minutes after the slot time) or LATE (more than 60
        whole minutes after); PENDING, REJECTED and STOPPED orders, discharged patients, slots before the order
        started and slots more than 60 minutes ahead are not listed; only today's slots (IST date of asOf) exist,
        so a late dose not recorded by midnight leaves the list (OQ-35-2, open). The round is readable by OWNER,
        DOCTOR and NURSE in Trial, On and Read-only state; only NURSE and OWNER in Trial or On get Give
        (MedicineRound.canGive). The rows hold patient name, bed and medicine only (no UHID, age, sex or
        allergy); reading them writes no record-access row (ADR-012 D5; OQ-35-6) and nothing is logged. A
        failure of the round is a failure of this answer: the board's "Loading", failure and stale notice cover
        the panel (ADR-012 D8; the story's separate panel error text is not used).
      responses:
        '200': { description: The Safety board, content: { application/json: { schema: { $ref: '#/components/schemas/SafetyBoard' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden (token role or membership role not OWNER, DOCTOR or NURSE) or module-off' }
      x-scope-guard:
        kind: list
        story: SAH-34
        note: 'Replaces the OQ-33-2 sentence above ("The nurse sees every admitted patient until wards exist"). Escalation rows, counts (open, pastTarget, dosesDue, dosesLate, changeToken), the red notice and medicineRound are computed on the caller''s scope in the same transaction; tab = tile = rows not closed, per caller (AC 15). OWNER and DOCTOR are scope all and are never narrowed (AC 18). view NURSE gets SafetyBoard.scope (N of M, hasWard) and yourPatients = scope.visible; the tile small text is "In your wards" when scope.kind is WARDS and "All admitted patients" when ALL. OWNER gets SafetyBoard.emergencyAccess (unreviewed grants, first 25) and counts.emergencyAccessWaiting from the same transaction. SafetyBoard.otherWardsPastTarget (x-needs-human, OQ-34-26) is an optional number for a scoped NURSE only. No row, name or detail of an out-of-scope patient is in the answer. Still writes nothing.'
  /safety/summary:
    get:
      tags: [SAH-33, SAH-35]
      description: >-
        Counts only, for the number on the Safety tab (ADR-005 D3, ADR-007 D8): no names, scores or clinical text.
        OWNER, DOCTOR, NURSE; others 403 forbidden; module Off 403 module-off; same membership re-read and the
        same transaction kind as GET /safety; allowed in Read-only state. Counted by the same rule as
        SafetyBoard.counts (escalations of admitted patients; open = status OPEN or ACK; pastTarget on the
        database clock), so the tab, the tile and the not-closed rows are always the same figure. The page calls
        it every 60 seconds while Beds and admissions is open and the Safety tab is shown, and takes counts from
        every SafetyBoard and AdmissionList.safety answer it sees; when open, pastTarget or changeToken differ
        from what the current tab shows, the client reloads that tab (GET /safety, or GET /admissions for the
        banner), so names never travel in a poll. changeToken (SAH-33 review fix, code review SAH-33 item 2,
        ADR-007 R1) catches the changes the two counts miss: one overdue escalation closed while another became
        overdue (counts equal), or the score of an overdue one rose. Writes nothing.
        SAH-35 (ADR-012 D3): the counts also carry dosesDue and dosesLate (numbers only: no patient name, bed or
        medicine), computed by the same function as SafetyBoard.counts and medicineRound, and changeToken now
        also covers every listed dose slot, so a dose recorded by anyone, a slot entering the 60-minute window
        or turning late changes it. The client compares open, pastTarget, dosesDue, dosesLate and changeToken.
        The Safety tab number is open + dosesLate (+ PharmacistChecksSummary.waiting and, from SAH-34,
        emergencyAccessWaiting for OWNER; AC 71, OQ-34-30); DUE doses are not added (mockup sfCount; OQ-35-3).
      responses:
        '200': { description: Counts, content: { application/json: { schema: { $ref: '#/components/schemas/SafetyCounts' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
      x-scope-guard: { kind: list, story: SAH-34, note: 'Counts on the caller''s scope, by the same function as GET /safety, so the summary and the board agree per caller. For OWNER also emergencyAccessWaiting, and the changeToken covers the unreviewed grants; the OWNER tab number adds emergencyAccessWaiting (OQ-34-30). No other-ward count here.' }
  /escalations/{id}/acknowledge:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 'The escalation id (EscalationRow.id).' }
    post:
      tags: [SAH-33]
      description: >-
        Acknowledge (mockup sfack), the primary button of an Open row. OWNER, DOCTOR (DEC-015 OQ-33-1); NURSE,
        FRONT_DESK and every other role 403 forbidden (no button is shown to them). Check order (ADR-007 D3, D7):
        role 403 forbidden; module Off 403 module-off; body 400 (version missing, null, not a whole JSON number or
        below 0: field version "Reload the page and try again."). No Read-only check: allowed in Read-only state
        (DEC-015 OQ-33-9). Then one READ COMMITTED transaction (declared explicitly): the role is read again from
        the active membership (no active membership or a role other than OWNER or DOCTOR 403 forbidden, nothing
        written); the escalation is read by id (missing or another clinic's 404 not-found); the bare admission row
        is locked (select id, status from ipd.admission ... for no key update, the SAH-30 lock), then the
        escalation is read again and the admission, bed and ward joined in new statements; admission not ADMITTED
        404 not-found ("This patient is not admitted any more."); the admission's patient not found through
        patient.api 404 not-found. Then: status OPEN and version equal to the sent version: status ACK,
        acknowledged by the caller, acknowledged time stamped by the database (trigger, clock_timestamp()),
        version + 1; clinical event (kind esc) "Acknowledged escalation after N min" (N = whole minutes, rounded
        down, from the start of the response clock, raisedAt or reopenedAt, to the acknowledged time); audit
        IPD_ESCALATION_ACKNOWLEDGED (escalationId, admissionId, ewsScore, ewsRisk, minutesToAcknowledge; never a
        name). Answers 200 with replayed false. Status OPEN with another version: 409 escalation-changed, nothing
        written (detail "The score is now EWS <ewsScore> (<ewsRisk in lower case>). Review it and try again.").
        Status ACK, acknowledged by the caller and the stored version equal to the sent version + 1 (a repeat after
        a lost answer or a double tap): 200 with replayed true and nothing written. Status ACK otherwise: 409
        escalation-state, detail "<acknowledging doctor's name> already acknowledged this escalation.". Status
        DONE: 409 escalation-state, detail "This escalation is already closed.". A 403, 404 or 409 writes
        nothing; a failure rolls back the update, the event and the audit together. Two doctors at the same time:
        one 200, one 409 escalation-state (AC15). Toast (client, on 200): "Acknowledged. Record what you did for
        <patientName> after you see the patient." On 409 the client shows the detail as a notice and reloads the
        board; the button is disabled while the request runs and the row is not shown as changed before the
        answer (AC20).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EscalationVersionInput' } } }
      responses:
        '200': { description: 'Acknowledged (or a replay): the row in its new state', content: { application/json: { schema: { $ref: '#/components/schemas/EscalationActionResult' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation (the operation''s own field errors); or bad-request when the {id} path value is not a UUID (components/responses/BadRequest)' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden (token role or membership role not OWNER or DOCTOR) or module-off; outside-scope (SAH-34; components/responses/OutsideScope; never in phase 1, where OWNER and DOCTOR are scope all)' }
        '404': { $ref: '#/components/responses/Problem', description: 'not-found (escalation missing or another clinic''s, patient not admitted, or patient record missing)' }
        '409': { $ref: '#/components/responses/Problem', description: 'escalation-state (already acknowledged or closed) or escalation-changed (stale version)' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
      x-scope-guard: { kind: escalation-locked, story: SAH-34, note: 'The admission of the escalation is found first (another clinic''s id 404), then checked after the admission row lock.' }
  /escalations/{id}/respond:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [SAH-33]
      description: >-
        Close escalation (mockup sfrespok), the footer button of the sheet "Response · <patientName>" opened by
        Record response (secondary on an Open row, primary on an Acknowledged one). OWNER, DOCTOR; every other role
        403 forbidden. Check order: role 403 forbidden; module Off 403 module-off; body 400 problem type validation
        with fieldErrors, every field error together in the order version, action, note, detail = the first
        message: version as on acknowledge ("Reload the page and try again."); action missing, null or not one of
        the five codes of EscalationResponseAction (CLOSED_AT_DISCHARGE is refused too) field action "Choose what
        was done"; note by the steps of EscalationResponseInput.note ("Write the plan and when vitals are next
        due." when empty after stripping). The body is checked before any lock. Allowed in Read-only state. Then
        the transaction, membership re-read (OWNER or DOCTOR), lock and 404 checks exactly as acknowledge. Then:
        status OPEN or ACK and version equal to the sent version: status DONE, response action and plan (the note
        as stored after the rules) stored, closed by the caller, closed time stamped by the database; when the
        escalation was still OPEN the caller is also stored as the acknowledging doctor at the same time, with no
        "Acknowledged" event (mockup); version + 1; clinical event (kind esc) "Escalation closed: <action label>"
        (the label only, never the plan: DEC-015 OQ-33-7, a deviation from the mockup, which writes the plan into
        the log); audit IPD_ESCALATION_CLOSED (escalationId, admissionId, ewsScore, ewsRisk, action code,
        statusBefore; never the plan or a name). Answers 200, replayed false. Status OPEN or ACK with another
        version: 409 escalation-changed, nothing written; detail "<doctor name> already acknowledged this
        escalation." when the current status is ACK and the acknowledging doctor is not the caller, otherwise "The
        score is now EWS <ewsScore> (<ewsRisk in lower case>). Review it and try again." (a response is never
        recorded against a score the doctor did not see, AC13). Status DONE, closed by the caller, stored version
        equal to the sent version + 1, same action and same stored plan: 200 replayed true, nothing written.
        Status DONE otherwise: 409 escalation-state "This escalation is already closed.". A closed escalation is
        never edited, re-opened by hand or deleted (no endpoint); a later problem creates a new escalation
        through the vitals save. Client: Close escalation is disabled while the request runs; on 200 the sheet
        closes, the toast is "Escalation for <patientName> closed and recorded" and the board reloads; on a 400
        the sheet stays open with the typed text and the field message (the empty plan message is also checked by
        the client before sending, as the mockup); on 403, 404, 409, 5xx or a network failure the sheet stays
        open with the selected action and the typed plan and the error is shown (on 409 the board reloads
        behind the sheet).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EscalationResponseInput' } } }
      responses:
        '200': { description: 'Closed (or a replay): the row in its new state', content: { application/json: { schema: { $ref: '#/components/schemas/EscalationActionResult' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation (fieldErrors on version, action, note); or bad-request when the {id} path value is not a UUID (components/responses/BadRequest)' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden (token role or membership role not OWNER or DOCTOR) or module-off; outside-scope (SAH-34; components/responses/OutsideScope; never in phase 1, where OWNER and DOCTOR are scope all)' }
        '404': { $ref: '#/components/responses/Problem', description: 'not-found (escalation missing or another clinic''s, patient not admitted, or patient record missing)' }
        '409': { $ref: '#/components/responses/Problem', description: 'escalation-state (already closed) or escalation-changed (stale version)' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
      x-scope-guard: { kind: escalation-locked, story: SAH-34 }
  /escalations/{id}/call-senior:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [SAH-33]
      description: >-
        Call senior (mockup sfup), shown on an Open row to NURSE only (primary when the row is pastTarget,
        secondary otherwise; siren icon). NURSE (DEC-015 OQ-33-1); OWNER, DOCTOR and every other role 403
        forbidden. Phase 1 calls nobody (notifications are not in phase 1): the call is only recorded (DEC-015
        OQ-33-3). Check order: role 403 forbidden; module Off 403 module-off; body 400 (version or seniorCalls
        missing, null, not a whole JSON number or below 0: that field, "Reload the page and try again."); allowed
        in Read-only state; then the transaction, membership re-read (NURSE), lock and 404 checks exactly as
        acknowledge. Then: status ACK 409 escalation-state "<acknowledging doctor's name> already acknowledged
        this escalation."; status DONE 409 escalation-state "This escalation is already closed."; status OPEN with
        another version 409 escalation-changed ("The score is now EWS <ewsScore> (<ewsRisk in lower case>). Review
        it and try again."). Status OPEN and same version, then by the stored senior calls against the sent
        seniorCalls (SAH-33 review fix, security review SAH-33 L2 and L3, code review item 11; ADR-007 R4 replaces
        the D7 call-senior rows), every step on the database clock and under the admission lock: (a) stored
        LOWER than sent (not possible from a screen of this server): 409 escalation-changed, same detail, nothing
        written. (b) stored HIGHER than sent and the caller has an accepted call on this escalation whose number
        is above the sent count (her own call, answer lost): 200 replayed true, nothing written. (c) stored
        HIGHER than sent, the calls above the sent count are other users' (another nurse called within the same
        refresh): unless the throttle (e) applies, one ipd.ews_senior_call row of outcome ALREADY_CALLED and the
        clinical event (kind esc) "Senior doctor already called · seen by another team member · no new call
        recorded" (fixed text, no name or role; the actor line shows who saw it) are written; no audit row, the
        count and the version are unchanged; 200 replayed true. (d) stored EQUAL to sent: unless the throttle (e)
        applies, when the stored count is 32,767 (the smallint cap) 409 escalation-state "This escalation cannot
        record more senior calls. Phone the senior doctor now." and nothing written; otherwise the call: senior
        calls + 1 (version unchanged: a call is not a change that makes a doctor's screen stale), one
        ipd.ews_senior_call row of outcome CALLED with the new count, clinical event (kind esc) "Called the senior
        doctor: escalation not seen after N min" (N = waitingMinutes at the call, on the database clock), audit
        IPD_ESCALATION_SENIOR_CALLED (escalationId, admissionId, ewsScore, ewsRisk, seniorCalls after the call);
        200 replayed false. (e) Throttle, for (c) and (d): when the caller already has an ipd.ews_senior_call row
        (CALLED or ALREADY_CALLED) on this escalation from the last 60 seconds, 200 replayed true and nothing
        written (one accepted entry per escalation per user per 60 seconds). There is no 429 on this endpoint:
        a throttled tap is answered like a replay, because the call it repeats is already recorded and the toast
        stays true. The row
        then shows " · escalated to senior N×". Toast (client, on 200, also on a replay, which stays true):
        "Call recorded for <patientName>. No alert is sent: phone the senior doctor now." (DEC-015 OQ-33-3; a
        deviation from the mockup's "Senior doctor and rapid response called for <name>. This call is logged.",
        because no one is called in phase 1). Each tap on fresh data is one call (mockup); the button is disabled
        while the request runs.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SeniorCallInput' } } }
      responses:
        '200': { description: 'Call recorded (or a replay): the row in its new state', content: { application/json: { schema: { $ref: '#/components/schemas/EscalationActionResult' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation (the operation''s own field errors); or bad-request when the {id} path value is not a UUID (components/responses/BadRequest)' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden (token role or membership role not NURSE) or module-off; outside-scope (SAH-34; components/responses/OutsideScope: the escalation''s patient is not in the nurse''s wards and she has no active emergency access to the patient; nothing written, no senior-call row; AC 17, OQ-34-23)' }
        '404': { $ref: '#/components/responses/Problem', description: 'not-found (escalation missing or another clinic''s, patient not admitted, or patient record missing)' }
        '409': { $ref: '#/components/responses/Problem', description: 'escalation-state (acknowledged, closed, or the senior-call count is at its cap of 32,767) or escalation-changed (stale version, or a sent seniorCalls above the stored count)' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
      x-scope-guard: { kind: escalation-locked, story: SAH-34 }
  /clinical-events:
    get:
      tags: [SAH-33]
      description: >-
        The panel "Clinical audit trail" (mockup sfLog list, kic icons): the clinical event log, newest first (at
        descending, then seq descending; ADR-006 D1), keyset paginated (ADR-007 D13). OWNER, DOCTOR, NURSE; others
        403 forbidden; module Off 403 module-off; membership re-read as GET /safety; allowed in Read-only state.
        Scope: OWNER and DOCTOR every entry of the clinic (panel subtitle "Every order, check, dose, escalation and
        record opened. Entries cannot be edited or deleted."); NURSE her own entries and the entries of ADMITTED
        admissions (every admitted patient until wards exist, OQ-33-2; subtitle "Your actions and your patients.
        Entries cannot be edited or deleted."). The first page is limit 14 (mockup: the latest 14); "Show earlier
        entries" (DEC-015 OQ-33-8; not in the mockup) loads limit 50 with cursor = nextCursor of the last page and
        is shown while nextCursor is not null. Errors: limit not a whole number 1 to 50, or a cursor that does
        not decode is refused, 400 (field limit or cursor, "Reload the page and try again."). The cursor is not
        signed (security review SAH-33 I1): a cursor that decodes only moves the start of a page of the caller's
        own clinic and own scope, so it cannot reveal anything the caller could not page to. Entry text holds fixed
        wording and numbers only (ADR-006 D7, ADR-007 D10); patient name and bed are read when the list is built
        (patient.api PatientLookupPort.findAll; the admission's current bed, or the last bed for a discharged
        patient), never stored in the entry; the actor name is read at display time ("Team member" when not
        found). There is no endpoint to edit or delete an entry. Writes nothing: no record-access row (DEC-015),
        no audit; never logged. Empty first page: "Nothing recorded yet."
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 14 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' }, description: 'Opaque; the nextCursor of the previous page. Absent for the newest entries.' }
      responses:
        '200': { description: One page of entries, content: { application/json: { schema: { $ref: '#/components/schemas/ClinicalEventPage' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
      x-scope-guard: { kind: list, story: SAH-34, note: 'Replaces "every admitted patient until wards exist, OQ-33-2": NURSE sees her own entries and the entries of admissions in her scope (her wards, or an active emergency access grant of hers); with the switch off, every ADMITTED admission as before (SAH-33 AC16). OWNER and DOCTOR: every entry (unchanged). bg entries (kind bg) appear from SAH-34: "Emergency access opened · <reason label>" (actor = the grantee) and "Reviewed emergency access" (actor = the owner); for the review entry ClinicalEvent.grantStaffName holds the grantee''s name read at display time and the client shows "Reviewed emergency access by <grantStaffName>".' }
  /admissions/{id}/emr:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [SAH-31]
      description: >-
        The EMR sheet (mockup pcEmr with sfIdBar and sfOrdBlock), opened from the footer button "EMR" of the
        admission sheet (AdmissionDetail.canOpenEmr; OQ-31-7). OWNER, DOCTOR, NURSE (token role); FRONT_DESK,
        BILLING, PHARMACIST, VISITING_DOCTOR and every other role 403 forbidden with the detail "Clinical details
        are hidden for your role." (story AC1; the client shows it as the warn notice with a lock icon if the
        sheet is ever opened by such a role). Check order: role 403 forbidden; module Off 403 module-off; then one
        READ COMMITTED read-write transaction (it writes the view entry): the role is read again from the active
        membership (platform.api TeamMemberPort.findActiveByUserId; no active membership or a role outside OWNER,
        DOCTOR, NURSE 403 forbidden with the same detail); admission not found or another clinic's 404
        not-found (row-level security); the admission's patient not found through patient.api
        PatientClinicalPort 404 not-found (never a placeholder). Allowed in Read-only state and for a DISCHARGED
        admission (canOrder and every canStop are then false; the button is shown only while ADMITTED). Takes no
        lock. After the 404 checks pass it writes the clinical event (kind view) "Opened the clinical record"
        (ADR-009 D7) and one patient.record_access row through patient.api PatientAccessPort (story AC1); a 403
        or 404 writes nothing. No audit row. asOf is the database clock (clock_timestamp()). The order and stop
        answers return the same EmrSheet without a new view entry (mockup keep flag). Never logged.
      responses:
        '200': { description: The EMR sheet, content: { application/json: { schema: { $ref: '#/components/schemas/EmrSheet' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden ("Clinical details are hidden for your role.") or module-off; outside-scope (SAH-34; components/responses/OutsideScope; after the 404 checks, before the view entry and the record-access row, which are then not written)' }
        '404': { $ref: '#/components/responses/Problem', description: 'not-found (admission missing or another clinic''s, or its patient missing)' }
      x-scope-guard: { kind: admission, story: SAH-34 }
  /admissions/{id}/medicine-orders:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [SAH-31]
      description: >-
        Check and order, and Order with this reason (mockup sfordchk). OWNER, DOCTOR (ADR-009 D1; OQ-31-8:
        VISITING_DOCTOR has no IPD access); NURSE, FRONT_DESK, PHARMACIST and every other role 403 forbidden,
        detail "Only a doctor can do this." (story AC13). The server runs the safety check (MedicineSafetyCheck,
        ADR-009 D2) on every request; the client is never trusted. Check order: role 403 forbidden; module Off 403
        module-off; Read-only 409 ipd-readonly ("IPD is read-only. Nothing can be changed."); body 400 problem
        type validation with fieldErrors, every field error together in the order clientKey, drugKey,
        frequencyKey, overrideReasonKey, checkToken, detail = the first message (texts on MedicineOrderInput).
        The body is checked before any lock. Then one READ COMMITTED transaction (declared explicitly): the role
        is read again from the active membership (OWNER or DOCTOR, else 403 forbidden "Only a doctor can do
        this.", nothing written); the bare admission row is locked (select id, status from ipd.admission ... for
        no key update; ADR-009 D10: the only lock), then the admission, bed and ward are read in a new statement;
        admission not found or another clinic's 404 not-found; patient not found through patient.api 404
        not-found. Replay: an order with this clientKey already exists for this admission: same drugKey and
        frequencyKey, and the same overrideReasonKey when the first order stored one (a reason sent with no
        warning is ignored and stored null, so it is not compared on a repeat; ADR-009 "Build notes" B2) 200 with
        outcome PLACED, replayed true, order = that order and the sheet as it is now; nothing is written except
        one patient.record_access row (ADR-009 D7); any compared value different 409 client-key-reused ("This order was already placed with different values. Reload the page
        and try again."), nothing written. The clientKey was used for another admission 400 (field clientKey,
        "Reload the page and try again."). Not ADMITTED 409 not-admitted ("This patient is not admitted any more.
        Medicines cannot be ordered or changed."). Then the check against the admission's live orders (Pharmacist
        check and Active) and the patient's allergy text (read through patient.api PatientClinicalPort, never
        from a patient table; when the admission's patient was merged into another record the port reads the
        kept record, following merged_into_id, ADR-009 B9): (1) any hard stop: 200 outcome BLOCKED with check; the order is not placed; the
        clinical event (kind deny) "Order blocked: <drug name> · <first hard stop as logged>" (ADR-009 D7: the
        duplicate message as shown; for an allergy "Documented penicillin allergy. <drug name> is a penicillin."
        or "Documented sulfa allergy. <drug name> is a sulfa drug.", never the patient's allergy text) and the
        audit IPD_MED_ORDER_BLOCKED (admissionId, drugKey, frequencyKey, status BLOCKED) are written and
        committed; no access row. (2) warnings, and overrideReasonKey missing or null, or checkToken missing or
        not equal to check.checkToken now (the warnings changed since the doctor saw them; ADR-009 D4): 200
        outcome NEEDS_REASON with check; nothing is written except one patient.record_access row. (3) warnings,
        a reason from the list and the current checkToken, or (4) no finding (a reason sent anyway is ignored and
        not stored): the order is placed with status PENDING (Pharmacist check), ordered by the caller at the
        database transaction time, the override reason (case 3) and the warning lines as shown ("Major: <text>"),
        the clinical event (kind order) "Ordered <drug name> <frequency label in lower case>" plus " · override:
        <reason label>" in case 3, and the audit IPD_MED_ORDERED (orderId, admissionId, drugKey, frequencyKey,
        status PENDING, overrideReasonKey, warningCount); 201 outcome PLACED, replayed false. A database refusal
        (the partial unique index on live orders of the same drug, the guard trigger) is a code fault: 500, the
        whole transaction rolled back. BLOCKED and NEEDS_REASON are 200 answers with an outcome, not problem
        details, so the patient's allergy text never travels in a problem detail (ADR-009 D4, Q7; the story
        named them 409 order-blocked and order-needs-reason). Client (story AC4, AC5, AC6, AC15): the button
        "Check and order" (shieldu icon) is disabled while the request runs. BLOCKED: the crit notice "Hard stop.
        This order cannot be placed." in bold followed by every check.hardStops text on its own line; the button
        stays "Check and order". NEEDS_REASON: when the form already showed warnings for the same medicine and
        frequency and no reason was chosen, the error toast "Choose a reason to continue, or change the
        medicine." (mockup); otherwise the warn notice "Check before ordering" in bold followed by one line per
        warning "<Moderate|Major>: <text>" (the severity in bold), then the select "Reason to continue (recorded
        in the audit trail)" with "Choose a reason" first and the four reasons of EmrSheet.overrideReasons, and
        the button reads "Order with this reason"; the client keeps check.checkToken and sends it with the
        reason. PLACED: the toast "<drug name> ordered. It goes to the pharmacist before the first dose.", the
        form clears (notice, reason, Clear) and the list shows the new order. "Clear" (shown once a check ran)
        clears the notice and the reason without a request. A 4xx, 5xx or network failure shows the problem
        detail (or the generic failure text) as an error toast and never shows the order as placed. clientKey
        lifecycle: made when the sheet opens, kept while the same drugKey, frequencyKey and overrideReasonKey are
        retried (also from NEEDS_REASON to the request with the reason, because NEEDS_REASON and BLOCKED store
        nothing under the key), replaced after an outcome PLACED and when the medicine, frequency or reason
        changes, and after a 409 client-key-reused.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MedicineOrderInput' }
            examples:
              first:
                summary: Check and order
                value: { clientKey: 3f8e2a8c-5b0e-4f7e-9d43-0c6a0b6f2a11, drugKey: asp, frequencyKey: od }
              withReason:
                summary: Order with this reason, after NEEDS_REASON
                value: { clientKey: 3f8e2a8c-5b0e-4f7e-9d43-0c6a0b6f2a11, drugKey: asp, frequencyKey: od, overrideReasonKey: CARDIOLOGY_STENT, checkToken: Qm9yZGVyLWNoZWNrLXRva2 }
      responses:
        '200':
          description: 'Not placed (outcome BLOCKED or NEEDS_REASON), or a replay of a placed order (outcome PLACED, replayed true)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MedicineOrderAnswer' }
              examples:
                blocked:
                  summary: Hard stop (the sheet is abridged in this example)
                  value:
                    outcome: BLOCKED
                    replayed: false
                    order: null
                    check:
                      allergyStatus: RECORDED
                      hardStops:
                        - { code: ALLERGY_PENICILLIN, severity: HARD_STOP, otherDrugKey: null, text: 'Documented allergy: Penicillin (rash). Tab. Amoxicillin + clavulanate 625 mg is a penicillin.' }
                      warnings: []
                      checkToken: hT3bq0kQm1vZ2l0YWxpYQA
                    sheet: { admissionId: 6c1b8e8e-0d0a-4b8e-9a52-7f0f3c1d2e33 }
                needsReason:
                  summary: Warnings, choose a reason (sheet abridged)
                  value:
                    outcome: NEEDS_REASON
                    replayed: false
                    order: null
                    check:
                      allergyStatus: NONE_KNOWN
                      hardStops: []
                      warnings:
                        - { code: INTERACTION, severity: MAJOR, otherDrugKey: hep, text: 'Bleeding risk: heparin with aspirin (Inj. Heparin 5,000 IU is on the chart).' }
                      checkToken: Qm9yZGVyLWNoZWNrLXRva2
                    sheet: { admissionId: 6c1b8e8e-0d0a-4b8e-9a52-7f0f3c1d2e33 }
        '201': { description: 'Placed (outcome PLACED): status Pharmacist check', content: { application/json: { schema: { $ref: '#/components/schemas/MedicineOrderAnswer' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation (fieldErrors on clientKey, drugKey, frequencyKey, overrideReasonKey, checkToken; or clientKey used for another admission); or bad-request when the {id} path value is not a UUID (components/responses/BadRequest)' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden ("Only a doctor can do this.") or module-off; outside-scope (SAH-34; components/responses/OutsideScope; never in phase 1, where OWNER and DOCTOR are scope all)' }
        '404': { $ref: '#/components/responses/Problem', description: 'not-found (admission missing or another clinic''s, or its patient missing)' }
        '409': { $ref: '#/components/responses/Problem', description: 'ipd-readonly; not-admitted; client-key-reused' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
      x-scope-guard: { kind: admission-locked, story: SAH-34 }
  /medicine-orders/{id}/stop:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 'The order id (MedicineOrderRow.id).' }
    post:
      tags: [SAH-31]
      description: >-
        Stop (mockup sfstop), the button on a Pharmacist check or Active order in the EMR list (MedicineOrderRow.canStop).
        OWNER, DOCTOR (any doctor, not only the one who ordered; mockup); every other role 403 forbidden "Only a
        doctor can do this.". No body. Check order: role 403; module Off 403 module-off; no Read-only check:
        allowed in Read-only state (it removes a medicine; ADR-009 D1, Q6). Then one READ COMMITTED transaction:
        membership re-read (OWNER or DOCTOR, else 403 "Only a doctor can do this."); the order is read by id
        (missing or another clinic's 404 not-found); the bare admission row of the order is locked (for no key
        update), then the order is read again and the admission, bed and ward joined; admission not ADMITTED 409
        not-admitted ("This patient is not admitted any more. Medicines cannot be ordered or changed."); patient
        not found through patient.api 404. Then: status PENDING or ACTIVE: status STOPPED, stopped by the
        caller, stopped time stamped by the database, version + 1; clinical event (kind stop) "Stopped <drug
        name>"; audit IPD_MED_STOPPED (orderId, admissionId, drugKey, frequencyKey, statusBefore, status
        STOPPED); 200 with the sheet, no access row. Status STOPPED and stopped by the caller (a repeat after a
        lost answer or a double tap): 200 with the sheet, nothing written except one patient.record_access row.
        Status STOPPED by another user 409 order-state "This order is already stopped."; status REJECTED 409
        order-state "This order was rejected by the pharmacist. It cannot be stopped." (story AC7). Orders are
        never deleted. Toast (client, on 200): "<drug name> stopped. Remaining doses are removed from the MAR."
        (mockup and story; the MAR is SAH-32, ADR-009 Q9). The button is disabled while the request runs; on 409
        the client shows the detail and reloads the sheet (GET /admissions/{id}/emr).
      responses:
        '200': { description: 'Stopped (or a repeat by the same user): the EMR sheet now', content: { application/json: { schema: { $ref: '#/components/schemas/EmrSheet' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden ("Only a doctor can do this.") or module-off; outside-scope (SAH-34; components/responses/OutsideScope; never in phase 1, where OWNER and DOCTOR are scope all)' }
        '404': { $ref: '#/components/responses/Problem', description: 'not-found (order missing or another clinic''s, or the patient record missing)' }
        '409': { $ref: '#/components/responses/Problem', description: 'not-admitted; order-state (already stopped by someone else, or rejected)' }
      x-scope-guard: { kind: order-locked, story: SAH-34, note: 'The admission of the order is found first (another clinic''s id 404), then checked after the admission row lock.' }
  /pharmacist-checks:
    get:
      tags: [SAH-31]
      description: >-
        The panel "Pharmacist check" of the Safety tab (mockup ipSafety, pendRow): every order waiting for the
        pharmacist (status PENDING) of every ADMITTED admission of the clinic, with the safety check run again
        now (MedicineSafetyCheck, ADR-009 D2), oldest first. OWNER, PHARMACIST (DEC-017 Q2; ADR-009 D11);
        DOCTOR, NURSE, FRONT_DESK, BILLING, VISITING_DOCTOR and every other role 403 forbidden. Check order: role
        403 forbidden; module Off 403 module-off; limit or cursor invalid 400 (field limit or cursor, "Reload the
        page and try again."); then one REPEATABLE READ transaction (ADR-005 D6: the count, the rows and their
        checks agree; not read-only, because it writes the record-access rows below): membership re-read (OWNER or PHARMACIST, else 403 forbidden). Allowed in Read-only
        state (canVerify is then false, canReject stays true). Keyset paging (ADR-009 D8): orderedAt ascending,
        then id ascending; limit 1 to 100, default 50; nextCursor set when more rows exist; "Show more orders"
        (contract wording, not in the mockup) loads limit 50 with cursor = nextCursor and is shown while
        nextCursor is not null. The cursor is opaque, not signed, and only moves the start of a page inside the
        caller's clinic (a cursor that does not decode 400). waiting is always the full count. Patient name,
        UHID, age, sex and allergy text are read through patient.api PatientClinicalPort.findAll, staff names
        through platform.api ActorDirectoryPort ("Team member" when not found), the drug data from the catalogue.
        A waiting order whose patient record cannot be found (a data fault) stays in the list: patient.name
        "Patient", uhid "", age, sex and allergyText null, allergyStatus NOT_RECORDED (so its check carries the
        "Allergies are not recorded" warning); a list never drops a waiting order (ADR-009 "Build notes" B4).
        Record access (ADR-009 Q10, re-opened and decided after security review S3, DEC-017 "Review
        decisions"): every 200 writes one record-access row (patient.api PatientAccessPort) per distinct patient
        among the items of this page, for the caller, in the same transaction; an empty page writes none; a
        second page writes rows for its own patients. This replaces the earlier "no record-access row" rule:
        the page shows names, UHID, age, sex and allergy text. No audit row; never logged. The counts-only
        summary (GET /pharmacist-checks/summary) writes nothing. The client loads it when the Safety tab opens,
        after every verify or reject (the answers carry it), and when the summary changes (GET
        /pharmacist-checks/summary).
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' }, description: 'Opaque; the nextCursor of the previous page. Absent for the first page.' }
      responses:
        '200': { description: One page of waiting orders, content: { application/json: { schema: { $ref: '#/components/schemas/PharmacistChecks' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden (token role or membership role not OWNER or PHARMACIST) or module-off' }
  /pharmacist-checks/summary:
    get:
      tags: [SAH-31]
      description: >-
        Counts only, for the number on the Safety tab and the tile "Pharmacist checks" (ADR-005 D3, ADR-009 D8):
        no names, drugs or clinical text. OWNER, PHARMACIST; others 403 forbidden; module Off 403 module-off;
        same membership re-read as GET /pharmacist-checks, in a read-only REPEATABLE READ transaction; allowed in
        Read-only state.
        Counted by the same rule as PharmacistChecks.waiting. The page calls it when Beds and admissions opens
        for OWNER or PHARMACIST and every 60 seconds while the Safety tab is shown to them; when waiting or
        changeToken differ from the last values, the client reloads GET /pharmacist-checks when that panel is on
        screen. Tab number: for OWNER safety.counts.open (SAH-33) plus safety.counts.dosesLate (SAH-35, ADR-012
        D3) plus waiting (mockup sfCount); for PHARMACIST waiting; hidden at 0. Writes nothing.
      responses:
        '200': { description: Counts, content: { application/json: { schema: { $ref: '#/components/schemas/PharmacistChecksSummary' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /medicine-orders/{id}/verify:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 'The order id (PharmacistCheckRow.orderId).' }
    post:
      tags: [SAH-31]
      description: >-
        Verify order (mockup sfverok), the footer button of the sheet "Pharmacist check · <drug name>" opened by
        Verify on a waiting row. PHARMACIST, OWNER (ADR-009 D1; the story also names a DOCTOR who did not order,
        not built: ADR-009 Q4); every other role 403 forbidden, detail "Only the pharmacist or the clinic owner
        can check orders." (contract wording). Check order (ADR-009 D5): role 403 forbidden; module Off 403
        module-off; Read-only 409 ipd-readonly (verifying adds a medicine); body 400 problem type validation with
        fieldErrors in the order pin, checkToken (pin missing, null or not exactly 4 ASCII digits "Enter the
        4-digit PIN." (story AC10); checkToken missing or not 22 characters of A-Z a-z 0-9 _ - "Reload the page
        and try again."). Then, before the IPD transaction: a plain read of the order (missing or another
        clinic's 404 not-found) and the self-verification rule: the order was placed by the caller 403 problem
        type self-verification "The doctor who ordered this cannot verify it. Ask the pharmacist." (story AC10;
        before the PIN, so the orderer never spends PIN tries); then the PIN check against the caller's own
        personal staff PIN through platform.api StaffPinPort, outside any transaction, in its own platform
        transaction that commits first (a wrong try is counted even though this request fails; no platform lock
        is held with the admission lock; ADR-009 D6, decided in DEC-017; ADR-010 D9). The problem types and texts
        are the platform's (ADR-010 D11, docs/api/platform.yaml): the caller already has 10 failed PIN checks
        (wrong PIN) in the last 5 minutes 429 rate-limit "Too many PIN tries in a short time. Try again in a few
        minutes." (retryAfterSeconds; successful checks are not counted, so a pharmacist can verify a burst of
        orders; ADR-010 D13 as built after review fix R1);
        SAHAJ_PIN_PEPPER not set 503 pin-unavailable "PIN checks are not available right now. Try again later."
        (fail closed: nothing is verified); the caller has no PIN 409 pin-not-set "You have not set your PIN yet.
        Set your PIN, then try again." (or, after an owner reset, "The clinic owner reset your PIN. Set a new one,
        then try again."; after the PIN was switched off by the third lock in 24 hours, reason TOO_MANY_LOCKS,
        "Your PIN was switched off after too many wrong tries. Set a new one, then try again."); locked 403
        pin-locked "Your PIN is locked after 5 wrong tries. Try again at <h:mm AM/PM>." (IST; retryAfterSeconds;
        a right PIN is refused too while locked); wrong 403 wrong-pin "That PIN is not right. <n> tries left."
        ("1 try left."). The 5th wrong try in a row answers by the lock it causes (ADR-010 D5): the first or the
        second lock within 24 hours 403 pin-locked (above); the third lock within 24 hours 409 pin-not-set with
        the text "Your PIN was switched off after too many wrong tries. Set a new one, then try again." (reason
        TOO_MANY_LOCKS), never pin-locked, because the PIN is already switched off at that moment.
        A format-only check is never accepted. Then one READ COMMITTED transaction: membership
        re-read (PHARMACIST or OWNER, else 403 forbidden); the bare admission row of the order is locked (for no
        key update), the order is read again, the admission, bed and ward joined; admission not ADMITTED 409
        not-admitted ("This patient is not admitted any more. Medicines cannot be ordered or changed."); patient
        not found through patient.api 404. State: ACTIVE and verified by the caller (a repeat after a lost answer
        or a double tap) 200 with result.replayed true, nothing written; ACTIVE verified by another user 409
        order-state "<verifier name> already verified this order."; REJECTED 409 order-state "This order was
        already rejected."; STOPPED 409 order-state "The doctor stopped this order.". PENDING: the safety check is
        run again now (the order itself excluded from its live orders): any hard stop 409 order-blocked "Hard
        stop on this order. Reject it." (story AC10); checkToken not equal to the token of this check 409
        order-checks-changed "The checks on this order changed. Review them and try again." (ADR-009 D5, Q8; not
        in the mockup: a pharmacist never verifies against findings the screen did not show). Otherwise status
        ACTIVE, verified by the caller, verified time stamped by the database, version + 1; clinical event (kind
        verify) "Verified <drug name>" plus " · accepted doctor's reason" when the order has an override reason;
        audit IPD_MED_VERIFIED (orderId, admissionId, drugKey, frequencyKey, status ACTIVE, overrideReasonKey);
        200. The PIN is never logged, audited, stored or echoed. Client: Verify order (check icon) is disabled
        while the request runs; on 200 the sheet closes, the toast is "<drug name> verified by <result.actorName>.
        It is now on the MAR." (mockup and story; the MAR is SAH-32, ADR-009 Q9) and the panel shows checks; on
        any failure the sheet stays open, the PIN field is cleared and the detail is shown (wrong-pin under the
        PIN field); on pin-not-set the client reads GET /api/v1/platform/me/pin again and the sheet switches to
        its no-PIN state with the text chosen by PinStatus.notSetReason (never by matching the detail text;
        review fix R4), and on pin-locked to its locked state (PharmacistCheckRow, Verify sheet); on 409 order-state, order-blocked or order-checks-changed the client
        also reloads the panel behind the sheet.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyOrderInput' }
            examples:
              verify:
                value: { pin: '4821', checkToken: Qm9yZGVyLWNoZWNrLXRva2 }
      responses:
        '200': { description: 'Verified (or a repeat by the same user): the result and the first page of the queue now', content: { application/json: { schema: { $ref: '#/components/schemas/PharmacistActionResult' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation (fieldErrors on pin, checkToken); or bad-request when the {id} path value is not a UUID (components/responses/BadRequest)' }
        '401': { $ref: '#/components/responses/Problem' }
        '403':
          description: 'forbidden; module-off; self-verification; wrong-pin; pin-locked (the 5th wrong try that causes the first or second lock within 24 hours, or any try while locked)'
          content:
            application/problem+json:
              schema: { type: object }
              examples:
                wrongPin: { value: { type: 'https://sahaj.in/problems/wrong-pin', title: Wrong PIN, status: 403, detail: That PIN is not right. 2 tries left. } }
                pinLocked: { value: { type: 'https://sahaj.in/problems/pin-locked', title: PIN locked, status: 403, detail: 'Your PIN is locked after 5 wrong tries. Try again at 11:20 AM.', retryAfterSeconds: 840 } }
        '404': { $ref: '#/components/responses/Problem', description: 'not-found (order missing or another clinic''s, or the patient record missing)' }
        '409':
          description: 'ipd-readonly; pin-not-set (no PIN, by notSetReason; also the 5th wrong try that causes the third lock within 24 hours); not-admitted; order-state; order-blocked; order-checks-changed'
          content:
            application/problem+json:
              schema: { type: object }
              examples:
                pinNotSet: { value: { type: 'https://sahaj.in/problems/pin-not-set', title: No PIN set, status: 409, detail: 'You have not set your PIN yet. Set your PIN, then try again.' } }
                pinSwitchedOff: { summary: 'The 5th wrong try that causes the third lock within 24 hours, and every try after it until a new PIN is set', value: { type: 'https://sahaj.in/problems/pin-not-set', title: No PIN set, status: 409, detail: 'Your PIN was switched off after too many wrong tries. Set a new one, then try again.' } }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/Problem', description: 'rate-limit (platform PIN limit; retryAfterSeconds)' }
        '503': { $ref: '#/components/responses/Problem', description: 'pin-unavailable (SAHAJ_PIN_PEPPER not set; fail closed)' }
  /medicine-orders/{id}/reject:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [SAH-31]
      description: >-
        Reject order (mockup sfrejok), the footer button (red) of the sheet "Reject · <drug name>" opened by
        Reject on a waiting row. PHARMACIST, OWNER; every other role 403 forbidden "Only the pharmacist or the
        clinic owner can check orders.". No PIN (mockup). Check order: role 403; module Off 403 module-off; body
        400 (reasonKey missing, null or not one of RejectReasonKey: field reasonKey "Choose a reason"); no
        Read-only check: allowed in Read-only state (it removes a medicine; ADR-009 D1, Q6). Then the transaction,
        membership re-read, lock and 404 and not-admitted checks exactly as verify (no self rule: the orderer may
        reject). State: PENDING (whatever the findings): status REJECTED with the reason, rejected by the caller,
        rejected time stamped by the database, version + 1; clinical event (kind verify) "Rejected <drug name> ·
        <reason label>"; audit IPD_MED_REJECTED (orderId, admissionId, drugKey, frequencyKey, status REJECTED,
        rejectReasonKey); 200. REJECTED by the caller with the same reason: 200 result.replayed true, nothing
        written. REJECTED otherwise 409 order-state "This order was already rejected."; ACTIVE 409 order-state
        "<verifier name> already verified this order."; STOPPED 409 order-state "The doctor stopped this
        order.". No message is sent to the doctor (no notifications in phase 1); the doctor sees the reason under
        the order in the EMR list (OQ-31-5). Toast (client, on 200): "Order rejected · <reason label>." (the
        mockup's " <doctor> is notified" is left out because nothing is sent; story AC11). Reject order is
        disabled while the request runs; on failure the sheet stays open with the chosen reason.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectOrderInput' }
            examples:
              reject:
                value: { reasonKey: INTERACTION_RISK }
      responses:
        '200': { description: 'Rejected (or a repeat by the same user): the result and the first page of the queue now', content: { application/json: { schema: { $ref: '#/components/schemas/PharmacistActionResult' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation (field reasonKey); or bad-request when the {id} path value is not a UUID (components/responses/BadRequest)' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden or module-off' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem', description: 'not-admitted; order-state' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /admissions/{id}/mar:
