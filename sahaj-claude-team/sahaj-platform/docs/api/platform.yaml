        '403': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /clinic/logo:
    get:
      tags: [SAH-89]
      summary: The clinic logo image (signed-in users of this clinic only)
      x-required-role: any clinic role with an ACTIVE membership
      description: >-
        SAH-89-8, OQ-89-5 A, ADR-031 D5. The stored logo, always a PNG re-encoded by the server. Bearer token required
        (no public or cookie-only URL): the client reads it with HttpClient as a blob and shows it through an object URL
        in the wizard preview, the sidebar clinic card and Clinic profile. Allowed while setup is open (owner). Headers:
        Content-Type image/png, X-Content-Type-Options nosniff, Content-Disposition inline; filename="clinic-logo.png",
        Content-Security-Policy default-src 'none'; sandbox, Cache-Control private, no-cache, ETag (the stored SHA-256 in
        quotes). If-None-Match with the current ETag answers 304 with no body. No logo: 404 not-found "No logo yet." (the
        client shows the clinic's initials; it calls this only when Me.clinic.logo.present is true). Another clinic's
        logo can never be read (RLS; the tenant comes from the token). Writes nothing; no audit for a read.
      parameters:
        - { name: If-None-Match, in: header, required: false, schema: { type: string, maxLength: 80 } }
      responses:
        '200':
          description: The logo
          headers:
            ETag: { schema: { type: string }, description: '"<sha256 hex>"' }
            Cache-Control: { schema: { type: string, const: 'private, no-cache' } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
            Content-Security-Policy: { schema: { type: string, const: "default-src 'none'; sandbox" } }
          content:
            image/png:
              schema: { type: string, contentMediaType: image/png, contentEncoding: binary }
        '304': { description: Not changed since the ETag sent }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden (no active membership)' }
        '404': { $ref: '#/components/responses/Problem', description: 'not-found ("No logo yet.")' }
    put:
      tags: [SAH-89]
      summary: Upload or replace the clinic logo
      x-required-role: OWNER
      description: >-
        SAH-89-8, ADR-031 D5. Wizard step 5 ("Choose your colour and web address", optional, can be skipped) and Clinic
        profile ("Logo and colour", Replace). OWNER only, re-read from the database (403 forbidden "Only the clinic
        owner can do this."); allowed while setup is open. Client before upload: the chosen file must be PNG, JPG or
        WEBP ("Use a PNG, JPG or WEBP file for the logo.") and at most 2 MB ("This file is <size>. Keep the logo under 2
        MB.", size as "2.4 MB" or "830 KB"); the client draws it on a canvas, scales the longest side down to 1024 px
        (never up) and uploads a PNG; if that PNG is over 2 MB it scales to 512 px. An image the browser cannot draw:
        "This image could not be read. Save it again as PNG and retry." (mockup texts; SVG is not offered in phase 1).
        Server check order, each step stops the request and stores nothing: 403; whole request over 2 MB + 64 KB 413
        payload-too-large "Keep the logo under 2 MB."; no part named file 400 validation field file "Choose a logo
        file."; file part over 2,097,152 bytes 413 payload-too-large "Keep the logo under 2 MB."; 20 uploads per clinic
        in the last hour, or no free image slot within 5 seconds (2 at once per instance), 429 rate-limit with
        retryAfterSeconds; the bytes are not a PNG (89 50 4E 47 0D 0A 1A 0A) or JPEG (FF D8 FF) signature, whatever
        the file name or declared type says (SVG, GIF, WEBP bytes, HTML included) 400 logo-type-not-allowed "Use a PNG,
        JPG or WEBP file for the logo."; width or height read from the header outside 16 to 4,096 px 400
        logo-dimensions "Use an image between 16 and 4,096 pixels on each side." (checked before decoding); the image
        cannot be decoded 400 logo-unreadable "This image could not be read. Save it again as PNG and retry.". Then the
        image is re-encoded as PNG (longest side at most 1024 px, transparency kept, every metadata chunk and any
        trailing bytes dropped) and stored in one row per clinic (insert or replace). Audit PLATFORM_CLINIC_LOGO_SET
        (stored bytes, width, height, SHA-256, source PNG or JPEG, replaced true or false). The same image again (same
        SHA-256 after re-encoding): 200, nothing written. 200 with ClinicLogoInfo. Client: preview updates, toast
        "Logo added" (or the mockup's check summary), progress shown during upload, Cancel aborts the request; on a
        failure "Could not upload the logo. Try again." and the colour choice is kept.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, contentMediaType: application/octet-stream, contentEncoding: binary, description: 'PNG or JPEG bytes, at most 2,097,152 bytes. Type decided by the bytes, not by the part''s Content-Type or file name.' }
            encoding:
              file: { contentType: 'image/png, image/jpeg' }
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClinicLogoInfo' }
              examples:
                stored: { value: { present: true, etag: '9f2c4e0b7a1d3c5e8f6a2b4d0c1e3f5a7b9d2c4e6f8a0b1c3d5e7f9a2b4c6d8e', width: 640, height: 320, bytes: 48213, updatedAt: '2026-11-22T06:05:00Z' } }
        '400':
          description: 'validation (field file), logo-type-not-allowed, logo-dimensions or logo-unreadable'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                type: { value: { type: 'https://sahaj.in/problems/logo-type-not-allowed', title: This file type is not allowed, status: 400, detail: 'Use a PNG, JPG or WEBP file for the logo.' } }
                unreadable: { value: { type: 'https://sahaj.in/problems/logo-unreadable', title: This image could not be read, status: 400, detail: This image could not be read. Save it again as PNG and retry. } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: forbidden }
        '413': { $ref: '#/components/responses/PayloadTooLarge', description: 'payload-too-large, detail "Keep the logo under 2 MB." (path exception: up to 2 MB + 64 KB)' }
        '429': { $ref: '#/components/responses/Problem', description: rate-limit }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
    delete:
      tags: [SAH-89]
      summary: Remove the clinic logo
      x-required-role: OWNER
      description: >-
        SAH-89-8. OWNER only (403 forbidden). Allowed while setup is open. Deletes the clinic's logo row; the app shows
        the clinic's initials again. No logo: 204, nothing written. Audit PLATFORM_CLINIC_LOGO_REMOVED (the removed
        SHA-256 and size). Client: confirm, then toast "Logo removed".
      responses:
        '204': { description: Removed (or there was none) }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: forbidden }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
