openapi: 3.1.0
info:
  title: Sahaj platform API
  version: 0.1.1
  description: 0.1.1 (12 Nov 2026, ADR-023 D13.5, SAH-66) adds the menu key secondchecks to GET /me (additive; nothing else changes). Phase 1 contract, SAH-1 to SAH-7, and the personal staff PIN of SAH-31 (ADR-010; /me/pin, /me/pin/code, /team/{id}/pin/reset; checked for other modules through the internal port platform.api.StaffPinPort, not over HTTP), and the colleague PIN hardening of SAH-38 (ADR-014; /me/pin/colleague-tries, /me/pin/colleague-tries/seen, /team/{id}/pin/colleague-tries, TeamMemberPin.colleagueTries7d, problem types colleague-pin-limit and pin-check-failed). The tenant always comes from the logged-in user, never from a request. Errors are RFC 9457 application/problem+json. Two general rules apply to every operation (release audit DEC-025, code review #2). (1) An {id} path value that is not a UUID answers 400 problem type bad-request (components/responses/BadRequest: title "Bad Request", detail "The request could not be understood. Check it and try again.", no fieldErrors, nothing submitted is echoed); it is listed on every operation with an {id} path parameter, merged into the description where the operation also has its own 400 validation answer. (2) A request body over the size limit answers 413 problem type payload-too-large (components/responses/PayloadTooLarge: title "Request too large"); the limit is 64 KB for a signed-in user (detail "The request body must be 64 KB or smaller."; property sahaj.request-body.max-bytes, never below 4 KB, and the detail names the configured limit) and 4 KB on /public/** and for any other request without a signed-in user, such as the /auth/** calls before sign-in (detail "The request body must be 4 KB or smaller."). It is listed on every operation with a request body and applies equally to a body sent to an operation that declares none.
servers:
  - url: /api/v1/platform
security:
  - bearer: []
tags:
  - { name: SAH-1 }
  - { name: SAH-2 }
  - { name: SAH-3 }
  - { name: SAH-4 }
  - { name: SAH-5 }
  - { name: SAH-6 }
  - { name: SAH-7 }
paths:
  /health:
    get:
      tags: [SAH-1]
      security: []
      responses:
        '200':
          description: The application is up
          content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, examples: [UP] } } } } }
  /public/sales-enquiries:
    post:
      tags: [SAH-2]
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SalesEnquiry' } } }
      responses:
        '201': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/IdResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge', description: 'payload-too-large, limit 4 KB (public endpoint)' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/otp/request:
    post:
      tags: [SAH-3]
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [mobile, mode], properties: { mobile: { $ref: '#/components/schemas/Mobile' }, mode: { $ref: '#/components/schemas/AuthMode' } } } } }
      responses:
        '202': { description: Code sent. Never contains the code., content: { application/json: { schema: { type: object, required: [resendAfterSeconds], properties: { resendAfterSeconds: { type: integer, examples: [30] } } } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge', description: 'payload-too-large, limit 4 KB (no signed-in user)' }
        '423': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/otp/verify:
    post:
      tags: [SAH-3]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mobile, code, mode]
              properties:
                mobile: { $ref: '#/components/schemas/Mobile' }
                code: { type: string, pattern: '^[0-9]{6}$' }
                mode: { $ref: '#/components/schemas/AuthMode' }
                consent:
                  type: object
                  required: [termsVersion, privacyVersion]
                  properties: { termsVersion: { type: string }, privacyVersion: { type: string } }
      responses:
        '200': { description: Verified. Sets the refresh cookie when a session starts., content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge', description: 'payload-too-large, limit 4 KB (no signed-in user)' }
        '423': { $ref: '#/components/responses/Problem' }
  /auth/select-clinic:
    post:
      tags: [SAH-3]
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [selectionToken, tenantId], properties: { selectionToken: { type: string }, tenantId: { type: string, format: uuid } } } } }
      responses:
        '200': { description: Session started, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge', description: 'payload-too-large, limit 4 KB (no signed-in user)' }
  /auth/refresh:
    post:
      tags: [SAH-3]
      security: []
      description: Uses the HttpOnly refresh cookie and rotates it.
      responses:
        '200': { description: New access token, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      tags: [SAH-3]
      responses:
        '204': { description: Logged out on this device }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/logout-all:
    post:
      tags: [SAH-3]
      responses:
        '204': { description: Logged out on all devices }
        '401': { $ref: '#/components/responses/Problem' }
  /setup:
    get:
      tags: [SAH-4]
      responses:
        '200': { description: Saved progress, content: { application/json: { schema: { $ref: '#/components/schemas/SetupState' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /setup/steps/{step}:
    put:
      tags: [SAH-4]
      parameters:
        - { name: step, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 5 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: '#/components/schemas/SetupClinic' }
                - { $ref: '#/components/schemas/SetupSpecialty' }
                - { $ref: '#/components/schemas/SetupTeam' }
                - { $ref: '#/components/schemas/SetupOpd' }
                - { $ref: '#/components/schemas/SetupLook' }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/SetupState' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /setup/slug-availability:
    get:
      tags: [SAH-4]
      parameters:
        - { name: slug, in: query, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{2,23}$' } }
      responses:
        '200': { description: Result, content: { application/json: { schema: { type: object, required: [available, alternatives], properties: { available: { type: boolean }, alternatives: { type: array, items: { type: string } } } } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /setup/complete:
    post:
      tags: [SAH-4]
      responses:
        '200': { description: Clinic created, content: { application/json: { schema: { type: object, required: [next, brand], properties: { next: { const: APP }, brand: { $ref: '#/components/schemas/Brand' } } } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /setup/overview:
    get:
      tags: [SAH-7]
      description: >-
        OWNER only. SAH-31 proposal (ADR-010 D12, Q2; built only when the human accepts it): one more check,
        key pin, label "Own PIN for each staff member", why "So medicine checks show who did them", done when
        every ACTIVE member has a PIN set or locked, section team, anchor f-staff, optional true (it does not
        change percent). The mockup line is "Own PIN login for each staff member", done when PIN sign-in is
        switched on; PIN sign-in is not built.
      responses:
        '200': { description: Progress and last change, content: { application/json: { schema: { $ref: '#/components/schemas/SetupOverview' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /me:
    get:
      tags: [SAH-5]
      responses:
        '200': { description: Current user, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /me/preferences:
    patch:
      tags: [SAH-5]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Preferences' } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /me/pin:
    get:
      tags: [SAH-31]
      summary: My PIN status
      description: >-
        The signed-in person's own staff PIN status in this clinic (ADR-010). Any clinic role with an ACTIVE
        membership. The tenant and the person come from the session only. Never returns the PIN, the hash or the
        full mobile number. Used by the Set PIN sheet, the own row of the Team list and the Verify sheet of the
        pharmacist check (to show "Set my PIN" or the lock before the person types a PIN). Writes nothing.
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PinStatus' }
              examples:
                set: { value: { available: true, state: SET, setAt: '2026-11-06T05:35:00Z', lockedUntil: null, triesLeft: 5, notSetReason: null, mobileMasked: '••••••7410' } }
                notSet: { value: { available: true, state: NOT_SET, setAt: null, lockedUntil: null, triesLeft: null, notSetReason: RESET_BY_OWNER, mobileMasked: '••••••7410' } }
                locked: { value: { available: true, state: LOCKED, setAt: '2026-11-06T05:35:00Z', lockedUntil: '2026-11-06T05:50:00Z', triesLeft: 0, notSetReason: null, mobileMasked: '••••••7410' } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden (no active membership)' }
    put:
      tags: [SAH-31]
      summary: Set, change or replace my PIN
      x-required-role: any clinic role (own PIN only)
      description: >-
        Sets a first PIN, changes it, or replaces a forgotten or locked one (ADR-010 D7). Only the person
        themselves: there is no way to set another person's PIN. Needs a one-time code sent to the person's own
        mobile by POST /me/pin/code; no current PIN is asked. Check order, each step stops the request: rate limit
        (10 set or change requests per 5 minutes per person, its own limit, not shared with PIN checks; ADR-010
        D13 as built after review fix R1) 429 rate-limit "Too many PIN tries in
        a short time. Try again in a few minutes." with retryAfterSeconds; SAHAJ_PIN_PEPPER missing 503
        pin-unavailable "PIN checks are not available right now. Try again later."; body 400 problem type
        validation with every field error together, in the order code, newPin, confirmPin: code missing or not 6
        ASCII digits "Enter the 6-digit code."; newPin missing or not 4 ASCII digits "Enter a 4-digit PIN.";
        newPin refused by the weak-PIN rules (four equal digits, a straight run up or down, ABAB or AABB, a year
        1900 to 2099, 2580 or 0852, or any 4 consecutive digits of the person's own mobile number) "This PIN is
        too easy to guess. Choose another one."; confirmPin not equal to newPin "The two PINs do not match.".
        Then the code is checked (sign-in code rules; its failed count is kept even though this request fails):
        no code sent 400 field code "Send a code first."; expired or already used 400 field code "That code has
        expired. Request a new one."; wrong 400 field code "That code is not right."; 5 wrong codes 423
        otp-locked "Too many wrong codes. Try again in 15 minutes." (never 401: the session is still valid). Then
        one transaction: the new hash is stored, wrong tries, lock and switch-off reason are cleared, set time =
        database time; audit PLATFORM_PIN_SET (no PIN before) or PLATFORM_PIN_CHANGED (ids and state only). Two
        first saves at the same moment: one wins, the other 409 concurrent-change (retryable). 200 with the new
        status. The PIN and the code are never logged, audited, stored in clear or echoed. Client: toast "Your PIN
        is set." or "Your PIN is changed."; after a network failure re-read GET /me/pin (a used code cannot be
        sent twice).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PinSetInput' }
            examples:
              set: { value: { code: '493017', newPin: '4821', confirmPin: '4821' } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/PinStatus' } } } }
        '400':
          description: validation (fieldErrors on code, newPin, confirmPin)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                weak: { value: { type: 'https://sahaj.in/problems/validation', title: Check the highlighted fields, status: 400, detail: Some fields are missing or not valid., fieldErrors: [ { field: newPin, message: This PIN is too easy to guess. Choose another one. } ] } }
                wrongCode: { value: { type: 'https://sahaj.in/problems/validation', title: Check the highlighted fields, status: 400, detail: Some fields are missing or not valid., fieldErrors: [ { field: code, message: That code is not right. } ] } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden (no active membership)' }
        '409': { $ref: '#/components/responses/Problem', description: 'concurrent-change (retryable)' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '423': { $ref: '#/components/responses/Problem', description: 'otp-locked' }
        '429': { $ref: '#/components/responses/Problem', description: 'rate-limit' }
        '503':
          description: pin-unavailable
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                unavailable: { value: { type: 'https://sahaj.in/problems/pin-unavailable', title: PIN checks are off, status: 503, detail: PIN checks are not available right now. Try again later. } }
  /me/pin/code:
    post:
      tags: [SAH-31]
      summary: Send a code to my mobile to set my PIN
      x-required-role: any clinic role (own mobile only)
      description: >-
        Sends a 6-digit one-time code to the signed-in person's own mobile number, read on the server from the
        person's record (never from the request), through the sign-in code channel (ADR-010 D7). No body. Check
        order: SAHAJ_PIN_PEPPER missing 503 pin-unavailable (no code is sent when the PIN cannot be saved); more
        than 5 requests per person per hour 429 rate-limit; the sign-in code rules: a code sent less than 30
        seconds ago 429 rate-limit "Wait before requesting another code for this number." with
        retryAfterSeconds; the number locked after 5 wrong codes 423 otp-locked. 202 with the wait before a new
        code and the masked number. Never returns or logs the code or the full number.
      responses:
        '202':
          description: Code sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PinCodeSent' }
              examples:
                sent: { value: { resendAfterSeconds: 30, mobileMasked: '••••••7410' } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden (no active membership)' }
        '423': { $ref: '#/components/responses/Problem', description: 'otp-locked' }
        '429': { $ref: '#/components/responses/Problem', description: 'rate-limit' }
        '503': { $ref: '#/components/responses/Problem', description: 'pin-unavailable' }
  /me/pin/colleague-tries:
    get:
      tags: [SAH-38]
      summary: Wrong tries of my PIN by colleagues that I have not seen yet
      x-required-role: any clinic role (own data only)
      description: >-
        SAH-38, ADR-014 D8. The notice to the PIN's owner (NEW, not in the mockup; texts T2 and T3 of the SAH-38
        register). Any clinic role with an ACTIVE membership; the tenant and the person come from the session only;
        another person's data can never be asked for. unseenCount = wrong tries of the caller's own PIN typed by
        colleagues during a second-nurse check (compared and wrong) after the caller last tapped "Got it" (POST
        /me/pin/colleague-tries/seen); before the first "Got it", every kept try. The caller's own wrong tries are
        never in it. A new PIN does not clear it; only "Got it" does (OQ-38-3, ADR-014 Q2). Never returns who tried,
        when each try was made, a PIN, a hash or a name (OQ-38-2, BR10). Writes nothing. Works in every plan and IPD
        state and whether or not PIN checks are available. Client (app shell): called once after sign-in and on
        every full page load, after the first screen shows (sign-in is never slowed); when unseenCount is above 0, a
        banner at the top of the main content area (role status) with "N wrong tries of your PIN by colleagues
        since your last use." or, for 1, "1 wrong try of your PIN by a colleague since your last use."; under it,
        when state is LOCKED, "Your PIN is locked until <h:mm AM/PM> IST." from lockedUntil, and when state is
        NOT_SET with notSetReason TOO_MANY_LOCKS, "Your PIN was switched off. Set a new one." with the button "Set
        my PIN" (the existing Set PIN sheet); one button "Got it". On a failure no banner is shown and the shell
        tries again at the next route change, at most once a minute.
      responses:
        '200':
          description: The notice data (unseenCount 0 means no banner)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ColleagueTriesNotice' }
              examples:
                three: { value: { unseenCount: 3, latestAt: '2026-11-07T05:35:12.123456Z', state: SET, lockedUntil: null, notSetReason: null } }
                locked: { value: { unseenCount: 5, latestAt: '2026-11-07T05:35:12.123456Z', state: LOCKED, lockedUntil: '2026-11-07T05:50:12Z', notSetReason: null } }
                none: { value: { unseenCount: 0, latestAt: null, state: SET, lockedUntil: null, notSetReason: null } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden (no active membership)' }
  /me/pin/colleague-tries/seen:
    post:
      tags: [SAH-38]
      summary: Dismiss the colleague-tries notice ("Got it")
      x-required-role: any clinic role (own data only)
      description: >-
        SAH-38, ADR-014 D8. The button "Got it" of the notice. Body seenThrough = latestAt of the GET answer the
        banner showed. The server records that the caller has seen every colleague wrong try up to seenThrough,
        capped at the database clock (a future value cannot hide later tries). A try made after seenThrough stays
        unseen and shows at the next load. Something is written only when at least one unseen try lies at or before
        seenThrough; otherwise nothing is written (a double tap or a repeat after a lost answer is safe). Never
        audited (the stored marker is its own record; staff data, ids and times only). Body format 400 validation,
        field seenThrough "Reload the page and try again." when missing, longer than 40 characters, not a readable
        date-time, more than one day ahead of the server clock, or earlier than 1 Jan 2020 (00:00 UTC); the same
        problem type and title in every case, nothing written (security review S38-3: an out-of-range value never
        reaches the database). 204. Client: the
        banner closes at once and is not shown again for the same tries; on a failure it closes for this page and
        comes back at the next load.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ColleagueTriesSeenInput' }
            examples:
              seen: { value: { seenThrough: '2026-11-07T05:35:12.123456Z' } }
      responses:
        '204': { description: Seen (or nothing to record) }
        '400': { $ref: '#/components/responses/Problem', description: 'validation (field seenThrough)' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden (no active membership)' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /team:
    get:
      tags: [SAH-6]
      description: >-
        Readable by any signed-in clinic user (the Fees and Case paper pages need doctor names, fees and
        registration numbers). Writes are owner-only. TeamMember.pin (SAH-31, ADR-010) is sent on every row
        when the caller is OWNER and on the caller's own row for every other role. For a non-owner caller no pin
        object is sent on other people's rows (the key is left out; a client treats a missing pin like null): the
        PIN state of colleagues, especially a lock, is not shown to them. SAH-38 (ADR-014 D9):
        TeamMember.pin.colleagueTries7d is always present inside a sent pin object. OWNER caller: a number (0 or
        more) on every row, the owner's own row included. Any other role: the only pin object they receive is
        their own row's, and there colleagueTries7d is null (their own figure reaches them only through
        GET /me/pin/colleague-tries).
      responses:
        '200': { description: Team, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TeamMember' } } } } }
    post:
      tags: [SAH-6]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TeamMemberCreate' } } }
      responses:
        '201': { description: Added, content: { application/json: { schema: { $ref: '#/components/schemas/TeamMember' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /team/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    patch:
      tags: [SAH-6]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TeamMemberUpdate' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/TeamMember' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation (the operation''s own field errors); or bad-request when the {id} path value is not a UUID (components/responses/BadRequest)' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
    delete:
      tags: [SAH-6]
      description: Removes access. The record stays so past entries keep their name.
      responses:
        '204': { description: Access removed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /team/{id}/deactivate:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [SAH-6]
      responses:
        '200': { description: Switched off, content: { application/json: { schema: { $ref: '#/components/schemas/TeamMember' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /team/{id}/reactivate:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [SAH-6]
      responses:
        '200': { description: Switched on, content: { application/json: { schema: { $ref: '#/components/schemas/TeamMember' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /team/{id}/pin/reset:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [SAH-31]
      summary: Reset a team member's PIN
      x-required-role: OWNER
      description: >-
        Clears the PIN of a team member (membership id) so they must set a new one with a code sent to their own
        mobile (ADR-010 D8). The owner never sees, chooses or receives a PIN. OWNER only (token role and the
        membership re-read); every other role 403 forbidden "Only the clinic owner can do this.". No body.
        Allowed for every member of the clinic, including the owner's own row and switched-off members, and
        whether or not PINs can be checked (SAHAJ_PIN_PEPPER missing does not block a reset). A member of
        another clinic or an unknown id 404 not-found. More than 30 resets per owner per hour 429 rate-limit.
        PIN set or locked: the PIN is cleared with the reason RESET_BY_OWNER, wrong tries and lock cleared,
        reset time (database) and the owner's user id stored; audit PLATFORM_PIN_RESET (membership id, state
        before, state after; never a name or the hash). No PIN: nothing written (a repeat after a lost answer is
        safe). 200 with the member as GET /team returns it to the owner (pin.state NOT_SET). pin.colleagueTries7d
        is NOT cleared by the reset (ADR-014 D9: the 7-day figure is evidence, so the owner can still see why
        they reset); the answer carries the current 7-day count, unchanged by the reset. Client: confirm sheet first;
        toast "PIN reset for <name>.". Removing access (DELETE /team/{id}) also clears the PIN with the same
        audit.
      responses:
        '200':
          description: PIN cleared (or there was none)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMember' }
              examples:
                reset:
                  summary: 'Reset of a nurse''s PIN after colleague tries: the 7-day figure (3 before the reset) is unchanged'
                  value: { id: 3f0c9a52-6a1e-4f7e-9d1b-2b8f4e7c1a10, name: Priya Nair, mobileMasked: '••••••3301', role: NURSE, status: ACTIVE, lastLoginAt: '2026-11-06T04:10:00Z', pin: { state: NOT_SET, setAt: null, lockedUntil: null, colleagueTries7d: 3 } }
        '400': { $ref: '#/components/responses/BadRequest', description: 'bad-request (the {id} path value is not a UUID; title "Bad Request", detail "The request could not be understood. Check it and try again.")' }
        '401': { $ref: '#/components/responses/Problem' }
        '403':
          description: forbidden
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                notOwner: { value: { type: 'https://sahaj.in/problems/forbidden', title: Not allowed, status: 403, detail: Only the clinic owner can do this. } }
        '404': { $ref: '#/components/responses/Problem', description: 'not-found' }
        '429': { $ref: '#/components/responses/Problem', description: 'rate-limit' }
  /team/{id}/pin/colleague-tries:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [SAH-38]
      summary: Wrong PIN tries by colleagues on a team member's PIN, last 7 days
      x-required-role: OWNER
      description: >-
        SAH-38, ADR-014 D9 (NEW, not in the mockup; texts T5, T10, T11, T12). The owner's history of colleague tries
        on one member's PIN (membership id), for the last 7 days by the database clock, opened from the row line
        "N wrong tries by colleagues in 7 days" (T4) on Clinic setup, Team and access, panel Staff (f-staff). OWNER
        only (token role and the membership re-read); every other role 403 forbidden "Only the clinic owner can do
        this." and no counts or names. A member of another clinic or an unknown id 404 not-found (same as any
        other clinic's record). Allowed for every member, switched-off and removed ones included. Entries latest
        first, at most 100 (truncated true when more): WRONG_TRIES groups the wrong tries of one colleague on one
        IST calendar day (at = the latest try of the group, count = the tries), shown as "Wrong PIN tries by
        <byName>: <count>"; LOCKED, one per lock caused by a run with a colleague's try, shown as "PIN locked after
        wrong tries by colleagues" (no name); RIGHT_AFTER_WRONG, one per right PIN typed by a colleague who had
        wrong tries on this PIN in the previous 7 days, shown as "Right PIN entered by <byName> after wrong tries".
        Each line with its time as "24 Oct 2026, 11:05 AM IST". byName is looked up when the answer is built
        (never stored); a switched-off or removed colleague keeps their name (mockup: past entries stay under their
        name); "Former staff member" only when no name can be found. Writes nothing; no access row (staff data,
        not patient data). Not cleared by an owner reset or a new PIN (evidence; ADR-014 Q3). Client: a sheet
        "Wrong PIN tries · <name>" with the lines, empty state "No wrong tries by colleagues in the last 7 days.",
        footer "Close"; on a failure the sheet shows the existing error state, never an empty list.
      responses:
        '200':
          description: History
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ColleagueTriesHistory' }
              examples:
                some:
                  value:
                    membershipId: 5e2f8a1b-9c3d-4e7f-8a6b-1c2d3e4f5a6b
                    asOf: '2026-11-07T06:00:00Z'
                    wrongTries7d: 6
                    truncated: false
                    entries:
                      - { kind: RIGHT_AFTER_WRONG, at: '2026-11-07T05:40:00Z', byMembershipId: 7a1c2e3f-4b5d-4c6e-8f70-81a2b3c4d5e6, byName: Sunita Pawar, count: null }
                      - { kind: LOCKED, at: '2026-11-07T05:35:12Z', byMembershipId: null, byName: null, count: null }
                      - { kind: WRONG_TRIES, at: '2026-11-07T05:35:12Z', byMembershipId: 7a1c2e3f-4b5d-4c6e-8f70-81a2b3c4d5e6, byName: Sunita Pawar, count: 5 }
                      - { kind: WRONG_TRIES, at: '2026-11-05T14:02:00Z', byMembershipId: 9b8a7c6d-5e4f-4a3b-9c2d-1e0f2a3b4c5d, byName: Meena Kale, count: 1 }
        '400': { $ref: '#/components/responses/BadRequest', description: 'bad-request (the {id} path value is not a UUID; title "Bad Request", detail "The request could not be understood. Check it and try again.")' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: 'forbidden ("Only the clinic owner can do this.")' }
        '404': { $ref: '#/components/responses/Problem', description: 'not-found' }
