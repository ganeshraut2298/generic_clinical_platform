      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/ModulesView' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Problem:
      description: Error
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    BadRequest:
      description: 'bad-request: a path value is not of its declared type (an {id} that is not a UUID). Spring''s own text is replaced by a fixed sentence (ProblemExceptionHandler); the submitted value is never echoed; no fieldErrors.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            malformedId: { value: { type: 'https://sahaj.in/problems/bad-request', title: Bad Request, status: 400, detail: The request could not be understood. Check it and try again. } }
    PayloadTooLarge:
      description: 'payload-too-large: the request body is over the size limit (RequestBodySizeLimitFilter): 64 KB for a signed-in user (property sahaj.request-body.max-bytes, never below 4 KB; the detail names the configured limit, in KB or, when not a whole number of KB, in bytes), 4 KB on /public/** and for any other request without a signed-in user. The body is not read past the limit and nothing is saved.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            signedIn: { value: { type: 'https://sahaj.in/problems/payload-too-large', title: Request too large, status: 413, detail: The request body must be 64 KB or smaller. } }
            notSignedIn: { value: { type: 'https://sahaj.in/problems/payload-too-large', title: Request too large, status: 413, detail: The request body must be 4 KB or smaller. } }
    DatabaseBusy:
      description: 'database-busy (0.1.2, DEC-054): the database did not answer in time (a lock that stayed taken, a statement that ran past the statement timeout, or no free connection). The request was rolled back, so nothing was saved by this attempt; the client may try again after Retry-After seconds. Never a 500 and never a hang.'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            busy: { $ref: '#/components/examples/DatabaseBusy' }
    SetupRequired:
      description: >-
        setup-required (0.3.0, SAH-89-1, ADR-031 D1; general rule 3): the signed-in user's clinic has not finished
        setup. Answered by every /api/v1/** operation of every module (platform, patient, opd, ipd, hra, billing,
        pharmacy) outside the allow-list, before any controller runs; nothing is read or written and no clinic data is
        returned. The client opens /setup at currentStep. Not listed on each operation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            setup: { value: { type: 'https://sahaj.in/problems/setup-required', title: Finish setting up your clinic, status: 403, detail: Finish setting up your clinic first., currentStep: 3 } }
  headers:
    RetryAfter:
      description: Seconds to wait before trying again; the same value as retryAfterSeconds in the body (5).
      schema: { type: integer, minimum: 1, examples: [5] }
  examples:
    DatabaseBusy:
      value: { type: 'https://sahaj.in/problems/database-busy', title: Sahaj is busy, status: 503, detail: This is taking longer than usual and was stopped. Nothing was saved by this attempt. Wait a moment and try again., retryAfterSeconds: 5 }
  schemas:
    PrivacySettings:
      type: object
      required: [consentRequired, promoConsent, recordCopy]
      properties:
        consentRequired: { type: boolean, default: true, description: Ask for consent at the first visit. }
        promoConsent: { type: boolean, default: true, description: Separate yes for promotional messages. }
        recordCopy: { type: boolean, default: true, description: Patients can ask for a copy of their records. }
        hfrId: { type: [string, 'null'], maxLength: 32, description: Health Facility Registry ID. Stored only; no ABDM call is made. }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, description: 'Problem type. Known values include plan-limit, slug-taken, setup-incomplete, last-owner, duplicate-mobile, concurrent-change (retryable), validation, forbidden, not-found, rate-limit, otp-locked, and for the staff PIN (SAH-31, ADR-010 D11) wrong-pin (403), pin-locked (403; the 5th wrong try that causes the first or second lock within 24 hours, or any try while locked), pin-not-set (409; no PIN, by notSetReason, and also the 5th wrong try that causes the third lock within 24 hours, which switches the PIN off: "Your PIN was switched off after too many wrong tries. Set a new one, then try again."), pin-unavailable (503), under https://sahaj.in/problems/. The PIN types are also answered by other modules that check a PIN through platform.api.StaffPinPort (ipd verify). SAH-32 (ADR-011 D7, PROPOSED): the second-nurse check of a high-alert dose (ipd POST /medicine-orders/{id}/doses) checks a colleague''s PIN through StaffPinPort.checkColleague and answers the same types with colleague texts and no names: wrong-pin "That PIN is not right." (no tries-left count, so a guesser is not told when to stop before a lock; the wrong try still counts on the colleague''s PIN; security review S4; the own-PIN answer keeps the count), pin-locked "The second nurse''s PIN is locked after 5 wrong tries. Choose another nurse, or try again at <h:mm AM/PM>.", pin-not-set "The second nurse has not set a PIN yet. Choose another nurse.", rate-limit (also when the caller has 5 failed colleague checks in 15 minutes or 10 in 24 hours), pin-unavailable; a client never reads GET /me/pin after such a pin-not-set. SAH-38 (ADR-014, PROPOSED) adds for the colleague check only: colleague-pin-limit (429; "Too many wrong PIN tries for this nurse. Choose another nurse."; the caller made 5 wrong tries of this colleague''s PIN within a rolling 7 days, durable in the database, cleared by a right PIN of the same pair or a new PIN; the PIN is not compared and nothing is counted; no retryAfterSeconds and no count) and pin-check-failed (503; "We could not check the PIN. Try again."; the PIN store could not be read or written in time: only a timeout, a lost connection or a lock failure; a constraint or permission refusal by the database (23514, 23503, 42501) is a code fault and stays a plain 500 server error, never an answer about the PIN (ADR-014 D5); fail closed, nothing counted, the same answer whether the PIN was right or wrong). Also from SAH-38: the colleague''s own failed-check limit is no longer used by colleague checks (only the caller''s limit, the pair cap and the lockout), and a lock caused by a run with any colleague try answers pin-locked and never switches the PIN off (pin-not-set TOO_MANY_LOCKS comes only from three own-session locks within 24 hours). 0.3.0 (SAH-89, ADR-031) adds setup-required (403, every module, currentStep), setup-step-failed (409, failedStep), setup-running (409, retryable, retryAfterSeconds), signup-token-invalid (401), logo-type-not-allowed (400), logo-dimensions (400) and logo-unreadable (400).', examples: ['https://sahaj.in/problems/plan-limit'] }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        retryAfterSeconds: { type: integer }
        currentStep: { type: integer, minimum: 1, maximum: 5, description: '0.3.0, setup-required only: the wizard step to open.' }
        step: { type: integer, minimum: 1, maximum: 5, description: '0.3.0, POST /setup/complete validation only: the first wizard step whose saved answers fail; fieldErrors name its fields.' }
        failedStep: { $ref: '#/components/schemas/SetupCompletionStepKey' }
        fieldErrors:
          type: array
          items: { type: object, required: [field, message], properties: { field: { type: string }, message: { type: string } } }
    IdResult: { type: object, required: [id], properties: { id: { type: string, format: uuid } } }
    Mobile: { type: string, pattern: '^[6-9][0-9]{9}$' }
    AuthMode: { type: string, enum: [LOGIN, SIGNUP] }
    Brand: { type: string, enum: [blue, teal, green, maroon, custom] }
    Role: { type: string, enum: [OWNER, DOCTOR, VISITING_DOCTOR, NURSE, FRONT_DESK, BILLING, PHARMACIST, COUNSELLOR, STORE_STAFF], description: 'STORE_STAFF added in 0.2.0 (SAH-78, DEC-062 Q3), label "Store staff": reaches only Pharmacy & Inventory, through store mappings.' }
    SalesEnquiry:
      type: object
      required: [name, mobile, source]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        clinicCity: { type: string, maxLength: 200 }
        mobile: { $ref: '#/components/schemas/Mobile' }
        bestTime: { type: string, enum: [MORNING, AFTERNOON, AFTER_OPD] }
        source: { type: string, enum: [CONTACT_SALES, BOOK_DEMO] }
    AuthResult:
      type: object
      required: [next]
      properties:
        next: { type: string, enum: [SETUP, APP, CHOOSE_CLINIC, NOT_REGISTERED] }
        accessToken: { type: string }
        expiresInSeconds: { type: integer, examples: [900] }
        selectionToken: { type: string }
        signupToken:
          type: string
          maxLength: 64
          description: '0.3.0 (SAH-89-1, ADR-031 D3). Only with next NOT_REGISTERED in mode LOGIN: send it to POST /auth/signup-continue for "Create a clinic with this number". Single-use, 10 minutes. Kept in memory only, never in storage or a URL.'
        signupTokenExpiresInSeconds: { type: integer, examples: [600] }
        clinics:
          type: array
          items: { type: object, required: [tenantId, name], properties: { tenantId: { type: string, format: uuid }, name: { type: string }, area: { type: string } } }
    SignupContinueInput:
      type: object
      required: [signupToken, consent]
      additionalProperties: false
      properties:
        signupToken: { type: string, minLength: 1, maxLength: 64 }
        consent:
          type: object
          required: [termsVersion, privacyVersion]
          properties: { termsVersion: { type: string, maxLength: 20 }, privacyVersion: { type: string, maxLength: 20 } }
    IndianState:
      type: string
      description: '0.3.0 (SAH-89-9, ADR-031 D4). The 28 states and 8 union territories by name, shown as written here. Missing or another value: "Choose the state".'
      enum: [Andhra Pradesh, Arunachal Pradesh, Assam, Bihar, Chhattisgarh, Goa, Gujarat, Haryana, Himachal Pradesh, Jharkhand, Karnataka, Kerala, Madhya Pradesh, Maharashtra, Manipur, Meghalaya, Mizoram, Nagaland, Odisha, Punjab, Rajasthan, Sikkim, Tamil Nadu, Telangana, Tripura, Uttar Pradesh, Uttarakhand, West Bengal, Andaman and Nicobar Islands, Chandigarh, Dadra and Nagar Haveli and Daman and Diu, Delhi, Jammu and Kashmir, Ladakh, Lakshadweep, Puducherry]
    ClinicPhone:
      type: string
      description: >-
        0.3.0 (SAH-89-2, OQ-89-3 b default). The client and the server remove spaces and hyphens and a leading +91,
        then accept a mobile (10 digits, first 6 to 9) or a landline with STD code (10 digits without the 0, first 1
        to 9, or 11 digits starting 0). Saved as digits only. Missing or anything else: "Enter a valid phone number".
      pattern: '^(?:[1-9][0-9]{9}|0[1-9][0-9]{9})$'
    SetupClinic:
      type: object
      description: >-
        Step 1 "Tell us about your clinic". 0.3.0 (SAH-89-2, SAH-89-9, ADR-031 D4, D11) rules and inline texts; text
        values are trimmed first. name: required, 2 to 160 characters (empty "Enter your clinic name", else "Clinic name
        must be 2 to 160 characters"). address: required, 5 to 200 characters ("Enter the clinic address"); placeholder
        "Building, road, area". city: required ("Enter the city"), 2 to 80 characters of letters (any script), spaces,
        dots, hyphens and apostrophes, starting with a letter (server: ^[\p{L}\p{M}][\p{L}\p{M} .'-]{1,79}$; otherwise
        "Enter a valid city name"). state: required (IndianState, "Choose the state"). pin: required, 6 digits not
        starting 0 ("Enter a 6-digit PIN code"). phone: required (ClinicPhone, "Enter a valid phone number").
        registrationNo: optional, marked "(optional)", up to 40 characters, no format check (41 or more "Use 40
        characters or fewer"). The State field is new against the mockup (DEC-096 item 1; a human adds it to the
        design).
      required: [name, address, city, state, pin, phone]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        address: { type: string, minLength: 5, maxLength: 200 }
        city: { type: string, minLength: 2, maxLength: 80 }
        state: { $ref: '#/components/schemas/IndianState' }
        pin: { type: string, pattern: '^[1-9][0-9]{5}$' }
        phone: { $ref: '#/components/schemas/ClinicPhone' }
        registrationNo: { type: [string, 'null'], maxLength: 40 }
    SetupSpecialty:
      type: object
      required: [code]
      description: 'Step 2. No choice: "Choose your specialty" (0.3.0).'
      properties: { code: { type: string, enum: [gp, dental, paeds, homeo] } }
    FeeRupees:
      type: integer
      minimum: 0
      maximum: 50000
      description: >-
        0.3.0 (SAH-89-2, SAH-89-5, OQ-89-9 default). The doctor's consultation fee ("New visit fee") in whole rupees,
        0 to 50,000; stored as integer paise. Missing: "Enter the consultation fee"; letters (mockup "Enter fees as
        numbers"), decimals, a negative number or over 50,000: "Enter the fee in rupees, from 0 to 50,000". Shown as "₹
        1,200" with Indian grouping; 0 shown as "Free".
    SetupTeam:
      type: object
      required: [doctors, staff]
      description: >-
        Step 3 "Who works in your clinic?". 0.3.0 rules (SAH-89-2): doctors[0] is the owner (pill "Owner"), its name
        required ("Enter the owner doctor's name"), 2 to 100 characters; doctors[1] needs name and mobile; specialty
        from the list; feeRupees as FeeRupees. Staff rows: name 2 to 100 ("Enter the name"), role one of Front desk,
        Nurse, Counsellor, Pharmacist ("Choose a role"), mobile required ("Enter a 10-digit mobile number"). A mobile
        used twice in the step, or equal to the owner's own mobile: "This number is already added". At most 2 doctors
        ("Doctors · n of 2") and 5 users in total ("n of 5 users on the free year"); a forced request answers 409
        plan-limit.
      properties:
        doctors:
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: object
            required: [name, specialty, feeRupees]
            properties:
              name: { type: string, minLength: 2, maxLength: 100 }
              specialty: { type: string, minLength: 1, maxLength: 120 }
              feeRupees: { $ref: '#/components/schemas/FeeRupees' }
              mobile: { $ref: '#/components/schemas/Mobile' }
        staff:
          type: array
          maxItems: 4
          items:
            type: object
            required: [name, role, mobile]
            properties:
              name: { type: string, minLength: 2, maxLength: 100 }
              role: { type: string, enum: [FRONT_DESK, NURSE, COUNSELLOR, PHARMACIST], description: '0.3.0: the four roles of the mockup''s step 3 list.' }
              mobile: { $ref: '#/components/schemas/Mobile' }
    SetupOpd:
      type: object
      required: [feeTiming, queue, vitals, followUpDays, followUpFee]
      properties:
        feeTiming: { type: string, enum: [before, after, split] }
        queue: { type: boolean }
        vitals: { type: boolean }
        followUpDays: { type: integer, minimum: 1, maximum: 30 }
        followUpFee: { type: string, enum: [free, half, full] }
    SetupLook:
      type: object
      required: [brand, slug, language]
      description: >-
        Step 5 "Choose your colour and web address". 0.3.0 (SAH-89-8, OQ-89-4 default, ADR-031 D6): the presets first,
        then "Custom colour" (picker or a typed code). The readability messages and "Use the readable shade" are worked
        out in the browser and warn only; the server checks the format. The logo is a separate optional upload (PUT
        /clinic/logo) and is not part of this body. slug: "Use 3 to 24 lowercase letters, numbers or hyphens"; reserved
        or taken: "Already taken. Try <suggestion>", and Create my clinic is blocked with "Choose an available web
        address".
      properties:
        brand: { $ref: '#/components/schemas/Brand' }
        brandHex:
          type: [string, 'null']
          pattern: '^#?[0-9A-Fa-f]{6}$'
          description: 'Required when brand is custom: 6 hexadecimal characters with or without # (else "Enter a colour code with 6 characters, like 1F5BC8"). Stored and returned as # plus upper case (#1F5BC8). With a preset it is ignored and not stored.'
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{2,23}$' }
        language: { type: string, enum: [en, mr, hi] }
    SetupState:
      type: object
      required: [currentStep, answers, limits, stepsDone, completionStarted]
      properties:
        currentStep: { type: integer, minimum: 1, maximum: 5 }
        answers: { type: object }
        limits: { type: object, required: [doctors, users], properties: { doctors: { type: integer }, users: { type: integer } } }
        stepsDone:
          type: array
          items: { type: integer, minimum: 1, maximum: 5 }
          description: '0.3.0 (SAH-89-3, OQ-89-6 d). Wizard steps whose saved answers pass the 0.3.0 rules; the rail shows a tick on each. All five just before the progress screen.'
        completionStarted: { type: boolean, description: '0.3.0. True once POST /setup/complete has run at least one step: the client shows the progress screen (GET /setup/completion), not the wizard.' }
    SetupCompletionStepKey:
      type: string
      enum: [CLINIC_SPACE, TEMPLATE, OPD_RULES, PAPERS, STAFF_LOGINS, WEB_ADDRESS]
      description: >-
        0.3.0 (SAH-89-3, ADR-031 D2). Lines in this order: CLINIC_SPACE "Creating your clinic space"; TEMPLATE "Loading
        the <specialtyName lower case> template"; OPD_RULES "Setting up your OPD workflow and fee rules"; PAPERS
        "Preparing case paper and bill layouts"; STAFF_LOGINS "Setting up staff logins" (OQ-89-6 a, replaces the
        mockup's "Sending staff logins on WhatsApp"); WEB_ADDRESS "Securing https://<webAddress>".
    SetupCompletion:
      type: object
      required: [state, steps, failedStep, specialtyName, webAddress]
      properties:
        state: { type: string, enum: [NOT_STARTED, RUNNING, FAILED, DONE] }
        steps:
          type: array
          minItems: 6
          maxItems: 6
          items:
            type: object
            required: [key, status]
            properties:
              key: { $ref: '#/components/schemas/SetupCompletionStepKey' }
              status: { type: string, enum: [PENDING, RUNNING, DONE, FAILED] }
        failedStep:
          oneOf:
            - { $ref: '#/components/schemas/SetupCompletionStepKey' }
            - { type: 'null' }
        specialtyName: { type: [string, 'null'], description: 'Name of the chosen specialty template, for the TEMPLATE line; null before step 2 is saved.' }
        webAddress: { type: [string, 'null'], description: '<slug>.<domain>, for the WEB_ADDRESS line and the final address line; null before step 5 is saved.' }
    SetupCompleteResult:
      type: object
      required: [next, brand, brandHex, webAddress, completion]
      properties:
        next: { const: APP }
        brand: { $ref: '#/components/schemas/Brand' }
        brandHex: { type: [string, 'null'], pattern: '^#[0-9A-F]{6}$', description: '0.3.0. Set when brand is custom.' }
        webAddress: { type: string, description: '0.3.0. For the toast "Your clinic is live at <webAddress>".' }
        completion: { $ref: '#/components/schemas/SetupCompletion' }
    SetupOverview:
      type: object
      required: [percent, checks]
      properties:
        percent: { type: integer }
        checks:
          type: array
          items: { type: object, required: [key, label, done], properties: { key: { type: string }, label: { type: string }, why: { type: string }, done: { type: boolean }, optional: { type: boolean }, section: { type: string, description: 'Clinic setup section for the Fix link: overview, profile, specialty, team, fees, paper.' }, anchor: { type: string, description: 'Panel id inside that section, for scrolling.' } } }
        lastChange: { $ref: '#/components/schemas/AuditEvent' }
    Preferences:
      type: object
      properties:
        language: { type: string, enum: [en, mr, hi] }
        theme: { type: string, enum: [light, dark] }
        menuMode: { type: string, enum: [simple, advanced] }
        sidebarCollapsed: { type: boolean }
    Me:
      type: object
      required: [userId, membershipId, name, role, clinic, menu, preferences, capabilities]
      properties:
        userId: { type: string, format: uuid }
        membershipId: { type: string, format: uuid, description: The signed-in user's membership id in this clinic. Matches TeamMember.id. }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        clinic:
          type: object
          required: [name, brand, plan]
          properties:
            name: { type: string }
            area: { type: string }
            brand: { $ref: '#/components/schemas/Brand' }
            brandHex: { type: string }
            plan: { type: string }
            planDaysLeft: { type: integer }
            setupComplete: { type: boolean }
            setupPercent: { type: integer }
            logo:
              type: object
              required: [present, etag]
              description: '0.3.0 (SAH-89-8). present true: the shell reads GET /clinic/logo (with If-None-Match etag) for the sidebar clinic card; false: initials.'
              properties:
                present: { type: boolean }
                etag: { type: [string, 'null'] }
        capabilities:
          type: object
          required: [headerMobileSearch, secondChecks, actsAsDoctor, ownerDoctorNotice, registrationNoMissing]
          description: '0.3.0 (SAH-89, ADR-031). Worked out by platform from the role and the membership; each module still checks its own rule on every call.'
          properties:
            headerMobileSearch: { type: boolean, description: 'SAH-89-4, ADR-031 D9. True for OWNER, FRONT_DESK, NURSE, DOCTOR, VISITING_DOCTOR (the roles with the Patients menu that may read patients; same list as patient POST /patients/lookup-by-mobile). False: the header field is not drawn.' }
            secondChecks: { type: boolean, description: 'SAH-89-7, ADR-031 D10. True for NURSE, PHARMACIST, DOCTOR, VISITING_DOCTOR and an OWNER who acts as doctor: Queue shows "N second checks waiting" (opd GET /emr/chemo-checks/count).' }
            actsAsDoctor: { type: boolean, description: 'SAH-89-6, ADR-031 D7. DOCTOR, VISITING_DOCTOR, or OWNER with "Also a doctor" on.' }
            ownerDoctorNotice: { type: boolean, description: 'SAH-89-6, OQ-89-10 f. Show once "You can now see patients as a doctor" with "Got it" (POST /me/doctor/notice-seen). OWNER only.' }
            registrationNoMissing: { type: boolean, description: 'SAH-89-6. True when actsAsDoctor and the caller is OWNER with no registration number: the shell shows "Add your registration number before you see patients" with a link to Team and access.' }
        menu:
          type: array
          items: { type: string }
          description: >-
            Menu keys in display order, from NavigationPolicy (role, menu mode, clinic modules). Module keys: ipd
            (Beds and admissions) for OWNER, FRONT_DESK, NURSE, DOCTOR when IPD is Trial, On or Read-only (SAH-23),
            and for PHARMACIST under the same condition, placed after today, where the page shows only the Safety
            tab with the Pharmacist check tile and panel (SAH-31, ADR-009 D11; decided by the human, DEC-017 Q2);
            emergency (Emergency, siren icon, /app/emergency) for OWNER, FRONT_DESK, NURSE in the advanced menu
            only, when IPD is Trial or On (not Read-only), placed immediately before ipd, which is right after
            followups when the role has it (SAH-28; mockup default roles; DOCTOR reaches the queue through the
            Emergency tab of Beds and admissions, OQ-28-4); staff for every clinic role when HRA is on, before
            config (SAH-20). The simple menu never has emergency. Items carry no badge counts here: the shell reads
            a badge from the owning module's summary endpoint (emergency from GET /api/v1/ipd/emergency/summary;
            ADR-005), so this response stays cacheable for the session. menuCounts of GET /modules count the same
            keys.
            0.1.1 (ADR-023 D6, H7 and D13.5, SAH-66): secondchecks ("Second checks", route /app/emr/second-checks, the
            chemotherapy orders waiting for the signed-in user's second check) for NURSE, PHARMACIST, DOCTOR and
            VISITING_DOCTOR, and for OWNER only when the owner's membership has doctor details; in both menu modes; no
            module condition. Placed right after queue when the role has it, else at the end of the list before staff
            (applied after ipd and emergency: PHARMACIST gets today, ipd, secondchecks). Examples, advanced menu, IPD
            off, HRA off: DOCTOR today, queue, secondchecks, appointments, patients, followups; NURSE today, queue,
            secondchecks, patients. Its badge, if the shell shows one, is total of GET /api/v1/opd/emr/chemo-checks.
            The opd endpoints check the role themselves; the menu is never the only protection.
            0.2.0 (SAH-78, ADR-028 D11, DEC-062 Q3; additive): pharmacy ("Pharmacy & Inventory", route /app/pharmacy)
            when the clinic's pharmacy_on entitlement is true and the member is OWNER or PHARMACIST or has an active
            mapping to an active pharmacy store; in both menu modes; placed before staff and config (at the end when
            the role has neither). STORE_STAFF has no other key, so its menu is [pharmacy] or empty. With pharmacy_on
            false (the default) no menu changes. The pharmacy endpoints check access themselves.
            0.3.0 (SAH-89-7, DEC-096 item 3, ADR-031 D10; changed): secondchecks is never sent, for any role, in either
            menu mode; the shell reserves no place and calls no badge for it. The waiting orders are reached from Queue
            (Me.capabilities.secondChecks). OWNER who acts as doctor (ADR-031 D7) gets the OWNER menu; its keys already
            include every doctor key, each once.
        permissions: { type: array, items: { type: string } }
        preferences: { $ref: '#/components/schemas/Preferences' }
    TeamMember:
      type: object
      required: [id, name, mobileMasked, role, status]
      properties:
        id: { type: string, format: uuid, description: The membership id (not the user id). Team calls are keyed on it. The signed-in user's own membership id is returned by GET /me as membershipId. }
        name: { type: string }
        mobileMasked: { type: string, examples: ['••••••7410'] }
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [ACTIVE, INACTIVE, REMOVED] }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        doctor: { $ref: '#/components/schemas/DoctorDetails' }
        alsoDoctor:
          type: boolean
          description: '0.3.0 (SAH-89-6, ADR-031 D7). OWNER rows only (absent on other roles): true when "Also a doctor" is on. An OWNER row with doctor details and alsoDoctor false keeps doctor for history and is not listed among Doctors.'
        pin:
          oneOf:
            - { $ref: '#/components/schemas/TeamMemberPin' }
            - { type: 'null' }
          description: 'SAH-31. Sent for an OWNER caller on every row and for the caller''s own row; otherwise not sent (the key is left out; treat a missing pin like null). Never sent for a non-owner on other people''s rows (GET /team).'
    TeamMemberPin:
      type: object
      description: >-
        SAH-31, ADR-010 D12. Team list (panel Staff, f-staff), OWNER view: state SET the pill "PIN set" (good,
        key icon; mockup); LOCKED the pill "PIN locked" (warn, key icon); NOT_SET the pill "No PIN yet" (muted),
        in place of the mockup's "Send PIN link" button (WhatsApp is not in phase 1). OWNER also gets the ghost
        button "Reset PIN" (key icon) on rows with SET or LOCKED, opening the confirm sheet "Reset PIN · <name>".
        Own row, every role: the button "Set my PIN" (NOT_SET) or "Change my PIN" (SET, LOCKED) opening the Set
        PIN sheet. Never the PIN or the hash. Whenever a pin object is sent, all four keys are present (setAt,
        lockedUntil and colleagueTries7d as null when they do not apply).
      required: [state, setAt, lockedUntil, colleagueTries7d]
      properties:
        state: { $ref: '#/components/schemas/PinState' }
        setAt: { type: [string, 'null'], format: date-time, description: 'When the current PIN was set; null when NOT_SET.' }
        lockedUntil: { type: [string, 'null'], format: date-time, description: 'Set only when LOCKED.' }
        colleagueTries7d:
          type: [integer, 'null']
          minimum: 0
          description: >-
            SAH-38, ADR-014 D9. Always present in a sent pin object. A number for an OWNER caller, on every row
            (the owner's own row included). Null for every other role: such a caller receives a pin object only on
            their own row (other people's rows carry no pin), so null appears only there. The number: wrong tries
            of this member's PIN typed by colleagues in second-nurse checks in the last 7 days (database clock),
            not cleared by a reset or a new PIN. 0 when none or no PIN row. Row text (NEW, T4), only when above 0,
            as a link-style button that opens the sheet of GET /team/{id}/pin/colleague-tries: "N wrong tries by
            colleagues in 7 days" or "1 wrong try by a colleague in 7 days". Next to the existing pills; the "PIN
            locked" pill is unchanged. Never a name here.
    PinState:
      type: string
      enum: [NOT_SET, SET, LOCKED]
      description: 'LOCKED = a PIN is set and locked_until is in the future (5 wrong tries in a row; 15 minutes).'
    PinStatus:
      type: object
      description: >-
        SAH-31, ADR-010. The signed-in person's own PIN status. available false when SAHAJ_PIN_PEPPER is not set
        (every PIN set and check then answers 503 pin-unavailable; the screens say "PIN checks are not available
        right now. Try again later." and disable Save PIN and Verify order).
      required: [available, state, setAt, lockedUntil, triesLeft, notSetReason, mobileMasked]
      properties:
        available: { type: boolean }
        state: { $ref: '#/components/schemas/PinState' }
        setAt: { type: [string, 'null'], format: date-time }
        lockedUntil: { type: [string, 'null'], format: date-time, description: 'Set only when LOCKED; the screen shows it as "11:20 AM" (IST).' }
        triesLeft: { type: [integer, 'null'], minimum: 0, maximum: 5, description: 'Wrong tries left before the lock: 5 minus the wrong tries in a row; 0 when LOCKED; null when NOT_SET.' }
        notSetReason:
          oneOf:
            - { type: string, enum: [RESET_BY_OWNER, TOO_MANY_LOCKS] }
            - { type: 'null' }
          description: 'Why there is no PIN: null when never set (or when a PIN is set); RESET_BY_OWNER after an owner reset or removal of access; TOO_MANY_LOCKS after the third lock within 24 hours (the PIN check that caused it answered 409 pin-not-set, not pin-locked).'
        mobileMasked: { type: string, examples: ['••••••7410'], description: 'Where the code for PUT /me/pin goes; last 4 digits only.' }
    PinSetInput:
      type: object
      required: [code, newPin, confirmPin]
      properties:
        code: { type: [string, 'null'], maxLength: 16, description: 'The 6-digit one-time code from POST /me/pin/code. Exactly 6 ASCII digits, else 400 field code "Enter the 6-digit code.". Never logged or echoed.' }
        newPin: { type: [string, 'null'], maxLength: 16, description: 'Exactly 4 ASCII digits (a string, so leading zeros survive), else "Enter a 4-digit PIN."; refused by the weak-PIN rules of ADR-010 D4 with "This PIN is too easy to guess. Choose another one.". Never logged, audited, stored in clear or echoed.' }
        confirmPin: { type: [string, 'null'], maxLength: 16, description: 'Must equal newPin, else "The two PINs do not match.".' }
    ColleagueTriesNotice:
      type: object
      description: 'SAH-38, ADR-014 D8. Answer of GET /me/pin/colleague-tries: the caller''s own data only, counts and state, never who tried.'
      required: [unseenCount, latestAt, state, lockedUntil, notSetReason]
      properties:
        unseenCount: { type: integer, minimum: 0, description: 'Colleague wrong tries of the caller''s PIN after the last "Got it" (all kept tries before the first). 0 means no banner.' }
        latestAt: { type: [string, 'null'], format: date-time, description: 'Time of the newest try counted in unseenCount (database clock, microseconds kept); null when unseenCount is 0. Send it back as seenThrough. Not shown on screen.' }
        state: { $ref: '#/components/schemas/PinState' }
        lockedUntil: { type: [string, 'null'], format: date-time, description: 'Set only when LOCKED; shown as "Your PIN is locked until 11:05 AM IST.".' }
        notSetReason:
          oneOf:
            - { type: string, enum: [RESET_BY_OWNER, TOO_MANY_LOCKS] }
            - { type: 'null' }
          description: 'As PinStatus.notSetReason. TOO_MANY_LOCKS adds "Your PIN was switched off. Set a new one." and the button "Set my PIN".'
    ColleagueTriesSeenInput:
      type: object
      required: [seenThrough]
      properties:
        seenThrough: { type: string, format: date-time, maxLength: 40, description: 'ColleagueTriesNotice.latestAt as received. Capped at the database clock by the server. 400 validation, field seenThrough "Reload the page and try again." when missing, longer than 40 characters, not a readable date-time, more than one day ahead of the server clock, or earlier than 1 Jan 2020 (00:00 UTC) (security review S38-3).' }
    ColleagueTriesHistory:
      type: object
      description: 'SAH-38, ADR-014 D9. Answer of GET /team/{id}/pin/colleague-tries (OWNER only).'
      required: [membershipId, asOf, wrongTries7d, truncated, entries]
      properties:
        membershipId: { type: string, format: uuid }
        asOf: { type: string, format: date-time, description: 'Database clock; the window is the 7 days before it.' }
        wrongTries7d: { type: integer, minimum: 0, description: 'Equals TeamMember.pin.colleagueTries7d at the same instant.' }
        truncated: { type: boolean, description: 'True when more than 100 entries exist; the newest 100 are returned.' }
        entries: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ColleagueTriesEntry' }, description: 'Latest first.' }
    ColleagueTriesEntry:
      type: object
      required: [kind, at, byMembershipId, byName, count]
      properties:
        kind:
          type: string
          enum: [WRONG_TRIES, LOCKED, RIGHT_AFTER_WRONG]
          description: 'WRONG_TRIES "Wrong PIN tries by <byName>: <count>"; LOCKED "PIN locked after wrong tries by colleagues"; RIGHT_AFTER_WRONG "Right PIN entered by <byName> after wrong tries".'
        at: { type: string, format: date-time, description: 'WRONG_TRIES: the latest try of the group (one colleague, one IST day). Shown as "24 Oct 2026, 11:05 AM IST".' }
        byMembershipId: { type: [string, 'null'], format: uuid, description: 'The colleague who typed; null for LOCKED.' }
        byName: { type: [string, 'null'], description: 'Looked up at answer time, never stored; "Former staff member" only when no name can be found; null for LOCKED. Screen only, never logged.' }
        count: { type: [integer, 'null'], minimum: 1, description: 'WRONG_TRIES only; null otherwise.' }
    PinCodeSent:
      type: object
      required: [resendAfterSeconds, mobileMasked]
      properties:
        resendAfterSeconds: { type: integer, examples: [30] }
        mobileMasked: { type: string, examples: ['••••••7410'] }
    DoctorDetails:
      type: object
      description: '0.3.0: feeRupees limited to 0 to 50,000 (FeeRupees). The one fee of the doctor: "Consultation fee (₹)" on Add person and the wizard, "New visit fee" in Fees and billing.'
      properties:
        specialty: { type: string, maxLength: 120 }
        degree: { type: string, maxLength: 120 }
        registrationNo: { type: string, maxLength: 80 }
        feeRupees: { $ref: '#/components/schemas/FeeRupees' }
    TeamMemberCreate:
      type: object
      required: [name, mobile, role]
      description: '0.3.0 (SAH-89-5): role DOCTOR or VISITING_DOCTOR requires doctor.feeRupees (400 field doctor.feeRupees "Enter the consultation fee").'
      properties:
        name: { type: string, minLength: 1 }
        mobile: { $ref: '#/components/schemas/Mobile' }
        role: { $ref: '#/components/schemas/Role' }
        doctor: { $ref: '#/components/schemas/DoctorDetails' }
    OwnerDoctorInput:
      type: object
      required: [alsoDoctor]
      additionalProperties: false
      description: '0.3.0 (SAH-89-6, ADR-031 D7). Body of PUT /me/doctor. alsoDoctor true requires doctor.specialty and doctor.feeRupees; false ignores doctor.'
      properties:
        alsoDoctor: { type: boolean }
        doctor: { $ref: '#/components/schemas/DoctorDetails' }
    TeamMemberUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        role: { $ref: '#/components/schemas/Role' }
        doctor: { $ref: '#/components/schemas/DoctorDetails' }
    RolePermission:
      type: object
      required: [role, permission, allowed]
      properties:
        role: { $ref: '#/components/schemas/Role' }
        permission: { type: string, enum: [token, vitals, collect, cancel, refund, revenue, export] }
        allowed: { type: boolean }
    ClinicProfile:
      type: object
      required: [name]
      description: >-
        0.3.0 (SAH-89-2, SAH-89-9, ADR-031 D4): on PUT, name, address, city, state, pin and phone are required with
        the limits and texts of SetupClinic (address "Enter the clinic address", city "Enter the city" or "Enter a valid
        city name", state "Choose the state", pin "Enter a 6-digit PIN code", phone "Enter a valid phone number").
        GET may return state null and addressNeedsReview true for a clinic saved before 0.3.0.
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        nameLocal: { type: string }
        address: { type: string, minLength: 5, maxLength: 200, description: 'Address line: building, road, area.' }
        area: { type: string }
        city: { type: string, minLength: 2, maxLength: 80 }
        state:
          oneOf:
            - { $ref: '#/components/schemas/IndianState' }
            - { type: 'null' }
          description: '0.3.0. Null only on GET for a clinic saved before 0.3.0.'
        pin: { type: string, pattern: '^[1-9][0-9]{5}$' }
        phone: { $ref: '#/components/schemas/ClinicPhone' }
        whatsapp: { type: string }
        mapsUrl:
          type: [string, 'null']
          format: uri
          maxLength: 500
          description: >-
            Optional "Google Maps link", hint "Paste the share link from Google Maps". 0.3.0 (ADR-031 D4): https only,
            host maps.app.goo.gl, maps.google.com, maps.google.co.in, or goo.gl, google.com, www.google.com,
            google.co.in, www.google.co.in with a path starting /maps; else "Paste a link from Google Maps". Never fetched
            by the server; opened by the client in a new tab (noopener, noreferrer). No latitude or longitude is stored.
        registrationNo: { type: [string, 'null'], maxLength: 40 }
        slug: { type: string, readOnly: true }
        specialtyCode: { type: string }
        brand: { $ref: '#/components/schemas/Brand' }
        brandHex: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        addressNeedsReview: { type: boolean, readOnly: true, description: '0.3.0. True when state is null (saved before 0.3.0): the panel asks "Check your address and choose the state." before Save.' }
        logo: { allOf: [ { $ref: '#/components/schemas/ClinicLogoInfo' } ], readOnly: true }
    ClinicLogoInfo:
      type: object
      required: [present]
      description: '0.3.0 (SAH-89-8, ADR-031 D5). The stored logo, always PNG. Width and height after re-encoding (longest side at most 1024 px).'
      properties:
        present: { type: boolean }
        etag: { type: [string, 'null'], description: 'SHA-256 hex of the stored PNG; the ETag of GET /clinic/logo.' }
        width: { type: [integer, 'null'], minimum: 1, maximum: 1024 }
        height: { type: [integer, 'null'], minimum: 1, maximum: 1024 }
        bytes: { type: [integer, 'null'], minimum: 1 }
        updatedAt: { type: [string, 'null'], format: date-time }
    Holiday:
      type: object
      required: [date, name, type]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        date: { type: string, format: date }
        name: { type: string }
        type: { type: string, enum: [CLOSED, MORNING_ONLY, EVENING_ONLY] }
    Specialty:
      type: object
      required: [code, name, phase]
      properties:
        code: { type: string }
        name: { type: string }
        features: { type: array, items: { type: string } }
        phase: { type: integer }
    AuditEvent:
      type: object
      required: [id, action, at]
      properties:
        id: { type: string, format: uuid }
        actorName: { type: string }
        action: { type: string }
        entityType: { type: string }
        before: { type: [object, 'null'] }
        after: { type: [object, 'null'] }
        at: { type: string, format: date-time }
    ModulesView:
      type: object
      required: [plan, ipd, hra, menuCounts, ipdTrialAvailable]
      properties:
        plan: { type: string, enum: [FREE, PRO], description: 'FREE is shown as "Free year".' }
        ipd:
          type: object
          required: [state, requested]
          properties:
            state: { type: string, enum: [off, trial, on, readonly] }
            trialEndsAt: { type: [string, 'null'], format: date-time }
            requested: { type: boolean }
            requestedAt: { type: [string, 'null'], format: date-time }
        ipdTrialAvailable: { type: boolean, description: True when the owner may start the IPD trial (DEC-010 temporary switch is on and IPD is off). }
        hra:
          type: object
          required: [on]
          properties:
            on: { type: boolean }
        menuCounts:
          type: object
          description: Number of menu items the signed-in user's role gets in each menu mode.
          required: [simple, advanced]
          properties:
            simple: { type: integer }
            advanced: { type: integer }
