openapi: 3.1.0
info:
  title: Sahaj platform API
  version: 0.3.0
  description: >-
    0.3.0 (22 Nov 2026, SAH-89, DEC-096, ADR-031; PROPOSED until "SAH-89 · contract · APPROVED"). Changed (narrower or
    breaking, each named): (a) general rule 3, the setup guard (ADR-031 D1): until the signed-in user's clinic has
    finished setup, every /api/v1/** operation of every module answers 403 problem type setup-required (title "Finish
    setting up your clinic", detail "Finish setting up your clinic first.", extension currentStep 1 to 5; components/responses/SetupRequired),
    except the allow-list /health, /public/**, /auth/**, /setup/**, GET /me, PATCH /me/preferences, GET /specialties and
    GET, PUT, DELETE /clinic/logo; nothing is read or written. A non-owner membership of a clinic whose setup is not
    complete is left out of sign-in (next NOT_REGISTERED when it is the only one). (b) Me.menu never contains
    secondchecks (ADR-031 D10); Me.capabilities.secondChecks says who reaches the waiting list from Queue (opd 0.8.0 GET
    /emr/chemo-checks/count). (c) Wizard and Clinic profile validation is stricter (ADR-031 D11, SAH-89-2): SetupClinic
    requires address, state, pin and phone with the limits on the schema; ClinicProfile requires the same four address
    parts on PUT; SetupTeam limits names, fees 0 to 50,000 and staff roles; DoctorDetails.feeRupees maximum 50,000;
    TeamMemberCreate requires doctor.feeRupees for DOCTOR and VISITING_DOCTOR. (d) POST /setup/complete runs six committed
    steps (ADR-031 D2): it may now answer 409 setup-step-failed (failedStep) and 409 setup-running, and its 400 validation
    carries the extension step. (e) The plan doctor limit (2) is checked on the server (ADR-031 D8): 409 plan-limit "Your
    plan allows 2 doctors." on POST /team, PATCH /team/{id}, POST /team/{id}/reactivate and PUT /me/doctor. Added:
    POST /auth/signup-continue and AuthResult.signupToken (ADR-031 D3, "Create a clinic with this number"); GET
    /setup/completion and SetupCompletion; SetupState.stepsDone; SetupLook.brandHex (custom colour, ADR-031 D6);
    ClinicProfile.state, addressNeedsReview and logo; GET, PUT, DELETE /clinic/logo (multipart, PNG or JPEG bytes up to 2
    MB, re-encoded to PNG; SVG not accepted; ADR-031 D5); PUT /me/doctor and POST /me/doctor/notice-seen (owner as
    doctor, ADR-031 D7); TeamMember.alsoDoctor and the owner's doctor object on GET /team; Me.capabilities and
    Me.clinic.logo; problem types setup-required, setup-step-failed, setup-running, signup-token-invalid,
    logo-type-not-allowed, logo-dimensions, logo-unreadable. New audit actions: PLATFORM_CLINIC_LOGO_SET,
    PLATFORM_CLINIC_LOGO_REMOVED, PLATFORM_DOCTOR_FEE_CHANGED, PLATFORM_OWNER_DOCTOR_ON, PLATFORM_OWNER_DOCTOR_OFF (ids,
    amounts in paise, sizes and hashes only; never a name, mobile or image byte). No Google service is called (ADR-031
    D4). Request-size exception: PUT /clinic/logo up to 2 MB + 64 KB.

    0.2.0 (17 Nov 2026, SAH-78, DEC-062 Q3, ADR-028 revision 2; additive, no existing value, path or behaviour changes) adds the team role STORE_STAFF (label "Store staff") to components/schemas/Role, so it can be chosen in POST /team and PATCH /team/{id} and is returned in TeamMember.role and Me.role. A Store staff member has no OPD, IPD, billing or HRA access: every existing role gate of every module is an allow-list that does not name STORE_STAFF, so each answers 403 forbidden as for any role it does not name. Its menu (Me.menu) is empty except the new key pharmacy. GET /role-permissions never lists STORE_STAFF and PUT /role-permissions answers 400 validation for a STORE_STAFF row (the seven permissions do not apply to it). The member counts against the plan user limit like every member. Adds the menu key pharmacy (label "Pharmacy & Inventory", route /app/pharmacy) when the clinic's pharmacy_on entitlement is true (default false, switched by the Sahaj admin; admin.yaml 0.6.0) and the member is OWNER or PHARMACIST or has an active mapping to an active pharmacy store (platform.api.PharmacyAccessPort implemented by the pharmacy module). With pharmacy_on false every menu and answer is exactly as in 0.1.2. 0.1.2 (15 Nov 2026, DEC-054, SAH-39; additive) adds the reusable response components/responses/DatabaseBusy, a 503 with problem type database-busy (title "Sahaj is busy", header Retry-After 5, body field retryAfterSeconds 5) answered when a database lock wait, a statement timeout or no free connection stopped the request; the request was rolled back and nothing was saved by that attempt, so the client may try again after the wait. It is listed on every write and on the audit log read; where an operation already has its own 503 (pin-unavailable on PUT /me/pin and POST /me/pin/code) the two are merged into that 503's description. No path, schema or other problem type changes. 0.1.1 (12 Nov 2026, ADR-023 D13.5, SAH-66) adds the menu key secondchecks to GET /me (additive; nothing else changes). Phase 1 contract, SAH-1 to SAH-7, and the personal staff PIN of SAH-31 (ADR-010; /me/pin, /me/pin/code, /team/{id}/pin/reset; checked for other modules through the internal port platform.api.StaffPinPort, not over HTTP), and the colleague PIN hardening of SAH-38 (ADR-014; /me/pin/colleague-tries, /me/pin/colleague-tries/seen, /team/{id}/pin/colleague-tries, TeamMemberPin.colleagueTries7d, problem types colleague-pin-limit and pin-check-failed). The tenant always comes from the logged-in user, never from a request. Errors are RFC 9457 application/problem+json. Two general rules apply to every operation (release audit DEC-025, code review #2). (1) An {id} path value that is not a UUID answers 400 problem type bad-request (components/responses/BadRequest: title "Bad Request", detail "The request could not be understood. Check it and try again.", no fieldErrors, nothing submitted is echoed); it is listed on every operation with an {id} path parameter, merged into the description where the operation also has its own 400 validation answer. (2) A request body over the size limit answers 413 problem type payload-too-large (components/responses/PayloadTooLarge: title "Request too large"); the limit is 64 KB for a signed-in user (detail "The request body must be 64 KB or smaller."; property sahaj.request-body.max-bytes, never below 4 KB, and the detail names the configured limit) and 4 KB on /public/** and for any other request without a signed-in user, such as the /auth/** calls before sign-in (detail "The request body must be 4 KB or smaller."). It is listed on every operation with a request body and applies equally to a body sent to an operation that declares none.
servers:
  - url: /api/v1/platform
security:
  - bearer: []
tags:
  - { name: SAH-1 }
  - { name: SAH-2 }
  - { name: SAH-3 }
  - { name: SAH-4 }
  - { name: SAH-5 }
  - { name: SAH-6 }
  - { name: SAH-7 }
  - { name: SAH-89 }
paths:
  /health:
    get:
      tags: [SAH-1]
      security: []
      responses:
        '200':
          description: The application is up
          content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, examples: [UP] } } } } }
  /public/sales-enquiries:
    post:
      tags: [SAH-2]
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SalesEnquiry' } } }
      responses:
        '201': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/IdResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge', description: 'payload-too-large, limit 4 KB (public endpoint)' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /auth/otp/request:
    post:
      tags: [SAH-3]
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [mobile, mode], properties: { mobile: { $ref: '#/components/schemas/Mobile' }, mode: { $ref: '#/components/schemas/AuthMode' } } } } }
      responses:
        '202': { description: Code sent. Never contains the code., content: { application/json: { schema: { type: object, required: [resendAfterSeconds], properties: { resendAfterSeconds: { type: integer, examples: [30] } } } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge', description: 'payload-too-large, limit 4 KB (no signed-in user)' }
        '423': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /auth/otp/verify:
    post:
      tags: [SAH-3]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mobile, code, mode]
              properties:
                mobile: { $ref: '#/components/schemas/Mobile' }
                code: { type: string, pattern: '^[0-9]{6}$' }
                mode: { $ref: '#/components/schemas/AuthMode' }
                consent:
                  type: object
                  required: [termsVersion, privacyVersion]
                  properties: { termsVersion: { type: string }, privacyVersion: { type: string } }
      description: >-
        0.3.0 (SAH-89-1, ADR-031 D1, D3). Mode LOGIN with a number that has no membership: next NOT_REGISTERED (text
        "This number is not registered. Ask your clinic owner to add you, or sign up to create a new clinic.", SAH-3) and
        now also signupToken and signupTokenExpiresInSeconds (600) for the button "Create a clinic with this number"
        (POST /auth/signup-continue; no second code). A non-owner membership of a clinic whose setup is not complete is
        left out (next NOT_REGISTERED when it is the only one). An owner whose clinic is mid-setup gets next SETUP, as
        before. The mobile and the code are never logged.
      responses:
        '200': { description: Verified. Sets the refresh cookie when a session starts., content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge', description: 'payload-too-large, limit 4 KB (no signed-in user)' }
        '423': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /auth/signup-continue:
    post:
      tags: [SAH-89]
      security: []
      summary: Create a clinic with the number just verified in Log in mode
      description: >-
        SAH-89-1, OQ-89-1 A, ADR-031 D3. The button "Create a clinic with this number" on the not-registered message.
        Body: the signupToken of the LOGIN verify answer and the Terms and Privacy consent (same shape and rules as
        SIGNUP verify). The token is single-use, bound to the verified mobile, valid 10 minutes, stored only as a
        SHA-256 hash. On success: the user, the clinic (tenant), the owner membership, setup progress at step 1 and
        the Free plan for 12 months are created exactly as for SIGNUP verify; consent is recorded with time and
        versions; the refresh cookie is set; 200 next SETUP with accessToken. If the number got a membership after the
        verify, the answer is as SIGNUP verify for a known number (next APP or CHOOSE_CLINIC, client toast "This number
        already has a clinic. Logging you in.") and no clinic is created. A repeat with the same token after a lost
        answer: 401 signup-token-invalid (the client signs in again; the clinic created by the first call is found and
        next is SETUP). Check order: body 400 validation (signupToken "Verify your number again.", consent "Accept the
        Terms and Privacy Policy to continue."); rate limit 10 per IP per 10 minutes 429 rate-limit; token wrong,
        expired or used 401 signup-token-invalid (title "Verify your number again", detail "This link has expired.
        Verify your number again."). The token and the mobile are never logged or echoed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupContinueInput' }
            examples:
              continue: { value: { signupToken: 'q3nV0b5yJx8Q2mR4tZk7Wc1sL9aP6eHdU0fGiTnYb2M', consent: { termsVersion: '2026-10', privacyVersion: '2026-10' } } }
      responses:
        '200': { description: Clinic created (next SETUP) or existing clinic signed in, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation (signupToken, consent)' }
        '401': { $ref: '#/components/responses/Problem', description: 'signup-token-invalid' }
        '413': { $ref: '#/components/responses/PayloadTooLarge', description: 'payload-too-large, limit 4 KB (no signed-in user)' }
        '429': { $ref: '#/components/responses/Problem', description: 'rate-limit' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /auth/select-clinic:
    post:
      tags: [SAH-3]
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [selectionToken, tenantId], properties: { selectionToken: { type: string }, tenantId: { type: string, format: uuid } } } } }
      responses:
        '200': { description: Session started, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge', description: 'payload-too-large, limit 4 KB (no signed-in user)' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /auth/refresh:
    post:
      tags: [SAH-3]
      security: []
      description: Uses the HttpOnly refresh cookie and rotates it.
      responses:
        '200': { description: New access token, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /auth/logout:
    post:
      tags: [SAH-3]
      responses:
        '204': { description: Logged out on this device }
        '401': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /auth/logout-all:
    post:
      tags: [SAH-3]
      responses:
        '204': { description: Logged out on all devices }
        '401': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /setup:
    get:
      tags: [SAH-4, SAH-89]
      description: OWNER only (403 forbidden otherwise, SAH-4 AC14). 0.3.0 adds stepsDone (the rail ticks) and completionStarted.
      responses:
        '200': { description: Saved progress, content: { application/json: { schema: { $ref: '#/components/schemas/SetupState' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /setup/steps/{step}:
    put:
      tags: [SAH-4, SAH-89]
      description: >-
        OWNER only. 0.3.0 (SAH-89-2, ADR-031 D11): the body of step n is validated against the step's schema and the
        rules on it; every failing field is returned together in fieldErrors (field paths such as name, pin,
        doctors[1].feeRupees, staff[0].mobile) with the inline text from the schema descriptions, and nothing is
        saved. Text values are trimmed before checking and saved trimmed. Step 3 also answers 400 field
        staff[i].mobile or doctors[1].mobile "This number is already added" for a mobile used twice in the step or
        equal to the owner's own mobile, and 409 plan-limit "The free plan allows up to 5 users in total." or "Your
        plan allows 2 doctors.". A step saved before 0.3.0 that no longer passes is not touched here; POST
        /setup/complete reports it. Mobiles, names and addresses never appear in a log or a problem detail.
      parameters:
        - { name: step, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 5 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: '#/components/schemas/SetupClinic' }
                - { $ref: '#/components/schemas/SetupSpecialty' }
                - { $ref: '#/components/schemas/SetupTeam' }
                - { $ref: '#/components/schemas/SetupOpd' }
                - { $ref: '#/components/schemas/SetupLook' }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/SetupState' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /setup/slug-availability:
    get:
      tags: [SAH-4]
      parameters:
        - { name: slug, in: query, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{2,23}$' } }
      responses:
        '200': { description: Result, content: { application/json: { schema: { type: object, required: [available, alternatives], properties: { available: { type: boolean }, alternatives: { type: array, items: { type: string } } } } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /setup/complete:
    post:
      tags: [SAH-4, SAH-89]
      description: >-
        OWNER only. 0.3.0 (SAH-89-3, ADR-031 D2): runs the six completion steps in order (SetupCompletionStepKey), each
        in its own transaction and each safe to repeat; a DONE step is skipped. The clinic opens (setup guard lifted,
        completed_at set, audit SETUP_COMPLETED) only when the last step commits. Synchronous: the answer comes when
        every step is DONE or one failed; meanwhile the client reads GET /setup/completion to tick lines. Check order:
        403 forbidden (not OWNER); 409 setup-running (another run of this clinic started less than 2 minutes ago;
        retryable, keep reading GET /setup/completion); step 1 re-validates the five saved steps: 400 validation with
        the extension step (1 to 5, the first failing step) and fieldErrors, or 400 setup-incomplete "Finish every
        step before creating your clinic." when a step was never saved; 409 slug-taken "That web address was just
        taken. Choose another." (step 5 of the wizard); 409 plan-limit; any other failure of a step marks it FAILED
        and answers 409 setup-step-failed (title "We could not finish this step", detail "We could not finish this
        step. Try again.", extensions failedStep and completion), earlier DONE steps stay DONE, the clinic stays closed;
        503 database-busy (the running step is rolled back and stays PENDING). Calling again after a failure continues
        from the failed step. Already complete: 200 with the same answer, nothing written.
      responses:
        '200':
          description: Clinic created and open
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupCompleteResult' }
              examples:
                done:
                  value:
                    next: APP
                    brand: custom
                    brandHex: '#1F5BC8'
                    webAddress: 'shreesai.sahaj.in'
                    completion: { state: DONE, failedStep: null, steps: [ { key: CLINIC_SPACE, status: DONE }, { key: TEMPLATE, status: DONE }, { key: OPD_RULES, status: DONE }, { key: PAPERS, status: DONE }, { key: STAFF_LOGINS, status: DONE }, { key: WEB_ADDRESS, status: DONE } ], specialtyName: General practice, webAddress: 'shreesai.sahaj.in' }
        '400': { $ref: '#/components/responses/Problem', description: 'validation (with extension step and fieldErrors) or setup-incomplete' }
        '403': { $ref: '#/components/responses/Problem', description: forbidden }
        '409':
          description: 'slug-taken, plan-limit, setup-running or setup-step-failed'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                stepFailed: { value: { type: 'https://sahaj.in/problems/setup-step-failed', title: We could not finish this step, status: 409, detail: We could not finish this step. Try again., failedStep: STAFF_LOGINS } }
                running: { value: { type: 'https://sahaj.in/problems/setup-running', title: Setup is already running, status: 409, detail: Your clinic is being set up. Wait a moment., retryAfterSeconds: 2 } }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /setup/completion:
    get:
      tags: [SAH-89]
      summary: Progress of "Create my clinic" for the setup progress screen
      description: >-
        SAH-89-3, ADR-031 D2. OWNER only (403 forbidden otherwise). Allowed while setup is open and after it. Writes
        nothing. state NOT_STARTED before the first POST /setup/complete; RUNNING while a run is active; FAILED when
        the last run stopped at failedStep; DONE when the clinic is open. The client shows the six lines in the order
        of steps, with the texts of SetupCompletionStepKey (Loading the <specialtyName> template; Securing
        https://<webAddress>), a progress bar (steps DONE of 6), the final address line with the lock icon, and for a
        screen reader "Step n of 6 done". A line is ticked only when its status is DONE; the whole screen stays at
        least 4 seconds. When state is DONE the app opens with the toast "Your clinic is live at <webAddress>" and the
        Getting started panel. On FAILED the failed line shows "We could not finish this step. Try again." and the
        button "Try again" (POST /setup/complete again). After a reload or a new sign-in with next SETUP, the client
        reads this first: any state other than NOT_STARTED shows this screen, not the wizard.
      responses:
        '200':
          description: Progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupCompletion' }
              examples:
                running: { value: { state: RUNNING, failedStep: null, specialtyName: Dental, webAddress: 'smiledental.sahaj.in', steps: [ { key: CLINIC_SPACE, status: DONE }, { key: TEMPLATE, status: DONE }, { key: OPD_RULES, status: RUNNING }, { key: PAPERS, status: PENDING }, { key: STAFF_LOGINS, status: PENDING }, { key: WEB_ADDRESS, status: PENDING } ] } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: forbidden }
  /setup/overview:
    get:
      tags: [SAH-7]
      description: >-
        OWNER only. SAH-31 proposal (ADR-010 D12, Q2; built only when the human accepts it): one more check,
        key pin, label "Own PIN for each staff member", why "So medicine checks show who did them", done when
        every ACTIVE member has a PIN set or locked, section team, anchor f-staff, optional true (it does not
        change percent). The mockup line is "Own PIN login for each staff member", done when PIN sign-in is
        switched on; PIN sign-in is not built.
      responses:
        '200': { description: Progress and last change, content: { application/json: { schema: { $ref: '#/components/schemas/SetupOverview' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /me:
    get:
      tags: [SAH-5, SAH-89]
      description: Allowed while setup is open (setup guard allow-list). 0.3.0 adds Me.capabilities and Me.clinic.logo, and Me.menu no longer has secondchecks.
      responses:
        '200': { description: Current user, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /me/doctor:
    put:
      tags: [SAH-89]
      summary: The owner switches "Also a doctor" on or off and saves their own doctor details
      x-required-role: OWNER (own membership only)
      description: >-
        SAH-89-6, OQ-89-10 A, ADR-031 D7. Team and access, the owner's own row: the switch "I also see patients as a
        doctor" with Specialty, Qualification, Registration number and Consultation fee (₹). Only an ACTIVE OWNER, for
        their own membership (read again from the database; the token role is not trusted); every other role 403
        forbidden "Only the clinic owner can do this.". alsoDoctor true: specialty required (1 to 120 characters,
        "Choose a specialty"), feeRupees required, whole rupees 0 to 50,000 ("Enter the consultation fee" when
        missing, "Enter the fee in rupees, from 0 to 50,000" otherwise), degree optional up to 120, registrationNo
        optional up to 80 (the owner cannot start a consultation without it: opd 403 registration-number-missing).
        Turning on when the clinic already has 2 members who act as doctor: 409 plan-limit "Your plan allows 2
        doctors.". The doctor profile row is created or updated with sees_patients true; audit PLATFORM_OWNER_DOCTOR_ON
        (membership id) and, when the fee changed, PLATFORM_DOCTOR_FEE_CHANGED (membership id, beforePaise,
        afterPaise). alsoDoctor false: the other fields are ignored; the row stays (history) with sees_patients false;
        the owner leaves every doctor list at once; visits and appointments already assigned stay assigned; past
        records keep the owner's name; audit PLATFORM_OWNER_DOCTOR_OFF. Saving the same values: 200, nothing written.
        200 with the owner's TeamMember row. Client toast "You now see patients as a doctor." or "You no longer see
        patients as a doctor."; the menu is read again (GET /me).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerDoctorInput' }
            examples:
              on: { value: { alsoDoctor: true, doctor: { specialty: General physician, degree: MBBS, registrationNo: MMC 2011/04/1234, feeRupees: 400 } } }
              off: { value: { alsoDoctor: false } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/TeamMember' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation (alsoDoctor, doctor.specialty, doctor.feeRupees, doctor.degree, doctor.registrationNo)' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: forbidden }
        '409': { $ref: '#/components/responses/Problem', description: 'plan-limit or concurrent-change (retryable)' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /me/doctor/notice-seen:
    post:
      tags: [SAH-89]
      summary: Dismiss the one-time notice "You can now see patients as a doctor"
      x-required-role: OWNER (own membership only)
      description: >-
        SAH-89-6, OQ-89-10 f. Sets the notice as seen for the caller's own OWNER membership. No body. Nothing to set (no
        doctor profile, or already seen): 204, nothing written. Not audited. Any other role 403 forbidden.
      responses:
        '204': { description: Seen }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem', description: forbidden }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /me/preferences:
    patch:
      tags: [SAH-5]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Preferences' } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '400': { $ref: '#/components/responses/Problem' }
