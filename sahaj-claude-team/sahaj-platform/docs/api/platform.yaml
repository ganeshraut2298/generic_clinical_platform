openapi: 3.1.0
info:
  title: Sahaj platform API
  version: 0.1.0
  description: Phase 1 contract, SAH-1 to SAH-7. The tenant always comes from the logged-in user, never from a request. Errors are RFC 9457 application/problem+json.
servers:
  - url: /api/v1/platform
security:
  - bearer: []
tags:
  - { name: SAH-1 }
  - { name: SAH-2 }
  - { name: SAH-3 }
  - { name: SAH-4 }
  - { name: SAH-5 }
  - { name: SAH-6 }
  - { name: SAH-7 }
paths:
  /health:
    get:
      tags: [SAH-1]
      security: []
      responses:
        '200':
          description: The application is up
          content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, examples: [UP] } } } } }
  /public/sales-enquiries:
    post:
      tags: [SAH-2]
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SalesEnquiry' } } }
      responses:
        '201': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/IdResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/otp/request:
    post:
      tags: [SAH-3]
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [mobile, mode], properties: { mobile: { $ref: '#/components/schemas/Mobile' }, mode: { $ref: '#/components/schemas/AuthMode' } } } } }
      responses:
        '202': { description: Code sent. Never contains the code., content: { application/json: { schema: { type: object, required: [resendAfterSeconds], properties: { resendAfterSeconds: { type: integer, examples: [30] } } } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/otp/verify:
    post:
      tags: [SAH-3]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mobile, code, mode]
              properties:
                mobile: { $ref: '#/components/schemas/Mobile' }
                code: { type: string, pattern: '^[0-9]{6}$' }
                mode: { $ref: '#/components/schemas/AuthMode' }
                consent:
                  type: object
                  required: [termsVersion, privacyVersion]
                  properties: { termsVersion: { type: string }, privacyVersion: { type: string } }
      responses:
        '200': { description: Verified. Sets the refresh cookie when a session starts., content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }
  /auth/select-clinic:
    post:
      tags: [SAH-3]
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [selectionToken, tenantId], properties: { selectionToken: { type: string }, tenantId: { type: string, format: uuid } } } } }
      responses:
        '200': { description: Session started, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /auth/refresh:
    post:
      tags: [SAH-3]
      security: []
      description: Uses the HttpOnly refresh cookie and rotates it.
      responses:
        '200': { description: New access token, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      tags: [SAH-3]
      responses:
        '204': { description: Logged out on this device }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/logout-all:
    post:
      tags: [SAH-3]
      responses:
        '204': { description: Logged out on all devices }
        '401': { $ref: '#/components/responses/Problem' }
  /setup:
    get:
      tags: [SAH-4]
      responses:
        '200': { description: Saved progress, content: { application/json: { schema: { $ref: '#/components/schemas/SetupState' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /setup/steps/{step}:
    put:
      tags: [SAH-4]
      parameters:
        - { name: step, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 5 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: '#/components/schemas/SetupClinic' }
                - { $ref: '#/components/schemas/SetupSpecialty' }
                - { $ref: '#/components/schemas/SetupTeam' }
                - { $ref: '#/components/schemas/SetupOpd' }
                - { $ref: '#/components/schemas/SetupLook' }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/SetupState' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /setup/slug-availability:
    get:
      tags: [SAH-4]
      parameters:
        - { name: slug, in: query, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{2,23}$' } }
      responses:
        '200': { description: Result, content: { application/json: { schema: { type: object, required: [available, alternatives], properties: { available: { type: boolean }, alternatives: { type: array, items: { type: string } } } } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /setup/complete:
    post:
      tags: [SAH-4]
      responses:
        '200': { description: Clinic created, content: { application/json: { schema: { type: object, required: [next, brand], properties: { next: { const: APP }, brand: { $ref: '#/components/schemas/Brand' } } } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /setup/overview:
    get:
      tags: [SAH-7]
      responses:
        '200': { description: Progress and last change, content: { application/json: { schema: { $ref: '#/components/schemas/SetupOverview' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /me:
    get:
      tags: [SAH-5]
      responses:
        '200': { description: Current user, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /me/preferences:
    patch:
      tags: [SAH-5]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Preferences' } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /team:
    get:
      tags: [SAH-6]
      responses:
        '200': { description: Team, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TeamMember' } } } } }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [SAH-6]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TeamMemberCreate' } } }
      responses:
        '201': { description: Added, content: { application/json: { schema: { $ref: '#/components/schemas/TeamMember' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /team/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    patch:
      tags: [SAH-6]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TeamMemberUpdate' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/TeamMember' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [SAH-6]
      description: Removes access. The record stays so past entries keep their name.
      responses:
        '204': { description: Access removed }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /team/{id}/deactivate:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [SAH-6]
      responses:
        '200': { description: Switched off, content: { application/json: { schema: { $ref: '#/components/schemas/TeamMember' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /team/{id}/reactivate:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [SAH-6]
      responses:
        '200': { description: Switched on, content: { application/json: { schema: { $ref: '#/components/schemas/TeamMember' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /role-permissions:
    get:
      tags: [SAH-6]
      responses:
        '200': { description: Matrix, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RolePermission' } } } } }
        '403': { $ref: '#/components/responses/Problem' }
    put:
      tags: [SAH-6]
      requestBody:
        required: true
        content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RolePermission' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RolePermission' } } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /clinic/profile:
    get:
      tags: [SAH-7]
      responses:
        '200': { description: Profile, content: { application/json: { schema: { $ref: '#/components/schemas/ClinicProfile' } } } }
    put:
      tags: [SAH-7]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ClinicProfile' } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/ClinicProfile' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /clinic/holidays:
    get:
      tags: [SAH-7]
      responses:
        '200': { description: Holidays, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Holiday' } } } } }
    post:
      tags: [SAH-7]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Holiday' } } }
      responses:
        '201': { description: Added, content: { application/json: { schema: { $ref: '#/components/schemas/Holiday' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /clinic/holidays/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    delete:
      tags: [SAH-7]
      responses:
        '204': { description: Removed }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /specialties:
    get:
      tags: [SAH-7]
      responses:
        '200': { description: Read-only list, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Specialty' } } } } }
  /clinic/specialty:
    put:
      tags: [SAH-7]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } }
      responses:
        '200': { description: Applied, content: { application/json: { schema: { $ref: '#/components/schemas/ClinicProfile' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /audit-events:
    get:
      tags: [SAH-7]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Latest first, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } } } } }
        '403': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Problem:
      description: Error
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, examples: ['https://sahaj.in/problems/plan-limit'] }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        retryAfterSeconds: { type: integer }
        fieldErrors:
          type: array
          items: { type: object, required: [field, message], properties: { field: { type: string }, message: { type: string } } }
    IdResult: { type: object, required: [id], properties: { id: { type: string, format: uuid } } }
    Mobile: { type: string, pattern: '^[6-9][0-9]{9}$' }
    AuthMode: { type: string, enum: [LOGIN, SIGNUP] }
    Brand: { type: string, enum: [blue, teal, green, maroon, custom] }
    Role: { type: string, enum: [OWNER, DOCTOR, VISITING_DOCTOR, NURSE, FRONT_DESK, BILLING, PHARMACIST] }
    SalesEnquiry:
      type: object
      required: [name, mobile, source]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        clinicCity: { type: string, maxLength: 200 }
        mobile: { $ref: '#/components/schemas/Mobile' }
        bestTime: { type: string, enum: [MORNING, AFTERNOON, AFTER_OPD] }
        source: { type: string, enum: [CONTACT_SALES, BOOK_DEMO] }
    AuthResult:
      type: object
      required: [next]
      properties:
        next: { type: string, enum: [SETUP, APP, CHOOSE_CLINIC, NOT_REGISTERED] }
        accessToken: { type: string }
        expiresInSeconds: { type: integer, examples: [900] }
        selectionToken: { type: string }
        clinics:
          type: array
          items: { type: object, required: [tenantId, name], properties: { tenantId: { type: string, format: uuid }, name: { type: string }, area: { type: string } } }
    SetupClinic:
      type: object
      required: [name, city]
      properties:
        name: { type: string, maxLength: 160 }
        address: { type: string }
        city: { type: string }
        pin: { type: string, pattern: '^[0-9]{6}$' }
        phone: { type: string }
        registrationNo: { type: string }
    SetupSpecialty: { type: object, required: [code], properties: { code: { type: string, enum: [gp, dental, paeds, homeo] } } }
    SetupTeam:
      type: object
      required: [doctors, staff]
      properties:
        doctors:
          type: array
          maxItems: 2
          items:
            type: object
            required: [name, specialty, feeRupees]
            properties: { name: { type: string }, specialty: { type: string }, feeRupees: { type: integer, minimum: 0 }, mobile: { $ref: '#/components/schemas/Mobile' } }
        staff:
          type: array
          items:
            type: object
            required: [name, role, mobile]
            properties: { name: { type: string }, role: { $ref: '#/components/schemas/Role' }, mobile: { $ref: '#/components/schemas/Mobile' } }
    SetupOpd:
      type: object
      required: [feeTiming, queue, vitals, followUpDays, followUpFee]
      properties:
        feeTiming: { type: string, enum: [before, after, split] }
        queue: { type: boolean }
        vitals: { type: boolean }
        followUpDays: { type: integer, minimum: 1, maximum: 30 }
        followUpFee: { type: string, enum: [free, half, full] }
    SetupLook:
      type: object
      required: [brand, slug, language]
      properties:
        brand: { $ref: '#/components/schemas/Brand' }
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{2,23}$' }
        language: { type: string, enum: [en, mr, hi] }
    SetupState:
      type: object
      required: [currentStep, answers, limits]
      properties:
        currentStep: { type: integer, minimum: 1, maximum: 5 }
        answers: { type: object }
        limits: { type: object, required: [doctors, users], properties: { doctors: { type: integer }, users: { type: integer } } }
    SetupOverview:
      type: object
      required: [percent, checks]
      properties:
        percent: { type: integer }
        checks:
          type: array
          items: { type: object, required: [key, label, done], properties: { key: { type: string }, label: { type: string }, why: { type: string }, done: { type: boolean }, optional: { type: boolean } } }
        lastChange: { $ref: '#/components/schemas/AuditEvent' }
    Preferences:
      type: object
      properties:
        language: { type: string, enum: [en, mr, hi] }
        theme: { type: string, enum: [light, dark] }
        menuMode: { type: string, enum: [simple, advanced] }
        sidebarCollapsed: { type: boolean }
    Me:
      type: object
      required: [userId, name, role, clinic, menu, preferences]
      properties:
        userId: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        clinic:
          type: object
          required: [name, brand, plan]
          properties:
            name: { type: string }
            area: { type: string }
            brand: { $ref: '#/components/schemas/Brand' }
            brandHex: { type: string }
            plan: { type: string }
            planDaysLeft: { type: integer }
            setupComplete: { type: boolean }
            setupPercent: { type: integer }
        menu: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string } }
        preferences: { $ref: '#/components/schemas/Preferences' }
    TeamMember:
      type: object
      required: [id, name, mobileMasked, role, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        mobileMasked: { type: string, examples: ['••••••7410'] }
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [ACTIVE, INACTIVE, REMOVED] }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        doctor: { $ref: '#/components/schemas/DoctorDetails' }
    DoctorDetails:
      type: object
      properties:
        specialty: { type: string }
        degree: { type: string }
        registrationNo: { type: string }
        feeRupees: { type: integer, minimum: 0 }
    TeamMemberCreate:
      type: object
      required: [name, mobile, role]
      properties:
        name: { type: string, minLength: 1 }
        mobile: { $ref: '#/components/schemas/Mobile' }
        role: { $ref: '#/components/schemas/Role' }
        doctor: { $ref: '#/components/schemas/DoctorDetails' }
    TeamMemberUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        role: { $ref: '#/components/schemas/Role' }
        doctor: { $ref: '#/components/schemas/DoctorDetails' }
    RolePermission:
      type: object
      required: [role, permission, allowed]
      properties:
        role: { $ref: '#/components/schemas/Role' }
        permission: { type: string, enum: [token, vitals, collect, cancel, refund, revenue, export] }
        allowed: { type: boolean }
    ClinicProfile:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 160 }
        nameLocal: { type: string }
        address: { type: string }
        area: { type: string }
        city: { type: string }
        pin: { type: string }
        phone: { type: string }
        whatsapp: { type: string }
        mapsUrl: { type: string, format: uri }
        registrationNo: { type: string }
        slug: { type: string, readOnly: true }
        specialtyCode: { type: string }
        brand: { $ref: '#/components/schemas/Brand' }
        brandHex: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
    Holiday:
      type: object
      required: [date, name, type]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        date: { type: string, format: date }
        name: { type: string }
        type: { type: string, enum: [CLOSED, MORNING_ONLY, EVENING_ONLY] }
    Specialty:
      type: object
      required: [code, name, phase]
      properties:
        code: { type: string }
        name: { type: string }
        features: { type: array, items: { type: string } }
        phase: { type: integer }
    AuditEvent:
      type: object
      required: [id, action, at]
      properties:
        id: { type: string, format: uuid }
        actorName: { type: string }
        action: { type: string }
        entityType: { type: string }
        before: { type: [object, 'null'] }
        after: { type: [object, 'null'] }
        at: { type: string, format: date-time }
