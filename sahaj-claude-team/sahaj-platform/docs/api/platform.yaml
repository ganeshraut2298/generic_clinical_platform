        '413': { $ref: '#/components/responses/PayloadTooLarge' }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Problem:
      description: Error
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    BadRequest:
      description: 'bad-request: a path value is not of its declared type (an {id} that is not a UUID). Spring''s own text is replaced by a fixed sentence (ProblemExceptionHandler); the submitted value is never echoed; no fieldErrors.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            malformedId: { value: { type: 'https://sahaj.in/problems/bad-request', title: Bad Request, status: 400, detail: The request could not be understood. Check it and try again. } }
    PayloadTooLarge:
      description: 'payload-too-large: the request body is over the size limit (RequestBodySizeLimitFilter): 64 KB for a signed-in user (property sahaj.request-body.max-bytes, never below 4 KB; the detail names the configured limit, in KB or, when not a whole number of KB, in bytes), 4 KB on /public/** and for any other request without a signed-in user. The body is not read past the limit and nothing is saved.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            signedIn: { value: { type: 'https://sahaj.in/problems/payload-too-large', title: Request too large, status: 413, detail: The request body must be 64 KB or smaller. } }
            notSignedIn: { value: { type: 'https://sahaj.in/problems/payload-too-large', title: Request too large, status: 413, detail: The request body must be 4 KB or smaller. } }
  schemas:
    PrivacySettings:
      type: object
      required: [consentRequired, promoConsent, recordCopy]
      properties:
        consentRequired: { type: boolean, default: true, description: Ask for consent at the first visit. }
        promoConsent: { type: boolean, default: true, description: Separate yes for promotional messages. }
        recordCopy: { type: boolean, default: true, description: Patients can ask for a copy of their records. }
        hfrId: { type: [string, 'null'], maxLength: 32, description: Health Facility Registry ID. Stored only; no ABDM call is made. }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, description: 'Problem type. Known values include plan-limit, slug-taken, setup-incomplete, last-owner, duplicate-mobile, concurrent-change (retryable), validation, forbidden, not-found, rate-limit, otp-locked, and for the staff PIN (SAH-31, ADR-010 D11) wrong-pin (403), pin-locked (403; the 5th wrong try that causes the first or second lock within 24 hours, or any try while locked), pin-not-set (409; no PIN, by notSetReason, and also the 5th wrong try that causes the third lock within 24 hours, which switches the PIN off: "Your PIN was switched off after too many wrong tries. Set a new one, then try again."), pin-unavailable (503), under https://sahaj.in/problems/. The PIN types are also answered by other modules that check a PIN through platform.api.StaffPinPort (ipd verify). SAH-32 (ADR-011 D7, PROPOSED): the second-nurse check of a high-alert dose (ipd POST /medicine-orders/{id}/doses) checks a colleague''s PIN through StaffPinPort.checkColleague and answers the same types with colleague texts and no names: wrong-pin "That PIN is not right." (no tries-left count, so a guesser is not told when to stop before a lock; the wrong try still counts on the colleague''s PIN; security review S4; the own-PIN answer keeps the count), pin-locked "The second nurse''s PIN is locked after 5 wrong tries. Choose another nurse, or try again at <h:mm AM/PM>.", pin-not-set "The second nurse has not set a PIN yet. Choose another nurse.", rate-limit (also when the caller has 5 failed colleague checks in 15 minutes or 10 in 24 hours), pin-unavailable; a client never reads GET /me/pin after such a pin-not-set. SAH-38 (ADR-014, PROPOSED) adds for the colleague check only: colleague-pin-limit (429; "Too many wrong PIN tries for this nurse. Choose another nurse."; the caller made 5 wrong tries of this colleague''s PIN within a rolling 7 days, durable in the database, cleared by a right PIN of the same pair or a new PIN; the PIN is not compared and nothing is counted; no retryAfterSeconds and no count) and pin-check-failed (503; "We could not check the PIN. Try again."; the PIN store could not be read or written in time: only a timeout, a lost connection or a lock failure; a constraint or permission refusal by the database (23514, 23503, 42501) is a code fault and stays a plain 500 server error, never an answer about the PIN (ADR-014 D5); fail closed, nothing counted, the same answer whether the PIN was right or wrong). Also from SAH-38: the colleague''s own failed-check limit is no longer used by colleague checks (only the caller''s limit, the pair cap and the lockout), and a lock caused by a run with any colleague try answers pin-locked and never switches the PIN off (pin-not-set TOO_MANY_LOCKS comes only from three own-session locks within 24 hours).', examples: ['https://sahaj.in/problems/plan-limit'] }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        retryAfterSeconds: { type: integer }
        fieldErrors:
          type: array
          items: { type: object, required: [field, message], properties: { field: { type: string }, message: { type: string } } }
    IdResult: { type: object, required: [id], properties: { id: { type: string, format: uuid } } }
    Mobile: { type: string, pattern: '^[6-9][0-9]{9}$' }
    AuthMode: { type: string, enum: [LOGIN, SIGNUP] }
    Brand: { type: string, enum: [blue, teal, green, maroon, custom] }
    Role: { type: string, enum: [OWNER, DOCTOR, VISITING_DOCTOR, NURSE, FRONT_DESK, BILLING, PHARMACIST, COUNSELLOR] }
    SalesEnquiry:
      type: object
      required: [name, mobile, source]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        clinicCity: { type: string, maxLength: 200 }
        mobile: { $ref: '#/components/schemas/Mobile' }
        bestTime: { type: string, enum: [MORNING, AFTERNOON, AFTER_OPD] }
        source: { type: string, enum: [CONTACT_SALES, BOOK_DEMO] }
    AuthResult:
      type: object
      required: [next]
      properties:
        next: { type: string, enum: [SETUP, APP, CHOOSE_CLINIC, NOT_REGISTERED] }
        accessToken: { type: string }
        expiresInSeconds: { type: integer, examples: [900] }
        selectionToken: { type: string }
        clinics:
          type: array
          items: { type: object, required: [tenantId, name], properties: { tenantId: { type: string, format: uuid }, name: { type: string }, area: { type: string } } }
    SetupClinic:
      type: object
      required: [name, city]
      properties:
        name: { type: string, maxLength: 160 }
        address: { type: string }
        city: { type: string }
        pin: { type: string, pattern: '^[0-9]{6}$' }
        phone: { type: string }
        registrationNo: { type: string }
    SetupSpecialty: { type: object, required: [code], properties: { code: { type: string, enum: [gp, dental, paeds, homeo] } } }
    SetupTeam:
      type: object
      required: [doctors, staff]
      properties:
        doctors:
          type: array
          maxItems: 2
          items:
            type: object
            required: [name, specialty, feeRupees]
            properties: { name: { type: string }, specialty: { type: string }, feeRupees: { type: integer, minimum: 0 }, mobile: { $ref: '#/components/schemas/Mobile' } }
        staff:
          type: array
          items:
            type: object
            required: [name, role, mobile]
            properties: { name: { type: string }, role: { $ref: '#/components/schemas/Role' }, mobile: { $ref: '#/components/schemas/Mobile' } }
    SetupOpd:
      type: object
      required: [feeTiming, queue, vitals, followUpDays, followUpFee]
      properties:
        feeTiming: { type: string, enum: [before, after, split] }
        queue: { type: boolean }
        vitals: { type: boolean }
        followUpDays: { type: integer, minimum: 1, maximum: 30 }
        followUpFee: { type: string, enum: [free, half, full] }
    SetupLook:
      type: object
      required: [brand, slug, language]
      properties:
        brand: { $ref: '#/components/schemas/Brand' }
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{2,23}$' }
        language: { type: string, enum: [en, mr, hi] }
    SetupState:
      type: object
      required: [currentStep, answers, limits]
      properties:
        currentStep: { type: integer, minimum: 1, maximum: 5 }
        answers: { type: object }
        limits: { type: object, required: [doctors, users], properties: { doctors: { type: integer }, users: { type: integer } } }
    SetupOverview:
      type: object
      required: [percent, checks]
      properties:
        percent: { type: integer }
        checks:
          type: array
          items: { type: object, required: [key, label, done], properties: { key: { type: string }, label: { type: string }, why: { type: string }, done: { type: boolean }, optional: { type: boolean }, section: { type: string, description: 'Clinic setup section for the Fix link: overview, profile, specialty, team, fees, paper.' }, anchor: { type: string, description: 'Panel id inside that section, for scrolling.' } } }
        lastChange: { $ref: '#/components/schemas/AuditEvent' }
    Preferences:
      type: object
      properties:
        language: { type: string, enum: [en, mr, hi] }
        theme: { type: string, enum: [light, dark] }
        menuMode: { type: string, enum: [simple, advanced] }
        sidebarCollapsed: { type: boolean }
    Me:
      type: object
      required: [userId, membershipId, name, role, clinic, menu, preferences]
      properties:
        userId: { type: string, format: uuid }
        membershipId: { type: string, format: uuid, description: The signed-in user's membership id in this clinic. Matches TeamMember.id. }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        clinic:
          type: object
          required: [name, brand, plan]
          properties:
            name: { type: string }
            area: { type: string }
            brand: { $ref: '#/components/schemas/Brand' }
            brandHex: { type: string }
            plan: { type: string }
            planDaysLeft: { type: integer }
            setupComplete: { type: boolean }
            setupPercent: { type: integer }
        menu:
          type: array
          items: { type: string }
          description: >-
            Menu keys in display order, from NavigationPolicy (role, menu mode, clinic modules). Module keys: ipd
            (Beds and admissions) for OWNER, FRONT_DESK, NURSE, DOCTOR when IPD is Trial, On or Read-only (SAH-23),
            and for PHARMACIST under the same condition, placed after today, where the page shows only the Safety
            tab with the Pharmacist check tile and panel (SAH-31, ADR-009 D11; decided by the human, DEC-017 Q2);
            emergency (Emergency, siren icon, /app/emergency) for OWNER, FRONT_DESK, NURSE in the advanced menu
            only, when IPD is Trial or On (not Read-only), placed immediately before ipd, which is right after
            followups when the role has it (SAH-28; mockup default roles; DOCTOR reaches the queue through the
            Emergency tab of Beds and admissions, OQ-28-4); staff for every clinic role when HRA is on, before
            config (SAH-20). The simple menu never has emergency. Items carry no badge counts here: the shell reads
            a badge from the owning module's summary endpoint (emergency from GET /api/v1/ipd/emergency/summary;
            ADR-005), so this response stays cacheable for the session. menuCounts of GET /modules count the same
            keys.
            0.1.1 (ADR-023 D6, H7 and D13.5, SAH-66): secondchecks ("Second checks", route /app/emr/second-checks, the
            chemotherapy orders waiting for the signed-in user's second check) for NURSE, PHARMACIST, DOCTOR and
            VISITING_DOCTOR, and for OWNER only when the owner's membership has doctor details; in both menu modes; no
            module condition. Placed right after queue when the role has it, else at the end of the list before staff
            (applied after ipd and emergency: PHARMACIST gets today, ipd, secondchecks). Examples, advanced menu, IPD
            off, HRA off: DOCTOR today, queue, secondchecks, appointments, patients, followups; NURSE today, queue,
            secondchecks, patients. Its badge, if the shell shows one, is total of GET /api/v1/opd/emr/chemo-checks.
            The opd endpoints check the role themselves; the menu is never the only protection.
        permissions: { type: array, items: { type: string } }
        preferences: { $ref: '#/components/schemas/Preferences' }
    TeamMember:
      type: object
      required: [id, name, mobileMasked, role, status]
      properties:
        id: { type: string, format: uuid, description: The membership id (not the user id). Team calls are keyed on it. The signed-in user's own membership id is returned by GET /me as membershipId. }
        name: { type: string }
        mobileMasked: { type: string, examples: ['••••••7410'] }
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [ACTIVE, INACTIVE, REMOVED] }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        doctor: { $ref: '#/components/schemas/DoctorDetails' }
        pin:
          oneOf:
            - { $ref: '#/components/schemas/TeamMemberPin' }
            - { type: 'null' }
          description: 'SAH-31. Sent for an OWNER caller on every row and for the caller''s own row; otherwise not sent (the key is left out; treat a missing pin like null). Never sent for a non-owner on other people''s rows (GET /team).'
    TeamMemberPin:
      type: object
      description: >-
        SAH-31, ADR-010 D12. Team list (panel Staff, f-staff), OWNER view: state SET the pill "PIN set" (good,
        key icon; mockup); LOCKED the pill "PIN locked" (warn, key icon); NOT_SET the pill "No PIN yet" (muted),
        in place of the mockup's "Send PIN link" button (WhatsApp is not in phase 1). OWNER also gets the ghost
        button "Reset PIN" (key icon) on rows with SET or LOCKED, opening the confirm sheet "Reset PIN · <name>".
        Own row, every role: the button "Set my PIN" (NOT_SET) or "Change my PIN" (SET, LOCKED) opening the Set
        PIN sheet. Never the PIN or the hash. Whenever a pin object is sent, all four keys are present (setAt,
        lockedUntil and colleagueTries7d as null when they do not apply).
      required: [state, setAt, lockedUntil, colleagueTries7d]
      properties:
        state: { $ref: '#/components/schemas/PinState' }
        setAt: { type: [string, 'null'], format: date-time, description: 'When the current PIN was set; null when NOT_SET.' }
        lockedUntil: { type: [string, 'null'], format: date-time, description: 'Set only when LOCKED.' }
        colleagueTries7d:
          type: [integer, 'null']
          minimum: 0
          description: >-
            SAH-38, ADR-014 D9. Always present in a sent pin object. A number for an OWNER caller, on every row
            (the owner's own row included). Null for every other role: such a caller receives a pin object only on
            their own row (other people's rows carry no pin), so null appears only there. The number: wrong tries
            of this member's PIN typed by colleagues in second-nurse checks in the last 7 days (database clock),
            not cleared by a reset or a new PIN. 0 when none or no PIN row. Row text (NEW, T4), only when above 0,
            as a link-style button that opens the sheet of GET /team/{id}/pin/colleague-tries: "N wrong tries by
            colleagues in 7 days" or "1 wrong try by a colleague in 7 days". Next to the existing pills; the "PIN
            locked" pill is unchanged. Never a name here.
    PinState:
      type: string
      enum: [NOT_SET, SET, LOCKED]
      description: 'LOCKED = a PIN is set and locked_until is in the future (5 wrong tries in a row; 15 minutes).'
    PinStatus:
      type: object
      description: >-
        SAH-31, ADR-010. The signed-in person's own PIN status. available false when SAHAJ_PIN_PEPPER is not set
        (every PIN set and check then answers 503 pin-unavailable; the screens say "PIN checks are not available
        right now. Try again later." and disable Save PIN and Verify order).
      required: [available, state, setAt, lockedUntil, triesLeft, notSetReason, mobileMasked]
      properties:
        available: { type: boolean }
        state: { $ref: '#/components/schemas/PinState' }
        setAt: { type: [string, 'null'], format: date-time }
        lockedUntil: { type: [string, 'null'], format: date-time, description: 'Set only when LOCKED; the screen shows it as "11:20 AM" (IST).' }
        triesLeft: { type: [integer, 'null'], minimum: 0, maximum: 5, description: 'Wrong tries left before the lock: 5 minus the wrong tries in a row; 0 when LOCKED; null when NOT_SET.' }
        notSetReason:
          oneOf:
            - { type: string, enum: [RESET_BY_OWNER, TOO_MANY_LOCKS] }
            - { type: 'null' }
          description: 'Why there is no PIN: null when never set (or when a PIN is set); RESET_BY_OWNER after an owner reset or removal of access; TOO_MANY_LOCKS after the third lock within 24 hours (the PIN check that caused it answered 409 pin-not-set, not pin-locked).'
        mobileMasked: { type: string, examples: ['••••••7410'], description: 'Where the code for PUT /me/pin goes; last 4 digits only.' }
    PinSetInput:
      type: object
      required: [code, newPin, confirmPin]
      properties:
        code: { type: [string, 'null'], maxLength: 16, description: 'The 6-digit one-time code from POST /me/pin/code. Exactly 6 ASCII digits, else 400 field code "Enter the 6-digit code.". Never logged or echoed.' }
        newPin: { type: [string, 'null'], maxLength: 16, description: 'Exactly 4 ASCII digits (a string, so leading zeros survive), else "Enter a 4-digit PIN."; refused by the weak-PIN rules of ADR-010 D4 with "This PIN is too easy to guess. Choose another one.". Never logged, audited, stored in clear or echoed.' }
        confirmPin: { type: [string, 'null'], maxLength: 16, description: 'Must equal newPin, else "The two PINs do not match.".' }
    ColleagueTriesNotice:
      type: object
      description: 'SAH-38, ADR-014 D8. Answer of GET /me/pin/colleague-tries: the caller''s own data only, counts and state, never who tried.'
      required: [unseenCount, latestAt, state, lockedUntil, notSetReason]
      properties:
        unseenCount: { type: integer, minimum: 0, description: 'Colleague wrong tries of the caller''s PIN after the last "Got it" (all kept tries before the first). 0 means no banner.' }
        latestAt: { type: [string, 'null'], format: date-time, description: 'Time of the newest try counted in unseenCount (database clock, microseconds kept); null when unseenCount is 0. Send it back as seenThrough. Not shown on screen.' }
        state: { $ref: '#/components/schemas/PinState' }
        lockedUntil: { type: [string, 'null'], format: date-time, description: 'Set only when LOCKED; shown as "Your PIN is locked until 11:05 AM IST.".' }
        notSetReason:
          oneOf:
            - { type: string, enum: [RESET_BY_OWNER, TOO_MANY_LOCKS] }
            - { type: 'null' }
          description: 'As PinStatus.notSetReason. TOO_MANY_LOCKS adds "Your PIN was switched off. Set a new one." and the button "Set my PIN".'
    ColleagueTriesSeenInput:
      type: object
      required: [seenThrough]
      properties:
        seenThrough: { type: string, format: date-time, maxLength: 40, description: 'ColleagueTriesNotice.latestAt as received. Capped at the database clock by the server. 400 validation, field seenThrough "Reload the page and try again." when missing, longer than 40 characters, not a readable date-time, more than one day ahead of the server clock, or earlier than 1 Jan 2020 (00:00 UTC) (security review S38-3).' }
    ColleagueTriesHistory:
      type: object
      description: 'SAH-38, ADR-014 D9. Answer of GET /team/{id}/pin/colleague-tries (OWNER only).'
      required: [membershipId, asOf, wrongTries7d, truncated, entries]
      properties:
        membershipId: { type: string, format: uuid }
        asOf: { type: string, format: date-time, description: 'Database clock; the window is the 7 days before it.' }
        wrongTries7d: { type: integer, minimum: 0, description: 'Equals TeamMember.pin.colleagueTries7d at the same instant.' }
        truncated: { type: boolean, description: 'True when more than 100 entries exist; the newest 100 are returned.' }
        entries: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ColleagueTriesEntry' }, description: 'Latest first.' }
    ColleagueTriesEntry:
      type: object
      required: [kind, at, byMembershipId, byName, count]
      properties:
        kind:
          type: string
          enum: [WRONG_TRIES, LOCKED, RIGHT_AFTER_WRONG]
          description: 'WRONG_TRIES "Wrong PIN tries by <byName>: <count>"; LOCKED "PIN locked after wrong tries by colleagues"; RIGHT_AFTER_WRONG "Right PIN entered by <byName> after wrong tries".'
        at: { type: string, format: date-time, description: 'WRONG_TRIES: the latest try of the group (one colleague, one IST day). Shown as "24 Oct 2026, 11:05 AM IST".' }
        byMembershipId: { type: [string, 'null'], format: uuid, description: 'The colleague who typed; null for LOCKED.' }
        byName: { type: [string, 'null'], description: 'Looked up at answer time, never stored; "Former staff member" only when no name can be found; null for LOCKED. Screen only, never logged.' }
        count: { type: [integer, 'null'], minimum: 1, description: 'WRONG_TRIES only; null otherwise.' }
    PinCodeSent:
      type: object
      required: [resendAfterSeconds, mobileMasked]
      properties:
        resendAfterSeconds: { type: integer, examples: [30] }
        mobileMasked: { type: string, examples: ['••••••7410'] }
    DoctorDetails:
      type: object
      properties:
        specialty: { type: string }
        degree: { type: string }
        registrationNo: { type: string }
        feeRupees: { type: integer, minimum: 0 }
    TeamMemberCreate:
      type: object
      required: [name, mobile, role]
      properties:
        name: { type: string, minLength: 1 }
        mobile: { $ref: '#/components/schemas/Mobile' }
        role: { $ref: '#/components/schemas/Role' }
        doctor: { $ref: '#/components/schemas/DoctorDetails' }
    TeamMemberUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        role: { $ref: '#/components/schemas/Role' }
        doctor: { $ref: '#/components/schemas/DoctorDetails' }
    RolePermission:
      type: object
      required: [role, permission, allowed]
      properties:
        role: { $ref: '#/components/schemas/Role' }
        permission: { type: string, enum: [token, vitals, collect, cancel, refund, revenue, export] }
        allowed: { type: boolean }
    ClinicProfile:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 160 }
        nameLocal: { type: string }
        address: { type: string }
        area: { type: string }
        city: { type: string }
        pin: { type: string }
        phone: { type: string }
        whatsapp: { type: string }
        mapsUrl: { type: string, format: uri }
        registrationNo: { type: string }
        slug: { type: string, readOnly: true }
        specialtyCode: { type: string }
        brand: { $ref: '#/components/schemas/Brand' }
        brandHex: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
    Holiday:
      type: object
      required: [date, name, type]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        date: { type: string, format: date }
        name: { type: string }
        type: { type: string, enum: [CLOSED, MORNING_ONLY, EVENING_ONLY] }
    Specialty:
      type: object
      required: [code, name, phase]
      properties:
        code: { type: string }
        name: { type: string }
        features: { type: array, items: { type: string } }
        phase: { type: integer }
    AuditEvent:
      type: object
      required: [id, action, at]
      properties:
        id: { type: string, format: uuid }
        actorName: { type: string }
        action: { type: string }
        entityType: { type: string }
        before: { type: [object, 'null'] }
        after: { type: [object, 'null'] }
        at: { type: string, format: date-time }
    ModulesView:
      type: object
      required: [plan, ipd, hra, menuCounts, ipdTrialAvailable]
      properties:
        plan: { type: string, enum: [FREE, PRO], description: 'FREE is shown as "Free year".' }
        ipd:
          type: object
          required: [state, requested]
          properties:
            state: { type: string, enum: [off, trial, on, readonly] }
            trialEndsAt: { type: [string, 'null'], format: date-time }
            requested: { type: boolean }
            requestedAt: { type: [string, 'null'], format: date-time }
        ipdTrialAvailable: { type: boolean, description: True when the owner may start the IPD trial (DEC-010 temporary switch is on and IPD is off). }
        hra:
          type: object
          required: [on]
          properties:
            on: { type: boolean }
        menuCounts:
          type: object
          description: Number of menu items the signed-in user's role gets in each menu mode.
          required: [simple, advanced]
          properties:
            simple: { type: integer }
            advanced: { type: integer }
