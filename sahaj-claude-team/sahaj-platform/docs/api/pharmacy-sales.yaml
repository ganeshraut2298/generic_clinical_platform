        reversing register row, and for AVAILABLE and QUARANTINE the credit through IpdChargePort at the price
        charged, never above charged minus already credited (409 credit-above-charge); the port refusing 409
        ipd-bill-closed, nothing saved; not connected (or the issue line itself is still CHARGE_PENDING): the line is
        CREDIT_PENDING. Audit PHARMACY_WARD_RETURN_ACCEPTED (ids, outcome, credit outcome).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WardReturnAcceptInput' }
      responses:
        '200': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/WardReturn' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation (AVAILABLE for an opened item); or bad-request' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SalesForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SalesConflict', description: 'sale-not-allowed, integration-off, changed, credit-above-charge, ipd-bill-closed, client-key-reused' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /stores/{storeId}/ward-returns/{wardReturnId}/not-accepted:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/WardReturnId'
    post:
      tags: [SAH-80-15]
      operationId: pharmacyRefuseWardReturn
      summary: Do not accept a ward return ("Not accepted", reason chip)
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability acceptWardReturn)'
      x-sale-store: true
      x-integrated-only: true
      x-sub-story: SAH-80-15
      x-work-package: WP-M
      description: 'Body version, reasonKey (list approval-reject; architect choice, ADR-030 open point O-7), note. Status NOT_ACCEPTED; nothing moves; the reason is on the row''s history for the ward. Audit PHARMACY_WARD_RETURN_REFUSED.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './pharmacy.yaml#/components/schemas/VersionReasonInput' }
      responses:
        '200': { description: Not accepted, content: { application/json: { schema: { $ref: '#/components/schemas/WardReturn' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation; or bad-request' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SalesForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 'sale-not-allowed, integration-off, changed' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /ipd-charges/waiting:
    get:
      tags: [SAH-80-16]
      operationId: pharmacyChargesWaiting
      summary: Charges and credits waiting to post to IPD running bills ("Waiting to post")
      x-required-role: 'PHARMACY_ACCESS and (OWNER or a PHARMACIST member); else 403 forbidden'
      x-store-access: 'SCOPED (OWNER every store; a pharmacist the stores they are mapped to)'
      x-integrated-only: true
      x-port: 'TP-5 IpdChargePort, TP-6 (patient-wise consumption of SAH-79-16)'
      x-sub-story: SAH-80-16
      x-work-package: WP-M
      description: 'Every CHARGE_PENDING IPD issue line, CREDIT_PENDING ward return line and CHARGE_PENDING patient-wise consumption entry (SAH-79-16), oldest first, with the admission number, product, quantity, amount, source and the last failure reason (NOT_CONNECTED, BILL_CLOSED, ADMISSION_NOT_FOUND). connected tells whether TP-5 is connected. counts by source. 25 a page. Writes nothing.'
      parameters:
        - { name: storeId, in: query, required: false, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/QueueSize'
      responses:
        '200': { description: One page, content: { application/json: { schema: { $ref: '#/components/schemas/ChargesWaitingPage' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation; or bad-request' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: integration-off }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /ipd-charges/post:
    post:
      tags: [SAH-80-16]
      operationId: pharmacyPostWaitingCharges
      summary: Post waiting charges and credits ("Post waiting charges")
      x-required-role: 'PHARMACY_ACCESS and (OWNER or a PHARMACIST member); else 403 forbidden'
      x-store-access: 'SCOPED (as pharmacyChargesWaiting)'
      x-integrated-only: true
      x-port: TP-5 IpdChargePort
      x-sub-story: SAH-80-16
      x-work-package: WP-M
      description: >-
        Body clientKey and storeId (optional). TP-5 not connected: 409 not-connected "The IPD bill is not connected
        yet. Charges stay waiting." Connected: each waiting line in the order it was saved, each in its own short
        transaction, keyed by its source line so it posts exactly once (the port receives the key); a line that
        cannot post stays waiting with its reason; nothing is written off. Answers posted, stillWaiting and the
        reasons. Audit PHARMACY_CHARGES_POSTED (counts).
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [clientKey], properties: { clientKey: { type: string, format: uuid }, storeId: { type: [string, 'null'], format: uuid } } }
      responses:
        '200': { description: Result, content: { application/json: { schema: { $ref: '#/components/schemas/PostChargesResult' } } } }
        '400': { $ref: '#/components/responses/Problem', description: validation }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 'integration-off, not-connected, client-key-reused' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /stores/{storeId}/discharges:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    get:
      tags: [SAH-80-17]
      operationId: pharmacyDischarges
      summary: Admissions whose discharge has started, with pharmacy clearance (information only)
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability dispense; the OWNER may read)'
      x-sale-store: true
      x-integrated-only: true
      x-port: TP-4 IpdOrderSource (discharge started)
      x-sub-story: SAH-80-17
      x-work-package: WP-M
      description: 'Rows "<ward> · Bed <n> · <patient>", discharge time if IPD gives one, clearance PENDING (a ward return of that admission waits, or a discharge supply is open) or CLEARED (with who and when, or automatically when nothing is open), and the supplies saved for that admission today. Port not connected or not reporting discharges: 200 connected false, no rows (the lane is hidden). Nothing in IPD is changed or blocked (DEC-074 OQ-80-33).'
      responses:
        '200': { description: Discharges, content: { application/json: { schema: { $ref: '#/components/schemas/DischargeList' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 'sale-not-allowed, integration-off' }
        '503': { $ref: '#/components/responses/Unreachable', description: 'orders-unreachable or database-busy' }
  /stores/{storeId}/discharges/{admissionId}/clear:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/AdmissionId'
    post:
      tags: [SAH-80-17]
      operationId: pharmacyMarkDischargeCleared
      summary: Mark the pharmacy side cleared ("Mark cleared")
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability dispense: a PHARMACIST member)'
      x-sale-store: true
      x-integrated-only: true
      x-sub-story: SAH-80-17
      x-work-package: WP-M
      description: 'Body clientKey, reasonKey and note (list clearance; required only when returns are still waiting). Pharmacy''s own mark, written to no IPD table: "Cleared by <name>, <time>". Audit PHARMACY_DISCHARGE_CLEARED (admission id, who; no clinical text).'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [clientKey], properties: { clientKey: { type: string, format: uuid }, reasonKey: { type: [string, 'null'], maxLength: 80 }, note: { type: [string, 'null'], maxLength: 300 } } }
      responses:
        '200': { description: Cleared, content: { application/json: { schema: { $ref: '#/components/schemas/DischargeList' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation; or bad-request' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SalesForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 'sale-not-allowed, integration-off, not-connected, client-key-reused' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  # ================================================================ WP-N · Overview, reports, day close (80-20 to 80-22)
  # 80-21 adds no path: the six Sales & compliance report keys run through pharmacyRunReport and pharmacyExportReport
  # of pharmacy.yaml (ReportKey 0.3.0). Columns (ReportColumn): sales-margin: groupBy day | product | user, bills, qty,
  # salesPaise (net of discount and returns), discountPaise, taxPaise, costPaise and marginPercent (OWNER and PHARMACIST
  # only; omitted for others; one decimal; OQ-79-6); sales-returns: creditNoteNo, billNo, date, product, batch, qty,
  # reason, condition, refundMode, amount, approver, finishedBy; gst-sales-register: date, billNo (or creditNoteNo),
  # hsn, gstRate, taxable, cgst, sgst, total, cancelled, with totals per GST rate and per day (no buyer name);
  # h1-register and schedule-x-register: the columns of pharmacyH1Register and pharmacyScheduleXRegister (the H1 CSV
  # carries the patient name and address, OWNER and PHARMACIST only, audited); activity-log: the rows of
  # pharmacyActivityFeed. Access: OWNER all selling stores; PHARMACIST member, APPROVER and current DELEGATE of a
  # selling store for their stores; a CASHIER none (catalogue answers no Sales & compliance group). Filters, 12-month
  # range, paging, 50,000-row cap and CSV rules as SAH-79-18.
  /command-centre:
    get:
      tags: [SAH-80-20]
      operationId: pharmacyCommandCentre
      summary: Pharmacy Command Center cards for today (IST), worked when read
      x-required-role: 'PHARMACY_ACCESS and capability COMMAND_CENTRE; else 403 forbidden'
      x-store-access: 'SCOPED (capability sell or readRegisters; OWNER may omit storeId for "All selling stores")'
      x-sub-story: SAH-80-20
      x-work-package: WP-N
      description: >-
        storeId: the working store (rule 15); the OWNER may omit it for all selling stores. Each card is computed on
        its own; a card that fails answers state ERROR ("Could not load. Try again.") and the others still answer.
        asOf (shown "As of <time> IST"). Cards (DEC-074 OQ-80-4): todaysSales (net payable of bills saved today minus
        sales returns completed today; bill count; average per bill; cancelled bills not counted); grossMargin (OWNER
        and pharmacists only, and only when the unit's landed rates are confirmed (go-live G-13): otherwise absent;
        "On landed cost, not PTR"); nearExpiry90 (value at purchase rate and batch count of AVAILABLE batches expiring
        within 90 days; returnablePaise only when the vendor return policy gives it); reorder (products at or below
        the reorder level, "below reorder level"); rxWaiting (Integrated only: OPD prescriptions and IPD orders
        waiting, null counts with connected false while a port is not connected; indents of this store waiting to
        dispatch or receive); udhar (total due and the part over 60 days; absent when no customer has a credit
        limit); expiryRisk bars Expired, 0–30, 31–60, 61–90 days (batch count and value); livePrescriptions (the four
        oldest waiting items; Integrated only); compliance (H1 register: up to date with bills today or overrides to
        review; Schedule X / NDPS: balanced or to review; drug licence: due in n days or expired). A CASHIER gets
        todaysSales only. No figure that built data cannot give. Writes nothing except the store sweep of ADR-029 P4.
        Blind count (rule 32, 0.3.1): for a blind caller at a store with an open audit, nearExpiry90.valuePaise
        and each expiryRisk bar valuePaise are null when they include an audited product of that store (batch
        counts and the reorder count stay); with storeId omitted (OWNER only) nobody is blind.
      parameters:
        - { name: storeId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Cards, content: { application/json: { schema: { $ref: '#/components/schemas/CommandCentre' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation (storeId missing for a person who is not the OWNER)' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound', description: 'storeId outside the stores the caller can reach' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /stores/{storeId}/day-close/preview:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    get:
      tags: [SAH-80-22]
      operationId: pharmacyDayClosePreview
      summary: The "Close shift" sheet (expected per payment mode for the open period)
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability dayClose)'
      x-sale-store: true
      x-sub-story: SAH-80-22
      x-work-package: WP-N
      description: >-
        membershipId: whose shift (default the caller; another person: OWNER only, else 403 forbidden "Only the owner
        can close for another person."). Period: from the end of that person's last close at this store (or the
        start of today IST) to now. Expected per mode CASH, UPI, CARD = payments of bills saved by that person in the
        period + payments received against udhar − refunds recorded in the period (cancelled-bill refunds and sales
        returns completed by that person); CREDIT_NOTE used and UDHAR given as information. A cancelled bill or a
        refund counts in the period it was recorded. nothingToClose true: "Nothing to close. No bills in this shift."
        Sentence "This is the pharmacy counter only." (NEW, OQ-80-14). periodToken fixes the period for the close.
        Writes nothing.
      parameters:
        - { name: membershipId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Sheet, content: { application/json: { schema: { $ref: '#/components/schemas/DayClosePreview' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation; or bad-request' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: sale-not-allowed }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /stores/{storeId}/day-closes:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    get:
      tags: [SAH-80-22]
      operationId: pharmacyListDayCloses
      summary: Saved shift closes of this store
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability dayClose; a non-owner sees their own)'
      x-sub-story: SAH-80-22
      x-work-package: WP-N
      description: 'Newest first, 25 a page: person, period, expected, counted and difference totals, closed by. Writes nothing.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/QueueSize'
      responses:
        '200': { description: One page, content: { application/json: { schema: { $ref: '#/components/schemas/DayClosePage' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation; or bad-request' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
    post:
      tags: [SAH-80-22]
      operationId: pharmacyCloseShift
      summary: Close the shift ("Close shift"); cannot be changed afterwards
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability dayClose)'
      x-sale-store: true
      x-sub-story: SAH-80-22
      x-work-package: WP-N
      description: >-
        Body clientKey, membershipId (another person: OWNER only), periodToken (from the preview), counted per mode
        CASH, UPI, CARD (whole paise, 0 or more; more than 2 decimals or negative 400), and per mode with a difference
        other than ₹ 0 a reasonKey (list day-close-difference; .other with a note). Under the person-and-store lock the
        expected amounts are worked again for the period; a period already closed 409 already-closed; nothing in the
        period 409 nothing-to-close. Saves who, when, the period, expected, counted and difference (append-only; no
        update). Sales after it start a new period. Answers the print summary. Audit PHARMACY_SHIFT_CLOSED (ids,
        totals, differences). 201.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DayCloseCreate' }
      responses:
        '201': { description: Closed, content: { application/json: { schema: { $ref: '#/components/schemas/DayClose' } } } }
        '200': { description: Replay, content: { application/json: { schema: { $ref: '#/components/schemas/DayClose' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation; or bad-request' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 'sale-not-allowed, already-closed, nothing-to-close, client-key-reused' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /stores/{storeId}/day-closes/{closeId}:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/CloseId'
    get:
      tags: [SAH-80-22]
      operationId: pharmacyGetDayClose
      summary: One shift close (print summary)
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability dayClose; a non-owner only their own)'
      x-sub-story: SAH-80-22
      x-work-package: WP-N
      description: 'The saved sheet. Another person''s close for a non-owner 404. Writes nothing.'
      responses:
        '200': { description: Close, content: { application/json: { schema: { $ref: '#/components/schemas/DayClose' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  # ---- END OF PATHS (later work packages are inserted above this line)
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    StoreId: { $ref: './pharmacy.yaml#/components/parameters/StoreId' }
    ProductId: { $ref: './pharmacy.yaml#/components/parameters/ProductId' }
    RequestId: { $ref: './pharmacy.yaml#/components/parameters/RequestId' }
    PatientId: { name: patientId, in: path, required: true, schema: { type: string, format: uuid }, description: 'A patient.patient id (read through patient.api only).' }
    CustomerId: { name: customerId, in: path, required: true, schema: { type: string, format: uuid } }
    BillId: { name: billId, in: path, required: true, schema: { type: string, format: uuid } }
    HeldBillId: { name: heldBillId, in: path, required: true, schema: { type: string, format: uuid } }
    ReturnId: { name: returnId, in: path, required: true, schema: { type: string, format: uuid }, description: 'Sales return id.' }
    RxId: { name: rxId, in: path, required: true, schema: { type: string, format: uuid }, description: 'The OPD signed record id as given by the TP-2 port (opaque to pharmacy).' }
    RxLineId: { name: rxLineId, in: path, required: true, schema: { type: string, maxLength: 64 }, description: 'The prescription line key as given by the TP-2 port.' }
    AdmissionId: { name: admissionId, in: path, required: true, schema: { type: string, format: uuid }, description: 'An ipd admission id (opaque; read through the TP-4 port only).' }
    OrderId: { name: orderId, in: path, required: true, schema: { type: string, format: uuid }, description: 'An IPD medicine order id (opaque; TP-4).' }
    IssueId: { name: issueId, in: path, required: true, schema: { type: string, format: uuid } }
    WardReturnId: { name: wardReturnId, in: path, required: true, schema: { type: string, format: uuid } }
    RegistrationId: { name: registrationId, in: path, required: true, schema: { type: string, format: uuid } }
    CloseId: { name: closeId, in: path, required: true, schema: { type: string, format: uuid } }
    Page: { name: page, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 1000, default: 0 } }
    QueueSize: { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 25, default: 25 }, description: 'At most 25 rows a page (rule 30).' }
    From: { name: from, in: query, required: false, schema: { type: string, format: date }, description: 'IST date; with to, at most 366 days (400 range-too-long "Choose at most 12 months.").' }
    To: { name: to, in: query, required: false, schema: { type: string, format: date } }
  responses:
    Problem: { $ref: './pharmacy.yaml#/components/responses/Problem' }
    Unauthorized: { $ref: './pharmacy.yaml#/components/responses/Unauthorized' }
    Forbidden: { $ref: './pharmacy.yaml#/components/responses/Forbidden' }
    StoreForbidden: { $ref: './pharmacy.yaml#/components/responses/StoreForbidden' }
    NotFound: { $ref: './pharmacy.yaml#/components/responses/NotFound' }
    Conflict: { $ref: './pharmacy.yaml#/components/responses/Conflict' }
    IntegrationOff: { $ref: './pharmacy.yaml#/components/responses/IntegrationOff' }
    BadRequest: { $ref: './pharmacy.yaml#/components/responses/BadRequest' }
    PayloadTooLarge: { $ref: './pharmacy.yaml#/components/responses/PayloadTooLarge' }
    DatabaseBusy: { $ref: './pharmacy.yaml#/components/responses/DatabaseBusy' }
    SalesForbidden:
      description: 'module-off, forbidden, store-permission-denied, or a sale rule: pharmacist-required, cancel-not-allowed, second-signer-same, second-signer-invalid, self-approval, and the platform PIN outcomes wrong-pin, pin-locked (rule 19).'
      content:
        application/problem+json:
          schema: { $ref: './pharmacy.yaml#/components/schemas/Problem' }
          examples:
            pharmacist: { value: { type: 'https://sahaj.in/problems/pharmacist-required', title: Pharmacist needed, status: 403, detail: A pharmacist must complete this bill. } }
            cancel: { value: { type: 'https://sahaj.in/problems/cancel-not-allowed', title: Not allowed, status: 403, detail: Only the owner can cancel a bill from an earlier day. } }
            sameSigner: { value: { type: 'https://sahaj.in/problems/second-signer-same', title: Second signature, status: 403, detail: The second signature must be a different person. } }
    SalesConflict:
      description: 'A 409 problem of this file; the type is named on the operation. sale-changed carries quote (SalesProblem); customer-phone-exists carries candidates; changed carries current.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/SalesProblem' }
          examples:
            saleChanged: { value: { type: 'https://sahaj.in/problems/sale-changed', title: Bill changed, status: 409, detail: Prices or batches changed. Check the bill and save again., quote: {} } }
            saleNotAllowed: { value: { type: 'https://sahaj.in/problems/sale-not-allowed', title: Sale not allowed, status: 409, detail: Sale is not allowed in this store. } }
            heldLimit: { value: { type: 'https://sahaj.in/problems/held-limit', title: Too many held bills, status: 409, detail: Too many held bills. Finish or discard one. } }
    Unreachable:
      description: 'patients-unreachable: the patient port failed (the sale may continue as a walk-in with Link to patient pending); or database-busy as in pharmacy.yaml.'
      content:
        application/problem+json:
          schema: { $ref: './pharmacy.yaml#/components/schemas/Problem' }
          examples:
            patients: { value: { type: 'https://sahaj.in/problems/patients-unreachable', title: Patient records not reachable, status: 503, detail: Patient records are not reachable. You can continue as a walk-in and link the patient later. } }
  schemas:
    # ---------------------------------------------------------------- shared within this file
    SalesProblem:
      description: 'The pharmacy.yaml Problem plus the members of this file (the Problem schema itself is unchanged).'
      allOf:
        - $ref: './pharmacy.yaml#/components/schemas/Problem'
        - type: object
          properties:
            quote: { $ref: '#/components/schemas/SaleQuote', description: 'sale-changed only: the cart priced now.' }
            customerCandidates:
              type: array
              maxItems: 10
              description: customer-phone-exists only.
              items: { type: object, required: [customerId, name, maskedPhone], properties: { customerId: { type: string, format: uuid }, name: { type: string }, maskedPhone: { type: string } } }
            claimedBy: { $ref: './pharmacy.yaml#/components/schemas/PersonRef', description: 'rx-claimed and changed on a queue item: who has it ("Already being billed by <name>.").' }
    Money: { $ref: './pharmacy.yaml#/components/schemas/Paise' }
    PaymentMode:
      type: string
      enum: [CASH, UPI, CARD, UDHAR, CREDIT_NOTE]
      description: 'Labels Cash, UPI, Card, Udhar (credit), Credit note. Recorded only; no gateway, QR or reference (DEC-074 OQ-80-10).'
    ReasonInput:
      type: object
      additionalProperties: false
      required: [reasonKey]
      properties:
        reasonKey: { type: string, maxLength: 80, description: 'An active reason of the list the field names (rule 21).' }
        note: { type: [string, 'null'], maxLength: 300, description: 'Required (4 to 300) for a key ending in .other. Kept on the record only; never in audit text.' }
    # ---------------------------------------------------------------- WP-I
    StoreBillSeries:
      type: object
      required: [store, usesUnitSeries, prefix, financialYearPart, sequenceLength, restartsEachFinancialYear, example, renderedLength, numbersIssued, locked, version]
      properties:
        store: { $ref: './pharmacy.yaml#/components/schemas/StoreRef' }
        storeActive: { type: boolean }
        usesUnitSeries: { type: boolean, description: 'true: "All stores (unit series)"; the values are the unit BILL row.' }
        prefix: { type: string, pattern: '^[A-Za-z0-9/-]{1,6}$' }
        financialYearPart: { type: boolean }
        sequenceLength: { type: integer, minimum: 4, maximum: 8 }
        restartsEachFinancialYear: { type: boolean }
        example: { type: string, maxLength: 16, examples: [SBN/26-27/000001] }
        renderedLength: { type: integer, maximum: 16 }
        numbersIssued: { type: boolean }
        locked: { type: boolean, description: 'A number was issued in the current financial year (DEC-078 item 4).' }
        version: { type: integer, minimum: 0 }
    StoreBillSeriesInput:
      type: object
      additionalProperties: false
      required: [version, prefix, financialYearPart, sequenceLength, restartsEachFinancialYear]
      properties:
        version: { type: integer, minimum: 0 }
        prefix: { type: string, maxLength: 6 }
        financialYearPart: { type: boolean }
        sequenceLength: { type: integer, minimum: 4, maximum: 8 }
        restartsEachFinancialYear: { type: boolean }
    AllergyInfo:
      type: object
      required: [status, text]
      description: 'Screen only; never logged or audited. Standalone: status NOT_APPLICABLE with the customer allergy note shown "Allergy note (not checked): <text>".'
      properties:
        status: { type: string, enum: [RECORDED, NONE_RECORDED, NOT_CHECKED, NO_PATIENT, NOT_APPLICABLE], description: '"Allergy on EMR: <text>" (red), "No allergy recorded", "Allergy not checked", "No patient selected. Allergy not checked.", Standalone.' }
        text: { type: [string, 'null'], maxLength: 500 }
        classesNotChecked: { const: true, description: 'DEC-074 OQ-80-22: drug classes are not checked in this release; the screen says so next to the result.' }
    SalePatientRow:
      type: object
      required: [patientId, name, age, sex, uhid, maskedMobile]
      properties:
        patientId: { type: string, format: uuid }
        name: { type: string }
        age: { type: integer, minimum: 0 }
        sex: { type: string }
        uhid: { type: [string, 'null'] }
        maskedMobile: { type: [string, 'null'], examples: ['+91 98XXX XX214'] }
    SalePatient:
      allOf:
        - $ref: '#/components/schemas/SalePatientRow'
        - type: object
          required: [abhaLinked, allergy, account]
          properties:
            abhaLinked: { type: [boolean, 'null'], description: 'null: the port gives no such fact; the chip is hidden (OQ-80-28).' }
            allergy: { $ref: '#/components/schemas/AllergyInfo' }
            account: { oneOf: [ { $ref: '#/components/schemas/CreditLine' }, { type: 'null' } ] }
    CreditLine:
      type: object
      required: [customerId, creditLimitPaise, duePaise, creditNoteBalancePaise]
      description: '"Credit limit ₹5,000 · current due ₹0". The Udhar field is shown only when creditLimitPaise is above 0.'
      properties:
        customerId: { type: string, format: uuid }
        creditLimitPaise: { type: [integer, 'null'], format: int64, minimum: 0 }
        duePaise: { type: integer, format: int64, minimum: 0 }
        over60DaysPaise: { type: [integer, 'null'], format: int64, minimum: 0, description: 'Owner and pharmacist only; null for others.' }
        creditNoteBalancePaise: { type: integer, format: int64, minimum: 0 }
    Customer:
      type: object
      required: [id, kind, patientId, name, phone, phoneMasked, allergyNote, status, credit, version]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [WALK_IN, PATIENT], description: 'PATIENT: the pharmacy account of a registered patient (Integrated); name and phone are read through the port, never stored.' }
        patientId: { type: [string, 'null'], format: uuid }
        name: { type: string }
        phone: { type: [string, 'null'], description: 'Unmasked only for OWNER and a PHARMACIST member on a WALK_IN customer; else masked.' }
        phoneMasked: { type: boolean }
        allergyNote: { type: [string, 'null'], maxLength: 200, description: 'Shown with "Not checked by Sahaj. Shown for the pharmacist." (NEW).' }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        credit: { $ref: '#/components/schemas/CreditLine' }
        version: { type: integer, minimum: 0 }
    CustomerPage:
      allOf:
        - $ref: './pharmacy.yaml#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Customer' } }
    CustomerCreate:
      type: object
      additionalProperties: false
      required: [clientKey]
      properties:
        clientKey: { type: string, format: uuid }
        patientId: { type: [string, 'null'], format: uuid, description: 'Set for a patient account; then name, phone and allergyNote must be null.' }
        name: { type: [string, 'null'], maxLength: 80 }
        phone: { type: [string, 'null'], maxLength: 10, description: '10 digits "Enter a 10-digit phone number".' }
        allergyNote: { type: [string, 'null'], maxLength: 200 }
        creditLimitPaise: { type: [integer, 'null'], format: int64, minimum: 0, maximum: 9999999900 }
        confirmSamePhone: { type: boolean, default: false }
    CustomerUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 0 }
        name: { type: [string, 'null'], maxLength: 80 }
        phone: { type: [string, 'null'], maxLength: 10 }
        allergyNote: { type: [string, 'null'], maxLength: 200 }
        creditLimitPaise: { type: [integer, 'null'], format: int64, minimum: 0, maximum: 9999999900 }
        confirmSamePhone: { type: boolean, default: false }
    CustomerAccount:
      allOf:
        - $ref: './pharmacy.yaml#/components/schemas/PageMeta'
        - type: object
          required: [credit, items]
          properties:
            credit: { $ref: '#/components/schemas/CreditLine' }
            items:
              type: array
              items:
                type: object
                required: [entryId, kind, at, storeName, reference, amountPaise, dueAfterPaise, creditNoteBalanceAfterPaise, by]
                properties:
                  entryId: { type: string, format: uuid }
                  kind: { type: string, enum: [CREDIT_BILL, PAYMENT, CANCELLED_BILL, RETURN_TO_UDHAR, CREDIT_NOTE_ISSUED, CREDIT_NOTE_USED] }
                  at: { type: string, format: date-time }
                  storeName: { type: string }
                  reference: { type: [string, 'null'], description: 'Bill or credit note number.' }
                  mode: { oneOf: [ { $ref: '#/components/schemas/PaymentMode' }, { type: 'null' } ] }
                  amountPaise: { type: integer, format: int64 }
                  dueAfterPaise: { type: integer, format: int64, minimum: 0 }
                  creditNoteBalanceAfterPaise: { type: integer, format: int64, minimum: 0 }
                  by: { $ref: './pharmacy.yaml#/components/schemas/PersonRef' }
    CustomerPaymentInput:
      type: object
      additionalProperties: false
      required: [clientKey, amountPaise, mode]
      properties:
        clientKey: { type: string, format: uuid }
        amountPaise: { type: integer, format: int64, minimum: 1, maximum: 9999999900 }
        mode: { type: string, enum: [CASH, UPI, CARD] }
    CustomerPaymentReceipt:
      type: object
      required: [entryId, customerId, customerName, amountPaise, mode, receivedAt, receivedBy, store, dueAfterPaise, printHeader]
      properties:
        entryId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        customerName: { type: string, description: 'For the printed slip only.' }
        amountPaise: { type: integer, format: int64 }
        mode: { type: string, enum: [CASH, UPI, CARD] }
        receivedAt: { type: string, format: date-time }
        receivedBy: { $ref: './pharmacy.yaml#/components/schemas/PersonRef' }
        store: { $ref: './pharmacy.yaml#/components/schemas/StoreRef' }
        dueAfterPaise: { type: integer, format: int64, minimum: 0 }
        printHeader: { $ref: './pharmacy.yaml#/components/schemas/PrintHeader' }
    SaleProductRow:
      type: object
      required: [product, packText, availableQty, outOfStock, matchedOnSalt, mrpFrom]
      properties:
        product: { $ref: './pharmacy.yaml#/components/schemas/ProductRef' }
        salt: { type: string }
        packText: { type: string, examples: ['Strip of 15 · tab'] }
        availableQty: { oneOf: [ { $ref: './pharmacy.yaml#/components/schemas/Qty' }, { type: 'null' } ], description: '0.3.1: null for a blind caller on an audited product (rule 32).' }
        outOfStock: { type: boolean, description: '"Out of stock"; the client cannot add it.' }
        matchedOnSalt: { type: boolean, description: '"Salt search" chip.' }
        mrpFrom: { oneOf: [ { $ref: './pharmacy.yaml#/components/schemas/Rate' }, { type: 'null' } ], description: 'MRP of the batch FEFO would pick first; null when out of stock.' }
    BuyerInput:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [PATIENT, CUSTOMER, WALK_IN, NONE], description: 'PATIENT Integrated only; NONE = an anonymous counter sale (no udhar, no H1 or X line).' }
        patientId: { type: [string, 'null'], format: uuid }
        customerId: { type: [string, 'null'], format: uuid }
        walkInName: { type: [string, 'null'], maxLength: 80, description: 'Required for WALK_IN.' }
        walkInPhone: { type: [string, 'null'], maxLength: 10 }
        saveToCustomers: { type: boolean, default: false, description: '"Save to customers" (also implied by udhar for a walk-in, which needs a customer record first).' }
        linkPending: { type: boolean, default: false, description: 'Integrated, the patient port failed: save as a walk-in with "Link to patient pending".' }
    SubstitutionInput:
      type: object
      additionalProperties: false
      required: [reasonKey, patientAgrees]
      properties:
        reasonKey: { type: string, maxLength: 80, description: 'List substitution.' }
        note: { type: [string, 'null'], maxLength: 300 }
        patientAgrees: { const: true, description: '"Patient agrees"; without it "Choose a reason and confirm the patient agrees."' }
    CartLineInput:
      type: object
      additionalProperties: false
      required: [productId, qty]
      properties:
        productId: { type: string, format: uuid, description: 'The product supplied.' }
        qty: { type: integer, minimum: 1, maximum: 999999, description: 'Whole issue units; the server splits it by FEFO batch.' }
        prescribedProductId: { type: [string, 'null'], format: uuid, description: 'The product asked for or prescribed, when it differs (a substitution, 80-7).' }
        substitution: { oneOf: [ { $ref: '#/components/schemas/SubstitutionInput' }, { type: 'null' } ], description: 'Required when prescribedProductId differs from productId.' }
        allergyOverride: { oneOf: [ { $ref: '#/components/schemas/ReasonInput' }, { type: 'null' } ], description: 'List allergy-override; pharmacist only.' }
        h1Override: { oneOf: [ { $ref: '#/components/schemas/ReasonInput' }, { type: 'null' } ], description: 'List h1-override; pharmacist only; never for Schedule X.' }
        rxLineId: { type: [string, 'null'], maxLength: 64, description: 'The e-Rx line this line supplies (80-12); null = "Not on Rx" when rxId is set.' }
    PrescriptionInput:
      type: object
      additionalProperties: false
      required: [source]
      description: 'The card "Prescription" (80-9, 80-12). Required when the cart has an H1 or X line. DEC-074 OQ-80-17: patientAge and patientAddress are asked only on a bill with an H1 line and stored only with the H1 register row (NEW).'
      properties:
        source: { type: string, enum: [E_RX, TYPED] }
        prescriberName: { type: [string, 'null'], maxLength: 80, description: 'E_RX: read from the prescriber profile, any value sent is ignored.' }
        prescriberRegNo: { type: [string, 'null'], maxLength: 30 }
        prescriptionDate: { type: [string, 'null'], format: date, description: 'Not in the future.' }
        patientName: { type: [string, 'null'], maxLength: 80, description: 'Typed for a walk-in or Standalone; read from the patient when PATIENT.' }
        patientAge: { type: [integer, 'null'], minimum: 0, maximum: 130, description: 'H1 and X lines: required; read from the patient when PATIENT (typed otherwise).' }
        patientAddress: { type: [string, 'null'], maxLength: 200, description: 'H1 lines only (DEC-074, NEW): required "Enter the patient''s address"; stored only on the H1 register row.' }
    CartInput:
      type: object
      additionalProperties: false
      required: [buyer, lines, discountPercent]
      properties:
        buyer: { $ref: '#/components/schemas/BuyerInput' }
        lines: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/CartLineInput' } }
        discountPercent: { oneOf: [ { $ref: './pharmacy.yaml#/components/schemas/Percent' }, { type: 'null' } ], description: 'Bill-level percent of the MRP total (OQ-80-8); null or 0 = none.' }
        discountRequestId: { type: [string, 'null'], format: uuid }
        prescription: { oneOf: [ { $ref: '#/components/schemas/PrescriptionInput' }, { type: 'null' } ] }
        rxId: { type: [string, 'null'], format: uuid, description: 'The OPD prescription billed (80-12; Integrated, TP-2).' }
    TaxByRate:
      type: object
      required: [gstRate, taxablePaise, cgstPaise, sgstPaise, totalPaise]
      description: 'DEC-074 OQ-80-6 (Rule 46): taxable value and tax per GST rate; the sums of the lines of that rate.'
      properties:
        gstRate: { $ref: './pharmacy.yaml#/components/schemas/GstRate' }
        taxablePaise: { type: integer, format: int64 }
        cgstPaise: { type: integer, format: int64 }
        sgstPaise: { type: integer, format: int64 }
        totalPaise: { type: integer, format: int64, description: 'Net of discount, GST included.' }
    BillSummary:
      type: object
      required: [itemCount, unitCount, mrpTotalPaise, discountPercent, discountPaise, taxByRate, cgstPaise, sgstPaise, roundOffPaise, netPayablePaise]
      description: '"Items / units", "MRP total", "Discount", "CGST <x>% (incl.)", "SGST <x>% (incl.)", "Round off", "Net payable" (rule 27). Worked example (mockup 02): 56040 − 2802 = 53238; tax at 12% 5704 (CGST 2852, SGST 2852); round off −38; net 53200.'
      properties:
        itemCount: { type: integer, minimum: 0 }
        unitCount: { type: integer, minimum: 0 }
        mrpTotalPaise: { type: integer, format: int64 }
        discountPercent: { oneOf: [ { $ref: './pharmacy.yaml#/components/schemas/Percent' }, { type: 'null' } ] }
        discountPaise: { type: integer, format: int64, minimum: 0 }
        taxByRate: { type: array, items: { $ref: '#/components/schemas/TaxByRate' } }
        cgstPaise: { type: integer, format: int64 }
        sgstPaise: { type: integer, format: int64 }
        roundOffPaise: { type: integer, format: int64, minimum: -50, maximum: 49 }
        netPayablePaise: { type: integer, format: int64, minimum: 0, description: 'A whole number of rupees (a multiple of 100).' }
    QuoteLine:
      type: object
      required: [lineNo, product, batch, qty, mrp, gstRate, amountPaise, discountSharePaise, netPaise, taxablePaise, taxPaise, expiresInDays, expiredBatchBlocked, schedule, needsPharmacist, needsSecondSigner, allergyBlock, h1PrescriberMissing, substitution, rx]
      properties:
        lineNo: { type: integer, minimum: 1 }
        inputIndex: { type: integer, minimum: 0, description: 'Which CartInput line this batch line came from.' }
        product: { $ref: './pharmacy.yaml#/components/schemas/ProductRef' }
        saltText: { type: string, description: '"salt strength · form · pack" small text.' }
        batch: { oneOf: [ { $ref: './pharmacy.yaml#/components/schemas/BatchRef' }, { type: 'null' } ], description: 'null for a short line with nothing available.' }
        fefo: { const: true }
        qty: { type: integer, minimum: 0 }
        shortBy: { type: [integer, 'null'], minimum: 0, description: '> 0: "Only <n> in stock." 0.3.1: null for a blind caller on an audited product (rule 32).' }
        availableQty: { type: [integer, 'null'], minimum: 0, description: '0.3.1: null for a blind caller on an audited product (rule 32).' }
        mrp: { $ref: './pharmacy.yaml#/components/schemas/Rate' }
        gstRate: { $ref: './pharmacy.yaml#/components/schemas/GstRate' }
        amountPaise: { type: integer, format: int64 }
        discountSharePaise: { type: integer, format: int64, minimum: 0 }
        netPaise: { type: integer, format: int64 }
        taxablePaise: { type: integer, format: int64 }
        taxPaise: { type: integer, format: int64 }
        expiresInDays: { type: [integer, 'null'], minimum: 0, description: 'Set when 90 days or fewer: "Expires in <n> d" (OQ-80-27).' }
        expiredBatchBlocked: { type: [string, 'null'], description: 'The batch number of an earlier expired batch: "<batch> expired · blocked".' }
        schedule: { $ref: './pharmacy.yaml#/components/schemas/Schedule' }
        needsPharmacist: { type: boolean }
        needsSecondSigner: { type: boolean }
        allergyBlock:
          oneOf:
            - type: object
              required: [allergyText, overridden]
              properties:
                allergyText: { type: string, description: '"Blocked: <product> — patient has a <allergy as recorded> allergy recorded in EMR."' }
                overridden: { type: boolean, description: '"Allergy override" chip.' }
            - { type: 'null' }
        h1PrescriberMissing: { type: boolean }
        h1Overridden: { type: boolean }
        substitution:
          oneOf:
            - type: object
              required: [prescribedProduct]
              properties:
                prescribedProduct: { $ref: './pharmacy.yaml#/components/schemas/ProductRef', description: '"Substituted" and "Rx: <product>".' }
            - { type: 'null' }
        rx: { type: string, enum: [NONE, RX, NOT_ON_RX], description: '"Rx" or "Not on Rx" chips (80-12).' }
    SaleQuote:
      type: object
      required: [quoteVersion, lines, summary, discount, allergy, needsPharmacist, needsSecondSigner, needsPrescription, needsH1PatientDetails, canSave, blockers]
      properties:
        quoteVersion: { type: string, maxLength: 64 }
        lines: { type: array, maxItems: 300, items: { $ref: '#/components/schemas/QuoteLine' } }
        summary: { $ref: '#/components/schemas/BillSummary' }
        discount:
          type: object
          required: [approvalNeeded, limitPercent, limitNotSet, lean, approval]
          properties:
            approvalNeeded: { type: boolean, description: '"This discount needs approval."' }
            limitPercent: { oneOf: [ { $ref: './pharmacy.yaml#/components/schemas/Percent' }, { type: 'null' } ] }
            limitNotSet: { type: boolean, description: '"The discount limit is not set. Ask your owner." (every discount above 0% waits for the owner).' }
            lean: { type: boolean, description: 'Level 0 for SALE_DISCOUNT: any percent applies at once.' }
            approval: { oneOf: [ { $ref: '#/components/schemas/DiscountRequest' }, { type: 'null' } ] }
        allergy: { $ref: '#/components/schemas/AllergyInfo' }
        credit: { oneOf: [ { $ref: '#/components/schemas/CreditLine' }, { type: 'null' } ] }
        needsPharmacist: { type: boolean, description: '"A pharmacist must complete this bill." for a cashier or the owner.' }
        needsSecondSigner: { type: boolean }
        needsPrescription: { type: boolean }
        needsH1PatientDetails: { type: boolean }
        canSave: { type: boolean }
        blockers: { type: array, items: { type: string, enum: [NO_LINES, SHORT, ALLERGY, H1_PRESCRIBER, PRESCRIPTION, PHARMACIST, DISCOUNT_APPROVAL, PAYMENTS] } }
    PaymentInput:
      type: object
      additionalProperties: false
      required: [mode, amountPaise]
      properties:
        mode: { $ref: '#/components/schemas/PaymentMode' }
        amountPaise: { type: integer, format: int64, minimum: 1, maximum: 9999999900 }
    BillCreate:
      allOf:
        - $ref: '#/components/schemas/CartInput'
        - type: object
          required: [clientKey, quoteVersion, expectedNetPaise, payments]
          properties:
            clientKey: { type: string, format: uuid }
            quoteVersion: { type: string, maxLength: 64 }
            expectedNetPaise: { type: integer, format: int64, minimum: 0 }
            payments: { type: array, minItems: 1, maxItems: 5, items: { $ref: '#/components/schemas/PaymentInput' }, description: 'Each mode at most once; they add up to the net payable (OQ-80-10d: no part-paid bill).' }
            heldBillId: { type: [string, 'null'], format: uuid }
            secondSigner: { oneOf: [ { $ref: './pharmacy.yaml#/components/schemas/SecondSigner' }, { type: 'null' } ] }
    BillLine:
      type: object
      required: [lineId, lineNo, product, hsn, batch, qty, mrp, gstRate, amountPaise, discountSharePaise, netPaise, taxablePaise, taxPaise, returnedQty, schedule]
      properties:
        lineId: { type: string, format: uuid }
        lineNo: { type: integer, minimum: 1 }
        product: { $ref: './pharmacy.yaml#/components/schemas/ProductRef' }
        hsn: { type: string }
        batch: { $ref: './pharmacy.yaml#/components/schemas/BatchRef' }
        qty: { type: integer, minimum: 1 }
        mrp: { $ref: './pharmacy.yaml#/components/schemas/Rate' }
        gstRate: { $ref: './pharmacy.yaml#/components/schemas/GstRate' }
        amountPaise: { type: integer, format: int64 }
        discountSharePaise: { type: integer, format: int64 }
        netPaise: { type: integer, format: int64 }
        taxablePaise: { type: integer, format: int64 }
        taxPaise: { type: integer, format: int64 }
        returnedQty: { type: integer, minimum: 0 }
        schedule: { $ref: './pharmacy.yaml#/components/schemas/Schedule' }
        prescribedProduct: { oneOf: [ { $ref: './pharmacy.yaml#/components/schemas/ProductRef' }, { type: 'null' } ] }
        substitution: { oneOf: [ { $ref: './pharmacy.yaml#/components/schemas/ReasonRef' }, { type: 'null' } ] }
        patientAgreed: { type: [boolean, 'null'] }
        allergyOverride: { oneOf: [ { $ref: './pharmacy.yaml#/components/schemas/ReasonRef' }, { type: 'null' } ] }
        h1Override: { oneOf: [ { $ref: './pharmacy.yaml#/components/schemas/ReasonRef' }, { type: 'null' } ] }
        decidedBy: { oneOf: [ { $ref: './pharmacy.yaml#/components/schemas/PersonRef' }, { type: 'null' } ], description: 'The pharmacist who substituted or overrode.' }
        secondSigner: { oneOf: [ { $ref: './pharmacy.yaml#/components/schemas/PersonRef' }, { type: 'null' } ] }
        rxLineId: { type: [string, 'null'] }
    Bill:
      type: object
      required: [id, billNo, store, status, savedAt, savedBy, buyer, lines, summary, payments, udharPaise, linkPending, allergyNotChecked, discountApprovedBy, pharmacist, prescription, cancel, refundDuePaise, refundCreditNoteNo, hasReturns, canCancel, cancelLockReason, print, history, version]
      properties:
        id: { type: string, format: uuid }
        billNo: { type: string, maxLength: 16, examples: [SB/26-27/018422] }
        store: { $ref: './pharmacy.yaml#/components/schemas/StoreRef' }
        status: { type: string, enum: [SAVED, CANCELLED] }
        savedAt: { type: string, format: date-time }
        savedBy: { allOf: [ { $ref: './pharmacy.yaml#/components/schemas/PersonRef' }, { type: object, properties: { roleLabel: { type: string } } } ] }
        buyer:
          type: object
          required: [kind, label]
          properties:
            kind: { type: string, enum: [PATIENT, CUSTOMER, WALK_IN, NONE] }
            patientId: { type: [string, 'null'], format: uuid }
            customerId: { type: [string, 'null'], format: uuid }
            label: { type: string, description: 'Name read at the time (patient) or as typed; "Walk-in" when none.' }
            uhid: { type: [string, 'null'] }
            maskedMobile: { type: [string, 'null'] }
        rxId: { type: [string, 'null'], format: uuid }
        lines: { type: array, items: { $ref: '#/components/schemas/BillLine' } }
        summary: { $ref: '#/components/schemas/BillSummary' }
        payments: { type: array, items: { type: object, required: [mode, amountPaise], properties: { mode: { $ref: '#/components/schemas/PaymentMode' }, amountPaise: { type: integer, format: int64 } } } }
        udharPaise: { type: integer, format: int64, minimum: 0, description: '"On credit".' }
        linkPending: { type: boolean, description: '"Link to patient pending".' }
        allergyNotChecked: { type: boolean, description: '"Allergy not checked".' }
        discountApprovedBy: { oneOf: [ { $ref: './pharmacy.yaml#/components/schemas/PersonRef' }, { type: 'null' } ], description: '"Discount approved by <name>".' }
        pharmacist: { oneOf: [ { type: object, required: [name, registrationNo], properties: { name: { type: string }, registrationNo: { type: [string, 'null'] } } }, { type: 'null' } ], description: 'Printed signature line (BR-9, BR-28).' }
        prescription:
          oneOf:
            - type: object
              properties:
                source: { type: string, enum: [E_RX, TYPED] }
                prescriberName: { type: [string, 'null'] }
                prescriberRegNo: { type: [string, 'null'] }
                prescriptionDate: { type: [string, 'null'], format: date }
            - { type: 'null' }
        cancel:
          oneOf:
            - type: object
              required: [at, by, reason, backOnShelf]
              properties:
                at: { type: string, format: date-time }
                by: { $ref: './pharmacy.yaml#/components/schemas/PersonRef' }
                reason: { $ref: './pharmacy.yaml#/components/schemas/ReasonRef' }
                backOnShelf: { type: boolean }
            - { type: 'null' }
        refundDuePaise: { type: integer, format: int64, minimum: 0, description: '"Refund due ₹<amount>" while above 0 on a cancelled bill.' }
        refundCreditNoteNo: { type: [string, 'null'] }
        hasReturns: { type: boolean }
        canCancel: { type: boolean }
        cancelLockReason: { type: [string, 'null'], enum: [NOT_SAME_DAY, NOT_ALLOWED, HAS_RETURNS, ALREADY_CANCELLED, null] }
        print:
          type: object
          required: [header, unitName, drugLicenceNo, gstin, footerNote]
          properties:
            header: { $ref: './pharmacy.yaml#/components/schemas/PrintHeader' }
            unitName: { type: string }
            drugLicenceNo: { type: [string, 'null'] }
            gstin: { type: [string, 'null'] }
            footerNote: { type: [string, 'null'] }
        history: { type: array, items: { $ref: './pharmacy.yaml#/components/schemas/HistoryEvent' } }
        version: { type: integer, minimum: 0 }
    BillPage:
      allOf:
        - $ref: './pharmacy.yaml#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                type: object
                required: [id, billNo, savedAt, buyerLabel, itemCount, netPayablePaise, status, marks]
                properties:
                  id: { type: string, format: uuid }
                  billNo: { type: string }
                  savedAt: { type: string, format: date-time }
                  buyerLabel: { type: string }
                  itemCount: { type: integer }
                  netPayablePaise: { type: integer, format: int64 }
                  status: { type: string, enum: [SAVED, CANCELLED] }
                  marks: { type: array, items: { type: string, enum: [LINK_PENDING, ALLERGY_NOT_CHECKED, REFUND_DUE, ALLERGY_OVERRIDE, H1_OVERRIDE, SUBSTITUTED, HAS_RETURNS] } }
    LinkPatientInput:
      type: object
      additionalProperties: false
      required: [version, patientId]
      properties:
        version: { type: integer, minimum: 0 }
        patientId: { type: string, format: uuid }
    CancelBillInput:
      type: object
      additionalProperties: false
      required: [clientKey, version, reasonKey, backOnShelf]
      properties:
        clientKey: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        reasonKey: { type: string, maxLength: 80, description: 'List cancel-bill.' }
        note: { type: [string, 'null'], maxLength: 300 }
        backOnShelf: { type: boolean, description: '"Are the medicines back on the shelf?" Yes: Available; No: Quarantine.' }
        secondSigner: { oneOf: [ { $ref: './pharmacy.yaml#/components/schemas/SecondSigner' }, { type: 'null' } ] }
    RefundInput:
      type: object
      additionalProperties: false
      required: [clientKey, version, refunds]
      properties:
        clientKey: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        refunds:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [mode, amountPaise]
            properties:
              mode: { type: string, enum: [CASH, UPI, CARD, CREDIT_NOTE, UDHAR], description: 'Among the unit''s refundModes (ORIGINAL_MODE allows the bill''s own modes); UDHAR lowers the due (not below 0).' }
              amountPaise: { type: integer, format: int64, minimum: 1 }
    HoldInput:
      allOf:
        - $ref: '#/components/schemas/CartInput'
        - type: object
          required: [clientKey]
          properties:
            clientKey: { type: string, format: uuid }
            replacesHeldBillId: { type: [string, 'null'], format: uuid }
    HeldBillRow:
      type: object
      required: [id, heldBy, heldAt, itemCount, ageMinutes, buyerLabel, discountState]
      properties:
        id: { type: string, format: uuid }
        heldBy: { $ref: './pharmacy.yaml#/components/schemas/PersonRef' }
        heldAt: { type: string, format: date-time }
        itemCount: { type: integer, minimum: 1 }
        ageMinutes: { type: integer, minimum: 0 }
        buyerLabel: { type: string, description: 'Masked name or "Walk-in".' }
        hasScheduledLine: { type: boolean }
        discountState: { type: string, enum: [NONE, PENDING, APPROVED, REJECTED, VOID] }
    HeldBill:
      allOf:
        - $ref: '#/components/schemas/HeldBillRow'
        - type: object
          required: [status, cart, heldNetPaise, version]
          properties:
            status: { type: string, enum: [OPEN, RESUMED, REPLACED, DISCARDED] }
            cart: { $ref: '#/components/schemas/CartInput' }
            heldNetPaise: { type: integer, format: int64 }
            version: { type: integer, minimum: 0 }
    # ---------------------------------------------------------------- WP-J
    DiscountRequestInput:
      allOf:
        - $ref: '#/components/schemas/CartInput'
        - type: object
          required: [clientKey]
          properties:
            clientKey: { type: string, format: uuid }
            heldBillId: { type: [string, 'null'], format: uuid }
    DiscountRequest:
      type: object
      required: [required, requestId, status, percent, discountPaise, ruleText, waitingFor, escalated, needsAnotherApprover, decidedBy, rejectReason, raisedAt]
      properties:
        required: { type: boolean, description: 'false: level 0, the discount applies at once (no request).' }
        requestId: { type: [string, 'null'], format: uuid }
        status: { type: [string, 'null'], enum: [PENDING, APPROVED, REJECTED, WITHDRAWN, VOID, null], description: 'VOID: computed when the cart sent with it differs from the cart approved.' }
        percent: { $ref: './pharmacy.yaml#/components/schemas/Percent' }
        discountPaise: { type: integer, format: int64, minimum: 0 }
        ruleText: { type: [string, 'null'], examples: ['Discount above 10%'] }
        waitingFor: { type: [string, 'null'], enum: [HOD, OWNER, null] }
        escalated: { type: boolean }
        needsAnotherApprover: { type: boolean }
        selfApprovalOnly: { type: boolean, description: 'One-owner clinic, owner asked: "Ask another approver, or set the discount rule to Lean."' }
        decidedBy: { oneOf: [ { $ref: './pharmacy.yaml#/components/schemas/PersonRef' }, { type: 'null' } ], description: '"Approved by <name>".' }
        rejectReason: { oneOf: [ { $ref: './pharmacy.yaml#/components/schemas/ReasonRef' }, { type: 'null' } ] }
        raisedAt: { type: [string, 'null'], format: date-time }
    SubstituteOptions:
      type: object
      required: [product, sentence, items]
      properties:
        product: { $ref: './pharmacy.yaml#/components/schemas/ProductRef' }
        outOfStock: { type: boolean }
        sentence: { type: string }
        items:
          type: array
          maxItems: 20
          items:
            type: object
            required: [product, mrp, availableQty, marginPerUnit, checks]
            properties:
              product: { $ref: './pharmacy.yaml#/components/schemas/ProductRef' }
              mrp: { $ref: './pharmacy.yaml#/components/schemas/Rate' }
              availableQty: { oneOf: [ { $ref: './pharmacy.yaml#/components/schemas/Qty' }, { type: 'null' } ], description: '0.3.1: null for a blind caller on an audited product (rule 32).' }
              marginPerUnit: { oneOf: [ { $ref: './pharmacy.yaml#/components/schemas/Rate' }, { type: 'null' } ], description: 'MRP minus the landed rate; null when no rate (OQ-79-6).' }
              checks: { type: object, required: [salt, strength, form], properties: { salt: { const: true }, strength: { type: string }, form: { type: string } } }
    H1RegisterRow:
      type: object
      required: [rowId, kind, at, billNo, patientName, patientAge, patientAddress, prescriberName, prescriberRegNo, prescriptionDate, drug, prescribedDrug, batch, qty, rxCopy, pharmacist, override]
      properties:
        rowId: { type: string, format: uuid }
        kind: { type: string, enum: [ENTRY, REVERSAL] }
        reversalOf: { type: [string, 'null'], format: uuid }
        reversalReason: { type: [string, 'null'], enum: [CANCELLED, RETURNED, null] }
        at: { type: string, format: date-time }
        billNo: { type: string, description: 'Or the credit note number on a RETURNED reversal.' }
        patientName: { type: string }
        patientAge: { type: [integer, 'null'] }
        patientAddress: { type: [string, 'null'] }
        prescriberName: { type: [string, 'null'] }
        prescriberRegNo: { type: [string, 'null'] }
        prescriptionDate: { type: [string, 'null'], format: date }
        drug: { $ref: './pharmacy.yaml#/components/schemas/ProductRef' }
        prescribedDrug: { oneOf: [ { $ref: './pharmacy.yaml#/components/schemas/ProductRef' }, { type: 'null' } ] }
        batch: { $ref: './pharmacy.yaml#/components/schemas/BatchRef' }
        qty: { type: integer, description: 'Negative on a reversal.' }
        rxCopy: { type: object, required: [source], properties: { source: { type: string, enum: [E_RX, TYPED] }, rxId: { type: [string, 'null'], format: uuid } } }
        pharmacist: { $ref: './pharmacy.yaml#/components/schemas/PersonRef' }
        override: { oneOf: [ { $ref: './pharmacy.yaml#/components/schemas/ReasonRef' }, { type: 'null' } ] }
    H1RegisterPage:
      allOf:
        - $ref: './pharmacy.yaml#/components/schemas/PageMeta'
        - type: object
          required: [entriesToday, missingPrescriberToday, items]
          properties:
            entriesToday: { type: integer, minimum: 0 }
            missingPrescriberToday: { type: integer, minimum: 0 }
            items: { type: array, items: { $ref: '#/components/schemas/H1RegisterRow' } }
    ScheduleXRegister:
      type: object
      required: [from, to, items, toReview]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        toReview: { type: integer, minimum: 0 }
        items:
          type: array
          items:
            type: object
            required: [product, ndps, opening, received, issued, book, physical, physicalCountedOn, status, difference]
            properties:
              product: { $ref: './pharmacy.yaml#/components/schemas/ProductRef' }
              ndps: { type: boolean }
              opening: { type: integer }
              received: { type: integer, minimum: 0 }
              issued: { type: integer, minimum: 0 }
              book: { type: integer }
              physical: { type: [integer, 'null'] }
              physicalCountedOn: { type: [string, 'null'], format: date }
              status: { type: string, enum: [MATCH, REVIEW, NOT_COUNTED] }
              difference: { type: [integer, 'null'] }
    ScheduleXEntryPage:
      allOf:
        - $ref: './pharmacy.yaml#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                type: object
                required: [rowId, kind, at, documentNo, sourceType, patientName, patientAge, prescriberName, prescriberRegNo, drug, batch, qty, firstSigner, secondSigner]
                properties:
                  rowId: { type: string, format: uuid }
                  kind: { type: string, enum: [ENTRY, REVERSAL] }
                  at: { type: string, format: date-time }
                  documentNo: { type: string }
                  sourceType: { type: string, enum: [BILL, BILL_CANCEL, SALES_RETURN, IPD_ISSUE, WARD_RETURN] }
                  patientName: { type: [string, 'null'] }
                  patientAge: { type: [integer, 'null'] }
                  prescriberName: { type: [string, 'null'] }
                  prescriberRegNo: { type: [string, 'null'] }
                  drug: { $ref: './pharmacy.yaml#/components/schemas/ProductRef' }
                  batch: { $ref: './pharmacy.yaml#/components/schemas/BatchRef' }
                  qty: { type: integer }
                  firstSigner: { $ref: './pharmacy.yaml#/components/schemas/PersonRef' }
                  secondSigner: { $ref: './pharmacy.yaml#/components/schemas/PersonRef' }
    # ---------------------------------------------------------------- WP-K
    OpdQueuePage:
      allOf:
        - $ref: './pharmacy.yaml#/components/schemas/PageMeta'
        - type: object
          required: [connected, refreshAfterSeconds, counts, items]
          properties:
            connected: { type: boolean, description: 'false: the TP-2 port is not connected; the tab shows "Not connected" and no rows.' }
            refreshAfterSeconds: { type: integer, minimum: 10 }
            counts: { type: object, required: [new, picking, ready, needsAction], properties: { new: { type: integer }, picking: { type: integer }, ready: { type: integer }, needsAction: { type: integer } } }
            items:
              type: array
              items:
                type: object
                required: [rxId, token, patientName, doctorName, itemCount, waitingMinutes, status, readyMinutes]
                properties:
                  rxId: { type: string, format: uuid }
                  token: { type: string, examples: [T-041] }
                  patientName: { type: string }
                  doctorName: { type: string }
                  itemCount: { type: integer }
                  waitingMinutes: { type: integer, minimum: 0 }
                  status: { type: string, enum: [NEW, PICKING, PICKED, SUBSTITUTE_OK, NEEDS_ACTION, PART_SUPPLIED] }
                  pickingBy: { oneOf: [ { $ref: './pharmacy.yaml#/components/schemas/PersonRef' }, { type: 'null' } ] }
                  readyMinutes: { type: [integer, 'null'] }
    RxLine:
      type: object
      required: [rxLineId, prescribedText, howToTake, link, rack, batch, qty, stock, picked, schedule, allergyBlock, suppliedQty, remainingQty]
      properties:
        rxLineId: { type: string }
        prescribedText: { type: string, description: 'The medicine as prescribed.' }
        howToTake: { type: string, description: 'Dose pattern, duration, timing and instructions as written (printed on the label).' }
        sourceItemId: { type: [string, 'null'], description: 'opd.medicine id for the link table.' }
        link: { oneOf: [ { $ref: './pharmacy.yaml#/components/schemas/ProductRef' }, { type: 'null' } ], description: 'null: "Not mapped".' }
        rack: { type: [string, 'null'] }
        batch: { oneOf: [ { $ref: './pharmacy.yaml#/components/schemas/BatchRef' }, { type: 'null' } ] }
        qty: { type: [integer, 'null'], minimum: 1 }
        stock: { type: object, required: [state], properties: { state: { type: string, enum: [IN_STOCK, SHORT, OUT_OF_STOCK, UNKNOWN] }, shortBy: { type: [integer, 'null'], description: '0.3.1: also null for a blind caller on an audited product (rule 32).' } } }
        picked: { oneOf: [ { type: object, required: [by, at], properties: { by: { $ref: './pharmacy.yaml#/components/schemas/PersonRef' }, at: { type: string, format: date-time } } }, { type: 'null' } ] }
        schedule: { oneOf: [ { $ref: './pharmacy.yaml#/components/schemas/Schedule' }, { type: 'null' } ] }
        allergyBlock: { type: boolean }
        substituteProposed: { type: boolean, description: '"Substitute OK?" while the patient has not agreed.' }
        suppliedQty: { type: integer, minimum: 0 }
        remainingQty: { type: [integer, 'null'], minimum: 0 }
    OpdPrescription:
      type: object
      required: [rxId, token, status, patient, doctor, prescriber, signedAt, allergy, checksToDo, steps, lines, claimedBy, version]
      properties:
        rxId: { type: string, format: uuid }
        token: { type: string }
        status: { type: string, enum: [NEW, PICKING, PICKED, SUBSTITUTE_OK, NEEDS_ACTION, PART_SUPPLIED, HANDED_OVER, CLOSED] }
        patient: { $ref: '#/components/schemas/SalePatientRow' }
        doctor: { type: string }
        prescriber: { type: object, required: [name, registrationNo], properties: { name: { type: string }, registrationNo: { type: [string, 'null'] } } }
        signedAt: { type: string, format: date-time }
        allergy: { $ref: '#/components/schemas/AllergyInfo' }
        checksToDo: { type: integer, minimum: 0 }
        steps:
          type: array
          items: { type: object, required: [step, done], properties: { step: { type: string, enum: [RECEIVED, CHECKED, PICKED, BILLED] }, done: { type: boolean }, by: { type: [string, 'null'] }, at: { type: [string, 'null'], format: date-time }, detail: { type: [string, 'null'], examples: ['Picked 3 of 4'] } } }
        lines: { type: array, items: { $ref: '#/components/schemas/RxLine' } }
        claimedBy: { oneOf: [ { $ref: './pharmacy.yaml#/components/schemas/PersonRef' }, { type: 'null' } ] }
        bills: { type: array, items: { type: object, properties: { billId: { type: string, format: uuid }, billNo: { type: string } } } }
        labels: { type: array, items: { type: object, properties: { patientName: { type: string }, medicine: { type: string }, howToTake: { type: string }, batchNo: { type: string }, expiryDate: { type: string, format: date }, pharmacyName: { type: string } } } }
        version: { type: integer, minimum: 0 }
    RxLinePickInput:
      type: object
      additionalProperties: false
      required: [version, qty, picked]
      properties:
        version: { type: integer, minimum: 0 }
        qty: { type: [integer, 'null'], minimum: 1, maximum: 999999 }
        picked: { type: boolean }
    RxClaim:
      type: object
      required: [prescription, cart]
      properties:
        prescription: { $ref: '#/components/schemas/OpdPrescription' }
        cart: { $ref: '#/components/schemas/CartInput' }
    ProductLinkInput:
      type: object
      additionalProperties: false
      required: [sourceKind, sourceItemId, productId, version]
      properties:
        sourceKind: { type: string, enum: [OPD_MEDICINE, IPD_DRUG] }
        sourceItemId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        version: { type: integer, minimum: 0, description: '0 for a new link.' }
    ProductLink:
      type: object
      required: [sourceKind, sourceItemId, product, setBy, setAt, version]
      properties:
        sourceKind: { type: string, enum: [OPD_MEDICINE, IPD_DRUG] }
        sourceItemId: { type: string, format: uuid }
        product: { $ref: './pharmacy.yaml#/components/schemas/ProductRef' }
        setBy: { $ref: './pharmacy.yaml#/components/schemas/PersonRef' }
        setAt: { type: string, format: date-time }
        version: { type: integer, minimum: 0 }
    # ---------------------------------------------------------------- WP-L
    WindowState:
      type: object
      required: [state, days]
      properties:
        state: { type: string, enum: [WITHIN, OVER, CANCELLED] }
        days: { type: integer, minimum: 1, maximum: 365 }
        lastDay: { type: string, format: date }
    ReturnableBillRow:
      type: object
      required: [billId, billNo, savedAt, buyerLabel, netPayablePaise, window]
      properties:
        billId: { type: string, format: uuid }
        billNo: { type: string }
        savedAt: { type: string, format: date-time }
        buyerLabel: { type: string }
        netPayablePaise: { type: integer, format: int64 }
        window: { $ref: '#/components/schemas/WindowState' }
    ReturnableBill:
      allOf:
        - $ref: '#/components/schemas/ReturnableBillRow'
        - type: object
          required: [lines, refundModes, limitPaise, namedCustomer, store]
          properties:
            store: { $ref: './pharmacy.yaml#/components/schemas/StoreRef' }
            namedCustomer: { type: boolean }
            limitPaise: { type: [integer, 'null'], format: int64, description: 'The SALES_RETURN rule amount; null when no amount condition applies.' }
            refundModes:
              type: array
              items:
                type: object
                required: [mode, maxPaise]
                properties:
                  mode: { type: string, enum: [CASH, UPI, CARD, CREDIT_NOTE, UDHAR] }
                  maxPaise: { type: [integer, 'null'], format: int64, description: 'For an original mode: what that mode paid less what was refunded to it; UDHAR: the due.' }
                  original: { type: boolean, description: 'Shown "Original mode (<mode>)".' }
            lines:
              type: array
              items:
                type: object
                required: [billLineId, product, batch, soldQty, returnedQty, returnableQty, returnable, refundPerUnitPaise, schedule]
                properties:
                  billLineId: { type: string, format: uuid }
                  product: { $ref: './pharmacy.yaml#/components/schemas/ProductRef' }
                  batch: { $ref: './pharmacy.yaml#/components/schemas/BatchRef' }
                  soldQty: { type: integer, minimum: 1 }
                  returnedQty: { type: integer, minimum: 0 }
                  returnableQty: { type: integer, minimum: 0 }
                  returnable: { type: boolean, description: 'false: "Not returnable".' }
                  refundPerUnitPaise: { type: integer, format: int64, description: 'Indicative; the server works the refund of a quantity as in ADR-030 S5.' }
                  schedule: { $ref: './pharmacy.yaml#/components/schemas/Schedule' }
    SalesReturnStatus:
      type: string
      enum: [WAITING_PHARMACIST, WAITING_APPROVAL, APPROVED, COMPLETED, REJECTED]
      description: 'Waiting for the pharmacist, Waiting for approval, Approved, Completed, Rejected.'
    ReturnRefundInput:
      type: object
      additionalProperties: false
      required: [mode, amountPaise]
      properties:
        mode: { type: string, enum: [CASH, UPI, CARD, CREDIT_NOTE, UDHAR] }
        amountPaise: { type: integer, format: int64, minimum: 1, maximum: 9999999900 }
    SalesReturnCreate:
      type: object
      additionalProperties: false
      required: [clientKey, billId, lines, reasonKey, refunds]
      properties:
        clientKey: { type: string, format: uuid }
        billId: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [billLineId, qty, conditionKey]
            properties:
              billLineId: { type: string, format: uuid }
              qty: { type: integer, minimum: 1, maximum: 999999 }
              conditionKey: { type: string, maxLength: 80, description: 'List return-condition: .sealed "Yes"; .opened and .damaged "Pharmacist decides".' }
        reasonKey: { type: string, maxLength: 80, description: 'List sales-return.' }
        note: { type: [string, 'null'], maxLength: 300 }
        refunds: { type: array, minItems: 1, maxItems: 5, items: { $ref: '#/components/schemas/ReturnRefundInput' } }
        secondSigner: { oneOf: [ { $ref: './pharmacy.yaml#/components/schemas/SecondSigner' }, { type: 'null' } ] }
    AcceptSalesReturnInput:
      type: object
      additionalProperties: false
      required: [clientKey, version, decisions, refunds]
      properties:
        clientKey: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        decisions:
          type: array
          maxItems: 100
          items: { type: object, additionalProperties: false, required: [returnLineId, decision], properties: { returnLineId: { type: string, format: uuid }, decision: { type: string, enum: [ACCEPT, ACCEPT_QUARANTINE, REFUSE] } } }
        refunds: { type: array, minItems: 0, maxItems: 5, items: { $ref: '#/components/schemas/ReturnRefundInput' } }
        secondSigner: { oneOf: [ { $ref: './pharmacy.yaml#/components/schemas/SecondSigner' }, { type: 'null' } ] }
    SalesReturn:
      type: object
      required: [id, status, creditNoteNo, bill, store, lines, reason, refunds, refundTotalPaise, startedBy, startedAt, completedBy, completedAt, approval, canAccept, canFinish, history, version]
      properties:
        id: { type: string, format: uuid }
