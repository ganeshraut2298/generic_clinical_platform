        (SAH-78-10), buyer, bill number and date, per line HSN, batch, expiry, MRP, GST % and amount, taxByRate,
        totals, round off, payments ("On credit" for udhar), the pharmacist's name and registration number when a
        pharmacist saved it (from the pharmacist registration, 80-19), the substitution and override marks. canCancel
