  # ================================================================ WP-J · Sale checks and registers (80-6 to 80-10)
  /stores/{storeId}/sale/discount-requests:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    post:
      tags: [SAH-80-6]
      operationId: pharmacyRequestDiscountApproval
      summary: Send a discount above the limit for approval ("Send for approval")
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability sell)'
      x-sale-store: true
      x-sub-story: SAH-80-6
      x-work-package: WP-J
      description: >-
        Any seller may ask (DEC-074 OQ-80-8). Body: clientKey and the cart (CartInput with discountPercent above 0).
        The server prices the cart (rule 27) and submits a SALE_DISCOUNT request to the approval engine (ADR-029 P6;
        subject SALE_DISCOUNT, rule store = this store, the percent compared by ABOVE_PERCENT, amount = the discount
        in paise). Level 0 (Lean, or the percent within the limit): no request; answers required false and the
        seller saves at once. Otherwise status PENDING ("Waiting for approval", the approver's role, age); the
        request keeps a digest of the cart (product, quantity per line, percent) so that a changed cart or a higher
        percent makes it VOID (80-6). It is listed in the inbox under the chip Sales with ruleText "Discount above
        <limit>%" (the limit read from the rule version) and the APPROVE, REJECT and REVIEW actions; decisions use
        pharmacyDecideApproval (pharmacy.yaml; rejection reason list approval-reject, .other with a note). The raiser
        never sees it as an approver (403 self-approval on a direct decision; "Needs another approver" as OQ-79-28);
        in a one-owner clinic whose owner asks, decideLockReason SELF_APPROVAL and the seller sees "Ask another
        approver, or set the discount rule to Lean." A new request for the same seller and store withdraws that
        seller's earlier PENDING discount request of the same held bill or cart. Audit
        PHARMACY_DISCOUNT_REQUESTED (ids, percent, amount). 201.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiscountRequestInput' }
      responses:
        '201': { description: 'Sent, or not needed (level 0)', content: { application/json: { schema: { $ref: '#/components/schemas/DiscountRequest' } } } }
        '200': { description: Replay, content: { application/json: { schema: { $ref: '#/components/schemas/DiscountRequest' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation (discountPercent missing, below 0 or above 100); or bad-request' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 'sale-not-allowed, client-key-reused' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /stores/{storeId}/sale/discount-requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [SAH-80-6]
      operationId: pharmacyGetDiscountRequest
      summary: The seller's view of a discount request ("Waiting for approval", "Approved by <name>", the reason)
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability sell)'
      x-sale-store: true
      x-sub-story: SAH-80-6
      x-work-package: WP-J
      description: 'Any seller of the store may read it (a held cart may be resumed by another person). Status PENDING, APPROVED, REJECTED (with the reason), WITHDRAWN; escalated and needsAnotherApprover as computed now (no timer). Writes nothing.'
      responses:
        '200': { description: Request, content: { application/json: { schema: { $ref: '#/components/schemas/DiscountRequest' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: sale-not-allowed }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /stores/{storeId}/sale/discount-requests/{requestId}/withdraw:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [SAH-80-6]
      operationId: pharmacyWithdrawDiscountRequest
      summary: Withdraw a pending discount request (the seller lowered the discount or cleared the cart)
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability sell)'
      x-sale-store: true
      x-sub-story: SAH-80-6
      x-work-package: WP-J
      description: 'No body. PENDING becomes WITHDRAWN (ADR-029 P6; no decision row) and leaves the inbox. Already decided or withdrawn: 200 with the current state, nothing written. Audit PHARMACY_DISCOUNT_WITHDRAWN (ids).'
      responses:
        '200': { description: Withdrawn, content: { application/json: { schema: { $ref: '#/components/schemas/DiscountRequest' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: sale-not-allowed }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
