        '200': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/SalesReturn' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation, payment-mismatch; or bad-request' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SalesForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SalesConflict', description: 'sale-not-allowed, return-state, changed, client-key-reused' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
