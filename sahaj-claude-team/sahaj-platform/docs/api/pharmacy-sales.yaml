          application/json:
            schema: { $ref: './pharmacy.yaml#/components/schemas/VersionReasonInput' }
      responses:
        '200': { description: Closed, content: { application/json: { schema: { $ref: '#/components/schemas/OpdPrescription' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation; or bad-request' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 'sale-not-allowed, integration-off, changed' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /stores/{storeId}/product-links:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    put:
      tags: [SAH-80-11, SAH-80-13]
      operationId: pharmacySetProductLink
      summary: Map an OPD medicine or an IPD drug to a pharmacy product ("Not mapped" → "Choose product")
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability dispense: a PHARMACIST member)'
      x-integrated-only: true
      x-sub-story: 'SAH-80-11, SAH-80-13'
      x-work-package: WP-K
      description: >-
        BR-25, DEC-074 OQ-80-34: a pharmacy-owned link (opaque ids, no foreign key) from sourceKind OPD_MEDICINE or
        IPD_DRUG and sourceItemId to an ACTIVE product of the unit; saved for the unit (every store uses it); a later
        PUT changes it (the old link is kept in history). A suggestion by name is not offered (architect choice:
