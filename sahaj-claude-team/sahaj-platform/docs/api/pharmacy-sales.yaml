        UPI: { type: integer, format: int64 }
        CARD: { type: integer, format: int64 }
    DayClosePreview:
      type: object
      required: [store, person, periodFrom, periodTo, periodToken, expected, creditNoteUsedPaise, udharGivenPaise, nothingToClose, sentence]
      properties:
        store: { $ref: './pharmacy.yaml#/components/schemas/StoreRef' }
        person: { $ref: './pharmacy.yaml#/components/schemas/PersonRef' }
        periodFrom: { type: string, format: date-time }
        periodTo: { type: string, format: date-time }
        periodToken: { type: string, maxLength: 128 }
        expected: { $ref: '#/components/schemas/ModeAmounts' }
        creditNoteUsedPaise: { type: integer, format: int64 }
        udharGivenPaise: { type: integer, format: int64 }
        nothingToClose: { type: boolean }
        sentence: { type: string }
    DayCloseCreate:
      type: object
      additionalProperties: false
      required: [clientKey, membershipId, periodToken, counted]
      properties:
        clientKey: { type: string, format: uuid }
        membershipId: { type: string, format: uuid }
        periodToken: { type: string, maxLength: 128 }
        counted:
          type: object
          additionalProperties: false
          required: [CASH, UPI, CARD]
          properties:
            CASH: { type: integer, format: int64, minimum: 0, maximum: 9999999900 }
            UPI: { type: integer, format: int64, minimum: 0, maximum: 9999999900 }
            CARD: { type: integer, format: int64, minimum: 0, maximum: 9999999900 }
        differenceReasons:
          type: array
          maxItems: 3
          items: { type: object, additionalProperties: false, required: [mode, reasonKey], properties: { mode: { type: string, enum: [CASH, UPI, CARD] }, reasonKey: { type: string, maxLength: 80 }, note: { type: [string, 'null'], maxLength: 300 } } }
    DayClose:
      type: object
      required: [id, store, person, closedBy, closedAt, periodFrom, periodTo, expected, counted, difference, reasons]
      properties:
        id: { type: string, format: uuid }
        store: { $ref: './pharmacy.yaml#/components/schemas/StoreRef' }
        person: { $ref: './pharmacy.yaml#/components/schemas/PersonRef' }
        closedBy: { $ref: './pharmacy.yaml#/components/schemas/PersonRef' }
        closedAt: { type: string, format: date-time }
        periodFrom: { type: string, format: date-time }
        periodTo: { type: string, format: date-time }
        expected: { $ref: '#/components/schemas/ModeAmounts' }
        counted: { $ref: '#/components/schemas/ModeAmounts' }
        difference: { $ref: '#/components/schemas/ModeAmounts' }
        creditNoteUsedPaise: { type: integer, format: int64 }
        udharGivenPaise: { type: integer, format: int64 }
        reasons: { type: array, items: { type: object, properties: { mode: { type: string }, reason: { $ref: './pharmacy.yaml#/components/schemas/ReasonRef' } } } }
    DayClosePage:
      allOf:
        - $ref: './pharmacy.yaml#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/DayClose' } }
    # ---- END OF SCHEMAS
