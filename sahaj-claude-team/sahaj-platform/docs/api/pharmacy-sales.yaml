  # ================================================================ WP-K · OPD dispensing (80-11, 80-12) · TP-2 port, no-op until approved
  /stores/{storeId}/opd-queue:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    get:
      tags: [SAH-80-11]
      operationId: pharmacyOpdQueue
      summary: Outpatient (OPD) prescriptions waiting at the pharmacy
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability sell)'
      x-sale-store: true
      x-integrated-only: true
      x-port: TP-2 OpdPrescriptionSource
      x-sub-story: SAH-80-11
      x-work-package: WP-K
      description: >-
        Pulled through the pharmacy-owned port OpdPrescriptionSource at read time (no event, no job; ADR-030 S12).
        While the port is the no-op: 200 with connected false, counts 0, items [] (the tab shows "Not connected";
        DEC-074). Connected: signed records of this clinic with a prescription section for today (IST), not yet
        supplied in full or closed, oldest first, 25 a page. The read creates the pharmacy's own dispense row for a
        record seen for the first time and gives it the next token of the day ("T-001", per store per IST day,
        OQ-80-24c); this is the only write a read does (as the P4 sweep). Row: token, patient name, doctor, item
        count, waitingMinutes, status NEW, PICKING (with who), PICKED, SUBSTITUTE_OK ("Substitute OK?"),
        NEEDS_ACTION, PART_SUPPLIED; readyMinutes ("ready <n> min ago"). counts per chip New, Picking, Ready, Needs
        action. q: a token or a UHID (a keyboard-style scanner). refreshAfterSeconds 30 (the client refreshes on its
        own and has "Refresh"). The port failing: 503 prescriptions-unreachable "Prescriptions could not be loaded.
        Try again." (nothing stale is shown). Names on screen only, never logged.
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 40 } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [NEW, PICKING, PICKED, NEEDS_ACTION, PART_SUPPLIED] } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/QueueSize'
      responses:
        '200': { description: Queue, content: { application/json: { schema: { $ref: '#/components/schemas/OpdQueuePage' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation; or bad-request' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 'sale-not-allowed, integration-off' }
        '503': { $ref: '#/components/responses/Unreachable', description: 'prescriptions-unreachable or database-busy' }
