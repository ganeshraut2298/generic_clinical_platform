openapi: 3.1.0
info:
  title: Sahaj Pharmacy & Inventory API, Phase 3 (Pharmacy sales and dispensing)
  version: 0.3.1
  description: >-
    Changelog. 0.3.1 (19 Nov 2026, touch-up, programme DEC-061; DEC-080 L12, DEC-081; the tech lead's decision 5 of
    19 Nov 07:55). Additive or wording only. The blind-count rule 24 of pharmacy.yaml 0.3.2 now applies to the stock
    fields of this file (new general rule 32): the quantity fields concerned become nullable
    (SaleProductRow.availableQty, QuoteLine.shortBy and availableQty, SubstituteOptions items[].availableQty, the
    CommandCentre nearExpiry90.valuePaise and expiryRisk bars[].valuePaise; RxLine.stock.shortBy and
    IpdOrderLine.shortBy were already nullable), and pharmacySaleProductSearch, pharmacyQuoteSale,
    pharmacySubstituteOptions, pharmacyGetOpdPrescription, pharmacyIpdOrderSet and pharmacyCommandCentre name the
    rule. Nothing else changes.

    0.3.0 (18 Nov 2026, SAH-80 Pharmacy & Inventory Phase 3: Pharmacy; sub-stories SAH-80-1 to SAH-80-22,
    work packages WP-I to WP-N; WP-O (SAH-80-23, TP-8) is not built and has no operation; design ADR-030 (proposed);
    decisions DEC-074 (all 42 SAH-80 open questions) and DEC-072 Q2 (IPD, OPD and billing touch points are
    pharmacy-owned ports with no-op implementations). Mockup: P&I files 01 to 05, 15 and 17 in
    docs/handoffs/PHI-input/screens/.

    Why a sibling file (ADR-030 S1). docs/api/pharmacy.yaml is about 6,800 lines after 0.2.1; adding about 70
    operations would take it past 10,000 and every edit would risk the SAH-78 and SAH-79 text that java and angular
    build against. This file is the same API: the same module, the same base path /api/v1/pharmacy, the same general
    rules 1 to 23 of pharmacy.yaml (they apply here unchanged), and the same components, referenced as
    ./pharmacy.yaml#/components/... (no component is copied). The SAH-78 touch-ups that change existing components
    (StoreRole CASHIER, StoreAccess sale capabilities, context capabilities, DocType, ListKeyValue, UnitSettings, the
    Integration-mode guard, ndps on own products, LedgerTransaction, inbox values, ReportKey) are in pharmacy.yaml
    0.3.0 itself. Contract version numbers move together: both files are 0.3.0.

    Phase 3 general rules (in addition to rules 1 to 23 of pharmacy.yaml).
    (24) Sale store. Every operation marked x-sale-store true runs on a store with saleAllowed true; otherwise 409
    sale-not-allowed "Sale is not allowed in this store." after the store guard (rule 4) and before body checks.
    (25) Capabilities named in x-store-access are the StoreAccess fields of pharmacy.yaml 0.3.0 (sell,
    sellScheduled, substitute, overrideBlock, cancelBill, salesReturn, acceptSalesReturn, dispense,
    recordWardReturn, acceptWardReturn, readRegisters, dayClose), derived on every request (ADR-030 S2).
    Pharmacist-only actions answer 403 pharmacist-required with the sentence the operation names; they are never
    available to OWNER or a CASHIER (DEC-074 OQ-80-20, OQ-80-37).
    (26) Modes and ports (ADR-030 S12, DEC-072 Q2). An operation marked x-integrated-only answers 409
    integration-off in Standalone. Each touch point is a pharmacy-owned port whose default implementation is a
    no-op ("not connected"). A queue read whose port is not connected answers 200 with connected false and no
    rows, so the tab shows "Not connected" (DEC-074); a write that needs a port that is not connected either saves
    the pharmacy side with a pending mark (Charge pending, Credit pending, Link to patient pending) or answers 409
    not-connected, as the operation says. Standalone mode needs no port at all.
    (27) Money (ADR-030 S4, DEC-074 OQ-80-6). The selling price is the batch MRP per issue unit, GST included. A line
    amount is quantity x MRP, rounded half up to the paisa. A bill discount is a percent of the MRP total, spread
    over the lines in proportion; each line's taxable value is its net amount x 100 / (100 + GST %), rounded half
    up, and its tax is the difference; CGST is half of the tax rounded half up and SGST the rest. The bill shows
    the taxable value and the tax per GST rate (taxByRate). The net payable is rounded to the nearest rupee and
    the difference is the Round off line. No IGST. All amounts are integer paise.
    (28) Bill and credit-note numbers (ADR-030 S3). A number is taken in the transaction that saves the bill or
    completes the return, from the store's own BILL series when it has one, else the unit's BILL series; credit
    notes from CREDIT_NOTE; IPD issue slips from IPD_ISSUE_SLIP. A held bill, a quote, a waiting return and a
    failed save have no number; saved numbers have no gaps; a cancelled bill keeps its number.
    (29) Patient data (BR-34, DEC-074 OQ-80-21). A patient or customer name, a mobile number, an allergy text, an
    address and prescription details appear only in the responses that say so, never in the ledger, the audit
    text or an application log. Mobile numbers are masked ("+91 98XXX XX214") except where an operation says
    otherwise. A read that shows a registered patient writes a record-access entry through
    patient.api.PatientAccessPort; a register read writes PHARMACY_REGISTER_VIEWED (ids, filters, row count).
    (30) Limits (DEC-074 OQ-80-40): at most 100 lines per bill (400 validation lines "A bill can have at most 100
    items."), 20 held bills per store (409 held-limit), 100 lines per IPD issue, 25 rows per queue page, register
    and report ranges at most 12 months (400 range-too-long), export cap 50,000 rows (409 export-too-large).
    (31) Activity (DEC-074 OQ-80-35). Every sale write also appends a pharmacy.document_event row (ADR-029 P9); the
    audit log card and the activity-log report read those rows (no platform read method).
    (32) Blind count (0.3.1; pharmacy.yaml rule 24, DEC-080 L12, BR-30). While the store has an open stock audit, a
    caller who is blind there (StoreAccess count true and reviewCount false: a pharmacist, cashier or store user
    who is not the store's HOD or current delegate; never the OWNER) gets null for every stock quantity of an
    audited product in that store, and for every value or total worked from it, on every read of this file
    (availableQty, shortBy, a value of stock); rows, chips and states (outOfStock, IN_STOCK, SHORT, OUT_OF_STOCK)
    and the quantities of the caller's own cart, bill, issue or return stay, and the problems insufficient-stock
    and changed follow rule 24.
    Problem types added by this file: pharmacist-required, cancel-not-allowed, second-signer-same (403);
    sale-not-allowed, sale-changed, held-limit, discount-approval-needed, discount-approval-void, has-returns,
    already-cancelled, not-cancelled, refund-already-recorded, customer-phone-exists, customer-inactive,
    link-already-set, not-connected, not-mapped, rx-claimed, order-changed, not-issued, return-window-not-set,
    return-window-over, return-state, credit-above-charge, ipd-bill-closed, already-closed, nothing-to-close,
    already-registered, series-locked (reused from 0.2.1), prefix-in-use (reused) (409); allergy-blocked,
    h1-prescriber-missing, prescription-required, credit-limit-exceeded, payment-mismatch (400, field errors);
    patients-unreachable, prescriptions-unreachable, orders-unreachable (503). Every other code is the
    pharmacy.yaml one.
    Operations by work package: WP-I 23, WP-J 9, WP-K 6, WP-L 12, WP-M 15, WP-N 5 (70). WP-O (SAH-80-23, "Add
    pharmacy bill to the OPD bill", TP-8) is not built (DEC-074 OQ-80-16, OQ-80-41): no operation, no setting.
servers:
  - url: /api/v1/pharmacy
security:
  - bearer: []
tags:
  - { name: SAH-80-1, description: 'WP-I · Selling setup: Cashier role, bill series per store, unit sale fields, mode guard' }
  - { name: SAH-80-2, description: 'WP-I · Patient or customer for a bill (mockup 02 card "Patient and prescription")' }
  - { name: SAH-80-3, description: 'WP-I · POS billing (mockup 02)' }
  - { name: SAH-80-4, description: 'WP-I · Udhar and customer account' }
  - { name: SAH-80-5, description: 'WP-I · Hold and cancel' }
  - { name: SAH-80-6, description: 'WP-J · Discount approval' }
  - { name: SAH-80-7, description: 'WP-J · Exact substitute' }
  - { name: SAH-80-8, description: 'WP-J · Allergy block (in the quote and the bill)' }
  - { name: SAH-80-9, description: 'WP-J · Schedule H1 register' }
  - { name: SAH-80-10, description: 'WP-J · Schedule X / NDPS balance register' }
  - { name: SAH-80-11, description: 'WP-K · OPD prescription queue (TP-2 port)' }
  - { name: SAH-80-12, description: 'WP-K · Bill an e-Rx or a typed Rx, part supply' }
  - { name: SAH-80-13, description: 'WP-M · IPD order queue (TP-4 port)' }
  - { name: SAH-80-14, description: 'WP-M · Pick list and dispense to ward' }
  - { name: SAH-80-15, description: 'WP-M · Ward returns and returns waiting' }
  - { name: SAH-80-16, description: 'WP-M · IPD charge and credit (TP-5, TP-6 ports)' }
  - { name: SAH-80-17, description: 'WP-M · Discharge clearance (information only)' }
  - { name: SAH-80-18, description: 'WP-L · Sales return (mockup 04)' }
  - { name: SAH-80-19, description: 'WP-L · Licences, role read-out, audit log (mockup 05)' }
  - { name: SAH-80-20, description: 'WP-N · Command centre (mockup 01)' }
  - { name: SAH-80-21, description: 'WP-N · Sales & compliance reports (mockup 15; report keys in pharmacy.yaml)' }
  - { name: SAH-80-22, description: 'WP-N · Close shift (NEW screen)' }
paths:
  # ================================================================ WP-I · Sale core (80-1 to 80-5)
  /document-series/bill-stores:
    get:
      tags: [SAH-80-1]
      operationId: pharmacyListStoreBillSeries
      summary: Bill series of each selling store (Numbering, row "Bill", choice "Store")
      x-required-role: SETUP_VIEW
      x-sub-story: SAH-80-1
      x-work-package: WP-I
      description: >-
        One row per ACTIVE store with saleAllowed true, plus a row per switched-off store whose series issued a
        number (kept, never reused). A store without its own series answers usesUnitSeries true and the unit BILL row
        values ("All stores (unit series)"). Small and complete (not paged). Writes nothing.
      responses:
        '200': { description: Series, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/StoreBillSeries' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /stores/{storeId}/bill-series:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    put:
      tags: [SAH-80-1]
      operationId: pharmacyPutStoreBillSeries
      summary: Give a selling store its own bill series, or change it
      x-required-role: SETUP_EDIT
      x-store-access: MASTER
      x-sub-story: SAH-80-1
      x-work-package: WP-I
      description: >-
        OWNER only. Same field rules as PUT /document-series/{docType} (prefix 1 to 6 of letters, digits, - or /;
        sequenceLength 4 to 8; rendered length at most 16; restart needs the financial-year part). The store must be
        ACTIVE with saleAllowed true and not the Central Store (400 validation field storeId "Choose a store where
        sale is allowed."). 409 prefix-in-use when the unit series or another store's series has the same prefix
        (ignoring case). 409 series-locked "Numbers have already been issued this year." once this store's series
        issued a number in the current financial year (DEC-078 item 4, which replaces the story's series-in-use).
        version 0 creates the series (from then on bills of this store take its numbers); an old version 409
        settings-changed. Audit PHARMACY_SERIES_CHANGED (store id, before and after).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreBillSeriesInput' }
            examples:
              store: { value: { version: 0, prefix: SBN/, financialYearPart: true, sequenceLength: 6, restartsEachFinancialYear: true } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/StoreBillSeries' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation; or bad-request when {storeId} is not a UUID' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 'settings-changed (with current), prefix-in-use, series-locked' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /stores/{storeId}/sale/patients:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    get:
      tags: [SAH-80-2]
      operationId: pharmacySearchSalePatients
      summary: Find a registered patient for a bill (F4; "Scan or type UHID, name or mobile")
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability sell)'
      x-sale-store: true
      x-integrated-only: true
      x-sub-story: SAH-80-2
      x-work-package: WP-I
      description: >-
        TP-1 reads the existing patient.api ports on behalf of the caller, gated by the pharmacy sell capability (a
        CASHIER mapped as Store staff included; ADR-030 S6). q 2 to 80 characters: a UHID (exact, ignoring case; a
        keyboard-style scanner types it), a 10-digit mobile (exact) or a name (contains, ignoring case). At most 20
        rows, by name; this clinic only (RLS). Rows answer name, age, sex, UHID and the masked mobile; no allergy
        here. The patient port failing answers 503 patients-unreachable "Patient records are not reachable. You can
        continue as a walk-in and link the patient later." No match: items []. The search writes nothing (the
        record-access entry is written when a patient is picked, pharmacyGetSalePatient). The search text is never
        logged.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 80 } }
      responses:
        '200': { description: Patients, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/SalePatientRow' } } } } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation; or bad-request' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 'sale-not-allowed, integration-off' }
        '503': { $ref: '#/components/responses/Unreachable', description: 'patients-unreachable or database-busy' }
  /stores/{storeId}/sale/patients/{patientId}:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/PatientId'
    get:
      tags: [SAH-80-2, SAH-80-8]
      operationId: pharmacyGetSalePatient
      summary: The patient card of the sale screen, with the allergy line and the credit line
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability sell)'
      x-sale-store: true
      x-integrated-only: true
      x-sub-story: 'SAH-80-2, SAH-80-8, SAH-80-4'
      x-work-package: WP-I
      description: >-
        "<name> · <age> <sex>", "UHID <n> · <masked mobile>", abhaLinked (null: the port gives no such fact, so the chip
        is hidden; OQ-80-28), allergy (status RECORDED with the text as recorded, NONE_RECORDED "No allergy recorded",
        NOT_CHECKED "Allergy not checked" when the clinical read fails; the text is never logged or audited) and the
        patient's pharmacy account (credit limit, due, credit-note balance; null when none). Writes one
        record-access entry (PatientAccessPort.recordOpened) in a short read-write transaction. A merged-away
        patient answers the record it was merged into. Unknown or another clinic's patient 404. The port failing
        503 patients-unreachable.
      responses:
        '200': { description: Patient card, content: { application/json: { schema: { $ref: '#/components/schemas/SalePatient' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 'sale-not-allowed, integration-off' }
        '503': { $ref: '#/components/responses/Unreachable', description: 'patients-unreachable or database-busy' }
  /stores/{storeId}/customers:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    get:
      tags: [SAH-80-2, SAH-80-4]
      operationId: pharmacySearchCustomers
      summary: The pharmacy's own customer list ("Customers"; search by name or phone)
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability sell)'
      x-sale-store: true
      x-sub-story: 'SAH-80-2, SAH-80-4'
      x-work-package: WP-I
      description: >-
        Customers are unit-wide records (any selling store reads them); the store path only runs the guard. q:
        name (contains, ignoring case) or phone (exact 10 digits). ACTIVE customers only unless includeInactive true
        (owner or pharmacist; a cashier gets them filtered out). Phone masked in the list. Paged (size at most 25).
        In both modes: in Integrated mode a patient's pharmacy account is a customer with patientId set and no
        stored name (the name is read through the patient port when shown). Writes nothing.
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 80 } }
        - { name: patientId, in: query, required: false, schema: { type: string, format: uuid }, description: 'The account of this patient (Integrated), if any.' }
        - { name: includeInactive, in: query, required: false, schema: { type: boolean, default: false } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/QueueSize'
      responses:
        '200': { description: One page, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerPage' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation; or bad-request' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: sale-not-allowed }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
    post:
      tags: [SAH-80-2, SAH-80-4]
      operationId: pharmacyCreateCustomer
      summary: Add a customer ("Save to customers", or the account of a patient for udhar)
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability sell)'
      x-sale-store: true
      x-sub-story: 'SAH-80-2, SAH-80-4'
      x-work-package: WP-I
      description: >-
        clientKey (rule 10). Either a walk-in customer (name 1 to 80 after trimming "Enter the name"; phone null or 10
        digits "Enter a 10-digit phone number"; allergyNote up to 200) or a patient account (patientId; Integrated
        only, 409 integration-off otherwise; the patient must exist, 404; one account per patient, a second create
        answers 200 with the existing account). creditLimitPaise may be set only by the OWNER or a PHARMACIST member
        (a cashier sending a non-null value 403 forbidden "Only the owner or a pharmacist can set a credit limit.").
        Phone already used by another customer and confirmSamePhone not true: 409 customer-phone-exists "A customer
        with this phone already exists. Use them?" with candidates (id, name, masked phone); confirmSamePhone true
        saves anyway (it does not block). Audit PHARMACY_CUSTOMER_CREATED (ids, whether a limit was set; never the
        name or phone). 201.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerCreate' }
            examples:
              walkIn: { value: { clientKey: 00000000-0000-4000-8000-00000000e801, patientId: null, name: Test Customer One (fake), phone: '9000000101', allergyNote: null, creditLimitPaise: 500000, confirmSamePhone: false } }
      responses:
        '201': { description: Added, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '200': { description: 'Replay of the same clientKey, or the existing account of that patient', content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation; or bad-request' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SalesConflict', description: 'sale-not-allowed, customer-phone-exists (with candidates), integration-off, client-key-reused' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /stores/{storeId}/customers/{customerId}:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [SAH-80-2, SAH-80-4]
      operationId: pharmacyGetCustomer
      summary: Customer card (name, phone, allergy note, credit)
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability sell)'
      x-sale-store: true
      x-sub-story: 'SAH-80-2, SAH-80-4'
      x-work-package: WP-I
      description: >-
        The phone is unmasked only for the OWNER and a PHARMACIST member, and only for a walk-in customer (80-2); a
        cashier sees it masked. allergyNote is shown with "Not checked by Sahaj. Shown for the pharmacist." (NEW).
        Credit: creditLimitPaise, duePaise, over60DaysPaise (owner and pharmacist only; null for others),
        creditNoteBalancePaise. A patient account answers the name and masked mobile read through the patient port
        and writes a record-access entry. Writes nothing else.
      responses:
        '200': { description: Customer, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: sale-not-allowed }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
    put:
      tags: [SAH-80-2, SAH-80-4]
      operationId: pharmacyUpdateCustomer
      summary: Change a customer (name, phone, allergy note, credit limit)
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability sell; the credit limit: OWNER or a PHARMACIST member)'
      x-sale-store: true
      x-sub-story: 'SAH-80-2, SAH-80-4'
      x-work-package: WP-I
      description: >-
        Same field rules as create; version (409 settings-changed with current). creditLimitPaise 0 or null means
        no credit; negative or not whole paise 400. A cashier sending a creditLimitPaise different from the stored
        one 403 forbidden "Only the owner or a pharmacist can set a credit limit." (the field is read-only for
        them). A limit below the current due is accepted (new udhar is then refused). A patient account carries
        no name, phone or note (400 validation on them). Audit PHARMACY_CUSTOMER_CHANGED (ids; the credit limit
        before and after; never the name, phone or note).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerUpdate' }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation; or bad-request' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SalesConflict', description: 'sale-not-allowed, settings-changed (with current), customer-phone-exists' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /stores/{storeId}/customers/{customerId}/switch-off:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/CustomerId'
    post:
      tags: [SAH-80-2]
      operationId: pharmacySwitchOffCustomer
      summary: Switch a customer off (kept with their bills and credit)
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (OWNER or a PHARMACIST member with sell)'
      x-sale-store: true
      x-sub-story: 'SAH-80-2, SAH-80-4'
      x-work-package: WP-I
      description: >-
        No body. INACTIVE: not found by the search, no new udhar (409 customer-inactive on a bill with udhar); the due
        stays and payments can still be received. Already off: 200, nothing written. A cashier 403
        store-permission-denied. Audit PHARMACY_CUSTOMER_SWITCHED_OFF (ids).
      responses:
        '200': { description: Switched off, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: sale-not-allowed }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /stores/{storeId}/customers/{customerId}/account:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [SAH-80-4]
      operationId: pharmacyGetCustomerAccount
      summary: Credit bills, payments received and credit notes with the running due
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability sell)'
      x-sale-store: true
      x-sub-story: SAH-80-4
      x-work-package: WP-I
      description: >-
        Entries newest first: CREDIT_BILL (+ due, bill number), PAYMENT (- due, mode), CANCELLED_BILL (- due, the
        udhar part of a cancelled bill), RETURN_TO_UDHAR (- due, credit note number), CREDIT_NOTE_ISSUED (+ credit-note
        balance), CREDIT_NOTE_USED (- credit-note balance, bill number), with the running due and running credit-note
        balance after each. over60DaysPaise (owner and pharmacist only): the part of the due from credit bills saved
        more than 60 days ago (IST), oldest bills paid first (FIFO; ADR-030 S5). Paged. Writes nothing.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/QueueSize'
      responses:
        '200': { description: Account, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerAccount' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation; or bad-request' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: sale-not-allowed }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /stores/{storeId}/customers/{customerId}/payments:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/CustomerId'
    post:
      tags: [SAH-80-4]
      operationId: pharmacyReceiveCustomerPayment
      summary: Receive a payment against udhar ("Receive payment")
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability sell)'
      x-sale-store: true
      x-sub-story: SAH-80-4
      x-work-package: WP-I
      description: >-
        clientKey (rule 10). amountPaise 1 or more; mode CASH, UPI or CARD (recorded only, no reference). Under the
        customer account row lock: above the due 400 validation field amountPaise "The payment is more than the
        due." The due goes down; the entry belongs to the receiving store and person (it counts in their shift,
        80-22). A switched-off customer may still pay. Answers the entry and the slip data for "Payment received"
        (browser print view; no number: ADR-030 open point O-3). Audit PHARMACY_CUSTOMER_PAYMENT (ids, amount, mode).
        201.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerPaymentInput' }
