              cash: { value: { clientKey: 00000000-0000-4000-8000-00000000e811, amountPaise: 120000, mode: CASH } }
      responses:
        '201': { description: Received, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerPaymentReceipt' } } } }
        '200': { description: Replay, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerPaymentReceipt' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation; or bad-request' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 'sale-not-allowed, client-key-reused' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /stores/{storeId}/sale/products:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    get:
      tags: [SAH-80-3]
      operationId: pharmacySaleProductSearch
      summary: POS search ("Scan barcode, or type brand / salt / composition…"), under 300 ms
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability sell)'
      x-sale-store: true
      x-sub-story: 'SAH-80-3, SAH-80-20'
      x-work-package: WP-I
      description: >-
        Exactly one of q (2 to 80 characters: name, salt, alias or code, contains, ignoring case) or barcode (exact).
        ACTIVE products of the unit (adopted and own) only; a catalogue product the unit has not adopted is never
        offered. Rows: name, strength, form, the pack text (purchase unit, issue unit, conversion), schedule chip,
        availableQty (AVAILABLE, unexpired, in this store; the store sweep of ADR-029 P4 runs first), outOfStock,
        matchedOnSalt ("Salt search" chip). At most 20 rows, in stock first, then by name. No purchase rate, landed
        cost, margin or other store's stock (80-3). An unknown barcode answers items [] (the client shows "No product
        has this barcode."). Target under 300 ms at the 95th percentile on the QA data set (ADR-030 S13). Writes
        nothing except the expiry sweep. Blind count (rule 32, 0.3.1): for a blind caller, availableQty of an
        audited product is null; the row, outOfStock and the order (in stock first) stay.
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, minLength: 2, maxLength: 80 } }
        - { name: barcode, in: query, required: false, schema: { type: string, maxLength: 40, pattern: '^[A-Za-z0-9-]{1,40}$' } }
      responses:
        '200': { description: Products, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/SaleProductRow' } } } } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation (neither or both of q and barcode); or bad-request' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: sale-not-allowed }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /stores/{storeId}/sale/quote:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    post:
      tags: [SAH-80-3, SAH-80-6, SAH-80-7, SAH-80-8, SAH-80-9, SAH-80-10]
      operationId: pharmacyQuoteSale
      summary: Price and check a cart (FEFO batches, totals, GST, checks) without saving
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability sell)'
      x-sale-store: true
      x-sub-story: 'SAH-80-3 (also 80-6 to 80-10, 80-12)'
      x-work-package: WP-I
      description: >-
        Called after every cart change. The server picks the AVAILABLE, unexpired batches by FEFO (ADR-029 P4; no
        lock, no write except the store sweep) and splits a line across batches; a quantity above all Available
        stock answers the line with shortBy and availableQty ("Only <n> in stock."); an expired earlier batch is
        named on the line ("<batch> expired · blocked"). Per line: MRP, GST %, amount, expiresInDays when 90 days or
        fewer ("Expires in <n> d"), schedule chip, and the checks: allergyBlock (Integrated, a patient picked: the
        keyword match of ADR-030 S9), h1PrescriberMissing, needsPharmacist (H, H1 or X line), needsSecondSigner (X),
        substitution and Rx marks. Summary by rule 27, with taxByRate. discount: limit read from the unit's
        SALE_DISCOUNT rule (approvalNeeded, limitPercent, limitNotSet "The discount limit is not set. Ask your
        owner.", lean); a discountRequestId sent is checked against this cart (approval APPROVED, VOID or PENDING).
        quoteVersion is a digest of the priced cart (lines, batches, MRPs, percent); the bill save sends it back.
        Writes nothing else. 400 for a malformed cart (rule 30 limits, quantity not a whole number 1 to 999999).
        Blind count (rule 32, 0.3.1): for a blind caller, shortBy and availableQty of a line of an audited product
        are null; the batches picked and their quantities (the caller's own cart) stay, so a short line is one
        whose picked quantities add up to less than the quantity asked.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartInput' }
      responses:
        '200': { description: Quote, content: { application/json: { schema: { $ref: '#/components/schemas/SaleQuote' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation; or bad-request' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound', description: 'not-found (store, or a product, patient, customer or held bill of another clinic)' }
        '409': { $ref: '#/components/responses/Conflict', description: 'sale-not-allowed, integration-off (patient or Rx parts in Standalone)' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /stores/{storeId}/bills:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    get:
      tags: [SAH-80-3, SAH-80-5]
      operationId: pharmacyListBills
      summary: Bills of this store ("Today's bills", find by number)
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability sell; or readRegisters)'
      x-sub-story: 'SAH-80-3, SAH-80-5, SAH-80-20'
      x-work-package: WP-I
      description: >-
        Filters: number (exact, ignoring case, in this store's series or the unit's), date (IST day; default today),
        status (SAVED, CANCELLED), linkPending, allergyNotChecked, refundDue. Rows: number, time, buyer label
        ("Walk-in", the customer name, or the patient name with masked mobile; a cashier sees the masked form only),
        items, net payable, status, marks (Link to patient pending, Allergy not checked, Refund due, Allergy
        override). Newest first, paged (size at most 25). Writes nothing.
      parameters:
        - { name: number, in: query, required: false, schema: { type: string, maxLength: 16 } }
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [SAVED, CANCELLED] } }
        - { name: mark, in: query, required: false, schema: { type: string, enum: [LINK_PENDING, ALLERGY_NOT_CHECKED, REFUND_DUE] } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/QueueSize'
      responses:
        '200': { description: One page, content: { application/json: { schema: { $ref: '#/components/schemas/BillPage' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation; or bad-request' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
    post:
      tags: [SAH-80-3, SAH-80-4, SAH-80-6, SAH-80-7, SAH-80-8, SAH-80-9, SAH-80-10, SAH-80-12]
      operationId: pharmacyCreateBill
      summary: Save and print a bill (F9), all or nothing, under 1 s
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability sell; sellScheduled for an H, H1 or X line)'
      x-sale-store: true
      x-sub-story: 'SAH-80-3 (with 80-4, 80-6 to 80-10, 80-12)'
      x-work-package: WP-I
      description: >-
        The sale transaction of ADR-030 S3. Before the transaction: when a line is Schedule X, the second signature
        is verified outside any transaction (ADR-029 P7; secondSigner missing 400 "A second signature is needed for
        Schedule X items."; the same person as the caller 403 second-signer-same "The second signature must be a
        different person."; not a different active pharmacist or owner 403 second-signer-invalid; PIN outcomes as
        rule 19). Then one transaction: clientKey replay (rule 10); the cart is priced again under the balance locks
        (lock order ADR-029 P5); a different quoteVersion or net 409 sale-changed "Prices or batches changed. Check
        the bill and save again." with the new quote, nothing saved; stock short 409 insufficient-stock with
        available and lines. Checks (400 validation, all together): no lines "Add at least one item."; payments not
        adding up to the net payable "Payments must add up to ₹<net>." (code payment-mismatch on field payments);
        UDHAR without a named customer or patient account, or above the limit, credit-limit-exceeded "This is above
        the credit limit. Reduce the udhar amount or ask the owner."; CREDIT_NOTE above the balance; an allergy match
        without an override allergy-blocked (Integrated: the allergy is read again at save); an H1 line without
        prescriber name and registration number and without an override h1-prescriber-missing "Prescriber name and
        registration number are needed for Schedule H1."; an H1 or X line without the prescription card
        prescription-required; an X line has no override. A cashier or the OWNER saving an H, H1 or X line 403
        pharmacist-required "A pharmacist must complete this bill." (X: "Only a pharmacist can sell a Schedule X
        medicine."); an override or a substitution by anyone but a pharmacist 403 pharmacist-required. A discount
        above the limit needs discountRequestId APPROVED for this cart: missing 409 discount-approval-needed "This
        discount needs approval.", pending or for another cart 409 discount-approval-void. A customer switched off
        409 customer-inactive (udhar only). Then: the bill number (rule 28), bill, lines, payments, ledger lines
        COUNTER_SALE (reference = bill number), customer account entries, H1 and Schedule X register rows, Rx line
        supply status (80-12), the held bill closed when heldBillId is sent, document_event rows, audit
        PHARMACY_BILL_SAVED (ids, number, counts, total; no names). Integrated with the patient port down: the
        bill is saved with linkPending true when buyer.linkPending is sent. 201 with the bill and its print data.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillCreate' }
            examples:
              walkInCash:
                value:
                  clientKey: 00000000-0000-4000-8000-00000000e901
                  quoteVersion: q-3f2a
                  expectedNetPaise: 53200
                  buyer: { kind: WALK_IN, patientId: null, customerId: null, walkInName: Test Walk-in (fake), walkInPhone: null, saveToCustomers: false, linkPending: false }
                  lines: [ { productId: 00000000-0000-4000-8000-0000000000e1, qty: 2, prescribedProductId: null, rxLineId: null, substitution: null, allergyOverride: null, h1Override: null } ]
                  discountPercent: '5'
                  discountRequestId: null
                  prescription: null
                  payments: [ { mode: CASH, amountPaise: 53200 } ]
                  heldBillId: null
                  rxId: null
                  secondSigner: null
      responses:
        '201': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Bill' } } } }
        '200': { description: Replay of the same clientKey, content: { application/json: { schema: { $ref: '#/components/schemas/Bill' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation (with the codes of the description as fieldErrors); or bad-request' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SalesForbidden', description: 'store-permission-denied, pharmacist-required, second-signer-same, second-signer-invalid, wrong-pin, pin-locked' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SalesConflict', description: 'sale-not-allowed, sale-changed (with quote), insufficient-stock, discount-approval-needed, discount-approval-void, customer-inactive, rx-claimed, changed, client-key-reused, pin-not-set' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/Problem', description: 'rate-limit, colleague-pin-limit (Schedule X signature)' }
        '503': { $ref: '#/components/responses/DatabaseBusy', description: 'database-busy, pin-unavailable, pin-check-failed' }
  /stores/{storeId}/bills/{billId}:
    parameters:
      - $ref: '#/components/parameters/StoreId'
