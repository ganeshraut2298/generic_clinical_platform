        '400': { $ref: '#/components/responses/Problem', description: 'validation; or bad-request' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 'link-already-set, changed (with current), integration-off' }
        '503': { $ref: '#/components/responses/Unreachable', description: 'patients-unreachable or database-busy' }
  /stores/{storeId}/bills/{billId}/cancel:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/BillId'
    post:
      tags: [SAH-80-5]
      operationId: pharmacyCancelBill
      summary: Cancel a saved bill (reversing ledger and register rows; the number is kept)
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability cancelBill; a PHARMACIST member only on the IST day of the bill)'
      x-sale-store: true
      x-sub-story: SAH-80-5
      x-work-package: WP-I
      description: >-
        Body: clientKey, version, reasonKey (list cancel-bill; .other needs a note of 4 to 300), backOnShelf (true:
        units to AVAILABLE; false: to QUARANTINE), secondSigner (required when a line is Schedule X; a pharmacist
        then cancels, ADR-029 P7). A pharmacist on a later day, a cashier or anyone else 403 cancel-not-allowed "Only
        the owner can cancel a bill from an earlier day." A bill with a sales return 409 has-returns; already
        cancelled 409 already-cancelled; old version 409 changed. No approval engine (DEC-074 OQ-80-13). In one
        transaction: reversing ledger lines COUNTER_SALE_CANCELLED pointing to the originals (an expired batch goes
        to QUARANTINE whatever backOnShelf says), reversing H1 and Schedule X register rows ("Cancelled"), the udhar
        part taken off the customer's due (never below zero; a credit-note payment is given back to the balance),
        refundDuePaise = the cash, UPI and card paid ("Refund due ₹<amount>"), status CANCELLED with who, when and the
        reason. Audit PHARMACY_BILL_CANCELLED (ids, reason key, refund due).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelBillInput' }
      responses:
        '200': { description: Cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/Bill' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation; or bad-request' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SalesForbidden', description: 'store-permission-denied, cancel-not-allowed, pharmacist-required (Schedule X), second-signer-same, second-signer-invalid, PIN problems' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SalesConflict', description: 'sale-not-allowed, has-returns, already-cancelled, changed (with current), client-key-reused' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /stores/{storeId}/bills/{billId}/refund:
