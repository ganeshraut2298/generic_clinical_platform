      description: 'Body version, reasonKey (list rx-closed), note. PART_SUPPLIED (or NEW with nothing supplied) becomes CLOSED and leaves the queue; no timer closes it (OQ-80-24b). Also counts for the Integration-mode guard (a Part supplied prescription blocks the switch to Standalone until closed or supplied). Audit PHARMACY_RX_CLOSED (ids, reason key).'
      requestBody:
        required: true
