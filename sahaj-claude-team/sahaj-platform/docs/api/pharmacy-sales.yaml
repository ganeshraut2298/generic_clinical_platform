        '403': { $ref: '#/components/responses/SalesForbidden', description: 'store-permission-denied, pharmacist-required' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: sale-not-allowed }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
