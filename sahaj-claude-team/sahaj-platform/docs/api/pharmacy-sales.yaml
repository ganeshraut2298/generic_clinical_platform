        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound', description: 'not-found (store or product)' }
        '409': { $ref: '#/components/responses/Conflict', description: 'integration-off, settings-changed (with current), product-withdrawn' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  # ================================================================ WP-L · Sales return and compliance (80-18, 80-19)
  /stores/{storeId}/sales-returns/bills:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    get:
      tags: [SAH-80-18]
      operationId: pharmacyFindReturnableBills
      summary: Find the bill to return against ("Type the bill number, or scan it"; or by customer)
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability salesReturn)'
      x-sale-store: true
      x-sub-story: SAH-80-18
      x-work-package: WP-L
      description: >-
        Exactly one of number (exact, ignoring case, in this store's series or the unit's; a keyboard-style scanner)
        or customer (name contains or 10-digit phone; NEW, OQ-80-12): the store's bills of that customer in the last
        returnWindowDays days. The unit's return window not set: 409 return-window-not-set "Return window is not set.
        Ask your owner." No match: items [] ("No bill found. Check the number."). Rows: bill number, date, buyer
        label, total, window state. At most 25. Writes nothing.
      parameters:
        - { name: number, in: query, required: false, schema: { type: string, maxLength: 16 } }
        - { name: customer, in: query, required: false, schema: { type: string, minLength: 2, maxLength: 80 } }
      responses:
        '200': { description: Bills, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, maxItems: 25, items: { $ref: '#/components/schemas/ReturnableBillRow' } } } } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation; or bad-request' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 'sale-not-allowed, return-window-not-set' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /stores/{storeId}/sales-returns/bills/{billId}:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/BillId'
    get:
      tags: [SAH-80-18]
      operationId: pharmacyGetReturnableBill
      summary: The bill card and its return lines (Sold, Already returned, Allowed?, refund per unit)
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability salesReturn)'
      x-sale-store: true
      x-sub-story: SAH-80-18
      x-work-package: WP-L
      description: >-
        "<customer or patient> · bill of <date> · ₹<total>", window chip WITHIN ("Within <n>-day return window") or
        OVER ("Return window is over"; nothing can be returned and nobody can override it), cancelled ("This bill was
        cancelled."). Lines (one per batch): item and batch, sold, already returned (completed and waiting returns),
        returnable (false: "Not returnable", the product's returnable flag), refund for the remaining units worked
        from the line's net amount (rule 27; the bill's round off is not refunded, ADR-030 S5), schedule. refundModes:
        the unit's allowed modes, ORIGINAL_MODE expanded into the bill's own modes with the amount each paid;
        CREDIT_NOTE and UDHAR only with a named customer. limit: the SALES_RETURN rule's amount ("Returns above ₹
        <limit> need approval."; null when level 0 or the rule has no amount). Writes a record-access entry for a
        registered patient.
      responses:
        '200': { description: Bill for return, content: { application/json: { schema: { $ref: '#/components/schemas/ReturnableBill' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 'sale-not-allowed, return-window-not-set' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /stores/{storeId}/sales-returns:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    get:
      tags: [SAH-80-18, SAH-80-15]
      operationId: pharmacyListSalesReturns
      summary: Sales returns of this store (also the "Waiting for the pharmacist" list in Standalone)
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability salesReturn)'
      x-sale-store: true
      x-sub-story: 'SAH-80-18, SAH-80-15'
      x-work-package: WP-L
      description: 'Filter status (WAITING_PHARMACIST, WAITING_APPROVAL, APPROVED, COMPLETED, REJECTED). A CASHIER sees the returns they started; others every return of the store. Rows: credit note number (when completed), bill number, date, buyer label, refund total, status, started by. Newest first, 25 a page. Writes nothing.'
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/SalesReturnStatus' } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/QueueSize'
      responses:
        '200': { description: One page, content: { application/json: { schema: { $ref: '#/components/schemas/SalesReturnPage' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation; or bad-request' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: sale-not-allowed }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
    post:
      tags: [SAH-80-18]
      operationId: pharmacyCreateSalesReturn
      summary: Return against the original bill and batch ("Refund ₹<amount> & print credit note" or "Send for approval")
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability salesReturn)'
      x-sale-store: true
      x-sub-story: SAH-80-18
      x-work-package: WP-L
      description: >-
        Body: clientKey, billId, lines (billLineId, qty 1 or more, conditionKey from return-condition), reasonKey (list
        sales-return), note, refunds (mode and amount), secondSigner (Schedule X lines). Checks (400 validation, all
        together): window not set 409 return-window-not-set; window over 409 return-window-over; bill cancelled 409
        return-state; qty above sold minus already returned "You can return at most <n>."; a product not returnable
        "Not returnable"; a refund mode the unit does not allow, an amount per mode above what that mode paid,
        CREDIT_NOTE or UDHAR without a named customer, UDHAR above the due; refunds not adding up to the refund total
        payment-mismatch. A Schedule X line needs a pharmacist and the second signature (ADR-029 P7; a cashier's
        return waits). Outcome (DEC-074 OQ-80-12 c; ADR-030 S5): (1) caller a CASHIER, or any line Damaged or Strip cut
        or opened while the caller is not a pharmacist, HOD or owner: status WAITING_PHARMACIST ("Waiting for the
        pharmacist"), nothing moves, no money; (2) otherwise, refund total above the SALES_RETURN rule's amount:
        submitted to the engine (rule store = this store, amount = refund total), status WAITING_APPROVAL, nothing
        moves; (3) otherwise COMPLETED at once. A cashier's return above the limit is submitted to the engine when
        the pharmacist accepts the goods (raiser = the starter). Completing writes, in one transaction: ledger lines
        SALES_RETURN (reference = credit note number; Sealed to AVAILABLE, doubtful to QUARANTINE, an expired batch to
        QUARANTINE), the CREDIT_NOTE number (rule 28), the refund rows (they count in the shift of the person who
        completes it), the customer account entries (RETURN_TO_UDHAR, CREDIT_NOTE_ISSUED), H1 and Schedule X
        reversing rows ("Returned"), returnedQty on the bill lines. Two returns of the same line at once: the second
        409 changed with the remaining quantity. Audit PHARMACY_SALES_RETURN (bill id, credit note number, counts,
        outcome; never a name). 201.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalesReturnCreate' }
      responses:
        '201': { description: Saved (completed or waiting), content: { application/json: { schema: { $ref: '#/components/schemas/SalesReturn' } } } }
        '200': { description: Replay, content: { application/json: { schema: { $ref: '#/components/schemas/SalesReturn' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation, payment-mismatch; or bad-request' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SalesForbidden', description: 'store-permission-denied, pharmacist-required (Schedule X), second-signer-same, second-signer-invalid, PIN problems' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SalesConflict', description: 'sale-not-allowed, return-window-not-set, return-window-over, return-state, changed, insufficient-stock (never for a return; listed for the posting service), client-key-reused' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
  /stores/{storeId}/sales-returns/{returnId}:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/ReturnId'
