      tags: [SAH-80-11, SAH-80-12]
      operationId: pharmacyGetOpdPrescription
      summary: One prescription with its lines, mapping, stock, pick state and checks ("View prescription")
      x-required-role: PHARMACY_ACCESS
      x-store-access: 'OPERATION (capability sell)'
