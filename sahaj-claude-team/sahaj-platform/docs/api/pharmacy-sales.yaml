        '409': { $ref: '#/components/responses/SalesConflict', description: 'sale-not-allowed, integration-off, not-connected (TP-4), order-changed, changed, insufficient-stock, ipd-bill-closed, client-key-reused' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
