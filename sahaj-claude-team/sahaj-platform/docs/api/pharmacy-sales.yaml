      responses:
        '200': { description: Refund recorded, content: { application/json: { schema: { $ref: '#/components/schemas/Bill' } } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation; or bad-request' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 'sale-not-allowed, not-cancelled, refund-already-recorded, changed (with current), client-key-reused' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/DatabaseBusy' }
