      x-sale-store: true
      x-sub-story: SAH-80-5
      x-work-package: WP-I
      description: >-
        Every OPEN held bill of the store (any holder; a pharmacist takes over a cashier's scheduled cart): holder,
        time, item count, age in minutes, buyer label (masked name or "Walk-in"), discount request state. At most 20
