  /stores/{storeId}/opd-queue/{rxId}/claim:
    parameters:
      - $ref: '#/components/parameters/StoreId'
      - $ref: '#/components/parameters/RxId'
    post:
      tags: [SAH-80-12]
      operationId: pharmacyClaimOpdPrescription
