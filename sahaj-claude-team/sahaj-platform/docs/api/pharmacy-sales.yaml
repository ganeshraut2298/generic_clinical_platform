        Body: clientKey, version, refunds (mode among the unit's refund modes; ORIGINAL_MODE means the bill's own
        modes; the amount per mode at most what that mode paid; CREDIT_NOTE needs a named customer). The refunds
        must add up to refundDuePaise (400 payment-mismatch "Refunds must add up to ₹<amount>."). Not cancelled 409
        not-cancelled; already settled 409 refund-already-recorded. Takes a CREDIT_NOTE number (rule 28), records
        the refund rows (they count in the person's shift, 80-22) and a CREDIT_NOTE_ISSUED account entry when the
